name: Sphinx exact shared receiving original banks

on:
  push:
    branches: [lab/sphinx-shared-receiving-qualification-20260926]

permissions:
  contents: read

jobs:
  original-deterministic-banks:
    if: ${{ github.event.before == '0000000000000000000000000000000000000000' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: a0c5b995c2829c0b4069562b1f1eede8a820dd97
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Execute original deterministic receiving banks on exact immutable source
        run: python3 control/sphinx-receiving-qualification.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sphinx-shared-receiving-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 90

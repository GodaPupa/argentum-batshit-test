name: Izzet original factory artifact readback
on:
  push:
    branches: [lab/izzet-factory-artifact-readback-20260927]
permissions:
  contents: read
  actions: read
jobs:
  exact-original-readback:
    if: ${{ github.event.before == '0000000000000000000000000000000000000000' && github.event.created == true && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout only the isolated readback controls
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Read and relay the exact existing public artifact without execution
        env:
          READBACK_TOKEN: ${{ github.token }}
        run: /usr/bin/timeout --signal=KILL 300s python3 -I readback.py

name: Pest Control Tier-1 Faerie Macabre Support

on:
  push:
    branches:
      - pest-control/tier1-postboard-support-faerie-macabre
    paths:
      - .github/workflows/pest-control-tier-one-postboard-faerie-macabre.yml
      - "**/FaerieMacabre.kt"
      - "**/FaerieMacabreScenarioTest.kt"
      - "**/AcornHarvest.kt"

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pest-control/tier1-postboard-support-faerie-macabre
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Regenerate exact SHM snapshot
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true

      - name: Fail closed on unrelated snapshot drift
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "mtg-sets/src/test/resources/snapshots/cards/SHM.json"
          git diff --check

      - name: Qualify exact Faerie Macabre behavior
        run: ./gradlew :mtg-sets:2008-2016:tests:test --tests "*FaerieMacabreScenarioTest"

      - name: Diagnose facade-boundary violations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          patterns = [
              (re.compile(r"\bCompositeEffect\s*\("), "CompositeEffect"),
              (re.compile(r"\bMoveToZoneEffect\s*\("), "MoveToZoneEffect"),
              (re.compile(r"\bForEachInGroupEffect\s*\("), "ForEachInGroupEffect"),
              (re.compile(r"\bAdditionalCost\.[A-Z]"), "AdditionalCost"),
              (re.compile(r"\bPayCost\.[A-Z]"), "PayCost"),
              (re.compile(r"(?<!Conditions\.)\bEntityMatches\s*\("), "EntityMatches"),
          ]
          violations = []
          for path in Path("mtg-sets").glob("*/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/**/*.kt"):
              lines = path.read_text().splitlines()
              in_block = False
              for number, raw in enumerate(lines, 1):
                  if raw.lstrip().startswith("import "):
                      continue
                  out = []
                  i = 0
                  while i < len(raw):
                      if in_block:
                          if raw[i:i+2] == "*/":
                              in_block = False
                              i += 2
                          else:
                              i += 1
                      elif raw[i:i+2] == "/*":
                          in_block = True
                          i += 2
                      elif raw[i:i+2] == "//":
                          break
                      else:
                          out.append(raw[i])
                          i += 1
                  line = "".join(out)
                  for regex, label in patterns:
                      if regex.search(line):
                          violations.append(f"{path}:{number}: {label}: {line.strip()}")
          print("FACADE_BOUNDARY_DIAGNOSTIC count=", len(violations))
          for violation in violations:
              print("FACADE_BOUNDARY_DIAGNOSTIC", violation)
          PY

      - name: Qualify card lint and facade boundary
        run: ./gradlew :mtg-sets:test --tests "*CardLintTest" --tests "*FacadeBoundaryTest"

      - name: Commit exact generated SHM bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtg-sets/src/test/resources/snapshots/cards/SHM.json
          git commit -m "Synchronize Faerie Macabre snapshot"
          git push origin HEAD:pest-control/tier1-postboard-support-faerie-macabre

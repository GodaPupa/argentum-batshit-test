name: Izzet Position-1 Frantic Search mechanics batch
on:
  push:
    branches: ["izzet/position1-frantic-search-batch-20260929"]
    paths: [".github/workflows/izzet-position1-frantic-search-batch.yml"]
permissions: {contents: read}
jobs:
  three-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact Frantic Search source fixture budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/izzet-position1-frantic-search
          test "$(git rev-parse HEAD^)" = "22eec40f93ba8da82b0678bc8ee8af0f8116984f"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ulg/cards/FranticSearch.kt)" = "6c3ad836867f9789894e5da5aeb35ab6d0dbc906"
          test "$(git hash-object mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/IzzetPosition1FranticSearchScenarioTest.kt)" = "46fa3c80e3ca7abb03841ce749192e5727b369d9"
          test "$(git hash-object experiments/izzet-science/position1-frantic-search-mechanics-budget-20260929.json)" = "ed0a88a7341ad003079b7e6e7b5c7fd9b7d6b99c"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ulg/cards/FranticSearch.kt; git hash-object mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/IzzetPosition1FranticSearchScenarioTest.kt; git hash-object experiments/izzet-science/position1-frantic-search-mechanics-budget-20260929.json; git hash-object .github/workflows/izzet-position1-frantic-search-batch.yml; git status --porcelain; } > build/reports/izzet-position1-frantic-search/source.txt
      - name: Run three fresh Frantic Search mechanics cases
        shell: bash
        run: |
          set -o pipefail
          just test-class IzzetPosition1FranticSearchScenarioTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-position1-frantic-search/test.log
      - name: Preserve XML
        if: always()
        shell: bash
        run: |
          find . -path '*/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.IzzetPosition1FranticSearchScenarioTest.xml' -type f -print -exec cp {} build/reports/izzet-position1-frantic-search/ \; || true
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-position1-frantic-search-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-position1-frantic-search/
          if-no-files-found: error
          retention-days: 90

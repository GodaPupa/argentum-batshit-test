name: Isolated parent JVM observer software qualification

on:
  push:
    branches: [lab/parent-jvm-observer-qualification-20260927]

permissions:
  contents: read

jobs:
  qualify-observer:
    if: ${{ github.event.before == '0000000000000000000000000000000000000000' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact isolated reviewed control
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up qualification Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Set up qualification JDK21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Run exactly21 software cases and one actual-parent probe
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: python3 tools/qualify_parent_jvm_observer.py
      - name: Preserve original observations, failures and control binding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parent-jvm-observer-original-attempt-${{ github.run_attempt }}
          path: |
            observer-qualification-original.zip
            observer-qualification-archive.json
            observer-qualification-archive-error.json
          if-no-files-found: error
          retention-days: 30

name: Shared Opal Palace compatibility qualification
on:
  push:
    branches: ["validation/shared-opal-compatibility-20261001"]
    paths: [".github/workflows/shared-opal-compatibility-20261001.yml"]
permissions: {contents: read}
jobs:
  opal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: catthehacker/ubuntu@sha256:7d51b26b65f00d97063cbda95699ee2aee2d4a7362f545ac29a4a18aaba7cfb3
      options: --platform linux/amd64
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64
      GRADLE_USER_HOME: /tmp/shared-opal-${{ github.run_id }}
      EVIDENCE: /tmp/shared-opal-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: 87e2cab93c9d1652deca3e19cbad1d1ef49be93c, fetch-depth: 1, persist-credentials: false}
      - name: Bind exact shared compatibility bytes
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = 87e2cab93c9d1652deca3e19cbad1d1ef49be93c
          test ! -e "$EVIDENCE" && mkdir "$EVIDENCE"
          git rev-parse HEAD HEAD^{tree} > "$EVIDENCE/source.txt"
          for spec in             "mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/ManaSpellRider.kt 5c6c1d4e8374a5375f79643a6e282fb728ab23b6"             "rules-engine/src/main/kotlin/com/wingedsheep/engine/state/components/stack/StackComponents.kt a3526220f4b7f172ad8270d01da77a10dacfc158"             "rules-engine/src/main/kotlin/com/wingedsheep/engine/core/Serialization.kt 7cb03c944411532f8ecdeccff470129260a2aa01"             "rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/spell/CastSpellHandler.kt c005200da84155b33f64a32de22833717cf4ccbf"             "rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/ZoneTransitionService.kt 5d3a49519e39402aed6bc4f6991b92e96cd13f18"             "rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt abf5991587509e2c6199eff8b53bd46775c5690f"             "mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c13/cards/OpalPalace.kt 544a440160528f4a08211109936a55e263c39d19"             "mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/OpalPalaceScenarioTest.kt 5b1be3a666cc615d8a274419479f1a885df9968c"
          do set -- $spec; test "$(git hash-object "$1")" = "$2"; done
      - name: Compile affected modules and prospective Swan Song test source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :mtg-sdk:compileKotlin             :rules-engine:compileKotlin             :mtg-sets:2008-2016:tests:compileTestKotlin 2>&1 | tee "$EVIDENCE/compile.log"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ths/cards/SwanSong.kt)" = "385ab04b2d05e7f8d160f156746cb4b69b4fbee9"
          test "$(git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/SwanSongScenarioTest.kt)" = "34e5f47d835610f30ff45628afe98a6fcdc158bc"
          printf '%s\n' 'SWAN_SONG_COMPILED_NOT_EXECUTED' > "$EVIDENCE/swan-song-status.txt"
      - name: Execute exact full Opal Palace mechanics suite
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain --info             :mtg-sets:2008-2016:tests:test --tests com.wingedsheep.engine.scenarios.OpalPalaceScenarioTest 2>&1 | tee "$EVIDENCE/opal-tests.log"
          cp mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.OpalPalaceScenarioTest.xml "$EVIDENCE/"
          /usr/bin/python3 -I -S - <<'PY'
          import os,pathlib,xml.etree.ElementTree as ET
          e=pathlib.Path(os.environ['EVIDENCE'])
          r=ET.parse(e/'TEST-com.wingedsheep.engine.scenarios.OpalPalaceScenarioTest.xml').getroot()
          assert r.attrib['name']=='com.wingedsheep.engine.scenarios.OpalPalaceScenarioTest'
          assert int(r.attrib['tests'])==10
          assert all(int(r.attrib[k])==0 for k in ('failures','errors','skipped'))
          assert len(list(r.iter('testcase')))==10
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-opal-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: warn
          retention-days: 90

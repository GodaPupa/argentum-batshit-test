name: Industrial R1 expanded JVM class-set static preflight
on:
  push:
    branches: ["industrial-waste/r1-launcher-source-pins-20260927"]
    paths:
      - ".github/workflows/industrial-r1-class-set-preflight.yml"
permissions:
  contents: read
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact prospective fixture and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/industrial-r1-class-set-preflight
          test "$(git rev-parse HEAD^)" = "037f366d22f471f8fcee29a246b38595e8644408"
          test "$(git hash-object ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2R1ClassSetCaptureTest.kt)" = "de42ad390186493ed249416d156936ea6b7e97cc"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2R1ClassSetCaptureTest.kt; git hash-object .github/workflows/industrial-r1-class-set-preflight.yml; git status --porcelain; } > build/reports/industrial-r1-class-set-preflight/source.txt
      - name: Compile only; no behavioral execution
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :ai:compileTestKotlin --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/industrial-r1-class-set-preflight/compile.log
          test -f ai/build/classes/kotlin/test/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2R1ClassSetCaptureTest.class
          test ! -e ai/build/test-results/test/TEST-com.wingedsheep.ai.industrialwaste.IndustrialWasteV2R1ClassSetCaptureTest.xml
      - name: Upload original static evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-r1-class-set-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/industrial-r1-class-set-preflight/
          if-no-files-found: error
          retention-days: 90

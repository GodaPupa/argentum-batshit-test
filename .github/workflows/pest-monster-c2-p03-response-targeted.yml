name: Pest Monster P03 response receiving
on:
  push:
    branches: ["pest/c2-pair-pilot-seam-20260927"]
    paths:
      - ".github/workflows/pest-monster-c2-p03-response-targeted.yml"
      - "gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterPriorityResponseReceivingTest.kt"
      - "gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterOpposingSacrificeReceivingTest.kt"

permissions:
  contents: read

jobs:
  prospective-response-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact test source
        run: |
          mkdir -p build/reports/pest-c2-p03-response
          {
            git rev-parse HEAD
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterPriorityResponseReceivingTest.kt
            git status --porcelain
          } > build/reports/pest-c2-p03-response/source.txt
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterPriorityResponseReceivingTest.kt)" = "3faf6a54fa5468824d51243de580106b78f2a6a9"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterOpposingSacrificeReceivingTest.kt)" = "9f8cc16a624d45fe81c32e6be9b4e5b84b950458"
      - name: Execute fresh two-seat response fixtures
        shell: bash
        run: |
          set -o pipefail
          scripts/test-class PestMonsterPriorityResponseReceivingTest --rerun-tasks --info --stacktrace 2>&1 | tee build/reports/pest-c2-p03-response/gradle.log
      - name: Verify exact JUnit cases
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          paths=glob.glob("gym/build/test-results/test/TEST-*PestMonsterPriorityResponseReceivingTest.xml")
          assert len(paths)==1, paths
          root=ET.parse(paths[0]).getroot()
          cases=root.findall(".//testcase")
          assert sorted(c.get("name") for c in cases)==[
              "P03-02 Monster seat 1 passes Crop stack to Pest Weather response",
              "P03-02 Monster seat 2 passes Crop stack to Pest Weather response",
          ], [c.get("name") for c in cases]
          assert not root.findall(".//failure") and not root.findall(".//error") and not root.findall(".//skipped")
          PY
      - name: Retain original result and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-c2-p03-response-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/pest-c2-p03-response/
            gym/build/test-results/test/TEST-*PestMonsterPriorityResponseReceivingTest.xml
          if-no-files-found: error
          retention-days: 90

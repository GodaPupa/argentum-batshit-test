name: Pest Control Tier-1 Monster Tron Operational Stack Validation

on:
  pull_request:
    paths:
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonsterTronOperationalStack.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonsterTronOperationalStackTest.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonsterTronFailureEvidenceTest.kt
      - ai/src/main/kotlin/com/wingedsheep/ai/engine/PestMonsterTronPolicy.kt
      - ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/modules/PestMonsterTronAdvisorModule.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/arena/PestMonsterTronPolicyAuditTest.kt
      - docs/experiments/pest-control/tier-one-monster-tron-operational-stack.md
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonsterTronOfficialArtifactValidationTest.kt
      - docs/experiments/pest-control/tier-one-qualification-stopping-rule.md
      - docs/experiments/pest-control/tier-one-spy-combo-admission.md
      - .github/workflows/pest-control-tier-one-monster-tron-operational-stack.yml

permissions:
  actions: read
  contents: read

env:
  FREEZE_ARTIFACT_ID: "10836436268"
  FREEZE_ARTIFACT_SHA256: 70b9a665fbb154342e2789c1b6b2c2fd912579431a6ae1f9ab289984d5e7801c

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate synthetic operational stack
        run: scripts/test-class PestControlTierOneMonsterTronOperationalStackTest --info --stacktrace

      - name: Validate durable failures and actual production pilot seats
        run: scripts/test-class PestControlTierOneMonsterTronFailureEvidenceTest --info --stacktrace

      - name: Requalify the production Monster Tron policy
        run: scripts/test-class PestMonsterTronPolicyAuditTest --info --stacktrace

      - name: Download exact frozen Monster Tron vector read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/pest-monster-tron-validation
          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FREEZE_ARTIFACT_ID}/zip"             -o build/pest-monster-tron-validation/freeze.zip
          echo "${FREEZE_ARTIFACT_SHA256}  build/pest-monster-tron-validation/freeze.zip" | sha256sum -c -

      - name: Validate official bytes without initialization or gameplay
        env:
          PEST_MONSTER_TRON_EXECUTION_INPUT_ACK: LOAD_FROZEN_TIER_ONE_MONSTER_TRON_4_FOR_VALIDATION_ONLY
          PEST_MONSTER_TRON_EXECUTION_INPUT_ZIP: ${{ github.workspace }}/build/pest-monster-tron-validation/freeze.zip
        run: scripts/test-class PestControlTierOneMonsterTronOfficialArtifactValidationTest --info --stacktrace

      - name: Assert no official execution surface exists in this workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path(".github/workflows/pest-control-tier-one-monster-tron-operational-stack.yml").read_text()
          assert ("workflow" + "_dispatch") not in text
          assert "\n  push:" not in text
          assert ("AUTOMATIC_ONE_SHOT_" + "MONSTER_TRON_EXECUTION") not in text
          assert ("OfficialExecution" + "RunnerTest") not in text
          PY

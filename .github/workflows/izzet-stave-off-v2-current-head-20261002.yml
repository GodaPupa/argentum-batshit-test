name: Izzet Stave Off current-head exact validation v2
on:
  pull_request:
    branches: ["izzet/position1-owlbear-qualification-freeze-20260930"]
    paths: [".github/workflows/izzet-stave-off-v2-current-head-20261002.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_USER_HOME: /tmp/izzet-stave-v2-${{ github.run_id }}
      OUT: /tmp/izzet-stave-v2-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind exact clean current-head adoption
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "7d420712f07b731c27eef09e2bb5de330004675a"
          test "$(git rev-parse HEAD^^)" = "30717edd029e6a0cb0ecffd887dfc253542adbc5"
          test "$(git rev-parse HEAD^^^)" = "7e691db5ece690602e904147bf02a0d82f3a1047"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m12/cards/StaveOff.kt)" = "81346393e07564616ddd364b7ecf7c6b7c296f2a"
          test "$(git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/StaveOffBatchAHScenarioTest.kt)" = "4f5c13a004bda9c4628c7c4a27305a7890379d1a"
          test ! -e mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/csp/cards/Skred.kt
          test ! -e mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/SkredScenarioTest.kt
          mkdir "$OUT"
          git rev-parse HEAD HEAD^{tree} HEAD^ HEAD^^ HEAD^^^ > "$OUT/source.txt"
          git diff --name-status 7e691db5ece690602e904147bf02a0d82f3a1047 HEAD^ > "$OUT/source-delta.txt"
          test "$(wc -l < "$OUT/source-delta.txt" | tr -d ' ')" = "2"
          printf '%s\n' 'AUTHOR_VALIDATION_ONLY_NO_GAMEPLAY_AUTHORITY' > "$OUT/authority.txt"
          printf '%s\n' 'allocations=0 claims=0 games=0 outcomes=0' > "$OUT/official-counters.txt"
      - name: Compile exact affected shards
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:2008-2016:tests:compileTestKotlin :gym:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
      - name: Run exact Stave Off scenario
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:2008-2016:tests:test --tests com.wingedsheep.engine.scenarios.StaveOffBatchAHScenarioTest 2>&1 | tee "$OUT/stave.log"
          XML=mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.StaveOffBatchAHScenarioTest.xml
          test -f "$XML"
          cp "$XML" "$OUT/"
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          root=ET.parse(os.path.join(os.environ["OUT"],"TEST-com.wingedsheep.engine.scenarios.StaveOffBatchAHScenarioTest.xml")).getroot()
          assert int(root.attrib["tests"]) == 1
          assert int(root.attrib["failures"]) == 0
          assert int(root.attrib["errors"]) == 0
          assert int(root.attrib["skipped"]) == 0
          PY
      - name: Confirm exact Position-1 zero-seed registry inventory
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :gym:test --tests com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest 2>&1 | tee "$OUT/registry.log"
          rc=${PIPESTATUS[0]}
          set -e
          XML=gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml
          test -f "$XML"
          cp "$XML" "$OUT/"
          REGISTRY_RC="$rc" python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ["OUT"])
          root=ET.parse(out/"TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml").getroot()
          assert int(root.attrib["tests"]) == 55
          suffix=" is registered in current runtime"
          registered=[]; missing=[]
          for case in root.iter("testcase"):
              name=case.attrib["name"]
              card=name[:-len(suffix)] if name.endswith(suffix) else name
              (registered if case.find("failure") is None and case.find("error") is None else missing).append(card)
          assert "Stave Off" in registered
          assert "Skred" in missing
          assert len(registered) == 33, (len(registered), registered)
          assert len(missing) == 22, (len(missing), missing)
          (out/"registry-summary.json").write_text(json.dumps({
            "schema":"izzet-stave-off-v2-current-head-validation-v1",
            "authority":"AUTHOR_VALIDATION_ONLY_NOT_INDEPENDENT_REVIEW_OR_GAMEPLAY_ADMISSION",
            "published_source_head":"7d420712f07b731c27eef09e2bb5de330004675a",
            "clean_parent":"7e691db5ece690602e904147bf02a0d82f3a1047",
            "registered_count":len(registered),
            "missing_count":len(missing),
            "registered":sorted(registered),
            "missing":sorted(missing),
            "stave_off_registered":True,
            "skred_registered":False,
            "gradle_exit_code":int(os.environ["REGISTRY_RC"]),
            "official_counters_delta":{"allocations":0,"claims":0,"games":0,"outcomes":0}
          },sort_keys=True,indent=2)+"\n")
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-stave-off-v2-current-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

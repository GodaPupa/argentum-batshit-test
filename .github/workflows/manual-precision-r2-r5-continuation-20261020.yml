name: Manual Precision R2 actual R5 turn-one continuation (NO GAMES)
on:
  push:
    branches: [research/manual-precision-r2-r5-continuation-20261020]
    paths:
      - '.github/workflows/manual-precision-r2-r5-continuation-20261020.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: manual-precision-r2-continuation
  cancel-in-progress: false
jobs:
  r5-turn-one:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R2_PRIMARY_OUTPUT: ${{ github.workspace }}/r2-original-primary
      MANUAL_R2_CONTINUATION_OUTPUT: ${{ github.workspace }}/r2-continuation-output
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 24}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Pin original R2 source, isolated test and unchanged frozen policies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r2-continuation-output
          git rev-parse HEAD > r2-continuation-output/source-sha.txt
          git rev-parse HEAD^{tree} > r2-continuation-output/source-tree-sha.txt
          test "$GITHUB_REF" = "refs/heads/research/manual-precision-r2-r5-continuation-20261020"
          test "$(git rev-parse HEAD^)" = "e2129da3704f1521484eb6dc03851ce86a302a20"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/manual-precision-r2-r5-continuation-20261020.yml"
          git merge-base --is-ancestor 37e5cdd9b550a3b42c1c93f5c1d73b2751955822 HEAD
          test "$(git diff --name-only 37e5cdd9b550a3b42c1c93f5c1d73b2751955822 HEAD | wc -l)" -eq 2
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          echo ZERO_NEW_FULL_GAMES > r2-continuation-output/game-budget.txt
          chmod +x gradlew scripts/gradle-locked
      - name: Verify original exact-state R2 microfork authority
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/GodaPupa/argentum-batshit-test/actions/runs/39481840733 > r2-continuation-output/primary-run.json
          jq -e '.status == "completed" and .conclusion == "success" and .head_sha == "37e5cdd9b550a3b42c1c93f5c1d73b2751955822"' r2-continuation-output/primary-run.json >/dev/null
          gh api /repos/GodaPupa/argentum-batshit-test/actions/runs/39481840733/artifacts > r2-continuation-output/primary-artifacts.json
          jq -e '[.artifacts[] | select(.id == 12291623583 and .name == "manual-precision-r2-shock-microfork-39481840733" and .expired == false and .digest == "sha256:901efcd0f81a0f98aa0fddd52b27b885108bbfe1ac99b092e28fa32b9844d91f")] | length == 1' r2-continuation-output/primary-artifacts.json >/dev/null
      - name: Download real-engine exact YES/NO original states
        uses: actions/download-artifact@v4
        with:
          repository: GodaPupa/argentum-batshit-test
          run-id: 39481840733
          name: manual-precision-r2-shock-microfork-39481840733
          github-token: ${{ github.token }}
          path: r2-original-primary
      - name: Assert byte-for-byte actual R2 fork states
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum r2-original-primary/r2-shock-output/state-before-r0.json | cut -d' ' -f1)" = "0df555d80bc0a4eab24577dd4cb6de0424564643597d2bd64379c9bde23014d0"
          test "$(sha256sum r2-original-primary/r2-shock-output/state-after-yes.json | cut -d' ' -f1)" = "7e8373fd825b1f50c09158d25b45621152548ff8743c68ca604df13332366031"
          test "$(sha256sum r2-original-primary/r2-shock-output/state-after-no.json | cut -d' ' -f1)" = "552cd7d26bf9965077d5ea8b0e502301d07fd171bbd99bbc745fe9ce0b25afd5"
          echo "ORIGINAL_R2_FORK_STATES_HASH_VERIFIED" > r2-continuation-output/state-hashes.txt
      - name: Inspect actual R5 next action and evaluator scores without gameplay
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualPrecisionR2R5ContinuationTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r2-continuation-output/r5-continuation.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("r2-continuation-output/r2-continuation.json").read_text())
          assert j["status"] == "R2_EXACT_R5_CONTINUATION_DIAGNOSTIC"
          assert j["noLife"] == 40 and j["yesLife"] == 38
          assert j["fullGames"] == 0 and j["policyChanges"] == 0
          assert j["yesChosenActionEngineAccepted"]
          print("R2_R5_NEXT_ACTION_DIAGNOSTIC_COMPLETED")
          PY
      - name: Preserve result and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-precision-r2-r5-continuation-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            r2-continuation-output/
            ai/build/test-results/test/

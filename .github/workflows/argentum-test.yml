name: Argentum Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  izzet-v09-capsize-paired:
    if: github.ref == 'refs/heads/mayhem/izzet-science'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout frozen experimental source
        uses: actions/checkout@v4
        with:
          ref: 2035adc350368f8eeec87a2f960ea05c40763fb8

      - name: Verify frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2035adc350368f8eeec87a2f960ea05c40763fb8"
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          test "$(sha256sum izzet-science/sim/run_v09_capsize_paired_pilot.py | cut -d' ' -f1)" = "1dce15e3555f937964ae571140ca43e763f52747af56c2be71d53a7b7bcebb36"

      - name: Run complete seed-free preflight
        run: |
          python3 izzet-science/sim/validate_v09_capsize_paired_execution.py
          python3 izzet-science/sim/validate_paired_capsize_contract.py
          python3 izzet-science/sim/validate_paired_rng_isolation.py
          python3 izzet-science/sim/validate_capsize_tutor_instrumentation.py
          python3 izzet-science/sim/validate_capsize_tutor_policy.py
          python3 izzet-science/sim/validate_backup_tutor_connectivity.py
          python3 izzet-science/sim/validate_backup_tutor_opportunities.py
          python3 izzet-science/sim/validate_commander_independent.py
          python3 izzet-science/sim/validate_multiplayer_kill.py

      - name: Execute sole authorized paired pilot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p izzet-science/artifacts/v09-capsize-paired
          python3 izzet-science/sim/run_v09_capsize_paired_pilot.py \
            --source-sha 2035adc350368f8eeec87a2f960ea05c40763fb8 \
            --output izzet-science/artifacts/v09-capsize-paired/paired-summary.json
          python3 izzet-science/sim/audit_v09_capsize_paired_output.py \
            izzet-science/artifacts/v09-capsize-paired/paired-summary.json \
            --expected-source 2035adc350368f8eeec87a2f960ea05c40763fb8 \
            --expected-seed 0x1A22E7010 \
            --expected-samples 10000 \
            | tee izzet-science/artifacts/v09-capsize-paired/paired-audit.txt
          cp izzet-science/sim/run_v09_capsize_paired_pilot.py \
            izzet-science/artifacts/v09-capsize-paired/paired-runner.py

      - name: Write and independently audit manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path("izzet-science/artifacts/v09-capsize-paired")
          digest=lambda name: hashlib.sha256((root/name).read_bytes()).hexdigest()
          manifest={
              "schema":"izzet-v09-capsize-paired-artifact-v1",
              "experimental_source_sha":"2035adc350368f8eeec87a2f960ea05c40763fb8",
              "workflow_runner_sha":os.environ["GITHUB_SHA"],
              "control_sha256":"726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01",
              "master_seed":"0x00000001A22E7010",
              "samples":10000,
              "through":10,
              "run_id":os.environ["GITHUB_RUN_ID"],
              "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "summary_sha256":digest("paired-summary.json"),
              "audit_sha256":digest("paired-audit.txt"),
              "runner_sha256":digest("paired-runner.py"),
          }
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
          python3 izzet-science/sim/audit_v09_capsize_paired_artifact.py \
            izzet-science/artifacts/v09-capsize-paired \
            --expected-source 2035adc350368f8eeec87a2f960ea05c40763fb8 \
            --expected-workflow "${GITHUB_SHA}" \
            --expected-runner-sha256 1dce15e3555f937964ae571140ca43e763f52747af56c2be71d53a7b7bcebb36 \
            --expected-seed 0x1A22E7010 \
            --expected-samples 10000

      - name: Preserve paired pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-capsize-paired
          path: izzet-science/artifacts/v09-capsize-paired
          if-no-files-found: error

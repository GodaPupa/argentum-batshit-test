name: Argentum Validation

on:
  workflow_dispatch:
  push:
    branches: [ "main", "mayhem/project-x" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show environment
        run: |
          java -version
          gradle --version

      - name: Compile Argentum
        run: ./gradlew classes --stacktrace

      - name: Run engine tests
        run: ./gradlew test --stacktrace

      - name: Run Gym tests
        run: ./gradlew :gym:test --stacktrace

      - name: Run Gym trainer tests
        run: ./gradlew :gym-trainer:test --stacktrace

      - name: Run frozen Project X Goldfish Sample 2
        env:
          PROJECT_X_GOLDFISH_SAMPLE_2: "true"
        run: ./gradlew :gym:test --tests ProjectXGoldfishTest --rerun-tasks --stacktrace

      - name: Upload Project X Goldfish Sample 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project-x-v02-goldfish-sample-2
          path: |
            gym/build/reports/project-x-goldfish/project-x-v02-goldfish-sample-2.json
            gym/build/reports/project-x-goldfish/project-x-v02-goldfish-sample-2.md
          if-no-files-found: warn

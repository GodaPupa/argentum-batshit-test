name: Argentum Validation

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  izzet-mizzium-skin-v08a:
    if: github.ref == 'refs/heads/mayhem/izzet-science'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          test "$(sha256sum izzet-science/challengers/v08A-mizzium-skin.md | cut -d' ' -f1)" = "575bfc592082f5999ebc50cca348b1bfeb157e9fa27bff09b5e092cc1aa496d1"
      - name: Run paired Mizzium Skin pilot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p izzet-science/artifacts
          python izzet-science/sim/mana_harness.py \
            --deck izzet-science/v0.7-control.md \
            --samples 10000 --seed 0x1A22E700C --interaction-pilot \
            | tee izzet-science/artifacts/v08A-control.txt
          python izzet-science/sim/mana_harness.py \
            --deck izzet-science/challengers/v08A-mizzium-skin.md \
            --samples 10000 --seed 0x1A22E700C --interaction-pilot \
            | tee izzet-science/artifacts/v08A-mizzium-skin.txt
          python izzet-science/sim/compare_v08a.py \
            izzet-science/artifacts/v08A-control.txt \
            izzet-science/artifacts/v08A-mizzium-skin.txt \
            | tee izzet-science/artifacts/v08A-comparison.txt
      - name: Write provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "challenger_sha256=575bfc592082f5999ebc50cca348b1bfeb157e9fa27bff09b5e092cc1aa496d1"
            echo "seed=0x1A22E700C"
            echo "samples_per_deck=10000"
            echo "change=-1 Turn Aside; +1 Mizzium Skin"
            sha256sum izzet-science/artifacts/v08A-control.txt \
              izzet-science/artifacts/v08A-mizzium-skin.txt \
              izzet-science/artifacts/v08A-comparison.txt
          } > izzet-science/artifacts/v08A-mizzium-skin.manifest
      - name: Preserve paired pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: izzet-v08A-mizzium-skin-paired-pilot
          path: |
            izzet-science/artifacts/v08A-control.txt
            izzet-science/artifacts/v08A-mizzium-skin.txt
            izzet-science/artifacts/v08A-comparison.txt
            izzet-science/artifacts/v08A-mizzium-skin.manifest
          if-no-files-found: error

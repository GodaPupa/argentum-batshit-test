name: Izzet Phase 15 Validation

on:
  push:
    branches: [ "mayhem/izzet-science" ]

permissions:
  contents: read

jobs:
  izzet-v09-capsize-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout frozen Phase 15 source
        uses: actions/checkout@v4
        with:
          ref: 70f14a6b7e89f200f7e421febb9529673a42d64a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "70f14a6b7e89f200f7e421febb9529673a42d64a"
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          test "$(sha256sum izzet-science/sim/capsize_interaction.py | cut -d' ' -f1)" = "a8c8be234958c32f7c2c58869a2f6bbe52e40313137a82b2c3609c911020a14e"
          test "$(sha256sum izzet-science/sim/validate_v09_capsize_interaction.py | cut -d' ' -f1)" = "5b2afa73fb9635f6ef4d171a129d63b93ffc4a8a7d449560f21933408eac566f"

      - name: Run seed-free interaction gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p izzet-science/artifacts/v09-phase15
          {
            python3 -m py_compile \
              izzet-science/sim/capsize_interaction.py \
              izzet-science/sim/validate_v09_capsize_interaction.py
            python3 izzet-science/sim/validate_v09_capsize_interaction.py
            python3 izzet-science/sim/validate_capsize_tutor_policy.py
            python3 izzet-science/sim/validate_v09_payment_recovery.py
            python3 izzet-science/sim/validate_paired_capsize_contract.py
          } | tee izzet-science/artifacts/v09-phase15/validation.txt

      - name: Write manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "schema=izzet-v09-phase15-seed-free-v1"
            echo "experimental_source_sha=70f14a6b7e89f200f7e421febb9529673a42d64a"
            echo "workflow_runner_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "samples=0"
            echo "experimental_seeds_consumed=0"
            sha256sum izzet-science/artifacts/v09-phase15/validation.txt
          } > izzet-science/artifacts/v09-phase15/manifest.txt
          test -s izzet-science/artifacts/v09-phase15/validation.txt
          test -s izzet-science/artifacts/v09-phase15/manifest.txt

      - name: Preserve seed-free gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-phase15-seed-free
          path: izzet-science/artifacts/v09-phase15
          if-no-files-found: error

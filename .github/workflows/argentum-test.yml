name: Izzet Phase 22 Opponent Action Policy Validation

on:
  push:
    branches: [ "mayhem/izzet-science" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout frozen semantic source
        uses: actions/checkout@v4
        with:
          ref: 26c15c897e4ca667f24486dd85b8d8f7dd2ad161
          persist-credentials: false

      - name: Verify frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "26c15c897e4ca667f24486dd85b8d8f7dd2ad161"
          test "$(git rev-parse HEAD^{tree})" = "7d9d461309e32d2275a035e3fb84e0d483e1ba60"
          echo "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01  izzet-science/v0.7-control.md" | sha256sum --check --strict
          echo "fa43d97dc761a380bc8128b866e5f665bb645966571839a27c4b50a853fb4679  izzet-science/sim/capsize_state_adapter.py" | sha256sum --check --strict
          echo "ae98059481dde833a2777093c83e28cb67e5c7f23d9876cab6227b7fd05cdc6a  izzet-science/sim/capsize_opponent_action_policy.py" | sha256sum --check --strict
          echo "edf91bc77d9eeb02a3d6f0f80170e2a43edcaf6261102931c2e0db9faf6da38a  izzet-science/sim/validate_v09_capsize_opponent_action_policy.py" | sha256sum --check --strict
          echo "d429b2e197ac74a1ce97d00b24cddace77e3647bc41d01972ad6d8f9d3160a16  izzet-science/v09-phase22-opponent-action-policy-gate.md" | sha256sum --check --strict

      - name: Run seed-free semantic chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase22-artifact
          python3 izzet-science/sim/validate_v09_capsize_interaction.py | tee phase22-artifact/phase15-validation.txt
          python3 izzet-science/sim/validate_v09_capsize_interaction_contract.py | tee phase22-artifact/phase16-validation.txt
          python3 izzet-science/sim/validate_v09_interaction_integrity_sweep.py | tee phase22-artifact/phase17-validation.txt
          python3 izzet-science/sim/validate_v09_capsize_response_policy.py | tee phase22-artifact/phase19-validation.txt
          python3 izzet-science/sim/validate_v09_capsize_event_ledger.py | tee phase22-artifact/phase20-validation.txt
          python3 izzet-science/sim/validate_v09_capsize_state_adapter.py | tee phase22-artifact/phase21-validation.txt
          python3 izzet-science/sim/validate_v09_capsize_opponent_action_policy.py | tee phase22-artifact/phase22-validation.txt
          grep -Fx "opponent_hidden_information_used=0" phase22-artifact/phase22-validation.txt
          grep -Fx "experimental_seeds_consumed=0" phase22-artifact/phase22-validation.txt
          grep -Fx "pilot_authorized=0" phase22-artifact/phase22-validation.txt
          grep -Fx "outcome_claims=0" phase22-artifact/phase22-validation.txt
          grep -Fx "disposition=V09_PHASE22_SEED_FREE_VALIDATED" phase22-artifact/phase22-validation.txt

      - name: Build provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "schema=izzet-v09-phase22-validation-artifact-v1"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "workflow_runner_sha=${GITHUB_SHA}"
            echo "control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "opponent_hidden_information_used=0"
            echo "experimental_seeds_assigned=0"
            echo "experimental_seeds_consumed=0"
            echo "outcome_claims=0"
          } > phase22-artifact/manifest.txt
          sha256sum phase22-artifact/*-validation.txt >> phase22-artifact/manifest.txt

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-phase22-opponent-action-policy
          path: phase22-artifact/
          if-no-files-found: error
          retention-days: 30

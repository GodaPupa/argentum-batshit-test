name: Izzet Phase 18 Official Interaction Pilot

on:
  push:
    branches: [ "mayhem/izzet-science" ]

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout frozen experimental source
        uses: actions/checkout@v4
        with:
          ref: 9bc8b75cffc1fc8698bf135819c0465a0641bfbd
          persist-credentials: false

      - name: Verify frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9bc8b75cffc1fc8698bf135819c0465a0641bfbd"
          test "$(git rev-parse HEAD^{tree})" = "9947c4b0bac55b7628ba8fa2d3bdedc34a84c461"
          echo "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01  izzet-science/v0.7-control.md" | sha256sum --check --strict
          echo "0c8b902dd014c6b7c92392dc59c19b64932fa49a276938a90cea0393fcd793aa  izzet-science/sim/run_v09_capsize_interaction_paired_pilot.py" | sha256sum --check --strict
          echo "b935787a16806a3c86739b353e326096766640d82127e6e72e89cc334d279358  izzet-science/sim/audit_v09_capsize_interaction_artifact.py" | sha256sum --check --strict
          echo "160dd66019e43c130f4cb61bdb68c142ed460e39677e0d187f4cdbc9a023a19b  izzet-science/sim/validate_v09_capsize_interaction_execution.py" | sha256sum --check --strict
          echo "136b8b43d1c7e42352b783fa2058f706bcd2737228d674ff76c10e14c1460c9e  izzet-science/sim/paired_capsize_interaction_contract.py" | sha256sum --check --strict
          echo "9d4eab04e694acba246528419a2d5667c31e056348d58f0bf5c8628d7d35d470  izzet-science/sim/mana_harness.py" | sha256sum --check --strict

      - name: Run complete seed-free preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 izzet-science/sim/validate_v09_capsize_interaction.py
          python3 izzet-science/sim/validate_v09_capsize_interaction_contract.py
          python3 izzet-science/sim/validate_v09_interaction_integrity_sweep.py
          python3 izzet-science/sim/validate_v09_capsize_interaction_execution.py

      - name: Execute sole official pilot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pilot-artifact
          python3 izzet-science/sim/run_v09_capsize_interaction_paired_pilot.py \
            --source-sha 9bc8b75cffc1fc8698bf135819c0465a0641bfbd \
            --output pilot-artifact/interaction-summary.json
          python3 izzet-science/sim/audit_v09_capsize_interaction_output.py \
            pilot-artifact/interaction-summary.json \
            --expected-source 9bc8b75cffc1fc8698bf135819c0465a0641bfbd \
            --expected-seed 0x00000001A22E7013 \
            --expected-samples 10000 | tee pilot-artifact/interaction-audit.txt
          cp izzet-science/sim/run_v09_capsize_interaction_paired_pilot.py \
            pilot-artifact/interaction-runner.py

      - name: Build and audit provenance artifact
        shell: bash
        run: |
          set -euo pipefail
          summary_sha=$(sha256sum pilot-artifact/interaction-summary.json | cut -d' ' -f1)
          audit_sha=$(sha256sum pilot-artifact/interaction-audit.txt | cut -d' ' -f1)
          runner_sha=$(sha256sum pilot-artifact/interaction-runner.py | cut -d' ' -f1)
          jq -n \
            --arg schema "izzet-v09-capsize-interaction-artifact-v1" \
            --arg experimental_source_sha "9bc8b75cffc1fc8698bf135819c0465a0641bfbd" \
            --arg workflow_runner_sha "${GITHUB_SHA}" \
            --arg control_sha256 "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01" \
            --arg master_seed "0x00000001A22E7013" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg summary_sha256 "${summary_sha}" \
            --arg audit_sha256 "${audit_sha}" \
            --arg runner_sha256 "${runner_sha}" \
            --argjson samples 10000 --argjson through 10 \
            --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{schema:$schema,experimental_source_sha:$experimental_source_sha,
              workflow_runner_sha:$workflow_runner_sha,control_sha256:$control_sha256,
              master_seed:$master_seed,samples:$samples,through:$through,
              run_id:$run_id,run_attempt:$run_attempt,summary_sha256:$summary_sha256,
              audit_sha256:$audit_sha256,runner_sha256:$runner_sha256}' \
            > pilot-artifact/manifest.json
          python3 izzet-science/sim/audit_v09_capsize_interaction_artifact.py \
            pilot-artifact \
            --expected-source 9bc8b75cffc1fc8698bf135819c0465a0641bfbd \
            --expected-workflow "${GITHUB_SHA}" \
            --expected-runner-sha256 0c8b902dd014c6b7c92392dc59c19b64932fa49a276938a90cea0393fcd793aa \
            --expected-seed 0x00000001A22E7013 \
            --expected-samples 10000

      - name: Upload canonical artifact
        uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-phase18-interaction-pilot
          path: pilot-artifact/
          if-no-files-found: error
          retention-days: 30

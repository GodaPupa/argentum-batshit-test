name: Izzet Phase 25 Real Opponent Action-Surface Validation

on:
  push:
    branches: [ "mayhem/izzet-science" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout frozen semantic source
        uses: actions/checkout@v4
        with:
          ref: 60c1d94290ae557c31ec5f0c7979ffb9497b1950
          persist-credentials: false

      - name: Verify frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "60c1d94290ae557c31ec5f0c7979ffb9497b1950"
          test "$(git rev-parse HEAD^{tree})" = "81d41a452a49a35b1d017bf7d23d978671633347"
          echo "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01  izzet-science/v0.7-control.md" | sha256sum --check --strict
          echo "ecde45fcafc4f09ce7e69398ab0787979a6e0d84b4dba83f067a2153176dc0ff  izzet-science/opponents/veteran-beastrider-commander-clash-2025.identity.json" | sha256sum --check --strict
          echo "481d255e817b34e76a12cd87fbe5acdfcac8c35eb20f1e233f2f43d1bae9c61c  izzet-science/opponents/veteran-beastrider-commander-clash-2025.rules.json" | sha256sum --check --strict
          echo "bd33aa63ab246454fb5be34198605035f50b9016862d24575cd08bc0b4b7f219  izzet-science/opponents/veteran-beastrider-commander-clash-2025.action-surfaces.json" | sha256sum --check --strict
          echo "f09fcdfb5b9aba27a30b11b84c9142c2295d7483df7b798d298e19306a132bed  izzet-science/sim/capture_v09_phase25_veteran_beastrider_rules.py" | sha256sum --check --strict
          echo "19aeaeeedcf0727c9d3a929e8496fc7db539009b5cfb7459ec60a449c49032ea  izzet-science/sim/validate_v09_phase25_veteran_beastrider_action_surfaces.py" | sha256sum --check --strict
          echo "4c6a4b70fb261b21538709e2c09608ed8d64e7779d060126d4b667e6099ca24f  izzet-science/v09-phase25-real-opponent-action-surfaces-gate.md" | sha256sum --check --strict

      - name: Run frozen and live-replay validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase25-artifact
          python3 izzet-science/sim/validate_v09_capsize_fixture_action_generator.py | tee phase25-artifact/phase23-validation.txt
          python3 izzet-science/sim/validate_v09_phase24_veteran_beastrider_identity.py | tee phase25-artifact/phase24-validation.txt
          python3 izzet-science/sim/validate_v09_phase25_veteran_beastrider_action_surfaces.py | tee phase25-artifact/phase25-offline-validation.txt
          python3 izzet-science/sim/capture_v09_phase25_veteran_beastrider_rules.py > phase25-artifact/phase25-live-replay.json
          python3 izzet-science/sim/validate_v09_phase25_veteran_beastrider_action_surfaces.py \
            --online-replay phase25-artifact/phase25-live-replay.json | tee phase25-artifact/phase25-online-validation.txt
          grep -Fx "rules_cards=85" phase25-artifact/phase25-online-validation.txt
          grep -Fx "surface_classes=12" phase25-artifact/phase25-online-validation.txt
          grep -Fx "mapped_unique_cards=77" phase25-artifact/phase25-online-validation.txt
          grep -Fx "malformed_artifacts_rejected=12" phase25-artifact/phase25-online-validation.txt
          grep -Fx "online_replay_verified=1" phase25-artifact/phase25-online-validation.txt
          grep -Fx "experimental_seeds_consumed=0" phase25-artifact/phase25-online-validation.txt
          grep -Fx "execution_authorized=0" phase25-artifact/phase25-online-validation.txt
          grep -Fx "pilot_authorized=0" phase25-artifact/phase25-online-validation.txt
          grep -Fx "outcome_claims=0" phase25-artifact/phase25-online-validation.txt
          grep -Fx "disposition=V09_PHASE25_ACTION_SURFACES_VALIDATED" phase25-artifact/phase25-online-validation.txt
          cp izzet-science/opponents/veteran-beastrider-commander-clash-2025.rules.json phase25-artifact/frozen-rules.json
          cp izzet-science/opponents/veteran-beastrider-commander-clash-2025.action-surfaces.json phase25-artifact/frozen-action-surfaces.json
          cp izzet-science/v09-phase25-real-opponent-action-surfaces-gate.md phase25-artifact/gate.md

      - name: Build provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "schema=izzet-v09-phase25-validation-artifact-v1"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "workflow_runner_sha=${GITHUB_SHA}"
            echo "control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "opponent_identity=veteran-beastrider-commander-clash-2025-v1"
            echo "rules_cards=85"
            echo "surface_classes=12"
            echo "mapped_unique_cards=77"
            echo "experimental_seeds_assigned=0"
            echo "experimental_seeds_consumed=0"
            echo "outcome_claims=0"
          } > phase25-artifact/manifest.txt
          sha256sum phase25-artifact/phase23-validation.txt \
            phase25-artifact/phase24-validation.txt \
            phase25-artifact/phase25-offline-validation.txt \
            phase25-artifact/phase25-live-replay.json \
            phase25-artifact/phase25-online-validation.txt \
            phase25-artifact/frozen-rules.json \
            phase25-artifact/frozen-action-surfaces.json \
            phase25-artifact/gate.md >> phase25-artifact/manifest.txt

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-phase25-real-opponent-action-surfaces
          path: phase25-artifact/
          if-no-files-found: error
          retention-days: 30

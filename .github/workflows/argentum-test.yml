name: Izzet Phase 19 Response Policy Validation

on:
  push:
    branches: [ "mayhem/izzet-science" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout frozen semantic source
        uses: actions/checkout@v4
        with:
          ref: f1a8ae8c019ebd48bc748459c952011e6552a48b
          persist-credentials: false

      - name: Verify frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f1a8ae8c019ebd48bc748459c952011e6552a48b"
          test "$(git rev-parse HEAD^{tree})" = "2fe567198d6b47dc0641af2453d123ec8c098e4f"
          echo "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01  izzet-science/v0.7-control.md" | sha256sum --check --strict
          echo "65b605fd0c62c5dbf9973997f4ddb55c9d026814aeba7f3d7a87a679c0987197  izzet-science/sim/capsize_response_policy.py" | sha256sum --check --strict
          echo "b6fb9d6a84a6ce84c875d2320d6e847cc9f3abbce81b4153f0c004e1d52cb82e  izzet-science/sim/validate_v09_capsize_response_policy.py" | sha256sum --check --strict
          echo "df914d8149c0f264ee84732bfb269dd04818c6e1ef23d82c8972b25d7bf439ad  izzet-science/sim/capsize_interaction.py" | sha256sum --check --strict
          echo "136b8b43d1c7e42352b783fa2058f706bcd2737228d674ff76c10e14c1460c9e  izzet-science/sim/paired_capsize_interaction_contract.py" | sha256sum --check --strict

      - name: Run seed-free semantic chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase19-artifact
          python3 izzet-science/sim/validate_v09_capsize_interaction.py | tee phase19-artifact/phase15-validation.txt
          python3 izzet-science/sim/validate_v09_capsize_interaction_contract.py | tee phase19-artifact/phase16-validation.txt
          python3 izzet-science/sim/validate_v09_interaction_integrity_sweep.py | tee phase19-artifact/phase17-validation.txt
          python3 izzet-science/sim/validate_v09_capsize_response_policy.py | tee phase19-artifact/phase19-validation.txt
          grep -Fx "experimental_seeds_consumed=0" phase19-artifact/phase19-validation.txt
          grep -Fx "pilot_authorized=0" phase19-artifact/phase19-validation.txt
          grep -Fx "disposition=V09_PHASE19_SEED_FREE_VALIDATED" phase19-artifact/phase19-validation.txt

      - name: Build provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "schema=izzet-v09-phase19-validation-artifact-v1"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "workflow_runner_sha=${GITHUB_SHA}"
            echo "control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "experimental_seeds_assigned=0"
            echo "experimental_seeds_consumed=0"
            echo "outcome_claims=0"
          } > phase19-artifact/manifest.txt
          sha256sum phase19-artifact/*-validation.txt >> phase19-artifact/manifest.txt

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-phase19-response-policy
          path: phase19-artifact/
          if-no-files-found: error
          retention-days: 30

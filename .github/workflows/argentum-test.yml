name: Argentum Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  izzet-v09-capsize-paired-v3:
    if: github.ref == 'refs/heads/mayhem/izzet-science'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout frozen qualified source
        uses: actions/checkout@v4
        with:
          ref: 5a981b1f4a34b065af0630bf68113f7ac73e94b9

      - name: Verify frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5a981b1f4a34b065af0630bf68113f7ac73e94b9"
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          test "$(sha256sum izzet-science/sim/run_v09_capsize_paired_pilot_v3.py | cut -d' ' -f1)" = "760ce035e6dc81fc001b2f080e87ebfda97be7444819a7a1e2fd7f3afb3eb5b3"

      - name: Run complete qualified seed-free preflight
        run: |
          python3 izzet-science/sim/validate_v09_capsize_paired_execution_v3.py
          python3 izzet-science/sim/validate_v09_paired_integrity_sweep.py
          python3 izzet-science/sim/validate_paired_capsize_contract.py
          python3 izzet-science/sim/validate_v09_payment_recovery.py
          python3 izzet-science/sim/validate_paired_rng_isolation.py
          python3 izzet-science/sim/validate_capsize_tutor_instrumentation.py
          python3 izzet-science/sim/validate_capsize_tutor_policy.py
          python3 izzet-science/sim/validate_backup_tutor_connectivity.py
          python3 izzet-science/sim/validate_backup_tutor_opportunities.py
          python3 izzet-science/sim/validate_commander_independent.py
          python3 izzet-science/sim/validate_multiplayer_kill.py

      - name: Execute sole authorized qualified paired pilot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p izzet-science/artifacts/v09-capsize-paired-v3
          python3 izzet-science/sim/run_v09_capsize_paired_pilot_v3.py \
            --source-sha 5a981b1f4a34b065af0630bf68113f7ac73e94b9 \
            --output izzet-science/artifacts/v09-capsize-paired-v3/paired-summary.json
          python3 izzet-science/sim/audit_v09_capsize_paired_output.py \
            izzet-science/artifacts/v09-capsize-paired-v3/paired-summary.json \
            --expected-source 5a981b1f4a34b065af0630bf68113f7ac73e94b9 \
            --expected-seed 0x1A22E7012 \
            --expected-samples 10000 \
            | tee izzet-science/artifacts/v09-capsize-paired-v3/paired-audit.txt
          cp izzet-science/sim/run_v09_capsize_paired_pilot_v3.py \
            izzet-science/artifacts/v09-capsize-paired-v3/paired-runner.py

      - name: Write and independently audit manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path("izzet-science/artifacts/v09-capsize-paired-v3")
          digest=lambda name: hashlib.sha256((root/name).read_bytes()).hexdigest()
          manifest={
              "schema":"izzet-v09-capsize-paired-artifact-v2",
              "experimental_source_sha":"5a981b1f4a34b065af0630bf68113f7ac73e94b9",
              "workflow_runner_sha":os.environ["GITHUB_SHA"],
              "control_sha256":"726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01",
              "master_seed":"0x00000001A22E7012",
              "samples":10000,
              "through":10,
              "run_id":os.environ["GITHUB_RUN_ID"],
              "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "summary_sha256":digest("paired-summary.json"),
              "audit_sha256":digest("paired-audit.txt"),
              "runner_sha256":digest("paired-runner.py"),
          }
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
          python3 izzet-science/sim/audit_v09_capsize_paired_artifact.py \
            izzet-science/artifacts/v09-capsize-paired-v3 \
            --expected-source 5a981b1f4a34b065af0630bf68113f7ac73e94b9 \
            --expected-workflow "${GITHUB_SHA}" \
            --expected-runner-sha256 760ce035e6dc81fc001b2f080e87ebfda97be7444819a7a1e2fd7f3afb3eb5b3 \
            --expected-seed 0x1A22E7012 \
            --expected-samples 10000

      - name: Preserve qualified paired pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-capsize-paired-v3
          path: izzet-science/artifacts/v09-capsize-paired-v3
          if-no-files-found: error

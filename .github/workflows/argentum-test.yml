name: Izzet Phase 17 Interaction Integrity Qualification

on:
  push:
    branches: [ "mayhem/izzet-science" ]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout frozen experimental source
        uses: actions/checkout@v4
        with:
          ref: a9800ae035a6664078a3ae0caba9f7ef5c447414
          persist-credentials: false

      - name: Verify frozen identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a9800ae035a6664078a3ae0caba9f7ef5c447414"
          test "$(git rev-parse HEAD^{tree})" = "d0dd0a3f90970893db999bc3128eb1e96e9345cb"
          echo "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01  izzet-science/v0.7-control.md" | sha256sum --check --strict
          echo "aa8f92cab4b06e6117fd45b458ddaa9983582b9cfdb559fc72cfc96da791f215  izzet-science/sim/validate_v09_interaction_integrity_sweep.py" | sha256sum --check --strict
          echo "136b8b43d1c7e42352b783fa2058f706bcd2737228d674ff76c10e14c1460c9e  izzet-science/sim/paired_capsize_interaction_contract.py" | sha256sum --check --strict
          echo "9d4eab04e694acba246528419a2d5667c31e056348d58f0bf5c8628d7d35d470  izzet-science/sim/mana_harness.py" | sha256sum --check --strict

      - name: Run seed-free interaction controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase17-artifact
          python3 izzet-science/sim/validate_v09_capsize_interaction.py | tee phase17-artifact/phase15-validation.txt
          python3 izzet-science/sim/validate_v09_capsize_interaction_contract.py | tee phase17-artifact/phase16-validation.txt

      - name: Run invariant-only qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 izzet-science/sim/validate_v09_interaction_integrity_sweep.py | tee phase17-artifact/phase17-validation.txt
          grep -Fx "outcome_fields_emitted=0" phase17-artifact/phase17-validation.txt
          grep -Fx "experimental_seeds_consumed=0" phase17-artifact/phase17-validation.txt
          grep -Fx "pilot_authorized=0" phase17-artifact/phase17-validation.txt
          grep -Fx "disposition=V09_PHASE17_INTERACTION_INVARIANT_SWEEP_VALIDATED" phase17-artifact/phase17-validation.txt

      - name: Build provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "schema=izzet-v09-phase17-validation-artifact-v1"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "workflow_runner_sha=${GITHUB_SHA}"
            echo "control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "experimental_seeds_assigned=0"
            echo "experimental_seeds_consumed=0"
            echo "outcome_fields_emitted=0"
          } > phase17-artifact/manifest.txt
          sha256sum phase17-artifact/phase15-validation.txt phase17-artifact/phase16-validation.txt phase17-artifact/phase17-validation.txt >> phase17-artifact/manifest.txt

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-phase17-interaction-integrity
          path: phase17-artifact/
          if-no-files-found: error
          retention-days: 30

name: Izzet shared Opal compatibility adoption
on:
  push:
    branches: ["validation/izzet-opal-shared-compat-20261002"]
    paths: [".github/workflows/izzet-opal-shared-compat-20261002.yml"]
permissions: {contents: read}
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_USER_HOME: /tmp/izzet-opal-shared-${{ github.run_id }}
      OUT: /tmp/izzet-opal-shared-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: c2a11b501fa9b6c4c78972c7d1bf1ff591f62fcf, fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind exact shared compatibility and compile
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "c2a11b501fa9b6c4c78972c7d1bf1ff591f62fcf"
          test ! -e "$OUT" && mkdir "$OUT"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/ManaSpellRider.kt)" = 5c6c1d4e8374a5375f79643a6e282fb728ab23b6
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/state/components/stack/StackComponents.kt)" = a3526220f4b7f172ad8270d01da77a10dacfc158
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/core/Serialization.kt)" = 7cb03c944411532f8ecdeccff470129260a2aa01
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c13/cards/OpalPalace.kt)" = 544a440160528f4a08211109936a55e263c39d19
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/izzet/IzzetPosition1RegistryInventoryTest.kt)" = 197a99e6c17885bb70511916893d3a33de217feb
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :mtg-sdk:compileKotlin :rules-engine:compileKotlin :mtg-sets:2008-2016:compileKotlin :gym:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
      - name: Require canonical Opal Palace registry adoption
        shell: bash
        run: |
          set -o pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :gym:test --tests com.wingedsheep.gym.izzet.IzzetOpalPalaceRegistryAdoptionTest 2>&1 | tee "$OUT/opal-registry.log"
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetOpalPalaceRegistryAdoptionTest.xml "$OUT/"
      - name: Execute unchanged 55-name registry inventory diagnostically
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :gym:test --tests com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest 2>&1 | tee "$OUT/inventory.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$OUT/inventory-gradle-exit.txt"
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml "$OUT/"
          python3 - <<'PY'
          import json,os,pathlib,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['OUT'])
          p=out/'TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml'
          root=ET.parse(p).getroot()
          suffix=" is registered in current runtime"
          reg=[]; miss=[]
          for case in root.iter('testcase'):
              n=case.attrib['name']; card=n[:-len(suffix)] if n.endswith(suffix) else n
              (miss if case.find('failure') is not None or case.find('error') is not None else reg).append(card)
          assert int(root.attrib['tests'])==55 and len(reg)+len(miss)==55
          assert 'Opal Palace' in reg
          summary={'schema':'izzet-position1-post-opal-registry-v1','tests':55,
            'registered':len(reg),'missing':len(miss),'registered_names':sorted(reg),'missing_names':sorted(miss),
            'opal_palace_registered':True,'authority':'REGISTRY_DIAGNOSTIC_ONLY','official_counters_delta':0}
          (out/'registry-summary.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-opal-shared-compat-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: warn
          retention-days: 90

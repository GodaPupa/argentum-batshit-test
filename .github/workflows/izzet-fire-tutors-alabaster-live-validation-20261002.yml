name: Izzet Fire Tutors Alabaster live checkpoint
on:
  push:
    branches: ["validation/izzet-fire-tutors-alabaster-live-20261002"]
    paths: [".github/workflows/izzet-fire-tutors-alabaster-live-validation-20261002.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_USER_HOME: /tmp/izzet-fire-tutors-alabaster-${{ github.run_id }}
      OUT: /tmp/izzet-fire-tutors-alabaster-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind exact live composition
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$OUT"
          test "$(git rev-parse HEAD^)" = "4f53fbbf0cdbb68be9b646b8da8253b7555bbd10"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/izzet-fire-tutors-alabaster-live-validation-20261002.yml"
          test "$(git hash-object mtg-sets/2000-2002/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/apc/cards/FireIce.kt)" = "e1a05c6322a511592baa84d0646c946eeef00888"
          test "$(git hash-object mtg-sets/2000-2002/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/FireIceScenarioTest.kt)" = "045a3971e640e1109566de73e761c96dc4e28932"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m15/cards/HeliodsPilgrim.kt)" = "d09543a5e2b8e9fc8d64100bd3c3c858b64f052d"
          test "$(git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/HeliodsPilgrimScenarioTest.kt)" = "964c2f727036fac8b2565f067397262dfe4c97ca"
          test "$(git hash-object mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/neo/cards/ShrineSteward.kt)" = "64d8d55d3362a8d9c7c017b3a5e2f986ad6c68bc"
          test "$(git hash-object mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ShrineStewardScenarioTest.kt)" = "7c517fc155596e871d2959a8ebf4724fbbfcecc4"
          test "$(git hash-object mtg-sets/2023/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/mom/cards/AlabasterHostIntercessor.kt)" = "b69090ba9e195e21e3a10e717830aca7cdd7334c"
          test "$(git hash-object mtg-sets/2023/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/AlabasterHostIntercessorBatchAIScenarioTest.kt)" = "c4b4bf0fbbcc3e9df34690bf9236d7a987c5c48a"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/izzet/IzzetPosition1RegistryInventoryTest.kt)" = "197a99e6c17885bb70511916893d3a33de217feb"
          git rev-parse HEAD HEAD^{tree} HEAD^ > "$OUT/source.txt"
          printf '%s\n' 'AUTHOR_VALIDATION_ONLY_NO_GAMEPLAY_AUTHORITY' > "$OUT/authority.txt"
      - name: Compile exact affected shards
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:2000-2002:tests:compileTestKotlin \
            :mtg-sets:2008-2016:tests:compileTestKotlin \
            :mtg-sets:2017-2022:tests:compileTestKotlin \
            :mtg-sets:2023:tests:compileTestKotlin \
            :gym:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
      - name: Run exact composed candidate scenarios
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:2000-2002:tests:test --tests com.wingedsheep.engine.scenarios.FireIceScenarioTest 2>&1 | tee "$OUT/fire-ice.log"
          cp mtg-sets/2000-2002/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.FireIceScenarioTest.xml "$OUT/"
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:2008-2016:tests:test --tests com.wingedsheep.engine.scenarios.HeliodsPilgrimScenarioTest 2>&1 | tee "$OUT/heliod.log"
          cp mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.HeliodsPilgrimScenarioTest.xml "$OUT/"
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:2017-2022:tests:test --tests com.wingedsheep.engine.scenarios.ShrineStewardScenarioTest 2>&1 | tee "$OUT/shrine.log"
          cp mtg-sets/2017-2022/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.ShrineStewardScenarioTest.xml "$OUT/"
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:2023:tests:test --tests com.wingedsheep.engine.scenarios.AlabasterHostIntercessorBatchAIScenarioTest 2>&1 | tee "$OUT/alabaster.log"
          cp mtg-sets/2023/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.AlabasterHostIntercessorBatchAIScenarioTest.xml "$OUT/"
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET, json
          out=pathlib.Path(os.environ["OUT"])
          suites=[
            "com.wingedsheep.engine.scenarios.FireIceScenarioTest",
            "com.wingedsheep.engine.scenarios.HeliodsPilgrimScenarioTest",
            "com.wingedsheep.engine.scenarios.ShrineStewardScenarioTest",
            "com.wingedsheep.engine.scenarios.AlabasterHostIntercessorBatchAIScenarioTest",
          ]
          rows=[]
          for name in suites:
              root=ET.parse(out/f"TEST-{name}.xml").getroot()
              assert int(root.attrib["failures"])==0, (name,root.attrib)
              assert int(root.attrib["errors"])==0, (name,root.attrib)
              assert int(root.attrib["skipped"])==0, (name,root.attrib)
              rows.append({"suite":name,"tests":int(root.attrib["tests"])})
          (out/"scenario-summary.json").write_text(json.dumps({"suites":rows,"total_tests":sum(x["tests"] for x in rows)},sort_keys=True,indent=2)+"\n")
          PY
      - name: Reinventory exact Position-1
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :gym:test --tests com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest 2>&1 | tee "$OUT/registry.log"
          rc=${PIPESTATUS[0]}
          set -e
          XML=gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml
          test -f "$XML"; cp "$XML" "$OUT/"
          REGISTRY_RC="$rc" python3 - <<'PY'
          import json,os,pathlib,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ["OUT"])
          root=ET.parse(out/"TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml").getroot()
          assert int(root.attrib["tests"])==55
          suffix=" is registered in current runtime"; reg=[]; miss=[]
          for c in root.iter("testcase"):
              n=c.attrib["name"]; card=n[:-len(suffix)] if n.endswith(suffix) else n
              (reg if c.find("failure") is None and c.find("error") is None else miss).append(card)
          required={"Fire // Ice","Heliod's Pilgrim","Shrine Steward","Alabaster Host Intercessor",
                    "Pieces of the Puzzle","Ideas Unbound","Brightwood Tracker","Stave Off"}
          assert required.issubset(set(reg)), (required-set(reg),sorted(reg))
          preserved={"Capsize","Everflowing Chalice","Lose Focus","Rolling Thunder","Shattering Pulse","Skred","Star Compass",
                     "Benevolent Blessing","Cosmic Hunger","Deepwood Denizen","Guardian Naga // Banishing Coils",
                     "Shardless Outlander","Snake Umbra","Temporal Isolation","Ulvenwald Captive // Ulvenwald Abomination"}
          assert preserved==set(miss), (sorted(preserved-set(miss)),sorted(set(miss)-preserved))
          assert len(reg)==40 and len(miss)==15, (len(reg),len(miss),sorted(miss))
          (out/"registry-summary.json").write_text(json.dumps({
            "schema":"izzet-fire-tutors-alabaster-live-v1",
            "published_source":"4f53fbbf0cdbb68be9b646b8da8253b7555bbd10",
            "registered":len(reg),"missing":len(miss),
            "registered_names":sorted(reg),"missing_names":sorted(miss),
            "official_counters_delta":{"allocations":0,"claims":0,"games":0,"outcomes":0},
            "gradle_exit_code":int(os.environ["REGISTRY_RC"])
          },sort_keys=True,indent=2)+"\n")
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-fire-tutors-alabaster-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

name: Pest Control Tier-1 Mono-Blue Terror Replication Freeze Gate

on:
  pull_request:
    paths:
      - scripts/experiments/pest-control/generate_tier_one_mono_blue_terror_replication_freeze.py
      - .github/workflows/pest-control-tier-one-mono-blue-terror-replication-freeze.yml
      - docs/experiments/pest-control/tier-one-mono-blue-terror-replication-freeze-gate.md

permissions:
  actions: read
  contents: read

concurrency:
  group: pest-control-tier-one-mono-blue-terror-replication-freeze-validation
  cancel-in-progress: false

jobs:
  validate-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download exact accepted Terror smoke freeze artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/prior-terror-smoke-freeze
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10733086089/zip" \
            -o build/prior-terror-smoke-freeze.zip
          echo "bbf9f20e834f27f838e37de78c905c213a8917651818367360a8e8a140914961  build/prior-terror-smoke-freeze.zip" | sha256sum -c -
          unzip -q build/prior-terror-smoke-freeze.zip -d build/prior-terror-smoke-freeze
          cd build/prior-terror-smoke-freeze
          sha256sum -c artifacts.sha256

      - name: Deterministic entropy-free replication validation
        run: |
          set -euo pipefail
          python3 scripts/experiments/pest-control/generate_tier_one_mono_blue_terror_replication_freeze.py \
            --preflight \
            --prior-smoke-dir build/prior-terror-smoke-freeze
          python3 scripts/experiments/pest-control/generate_tier_one_mono_blue_terror_replication_freeze.py \
            --validate-fixture \
            --prior-smoke-dir build/prior-terror-smoke-freeze \
            --output-dir build/reports/pest-control-tier-one-mono-blue-terror-replication-freeze-fixture
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          root=Path("build/reports/pest-control-tier-one-mono-blue-terror-replication-freeze-fixture")
          manifest=json.loads((root/"freeze-manifest.json").read_text())
          assert manifest["status"]=="NONEXPERIMENTAL_FIXTURE"
          assert manifest["collision_audit"]=={
              "excluded_seed_count":554,
              "new_seed_count":12,
              "new_unique_count":12,
              "overlap_count":0,
              "result":"PASS",
          }
          assert manifest["assignment_counts"]=={
              "games":12,
              "pest_draw":6,
              "pest_play":6,
              "pest_seat_one":6,
              "pest_seat_zero":6,
              "joint_cells":{
                  "SEAT_ZERO_PLAY":3,
                  "SEAT_ZERO_DRAW":3,
                  "SEAT_ONE_PLAY":3,
                  "SEAT_ONE_DRAW":3,
              },
          }
          assert manifest["prior_smoke"]=={
              "ordered_vector_sha256":"ca508c842886fff2af7db1c966fbedbb8ae801796c5043e26b22def056c724ea",
              "seed_count":4,
              "result":"PEST_CONTROL_4_0",
          }
          assert manifest["official_counters"]=={
              "actions_submitted":0,
              "artifacts_with_outcomes":0,
              "games_initialized":0,
              "outcome_exposure":0,
          }
          rows=list(csv.DictReader((root/"assignments.csv").open()))
          assert len(rows)==12
          assert [int(row["game_number"]) for row in rows]==list(range(1,13))
          assert len({int(row["seed_decimal"]) for row in rows})==12
          assert all(int(row["seed_decimal"]) != 0 for row in rows)
          vector=(root/"ordered-seeds.txt").read_text().splitlines()
          smoke=Path("build/prior-terror-smoke-freeze/ordered-seeds.txt").read_text().splitlines()
          assert set(vector).isdisjoint(smoke)
          PY

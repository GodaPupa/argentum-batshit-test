name: Izzet Position-1 current-runtime registry reinventory
on:
  push:
    branches: ["izzet/position1-gap-reinventory-20260928"]
    paths: [".github/workflows/izzet-position1-registry-reinventory.yml"]
permissions: {contents: read}
jobs:
  fifty-five-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact diagnostic bank and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/izzet-position1-registry-reinventory
          test "$(git rev-parse HEAD^)" = "89f58ca303430402d5e5a2852ea52a212e48d63c"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/izzet/IzzetPosition1RegistryInventoryTest.kt)" = "197a99e6c17885bb70511916893d3a33de217feb"
          test "$(git hash-object experiments/izzet-science/POSITION1_REGISTRY_REINVENTORY_BUDGET_20260928.json)" = "93573c6e365aba4af1b9dfa094adb88553a08dbc"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/izzet/IzzetPosition1RegistryInventoryTest.kt; git hash-object experiments/izzet-science/POSITION1_REGISTRY_REINVENTORY_BUDGET_20260928.json; git hash-object .github/workflows/izzet-position1-registry-reinventory.yml; git status --porcelain; } > build/reports/izzet-position1-registry-reinventory/source.txt
      - name: Execute exact 55 registry identities
        shell: bash
        run: |
          set -o pipefail
          just test-class IzzetPosition1RegistryInventoryTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-position1-registry-reinventory/test.log
      - name: Retain exact XML
        if: always()
        run: cp gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml build/reports/izzet-position1-registry-reinventory/ 2>/dev/null || true
      - name: Preserve original diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-position1-registry-reinventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-position1-registry-reinventory/
          if-no-files-found: error
          retention-days: 90

name: Manual generator calibration repair early R1
on:
  push:
    branches: [validation/manual-generator-calibration-repair-early-r1-20261026]
    paths: ['.github/workflows/manual-generator-calibration-repair-early-r1-20261026.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 375ba8ac19a71681a5b2459ffb5e59d7beed850d
  SOURCE_TREE: f38f51a4da4983b2cc7f8b63246409053de107f6
  WORKFLOW: .github/workflows/manual-generator-calibration-repair-early-r1-20261026.yml
  RECORD: experiments/manual-transmission/research/generator-calibration-repair-early-r1-20261026
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile normal and all mutants before exact controls and output inventory
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-generator-calibration-repair-early-r1-${{ github.run_id }}
          path: manual-generator-calibration-repair-early-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error

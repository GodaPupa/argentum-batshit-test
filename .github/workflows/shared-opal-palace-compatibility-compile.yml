name: Shared Opal Palace compatibility compile
on:
  push:
    branches: ["validation/shared-opal-palace-compatibility-20261001"]
    paths: [".github/workflows/shared-opal-palace-compatibility-compile.yml"]
permissions: {contents: read}
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: /tmp/shared-opal-compat-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: cb705a0819cbdd75b4fac9c7ffca69989b3ffbf6, fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Compile only affected shared modules
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cb705a0819cbdd75b4fac9c7ffca69989b3ffbf6"
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :mtg-sdk:compileKotlin :rules-engine:compileKotlin :mtg-sets:2008-2016:tests:compileTestKotlin

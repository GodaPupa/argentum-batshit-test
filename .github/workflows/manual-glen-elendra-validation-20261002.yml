name: Manual Glen Elendra Archmage exact-card validation
on:
  push:
    branches: ["validation/manual-glen-elendra-20261002"]
    paths: [".github/workflows/manual-glen-elendra-validation-20261002.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_USER_HOME: /tmp/manual-glen-${{ github.run_id }}
      OUT: /tmp/manual-glen-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v6
        with:
          ref: e7d37e2ea0f18dfa8d6b0fff68ef816b59555d2d
          path: .phase1-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind exact Glen Elendra candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$OUT"
          test "$(git rev-parse HEAD^)" = "9dff68fdbac3a98b653d5280fc52dbae8a485f7d"
          test "$(git rev-parse HEAD^^)" = "b02f5c79088fab1a080a9d1998569af625b126d2"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/manual-glen-elendra-validation-20261002.yml"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/eve/cards/GlenElendraArchmage.kt)" = "ad424467549beb38cff88670ed28d0abac3e38a3"
          test "$(git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/GlenElendraArchmageScenarioTest.kt)" = "b8a918002f8512f85858ccd69fb9ff820851f417"
          git rev-parse HEAD HEAD^{tree} HEAD^ HEAD^^ > "$OUT/source.txt"
          printf '%s\n' 'AUTHOR_VALIDATION_AND_ZERO_GAME_REGISTRY_DIAGNOSTIC_ONLY' > "$OUT/authority.txt"
      - name: Compile affected shard and registry test source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:2008-2016:tests:compileTestKotlin :gym:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
      - name: Run exact Glen Elendra mechanics scenarios
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:2008-2016:tests:test --tests com.wingedsheep.engine.scenarios.GlenElendraArchmageScenarioTest 2>&1 | tee "$OUT/glen.log"
          cp mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.GlenElendraArchmageScenarioTest.xml "$OUT/"
          python3 - <<'PY'
          import os,pathlib,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ["OUT"])
          root=ET.parse(out/"TEST-com.wingedsheep.engine.scenarios.GlenElendraArchmageScenarioTest.xml").getroot()
          got={k:int(root.attrib[k]) for k in ("tests","failures","errors","skipped")}
          assert got=={"tests":3,"failures":0,"errors":0,"skipped":0}, got
          PY
      - name: Reinventory exact eight frozen decks
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/manual-transmission-phase2/bootstrap_audit.py --phase1 .phase1-source --out "$OUT/source-audit"
          MT_P2_AUDIT_INPUT="$OUT/source-audit/registry-requests.json" \
          MT_P2_AUDIT_OUTPUT="$OUT/registry" \
            bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
              :gym:test --tests com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest 2>&1 | tee "$OUT/registry.log"
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest.xml "$OUT/"
          python3 - <<'PY'
          import json,os,pathlib,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ["OUT"])
          root=ET.parse(out/"TEST-com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest.xml").getroot()
          assert {k:int(root.attrib[k]) for k in ("tests","failures","errors","skipped")} == {"tests":1,"failures":0,"errors":0,"skipped":0}
          report=json.loads((out/"registry/registry-report.json").read_text())
          rows=[]; glen=[]; gwenna=[]
          for d in report["decks"]:
              missing=[c["requested_name"] for c in d["cards"] if not c["registry_resolved"]]
              rows.append({"deck_id":d["deck_id"],"missing":len(missing),"missing_names":missing})
              glen += [c for c in d["cards"] if c["requested_name"]=="Glen Elendra Archmage"]
              gwenna += [c for c in d["cards"] if c["requested_name"]=="Gwenna, Eyes of Gaea"]
          assert glen and all(c["registry_resolved"] for c in glen), glen
          assert gwenna and all(c["registry_resolved"] for c in gwenna), gwenna
          (out/"registry-summary.json").write_text(json.dumps({
              "schema":"manual-glen-candidate-registry-v1",
              "decks":rows,
              "total_missing":sum(x["missing"] for x in rows),
              "glen_occurrences":len(glen),
              "gwenna_occurrences":len(gwenna),
              "official_counters_delta":{"allocations":0,"claims":0,"games":0,"outcomes":0}
          },sort_keys=True,indent=2)+"\n")
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-glen-elendra-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

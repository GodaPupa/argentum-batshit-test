name: Face Value Chrysalis B Gruul Replication
on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-chrysalis-b-gruul-replication.yml]
permissions: {contents: read}
jobs:
  replicate:
    uses: ./.github/workflows/face-value-experiment-harness.yml
    with:
      experiment_name: chrysalis-b-gruul-replication
      control_deck: experiments/face-value/decks/fv-v12-control.dck
      challenger_deck: experiments/face-value/decks/fv-gruul-chrysalis-b.dck
      opponent_deck: experiments/face-value/decks/gruul-ramp.dck
      seed_start: 1350001
      games: 30

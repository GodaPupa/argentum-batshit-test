name: Pest Control Tier-1 Mono-Blue Terror Replication Artifact VALIDATE_ONLY

on:
  pull_request:
    paths:
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonoBlueTerrorReplicationExecutionInputLoader.kt
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonoBlueTerrorReplicationExecutionCoordinator.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonoBlueTerrorReplicationExecutionHarnessTest.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonoBlueTerrorReplicationOfficialArtifactValidationTest.kt
      - .github/workflows/pest-control-tier-one-mono-blue-terror-replication-artifact-validate.yml
      - docs/experiments/pest-control/tier-one-mono-blue-terror-replication-harness-validation.md

permissions:
  actions: read
  contents: read

jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Download exact frozen replication artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/pest-terror-replication-input
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10773131628/zip" \
            -o build/pest-terror-replication-freeze.zip
          echo "4d3a19ef7febacb336911ff1271c14ab83a6ea1f99ed34ae154ae154d6ef5f25  build/pest-terror-replication-freeze.zip" | sha256sum -c -
          unzip -q build/pest-terror-replication-freeze.zip -d build/pest-terror-replication-input
          cd build/pest-terror-replication-input
          sha256sum -c artifacts.sha256

      - name: Validate exact replication artifact without gameplay
        env:
          PEST_TERROR_REPLICATION_MODE: VALIDATE_ONLY
          PEST_TERROR_REPLICATION_INPUT_DIR: ${{ github.workspace }}/build/pest-terror-replication-input
        run: scripts/test-class PestControlTierOneMonoBlueTerrorReplicationOfficialArtifactValidationTest --info --stacktrace

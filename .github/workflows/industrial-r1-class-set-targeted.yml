name: Industrial declared eight-class loaded JVM manifest capture
on:
  push:
    branches: ["industrial-waste/r1-launcher-source-pins-20260927"]
    paths:
      - ".github/workflows/industrial-r1-class-set-targeted.yml"
permissions:
  contents: read
jobs:
  one-case:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source, receiver and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/industrial-r1-class-set-targeted
          test "$(git rev-parse HEAD^)" = "5d819724431cd02f8081de65271af2e9c935f521"
          test "$(git hash-object ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2LoadedJvmIdentity.kt)" = "83e0a0b3190cc72d3d3c8f789293455ff2d42f12"
          test "$(git hash-object ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2R1ClassSetCaptureTest.kt)" = "de42ad390186493ed249416d156936ea6b7e97cc"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2LoadedJvmIdentity.kt; git hash-object ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2R1ClassSetCaptureTest.kt; git hash-object .github/workflows/industrial-r1-class-set-targeted.yml; git status --porcelain; } > build/reports/industrial-r1-class-set-targeted/source.txt
      - name: Execute one declared class-set manifest capture
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :ai:test --tests 'com.wingedsheep.ai.industrialwaste.IndustrialWasteV2R1ClassSetCaptureTest' --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/industrial-r1-class-set-targeted/test.log
      - name: Retain original XML and loaded-class TSV
        if: always()
        shell: bash
        run: |
          cp ai/build/test-results/test/TEST-com.wingedsheep.ai.industrialwaste.IndustrialWasteV2R1ClassSetCaptureTest.xml build/reports/industrial-r1-class-set-targeted/ 2>/dev/null || true
          test -s ai/build/reports/industrial-r1-class-set/loaded-classes.tsv
          cp ai/build/reports/industrial-r1-class-set/loaded-classes.tsv build/reports/industrial-r1-class-set-targeted/
      - name: Upload original manifest evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-r1-class-set-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/industrial-r1-class-set-targeted/
          if-no-files-found: error
          retention-days: 90

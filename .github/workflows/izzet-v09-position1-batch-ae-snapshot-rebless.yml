name: Izzet Position-1 Batch AE Snapshot Rebless

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-batch-ae-snapshot-rebless.yml"
      - "mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c20/**"
      - "gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt"
      - "izzet-science/v09-position1-engine-batch-ae-gate.md"

permissions:
  contents: write

jobs:
  rebless-batch-ae:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mayhem/izzet-science
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch AE boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'Batch AD is accepted' izzet-science/v09-position1-engine-batch-ad-gate.md
          grep -Fq 'Expected post-implementation unresolved count is exactly **22**' izzet-science/v09-position1-engine-batch-ae-gate.md

      - name: Run Bonder's Ornament semantics
        run: scripts/test-class BondersOrnamentBatchAEScenarioTest --info --stacktrace

      - name: Run exact real-engine readiness expectation
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-ae-readiness.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=22' /tmp/batch-ae-readiness.txt
          ! grep -Fq "unresolved Veteran Beastrider card: Bonder's Ornament" /tmp/batch-ae-readiness.txt
          ! grep -Fq 'V09_REAL_ENGINE_UNRESOLVED=unresolved Izzet card:' /tmp/batch-ae-readiness.txt

      - name: Regenerate snapshots canonically
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true --stacktrace

      - name: Fail closed on unrelated snapshot changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "mtg-sets/src/test/resources/snapshots/cards/C20.json"
          git diff --check
          grep -Fq "// Bonder's Ornament" mtg-sets/src/test/resources/snapshots/cards/C20.json

      - name: Commit and safely integrate canonical snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtg-sets/src/test/resources/snapshots/cards/C20.json
          git commit -m "Rebless Position-1 Batch AE snapshot"
          git fetch origin mayhem/izzet-science
          git rebase origin/mayhem/izzet-science
          git push origin HEAD:mayhem/izzet-science

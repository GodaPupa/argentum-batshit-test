name: Pest Monster P04 optional targets receiving
on:
  push:
    branches: ["pest/c2-pair-pilot-seam-20260927"]
    paths:
      - ".github/workflows/pest-monster-c2-p04-optional-targeted.yml"
      - "gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterOptionalTargetReceivingTest.kt"

permissions:
  contents: read

jobs:
  prospective-optional-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact preflighted fixture source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-c2-p04-optional
          test "$(git rev-parse HEAD^)" = "d70562781f8b14ef2af9148ae1ef49f303aa814b"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterOptionalTargetReceivingTest.kt)" = "d73aea0ca099ec74718eb1e558fb0e750430c871"
          test "$(git rev-parse d70562781f8b14ef2af9148ae1ef49f303aa814b:gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterOptionalTargetReceivingTest.kt)" = "d73aea0ca099ec74718eb1e558fb0e750430c871"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterOptionalTargetReceivingTest.kt
            git hash-object .github/workflows/pest-monster-c2-p04-optional-targeted.yml
            git status --porcelain
          } > build/reports/pest-c2-p04-optional/source.txt
      - name: Execute eight fresh optional-target fixtures
        shell: bash
        run: |
          set -o pipefail
          scripts/test-class PestMonsterOptionalTargetReceivingTest --rerun-tasks --info --stacktrace 2>&1 | tee build/reports/pest-c2-p04-optional/gradle.log
      - name: Verify exact JUnit cases
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          paths=glob.glob("gym/build/test-results/test/TEST-*PestMonsterOptionalTargetReceivingTest.xml")
          assert len(paths)==1, paths
          root=ET.parse(paths[0]).getroot()
          cases=root.findall(".//testcase")
          expected=[f"P04-04 Monster seat {seat} {card} {selection}"
              for seat in (1,2)
              for card, selections in (("Rooftop Percher",("zero targets","two targets")),
                  ("Pinnacle Kill-Ship",("zero targets","one target")))
              for selection in selections]
          assert sorted(c.get("name") for c in cases)==sorted(expected), [c.get("name") for c in cases]
          assert not root.findall(".//failure") and not root.findall(".//error") and not root.findall(".//skipped")
          PY
      - name: Retain original result and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-c2-p04-optional-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/pest-c2-p04-optional/
            gym/build/test-results/test/TEST-*PestMonsterOptionalTargetReceivingTest.xml
          if-no-files-found: error
          retention-days: 90

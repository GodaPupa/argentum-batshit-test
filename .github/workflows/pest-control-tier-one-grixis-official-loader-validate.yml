name: Pest Control Tier-1 Grixis Official Artifact Loader Validation

on:
  pull_request:
    paths:
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneGrixisDisabledOfficialArtifactLoader.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneGrixisDisabledOfficialArtifactLoaderTest.kt
      - .github/workflows/pest-control-tier-one-grixis-official-loader-validate.yml
      - docs/experiments/pest-control/tier-one-grixis-disabled-official-artifact-loader.md
  workflow_dispatch:
    inputs:
      validation_ack:
        description: Exact official-byte validation acknowledgement; this never initializes games
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: pest-control-tier-one-grixis-official-loader-validation
  cancel-in-progress: false

jobs:
  validate-disabled-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify disabled loader only
        run: scripts/test-class PestControlTierOneGrixisDisabledOfficialArtifactLoaderTest --info --stacktrace

  validate-official-artifact:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Fail-closed dispatch guard
        env:
          VALIDATION_ACK: ${{ inputs.validation_ack }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "${VALIDATION_ACK}" = "VALIDATE_TIER_ONE_GRIXIS_OFFICIAL_ARTIFACT_BYTES_NO_GAMEPLAY"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=pest-control-tier-one-grixis-official-loader-validation" --jq '.total_count')" = "0"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Download and verify exact frozen artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/pest-grixis-official-input
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10620940806/zip" \
            -o build/pest-grixis-official-freeze.zip
          echo "88b5e99d7aab2065fb26d51c074478d43310209d45b084d9dcfe552e8c328373  build/pest-grixis-official-freeze.zip" | sha256sum -c -
          unzip -q build/pest-grixis-official-freeze.zip -d build/pest-grixis-official-input
          cd build/pest-grixis-official-input
          sha256sum -c artifacts.sha256
      - name: Validate official bytes without gameplay
        env:
          PEST_GRIXIS_OFFICIAL_LOADER_VALIDATE: "true"
          PEST_GRIXIS_OFFICIAL_LOADER_ACK: ${{ inputs.validation_ack }}
          PEST_GRIXIS_OFFICIAL_ARTIFACT_DIR: ${{ github.workspace }}/build/pest-grixis-official-input
          PEST_GRIXIS_OFFICIAL_LOADER_OUTPUT_DIR: ${{ github.workspace }}/build/reports/pest-grixis-official-loader
        run: scripts/test-class PestControlTierOneGrixisDisabledOfficialArtifactLoaderTest --info --stacktrace
      - name: Upload digest-only validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: pest-control-tier-one-grixis-official-loader-validation
          path: build/reports/pest-grixis-official-loader/official-loader-validation.json
          if-no-files-found: error
          retention-days: 90

name: Pest Control Tier-1 Grixis Official Artifact Loader Validation

on:
  pull_request:
    paths:
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneGrixisDisabledOfficialArtifactLoader.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneGrixisDisabledOfficialArtifactLoaderTest.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneGrixisOfficialLoaderValidationProvenanceTest.kt
      - .github/workflows/pest-control-tier-one-grixis-official-loader-validate.yml
      - docs/experiments/pest-control/tier-one-grixis-disabled-official-artifact-loader.md
      - docs/experiments/pest-control/tier-one-grixis-official-loader-validation-provenance.json

permissions:
  contents: read

concurrency:
  group: pest-control-tier-one-grixis-official-loader-validation
  cancel-in-progress: false

jobs:
  validate-disabled-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify disabled loader and sealed provenance
        run: |
          scripts/test-class PestControlTierOneGrixisDisabledOfficialArtifactLoaderTest --info --stacktrace
          scripts/test-class PestControlTierOneGrixisOfficialLoaderValidationProvenanceTest --info --stacktrace

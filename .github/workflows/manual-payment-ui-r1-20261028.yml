name: Manual actual activated payment UI R1
on:
  push:
    branches: [validation/manual-payment-ui-r1-20261028]
    paths: ['.github/workflows/manual-payment-ui-r1-20261028.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 57d3c8a8492a5714d4cca78e627e1979106630d5
  SOURCE_TREE: 9fd1d9aaf30baf8a5745d328d1d59a372eacd386
  WORKFLOW: .github/workflows/manual-payment-ui-r1-20261028.yml
  RECORD: experiments/manual-transmission/research/activation-payment-ui-r1-20261028
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile normal and mutants before real browser qualification
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-payment-ui-r1-${{ github.run_id }}
          path: manual-payment-ui-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error

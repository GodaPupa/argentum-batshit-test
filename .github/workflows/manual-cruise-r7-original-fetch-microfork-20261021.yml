name: Manual CRUISE R7 exact original fetch-to-Birds microfork (NO GAMES)
on:
  push:
    branches: [research/manual-cruise-r7-original-fetch-microfork-20261021]
    paths:
      - '.github/workflows/manual-cruise-r7-original-fetch-microfork-20261021.yml'
      - 'experiments/manual-transmission/research/cruise-sport-race-20261021/CRUISE_R7_MICROFORK_MANIFEST.json'
      - 'ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualCruiseR7ExactOriginalFetchForkTest.kt'
permissions:
  contents: read
  actions: read
concurrency:
  group: manual-cruise-r7-bounded-original-fetch-microfork
  cancel-in-progress: false

jobs:
  bounded-original-source-microfork:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R4_ROOT: ${{ github.workspace }}
      MANUAL_R7_ROOT: ${{ github.workspace }}
      MANUAL_R7_ARCHIVES: ${{ github.workspace }}/cruise-r7-originals
      MANUAL_R7_OUTPUT: ${{ github.workspace }}/cruise-r7-evidence
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 50}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate original source, bounds, R5 and no-game research allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cruise-r7-originals cruise-r7-evidence
          test "$GITHUB_REF" = 'refs/heads/research/manual-cruise-r7-original-fetch-microfork-20261021'
          git merge-base --is-ancestor dfcad1d380b7175d47b071c41998bdf9c2eed07b HEAD
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = 7984a2e87d8ddbe023d45620414d25a61691a040
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = 180918b2d7a59309e7b0617f2579fb2a6d06b7d5
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = ef5ba9dacb02bbf2a00303c9ee4724565769385a
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/EngineAiPlayerController.kt)" = 8a3c94041ca6cf781d5efe35d7a513b522b3856b
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt)" = d02fded3fd9656aa2d032c49ce8312e1d6baaf93
          git diff --name-only dfcad1d380b7175d47b071c41998bdf9c2eed07b HEAD > cruise-r7-evidence/changed-paths.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/manual-cruise-r7-original-fetch-microfork-20261021.yml|experiments/manual-transmission/research/cruise-sport-race-20261021/CRUISE_R7_MICROFORK_MANIFEST.json|ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualCruiseR7ExactOriginalFetchForkTest.kt) ;;
              *) echo "UNAUTHORIZED_DELTA:$path"; exit 1 ;;
            esac
          done < cruise-r7-evidence/changed-paths.txt
          git rev-parse HEAD > cruise-r7-evidence/source-sha.txt
          git rev-parse HEAD^{tree} > cruise-r7-evidence/tree-sha.txt
          echo 'ORIGINAL_PREFIX41_PER_ARM_ONE_MECHANISM_ONLY_ZERO_FULL_GAMES_TWO_RESERVED' > cruise-r7-evidence/budget.txt
          chmod +x gradlew scripts/gradle-locked

      - name: Retrieve exact original control and A R6 source artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('experiments/manual-transmission/research/cruise-sport-race-20261021/CRUISE_R7_MICROFORK_MANIFEST.json')
          m=json.loads(p.read_text())
          assert m['schema']=='ARGENTUM_CRUISE_R7_ORIGINAL_TURN_ONE_FETCH_MICROFORK_V1'
          assert m['predeclared_before_new_microfork_results']
          assert m['budget']=={'full_game_count_before':10,'cap':12,'reserved':2,'new_full_games':0}
          assert m['historical_prefix_actions_replayed_per_arm']==41
          assert {x['arm'] for x in m['original_arms']}=={'control','a'}
          with open('cruise-r7-evidence/original-artifacts.tsv','w') as f:
              for x in m['original_arms']:
                  f.write('\t'.join((x['arm'],str(x['artifact_id']),x['digest']))+'\n')
          PY
          while IFS=$'\t' read -r arm artifact sha; do
            file="cruise-r7-originals/R6-$arm-202610202141-original.zip"
            gh api "/repos/GodaPupa/argentum-batshit-test/actions/artifacts/$artifact/zip" > "$file"
            printf '%s  %s\n' "$sha" "$file" | sha256sum -c -
          done < cruise-r7-evidence/original-artifacts.tsv

      - name: Replay only 41 exact prior original actions and bounded live-engine conditional fetch fork
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualCruiseR7ExactOriginalFetchForkTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee cruise-r7-evidence/original-source-microfork.log
          test -s cruise-r7-evidence/R7-control.json
          test -s cruise-r7-evidence/R7-a.json

      - name: Retain exact bounded microfork JUnit
        if: always()
        shell: bash
        run: |
          mkdir -p cruise-r7-evidence/r7-junit
          cp -a ai/build/test-results/test/. cruise-r7-evidence/r7-junit/ || true

      - name: Preserve existing R5 and original opener protections
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualPactDebt*Test' \
            --tests '*ManualBallista*Test' \
            --tests '*ManualR5CandidateCompositionTest' \
            --tests '*EngineAiMomirMulliganTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee cruise-r7-evidence/original-protections.log

      - name: Archive independent source/observations on GREEN or RED, never original game zips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-cruise-r7-bounded-original-fetch-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            cruise-r7-evidence/
            ai/build/test-results/test/

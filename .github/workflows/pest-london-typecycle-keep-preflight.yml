name: Pest Tower Ent raw keep parity static preflight
on:
  push:
    branches: ["pest/london-raw-keep-parity-20260928"]
    paths:
      - ".github/workflows/pest-london-typecycle-keep-preflight.yml"
permissions:
  contents: read
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind changed actor development and both parity banks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-typecycle-keep-preflight
          test "$(git rev-parse HEAD^)" = "37d9ebf1b12317cbb356f943f26b51ba43fa5887"
          test "$(git hash-object ai/src/main/kotlin/com/wingedsheep/ai/engine/EngineAiPlayerController.kt)" = "4f020ea2406e9bd6a87ec389685b48f15df4c5a3"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonKeepPolicy.kt)" = "c2ada4e08786b57a924a201565f09b31082208a7"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonRawKeepParityTest.kt)" = "73275bc0cb4086e1c6beaacd8fa1feb1a394fa38"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonRawTypecycleKeepParityTest.kt)" = "62640f9a042691a6c306be1f608052de62ba1c21"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object ai/src/main/kotlin/com/wingedsheep/ai/engine/EngineAiPlayerController.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonKeepPolicy.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonRawKeepParityTest.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonRawTypecycleKeepParityTest.kt; git hash-object .github/workflows/pest-london-typecycle-keep-preflight.yml; git status --porcelain; } > build/reports/pest-typecycle-keep-preflight/source.txt
      - name: Compile changed typecycling parity source without behavior
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:compileTestKotlin --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-typecycle-keep-preflight/compile.log
      - name: Preserve original static evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-typecycle-keep-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-typecycle-keep-preflight/
          if-no-files-found: error
          retention-days: 90

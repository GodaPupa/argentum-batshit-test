name: Izzet Veteran Beastrider two-case mechanics qualification

on:
  push:
    branches: [lab/izzet-veteran-mechanics-qualification-20260927]

permissions:
  contents: read

jobs:
  original-deterministic-banks:
    if: ${{ github.event.before == '0000000000000000000000000000000000000000' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 82b5e4660c28bfb399b09cbaaf92d4e59181bf82
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Qualify two prospective Veteran Beastrider card identities on the exact source
        run: python3 control/qualify.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: izzet-veteran-mechanics-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

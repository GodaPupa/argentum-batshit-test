name: Izzet Position-1 Engine Batch Q

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-q.yml"

permissions:
  contents: read

jobs:
  qualify-batch-q:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch Q gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'V07_DECK_AUDIT_NO_CHANGE' izzet-science/v07-deck-level-audit-no-change.md
          grep -Fq 'V09_CARD_CONTROL_ARCHITECTURE_AUDIT_KEEP_V07' izzet-science/v09-card-control-architecture-audit.md
          grep -Fq 'Live unresolved count is exactly 36' izzet-science/v09-position1-engine-batch-q-gate.md

      - name: Requalify canonical card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --stacktrace

      - name: Run Star Compass semantics
        run: scripts/test-class StarCompassScenarioTest --info --stacktrace

      - name: Run exact real-engine coverage regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-q.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=36' /tmp/batch-q.txt
          ! grep -Fq 'unresolved Izzet card: Star Compass' /tmp/batch-q.txt

      - name: Assert official experiment remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt

      - name: Emit Batch Q manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izzet-batch-q
          cp /tmp/batch-q.txt /tmp/izzet-batch-q/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-q-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "frozen_control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "implemented=Star Compass;BasicLandsYouControlCouldProduce color set;projected basic-land color inspection;constrained mana choice"
            echo "unresolved_before=37"
            echo "unresolved_after=36"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/2000-2002/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/pls/cards/StarCompass.kt
            sha256sum mtg-sets/2000-2002/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/StarCompassScenarioTest.kt
            sha256sum mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/values/ManaColorSet.kt
            sha256sum rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/LandManaColorInspector.kt
            sha256sum rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaColorSetResolver.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/v09-position1-engine-batch-q-gate.md
            sha256sum mtg-sets/src/test/resources/snapshots/cards/PLS.json
            sha256sum /tmp/izzet-batch-q/test-output.txt
          } > /tmp/izzet-batch-q/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-q
          path: /tmp/izzet-batch-q
          if-no-files-found: error

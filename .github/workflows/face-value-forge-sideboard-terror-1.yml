name: Face Value Forge Sideboard Terror 1

on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-forge-sideboard-terror-1.yml]

permissions:
  contents: read

jobs:
  terror-sideboard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone and build stock Forge
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src rev-parse HEAD | tee forge-source-commit.txt
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"
      - name: Write frozen control challenger and Terror
        run: |
          mkdir -p decks "$HOME/.forge/decks/constructed"
          cat > 'decks/Face Value v1.2 Terror Control.dck' <<'EOF'
          [metadata]
          Name=Face Value v1.2 Terror Control
          Deck Type=constructed
          [main]
          4 Llanowar Elves
          4 Nest Invader
          4 Eldrazi Repurposer
          1 Eyeless Watcher
          4 Wretched Gryff
          2 It of the Horrid Swarm
          2 Annoyed Altisaur
          1 Drownyard Lurker
          1 Nyxborn Hydra
          3 Generous Ent
          4 Malevolent Rumble
          4 Preordain
          2 Snap
          1 Lose Focus
          1 Tamiyo's Safekeeping
          2 Growth Spasm
          9 Forest
          8 Island
          3 Tangled Islet
          EOF
          cat > 'decks/Face Value v1.2 Terror Relic Dispel.dck' <<'EOF'
          [metadata]
          Name=Face Value v1.2 Terror Relic Dispel
          Deck Type=constructed
          [main]
          4 Llanowar Elves
          4 Nest Invader
          4 Eldrazi Repurposer
          4 Wretched Gryff
          2 It of the Horrid Swarm
          1 Annoyed Altisaur
          1 Drownyard Lurker
          3 Generous Ent
          4 Malevolent Rumble
          3 Preordain
          2 Snap
          1 Lose Focus
          1 Tamiyo's Safekeeping
          1 Growth Spasm
          9 Forest
          8 Island
          3 Tangled Islet
          3 Relic of Progenitus
          2 Dispel
          EOF
          cat > 'decks/Mono Blue Terror September 2026.dck' <<'EOF'
          [metadata]
          Name=Mono Blue Terror September 2026
          Deck Type=constructed
          [main]
          4 Delver of Secrets
          2 Murmuring Mystic
          4 Cryptic Serpent
          4 Tolarian Terror
          4 Brainstorm
          4 Mental Note
          4 Thought Scour
          4 Counterspell
          3 Ponder
          2 Sleep of the Dead
          4 Deem Inferior
          1 Deep Analysis
          4 Lorien Revealed
          16 Island
          EOF
          cp decks/*.dck "$HOME/.forge/decks/constructed/"
          seq 1090001 1090020 > terror-sideboard-seeds.txt
          sha256sum terror-sideboard-seeds.txt decks/*.dck | tee terror-sideboard-inputs.sha256
      - name: Run paired Terror sideboard block
        run: |
          set -euo pipefail
          mkdir -p logs/control logs/challenger
          while read -r seed; do
            "$FORGE_LAUNCHER" sim -d 'Face Value v1.2 Terror Control.dck' 'Mono Blue Terror September 2026.dck' -n 1 -s "$seed" -c 180 > "logs/control/$seed.log" 2>&1
            "$FORGE_LAUNCHER" sim -d 'Face Value v1.2 Terror Relic Dispel.dck' 'Mono Blue Terror September 2026.dck' -n 1 -s "$seed" -c 180 > "logs/challenger/$seed.log" 2>&1
          done < terror-sideboard-seeds.txt
      - name: Audit paired Terror sideboard block
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          out={}
          for arm,name in [('control','Face Value v1.2 Terror Control'),('challenger','Face Value v1.2 Terror Relic Dispel')]:
            rec=[]
            for p in sorted((Path('logs')/arm).glob('*.log')):
              t=p.read_text(errors='replace')
              if re.search(r'Ai\(1\)-'+re.escape(name)+r' has won!',t): w='face'
              elif re.search(r'Ai\(2\)-Mono Blue Terror September 2026 has won!',t): w='terror'
              elif 'ended in a Draw' in t: w='draw'
              else: w='unknown'
              rec.append({'seed':int(p.stem),'winner':w,'relic_casts':len(re.findall(r'cast Relic of Progenitus',t)),'dispel_casts':len(re.findall(r'cast Dispel',t)),'gryff_emerge':len(re.findall(r'Wretched Gryff - Creature 3 / 4 \(Emerge\)',t)),'timeout':bool(re.search(r'TimeoutException|Stopping slow match as draw',t)),'other_exception':bool(re.search(r'Exception|StackOverflowError',t)) and not bool(re.search(r'TimeoutException',t))})
            out[arm]={'games':len(rec),'wins':sum(x['winner']=='face' for x in rec),'losses':sum(x['winner']=='terror' for x in rec),'draws':sum(x['winner']=='draw' for x in rec),'unknown':sum(x['winner']=='unknown' for x in rec),'relic_casts':sum(x['relic_casts'] for x in rec),'dispel_casts':sum(x['dispel_casts'] for x in rec),'gryff_emerge':sum(x['gryff_emerge'] for x in rec),'timeouts':sum(x['timeout'] for x in rec),'other_exceptions':sum(x['other_exception'] for x in rec),'records':rec}
          Path('terror-sideboard-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)); print(json.dumps({k:{kk:vv for kk,vv in v.items() if kk!='records'} for k,v in out.items()},indent=2,sort_keys=True))
          for arm,v in out.items(): assert v['games']==20 and v['unknown']==0 and v['timeouts']==0 and v['other_exceptions']==0,(arm,v)
          PY
      - name: Preserve Terror sideboard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-forge-sideboard-terror-1
          path: |
            terror-sideboard-summary.json
            terror-sideboard-seeds.txt
            terror-sideboard-inputs.sha256
            logs/**/*.log
            forge-source-commit.txt
            decks/*.dck
          if-no-files-found: warn

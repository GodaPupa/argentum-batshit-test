name: Manual Human-filter repair full compatibility R1
on:
  push:
    branches: [validation/manual-human-filter-repair-full-r1-20261027]
    paths: ['.github/workflows/manual-human-filter-repair-full-r1-20261027.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: b6e6150edb07cf4ac99f61fdbae6b89e131e59af
  SOURCE_TREE: adead58eca3856a8d4fb0954dcbee7994666604b
  WORKFLOW: .github/workflows/manual-human-filter-repair-full-r1-20261027.yml
  RECORD: experiments/manual-transmission/research/human-filter-repair-full-r1-20261027
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Reuse original compiled controls; full module and frozen POR ISD calibration
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-human-filter-repair-full-r1-${{ github.run_id }}
          path: manual-human-filter-repair-full-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error

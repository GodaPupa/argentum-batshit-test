name: Manual CRUISE R10 archived out-of-fixture and conditional opponent audit (NO GAMES)
on:
  push:
    branches: [research/manual-cruise-r10-out-of-fixture-20261021]
    paths:
      - '.github/workflows/manual-cruise-r10-out-of-fixture-20261021.yml'
      - 'experiments/manual-transmission/research/cruise-sport-race-20261021/CRUISE_R10_HOLDOUT_PROTOCOL.json'
      - 'ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualCruiseR10ArchivedDecisionAndCostTest.kt'
      - 'ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualCruiseR10InterruptibleFetchTest.kt'
permissions:
  contents: read
  actions: read
concurrency:
  group: manual-cruise-r10-out-of-fixture-source-only
  cancel-in-progress: true

jobs:
  six-archived-and-opponent-microfork:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R4_ROOT: ${{ github.workspace }}
      MANUAL_R10_ROOT: ${{ github.workspace }}
      MANUAL_R10_ARCHIVES: ${{ github.workspace }}/cruise-r10-originals
      MANUAL_R10_OUTPUT: ${{ github.workspace }}/cruise-r10-evidence/cases
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 60}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4

      - name: Enforce predeclared original R9, fixed R5, source immutability and zero-game delta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cruise-r10-originals cruise-r10-evidence/cases
          test "$GITHUB_REF" = 'refs/heads/research/manual-cruise-r10-out-of-fixture-20261021'
          git merge-base --is-ancestor 080196ef27164391d7b4d4f2cfcd6670a6c044af HEAD
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/Strategist.kt)" = 291a5985b90dfdcd729276fe0ce51687f8566142
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/CardAdvisor.kt)" = dd6c2481bbb9d4c7c26eb6b7a51d587d134da14a
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/modules/ManualCruiseR9ExecutableFetchAdvisorModule.kt)" = afb19c325bf38f3d82bd0fefba64e1f4057db858
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionCruiseR9Candidate.kt)" = d65a2b7043fd3276d7c647e7c4f01b26f6012629
          test "$(git rev-parse HEAD:ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualCruiseR9ExactFetchPolicyTest.kt)" = 801b9f517ebe55395963e8ee2d7cf1a6edcba6a6
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/cruise-sport-race-20261021/CRUISE_R9_EXECUTABLE_FETCH_PROTOCOL.json)" = 39ae2a06e20f5595ebdf4a87299c01250d37d573
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = 7984a2e87d8ddbe023d45620414d25a61691a040
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = 180918b2d7a59309e7b0617f2579fb2a6d06b7d5
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = ef5ba9dacb02bbf2a00303c9ee4724565769385a
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt)" = d02fded3fd9656aa2d032c49ce8312e1d6baaf93
          git diff --name-only 080196ef27164391d7b4d4f2cfcd6670a6c044af HEAD > cruise-r10-evidence/changed-paths.txt
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/manual-cruise-r10-out-of-fixture-20261021.yml|experiments/manual-transmission/research/cruise-sport-race-20261021/CRUISE_R10_HOLDOUT_PROTOCOL.json|ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualCruiseR10ArchivedDecisionAndCostTest.kt|ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualCruiseR10InterruptibleFetchTest.kt) ;;
              *) echo "UNAUTHORIZED_DELTA:$file"; exit 1 ;;
            esac
          done < cruise-r10-evidence/changed-paths.txt
          git rev-parse HEAD > cruise-r10-evidence/source-sha.txt
          git rev-parse HEAD^{tree} > cruise-r10-evidence/tree-sha.txt
          echo 'OUT_OF_FIXTURE_ARCHIVED_PREFIX_AND_SYNTHETIC_COUNTER_ONLY;ZERO_NEW_GAMES;TWO_RESERVED' > cruise-r10-evidence/budget.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('experiments/manual-transmission/research/cruise-sport-race-20261021/CRUISE_R10_HOLDOUT_PROTOCOL.json')
          d=json.loads(path.read_text())
          assert d['schema']=='ARGENTUM_MANUAL_CRUISE_R10_PREDECLARED_OUT_OF_FIXTURE_DECISION_AND_COST_V1'
          assert d['status']=='REGISTERED_BEFORE_R10_TEST_OR_BENCHMARK_EXECUTION'
          assert d['qualification']['precision_game_budget']=={'used':10,'max':12,'reserved':2,'new_games':0}
          cases=d['cases']
          assert len(cases)==6
          assert all(x['seed']!='202610202141' and x['expected_min_board_lands']>=2 for x in cases)
          assert d['benchmark']['timed_trials_per_profile']==5
          origin=d['origin_counterexample']
          assert origin['seed']=='202610202141' and origin['arm']=='a'
          with open('cruise-r10-evidence/archive-pins.tsv','w') as f:
              for x in cases+[{
                  'cohort':origin['cohort'],'arm':origin['arm'],'seed':origin['seed'],
                  'artifact_id':origin['original_archive_artifact'],'zip_sha256':origin['archive_sha256']
              }]:
                  f.write('\t'.join([x['cohort'],x['arm'],x['seed'],str(x['artifact_id']),x['zip_sha256']])+'\n')
          print('CRUISE_R10_SOURCE_PROTOCOL_LOCKED cases=6 and adversarial=1 paired_time=20x2 no_new_games')
          PY
          chmod +x gradlew scripts/gradle-locked

      - name: Download exact seven original source archives, verify every ZIP SHA256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r cohort arm seed id sha; do
            file="cruise-r10-originals/$cohort-$arm-$seed-original.zip"
            gh api "/repos/GodaPupa/argentum-batshit-test/actions/artifacts/$id/zip" > "$file"
            printf '%s  %s\n' "$sha" "$file" | sha256sum -c -
          done < cruise-r10-evidence/archive-pins.tsv
          # Frozen original R9 controls also require their matched CONTROL
          # counterpart. This is a prior-game artifact, not an added game.
          gh api '/repos/GodaPupa/argentum-batshit-test/actions/artifacts/12298777958/zip' > cruise-r10-originals/R6-control-202610202141-original.zip
          printf '%s  %s\\n' '031011134d10e3ae002ad7dc304ff7dafcc5e14f9a117c436e510dfb984349cb' cruise-r10-originals/R6-control-202610202141-original.zip | sha256sum -c -

      - name: Read-only replay of six previously unused R9 decisions plus timing and opponent counter window
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualCruiseR10ArchivedDecisionAndCostTest' \
            --tests '*ManualCruiseR10InterruptibleFetchTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee cruise-r10-evidence/r10-source-and-cost.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('cruise-r10-evidence/cases')
          p=Path('experiments/manual-transmission/research/cruise-sport-race-20261021/CRUISE_R10_HOLDOUT_PROTOCOL.json')
          proto=json.loads(p.read_text())
          for case in proto['cases']:
              out=json.loads((base/(case['id']+'.json')).read_text())
              assert out['freshR5EqualsR9'] is True
              assert out['additionalR9FetchScore'] is None
              assert out['originalSourceBoardLands']>=2
              assert out['fullGamesCreated']==0 and not out['profileOrDeckPromoted']
          perf=json.loads((base/'R10-PERFORMANCE.json').read_text())
          assert len(perf)==4
          for sample in perf:
              assert sample['trialsEach']==5
              assert len(sample['r5Ms'])==len(sample['r9Ms'])==5
              assert sample['additionalFullGames']==0
          risk=json.loads((base/'R10-SYNTHETIC-PACT-RESPONSE.json').read_text())
          assert risk['originalGameActionsReplayed']==41
          assert risk['counterspellSourcePaymentAccepted'] and risk['opponentResponseWindowObserved']
          assert not risk['actualOppositionBehaviorObserved'] and risk['newFullGames']==0
          print('CRUISE_R10_ARCHIVAL_NEGATIVE_AND_COUNTER_AND_PERFORMANCE_GATE_PASS NO_GAMES')
          PY

      - name: Preserve exact R10 JUnit and raw benchmark before protected cleanTest
        if: always()
        shell: bash
        run: |
          mkdir -p cruise-r10-evidence/r10-junit
          cp -a ai/build/test-results/test/. cruise-r10-evidence/r10-junit/ || true

      - name: Original R9 8/8 plus all 68 R5 protected regressions on exactly frozen source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          env MANUAL_R9_ROOT="$GITHUB_WORKSPACE" \
            MANUAL_R9_ARCHIVES="$GITHUB_WORKSPACE/cruise-r10-originals" \
            MANUAL_R9_OUTPUT="$GITHUB_WORKSPACE/cruise-r10-evidence/r9-retest" \
            scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualCruiseR9ExactFetchPolicyTest' \
            --tests '*ManualCruiseR9ImmediateLethalGuardTest' \
            --tests '*ManualPactDebt*Test' \
            --tests '*ManualBallista*Test' \
            --tests '*ManualStatue*Test' \
            --tests '*ManualEncoreRegressionTest' \
            --tests '*ManualResolutionPaymentRegressionTest' \
            --tests '*ManualR5CandidateCompositionTest' \
            --tests '*ManualAnimarDevelopmentPolicyTest' \
            --tests '*EngineAiMomirMulliganTest' \
            --tests '*PestControlMonoRedMadnessMulliganPolicyTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee cruise-r10-evidence/r9-plus-protected-regressions.log

      - name: Produce source-linked reporting only after bounded tests are green
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, statistics
          from pathlib import Path
          root=Path('cruise-r10-evidence')
          case=root/'cases'
          perf=case/'R10-PERFORMANCE.json'
          if not perf.exists(): print('R10_REPORT_HOLD missing measured performance'); quit()
          rows=json.loads(perf.read_text())
          lines=[
              '# Manual CRUISE R10 source-only out-of-fixture review',
              '',
              'Strictly archived R1/R6 previously untuned source states, not blinded new games.',
              'The opponent counter window is **synthetically enabled** by moving a source card',
              'from the opponent original library to hand. That card was *not* in their real hand.',
              '',
              '| Original checkpoint | R5 median (ms) | R9 median (ms) | R9-R5 (ms) |',
              '|---|---:|---:|---:|',
          ]
          for r in rows:
              lines.append(
                f"| {r['case']} | {r['r5MedianMs']:.2f} | {r['r9MedianMs']:.2f} | {r['additionalR9MedianMs']:+.2f} |"
              )
          lines += [
              '',
              '**No new full games, no opponent-response model validation, no promotions.**',
              'Numbers are descriptive within one CI machine run, not a population latency estimate.',
              ''
          ]
          (root/'REPORT.md').write_text('\n'.join(lines))
          print('CRUISE_R10_BOUNDED_PERFORMANCE_REPORT_PRESERVED')
          PY

      - name: Upload GREEN or RED source artifacts without original hidden game ZIPs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-cruise-r10-out-of-fixture-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            cruise-r10-evidence/
            ai/build/test-results/test/

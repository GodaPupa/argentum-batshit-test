name: Pest frozen raw physical-bottom parity targeted
on:
  push:
    branches: ["pest/london-raw-bottom-parity-20260928"]
    paths:
      - ".github/workflows/pest-london-raw-bottom-targeted.yml"
permissions:
  contents: read
jobs:
  two-declared-openings:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind unchanged raw comparator and own-public candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-raw-bottom-targeted
          test "$(git rev-parse HEAD^)" = "5eb8747c4f1729f50df967dbc30412b72d285042"
          test "$(git hash-object ai/src/main/kotlin/com/wingedsheep/ai/engine/EngineAiPlayerController.kt)" = "4f020ea2406e9bd6a87ec389685b48f15df4c5a3"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonBottomPolicy.kt)" = "d88e28bd46425a4c74d2a54348aa1c16f6f8ad6c"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonRawBottomParityTest.kt)" = "0aa0e1dba56514804683b7f0ecee68af9a30a8be"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object ai/src/main/kotlin/com/wingedsheep/ai/engine/EngineAiPlayerController.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonBottomPolicy.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonRawBottomParityTest.kt; git hash-object .github/workflows/pest-london-raw-bottom-targeted.yml; git status --porcelain; } > build/reports/pest-raw-bottom-targeted/source.txt
      - name: Execute exactly two frozen raw physical-bottom comparisons
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:test --tests 'com.wingedsheep.gym.matchup.PestMonsterLondonRawBottomParityTest' --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-raw-bottom-targeted/test.log
      - name: Preserve original XML
        if: always()
        shell: bash
        run: |
          if test -f gym/build/test-results/test/TEST-com.wingedsheep.gym.matchup.PestMonsterLondonRawBottomParityTest.xml; then
            cp gym/build/test-results/test/TEST-com.wingedsheep.gym.matchup.PestMonsterLondonRawBottomParityTest.xml build/reports/pest-raw-bottom-targeted/
          fi
      - name: Upload original targeted evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-raw-bottom-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-raw-bottom-targeted/
          if-no-files-found: error
          retention-days: 90

name: Pest Monster Tron R1 execution-source rebind v3.1 qualification

on:
  push:
    branches: ["pest/monster-tron-r1-execution-source-rebind-v3-1-20261006"]
    paths:
      - ".github/workflows/pest-monster-tron-r1-execution-source-rebind-v3-1-qualify-20261006.yml"
      - "docs/experiments/pest-control/PEST_MONSTER_TRON_R1_EXECUTION_SOURCE_REBIND_V3_1_20261006.json"
      - "gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonsterTronOneShotBoundary.kt"
      - "gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonsterTronR1RebindTest.kt"
      - "scripts/experiments/pest-control/verify_pest_monster_tron_r1_execution_source_rebind_v3_1.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: pest-monster-tron-r1-execution-source-rebind-v3-1-20261006
  cancel-in-progress: false

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUT: /tmp/pest-r1-rebind-v3-1-structural
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact V3.1 delta and reused V3 identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 scripts/experiments/pest-control/verify_pest_monster_tron_r1_execution_source_rebind_v3_1.py \
            | tee "$OUT/verifier-result.json"
          sha256sum docs/experiments/pest-control/PEST_MONSTER_TRON_R1_EXECUTION_SOURCE_REBIND_V3_1_20261006.json \
            | tee "$OUT/manifest.sha256"
          git rev-parse HEAD > "$OUT/head.txt"
          git rev-parse 'HEAD^{tree}' > "$OUT/tree.txt"
          printf '%s\n' 'V3_1_BASELINE_GUARD_REPAIR_ONLY__NO_A2__NO_CLAIM__NO_GAMEPLAY' > "$OUT/scope.txt"
      - name: Reconcile official-attempt refs read-only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/pest-control/official-attempts" \
            -o "$OUT/live-official-attempt-refs.json"
          python3 - <<'PY'
          import json
          p="/tmp/pest-r1-rebind-v3-1-structural/live-official-attempt-refs.json"
          refs=json.load(open(p))
          got={r["ref"]:r["object"]["sha"] for r in refs}
          old="refs/heads/pest-control/official-attempts/monster-tron-smoke-v1"
          new="refs/heads/pest-control/official-attempts/monster-tron-replacement-smoke-r1"
          assert got == {old:"1c2e253ad7f5a7652304f7c9aaafc30e547a481e"}, got
          assert new not in got
          print(json.dumps({"historical_claim":got[old],"future_r1_claim_ref":"ABSENT","claims_created":0},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pest-monster-tron-r1-rebind-v3-1-structural-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pest-r1-rebind-v3-1-structural/
          if-no-files-found: error
          retention-days: 90

  baseline_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_USER_HOME: /tmp/pest-r1-rebind-v3-1-gradle-${{ github.run_id }}-${{ github.run_attempt }}
      OUT: /tmp/pest-r1-rebind-v3-1-regression
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run changed-surface R1 baseline regression only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache \
            --rerun-tasks --console=plain :gym:test \
            --tests com.wingedsheep.gym.PestControlTierOneMonsterTronR1RebindTest \
            2>&1 | tee "$OUT/r1-rebind-test.log"
          printf '%s\n' 'CHANGED_BASELINE_GUARD_SURFACE_ONLY__NO_GAME_INITIALIZATION__NO_GAMEPLAY' > "$OUT/scope.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pest-monster-tron-r1-rebind-v3-1-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pest-r1-rebind-v3-1-regression/
          if-no-files-found: error
          retention-days: 90

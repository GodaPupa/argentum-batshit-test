name: Izzet AnyTarget unlimited after Skred
on:
  push:
    branches: ["validation/izzet-anytarget-unlimited-after-skred-20261002"]
    paths: [".github/workflows/izzet-anytarget-unlimited-after-skred-20261002.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUT: /tmp/izzet-anytarget-after-skred-${{ github.run_id }}
      GRADLE_USER_HOME: /tmp/izzet-anytarget-after-skred-gradle-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind exact current-head shared source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$OUT"
          test "$(git rev-parse HEAD^)" = "b91e02ab9fd0ac8583dd9e880209811d842f1e2f"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/izzet-anytarget-unlimited-after-skred-20261002.yml"
          test "$(git rev-parse HEAD^^)" = "09faac37c22dc1bc28a3761faded25b9e9223fb0"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/targets/TargetRequirement.kt)" = "9cee0c4f5acf0ea2a0392a7a8fed11ae058a8175"
          test "$(git hash-object mtg-sdk/src/test/kotlin/com/wingedsheep/sdk/scripting/targets/AnyTargetUnlimitedTest.kt)" = "59dfc24e79d53597cc46f1a7fd7bdd64d7e7bcf2"
          git rev-parse HEAD HEAD^{tree} HEAD^ HEAD^^ > "$OUT/source.txt"
          printf '%s\n' 'BOUNDED_SHARED_TARGET_REQUIREMENT_AUTHOR_VALIDATION_ONLY_NO_CARD_ADMISSION_NO_GAMEPLAY_AUTHORITY' > "$OUT/authority.txt"
      - name: Compile current affected modules
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sdk:compileTestKotlin :rules-engine:compileTestKotlin :mtg-sets:2003-2007:tests:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
      - name: Run exact AnyTarget unlimited regression
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sdk:test --tests com.wingedsheep.sdk.scripting.targets.AnyTargetUnlimitedTest 2>&1 | tee "$OUT/anytarget.log"
          cp mtg-sdk/build/test-results/test/TEST-com.wingedsheep.sdk.scripting.targets.AnyTargetUnlimitedTest.xml "$OUT/"
      - name: Run unchanged target requirement regressions
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sdk:test --tests com.wingedsheep.sdk.scripting.targets.RequiresExactlyOneTargetTest \
            --tests com.wingedsheep.sdk.scripting.targets.TargetRequirementWithCountTest 2>&1 | tee "$OUT/target-regressions.log"
      - name: Run current Skred regression
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:2003-2007:tests:test --tests com.wingedsheep.engine.scenarios.SkredScenarioTest 2>&1 | tee "$OUT/skred.log"
          cp mtg-sets/2003-2007/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.SkredScenarioTest.xml "$OUT/"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-anytarget-after-skred-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

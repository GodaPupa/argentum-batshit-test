name: Izzet Position-1 Engine Batch AD

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-ad.yml"

permissions:
  contents: read

jobs:
  qualify-batch-ad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch AD provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'Batch AC is accepted' izzet-science/v09-position1-engine-batch-ac-gate.md
          grep -Fq 'Expected post-implementation unresolved count is exactly **23**' izzet-science/v09-position1-engine-batch-ad-gate.md
          grep -Fq '36028474414' izzet-science/v09-position1-engine-batch-ad-gate.md
          test "$(git show --format= --name-only 7d2e9aed3345073006e6ffb837a64d96b5320a38 | sed '/^$/d' | wc -l)" -eq 1
          test "$(git show --format= --name-only 7d2e9aed3345073006e6ffb837a64d96b5320a38 | sed '/^$/d')" = "mtg-sets/src/test/resources/snapshots/cards/FRF.json"

      - name: Requalify canonical card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --stacktrace

      - name: Requalify Whisperer semantics
        run: scripts/test-class WhispererOfTheWildsScenarioTest --info --stacktrace

      - name: Requalify shared conditional mana rail
        run: scripts/test-class ConditionalManaAbilityAutoTapTest --info --stacktrace

      - name: Run exact real-engine coverage regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-ad.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=23' /tmp/batch-ad.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Whisperer of the Wilds' /tmp/batch-ad.txt
          ! grep -Fq 'V09_REAL_ENGINE_UNRESOLVED=unresolved Izzet card:' /tmp/batch-ad.txt

      - name: Assert official experiment remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt

      - name: Emit Batch AD manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izzet-batch-ad
          cp /tmp/batch-ad.txt /tmp/izzet-batch-ad/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-ad-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "frozen_control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "implemented=Whisperer of the Wilds;existing mana+activation-restriction+projected-power rails"
            echo "snapshot_run=36028474414"
            echo "snapshot_commit=7d2e9aed3345073006e6ffb837a64d96b5320a38"
            echo "unresolved_before=24"
            echo "unresolved_after=23"
            echo "unresolved_izzet_after=0"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/frf/cards/WhispererOfTheWilds.kt
            sha256sum mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/WhispererOfTheWildsScenarioTest.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/v09-position1-engine-batch-ad-gate.md
            sha256sum mtg-sets/src/test/resources/snapshots/cards/FRF.json
            sha256sum /tmp/izzet-batch-ad/test-output.txt
          } > /tmp/izzet-batch-ad/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-ad
          path: /tmp/izzet-batch-ad
          if-no-files-found: error
          retention-days: 90

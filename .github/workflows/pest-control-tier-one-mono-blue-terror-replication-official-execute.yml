name: Pest Control Tier-1 Mono-Blue Terror Replication Official Execution Retired Validation

on:
  pull_request:
    paths:
      - .github/workflows/pest-control-tier-one-mono-blue-terror-replication-official-execute.yml
      - docs/experiments/pest-control/tier-one-mono-blue-terror-replication-result.md
      - docs/experiments/pest-control/README.md

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify one-shot production trigger is retired
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/pest-control-tier-one-mono-blue-terror-replication-official-execute.yml").read_text()
          assert ("workflow" + "_dispatch") not in text
          assert "\n  push:" not in text
          assert ("github.event_name == " + "'push'") not in text
          assert ("PestControlTierOneMonoBlueTerrorReplication" + "OfficialExecutionRunnerTest") not in text
          assert ("Execute frozen twelve-game primary replication " + "exactly once") not in text
          assert ("Upload one-shot primary replication " + "evidence") not in text
          PY

      - name: Verify accepted primary replication record exists
        run: |
          set -euo pipefail
          grep -F 'Status: `ACCEPTED_PRIMARY_REPLICATION`' docs/experiments/pest-control/tier-one-mono-blue-terror-replication-result.md
          grep -F 'Pest Control finished **11-1**.' docs/experiments/pest-control/tier-one-mono-blue-terror-replication-result.md
          grep -F '`35927279604`' docs/experiments/pest-control/tier-one-mono-blue-terror-replication-result.md
          grep -F '`10780871469`' docs/experiments/pest-control/tier-one-mono-blue-terror-replication-result.md
          grep -F '`f873c808fa12c9591e2ee9657a5e048cbf3862f3bcd63fa5b0f162740809cebb`' docs/experiments/pest-control/tier-one-mono-blue-terror-replication-result.md

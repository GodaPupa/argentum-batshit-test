name: Manual Precision R9 provenance hardening witnesses (NO GAMES)
on:
  push:
    branches: [research/manual-precision-r9-provenance-hardening-20261020]
    paths:
      - '.github/workflows/manual-precision-r9-provenance-hardening-20261020.yml'
      - 'mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9ProvenanceHardeningWitnessesTest.kt'
permissions:
  contents: read
concurrency:
  group: manual-precision-r9-provenance-hardening
  cancel-in-progress: false
jobs:
  provenance-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 16}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Pin source and zero full games
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r9-provenance-evidence
          git rev-parse HEAD > r9-provenance-evidence/source-sha.txt
          git rev-parse HEAD^{tree} > r9-provenance-evidence/tree-sha.txt
          echo ZERO_FULL_GAMES > r9-provenance-evidence/budget.txt
          git merge-base --is-ancestor ad362ce4f92929beae0ca8700fff4bb62bb3d2a7 HEAD
          git diff --name-only ad362ce4f92929beae0ca8700fff4bb62bb3d2a7 HEAD > r9-provenance-evidence/delta-paths.txt
          test "$(wc -l < r9-provenance-evidence/delta-paths.txt)" -eq 2
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/manual-precision-r9-provenance-hardening-20261020.yml|mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9ProvenanceHardeningWitnessesTest.kt) ;;
              *) echo "UNAUTHORIZED_DELTA:$file"; exit 1 ;;
            esac
          done < r9-provenance-evidence/delta-paths.txt
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          chmod +x gradlew scripts/gradle-locked
      - name: Run executable provenance witnesses; preserve genuine RED exit status
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2008-2016:tests:test \
            --tests '*ManualPrecisionR9ProvenanceHardeningWitnessesTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-provenance-evidence/witnesses.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-precision-r9-provenance-hardening-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            r9-provenance-evidence/
            mtg-sets/2008-2016/tests/build/test-results/test/

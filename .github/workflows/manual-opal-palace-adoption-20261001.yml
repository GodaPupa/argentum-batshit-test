name: Manual Opal Palace exact adoption qualification
on:
  push:
    branches: ["validation/manual-opal-palace-adoption-20261001"]
    paths: [".github/workflows/manual-opal-palace-adoption-20261001.yml"]
permissions: {contents: read}
jobs:
  opal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: /tmp/manual-opal-palace-${{ github.run_id }}
      OUT: /tmp/manual-opal-palace-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: 6fd1400ea39cc9f1228a43c9d7d710630fdec46e, fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind and execute exact immutable Opal Palace suite only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6fd1400ea39cc9f1228a43c9d7d710630fdec46e
          test ! -e "$OUT" && mkdir "$OUT"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c13/cards/OpalPalace.kt)" = 544a440160528f4a08211109936a55e263c39d19
          test "$(git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/OpalPalaceScenarioTest.kt)" = 5b1be3a666cc615d8a274419479f1a885df9968c
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain :mtg-sets:2008-2016:tests:test --tests com.wingedsheep.engine.scenarios.OpalPalaceScenarioTest 2>&1 | tee "$OUT/tests.log"
          cp mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.OpalPalaceScenarioTest.xml "$OUT/"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-opal-palace-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: warn
          retention-days: 90

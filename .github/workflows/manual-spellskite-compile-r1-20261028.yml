name: Manual actual Spellskite compile R1
on:
  push:
    branches: [validation/manual-spellskite-compile-r1-20261028]
    paths: ['.github/workflows/manual-spellskite-compile-r1-20261028.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: a5c143355b97c5652699f00636c977a624e98585
  SOURCE_TREE: 1bfc97943540cca68791e4b3e3a3b082947b97e2
  WORKFLOW: .github/workflows/manual-spellskite-compile-r1-20261028.yml
  RECORD: experiments/manual-transmission/research/spellskite-card-compile-r1-20261028
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile actual Spellskite normal and mutant forms only
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-spellskite-compile-r1-${{ github.run_id }}
          path: manual-spellskite-compile-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error

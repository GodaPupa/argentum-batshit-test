name: Affinity Snapshot Export

on:
  pull_request:
    paths:
      - 'mtg-sets/**'
      - '.github/workflows/affinity-snapshot-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Rebless card snapshots
        run: ./gradlew :mtg-sets:test --tests '*CardDefinitionSnapshotTest' -DupdateSnapshots=true
      - name: Upload affected snapshots
        uses: actions/upload-artifact@v4
        with:
          name: affinity-card-snapshots
          path: |
            mtg-sets/src/test/resources/snapshots/cards/SOM.json
            mtg-sets/src/test/resources/snapshots/cards/MBS.json
            mtg-sets/src/test/resources/snapshots/cards/NEO.json
            mtg-sets/src/test/resources/snapshots/cards/MH3.json
            mtg-sets/src/test/resources/snapshots/cards/TMC.json

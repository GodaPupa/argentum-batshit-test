name: Ferocity FRA snapshot capture

on:
  push:
    branches:
      - ferocity-recycling/archetype-research
    paths:
      - mtg-sets/2026/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/fra/**
      - .github/workflows/ferocity-fra-snapshot-capture.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate reviewed FRA golden candidate
        run: |
          ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true
          test -f mtg-sets/src/test/resources/snapshots/cards/FRA.json
      - uses: actions/upload-artifact@v7
        with:
          name: ferocity-fra-golden-${{ github.sha }}
          path: mtg-sets/src/test/resources/snapshots/cards/FRA.json
          if-no-files-found: error
          retention-days: 7

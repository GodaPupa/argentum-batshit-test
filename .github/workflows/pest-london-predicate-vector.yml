name: Pest lawful London predicate vector targeted
on:
  push:
    branches: ["pest/london-predicate-vector-20260928"]
    paths: [".github/workflows/pest-london-predicate-vector.yml"]
permissions: {contents: read}
jobs:
  four-boundary-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact vector source test budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-london-predicate-vector
          test "$(git rev-parse HEAD^)" = "f4909418ddc8161f657dff11b2a303df35049f7d"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonPredicateVector.kt)" = "bb8e2247dc64a64403094c691d83b8eed53048bd"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonPredicateVectorTest.kt)" = "74a2a3ed150c8dbf50f1c31b2bb663f2eda9d520"
          test "$(git hash-object docs/experiments/pest-control/london-predicate-vector-receiving-budget.json)" = "d9a20c5d08d8481a98115b731e650dc31fd71253"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonPredicateVector.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonPredicateVectorTest.kt; git hash-object docs/experiments/pest-control/london-predicate-vector-receiving-budget.json; git hash-object .github/workflows/pest-london-predicate-vector.yml; git status --porcelain; } > build/reports/pest-london-predicate-vector/source.txt
      - name: Execute exactly four information-boundary vector cases
        shell: bash
        run: |
          set -o pipefail
          just test-class PestMonsterLondonPredicateVectorTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-london-predicate-vector/test.log
      - name: Retain exact XML
        if: always()
        run: cp gym/build/test-results/test/TEST-com.wingedsheep.gym.pest.PestMonsterLondonPredicateVectorTest.xml build/reports/pest-london-predicate-vector/ 2>/dev/null || true
      - name: Preserve original targeted evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-london-predicate-vector-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-london-predicate-vector/
          if-no-files-found: error
          retention-days: 90

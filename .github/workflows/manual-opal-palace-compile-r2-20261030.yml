name: Manual Opal Palace normal compile R2
on:
  push:
    branches: [validation/manual-opal-palace-compile-r2-20261030]
    paths: ['.github/workflows/manual-opal-palace-compile-r2-20261030.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 1831fa39f08338676f468b85123ac1641e3df5a3
  SOURCE_TREE: 6e6140b182ef13fe2c71efb902cf288b4172f67c
  WORKFLOW: .github/workflows/manual-opal-palace-compile-r2-20261030.yml
  RECORD: experiments/manual-transmission/research/opal-palace-compile-r2-20261030
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile bounded Opal source and export candidate snapshot
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-opal-palace-compile-r2-${{ github.run_id }}
          path: manual-opal-palace-compile-r2-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

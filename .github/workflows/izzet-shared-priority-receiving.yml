name: Izzet Shared Priority Receiving

on:
  push:
    branches: [mayhem/izzet-vines-targeting]
    paths:
      - '.github/workflows/izzet-shared-priority-receiving.yml'
      - 'rules-engine/src/**'
      - 'game-server/src/**'
      - 'ai/src/**'
      - 'mtg-sdk/src/**'
      - 'mtg-sets/**/src/**'
      - 'lab-coordinator/shared-capabilities/collect-priority-receiving.py'
      - 'lab-coordinator/shared-capabilities/receiving-case-banks-v1.json'
      - 'izzet-science/shared-priority-receiving/**'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        bank: [priority, cast-observer]
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      RECEIVING_BANK: ${{ matrix.bank }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b

      - name: Bind the combined source, preserved bank and frozen Izzet inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess, urllib.request
          bank = os.environ['RECEIVING_BANK']
          manifest_path = pathlib.Path(f'izzet-science/shared-priority-receiving/{bank}.json')
          manifest = json.loads(manifest_path.read_text())
          out = pathlib.Path(f'build/reports/izzet-shared-receiving/{bank}')
          out.mkdir(parents=True)
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          observed = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
                      if pathlib.Path(p).is_file() else None for p in manifest['source_files_sha256']}
          binding = {'candidate_head': head, 'expected_head': os.environ['GITHUB_SHA'], 'tree': tree,
              'manifest_sha256': hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              'source_files_sha256': observed, 'bank': bank, 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'gameplay_authorized': False,
              'official_initializations': 0, 'outcome_exposure': 0}
          (out/'binding-attempt.json').write_text(json.dumps(binding, indent=2)+'\n')
          (out/'source-manifest.json').write_bytes(manifest_path.read_bytes())
          assert head == os.environ['GITHUB_SHA']
          assert not subprocess.check_output(['git','status','--porcelain'], text=True).strip()
          subprocess.run(['git','merge-base','--is-ancestor',manifest['accepted_izzet_base'],head], check=True)
          assert observed == manifest['source_files_sha256'], observed
          banks_path = pathlib.Path('lab-coordinator/shared-capabilities/receiving-case-banks-v1.json')
          assert hashlib.sha256(banks_path.read_bytes()).hexdigest() == manifest['case_bank_sha256']
          assert manifest['stages'] == json.loads(banks_path.read_text())['banks'][bank]
          for authority in manifest['preserved_manifests']:
              assert hashlib.sha256(pathlib.Path(authority['path']).read_bytes()).hexdigest() == authority['sha256']
          for p,h in manifest['frozen_deck_hashes'].items():
              assert observed[p] == h
          request = urllib.request.Request(manifest['rules']['source_url'], headers={'User-Agent':'Argentum-rules-validation/1.0'})
          with urllib.request.urlopen(request, timeout=45) as response:
              rules = response.read()
          (out/'effective-rules.txt').write_bytes(rules)
          assert len(rules) == manifest['rules']['byte_length']
          assert hashlib.sha256(rules).hexdigest() == manifest['rules']['sha256']
          binding['rules'] = manifest['rules']
          binding['rules_verified_utc_date'] = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          (out/'source-provenance.json').write_text(json.dumps(binding, indent=2)+'\n')
          PY

      - name: Execute the complete preserved bank on the receiving source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "build/reports/izzet-shared-receiving/$RECEIVING_BANK/commands.txt"
          import json, os, pathlib, shutil, subprocess
          bank = os.environ['RECEIVING_BANK']
          manifest = json.loads(pathlib.Path(f'izzet-science/shared-priority-receiving/{bank}.json').read_text())
          out = pathlib.Path(f'build/reports/izzet-shared-receiving/{bank}')
          stages = manifest['stages']
          groups = [[stage] for stage in stages] if bank == 'priority' else [
              [stage for stage in stages if stage['module'] == module] for module in ('rules-engine','game-server')]
          failed = False
          for group in groups:
              assert group
              args = ['just','test-class',group[0]['class'].split('.')[-1]]
              for stage in group[1:]:
                  args += ['--tests','*'+stage['class'].split('.')[-1]]
              args += ['--rerun','--max-workers=1','-PkotlinCompileParallelism=1',
                  '-Pkotlin.compiler.execution.strategy=in-process','-Dorg.gradle.jvmargs=-Xmx4g','--info','--stacktrace']
              result = subprocess.run(args)
              failed = failed or result.returncode != 0
              for stage in group:
                  dest = out/'tests'/stage['stage']
                  dest.mkdir(parents=True)
                  (dest/'exit-status.txt').write_text(str(result.returncode)+'\n')
                  xml = pathlib.Path(stage['module'])/'build/test-results/test'/('TEST-'+stage['class']+'.xml')
                  if xml.is_file():
                      shutil.copy2(xml,dest/xml.name)
                  else:
                      failed = True
          raise SystemExit(1 if failed else 0)
          PY

      - name: Audit actual case completeness and final source binding
        if: always()
        shell: bash
        run: |
          python3 lab-coordinator/shared-capabilities/collect-priority-receiving.py \
            --bank "$RECEIVING_BANK" \
            --manifest "izzet-science/shared-priority-receiving/$RECEIVING_BANK.json" \
            --output "build/reports/izzet-shared-receiving/$RECEIVING_BANK"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: izzet-shared-receiving-${{ matrix.bank }}-${{ github.sha }}
          path: build/reports/izzet-shared-receiving/${{ matrix.bank }}
          if-no-files-found: error
          retention-days: 90

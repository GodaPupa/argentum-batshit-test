name: Izzet Capsize on qualified buyback head
on:
  push:
    branches: ["validation/izzet-capsize-buyback-validation-20261002"]
    paths: [".github/workflows/izzet-capsize-buyback-validation-20261002.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUT: /tmp/izzet-capsize-buyback-${{ github.run_id }}
      GRADLE_USER_HOME: /tmp/izzet-capsize-buyback-gradle-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind exact Capsize candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$OUT"
          test "$(git rev-parse HEAD^)" = "28f0540c8f29ac51fb07276692c7eb4ec681a719"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/izzet-capsize-buyback-validation-20261002.yml"
          test "$(git rev-parse HEAD^^)" = "e5dc2d19adf9e6277214f2e8654ff82d25413c97"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/tmp/cards/Capsize.kt)" = "d2add4a72b0c572d9b0ae87ac15ac91ec55d04db"
          test "$(git hash-object mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/CapsizeScenarioTest.kt)" = "eff112643ab8dfc91cd2721df21e12fa1e71af63"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/KeywordAbility.kt)" = "88245f2b5499bc517f5b5ae6b93b8cbdf83bcb5b"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt)" = "67c64d6a81c90e1c0dba4b5333d2675c59e15c3f"
          git rev-parse HEAD HEAD^{tree} HEAD^ HEAD^^ > "$OUT/source.txt"
          printf '%s\n' 'EXACT_CARD_AUTHOR_VALIDATION_AND_ZERO_SEED_REGISTRY_ONLY_NO_GAMEPLAY_AUTHORITY' > "$OUT/authority.txt"
      - name: Compile affected shard and registry test source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:1993-1999:tests:compileTestKotlin :gym:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
      - name: Run exact Capsize scenario
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:1993-1999:tests:test --tests com.wingedsheep.engine.scenarios.CapsizeScenarioTest 2>&1 | tee "$OUT/card.log"
          cp mtg-sets/1993-1999/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.CapsizeScenarioTest.xml "$OUT/"
      - name: Reinventory Position-1
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :gym:test --tests com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest 2>&1 | tee "$OUT/registry.log"
          rc=${PIPESTATUS[0]}
          set -e
          XML=gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml
          test -f "$XML"
          cp "$XML" "$OUT/"
          REGISTRY_RC="$rc" python3 - <<'PY'
          import json,os,pathlib,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ["OUT"])
          root=ET.parse(out/"TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml").getroot()
          assert int(root.attrib["tests"]) == 55
          suffix=" is registered in current runtime"
          registered=[]; missing=[]
          for case in root.iter("testcase"):
              name=case.attrib["name"]
              card=name[:-len(suffix)] if name.endswith(suffix) else name
              (registered if case.find("failure") is None and case.find("error") is None else missing).append(card)
          expected={"Benevolent Blessing","Cosmic Hunger","Everflowing Chalice","Lose Focus","Rolling Thunder","Skred","Snake Umbra","Shattering Pulse"}
          assert set(missing)==expected, (len(registered),len(missing),sorted(missing))
          assert len(registered)==47 and len(missing)==8
          assert "Capsize" in registered
          (out/"registry-summary.json").write_text(json.dumps({
              "registered":len(registered),
              "missing":len(missing),
              "missing_names":sorted(missing),
              "gradle_exit_code":int(os.environ["REGISTRY_RC"]),
              "official_counters_delta":{"allocations":0,"claims":0,"games":0,"outcomes":0},
          },indent=2,sort_keys=True)+"\n")
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-capsize-buyback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

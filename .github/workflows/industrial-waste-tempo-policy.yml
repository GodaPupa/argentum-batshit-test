name: Industrial Waste — Tempo A Policy Readiness

on:
  push:
    branches:
      - industrial-waste/lab
    paths:
      - .github/workflows/industrial-waste-tempo-policy.yml
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteTempoPolicyAuditTest.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteAdvisorModule.kt
      - ai/src/main/kotlin/com/wingedsheep/ai/engine/Strategist.kt
      - ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/CardAdvisor.kt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tempo-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@v3
      - name: Run Tempo A policy fixtures
        run: just test-class IndustrialWasteTempoPolicyAuditTest


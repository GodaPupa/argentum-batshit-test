name: Manual Precision R9 provenance repair validation (NO GAMES)
on:
  push:
    branches: [research/manual-precision-r9-provenance-repair-20261020]
    paths:
      - '.github/workflows/manual-precision-r9-provenance-repair-20261020.yml'
      - 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/**'
permissions:
  contents: read
concurrency:
  group: manual-precision-r9-provenance-repair
  cancel-in-progress: false
jobs:
  provenance-witnesses-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R4_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 32}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Pin source, immutable witnesses, allowed delta and budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r9-repair-evidence
          test "$GITHUB_REF" = "refs/heads/research/manual-precision-r9-provenance-repair-20261020"
          git rev-parse HEAD > r9-repair-evidence/source-sha.txt
          git rev-parse HEAD^{tree} > r9-repair-evidence/tree-sha.txt
          git merge-base --is-ancestor 62a322af07881f948e66b70e654787ccba0271b2 HEAD
          git diff --name-only 62a322af07881f948e66b70e654787ccba0271b2 HEAD > r9-repair-evidence/delta-paths.txt
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/manual-precision-r9-provenance-repair-20261020.yml|rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt|rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaAbilitySideEffectExecutor.kt) ;;
              *) echo "UNAUTHORIZED_DELTA:$file"; exit 1 ;;
            esac
          done < r9-repair-evidence/delta-paths.txt
          test "$(wc -l < r9-repair-evidence/delta-paths.txt)" -eq 3
          test "$(git rev-parse HEAD:mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9ProvenanceHardeningWitnessesTest.kt)" = "34e336056c0fee43d9849c1a1791fcf902f68e2f"
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = "7984a2e87d8ddbe023d45620414d25a61691a040"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          echo ZERO_FULL_GAMES > r9-repair-evidence/budget.txt
          chmod +x gradlew scripts/gradle-locked
      - name: Original four unchanged provenance witnesses
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2008-2016:tests:cleanTest :mtg-sets:2008-2016:tests:test \
            --tests '*ManualPrecisionR9ProvenanceHardeningWitnessesTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-repair-evidence/witnesses.log
      - name: Snapshot original witness JUnit BEFORE any later test run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r9-repair-evidence/witness-junit
          cp -a mtg-sets/2008-2016/tests/build/test-results/test/. r9-repair-evidence/witness-junit/
          test -n "$(find r9-repair-evidence/witness-junit -name 'TEST-*ManualPrecisionR9ProvenanceHardeningWitnessesTest.xml' -print -quit)"
      - name: Adjacent R9 mana Confluence and original internal-cost witnesses
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2008-2016:tests:cleanTest :mtg-sets:2008-2016:tests:test \
            --tests '*ManaConfluenceScenarioTest' --tests '*ManualPrecisionR9ManaHeldoutScenarioTest' \
            --tests '*ManualPrecisionR9InternalManaCostScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-repair-evidence/adjacent-mana.log
      - name: Hidden Grotto existing regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2024:tests:test \
            --tests '*HiddenGrottoTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-repair-evidence/hidden-grotto.log
      - name: City of Brass existing regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:1993-1999:tests:test \
            --tests '*CityOfBrassScenarioTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-repair-evidence/city-of-brass.log
      - name: Ashiok existing regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2023:tests:test \
            --tests '*AshiokWickedManipulatorScenarioTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-repair-evidence/ashiok-replacement.log
      - name: R5 Pact Ballista Statue Encore combat and composition protections
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualPactDebt*Test' --tests '*ManualBallista*Test' \
            --tests '*ManualStatue*Test' --tests '*ManualResolutionPaymentRegressionTest' \
            --tests '*ManualR5CandidateCompositionTest' --tests '*ManualEncoreRegressionTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-repair-evidence/r5-safety.log
          mkdir -p r9-repair-evidence/r5-junit
          cp -a ai/build/test-results/test/. r9-repair-evidence/r5-junit/
      - name: Original CONTROL versus A initializer parity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualPrecisionR1PreflightTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-repair-evidence/initializer-parity.log
      - name: Preserve original JUnit logs and source even on RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-precision-r9-provenance-repair-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            r9-repair-evidence/
            mtg-sets/2008-2016/tests/build/test-results/test/
            mtg-sets/2024/tests/build/test-results/test/
            mtg-sets/1993-1999/tests/build/test-results/test/
            mtg-sets/2023/tests/build/test-results/test/
            ai/build/test-results/test/

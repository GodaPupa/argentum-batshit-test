name: Pest Monster Actor Receiving Diagnostics

on:
  push:
    branches: [lab/pest-monster-actor-component]
  pull_request:
    paths:
      - .github/workflows/pest-monster-actor-receiving.yml
      - docs/experiments/pest-control/monster-actor-component/**
      - ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/modules/PestMonsterTron*.kt
      - gym/src/main/kotlin/com/wingedsheep/gym/pest/**
      - gym/src/test/kotlin/com/wingedsheep/gym/pest/**

permissions:
  contents: read

concurrency:
  group: pest-monster-actor-receiving-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b

      - name: Require independent fixed-bank freeze and exact clean source
        run: python3 docs/experiments/pest-control/monster-actor-component/collect-receiving.py bind

      - name: Execute the same 10 new and 62 preserved cases once
        shell: bash
        run: |
          set -uo pipefail
          set +e
          just test-class 'PestMonsterTron*Test' --tests '*PestControlTierOneMonsterTronPolicyCalibrationTest' --tests '*ActorObservationBoundaryTest' --tests '*ActorStackSourceObservationTest' --tests '*ActorTriggerOrderObservationTest' --tests '*ActorPriorityObservationTest' --rerun --max-workers=1 -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g --info --stacktrace 2>&1 | tee build/reports/pest-monster-actor-receiving/tests.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > build/reports/pest-monster-actor-receiving/test-exit-code.txt
          exit "$result"

      - name: Retain actual cases failures and unresolved ordering disposition
        if: always()
        run: python3 docs/experiments/pest-control/monster-actor-component/collect-receiving.py collect

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pest-monster-actor-receiving-${{ github.sha }}
          path: |
            build/reports/pest-monster-actor-receiving/
            ai/build/test-results/test/TEST-*.xml
            gym/build/test-results/test/TEST-*.xml
          if-no-files-found: error
          retention-days: 90

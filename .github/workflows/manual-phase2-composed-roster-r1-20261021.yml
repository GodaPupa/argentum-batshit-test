name: Manual Phase 2 composed cards and live 800-card registry (90 CASES, NO GAMES)
on:
  push:
    branches: [candidate/manual-phase2-composed-roster-r1-20261021]
    paths:
      - '.github/workflows/manual-phase2-composed-roster-r1-20261021.yml'
      - 'experiments/manual-transmission/research/phase2-current-main-20261021/COMPOSED_ROSTER_R1_PROTOCOL.json'
      - 'experiments/manual-transmission-phase2/**'
      - 'gym/src/test/kotlin/com/wingedsheep/gym/ManualTransmissionPhaseTwoRegistryAuditTest.kt'
      - 'mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/fut/cards/PactOfNegation.kt'
      - 'mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/PactOfNegation*ScenarioTest.kt'
      - 'mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ths/cards/SwanSong.kt'
      - 'mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/SwanSongScenarioTest.kt'
permissions:
  contents: read
  actions: read
concurrency:
  group: manual-phase2-composed-r1-source-qualified-eight-hundreds
  cancel-in-progress: false

jobs:
  composed-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 40}
      - name: Bind qualified parent, exactly 12 new files and every frozen donor identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p composed-source
          test "$GITHUB_REF" = 'refs/heads/candidate/manual-phase2-composed-roster-r1-20261021'
          git merge-base --is-ancestor 33778a86016c7160a890dd89dbecb6ebef1a6a77 HEAD
          git rev-parse HEAD > composed-source/source-sha.txt
          git rev-parse HEAD^{tree} > composed-source/tree-sha.txt
          git diff --name-only 33778a86016c7160a890dd89dbecb6ebef1a6a77 HEAD > composed-source/changed-paths.txt
          python3 - <<'PY' | tee composed-source/source-verification.log
          import json,subprocess
          from pathlib import Path
          p=json.loads(Path("experiments/manual-transmission/research/phase2-current-main-20261021/COMPOSED_ROSTER_R1_PROTOCOL.json").read_text())
          assert p["schema"]=="ARGENTUM_MANUAL_PHASE2_COMPOSED_ROSTER_REGISTRY_AND_MECHANICS_V1"
          assert p["status"]=="PREREGISTERED_BEFORE_PACT_SWAN_OR_REGISTRY_TOOL_RECEIVING"
          assert p["parent_sha"]=="33778a86016c7160a890dd89dbecb6ebef1a6a77"
          assert p["test_design"]["new_exact_card_tests"]==8
          assert sum(p["test_design"]["new_pact_suites"].values())+sum(p["test_design"]["new_swan_suites"].values())==8
          for path,hash in {**p["donor_files"],**p["source_only_registry_tool_receive"]}.items():
              actual=subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
              assert actual==hash,(path,actual,hash)
          expected=set(p["donor_files"])|set(p["source_only_registry_tool_receive"])|{
              "experiments/manual-transmission/research/phase2-current-main-20261021/COMPOSED_ROSTER_R1_PROTOCOL.json",
              "experiments/manual-transmission-phase2/audit_composed_registry_gate.py",
              ".github/workflows/manual-phase2-composed-roster-r1-20261021.yml"}
          changed=set(Path("composed-source/changed-paths.txt").read_text().splitlines())
          assert len(changed)==12 and changed==expected,(len(changed),sorted(changed^expected))
          for path,hash in {
              "experiments/manual-transmission/control/v0.7.decklist.txt":p["unchanged_inherited_sources"]["control_deck"],
              "ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt":p["unchanged_inherited_sources"]["default_ai_profile"],
              "rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt":p["unchanged_inherited_sources"]["mana_solver"],
              "rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/spell/CastSpellHandler.kt":p["unchanged_inherited_sources"]["land_cast_guard"],
              "rules-engine/src/testFixtures/kotlin/com/wingedsheep/engine/support/SerializationTestSupport.kt":p["unchanged_inherited_sources"]["original_donor_fixture_helper"],
              "rules-engine/src/main/kotlin/com/wingedsheep/engine/event/TriggerDetector.kt":p["unchanged_inherited_sources"]["main_event_detector_known_unfixed"]}.items():
              actual=subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
              assert actual==hash,(path,actual,hash)
          assert p["full_game_guardrails"]["no_original_full_games"] and p["full_game_guardrails"]["no_official_seeds"]
          assert p["full_game_guardrails"]["precision_reserved"]==2
          print("COMPOSED_ROSTER_SOURCE_PINNED_12_FILE_NO_GAME_PASS")
          PY
          echo 'Official capability 0/36, primary 0/864. Precision 10/12 used and 2 reserved. No new games/seeds/AI/roster/main merge.' > composed-source/budget.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-composed-r1-source-${{ github.run_id }}
          path: composed-source/
          retention-days: 30
          if-no-files-found: warn

  all-original-mechanics:
    needs: composed-source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        era: ["1993-1999", "2003-2007", "2008-2016", "2017-2022"]
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R4_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Re-execute all predeclared inherited and newly composed original scenarios
        shell: bash
        run: |
          set -euo pipefail
          era="${{ matrix.era }}"
          mkdir -p "composed-tests/$era/xml"
          case "$era" in
            "1993-1999") names=(WildGrowthScenarioTest) ;;
            "2003-2007") names=(CoilingOracleScenarioTest UtopiaSprawlScenarioTest PactOfNegationScenarioTest PactOfNegationUnpaidScenarioTest) ;;
            "2008-2016") names=(ArborElfScenarioTest NestInvaderScenarioTest ManualTransmissionLandSpellGuardScenarioTest AnimarSoulOfElementsScenarioTest AncestralStatueScenarioTest SwanSongScenarioTest) ;;
            "2017-2022") names=(ParadiseDruidScenarioTest RejuvenatingSpringsScenarioTest TrainingCenterScenarioTest SpireGardenScenarioTest WalkingBallistaScenarioTest) ;;
            *) echo 'Invalid non-preregistered era'; exit 1 ;;
          esac
          args=()
          for n in "${names[@]}"; do args+=(--tests "*$n"); done
          chmod +x gradlew scripts/gradle-locked
          scripts/gradle-locked ":mtg-sets:$era:tests:cleanTest" ":mtg-sets:$era:tests:test" \
            "${args[@]}" -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee "composed-tests/$era/focused-tests.log"
      - name: Archive original JUnit by era before later invocations
        if: always()
        shell: bash
        run: |
          era="${{ matrix.era }}"
          mkdir -p "composed-tests/$era/xml"
          cp -a "mtg-sets/$era/tests/build/test-results/test/." "composed-tests/$era/xml/" || true
      - name: Independently prove strict unique case counts in this module
        if: success()
        shell: bash
        env: {ERA: "${{ matrix.era }}"}
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "composed-tests/$ERA/case-reconciliation.log"
          from pathlib import Path
          import os,xml.etree.ElementTree as ET
          known={
           "1993-1999":{"WildGrowthScenarioTest":8},
           "2003-2007":{"CoilingOracleScenarioTest":8,"UtopiaSprawlScenarioTest":8,"PactOfNegationScenarioTest":3,"PactOfNegationUnpaidScenarioTest":1},
           "2008-2016":{"ArborElfScenarioTest":8,"NestInvaderScenarioTest":4,"ManualTransmissionLandSpellGuardScenarioTest":2,"AnimarSoulOfElementsScenarioTest":6,"AncestralStatueScenarioTest":2,"SwanSongScenarioTest":4},
           "2017-2022":{"ParadiseDruidScenarioTest":4,"RejuvenatingSpringsScenarioTest":10,"TrainingCenterScenarioTest":10,"SpireGardenScenarioTest":10,"WalkingBallistaScenarioTest":2}}
          era=os.environ["ERA"]
          assert era in known and sum(known[era].values()) in (8,20,26,36)
          counted=0
          for klass,expected in known[era].items():
              p=Path("composed-tests")/era/"xml"/("TEST-com.wingedsheep.engine.scenarios."+klass+".xml")
              assert p.is_file(),("Exact JUnit missing",str(p))
              x=ET.parse(p).getroot()
              cases=x.findall(".//testcase")
              assert len(cases)==expected,(klass,len(cases),expected)
              assert len({(c.get("classname"),c.get("name")) for c in cases})==expected,(klass,"duplicate case")
              assert not x.findall(".//failure") and not x.findall(".//error") and not x.findall(".//skipped"),klass
              assert all(int(x.get(k,"0"))==0 for k in ("failures","errors","skipped")),klass
              counted+=expected
              print(klass,expected,"PASS")
          assert counted==sum(known[era].values())
          print("COMPOSED_R1_EXACT_ERA_GREEN",era,counted)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-composed-r1-mechanics-${{ github.run_id }}-${{ matrix.era }}
          path: composed-tests/
          retention-days: 30
          if-no-files-found: warn

  eight-exact-100-registry:
    needs: composed-source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MT_P2_AUDIT_INPUT: ${{ github.workspace }}/composed-registry/source/registry-requests.json
      MT_P2_AUDIT_OUTPUT: ${{ github.workspace }}/composed-registry/registry
      MT_P2_GATE_OUTPUT: ${{ github.workspace }}/composed-registry
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 50}
      - uses: actions/checkout@v4
        with:
          ref: e7d37e2ea0f18dfa8d6b0fff68ef816b59555d2d
          path: .phase1-source
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: experiments/manual-transmission
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Rebuild all original opponent and Manual immutable card names without sampled games
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p composed-registry/source composed-registry/registry
          test "$(git -C .phase1-source rev-parse HEAD)" = e7d37e2ea0f18dfa8d6b0fff68ef816b59555d2d
          python3 experiments/manual-transmission-phase2/bootstrap_audit.py \
            --phase1 .phase1-source --out composed-registry/source \
            2>&1 | tee composed-registry/source-bootstrap.log
      - name: Execute same original 800-slot Kotlin CardRegistry inventory against composed source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/gradle-locked
          scripts/gradle-locked :gym:cleanTest :gym:test \
            --tests '*ManualTransmissionPhaseTwoRegistryAuditTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee composed-registry/live-registry-gradle.log
      - name: Independently rejoin all eight original 100s to actual source-qualified definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/manual-transmission-phase2/audit_composed_registry_gate.py \
            2>&1 | tee composed-registry/independent-registry-audit.log
          cat composed-registry/COMPOSED_R1_REPORT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-composed-r1-registry-${{ github.run_id }}
          path: |
            composed-registry/
            gym/build/test-results/test/TEST-com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest.xml
          retention-days: 30
          if-no-files-found: warn

  independent-admission-disposition:
    needs: [composed-source-integrity,all-original-mechanics,eight-exact-100-registry]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          pattern: manual-composed-r1-mechanics-${{ github.run_id }}-*
          path: combined-mechanics
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: manual-composed-r1-registry-${{ github.run_id }}
          path: combined-registry
      - name: Require all 90 exact card cases plus full 800-slot audit and enforce admission HOLD
        shell: bash
        env:
          SOURCE_STATUS: ${{ needs.composed-source-integrity.result }}
          MECHANICS_STATUS: ${{ needs.all-original-mechanics.result }}
          REGISTRY_STATUS: ${{ needs.eight-exact-100-registry.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,os,xml.etree.ElementTree as ET
          assert os.environ["SOURCE_STATUS"]=="success",os.environ["SOURCE_STATUS"]
          assert os.environ["MECHANICS_STATUS"]=="success",os.environ["MECHANICS_STATUS"]
          assert os.environ["REGISTRY_STATUS"]=="success",os.environ["REGISTRY_STATUS"]
          expected={
           "1993-1999":{"WildGrowthScenarioTest":8},
           "2003-2007":{"CoilingOracleScenarioTest":8,"UtopiaSprawlScenarioTest":8,"PactOfNegationScenarioTest":3,"PactOfNegationUnpaidScenarioTest":1},
           "2008-2016":{"ArborElfScenarioTest":8,"NestInvaderScenarioTest":4,"ManualTransmissionLandSpellGuardScenarioTest":2,"AnimarSoulOfElementsScenarioTest":6,"AncestralStatueScenarioTest":2,"SwanSongScenarioTest":4},
           "2017-2022":{"ParadiseDruidScenarioTest":4,"RejuvenatingSpringsScenarioTest":10,"TrainingCenterScenarioTest":10,"SpireGardenScenarioTest":10,"WalkingBallistaScenarioTest":2}}
          count=0
          for era,classes in expected.items():
              for name,n in classes.items():
                  path=Path("combined-mechanics")/era/"xml"/("TEST-com.wingedsheep.engine.scenarios."+name+".xml")
                  assert path.is_file(),str(path)
                  root=ET.parse(path).getroot()
                  cases=root.findall(".//testcase")
                  assert len(cases)==n,(name,len(cases),n)
                  assert not root.findall(".//failure") and not root.findall(".//error") and not root.findall(".//skipped"),name
                  count+=n
          assert count==90,count
          result=json.loads(Path("combined-registry/composed-registry/COMPOSED_R1_LIVE_REGISTRY_GATE.json").read_text())
          assert result["schema"]=="ARGENTUM_MANUAL_PHASE2_COMPOSED_ROSTER_REGISTRY_GATE_RESULT_V1"
          assert result["totals"]["requested_slots"]==800
          assert result["totals"]["registered_slots"]+result["totals"]["unregistered_slots"]==800
          assert result["actual_games_initialized"]==0 and result["official_results"]==0
          assert result["status"] in ("HOLD_REGISTRY_COVERAGE","HOLD_SEMANTIC_AND_PILOT_ADMISSION")
          result["composed_original_mechanics_cases"]=count
          result["source_qualified_inheritance"]=dict(core_three=10,development_nine_and_land_guard=72,pact=4,swan_song=4)
          result["decision"]="COMPONENT_SCENARIOS_QUALIFIED_REGISTRY_AUDITED_NO_OFFICIAL_GAME_ADMISSION"
          out=Path("COMPOSED_R1_FINAL_ADMISSION.json")
          out.write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print("COMPOSED_R1_90_90_MECHANICS_AND_800_SLOT_REGISTRY_GREEN",json.dumps(result["totals"],sort_keys=True),"NO_GAMES")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-composed-r1-final-${{ github.run_id }}
          path: COMPOSED_R1_FINAL_ADMISSION.json
          retention-days: 30
          if-no-files-found: warn

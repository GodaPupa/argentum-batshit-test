name: Industrial seed-free classloader topology capture
on:
  push:
    branches: ["industrial-waste/r1-manifest-capture-20260928"]
    paths: [".github/workflows/industrial-classloader-topology-capture.yml"]
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact topology probes budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/industrial-classloader-topology
          test "$(git rev-parse HEAD^)" = "ee40bffc29f973a722073954679dfb9eefee4905"
          test "$(git hash-object ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2ClassloaderTopologyCaptureTest.kt)" = "eee28d377387df5b07cb00c9adc111e975d14188"
          test "$(git hash-object industrial-waste/v2/r1-classloader-topology-capture-budget.json)" = "8bd543dff47a888c54e8c5132a9c4d0e336acdc3"
          test "$(git hash-object industrial-waste/v2/capture_gradle_daemon_topology.gradle)" = "4cda6059d86b2393b0144dca2fb496fcb7817221"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2ClassloaderTopologyCaptureTest.kt; git hash-object industrial-waste/v2/r1-classloader-topology-capture-budget.json; git hash-object industrial-waste/v2/capture_gradle_daemon_topology.gradle; git hash-object .github/workflows/industrial-classloader-topology-capture.yml; git status --porcelain; } > build/reports/industrial-classloader-topology/source.txt
      - name: Capture actual Gradle daemon topology
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -I industrial-waste/v2/capture_gradle_daemon_topology.gradle industrialCaptureDaemonTopology --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/industrial-classloader-topology/daemon.log
      - name: Capture actual AI test-worker topology
        shell: bash
        run: |
          set -o pipefail
          just test-class IndustrialWasteV2ClassloaderTopologyCaptureTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/industrial-classloader-topology/worker.log
      - name: Preserve XML
        if: always()
        shell: bash
        run: |
          find . -path '*/build/test-results/test/TEST-com.wingedsheep.ai.industrialwaste.IndustrialWasteV2ClassloaderTopologyCaptureTest.xml' -type f -exec cp {} build/reports/industrial-classloader-topology/ \; || true
      - name: Preserve original topology capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-classloader-topology-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/industrial-classloader-topology/
          if-no-files-found: error
          retention-days: 90

name: Manual Precision R9 final source-bound qualification (NO GAMES)
on:
  push:
    branches: [research/manual-precision-r9-final-qualification-20261020]
    paths:
      - '.github/workflows/manual-precision-r9-final-qualification-20261020.yml'
permissions:
  contents: read
concurrency:
  group: manual-precision-r9-final-qualification-20261020
  cancel-in-progress: false
jobs:
  fetched-shock-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 32}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Source-bound zero-game identity and allowed delta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r9-final-fetch
          test "$GITHUB_REF" = "refs/heads/research/manual-precision-r9-final-qualification-20261020"
          git rev-parse HEAD > r9-final-fetch/source-sha.txt
          git rev-parse HEAD^{tree} > r9-final-fetch/tree-sha.txt
          git merge-base --is-ancestor 3594259d81212801f3f8286bcc74b7bbcb26b60c HEAD
          git diff --name-only 3594259d81212801f3f8286bcc74b7bbcb26b60c HEAD > r9-final-fetch/delta-paths.txt
          test "$(cat r9-final-fetch/delta-paths.txt)" = ".github/workflows/manual-precision-r9-final-qualification-20261020.yml"
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt)" = "dc85e6280c3c84c7f587cba411be05ae44697b0d"
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaAbilitySideEffectExecutor.kt)" = "e34ab8703aeace3dd7930c8222c1937237a08b05"
          test "$(git rev-parse HEAD:mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9ProvenanceHardeningWitnessesTest.kt)" = "34e336056c0fee43d9849c1a1791fcf902f68e2f"
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = "7984a2e87d8ddbe023d45620414d25a61691a040"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          echo ZERO_FULL_GAMES > r9-final-fetch/budget.txt
          chmod +x gradlew scripts/gradle-locked
      - name: R9 heldout fetch and original Misty Rainforest
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2008-2016:tests:cleanTest :mtg-sets:2008-2016:tests:test \
            --tests '*ManualPrecisionR9FetchHeldoutScenarioTest' --tests '*MistyRainforestScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-final-fetch/heldout-misty.log
      - name: Original Wooded Foothills
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2000-2002:tests:cleanTest :mtg-sets:2000-2002:tests:test \
            --tests '*WoodedFoothillsScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-final-fetch/wooded.log
      - name: Hand-played Breeding Pool Steam Vents Stomping Ground
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2003-2007:tests:cleanTest :mtg-sets:2003-2007:tests:test \
            --tests '*BreedingPoolScenarioTest' --tests '*SteamVentsScenarioTest' --tests '*StompingGroundScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-final-fetch/shocks.log
      - name: Preserve fetched-shock original JUnit on success and RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-precision-r9-final-fetch-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            r9-final-fetch/
            mtg-sets/2008-2016/tests/build/test-results/test/
            mtg-sets/2000-2002/tests/build/test-results/test/
            mtg-sets/2003-2007/tests/build/test-results/test/
  restricted-mana-grants-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 32}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Source-bound zero-game identity and allowed delta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r9-final-restrictions
          test "$GITHUB_REF" = "refs/heads/research/manual-precision-r9-final-qualification-20261020"
          git rev-parse HEAD > r9-final-restrictions/source-sha.txt
          git rev-parse HEAD^{tree} > r9-final-restrictions/tree-sha.txt
          git merge-base --is-ancestor 3594259d81212801f3f8286bcc74b7bbcb26b60c HEAD
          git diff --name-only 3594259d81212801f3f8286bcc74b7bbcb26b60c HEAD > r9-final-restrictions/delta-paths.txt
          test "$(cat r9-final-restrictions/delta-paths.txt)" = ".github/workflows/manual-precision-r9-final-qualification-20261020.yml"
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt)" = "dc85e6280c3c84c7f587cba411be05ae44697b0d"
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaAbilitySideEffectExecutor.kt)" = "e34ab8703aeace3dd7930c8222c1937237a08b05"
          test "$(git rev-parse HEAD:mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9ProvenanceHardeningWitnessesTest.kt)" = "34e336056c0fee43d9849c1a1791fcf902f68e2f"
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = "7984a2e87d8ddbe023d45620414d25a61691a040"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          echo ZERO_FULL_GAMES > r9-final-restrictions/budget.txt
          chmod +x gradlew scripts/gradle-locked
      - name: Steelswarm Operator restricted dual abilities
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2025:tests:cleanTest :mtg-sets:2025:tests:test \
            --tests '*SteelswarmOperatorTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-final-restrictions/steelswarm.log
      - name: Real unlocked Greenhouse granted mana ability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2024:tests:cleanTest :mtg-sets:2024:tests:test \
            --tests '*GreenhouseRicketyGazeboTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-final-restrictions/greenhouse.log
      - name: Rules-engine mana provenance and monocolor hybrid regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :rules-engine:cleanTest :rules-engine:test \
            --tests '*ManaSourceProvenanceScenarioTest' --tests '*MonocolorHybridManaSolverTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-final-restrictions/source-provenance.log
      - name: Preserve restrictions and provenance original JUnit on GREEN/RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-precision-r9-final-restrictions-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            r9-final-restrictions/
            mtg-sets/2025/tests/build/test-results/test/
            mtg-sets/2024/tests/build/test-results/test/
            rules-engine/build/test-results/test/

name: Manual current registry after Opal
on:
  push:
    branches: ["validation/manual-registry-after-opal-20261001"]
    paths: [".github/workflows/manual-registry-after-opal-20261001.yml"]
permissions: {contents: read}
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_USER_HOME: /tmp/manual-registry-opal-${{ github.run_id }}
      OUT: /tmp/manual-registry-opal-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: 87e2cab93c9d1652deca3e19cbad1d1ef49be93c, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@v6
        with:
          ref: e7d37e2ea0f18dfa8d6b0fff68ef816b59555d2d
          path: .phase1-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Run exact registry inventory only
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = 87e2cab93c9d1652deca3e19cbad1d1ef49be93c
          test ! -e "$OUT" && mkdir "$OUT"
          python3 experiments/manual-transmission-phase2/bootstrap_audit.py --phase1 .phase1-source --out "$OUT/source"
          MT_P2_AUDIT_INPUT="$OUT/source/registry-requests.json" MT_P2_AUDIT_OUTPUT="$OUT/registry"             bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :gym:test --tests com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest 2>&1 | tee "$OUT/test.log"
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest.xml "$OUT/"
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['OUT']); report=json.loads((out/'registry/registry-report.json').read_text())
          rows=[]
          for d in report['decks']:
              missing=[c['requested_name'] for c in d['cards'] if not c['registry_resolved']]
              rows.append({'deck_id':d['deck_id'],'missing':len(missing),'missing_names':missing})
          summary={'schema':'manual-registry-after-opal-v1','authority':'REGISTRY_ONLY',
              'decks':rows,'total_missing_physical':sum(x['missing'] for x in rows),
              'opal_palace_missing_in_manual':any('Opal Palace' in x['missing_names'] for x in rows),
              'official_games_initialized':0,'official_outcomes':0}
          (out/'summary.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n')
          assert not summary['opal_palace_missing_in_manual']
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-registry-after-opal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: warn
          retention-days: 90

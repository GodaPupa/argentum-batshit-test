name: Manual Phase 2 unique Animar commander cast
on:
  push:
    branches: ["manual/clean-pilot-boundary-receiving-20260927"]
    paths: [".github/workflows/manual-unique-animar-command-cast.yml"]
permissions: {contents: read}
jobs:
  three-gears:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact unique commander cast sources and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/manual-unique-animar-command-cast
          test "$(git rev-parse HEAD^)" = "328cc3d3aba0f39fd733db65565b8bca99269464"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoUniqueCommanderCastPolicy.kt)" = "0b408d285989c8c789e829f2b580ac4930ec963c"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoUniqueCommanderCastIntegrationTest.kt)" = "6bb31807a1554a56ed7246a068b1a82b0727199c"
          test "$(git hash-object experiments/manual-transmission-phase2/unique-animar-command-cast-budget.json)" = "a77e5ca32379f3bca4430f47ac6d4e726a1475c9"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/PhaseTwoPilotBoundary.kt)" = "321c4234b4670284d8c9fa9b7a0ef819e3ccc8fb"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/PhaseTwoTelemetryAdapter.kt)" = "44608301d535a2114073d80c06d5ca0480c40043"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoUniqueCommanderCastPolicy.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoUniqueCommanderCastIntegrationTest.kt; git hash-object experiments/manual-transmission-phase2/unique-animar-command-cast-budget.json; git hash-object .github/workflows/manual-unique-animar-command-cast.yml; git status --porcelain; } > build/reports/manual-unique-animar-command-cast/source.txt
      - name: Run three fresh real commander cast traces
        shell: bash
        run: |
          set -o pipefail
          just test-class ManualPhaseTwoUniqueCommanderCastIntegrationTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/manual-unique-animar-command-cast/test.log
      - name: Preserve XML
        if: always()
        run: cp gym/build/test-results/test/TEST-com.wingedsheep.gym.manual.ManualPhaseTwoUniqueCommanderCastIntegrationTest.xml build/reports/manual-unique-animar-command-cast/ 2>/dev/null || true
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-unique-animar-command-cast-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/manual-unique-animar-command-cast/
          if-no-files-found: error
          retention-days: 90

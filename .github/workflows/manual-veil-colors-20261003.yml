name: Manual fixed color hexproof source preparation and qualification
on:
  push:
    branches: [validation/manual-veil-colors-20261003]
    paths: [.github/workflows/manual-veil-colors-20261003.yml]
permissions:
  contents: write
concurrency:
  group: manual-veil-colors-20261003
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/manual-veil-colors-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b01e312106011af2aa904e7c70438df7620d5e0c
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare exact source-only candidate without workflow ancestry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PYCODE'
          import base64,hashlib,json,os,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          parent='b01e312106011af2aa904e7c70438df7620d5e0c'
          branch='candidate/manual-veil-colors-20261003'
          live='refs/heads/manual/whole-pilot-runner-replay-freeze-20260930'
          assert git('rev-parse','HEAD')==parent
          assert git('ls-remote','origin',live).split()[0]==parent,'live Manual changed'
          assert not git('ls-remote','origin','refs/heads/'+branch),'candidate already exists'
          expected={'docs/card-sdk-language-reference.md': '8e370f668dc23c26df24c4103604698c969d2e54', 'mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/dsl/Effects.kt': 'aea1461c4f67037f9386d53ac0d0bfc09e39bf1e', 'mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/GrantHexproofFromColorsEffect.kt': '104060ec1e82830c644a9a9290fff61a5198c2d3', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/core/CleanupPhaseManager.kt': '0dae0d795704a338d7607afee54193ee84d0263e', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/core/Serialization.kt': '58fa9591f284dcfe4612f842d633eaf76ff10921', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/permanent/PermanentExecutors.kt': 'c8494969affa6852c19b2167a7c25eede46c4cc2', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/permanent/protection/GrantHexproofFromColorsExecutor.kt': 'd9e5c671e2d528d46d26430a18b15c742f9f9230', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/state/components/player/PlayerHexproofFromColorsComponent.kt': 'c2e62519de271f21deb8e16244358a8305d32fe8', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/targeting/PlayerColorHexproof.kt': '73ebb3ecdb4915df5c93218b12736aee2ee7b4e0', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/targeting/TargetValidator.kt': 'a33c402aa696d2e39cbd253ad8aded224f31074f', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt': '3f770ae17b7bf2ceca187a0927fb394caf3d4d04', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/TargetFinder.kt': 'f6b1a591d6b209d7bb11dfce1ea3c4e19cbc984b', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/legalactions/utils/TargetEnumerationUtils.kt': '08cb4dfdbad34d300f795128c77003cc3bf45a22', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/FixedColorHexproofScenarioTest.kt': '22709213a281b07d1dc29b09eaf3fd405a175495'}
          patch=base64.b64decode('',validate=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          assert git('diff','--cached','--name-only').splitlines()==sorted(expected)
          for p,b in expected.items(): assert git('hash-object',p)==b,p
          tree=git('write-tree')
          env=dict(os.environ,GIT_AUTHOR_NAME='Argentum source preparation',GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com',GIT_COMMITTER_NAME='Argentum source preparation',GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          source=subprocess.check_output(['git','commit-tree',tree,'-p',parent,'-m','Add fixed-color hexproof grants for players and permanents'],text=True,env=env).strip()
          assert git('ls-remote','origin',live).split()[0]==parent,'live Manual changed before publication'
          subprocess.run(['git','push','origin',source+':refs/heads/'+branch],check=True)
          subprocess.run(['git','checkout','--detach',source],check=True)
          assert git('rev-parse','HEAD^')==parent
          assert not git('status','--porcelain')
          binding={'source_head':source,'source_tree':tree,'parent_source_head':parent,'validation_head':os.environ['GITHUB_SHA'],'source_git_blobs':expected,'source_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected},'scope':'EXCLUDED_FIXED_COLOR_HEXPROOF','official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
          (pathlib.Path(os.environ['OUT'])/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          print('SOURCE_ONLY_COMMIT='+source)
          PYCODE
      - name: Qualify fixed color hexproof
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-configuration-cache --console=plain --continue --max-workers=1 -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g :rules-engine:test --tests com.wingedsheep.engine.scenarios.FixedColorHexproofScenarioTest 2>&1 | tee "$OUT/qualification.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
          exit "$rc"
      - name: Preserve actual cases and digests
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import pathlib,os,json,hashlib,shutil,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
          p=pathlib.Path('rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.FixedColorHexproofScenarioTest.xml')
          cases=[]
          if p.exists():
            shutil.copyfile(p,out/p.name)
            cases=[{'name':c.attrib['name'],'failure':c.find('failure') is not None,'error':c.find('error') is not None,'skipped':c.find('skipped') is not None} for c in ET.parse(p).getroot().findall('testcase')]
          (out/'actual-cases.json').write_text(json.dumps(cases,indent=2)+'\n')
          (out/'evidence-sha256.json').write_text(json.dumps({str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file() and p.name!='evidence-sha256.json'},indent=2)+'\n')
          assert len(cases)==14 and len({c['name'] for c in cases})==14,cases
          assert not any(c['failure'] or c['error'] or c['skipped'] for c in cases),cases
          assert (out/'gradle-exit-code.txt').read_text().strip()=='0'
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manual-veil-colors-${{ github.run_id }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

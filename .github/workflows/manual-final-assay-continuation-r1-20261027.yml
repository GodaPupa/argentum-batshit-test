name: Manual final Assay continuation R1
on:
  push:
    branches: [validation/manual-final-assay-continuation-r1-20261027]
    paths: ['.github/workflows/manual-final-assay-continuation-r1-20261027.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 3b998dd7d1d5a683aca42c203da9877173dd8ab6
  SOURCE_TREE: 7f26a343b98c1623df40afc4954d5a0b91abde73
  WORKFLOW: .github/workflows/manual-final-assay-continuation-r1-20261027.yml
  RECORD: experiments/manual-transmission/research/final-assay-continuation-r1-20261027
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Unfinished Assay gates with exact prior evidence reuse
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-final-assay-r1-${{ github.run_id }}
          path: manual-final-assay-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: Pest Monster London physical land plans static preflight
on:
  push:
    branches: ["pest/c2-pair-pilot-seam-20260927"]
    paths:
      - ".github/workflows/pest-monster-london-physical-land-preflight.yml"
      - "gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonPhysicalLandPlans.kt"
      - "gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonPhysicalLandPlansTest.kt"

permissions:
  contents: read

jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-london-physical-land-preflight
          test "$(git rev-parse HEAD^)" = "b4c004a07f60c6996087e72ff800874bcda6564b"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonPhysicalLandPlans.kt)" = "8e97078fd4fef858ba44f047c178650f6f90b8d7"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonPhysicalLandPlansTest.kt)" = "e69c2ca93ea1566de9d028820a30fc1c7eac8263"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonSetupBridge.kt)" = "3dfaf5a1a560e8f5c30ab34de1c2583656832251"
          test -x gradlew
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonPhysicalLandPlans.kt
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonPhysicalLandPlansTest.kt
            git hash-object .github/workflows/pest-monster-london-physical-land-preflight.yml
            git status --porcelain
          } > build/reports/pest-london-physical-land-preflight/source.txt
      - name: Compile without behavioral execution
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:compileTestKotlin --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-london-physical-land-preflight/compile.log
          test -f gym/build/classes/kotlin/main/com/wingedsheep/gym/matchup/PestMonsterLondonPhysicalLandPlans.class
          test -f gym/build/classes/kotlin/test/com/wingedsheep/gym/matchup/PestMonsterLondonPhysicalLandPlansTest.class
          test ! -e gym/build/test-results/test/TEST-com.wingedsheep.gym.matchup.PestMonsterLondonPhysicalLandPlansTest.xml
      - name: Retain original compile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-london-physical-land-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-london-physical-land-preflight/
          if-no-files-found: error
          retention-days: 90

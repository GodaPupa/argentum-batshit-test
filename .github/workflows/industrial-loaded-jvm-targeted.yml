name: Industrial loaded JVM identity three-case receiver
on:
  push:
    branches: ["industrial-waste/r1-launcher-source-pins-20260927"]
    paths:
      - ".github/workflows/industrial-loaded-jvm-targeted.yml"
permissions:
  contents: read
jobs:
  three-case:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/industrial-loaded-jvm-targeted
          test "$(git rev-parse HEAD^)" = "75c8e6e0897541d981958b2be14f0e8f2f86abb4"
          test "$(git hash-object ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2LoadedJvmIdentity.kt)" = "83e0a0b3190cc72d3d3c8f789293455ff2d42f12"
          test "$(git hash-object ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2LoadedJvmIdentityTest.kt)" = "7bfb136879d0769ffb19781cb744c7d585c9b9ff"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2LoadedJvmIdentity.kt; git hash-object ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2LoadedJvmIdentityTest.kt; git hash-object .github/workflows/industrial-loaded-jvm-targeted.yml; git status --porcelain; } > build/reports/industrial-loaded-jvm-targeted/source.txt
      - name: Execute exact three loaded JVM receiver cases
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :ai:test --tests 'com.wingedsheep.ai.industrialwaste.IndustrialWasteV2LoadedJvmIdentityTest' --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/industrial-loaded-jvm-targeted/test.log
      - name: Retain original XML
        if: always()
        shell: bash
        run: |
          cp ai/build/test-results/test/TEST-com.wingedsheep.ai.industrialwaste.IndustrialWasteV2LoadedJvmIdentityTest.xml build/reports/industrial-loaded-jvm-targeted/ 2>/dev/null || true
      - name: Upload original behavioral evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-loaded-jvm-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/industrial-loaded-jvm-targeted/
          if-no-files-found: error
          retention-days: 90

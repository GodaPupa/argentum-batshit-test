name: Pest Control Tier-1 Mono-Blue Terror Official Execution Retired Validation

on:
  pull_request:
    paths:
      - .github/workflows/pest-control-tier-one-mono-blue-terror-official-execute.yml
      - docs/experiments/pest-control/tier-one-mono-blue-terror-auto-execution-authorization.json
      - docs/experiments/pest-control/tier-one-mono-blue-terror-official-smoke-result.md

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify retired one-shot execution surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/pest-control-tier-one-mono-blue-terror-official-execute.yml").read_text()
          assert ("workflow" + "_dispatch") not in text
          assert "\n  push:" not in text
          assert "github.event_name == 'push'" not in text
          assert "PestControlTierOneMonoBlueTerrorOfficialExecutionRunnerTest" not in text
          assert "Execute frozen four-game vector exactly once" not in text
          assert "Upload one-shot official evidence" not in text
          PY

      - name: Verify accepted smoke record exists
        run: |
          set -euo pipefail
          grep -F 'Status: `ACCEPTED_NONEXPERIMENTAL_SMOKE`' docs/experiments/pest-control/tier-one-mono-blue-terror-official-smoke-result.md
          grep -F 'Pest Control finished **4-0**.' docs/experiments/pest-control/tier-one-mono-blue-terror-official-smoke-result.md
          grep -F '`35894018961`' docs/experiments/pest-control/tier-one-mono-blue-terror-official-smoke-result.md
          grep -F '`10766612589`' docs/experiments/pest-control/tier-one-mono-blue-terror-official-smoke-result.md

name: Pest London parity bank geometry
on:
  push:
    branches: ["pest/london-predicate-vector-20260928"]
    paths: [".github/workflows/pest-london-parity-bank-geometry.yml"]
permissions: {contents: read}
jobs:
  four-geometry-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact bank vector fixture budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-london-parity-bank-geometry
          test "$(git rev-parse HEAD^)" = "a38e0c06417689dac1cfd8a08441233165f9a21d"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonParityBank.kt)" = "d90d80b6a6c12820eab36d1efb2c565cecba4909"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonPredicateVector.kt)" = "bb8e2247dc64a64403094c691d83b8eed53048bd"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonParityBankTest.kt)" = "b77bd057c55091158f76fe27840228495888485a"
          test "$(git hash-object docs/experiments/pest-control/london-parity-bank-geometry-budget-20260928.json)" = "a64d293bf26ef9663065b043025269c0f8295a4c"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonParityBank.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonPredicateVector.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonParityBankTest.kt; git hash-object docs/experiments/pest-control/london-parity-bank-geometry-budget-20260928.json; git hash-object .github/workflows/pest-london-parity-bank-geometry.yml; git status --porcelain; } > build/reports/pest-london-parity-bank-geometry/source.txt
      - name: Run four fresh bank geometry cases
        shell: bash
        run: |
          set -o pipefail
          just test-class PestMonsterLondonParityBankTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-london-parity-bank-geometry/test.log
      - name: Preserve XML
        if: always()
        shell: bash
        run: cp gym/build/test-results/test/TEST-com.wingedsheep.gym.pest.PestMonsterLondonParityBankTest.xml build/reports/pest-london-parity-bank-geometry/ 2>/dev/null || true
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-london-parity-bank-geometry-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-london-parity-bank-geometry/
          if-no-files-found: error
          retention-days: 90

name: Izzet shared Opal plus accepted Vines adoption
on:
  push:
    branches: ["validation/izzet-opal-vines-adoption-20261002"]
    paths: [".github/workflows/izzet-opal-vines-adoption-20261002.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_USER_HOME: /tmp/izzet-opal-vines-${{ github.run_id }}
      OUT: /tmp/izzet-opal-vines-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: aa5c6ab7b4266eda8251f4db3178525760be03cd, fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind exact adopted source and compile
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = aa5c6ab7b4266eda8251f4db3178525760be03cd
          test ! -e "$OUT" && mkdir "$OUT"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/ManaSpellRider.kt)" = 5c6c1d4e8374a5375f79643a6e282fb728ab23b6
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c13/cards/OpalPalace.kt)" = 544a440160528f4a08211109936a55e263c39d19
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/zen/cards/VinesOfVastwood.kt)" = 7fc212f250daf9c26dd6ca60feb8086f59dd6ed2
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/izzet/IzzetOpalPalaceRegistryAdoptionTest.kt)" = 3422c04443c385d53ed7e4c7a3b381f96d98d016
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain :mtg-sdk:compileKotlin :rules-engine:compileKotlin :mtg-sets:2008-2016:compileKotlin :gym:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
      - name: Run Opal and Swan mechanics
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain :mtg-sets:2008-2016:tests:test --tests com.wingedsheep.engine.scenarios.OpalPalaceScenarioTest --tests com.wingedsheep.engine.scenarios.SwanSongScenarioTest 2>&1 | tee "$OUT/opal-swan.log"
          cp mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.OpalPalaceScenarioTest.xml "$OUT/"
          cp mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.SwanSongScenarioTest.xml "$OUT/"
      - name: Run exact accepted Vines scenario
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain :mtg-sets:2008-2016:tests:test --tests com.wingedsheep.engine.scenarios.VinesOfVastwoodScenarioTest 2>&1 | tee "$OUT/vines.log"
          cp mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.VinesOfVastwoodScenarioTest.xml "$OUT/"
      - name: Reinventory unchanged Position-1 list
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain :gym:test --tests com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest 2>&1 | tee "$OUT/inventory.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$OUT/inventory-gradle-exit.txt"
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml "$OUT/"
          python3 - <<'PY'
          import json,os,pathlib,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['OUT']); root=ET.parse(out/'TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml').getroot()
          suffix=' is registered in current runtime'; reg=[]; miss=[]
          for c in root.iter('testcase'):
              n=c.attrib['name']; card=n[:-len(suffix)] if n.endswith(suffix) else n
              (miss if c.find('failure') is not None or c.find('error') is not None else reg).append(card)
          assert int(root.attrib['tests'])==55 and len(reg)+len(miss)==55
          assert 'Opal Palace' in reg and 'Vines of Vastwood' in reg
          (out/'registry-summary.json').write_text(json.dumps({'schema':'izzet-position1-post-opal-vines-registry-v1','registered':len(reg),'missing':len(miss),'registered_names':sorted(reg),'missing_names':sorted(miss),'authority':'REGISTRY_DIAGNOSTIC_ONLY','official_counters_delta':0},sort_keys=True,indent=2)+'\n')
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-opal-vines-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: warn
          retention-days: 90

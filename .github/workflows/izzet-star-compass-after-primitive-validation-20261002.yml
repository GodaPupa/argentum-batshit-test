name: Izzet Star Compass after qualified basic-land colors
on:
  push:
    branches: ["validation/izzet-star-compass-after-primitive-20261002"]
    paths: [".github/workflows/izzet-star-compass-after-primitive-validation-20261002.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_USER_HOME: /tmp/izzet-star-compass-${{ github.run_id }}
      OUT: /tmp/izzet-star-compass-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind exact Star Compass source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$OUT"
          test "$(git rev-parse HEAD^)" = "0c9bc48c56162ba2e3c4e6600db370f4fe7de2cb"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/izzet-star-compass-after-primitive-validation-20261002.yml"
          test "$(git rev-parse HEAD^^)" = "0e33563171e9c25b5e57b3aa792002d3e7940196"
          test "$(git hash-object mtg-sets/2000-2002/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/pls/cards/StarCompass.kt)" = "04b59e9a55e807fff9552a2733323da7a707c963"
          test "$(git hash-object mtg-sets/2000-2002/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/StarCompassScenarioTest.kt)" = "797667723b9f2da97b45a4150533a943e0d15577"
          git rev-parse HEAD HEAD^{tree} HEAD^ HEAD^^ > "$OUT/source.txt"
          printf '%s\n' 'AUTHOR_VALIDATION_ONLY_NO_GAMEPLAY_AUTHORITY' > "$OUT/authority.txt"
      - name: Compile affected shard and registry test source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:2000-2002:tests:compileTestKotlin :gym:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
      - name: Run exact Star Compass scenarios
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:2000-2002:tests:test --tests com.wingedsheep.engine.scenarios.StarCompassScenarioTest 2>&1 | tee "$OUT/star-compass.log"
          cp mtg-sets/2000-2002/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.StarCompassScenarioTest.xml "$OUT/"
      - name: Reinventory Position-1
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :gym:test --tests com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest 2>&1 | tee "$OUT/registry.log"
          rc=${PIPESTATUS[0]}
          set -e
          XML=gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml
          test -f "$XML"
          cp "$XML" "$OUT/"
          REGISTRY_RC="$rc" python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          out = pathlib.Path(os.environ["OUT"])
          root = ET.parse(out/"TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml").getroot()
          assert int(root.attrib["tests"]) == 55
          suffix = " is registered in current runtime"
          registered, missing = [], []
          for c in root.iter("testcase"):
              n = c.attrib["name"]
              card = n[:-len(suffix)] if n.endswith(suffix) else n
              (registered if c.find("failure") is None and c.find("error") is None else missing).append(card)
          expected_missing = {
              "Benevolent Blessing","Capsize","Cosmic Hunger","Everflowing Chalice","Lose Focus",
              "Rolling Thunder","Shattering Pulse","Skred","Snake Umbra"
          }
          assert "Star Compass" in registered
          assert set(missing) == expected_missing, (len(registered), len(missing), sorted(missing))
          assert len(registered) == 46 and len(missing) == 9
          (out/"registry-summary.json").write_text(json.dumps({
              "registered": len(registered),
              "missing": len(missing),
              "missing_names": sorted(missing),
              "official_counters_delta": {"allocations":0,"claims":0,"games":0,"outcomes":0}
          }, indent=2, sort_keys=True)+"\n")
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-star-compass-after-primitive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

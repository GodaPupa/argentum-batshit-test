name: Pest Control Tier-1 Mono-Blue Terror Replication Freeze Retired Validation

on:
  pull_request:
    paths:
      - .github/workflows/pest-control-tier-one-mono-blue-terror-replication-production-freeze.yml
      - docs/experiments/pest-control/tier-one-mono-blue-terror-replication-freeze-provenance.json
      - scripts/experiments/pest-control/generate_tier_one_mono_blue_terror_replication_freeze.py

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify production freeze is permanently retired
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/"
              "pest-control-tier-one-mono-blue-terror-replication-production-freeze.yml"
          ).read_text()
          assert ("workflow" + "_dispatch") not in workflow
          assert "\n  push:" not in workflow
          assert ("github.event_name == " + "'push'") not in workflow
          assert ("-" + "-generate") not in workflow
          assert ("os." + "urandom") not in workflow

          generator = Path(
              "scripts/experiments/pest-control/"
              "generate_tier_one_mono_blue_terror_replication_freeze.py"
          ).read_text()
          assert "official Mono-Blue Terror replication vector is already frozen" in generator
          assert "tier-one-mono-blue-terror-replication-freeze-provenance.json" in generator

          provenance = Path(
              "docs/experiments/pest-control/"
              "tier-one-mono-blue-terror-replication-freeze-provenance.json"
          )
          assert provenance.is_file()
          PY

      - name: Confirm accepted replication freeze identity
        run: |
          set -euo pipefail
          grep -F '"workflowRunId": "35911067849"' docs/experiments/pest-control/tier-one-mono-blue-terror-replication-freeze-provenance.json
          grep -F '"artifactId": "10773131628"' docs/experiments/pest-control/tier-one-mono-blue-terror-replication-freeze-provenance.json
          grep -F '"status": "FROZEN_UNEXECUTED"' docs/experiments/pest-control/tier-one-mono-blue-terror-replication-freeze-provenance.json

name: Manual Phase 2 nine frozen development cards on main (70 CORRECTED CASES, NO GAMES)
on:
  push:
    branches: [candidate/manual-phase2-development-nine-20261021]
    paths:
      - '.github/workflows/manual-phase2-development-nine-20261021.yml'
      - 'experiments/manual-transmission/research/phase2-current-main-20261021/DEVELOPMENT_NINE_PROTOCOL.json'
      - 'experiments/manual-transmission/research/phase2-current-main-20261021/DEVELOPMENT_NINE_SOURCE_COMPATIBILITY_CORRECTION.json'
      - 'rules-engine/src/testFixtures/kotlin/com/wingedsheep/engine/support/SerializationTestSupport.kt'
      - 'mtg-sets/**/cards/*Growth.kt'
      - 'mtg-sets/**/cards/*Sprawl.kt'
      - 'mtg-sets/**/cards/*Elf.kt'
      - 'mtg-sets/**/cards/*Invader.kt'
      - 'mtg-sets/**/cards/*Druid.kt'
      - 'mtg-sets/**/cards/*Oracle.kt'
      - 'mtg-sets/**/cards/*Springs.kt'
      - 'mtg-sets/**/cards/*Center.kt'
      - 'mtg-sets/**/cards/*Garden.kt'
      - 'mtg-sets/**/scenarios/*ScenarioTest.kt'
      - 'mtg-sets/**/scenarios/OpponentCountLandScenarioSpec.kt'
permissions: {contents: read}
concurrency:
  group: manual-phase2-20261021-nine-exact-donor-development-cards
  cancel-in-progress: false

jobs:
  exact-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 65}
      - name: Verify one frozen receiving parent, 19 original donor blobs, and ZERO runtime mutations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p development-nine-source
          git merge-base --is-ancestor 53b506850b1a949664bd3ff901ec8a7ba5dcab90 HEAD
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = 43bbad79273806f56703fad420e9f6a495d05309
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt)" = c9083468bc8576136eedbc504731a1de38e57ecd
          python3 - <<'PY' | tee development-nine-source/donor-identity.log
          import json,subprocess
          from pathlib import Path
          p=Path("experiments/manual-transmission/research/phase2-current-main-20261021/DEVELOPMENT_NINE_PROTOCOL.json")
          data=json.loads(p.read_text())
          assert data["schema"]=="ARGENTUM_MANUAL_PHASE2_CURRENT_MAIN_DEVELOPMENT_NINE_RECEIVING_V1"
          assert data["status"]=="PREDECLARED_BEFORE_ANY_NEW_CARD_COPY_OR_BEHAVIOR_TEST"
          assert data["source_parent"]=="53b506850b1a949664bd3ff901ec8a7ba5dcab90"
          assert data["expected_donor_card_count"]==9
          assert data["expected_unique_test_cases"]==69
          correction=json.loads(Path("experiments/manual-transmission/research/phase2-current-main-20261021/DEVELOPMENT_NINE_SOURCE_COMPATIBILITY_CORRECTION.json").read_text())
          assert correction["status"]=="RECORDED_AFTER_ORIGINAL_RED_BEFORE_ANY_RETEST"
          assert correction["failed_run"]==39689951999
          assert correction["corrected_total"]==70 and correction["original_predeclared_total"]==69
          assert correction["test_fixture_integration"]["exact_original_phase2_donor_blob"]=="5253189c1a0dc1cff3b7e30791a73fcb866f80bb"
          assert sum(d["test_count"] for d in data["donor_cards"])==69
          assert data["frozen_protection"]["no_seeds_or_full_games"]
          assert data["frozen_protection"]["precision_original_games_reserved"]==2
          expected={str(p),".github/workflows/manual-phase2-development-nine-20261021.yml","experiments/manual-transmission/research/phase2-current-main-20261021/DEVELOPMENT_NINE_SOURCE_COMPATIBILITY_CORRECTION.json"}
          for card in data["donor_cards"]:
              for path,key in ((card["source_path"],"source_sha"),(card["test_path"],"test_sha")):
                  got=subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
                  assert got==card[key],(path,got,card[key])
                  expected.add(path)
          helper=data["additional_test_helper"]
          assert subprocess.check_output(["git","rev-parse","HEAD:"+helper["path"]],text=True).strip()==helper["blob"]
          expected.add(helper["path"])
          compat=correction["test_fixture_integration"]
          fixture_got=subprocess.check_output(["git","rev-parse","HEAD:"+compat["path"]],text=True).strip()
          assert fixture_got==compat["exact_original_phase2_donor_blob"]
          expected.add(compat["path"])
          changes=subprocess.check_output(["git","diff","--name-only",data["source_parent"],"HEAD"],text=True).splitlines()
          assert len(changes)==23 and set(changes)==expected,(len(changes),sorted(set(changes)^expected))
          print("MANUAL_PHASE2_NINE_DONOR_BLOBS_SOURCE_VERIFIED paths=23 testcases=70 original_donor_69_plus_1_generated_case")
          PY
          git rev-parse HEAD > development-nine-source/head-sha.txt
          git rev-parse HEAD^{tree} > development-nine-source/tree-sha.txt
          echo 'NO official seeds; NO new full games; Phase2 0/36 and 0/864; Precision 10/12 used, 2 reserved' > development-nine-source/budget.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-devnine-source-${{ github.run_id }}
          path: development-nine-source/
          if-no-files-found: warn
          retention-days: 30

  exact-original-scenarios:
    needs: exact-source-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        era: ["1993-1999", "2003-2007", "2008-2016", "2017-2022"]
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R4_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 10}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Execute only predeclared unchanged source cases in this exact era
        shell: bash
        run: |
          set -euo pipefail
          era="${{ matrix.era }}"
          mkdir -p "devnine-artifact/$era/junit"
          case "$era" in
            "1993-1999") filters=(--tests '*WildGrowthScenarioTest') ;;
            "2003-2007") filters=(--tests '*CoilingOracleScenarioTest' --tests '*UtopiaSprawlScenarioTest') ;;
            "2008-2016") filters=(--tests '*ArborElfScenarioTest' --tests '*NestInvaderScenarioTest') ;;
            "2017-2022") filters=(--tests '*ParadiseDruidScenarioTest' --tests '*RejuvenatingSpringsScenarioTest' --tests '*TrainingCenterScenarioTest' --tests '*SpireGardenScenarioTest') ;;
            *) echo UNDECLARED_ERA; exit 1 ;;
          esac
          chmod +x gradlew scripts/gradle-locked
          scripts/gradle-locked ":mtg-sets:$era:tests:cleanTest" ":mtg-sets:$era:tests:test" \
            "${filters[@]}" -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee "devnine-artifact/$era/focused-gradle.log"
      - name: Preserve true per-module XML separately before any other invocation
        if: always()
        shell: bash
        run: |
          era="${{ matrix.era }}"
          mkdir -p "devnine-artifact/$era/junit"
          cp -a "mtg-sets/$era/tests/build/test-results/test/." "devnine-artifact/$era/junit/" || true
      - name: Independently count the original module's exactly expected fresh cases
        if: success()
        shell: bash
        env: {ERA: "${{ matrix.era }}"}
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "devnine-artifact/$ERA/independent-case-audit.log"
          import json,os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=json.loads(Path("experiments/manual-transmission/research/phase2-current-main-20261021/DEVELOPMENT_NINE_PROTOCOL.json").read_text())
          correction=json.loads(Path("experiments/manual-transmission/research/phase2-current-main-20261021/DEVELOPMENT_NINE_SOURCE_COMPATIBILITY_CORRECTION.json").read_text())
          era=os.environ["ERA"]
          subset=[c for c in p["donor_cards"] if c["era"]==era]
          assert subset,(era,"no declared cases")
          count=0
          for c in subset:
              stem=Path(c["test_path"]).stem
              file=Path("devnine-artifact")/era/"junit"/("TEST-com.wingedsheep.engine.scenarios."+stem+".xml")
              assert file.is_file(),("Missing exact source JUnit",str(file))
              root=ET.parse(file).getroot()
              cases=root.findall(".//testcase")
              n=correction["effective_case_counts"][c["name"]]
              assert len(cases)==n,(c["name"],len(cases),n)
              assert not root.findall(".//failure") and not root.findall(".//error") and not root.findall(".//skipped"),c["name"]
              assert all(int(root.get(t,"0"))==0 for t in ("failures","errors","skipped")),c["name"]
              assert len(set((x.get("classname"),x.get("name")) for x in cases))==len(cases),"Duplicate XML case"
              print(f"{c['name']}: {len(cases)}/{c['test_count']} exact unchanged mechanics PASS")
              count+=len(cases)
          assert count==correction["corrected_by_era"][era],(era,count)
          print("DEVELOPMENT_NINE_ERA_SOURCE_PASS",era,count)
          PY
      - name: Preserve original scoped result (GREEN or RED, never a game)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-devnine-${{ github.run_id }}-${{ matrix.era }}
          retention-days: 30
          if-no-files-found: warn
          path: devnine-artifact/

  independent-all-era-audit:
    needs: [exact-source-preflight, exact-original-scenarios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          pattern: manual-devnine-${{ github.run_id }}-*
          path: devnine-combined
          merge-multiple: true
      - name: Independently audit all nine source-linked XML suites, 69 exact tests and green jobs
        shell: bash
        env:
          SOURCE_STATUS: ${{ needs.exact-source-preflight.result }}
          CASES_STATUS: ${{ needs.exact-original-scenarios.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,xml.etree.ElementTree as ET
          from pathlib import Path
          assert os.environ["SOURCE_STATUS"]=="success",("source",os.environ["SOURCE_STATUS"])
          assert os.environ["CASES_STATUS"]=="success",("cases",os.environ["CASES_STATUS"])
          p=json.loads(Path("experiments/manual-transmission/research/phase2-current-main-20261021/DEVELOPMENT_NINE_PROTOCOL.json").read_text())
          correction=json.loads(Path("experiments/manual-transmission/research/phase2-current-main-20261021/DEVELOPMENT_NINE_SOURCE_COMPATIBILITY_CORRECTION.json").read_text())
          counts={}
          for c in p["donor_cards"]:
              stem=Path(c["test_path"]).stem
              path=Path("devnine-combined")/c["era"]/"junit"/("TEST-com.wingedsheep.engine.scenarios."+stem+".xml")
              assert path.is_file(),("missing JUnit",str(path))
              node=ET.parse(path).getroot()
              tests=node.findall(".//testcase")
              assert len(tests)==correction["effective_case_counts"][c["name"]],(stem,len(tests))
              assert not node.findall(".//failure") and not node.findall(".//error") and not node.findall(".//skipped"),stem
              counts[c["name"]]=len(tests)
          assert sum(counts.values())==70 and len(counts)==9,counts
          obj=dict(schema="ARGENTUM_MANUAL_DEV_NINE_EXACT_DONOR_SCENARIOS_R1",status="SOURCE_COMPONENT_QUALIFIED_NINE_ONLY",per_card=counts,total=69,failures=0,skips=0,new_official_games=0,registered_deck_qualification=False,phase2_36_admitted=0,phase2_864_admitted=0,precision_remaining=2)
          Path("devnine-combined/DEV_NINE_VERDICT.json").write_text(json.dumps(obj,indent=2)+"\n")
          print("MANUAL_DEV_NINE_70_70_SOURCE_MECHANICS_GREEN_NOT_DECK_ADMISSION")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-devnine-final-${{ github.run_id }}
          path: devnine-combined/DEV_NINE_VERDICT.json
          retention-days: 30
          if-no-files-found: warn

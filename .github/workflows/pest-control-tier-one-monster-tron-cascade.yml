name: Pest Control Tier-1 Monster Tron Cascade Validation

on:
  pull_request:
    paths:
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/spell/CastSpellHandler.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/library/CascadeExecutor.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/LibraryAndZoneContinuationResumer.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/core/LibraryAndZoneContinuations.kt
      - rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/CascadeKeywordTest.kt
      - mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/MaelstromColossusCascadeScenarioTest.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonsterTronCascadeReadinessTest.kt
      - docs/experiments/pest-control/tier-one-monster-tron-cascade.md
      - .github/workflows/pest-control-tier-one-monster-tron-cascade.yml

permissions:
  contents: read

jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Validate generic Cascade rules
        run: scripts/test-class CascadeKeywordTest --info --stacktrace

      - name: Validate Maelstrom Colossus Cascade and Prototype interaction
        run: scripts/test-class MaelstromColossusCascadeScenarioTest --info --stacktrace

      - name: Validate frozen Monster Tron Cascade closure
        env:
          PEST_MONSTER_TRON_CASCADE_REPORT: ${{ github.workspace }}/build/reports/pest-monster-tron-cascade/report.txt
        run: scripts/test-class PestControlTierOneMonsterTronCascadeReadinessTest --info --stacktrace

      - name: Upload Cascade readiness report
        uses: actions/upload-artifact@v7
        with:
          name: pest-control-tier-one-monster-tron-cascade-readiness
          path: build/reports/pest-monster-tron-cascade/report.txt
          if-no-files-found: error
          retention-days: 90

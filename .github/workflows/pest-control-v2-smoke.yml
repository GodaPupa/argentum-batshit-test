name: Pest Control V2 Qualifying Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'pest-control/v2-calibration'
    paths:
      - '.pest-v2-smoke-trigger'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run qualifying smoke
        env:
          PEST_V2_SMOKE: "true"
          PEST_V2_SMOKE_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          scripts/test-class PestControlV2QualifyingSmokeTest --info --stacktrace | tee pest-v2-smoke.log
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-control-v2-qualifying-smoke
          path: |
            pest-v2-smoke.log
            build/reports/pest-control-v2-smoke/
          if-no-files-found: warn

name: Sphinx whole-actor Snap routing v3
on:
  push:
    branches: ["validation/sphinx-whole-actor-snap-routing-v3-20261001"]
    paths: [".github/workflows/sphinx-whole-actor-snap-routing-v3-20261001.yml"]
permissions: {contents: read}
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: {GRADLE_USER_HOME: /tmp/sphinx-whole-snap-v3}
    steps:
      - uses: actions/checkout@v6
        with: {ref: e7cbd74976623d3a5ecbd7bf3fae4ea5ebcc416b, fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Exact focused composition regression
        run: |
          test "$(git rev-parse HEAD)" = e7cbd74976623d3a5ecbd7bf3fae4ea5ebcc416b
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain :gym:test --tests com.wingedsheep.gym.sphinx.SphinxStageEWholeActorSnapRoutingTest
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-whole-snap-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: gym/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageEWholeActorSnapRoutingTest.xml
          if-no-files-found: warn

name: Manual Pact unpaid-loss changed fixture targeted
on:
  push:
    branches: ["manual/clean-pilot-boundary-receiving-20260927"]
    paths: [".github/workflows/manual-pact-unpaid-targeted.yml"]
permissions: {contents: read}
jobs:
  one-changed-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact Pact source changed fixture and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/manual-pact-unpaid-targeted
          test "$(git rev-parse HEAD^)" = "fb19d20fa3a1ff22f1ebd232848c11e6aab0e1c9"
          test "$(git hash-object mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/fut/cards/PactOfNegation.kt)" = "c786551484cfb001eea9fc2b05e14ea23fd63bf9"
          test "$(git hash-object mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/PactOfNegationUnpaidScenarioTest.kt)" = "4f546f0c30fbff1d4548ffcd39b23c5a5530d7cd"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/fut/cards/PactOfNegation.kt; git hash-object mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/PactOfNegationUnpaidScenarioTest.kt; git hash-object .github/workflows/manual-pact-unpaid-targeted.yml; git status --porcelain; } > build/reports/manual-pact-unpaid-targeted/source.txt
      - name: Execute exactly one changed unpaid-loss trace
        shell: bash
        run: |
          set -o pipefail
          just test-class PactOfNegationUnpaidScenarioTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/manual-pact-unpaid-targeted/test.log
      - name: Retain exact XML
        if: always()
        run: cp mtg-sets/2003-2007/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.PactOfNegationUnpaidScenarioTest.xml build/reports/manual-pact-unpaid-targeted/ 2>/dev/null || true
      - name: Preserve original changed-fixture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-pact-unpaid-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/manual-pact-unpaid-targeted/
          if-no-files-found: error
          retention-days: 90

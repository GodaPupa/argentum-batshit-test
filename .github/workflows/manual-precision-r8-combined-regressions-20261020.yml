name: Manual Precision R8 isolated combined fixes and R5 protections (NO GAMES)
on:
  push:
    branches: [research/manual-precision-r8-combined-20261020]
    paths:
      - '.github/workflows/manual-precision-r8-combined-regressions-20261020.yml'
permissions:
  contents: read
concurrency:
  group: manual-precision-r8-combined-regressions
  cancel-in-progress: false
jobs:
  mana-cost-and-city-damage:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 24}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Pin original source and every combined repair to exact Git blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r8-combined-mana
          git rev-parse HEAD > r8-combined-mana/source.txt
          git rev-parse HEAD^{tree} > r8-combined-mana/tree.txt
          test "$GITHUB_REF" = "refs/heads/research/manual-precision-r8-combined-20261020"
          test "$(git rev-parse HEAD^)" = "79733d51f95d88197e30813f338432d0b58a8137"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/manual-precision-r8-combined-regressions-20261020.yml"
          git merge-base --is-ancestor cb6d0677a7c869a4cb4d5a7a567326ba955873eb HEAD
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/ability/ActivateAbilityHandler.kt)" = "149eae15569f5efa42c7fff6b4cd85afb4aaf384"
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/core/PreEntryContinuation.kt)" = "867ae2eab5d5899099436f55289a6b399ad6b39b"
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/PreEntryCoordinator.kt)" = "3baae2b3585ab3fcbec36a385450b7e1d391bfc1"
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/library/MoveCollectionExecutor.kt)" = "3b7f4a6a14ea3f7d41bd06167ec114a8340b6255"
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/ZoneTransitionService.kt)" = "cebfe9bd04d91d36bba511dcf0877835ef88e177"
          test "$(git rev-parse HEAD:mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManaConfluenceScenarioTest.kt)" = "f4ceb6438be756d6785bd47d37af4d3e53378807"
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = "7984a2e87d8ddbe023d45620414d25a61691a040"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          echo NO_GAMES > r8-combined-mana/budget.txt
          chmod +x scripts/gradle-locked gradlew
      - name: Four Confluence direct spell and ability life-payment paths
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2008-2016:tests:test --tests '*ManaConfluenceScenarioTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace 2>&1 | tee r8-combined-mana/confluence.log
      - name: Existing City of Brass triggered damage regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:1993-1999:tests:test --tests '*CityOfBrassScenarioTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace 2>&1 | tee r8-combined-mana/city.log
      - name: Preserve combined Mana and City source-bound results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-precision-r8-combined-mana-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            r8-combined-mana/
            mtg-sets/2008-2016/tests/build/test-results/test/
            mtg-sets/1993-1999/tests/build/test-results/test/
  fetch-and-shock-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 24}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Original R7 and unchanged tested source identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r8-combined-fetch
          git rev-parse HEAD > r8-combined-fetch/source.txt
          git rev-parse HEAD^{tree} > r8-combined-fetch/tree.txt
          git merge-base --is-ancestor cb6d0677a7c869a4cb4d5a7a567326ba955873eb HEAD
          test "$(git rev-parse HEAD:mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/MistyRainforestScenarioTest.kt)" = "964a741e014897736cbc15fada1adf64b559420a"
          test "$(git rev-parse HEAD:mtg-sets/2000-2002/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/WoodedFoothillsScenarioTest.kt)" = "765faa387801a27551df221182f4b9ab4c7e65db"
          echo NO_GAMES > r8-combined-fetch/budget.txt
          chmod +x scripts/gradle-locked gradlew
      - name: Wooded Foothills all shock entries and original fetch
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2000-2002:tests:test --tests '*WoodedFoothillsScenarioTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace 2>&1 | tee r8-combined-fetch/wooded.log
      - name: Misty Rainforest all shock entries and original fetch
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2008-2016:tests:test --tests '*MistyRainforestScenarioTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace 2>&1 | tee r8-combined-fetch/misty.log
      - name: Original three hand-played shockland scenarios
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2003-2007:tests:test --tests '*BreedingPoolScenarioTest' --tests '*SteamVentsScenarioTest' --tests '*StompingGroundScenarioTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace 2>&1 | tee r8-combined-fetch/hand-shocks.log
      - name: Preserve original R8 fetched shock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-precision-r8-combined-fetch-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            r8-combined-fetch/
            mtg-sets/2000-2002/tests/build/test-results/test/
            mtg-sets/2008-2016/tests/build/test-results/test/
            mtg-sets/2003-2007/tests/build/test-results/test/
  ai-survival-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R4_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 24}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Pin immutable R5 survival candidate and original game source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r8-combined-ai
          git rev-parse HEAD > r8-combined-ai/source.txt
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          echo ZERO_GAMES > r8-combined-ai/budget.txt
          chmod +x scripts/gradle-locked gradlew
      - name: Accepted Pact Ballista Statue resolution Encore and R5 regressions
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualPactDebt*Test' \
            --tests '*ManualBallista*Test' \
            --tests '*ManualStatue*Test' \
            --tests '*ManualResolutionPaymentRegressionTest' \
            --tests '*ManualR5CandidateCompositionTest' \
            --tests '*ManualEncoreRegressionTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r8-combined-ai/survival-protections.log
      - name: Exact CONTROL/A source identity and four-seat initializer parity
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualPrecisionR1PreflightTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r8-combined-ai/initializer-parity.log
      - name: Preserve all accepted R5 and original initializer regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-precision-r8-combined-ai-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            r8-combined-ai/
            ai/build/test-results/test/

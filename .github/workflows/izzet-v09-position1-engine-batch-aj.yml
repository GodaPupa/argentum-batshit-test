name: Izzet Position-1 Engine Batch AJ

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-aj.yml"

permissions:
  contents: read

jobs:
  qualify-batch-aj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch AJ gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'V07_DECK_AUDIT_NO_CHANGE' izzet-science/v07-deck-level-audit-no-change.md
          grep -Fq 'V09_CARD_CONTROL_ARCHITECTURE_AUDIT_KEEP_V07' izzet-science/v09-card-control-architecture-audit.md
          grep -Fq 'Expected post-implementation unresolved count is exactly **17**' izzet-science/v09-position1-engine-batch-aj-gate.md
          grep -Fq '36079075518' izzet-science/v09-position1-engine-batch-aj-gate.md
          grep -Fq '05f4cdb2047d0f9f810f978cf5471a8750bf7df6' izzet-science/v09-position1-engine-batch-aj-gate.md

      - name: Requalify canonical card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --stacktrace

      - name: Run Spirit Link semantics
        run: scripts/test-class SpiritLinkBatchAJScenarioTest --info --stacktrace

      - name: Run exact real-engine coverage regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-aj.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=17' /tmp/batch-aj.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Spirit Link' /tmp/batch-aj.txt
          ! grep -Fq 'unresolved Izzet card:' /tmp/batch-aj.txt

      - name: Assert official experiment remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt

      - name: Emit Batch AJ manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izzet-batch-aj
          cp /tmp/batch-aj.txt /tmp/izzet-batch-aj/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-aj-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "frozen_control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "implemented=Spirit Link;attached damage-trigger life gain"
            echo "snapshot_run=36079075518"
            echo "snapshot_commit=05f4cdb2047d0f9f810f978cf5471a8750bf7df6"
            echo "unresolved_before=18"
            echo "unresolved_after=17"
            echo "unresolved_izzet_after=0"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/10e/cards/SpiritLink.kt
            sha256sum mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/SpiritLinkBatchAJScenarioTest.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/v09-position1-engine-batch-aj-gate.md
            sha256sum mtg-sets/src/test/resources/snapshots/cards/10E.json
            sha256sum /tmp/izzet-batch-aj/test-output.txt
          } > /tmp/izzet-batch-aj/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-aj
          path: /tmp/izzet-batch-aj
          if-no-files-found: error

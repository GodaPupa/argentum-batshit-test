name: Ferocity current source08 priority observation qualification
on:
  push:
    branches: ["ferocity/current-priority-observation-20260929"]
    paths: [".github/workflows/ferocity-current-priority-observation.yml"]
permissions: {contents: read}
jobs:
  four-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact source08 priority requirement and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/ferocity-current-priority-observation
          test "$(git rev-parse HEAD^)" = "86e4e5f635172d2da668c205997f99251476c452"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/ferocity/FerocityPriorityObservationTest.kt)" = "d4e1ca243425c360db81654cc40ff8fd9e4e2bf6"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/ferocity/FerocityDevelopmentAdmission.kt)" = "c64afaf0dac73fe4a73e47a58ababa60a5888064"
          test "$(git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/CURRENT_PRIORITY_OBSERVATION_BUDGET.json)" = "be060e7aeab95c910f889dcf44274973ebc286b1"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/ferocity/FerocityPriorityObservationTest.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/ferocity/FerocityDevelopmentAdmission.kt; git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/CURRENT_PRIORITY_OBSERVATION_BUDGET.json; git hash-object .github/workflows/ferocity-current-priority-observation.yml; git status --porcelain; } > build/reports/ferocity-current-priority-observation/source.txt
      - name: Execute exact four current priority-observation cases
        shell: bash
        run: |
          set -o pipefail
          just test-class FerocityPriorityObservationTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/ferocity-current-priority-observation/test.log
      - name: Preserve XML
        if: always()
        run: cp gym/build/test-results/test/TEST-com.wingedsheep.gym.ferocity.FerocityPriorityObservationTest.xml build/reports/ferocity-current-priority-observation/ 2>/dev/null || true
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ferocity-current-priority-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/ferocity-current-priority-observation/
          if-no-files-found: error
          retention-days: 90

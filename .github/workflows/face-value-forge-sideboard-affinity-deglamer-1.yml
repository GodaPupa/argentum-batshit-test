name: Face Value Forge Sideboard Affinity Deglamer 1

on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-forge-sideboard-affinity-deglamer-1.yml]

permissions:
  contents: read

jobs:
  affinity-deglamer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone and build stock Forge
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src rev-parse HEAD | tee forge-source-commit.txt
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"
      - name: Write control challenger and Affinity
        run: |
          set -euo pipefail
          mkdir -p decks "$HOME/.forge/decks/constructed"
          cat > /tmp/base <<'EOF'
          4 Llanowar Elves
          4 Nest Invader
          4 Eldrazi Repurposer
          1 Eyeless Watcher
          4 Wretched Gryff
          2 It of the Horrid Swarm
          2 Annoyed Altisaur
          1 Drownyard Lurker
          1 Nyxborn Hydra
          3 Generous Ent
          4 Malevolent Rumble
          4 Preordain
          2 Snap
          1 Lose Focus
          1 Tamiyo's Safekeeping
          2 Growth Spasm
          9 Forest
          8 Island
          3 Tangled Islet
          EOF
          { printf '[metadata]\nName=Face Value v1.2 Control\nDeck Type=constructed\n[main]\n'; cat /tmp/base; } > 'decks/Face Value v1.2 Control.dck'
          # Compact package: preserve all four Gryffs, Ents, Llanowars, Invaders and Repurposers.
          sed -e '/1 Eyeless Watcher/d' -e '/1 Nyxborn Hydra/d' -e 's/4 Preordain/3 Preordain/' /tmp/base > /tmp/deg
          { printf '[metadata]\nName=Face Value Affinity Deglamer 3\nDeck Type=constructed\n[main]\n'; cat /tmp/deg; printf '3 Deglamer\n'; } > 'decks/Face Value Affinity Deglamer 3.dck'
          cat > 'decks/Grixis Affinity.dck' <<'EOF'
          [metadata]
          Name=Grixis Affinity
          Deck Type=constructed
          [main]
          4 Myr Enforcer
          4 Refurbished Familiar
          4 Krark-Clan Shaman
          4 Deadly Dispute
          4 Reckoner's Bargain
          4 Galvanic Blast
          4 Thoughtcast
          4 Ichor Wellspring
          4 Nihil Spellbomb
          4 Blood Fountain
          4 Drossforge Bridge
          4 Mistvault Bridge
          4 Silverbluff Bridge
          4 Vault of Whispers
          4 Seat of the Synod
          EOF
          cp decks/*.dck "$HOME/.forge/decks/constructed/"
          seq 1130001 1130020 > affinity-deg-seeds.txt
          sha256sum affinity-deg-seeds.txt decks/*.dck | tee affinity-deg-inputs.sha256
      - name: Run paired Affinity block
        run: |
          set -euo pipefail
          mkdir -p affinity-deg-logs/control affinity-deg-logs/deg
          while read -r seed; do
            "$FORGE_LAUNCHER" sim -d 'Face Value v1.2 Control.dck' 'Grixis Affinity.dck' -n 1 -s "$seed" -c 300 > "affinity-deg-logs/control/$seed.log" 2>&1
            "$FORGE_LAUNCHER" sim -d 'Face Value Affinity Deglamer 3.dck' 'Grixis Affinity.dck' -n 1 -s "$seed" -c 300 > "affinity-deg-logs/deg/$seed.log" 2>&1
          done < affinity-deg-seeds.txt
      - name: Audit paired Affinity block
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          names={'control':'Face Value v1.2 Control','deg':'Face Value Affinity Deglamer 3'}
          out={}
          for cfg,name in names.items():
            rec=[]
            for p in sorted((Path('affinity-deg-logs')/cfg).glob('*.log')):
              t=p.read_text(errors='replace')
              if re.search(r'Ai\(1\)-'+re.escape(name)+r' has won!',t): w='face'
              elif re.search(r'Ai\(2\)-Grixis Affinity has won!',t): w='affinity'
              elif 'ended in a Draw' in t: w='draw'
              else: w='unknown'
              rec.append({'seed':int(p.stem),'winner':w,'timeout':bool(re.search(r'java\.util\.concurrent\.TimeoutException|Stopping slow match as draw',t)),'stack_overflow':bool(re.search(r'java\.lang\.StackOverflowError',t)),'deglamer_casts':len(re.findall(r'cast Deglamer',t)),'gryff_emerge':len(re.findall(r'Wretched Gryff - Creature 3 / 4 \(Emerge\)',t)),'enforcer_casts':len(re.findall(r'cast Myr Enforcer',t)),'familiar_casts':len(re.findall(r'cast Refurbished Familiar',t)),'shaman_casts':len(re.findall(r'cast Krark-Clan Shaman',t))})
            out[cfg]={'games':len(rec),'wins':sum(x['winner']=='face' for x in rec),'losses':sum(x['winner']=='affinity' for x in rec),'draws':sum(x['winner']=='draw' for x in rec),'unknown':sum(x['winner']=='unknown' for x in rec),'timeouts':sum(x['timeout'] for x in rec),'stack_overflows':sum(x['stack_overflow'] for x in rec),'deglamer_casts':sum(x['deglamer_casts'] for x in rec),'gryff_emerge':sum(x['gryff_emerge'] for x in rec),'enforcer_casts':sum(x['enforcer_casts'] for x in rec),'familiar_casts':sum(x['familiar_casts'] for x in rec),'shaman_casts':sum(x['shaman_casts'] for x in rec),'records':rec}
          Path('affinity-deg-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps({k:{kk:vv for kk,vv in v.items() if kk!='records'} for k,v in out.items()},indent=2,sort_keys=True))
          for cfg,v in out.items(): assert v['games']==20 and v['unknown']==0 and v['timeouts']==0 and v['stack_overflows']==0,(cfg,v)
          PY
      - name: Preserve Affinity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-forge-sideboard-affinity-deglamer-1
          path: |
            affinity-deg-summary.json
            affinity-deg-seeds.txt
            affinity-deg-inputs.sha256
            affinity-deg-logs/**/*.log
            forge-source-commit.txt
            decks/*.dck
          if-no-files-found: warn

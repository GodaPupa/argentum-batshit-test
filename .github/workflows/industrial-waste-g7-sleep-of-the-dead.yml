name: Industrial Waste — Sleep of the Dead Capability

on:
  push:
    branches: [industrial-waste/lab]
    paths:
      - .github/workflows/industrial-waste-g7-sleep-of-the-dead.yml
      - mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/core/Keyword.kt
      - mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/KeywordAbility.kt
      - mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/TapEffects.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/core/GameAction.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/core/BeginningPhaseManager.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/state/components/battlefield/BattlefieldComponents.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/spell/CastZoneResolver.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/spell/CastSpellHandler.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/legalactions/enumerators/CastFromZoneEnumerator.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/permanent/PermanentExecutors.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/permanent/tapping/TapUntapExecutor.kt
      - mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/thb/cards/SleepOfTheDead.kt
      - mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/SleepOfTheDeadScenarioTest.kt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sleep-of-the-dead-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Sleep of the Dead scenario and compile AI
        run: ./gradlew :mtg-sets:2017-2022:tests:test --tests '*SleepOfTheDead*' :ai:compileTestKotlin --no-daemon

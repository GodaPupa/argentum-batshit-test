name: Manual shared main136 receiving
on:
  push:
    branches: ['manual/pr210-receiving-once-20260927']
permissions:
  contents: read
jobs:
  receive:
    if: github.event.before == '0000000000000000000000000000000000000000' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: 44c0be8b20221fe391c9513ea4668459375a6f0d
      UPDATE_SNAPSHOTS: '0'
      GRADLE_LOCK_SLOTS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 44c0be8b20221fe391c9513ea4668459375a6f0d
          fetch-depth: 1
      - name: Fetch immutable composition source
        run: git fetch --no-tags --depth=1 origin a333dc1e6b8c2e78961bbbe052ee01105e2f1264
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind the independently reviewed prospective supplement
        run: |
          set -euo pipefail
          mkdir -p build/reports/manual-pr210-receiving
          python - <<'PY'
          import hashlib,pathlib,subprocess
          expected={'proposal.json': '9d2aea898f91895d4a56b211719e767ca5a3bf86d408a42346783fbaa7e2c3b1', 'qualify.py': '5055085185a3f4f0ab552fc180f6421a8937235f9b961d67b267f4e8e4fc2a41', 'Justfile': '15e21b7dbeab7db5a013441cdec821a49aa483133d126dc261291b1c4efd4865'}
          for name,digest in expected.items():
              assert hashlib.sha256(pathlib.Path('experiments/manual-transmission-phase2/pr210-receiving',name).read_bytes()).hexdigest()==digest
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()=='7255b8b4b6869af203570783ab428b9878914a07'
          PY
          python experiments/manual-transmission-phase2/pr210-receiving/qualify.py bind 2>&1 | tee build/reports/manual-pr210-receiving/bind.log
      - name: Execute exactly the original compatibility class union
        run: |
          set -uo pipefail
          set +e
          just --justfile experiments/manual-transmission-phase2/pr210-receiving/Justfile --working-directory . qualify 2>&1 | tee build/reports/manual-pr210-receiving/tests.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > build/reports/manual-pr210-receiving/exit.txt
          exit "$rc"
      - name: Reconcile source and complete raw case inventory
        if: always()
        run: python experiments/manual-transmission-phase2/pr210-receiving/qualify.py collect
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manual-pr210-receiving-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/manual-pr210-receiving/
            **/build/test-results/test/*.xml
          if-no-files-found: error
          retention-days: 90

name: Izzet Position-1 Boreal Druid Qualification
on:
  push:
    branches: ["izzet/position1-boreal-druid-pin-repair-20260930"]
    paths:
      - "mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/csp/cards/BorealDruid.kt"
      - "mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/BorealDruidScenarioTest.kt"
      - "experiments/izzet-science/POSITION1_BOREAL_DRUID_BUDGET_20260930.json"
      - ".github/workflows/izzet-position1-boreal-druid-qualification.yml"
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact Boreal Druid candidate reused primitives budget and ancestry
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/izzet-boreal-druid
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD~7)" = "5a42df45d1a7a57d0e0e308e7ef13067dc0d2dde"
          test "$(git rev-parse HEAD~3)" = "15ae61f8b571be39065966f4433055dbe8de87f9"
          test "$(git rev-parse HEAD~2)" = "7caacebdbd314e6d6038ec80bdb2b34fdcfb6d6b"
          test "$(git rev-parse HEAD^)" = "776c0dd5e4c5a4c8681f42e159bab5e8a40d779d"
          test "$(git hash-object mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/csp/cards/BorealDruid.kt)" = "73c1d53e5c331d4809482698fdff7d4f55cb22c9"
          test "$(git hash-object mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/BorealDruidScenarioTest.kt)" = "1ed9a4c472f1f497de6bea12a3d17e9fce3bd710"
          test "$(git hash-object experiments/izzet-science/POSITION1_BOREAL_DRUID_BUDGET_20260930.json)" = "e4ea62b56cd7bb15351d74654c7c7ed299cb3063"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/dsl/Effects.kt)" = "1904846d3b5ad489224784b5d9687c68f8b207ee"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/ManaEffects.kt)" = "ce3a338dc502068662da0b21884005b5eec1a52a"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/mana/AddColorlessManaExecutor.kt)" = "7c394962561083925c90ec508caf545c6b9fd138"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/state/components/player/PlayerComponents.kt)" = "3a375f2d1a53976acf587bfa2f23f9e290add040"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/wth/cards/MindStone.kt)" = "8df40683f099a0e890bbc505f67cbfb360744e52"
          test "$(git hash-object mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/csp/ColdsnapSet.kt)" = "5b1b600a765f2a8d65785126efcd1f430fbffc7c"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git rev-parse HEAD^^
            git rev-parse HEAD~3
            git rev-parse HEAD~4
            git rev-parse HEAD~5
            git rev-parse HEAD~6
            git rev-parse HEAD~7
            git hash-object mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/csp/cards/BorealDruid.kt
            git hash-object mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/BorealDruidScenarioTest.kt
            git hash-object experiments/izzet-science/POSITION1_BOREAL_DRUID_BUDGET_20260930.json
            git hash-object .github/workflows/izzet-position1-boreal-druid-qualification.yml
            git status --porcelain
          } > "$OUT/source.txt"
          test ! -s <(git status --porcelain)
      - name: Run exact Boreal Druid semantic case
        shell: bash
        run: |
          set -euo pipefail
          just test-class BorealDruidScenarioTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-boreal-druid/scenarios.log
          xml="$(find . -path '*/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.BorealDruidScenarioTest.xml' -type f -print -quit)"
          test -n "$xml" && test -s "$xml"
          cp "$xml" build/reports/izzet-boreal-druid/
      - name: Regenerate snapshots and run card lint
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:test --tests '*CardDefinitionSnapshotTest' --tests '*CardLintTest' -DupdateSnapshots=true --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-boreal-druid/snapshot-lint.log
      - name: Require only Boreal Druid snapshot additions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess, hashlib
          targets=[
            "mtg-sets/src/test/resources/snapshots/cards/ALL.json",
            "mtg-sets/src/test/resources/snapshots/cards/CSP.json",
          ]
          changed=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          assert changed == targets, changed
          def records(text):
              out={}
              for block in re.split(r'\n\n(?=// )', text.strip()):
                  heading, body=block.split('\n',1)
                  assert heading.startswith("// "), heading
                  name=heading[3:]
                  assert name not in out, name
                  out[name]=(body,json.loads(body))
              return out
          report={}
          for target in targets:
              before=subprocess.check_output(["git","show","HEAD:"+target],text=True)
              after=pathlib.Path(target).read_text()
              old,new=records(before),records(after)
              assert set(new)-set(old)=={"Boreal Druid"}, (target,set(new)-set(old))
              assert not (set(old)-set(new)), (target,set(old)-set(new))
              assert all(old[n]==new[n] for n in old), target+" existing record changed"
              card=new["Boreal Druid"][1]
              assert card["name"]=="Boreal Druid"
              assert card["manaCost"]=="{G}"
              assert card["typeLine"]=="Snow Creature — Elf Druid"
              assert card["oracleText"]=="{T}: Add {C}."
              report[target]={
                  "sha256":hashlib.sha256(pathlib.Path(target).read_bytes()).hexdigest(),
                  "added_records":["Boreal Druid"],
                  "unchanged_existing_records":len(old),
              }
              pathlib.Path("build/reports/izzet-boreal-druid/"+pathlib.Path(target).name).write_bytes(pathlib.Path(target).read_bytes())
          pathlib.Path("build/reports/izzet-boreal-druid/generated-binding.json").write_text(json.dumps(report,indent=2)+"\n")
          pathlib.Path("build/reports/izzet-boreal-druid/generated-delta.patch").write_bytes(subprocess.check_output(["git","diff","--"]+targets))
          PY
          git diff --check
      - name: Verify exact semantic XML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          p=pathlib.Path("build/reports/izzet-boreal-druid/TEST-com.wingedsheep.engine.scenarios.BorealDruidScenarioTest.xml")
          x=ET.parse(p).getroot()
          assert int(x.attrib["tests"])==1
          assert int(x.attrib.get("failures","0"))==0
          assert int(x.attrib.get("errors","0"))==0
          assert int(x.attrib.get("skipped","0"))==0
          PY
      - name: Preserve exact original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-position1-boreal-druid-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-boreal-druid/
          if-no-files-found: error
          retention-days: 90

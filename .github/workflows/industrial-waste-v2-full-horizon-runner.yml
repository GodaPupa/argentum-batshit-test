name: Industrial Waste v2 R1 Full-Horizon Runner

on:
  push:
    branches:
      - industrial-waste/v2-structural-redesign
    paths:
      - .github/workflows/industrial-waste-v2-full-horizon-runner.yml

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Qualify full-horizon synthetic runner without official corpus access
        run: ./gradlew :ai:test --tests "*IndustrialWasteV2FullHorizonRunnerTest"

      - name: Preserve full-horizon runner evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-v2-r1-full-horizon-runner
          path: ai/build/test-results/test/TEST-com.wingedsheep.ai.industrialwaste.IndustrialWasteV2FullHorizonRunnerTest.xml
          if-no-files-found: error
          retention-days: 14

name: Izzet Position-1 Turn Aside Qualification
on:
  push:
    branches: ["izzet/position1-turn-aside-20260929"]
    paths:
      - "mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/som/cards/TurnAside.kt"
      - "mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/TurnAsideScenarioTest.kt"
      - "experiments/izzet-science/POSITION1_TURN_ASIDE_BUDGET_20260929.json"
      - ".github/workflows/izzet-position1-turn-aside-qualification.yml"
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact Turn Aside sources reused primitives budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/izzet-turn-aside
          test "$(git rev-parse HEAD^)" = "5dcba2567e8b29bde9bcb9bb44a834f2052e52d3"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/som/cards/TurnAside.kt)" = "96a656b7fdd77ae10045d523e281eb34f5cb711e"
          test "$(git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/TurnAsideScenarioTest.kt)" = "0eec9947e43bb43a9c3bbe9d90a33626a243cf3f"
          test "$(git hash-object experiments/izzet-science/POSITION1_TURN_ASIDE_BUDGET_20260929.json)" = "4907751d3a30c1245cacc05fd85292fca570b589"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/filters/unified/ObjectFilter.kt)" = "3c3793b2f27022f4c0a3c2693c44baa7a176f6a0"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/predicates/CardPredicate.kt)" = "6b7457a59d266a5d8b431a74ecefe6d3e7c1e1c9"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/filters/unified/TargetFilter.kt)" = "0d0a1fd4b8975bac4d05b7a44883eef376ffb4a3"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/stack/CounterEffectExecutor.kt)" = "a46651a83da18774daa93a110ae9b0d62481f3c9"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/StackEffects.kt)" = "8ad94eec5fc9f88cb7920e911a8fc173749d7db7"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/som/cards/TurnAside.kt
            git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/TurnAsideScenarioTest.kt
            git hash-object experiments/izzet-science/POSITION1_TURN_ASIDE_BUDGET_20260929.json
            git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/filters/unified/ObjectFilter.kt
            git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/predicates/CardPredicate.kt
            git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/filters/unified/TargetFilter.kt
            git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/stack/CounterEffectExecutor.kt
            git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/StackEffects.kt
            git hash-object .github/workflows/izzet-position1-turn-aside-qualification.yml
            git status --porcelain
          } > build/reports/izzet-turn-aside/source.txt
      - name: Run exact Turn Aside semantic cases
        shell: bash
        run: |
          set -euo pipefail
          just test-class TurnAsideScenarioTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-turn-aside/scenarios.log
          xml="$(find . -path '*/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.TurnAsideScenarioTest.xml' -type f -print -quit)"
          test -n "$xml" && test -s "$xml"
          cp "$xml" build/reports/izzet-turn-aside/
      - name: Regenerate exact SOM snapshot and run card lint
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:test --tests '*CardDefinitionSnapshotTest' --tests '*CardLintTest' -DupdateSnapshots=true --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-turn-aside/snapshot-lint.log
      - name: Require only Turn Aside snapshot addition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess, hashlib
          target="mtg-sets/src/test/resources/snapshots/cards/SOM.json"
          changed=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          assert changed == [target], changed
          before=subprocess.check_output(["git","show","HEAD:"+target],text=True)
          after=pathlib.Path(target).read_text()
          def records(text):
              out={}
              for block in re.split(r'\n\n(?=// )', text.strip()):
                  heading, body=block.split('\n',1)
                  assert heading.startswith("// "), heading
                  name=heading[3:]
                  assert name not in out, name
                  out[name]=(body,json.loads(body))
              return out
          old,new=records(before),records(after)
          assert set(new)-set(old)=={"Turn Aside"}, set(new)-set(old)
          assert not (set(old)-set(new)), set(old)-set(new)
          assert all(old[n]==new[n] for n in old), "existing SOM card tree changed"
          card=new["Turn Aside"][1]
          assert card["name"]=="Turn Aside"
          assert card["manaCost"]=="{U}"
          out=pathlib.Path("build/reports/izzet-turn-aside")
          (out/"SOM.json").write_bytes(pathlib.Path(target).read_bytes())
          (out/"generated-delta.patch").write_bytes(subprocess.check_output(["git","diff","--",target]))
          (out/"generated-binding.json").write_text(json.dumps({
              "path":target,
              "sha256":hashlib.sha256(pathlib.Path(target).read_bytes()).hexdigest(),
              "added_records":["Turn Aside"],
              "unchanged_existing_records":len(old)
          },indent=2)+"\n")
          PY
          git diff --check
      - name: Verify exact semantic XML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          p=pathlib.Path("build/reports/izzet-turn-aside/TEST-com.wingedsheep.engine.scenarios.TurnAsideScenarioTest.xml")
          x=ET.parse(p).getroot()
          assert int(x.attrib["tests"])==3
          assert int(x.attrib.get("failures","0"))==0
          assert int(x.attrib.get("errors","0"))==0
          assert int(x.attrib.get("skipped","0"))==0
          PY
      - name: Preserve exact original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-position1-turn-aside-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-turn-aside/
          if-no-files-found: error
          retention-days: 90

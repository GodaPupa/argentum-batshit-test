name: Izzet Position-1 counter pair mechanics
on:
  push:
    branches: ["izzet/position1-counter-pair-20260929"]
    paths: [".github/workflows/izzet-position1-counter-pair.yml"]
permissions: {contents: read}
jobs:
  six-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact counter-pair sources tests budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/izzet-position1-counter-pair
          test "$(git rev-parse HEAD^)" = "15508c85a6d5c0be8f769153b98438de06b47afa"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/all/cards/ArcaneDenial.kt)" = "b80ac4364d27398cffde16e5f6d6a41eb0792ea9"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/hml/cards/MemoryLapse.kt)" = "e07d873bfccc9634cc0121fe988003e5af1e3fbc"
          test "$(git hash-object mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ArcaneDenialScenarioTest.kt)" = "0046c1bbaef6c037be51b796c1cb9b7349e4598e"
          test "$(git hash-object mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/MemoryLapseScenarioTest.kt)" = "e7e60d5a68e4b8d5f2f016a88364b3b25413853b"
          test "$(git hash-object experiments/izzet-science/position1-counter-pair-mechanics-budget-20260929.json)" = "ddff4a73db3efe5dd04698f700ac5e796e6bf694"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/StackEffects.kt)" = "8ad94eec5fc9f88cb7920e911a8fc173749d7db7"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/stack/CounterEffectExecutor.kt)" = "a46651a83da18774daa93a110ae9b0d62481f3c9"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt)" = "a46aed0092806245462dbd881fab327d838de4e7"\n          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/ManaPaymentContinuationResumer.kt)" = "30966ffbfa84801761c6f98a33a2adecee627da9"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/all/cards/ArcaneDenial.kt; git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/hml/cards/MemoryLapse.kt; git hash-object mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ArcaneDenialScenarioTest.kt; git hash-object mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/MemoryLapseScenarioTest.kt; git hash-object experiments/izzet-science/position1-counter-pair-mechanics-budget-20260929.json; git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/StackEffects.kt; git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/stack/CounterEffectExecutor.kt; git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt; git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/ManaPaymentContinuationResumer.kt; git hash-object .github/workflows/izzet-position1-counter-pair.yml; git status --porcelain; } > build/reports/izzet-position1-counter-pair/source.txt
      - name: Run exact six counter-pair mechanics cases
        shell: bash
        run: |
          set -o pipefail
          just test-class ArcaneDenialScenarioTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-position1-counter-pair/arcane.log
          just test-class MemoryLapseScenarioTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-position1-counter-pair/lapse.log
      - name: Preserve XML
        if: always()
        shell: bash
        run: |
          find . -path '*/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.ArcaneDenialScenarioTest.xml' -type f -exec cp {} build/reports/izzet-position1-counter-pair/ \; || true
          find . -path '*/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.MemoryLapseScenarioTest.xml' -type f -exec cp {} build/reports/izzet-position1-counter-pair/ \; || true
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-position1-counter-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-position1-counter-pair/
          if-no-files-found: error
          retention-days: 90

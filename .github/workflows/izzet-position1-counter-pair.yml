name: Izzet Position-1 counter pair mechanics
on:
  push:
    branches: ["izzet/position1-counter-pair-20260929"]
    paths: [".github/workflows/izzet-position1-counter-pair.yml"]
permissions: {contents: read}
jobs:
  six-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact counter-pair sources tests budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/izzet-position1-counter-pair
          test "$(git rev-parse HEAD^)" = "cffc5b70663a3de6119ecdfaf9bd328bb494d96c"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/all/cards/ArcaneDenial.kt)" = "b80ac4364d27398cffde16e5f6d6a41eb0792ea9"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/hml/cards/MemoryLapse.kt)" = "e07d873bfccc9634cc0121fe988003e5af1e3fbc"
          test "$(git hash-object mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ArcaneDenialScenarioTest.kt)" = "3d559542025a5415a2b0aebf7a4c5f39870278de"
          test "$(git hash-object mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/MemoryLapseScenarioTest.kt)" = "e7e60d5a68e4b8d5f2f016a88364b3b25413853b"
          test "$(git hash-object experiments/izzet-science/position1-counter-pair-mechanics-budget-20260929.json)" = "ddff4a73db3efe5dd04698f700ac5e796e6bf694"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/StackEffects.kt)" = "8ad94eec5fc9f88cb7920e911a8fc173749d7db7"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/stack/CounterEffectExecutor.kt)" = "a46651a83da18774daa93a110ae9b0d62481f3c9"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt)" = "a46aed0092806245462dbd881fab327d838de4e7"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/ManaPaymentContinuationResumer.kt)" = "30966ffbfa84801761c6f98a33a2adecee627da9"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/composite/CreateDelayedTriggerExecutor.kt)" = "36cb0af0ce66def8baa0adae50d60ab06b22ddcf"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/drawing/DrawUpToExecutor.kt)" = "053337d3aafbe24a1d05fe414733fda4f5888f34"
          test "$(git hash-object rules-engine/src/test/kotlin/com/wingedsheep/engine/handlers/effects/drawing/DrawUpToSpecificEntityPlayerTest.kt)" = "b13b1f5c5ff13b9e854ce1973dbb72b29938777e"
          test "$(git hash-object experiments/izzet-science/position1-draw-up-to-specific-player-repair-budget-20260929.json)" = "650ff14ebcf1a8b6ba86a66544cb09c464fd90eb"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/all/cards/ArcaneDenial.kt; git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/hml/cards/MemoryLapse.kt; git hash-object mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ArcaneDenialScenarioTest.kt; git hash-object mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/MemoryLapseScenarioTest.kt; git hash-object experiments/izzet-science/position1-counter-pair-mechanics-budget-20260929.json; git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/StackEffects.kt; git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/stack/CounterEffectExecutor.kt; git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt; git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/ManaPaymentContinuationResumer.kt; git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/composite/CreateDelayedTriggerExecutor.kt; git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/drawing/DrawUpToExecutor.kt; git hash-object rules-engine/src/test/kotlin/com/wingedsheep/engine/handlers/effects/drawing/DrawUpToSpecificEntityPlayerTest.kt; git hash-object experiments/izzet-science/position1-draw-up-to-specific-player-repair-budget-20260929.json; git hash-object .github/workflows/izzet-position1-counter-pair.yml; git status --porcelain; } > build/reports/izzet-position1-counter-pair/source.txt
      - name: Run and preserve focused DrawUpTo SpecificEntity regression
        shell: bash
        run: |
          set -euo pipefail
          just test-class DrawUpToSpecificEntityPlayerTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-position1-counter-pair/draw-up-to.log
          focused_xml="$(find . -path '*/build/test-results/test/TEST-com.wingedsheep.engine.handlers.effects.drawing.DrawUpToSpecificEntityPlayerTest.xml' -type f -print -quit)"
          test -n "$focused_xml" && test -s "$focused_xml"
          cp "$focused_xml" build/reports/izzet-position1-counter-pair/
      - name: Run and preserve Arcane Denial semantic cases
        shell: bash
        run: |
          set -euo pipefail
          just test-class ArcaneDenialScenarioTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-position1-counter-pair/arcane.log
          arcane_xml="$(find . -path '*/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.ArcaneDenialScenarioTest.xml' -type f -print -quit)"
          test -n "$arcane_xml" && test -s "$arcane_xml"
          cp "$arcane_xml" build/reports/izzet-position1-counter-pair/
      - name: Run and preserve Memory Lapse semantic cases
        shell: bash
        run: |
          set -euo pipefail
          just test-class MemoryLapseScenarioTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-position1-counter-pair/lapse.log
          lapse_xml="$(find . -path '*/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.MemoryLapseScenarioTest.xml' -type f -print -quit)"
          test -n "$lapse_xml" && test -s "$lapse_xml"
          cp "$lapse_xml" build/reports/izzet-position1-counter-pair/
      - name: Verify all three XML originals are preserved
        shell: bash
        run: |
          set -euo pipefail
          test -s build/reports/izzet-position1-counter-pair/TEST-com.wingedsheep.engine.handlers.effects.drawing.DrawUpToSpecificEntityPlayerTest.xml
          test -s build/reports/izzet-position1-counter-pair/TEST-com.wingedsheep.engine.scenarios.ArcaneDenialScenarioTest.xml
          test -s build/reports/izzet-position1-counter-pair/TEST-com.wingedsheep.engine.scenarios.MemoryLapseScenarioTest.xml
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-position1-counter-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-position1-counter-pair/
          if-no-files-found: error
          retention-days: 90

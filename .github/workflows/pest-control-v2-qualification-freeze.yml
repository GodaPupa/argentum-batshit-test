name: Pest Control V2 Qualification Seed Freeze

on:
  pull_request:
    paths:
      - scripts/experiments/pest-control/generate_v2_qualification_freeze.py
      - .github/workflows/pest-control-v2-qualification-freeze.yml
      - docs/experiments/pest-control/v2-qualification-seed-freeze-gate.md
  workflow_dispatch:
    inputs:
      freeze_ack:
        description: Exact one-time seed-freeze acknowledgement; this never runs games
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: pest-control-v2-qualification-seed-freeze
  cancel-in-progress: false

jobs:
  validate-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Deterministic entropy-free validation
        run: |
          python3 scripts/experiments/pest-control/generate_v2_qualification_freeze.py --preflight
          python3 scripts/experiments/pest-control/generate_v2_qualification_freeze.py \
            --validate-fixture \
            --output-dir build/reports/pest-control-v2-qualification-freeze-fixture
          test "$(python3 -c 'import json; print(json.load(open("build/reports/pest-control-v2-qualification-freeze-fixture/freeze-manifest.json"))["status"])')" = "NONEXPERIMENTAL_FIXTURE"

  freeze:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Fail-closed dispatch guard
        env:
          FREEZE_ACK: ${{ inputs.freeze_ack }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "${FREEZE_ACK}" = "GENERATE_PEST_V2_QUALIFICATION_50_NO_GAMEPLAY"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=pest-control-v2-qualification-seed-freeze" --jq '.total_count')" = "0"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Audit frozen source boundary without entropy
        run: python3 scripts/experiments/pest-control/generate_v2_qualification_freeze.py --preflight
      - name: Draw and quarantine exactly once; no gameplay
        env:
          PEST_V2_QUALIFICATION_FREEZE_ACK: ${{ inputs.freeze_ack }}
        run: |
          FREEZE_TREE="$(git rev-parse 'HEAD^{tree}')"
          python3 scripts/experiments/pest-control/generate_v2_qualification_freeze.py \
            --generate \
            --output-dir build/reports/pest-control-v2-qualification-freeze \
            --freeze-commit "${GITHUB_SHA}" \
            --freeze-tree "${FREEZE_TREE}"
      - name: Upload immutable freeze evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-control-v2-qualification-seed-freeze
          path: build/reports/pest-control-v2-qualification-freeze/
          if-no-files-found: error
          retention-days: 90

name: Sphinx consumed accepted Ponder journal continuity targeted
on:
  push:
    branches: ["sphinx/accepted-transition-journal-20260928"]
    paths:
      - ".github/workflows/sphinx-consumed-transition-targeted.yml"
permissions:
  contents: read
jobs:
  two-declared-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind trusted transition, durable file, exact fixture and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/sphinx-consumed-transition-targeted
          test "$(git rev-parse HEAD^)" = "ad35e4e389544f26a97dcb49c1ba04e3790899a8"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt)" = "ff29172b39ab9fb8099cba265e706530691de90f"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageETrustedTransitionFile.kt)" = "6671a492891d6dc41db6dcc6de6244918872c611"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournalTest.kt)" = "d57d8f2f0407f3f7b6a8a3f561d53d832f28cb20"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageETrustedTransitionFile.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournalTest.kt; git hash-object .github/workflows/sphinx-consumed-transition-targeted.yml; git status --porcelain; } > build/reports/sphinx-consumed-transition-targeted/source.txt
      - name: Execute exactly two fresh consumed-transition continuity traces
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:test --tests 'com.wingedsheep.gym.sphinx.SphinxStageEAcceptedTransitionJournalTest' --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/sphinx-consumed-transition-targeted/test.log
      - name: Preserve original exact XML
        if: always()
        shell: bash
        run: |
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageEAcceptedTransitionJournalTest.xml build/reports/sphinx-consumed-transition-targeted/ 2>/dev/null || true
      - name: Upload original targeted evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-consumed-transition-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-consumed-transition-targeted/
          if-no-files-found: error
          retention-days: 90

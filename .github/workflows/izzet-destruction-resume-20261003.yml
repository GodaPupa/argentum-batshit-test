name: Izzet resumable destruction qualification
on:
  push:
    branches: [diagnostic/izzet-destruction-resume-20261003]
    paths: [.github/workflows/izzet-destruction-resume-20261003.yml]
permissions:
  contents: read
concurrency:
  group: izzet-destruction-resume-20261003
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/izzet-destruction-resume-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source-only successor and workflow-only validation child
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['OUT'])
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          source='08b665750134cf6c8af25d76273d9c804cee456b';parent='b1ec11075295874ea5be277b0f9b2b0b01d04022';workflow='.github/workflows/izzet-destruction-resume-20261003.yml'
          expected={'docs/card-sdk-language-reference.md': 'cfd370389f6f5be146870a992f6eeaaae6199758', 'mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/core/Keyword.kt': 'b494b923c512517bfb6100c12c97d805c52b91f8', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/core/DestructionContinuations.kt': '0318f9200dd6d890204304f326448527fdf476c9', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/core/Serialization.kt': '21bbc8753505412116f4a30bfc698a9702e98bb7', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/ContinuationHandler.kt': '1391a5a1ed8149bfdc6c1e015f9e4e52e41e0435', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/DestructionContinuationResumer.kt': 'b56ffe11731a651f221d62f6cd41bde961eb3f2e', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/DestructionReplacements.kt': '2b2f27b2c196c714b6032d3621227d170c583973', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/ZoneMovementUtils.kt': '8d1dca0dadaaac448d1577d7850a71e509299787', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/library/MoveCollectionExecutor.kt': 'c24a2e0d9f4456f722f3f9e169eb96c27f04a25b', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/sba/creature/LethalDamageCheck.kt': '79c2697fbe981ed7cd36b90b75981ebedbbac627', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/DestructionReplacementResumeTest.kt': '4116f9818e716b8aba7eb1d114c29c5d14744769', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/UmbraArmorReplacementTest.kt': '145dfbcf8995a93d5d1ce4a3f1043296cfca20c2', 'web-client/src/assets/icons/keywords/index.ts': '71b954c799855014417f21072ea2e6590759652a', 'web-client/src/types/enums.ts': '6cd6f96c1ed6f0f33e57c10da946fc2d40e34694'}
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==source
          assert git('rev-parse','HEAD^^')==parent
          assert git('rev-parse',source+'^{tree}')=='5ccd321ebbd3488a734990d2660fe3814d698fdd'
          assert git('diff','--name-only',source,'HEAD').splitlines()==[workflow]
          assert git('diff','--name-only',parent,source).splitlines()==sorted(expected)
          assert not git('status','--porcelain')
          for p,blob in expected.items(): assert git('hash-object',p)==blob,p
          binding={'source_head':source,'source_tree':'5ccd321ebbd3488a734990d2660fe3814d698fdd','parent_source_head':parent,
            'validation_head':git('rev-parse','HEAD'),'validation_tree':git('rev-parse','HEAD^{tree}'),
            'source_git_blobs':expected,'source_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected},
            'workflow_sha256':hashlib.sha256(pathlib.Path(workflow).read_bytes()).hexdigest(),
            'scope':'RESUMABLE_DESTRUCTION_SHARED_QUALIFICATION','registry_not_executed':True,'exact_card_admission':False,
            'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
          (out/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          PYCODE
      - name: Compile and run nine destruction and umbra regressions
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-configuration-cache --console=plain --continue --max-workers=1 \
            -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g \
            :rules-engine:test --tests com.wingedsheep.engine.scenarios.DestructionReplacementResumeTest --tests com.wingedsheep.engine.scenarios.UmbraArmorReplacementTest \
            2>&1 | tee "$OUT/qualification.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
          exit "$rc"
      - name: Preserve all actual prerequisite cases and failures; no registry or admission
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,shutil,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
          expected={'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.DestructionReplacementResumeTest.xml': 6, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.UmbraArmorReplacementTest.xml': 3}
          suites=[];problems=[]
          for cls,count in expected.items():
            p=pathlib.Path(cls)
            if not p.exists(): problems.append('Missing '+str(p));continue
            shutil.copy2(p,out/p.name)
            root=ET.parse(p).getroot();cases=root.findall('.//testcase')
            totals={k:int(root.get(k,'0')) for k in ('tests','failures','errors','skipped')}
            suites.append({'class':cls,**totals,'actual_cases':len(cases)})
            if totals!={'tests':count,'failures':0,'errors':0,'skipped':0} or len(cases)!=count:
              problems.append(cls+': '+json.dumps(totals)+' actual='+str(len(cases)))
          (out/'summary.json').write_text(json.dumps({'suites':suites,'problems':problems,'expected_tests':sum(expected.values())},indent=2)+'\n')
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          if problems: raise SystemExit('\n'.join(problems))
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: izzet-destruction-resume-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90


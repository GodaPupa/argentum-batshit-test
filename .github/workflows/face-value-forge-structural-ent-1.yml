name: Face Value Forge Structural Ent 1

on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-forge-structural-ent-1.yml]

permissions:
  contents: read

jobs:
  structural-ent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone Forge and apply validated Face Value heuristics
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src rev-parse HEAD | tee forge-source-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          energy=Path('forge-src/forge-gui/res/cardsfolder/e/energy_tap.txt'); t=energy.read_text()
          old="A:SP$ Tap | TgtPrompt$ Select target untapped creature you control | ValidTgts$ Creature.untapped+YouCtrl | SubAbility$ DBMana | SpellDescription$ Tap target untapped creature you control. If you do, add an amount of {C} equal to that creature's mana value."
          new="A:SP$ Tap | TgtPrompt$ Select target untapped creature you control | ValidTgts$ Creature.untapped+YouCtrl | AILogic$ EnergyTap | SubAbility$ DBMana | SpellDescription$ Tap target untapped creature you control. If you do, add an amount of {C} equal to that creature's mana value."
          assert old in t; energy.write_text(t.replace(old,new).replace('\nAI:RemoveDeck:All',''))
          tap=Path('forge-src/forge-ai/src/main/java/forge/ai/ability/TapAi.java'); s=tap.read_text(); needle='        final Player turn = phase.getPlayerTurn();\n\n'; assert needle in s
          lines=['        final Player turn = phase.getPlayerTurn();','', '        if ("EnergyTap".equals(sa.getParamOrDefault("AILogic", ""))) {','            if (!phase.is(PhaseType.MAIN2, ai)) return new AiAbilityDecision(0, AiPlayDecision.WaitForMain2);','            boolean hasFollowup = ai.getCardsIn(ZoneType.Hand).stream().anyMatch(c ->','                    "Wretched Gryff".equals(c.getName()) || "Drownyard Lurker".equals(c.getName()) || "It of the Horrid Swarm".equals(c.getName()));','            if (!hasFollowup) return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);','            CardCollection candidates = CardLists.getTargetableCards(ai.getCreaturesInPlay(), sa);','            candidates = CardLists.filter(candidates, CardPredicates.CAN_TAP);','            Card choice = ComputerUtilCard.getMostExpensivePermanentAI(candidates);','            if (choice == null || choice.getCMC() < 7) return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);','            sa.resetTargets(); sa.getTargets().add(choice);','            return new AiAbilityDecision(100, AiPlayDecision.WillPlay);','        }','']
          tap.write_text(s.replace(needle,'\n'.join(lines),1))
          rush=Path('forge-src/forge-gui/res/cardsfolder/r/rush_of_knowledge.txt'); r=rush.read_text(); rold='A:SP$ Draw | Defined$ You | NumCards$ X | SpellDescription$ Draw cards equal to the highest mana value among permanents you control.'; rnew='A:SP$ Draw | Defined$ You | NumCards$ X | AILogic$ FaceValueRush | SpellDescription$ Draw cards equal to the highest mana value among permanents you control.'; assert rold in r; rush.write_text(r.replace(rold,rnew))
          draw=Path('forge-src/forge-ai/src/main/java/forge/ai/ability/DrawAi.java'); d=draw.read_text(); dn='        boolean aboutToBeMyTurn = ph.getNextTurn().equals(ai) && ph.is(PhaseType.END_OF_TURN);\n\n'; assert dn in d
          dl=['        boolean aboutToBeMyTurn = ph.getNextTurn().equals(ai) && ph.is(PhaseType.END_OF_TURN);','','        if ("FaceValueRush".equals(sa.getParamOrDefault("AILogic", ""))) {','            int highest = ai.getCardsIn(ZoneType.Battlefield).stream().mapToInt(Card::getCMC).max().orElse(0);','            if (highest < 7) return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);','        }','']
          draw.write_text(d.replace(dn,'\n'.join(dl),1))
          PY
      - name: Build patched Forge
        run: |
          set -euxo pipefail
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"
      - name: Write frozen control and challenger
        run: |
          mkdir -p decks "$HOME/.forge/decks/constructed"
          python3 - <<'PY'
          from pathlib import Path
          shared=['4 Llanowar Elves','4 Nest Invader','4 Eldrazi Repurposer','1 Eyeless Watcher','4 Wretched Gryff','2 It of the Horrid Swarm','2 Annoyed Altisaur','1 Drownyard Lurker','1 Nyxborn Hydra','4 Malevolent Rumble','4 Preordain','2 Snap','1 Lose Focus',"1 Tamiyo's Safekeeping",'2 Growth Spasm','9 Forest','8 Island','3 Tangled Islet']
          variants={'Face Value v1.1':shared+['2 Energy Tap','1 Rush of Knowledge'],'Face Value v1.2 Ent':shared+['3 Generous Ent']}
          for name,cards in variants.items(): Path('decks',name+'.dck').write_text('\n'.join(['[metadata]','Name='+name,'Deck Type=constructed','[main]']+cards)+'\n')
          terror=['[metadata]','Name=Mono Blue Terror Gauntlet','Deck Type=constructed','[main]','4 Delver of Secrets','4 Tolarian Terror','4 Cryptic Serpent','4 Brainstorm','4 Mental Note','4 Thought Scour','4 Counterspell','4 Preordain','4 Lorien Revealed','3 Deem Inferior','2 Dispel','15 Island','2 Mystic Sanctuary','2 Escape Tunnel']
          gruul=['[metadata]','Name=Gruul Ramp Gauntlet','Deck Type=constructed','[main]','4 Arbor Elf','4 Writhing Chrysalis','3 Avenging Hunter','3 Annoyed Altisaur','4 Boarding Party','4 Utopia Sprawl','4 Wild Growth','4 Thermokarst','4 Mwonvuli Acid-Moss','2 Structural Distortion','13 Forest','4 Mountain','4 Wooded Ridgeline','3 Generous Ent']
          Path('decks/Mono Blue Terror Gauntlet.dck').write_text('\n'.join(terror)+'\n'); Path('decks/Gruul Ramp Gauntlet.dck').write_text('\n'.join(gruul)+'\n')
          PY
          cp decks/*.dck "$HOME/.forge/decks/constructed/"
          seq 1040001 1040020 > structural-seeds.txt
          sha256sum structural-seeds.txt decks/*.dck | tee structural-inputs.sha256
      - name: Run paired structural block
        run: |
          set -euo pipefail
          mkdir -p structural-logs
          for opp in 'Mono Blue Terror Gauntlet' 'Gruul Ramp Gauntlet'; do
            oslug=$(echo "$opp" | tr ' ' '_')
            for variant in 'Face Value v1.1' 'Face Value v1.2 Ent'; do
              vslug=$(echo "$variant" | tr ' ' '_'); mkdir -p "structural-logs/$oslug/$vslug"
              while read -r seed; do "$FORGE_LAUNCHER" sim -d "$variant.dck" "$opp.dck" -n 1 -s "$seed" -c 60 > "structural-logs/$oslug/$vslug/$seed.log" 2>&1; done < structural-seeds.txt
            done
          done
      - name: Audit structural block
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          out={}
          for oppdir in Path('structural-logs').iterdir():
            out[oppdir.name]={}
            for vardir in oppdir.iterdir():
              rec=[]
              for p in sorted(vardir.glob('*.log')):
                text=p.read_text(errors='replace')
                face=bool(re.search(r'Ai\(1\)-Face Value .* has won!',text)); opp=bool(re.search(r'Ai\(2\)-.* has won!',text)); draw='ended in a Draw' in text
                winner='face' if face else 'opp' if opp else 'draw' if draw else 'unknown'
                rec.append({'seed':int(p.stem),'winner':winner,'ent_casts':len(re.findall(r'cast Generous Ent',text)),'ent_landcycle':len(re.findall(r'Generous Ent.*Landcycling|cycled Generous Ent',text,re.I)),'growth_spasm':len(re.findall(r'cast Growth Spasm',text)),'gryff_emerge':len(re.findall(r'Wretched Gryff - Creature 3 / 4 \(Emerge\)',text)),'exception':bool(re.search(r'Exception|StackOverflowError|Stopping slow match as draw',text))})
              n=len(rec); out[oppdir.name][vardir.name]={'games':n,'wins':sum(x['winner']=='face' for x in rec),'losses':sum(x['winner']=='opp' for x in rec),'draws':sum(x['winner']=='draw' for x in rec),'unknown':sum(x['winner']=='unknown' for x in rec),'ent_casts':sum(x['ent_casts'] for x in rec),'ent_landcycle':sum(x['ent_landcycle'] for x in rec),'growth_spasm':sum(x['growth_spasm'] for x in rec),'gryff_emerge':sum(x['gryff_emerge'] for x in rec),'exceptions':sum(x['exception'] for x in rec),'records':rec}
          Path('structural-ent-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)); print(json.dumps({o:{v:{k:x for k,x in d.items() if k!='records'} for v,d in vs.items()} for o,vs in out.items()},indent=2,sort_keys=True))
          for vs in out.values():
            for d in vs.values(): assert d['games']==20 and d['unknown']==0 and d['exceptions']==0,d
          PY
      - name: Preserve structural artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-forge-structural-ent-1
          path: |
            structural-ent-summary.json
            structural-seeds.txt
            structural-inputs.sha256
            structural-logs/**/*.log
            forge-source-commit.txt
            decks/*.dck
          if-no-files-found: warn

name: Pest exhaustive London M5 atomic comparator
on:
  push:
    branches: ["pest/london-predicate-vector-20260928"]
    paths: [".github/workflows/pest-london-m5-atomic-comparator.yml"]
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact comparator sources budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-london-m5-atomic-comparator
          test "$(git rev-parse HEAD^)" = "36ef16935fa0db5ba37378f7455af083dfb752c6"
          test "$(git hash-object ai/src/main/kotlin/com/wingedsheep/ai/engine/EngineAiPlayerController.kt)" = "4f020ea2406e9bd6a87ec389685b48f15df4c5a3"
          test "$(git hash-object ai/src/test/kotlin/com/wingedsheep/ai/engine/PestMonsterLondonM5AtomicComparatorTest.kt)" = "4c3928caacb86e369711b301dc1779604a788e1b"
          test "$(git hash-object docs/experiments/pest-control/london-m5-atomic-comparator-budget-20260929.json)" = "58ca1ab7501fa6dbc89477f693ac2b26f8c9742d"
          test "$(git hash-object docs/experiments/pest-control/generate_london_m5_atomic_bank.py)" = "7b90dba88e76e167b28b6050d5af5f1c3ff3b800"
          test "$(git hash-object docs/experiments/pest-control/london-m5-atomic-bank-budget-20260929.json)" = "0fe998e0134648ee7852d5e52a6ddecc2d886d18"
          test "$(git hash-object docs/experiments/pest-control/tier-one-monster-c2-exact-main-source-map.json)" = "cd1eefdb98c5c8a8e43064548af7d68e480e4192"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object ai/src/main/kotlin/com/wingedsheep/ai/engine/EngineAiPlayerController.kt
            git hash-object ai/src/test/kotlin/com/wingedsheep/ai/engine/PestMonsterLondonM5AtomicComparatorTest.kt
            git hash-object docs/experiments/pest-control/london-m5-atomic-comparator-budget-20260929.json
            git hash-object docs/experiments/pest-control/generate_london_m5_atomic_bank.py
            git hash-object docs/experiments/pest-control/london-m5-atomic-bank-budget-20260929.json
            git hash-object docs/experiments/pest-control/tier-one-monster-c2-exact-main-source-map.json
            git hash-object .github/workflows/pest-london-m5-atomic-comparator.yml
            git status --porcelain
          } > build/reports/pest-london-m5-atomic-comparator/source.txt
      - name: Regenerate accepted atomic bank
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/experiments/pest-control/generate_london_m5_atomic_bank.py > build/reports/pest-london-m5-atomic-comparator/atomic-bank.json
          python3 - <<'PY'
          import json
          p="build/reports/pest-london-m5-atomic-comparator/atomic-bank.json"
          x=json.load(open(p))
          assert x["reachable_seven_card_name_multisets"] == 882297
          assert x["unique_m5_input_signatures"] == 79972
          assert x["unique_atomic_development_questions"] == 6850
          assert x["atomic_bank_sha256"] == "8825cb587a6337d8173a9d93c642a1d979617ef053833fb849362e18a519a49b"
          assert x["signature_to_atoms_sha256"] == "51ffc25991361eaa3bc8f457583eabb964d07442a4205b022ec890b134aac645"
          assert x["truth_assigned"] is False
          PY
      - name: Execute all 6850 raw versus lawful synthetic atoms
        shell: bash
        run: |
          set -o pipefail
          just test-class PestMonsterLondonM5AtomicComparatorTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-london-m5-atomic-comparator/test.log
          test -s ai/build/reports/pest-london-m5-atomic-comparator/comparison-summary.json
          test -s ai/build/reports/pest-london-m5-atomic-comparator/truth-bank.json
          cp ai/build/reports/pest-london-m5-atomic-comparator/comparison-summary.json build/reports/pest-london-m5-atomic-comparator/
          cp ai/build/reports/pest-london-m5-atomic-comparator/truth-bank.json build/reports/pest-london-m5-atomic-comparator/
          python3 - <<'PY'
          import json
          s=json.load(open("build/reports/pest-london-m5-atomic-comparator/comparison-summary.json"))
          t=json.load(open("build/reports/pest-london-m5-atomic-comparator/truth-bank.json"))
          assert s["atoms"] == 6850 and s["mismatches"] == 0
          assert len(t["rows"]) == 6850
          PY
      - name: Preserve comparator outputs
        if: always()
        shell: bash
        run: |
          cp ai/build/reports/pest-london-m5-atomic-comparator/comparison-summary.json build/reports/pest-london-m5-atomic-comparator/ 2>/dev/null || true
          cp ai/build/reports/pest-london-m5-atomic-comparator/truth-bank.json build/reports/pest-london-m5-atomic-comparator/ 2>/dev/null || true
          find . -path '*/build/test-results/test/TEST-com.wingedsheep.ai.engine.PestMonsterLondonM5AtomicComparatorTest.xml' -type f -exec cp {} build/reports/pest-london-m5-atomic-comparator/ \; || true
          sha256sum build/reports/pest-london-m5-atomic-comparator/truth-bank.json > build/reports/pest-london-m5-atomic-comparator/truth-bank.sha256 2>/dev/null || true
      - name: Preserve exact original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-london-m5-atomic-comparator-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-london-m5-atomic-comparator/
          if-no-files-found: error
          retention-days: 90

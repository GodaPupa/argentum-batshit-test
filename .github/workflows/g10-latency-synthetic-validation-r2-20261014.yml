{
  "name": "Argentum G10 excluded synthetic decision attribution R2",
  "on": {
    "push": {
      "branches": [
        "play-first/g10-latency-synthetic-validation-r2-20261014"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "argentum-g10-excluded-synthetic-attribution-r2-20261014",
    "cancel-in-progress": false
  },
  "jobs": {
    "synthetic": {
      "if": "github.repository == 'GodaPupa/argentum-batshit-test' && github.event_name == 'push' && github.ref == 'refs/heads/play-first/g10-latency-synthetic-validation-r2-20261014' && github.run_number == 1 && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "env": {
        "ARGENTUM_G10_SYNTHETIC_ATTRIBUTION": "EXCLUDED_SYNTHETIC_STATE_ONLY",
        "ARGENTUM_G10_SYNTHETIC_EVIDENCE_DIR": "/tmp/g10-excluded-synthetic-${{ github.run_id }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 2,
            "persist-credentials": false
          }
        },
        {
          "name": "Reject unintended source or gameplay scope before any test",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD^)\" = '84a0efc997163c6aa1ca6a4a45a23fb31170bc06'\ntest \"$(git diff --name-only HEAD^ HEAD)\" = '.github/workflows/g10-latency-synthetic-validation-r2-20261014.yml'\ntest \"$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AIPlayer.kt)\" = '7d78e440dad02de8a855fc016bdfb75d3fbd109e'\ntest \"$(git rev-parse HEAD:gym/src/test/kotlin/com/wingedsheep/gym/PlayFirstOneShotPestMonsterTronTest.kt)\" = '5ae14e0ed7212c317deecfa1cbd6a54a809c211a'\ntest \"$(git rev-parse HEAD:.github/workflows/play-first-successor-nonofficial-v2.yml)\" = '18c451f9c20e09e58a109c85c8d3c96c645d2558'\ntest \"$(git rev-parse HEAD:gym/src/test/kotlin/com/wingedsheep/gym/G10DecisionPhaseProbe.kt)\" = '653b574417265a0593d4e0b92cf75a4cad4fc2e2'\ntest \"$(git rev-parse HEAD:gym/src/test/kotlin/com/wingedsheep/gym/G10SyntheticDecisionAttributionTest.kt)\" = 'b121ed6add0d90ac1db86120cbef86adcf580ee3'\ntest \"$(git rev-parse HEAD:docs/experiments/play-first/isolation-v2/G10_SYNTHETIC_ATTRIBUTION_PROTOCOL.md)\" = 'b6a75f7cd1445eb55ba9ce32459ff983dff25f64'\ntest -z \"${PLAY_FIRST_ONE_SHOT_ACK:-}\"\ntest -z \"${PLAY_FIRST_ISOLATED_CASE_FILE:-}\"\ntest -z \"${ARGENTUM_SUCCESSOR_REQUEST_JSON:-}\"\nprintf 'EXCLUDED_SYNTHETIC_ONLY\\n' > \"$RUNNER_TEMP/g10-excluded-gate.txt\"\n"
        },
        {
          "uses": "actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961",
          "with": {
            "distribution": "temurin",
            "java-version": "21"
          }
        },
        {
          "uses": "extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b"
        },
        {
          "uses": "gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6",
          "with": {
            "cache-read-only": true
          }
        },
        {
          "name": "Run ONLY two excluded synthetic real-AI decisions; no action submission",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$ARGENTUM_G10_SYNTHETIC_EVIDENCE_DIR\"\ncp \"$RUNNER_TEMP/g10-excluded-gate.txt\" \"$ARGENTUM_G10_SYNTHETIC_EVIDENCE_DIR/scope-gate.txt\"\ngit rev-parse HEAD HEAD^{tree} HEAD^ > \"$ARGENTUM_G10_SYNTHETIC_EVIDENCE_DIR/source-identities.txt\"\njava -version > \"$ARGENTUM_G10_SYNTHETIC_EVIDENCE_DIR/java-version.txt\" 2>&1\njust test-class G10SyntheticDecisionAttributionTest --no-daemon --no-build-cache --console=plain 2>&1 | tee \"$ARGENTUM_G10_SYNTHETIC_EVIDENCE_DIR/child.log\"\n"
        },
        {
          "name": "Preserve excluded partial timing, failures, and test XML",
          "if": "always()",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$ARGENTUM_G10_SYNTHETIC_EVIDENCE_DIR\"\nif test -d gym/build/test-results/test; then cp -a gym/build/test-results/test \"$ARGENTUM_G10_SYNTHETIC_EVIDENCE_DIR/test-results\"; fi\nif test -d gym/build/reports/tests/test; then cp -a gym/build/reports/tests/test \"$ARGENTUM_G10_SYNTHETIC_EVIDENCE_DIR/test-report\"; fi\nprintf '%s\\n' 'SYNTHETIC_STATE_ONLY_NOT_G10_NOT_G11_NOT_OFFICIAL' > \"$ARGENTUM_G10_SYNTHETIC_EVIDENCE_DIR/evidence-scope.txt\"\nfind \"$ARGENTUM_G10_SYNTHETIC_EVIDENCE_DIR\" -type f -maxdepth 4 -printf '%P %s bytes\\n' | sort > \"$ARGENTUM_G10_SYNTHETIC_EVIDENCE_DIR/inventory.txt\"\n"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "g10-excluded-synthetic-phase-${{ github.run_id }}-attempt-${{ github.run_attempt }}",
            "path": "${{ env.ARGENTUM_G10_SYNTHETIC_EVIDENCE_DIR }}/",
            "if-no-files-found": "error",
            "overwrite": false,
            "retention-days": 90
          }
        }
      ]
    }
  }
}

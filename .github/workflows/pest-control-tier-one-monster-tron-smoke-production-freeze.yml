name: Pest Control Tier-1 Monster Tron Smoke Production Freeze

on:
  push:
    branches:
      - main
    paths:
      - docs/experiments/pest-control/tier-one-monster-tron-auto-freeze-authorization.json

permissions:
  actions: read
  contents: read

concurrency:
  group: pest-control-tier-one-monster-tron-production-freeze
  cancel-in-progress: false

jobs:
  freeze-once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PEST_MONSTER_TRON_AUTO_FREEZE_AUTH: AUTOMATIC_SINGLE_MONSTER_TRON_SMOKE_FREEZE_NO_GAMEPLAY
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify immutable authorization record
        shell: bash
        run: |
          set -euo pipefail
          echo "3934f18558cba9797bd888e6e5a194b72edb25e01e34c16b3cc900ce88a0621a  docs/experiments/pest-control/tier-one-monster-tron-auto-freeze-authorization.json" | sha256sum -c -
          test "${GITHUB_RUN_ATTEMPT}" = "1"

      - name: Download accepted Terror exclusion artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/prior-terror-smoke-freeze build/prior-terror-replication-freeze
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10733086089/zip" -o build/prior-terror-smoke-freeze.zip
          echo "bbf9f20e834f27f838e37de78c905c213a8917651818367360a8e8a140914961  build/prior-terror-smoke-freeze.zip" | sha256sum -c -
          unzip -q build/prior-terror-smoke-freeze.zip -d build/prior-terror-smoke-freeze
          (cd build/prior-terror-smoke-freeze && sha256sum -c artifacts.sha256)

          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10773131628/zip" -o build/prior-terror-replication-freeze.zip
          echo "4d3a19ef7febacb336911ff1271c14ab83a6ea1f99ed34ae154ae154d6ef5f25  build/prior-terror-replication-freeze.zip" | sha256sum -c -
          unzip -q build/prior-terror-replication-freeze.zip -d build/prior-terror-replication-freeze
          (cd build/prior-terror-replication-freeze && sha256sum -c artifacts.sha256)

      - name: Fresh entropy-free preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/experiments/pest-control/generate_tier_one_monster_tron_smoke_freeze.py --preflight --prior-terror-smoke-dir build/prior-terror-smoke-freeze --prior-terror-replication-dir build/prior-terror-replication-freeze | tee build/preflight.json
          grep -Fq '"excluded_values": 566' build/preflight.json
          grep -Fq '"entropy_requested": false' build/preflight.json

      - name: Freeze exact four-seed vector once
        shell: bash
        run: |
          set -euo pipefail
          TREE="$(git rev-parse 'HEAD^{tree}')"
          python3 scripts/experiments/pest-control/generate_tier_one_monster_tron_smoke_freeze.py --generate --prior-terror-smoke-dir build/prior-terror-smoke-freeze --prior-terror-replication-dir build/prior-terror-replication-freeze --output-dir build/official-monster-tron-smoke-freeze --freeze-commit "${GITHUB_SHA}" --freeze-tree "${TREE}" | tee build/production-freeze-summary.json
          grep -Fq '"status": "FROZEN_UNEXECUTED"' build/production-freeze-summary.json
          (cd build/official-monster-tron-smoke-freeze && sha256sum -c artifacts.sha256)
          test "$(wc -l < build/official-monster-tron-smoke-freeze/ordered-seeds.txt)" -eq 4

      - uses: actions/upload-artifact@v4
        with:
          name: pest-control-tier-one-monster-tron-smoke-vector-freeze
          path: build/official-monster-tron-smoke-freeze/
          if-no-files-found: error
          retention-days: 90

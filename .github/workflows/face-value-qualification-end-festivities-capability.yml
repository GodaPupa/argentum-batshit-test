name: Face Value Qualification End the Festivities Capability

on:
  push:
    branches: [face-value/lab]
    paths:
      - .github/workflows/face-value-qualification-end-festivities-capability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: face-value/lab
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate frozen inputs and build accepted Forge profile
        run: |
          set -euxo pipefail
          python3 experiments/face-value/qualification/validate_inputs.py >/dev/null
          FORGE_SHA=f387ede550e336315637a8b765f0927ac768c113
          git clone --filter=blob:none https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src reset --hard
          git -C forge-src clean -fd
          git -C forge-src checkout --detach "$FORGE_SHA"
          python3 experiments/face-value/qualification/apply_forge_profile_v1.py --forge-root forge-src >/dev/null
          python3 experiments/face-value/qualification/apply_forge_profile_v2.py --forge-root forge-src >/dev/null
          python3 experiments/face-value/qualification/apply_forge_profile_v3.py --forge-root forge-src >/dev/null
          python3 experiments/face-value/qualification/apply_forge_profile_v4.py --forge-root forge-src >/dev/null
          python3 experiments/face-value/qualification/apply_forge_profile_v6.py --forge-root forge-src > forge-profile-v6-id.txt
          test "$(cat forge-profile-v6-id.txt)" = 'FACE_VALUE_QUALIFICATION_FORGE_PROFILE_V6_UNDERCITY_TARGETING'
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"

      - name: Freeze diagnostic-only fixtures
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.forge/decks/constructed" end-capability-logs end-capability-decks
          cat > end-capability-decks/end-e1.dck <<'EOF'
          [metadata]
          Name=DIAGNOSTIC ONLY End the Festivities
          Deck Type=constructed
          [main]
          16 End the Festivities
          4 Llanowar Elves
          40 Mountain
          EOF
          cat > end-capability-decks/one-toughness-board.dck <<'EOF'
          [metadata]
          Name=DIAGNOSTIC ONLY One Toughness Board
          Deck Type=constructed
          [main]
          12 Llanowar Elves
          12 Quirion Ranger
          12 Priest of Titania
          24 Forest
          EOF
          cp end-capability-decks/*.dck "$HOME/.forge/decks/constructed/"
          python3 - <<'PY'
          from pathlib import Path
          rows=[]
          for i in range(8):
              rows.append(f'{1+i%2}\t{743001+i}')
          Path('end-capability-assignments.tsv').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY
          cat > end-capability-disposition.txt <<'EOF'
          DIAGNOSTIC_ONLY_END_THE_FESTIVITIES_CAPABILITY
          Seeds 743001-743008 and all outcomes are permanently retired diagnostic material.
          Results have no qualification, tuning, challenger-promotion, or matchup authority.
          EOF

      - name: Execute diagnostic block
        run: |
          set -uo pipefail
          while IFS=$'\t' read -r end_seat seed; do
            log="end-capability-logs/end-seat${end_seat}-${seed}.log"
            if [ "$end_seat" = 1 ]; then
              first='end-e1.dck'; second='one-toughness-board.dck'
            else
              first='one-toughness-board.dck'; second='end-e1.dck'
            fi
            timeout 240 "$FORGE_LAUNCHER" sim -d "$first" "$second" -n 1 -s "$seed" -c 100 > "$log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then printf '\nDIAGNOSTIC_PROCESS_EXIT_%s\n' "$code" >> "$log"; fi
          done < end-capability-assignments.tsv
          exit 0

      - name: Audit End capability
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          records=[]; casts=0; terminal=0; flags=0
          for line in Path('end-capability-assignments.tsv').read_text().splitlines():
              seat,seed=line.split('\t')
              p=Path('end-capability-logs')/f'end-seat{seat}-{seed}.log'
              text=p.read_text(errors='replace') if p.exists() else ''
              c=len(re.findall(r'cast End the Festivities',text,re.I))
              casts+=c
              t=bool(re.search(r'^Game Result: .+(has won|Draw)',text,re.I|re.M))
              terminal+=int(t)
              fl=[]
              for name,pat in {
                  'exception':r'Exception|StackOverflowError|AssertionError',
                  'outer_timeout':r'DIAGNOSTIC_PROCESS_EXIT_124',
                  'missing_deck':r'Deck not found|Unable to load deck',
              }.items():
                  if re.search(pat,text,re.I): fl.append(name)
              if not t: fl.append('missing_terminal')
              flags+=int(bool(fl))
              records.append({'seat':int(seat),'seed':int(seed),'casts':c,'flags':fl,'terminal':t,'log':str(p)})
          summary={'classification':'DIAGNOSTIC_ONLY_END_THE_FESTIVITIES_CAPABILITY','games':len(records),'terminal_games':terminal,'flagged_games':flags,'end_casts':casts,'records':records}
          Path('end-capability-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in summary.items() if k!='records'},indent=2,sort_keys=True))
          assert len(records)==8
          assert terminal==8
          assert flags==0
          assert casts>=2
          PY

      - name: Preserve diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-end-the-festivities-capability
          path: |
            end-capability-summary.json
            end-capability-assignments.tsv
            end-capability-disposition.txt
            end-capability-logs/*.log
            forge-profile-v6-id.txt
          if-no-files-found: warn

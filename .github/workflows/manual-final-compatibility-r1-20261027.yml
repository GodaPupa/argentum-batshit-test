name: Manual final coherent-source compatibility R1
on:
  push:
    branches: [validation/manual-final-compatibility-r1-20261027]
    paths: ['.github/workflows/manual-final-compatibility-r1-20261027.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: a7b8ea73373700d842f9dd42c324db7971ef08e0
  SOURCE_TREE: 899bdcb0606fc845a023f2ffd173ac2fe397184d
  WORKFLOW: .github/workflows/manual-final-compatibility-r1-20261027.yml
  RECORD: experiments/manual-transmission/research/final-compatibility-r1-20261027
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web-client/package-lock.json}
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Exact final compatibility and original reports
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-final-compatibility-r1-${{ github.run_id }}
          path: manual-final-compatibility-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

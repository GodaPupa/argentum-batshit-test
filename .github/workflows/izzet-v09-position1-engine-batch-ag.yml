name: Izzet Position-1 Engine Batch AG

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-ag.yml"

permissions:
  contents: read

jobs:
  qualify-batch-ag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch AG provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'Batch AF is accepted' izzet-science/v09-position1-engine-batch-af-gate.md
          grep -Fq 'Expected post-implementation unresolved count is exactly **20**' izzet-science/v09-position1-engine-batch-ag-gate.md
          test "$(git show --format= --name-only 1277e6daa35e28eddc03153420ec45a1bd8520f6 | sed '/^$/d' | wc -l)" -eq 1
          test "$(git show --format= --name-only 1277e6daa35e28eddc03153420ec45a1bd8520f6 | sed '/^$/d')" = "mtg-sets/src/test/resources/snapshots/cards/M20.json"

      - name: Requalify canonical card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --stacktrace

      - name: Requalify Leafkin Druid semantics
        run: scripts/test-class LeafkinDruidBatchAGScenarioTest --info --stacktrace

      - name: Run exact real-engine coverage regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-ag.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=20' /tmp/batch-ag.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Leafkin Druid' /tmp/batch-ag.txt
          ! grep -Fq 'V09_REAL_ENGINE_UNRESOLVED=unresolved Izzet card:' /tmp/batch-ag.txt

      - name: Assert official experiment remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt

      - name: Emit Batch AG manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izzet-batch-ag
          cp /tmp/batch-ag.txt /tmp/izzet-batch-ag/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-ag-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "frozen_control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "implemented=Leafkin Druid;existing conditional mana+controlled-creature-count rails"
            echo "snapshot_run=36053709223"
            echo "snapshot_commit=1277e6daa35e28eddc03153420ec45a1bd8520f6"
            echo "unresolved_before=21"
            echo "unresolved_after=20"
            echo "unresolved_izzet_after=0"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m20/cards/LeafkinDruid.kt
            sha256sum mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/LeafkinDruidBatchAGScenarioTest.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/v09-position1-engine-batch-ag-gate.md
            sha256sum mtg-sets/src/test/resources/snapshots/cards/M20.json
            sha256sum /tmp/izzet-batch-ag/test-output.txt
          } > /tmp/izzet-batch-ag/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-ag
          path: /tmp/izzet-batch-ag
          if-no-files-found: error
          retention-days: 90

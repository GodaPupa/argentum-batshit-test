name: Manual durable alternative-cost provenance qualification
permissions:
  contents: write
concurrency:
  group: validation/manual-alternative-repair-20261003
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/manual-composition-${{ github.run_id }}
      MT_P2_AUDIT_INPUT: /tmp/manual-composition-${{ github.run_id }}/registry-requests.json
      MT_P2_AUDIT_OUTPUT: /tmp/manual-composition-${{ github.run_id }}/registry
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 3bce29c848ae5bf780ee02cc139a08fe37caa12a
        fetch-depth: 1
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v6
    - name: Bind exact repaired source without workflow ancestry
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$OUT"
        python3 - <<'PYCODE'
        import base64,hashlib,json,os,pathlib,subprocess
        def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
        parent='3bce29c848ae5bf780ee02cc139a08fe37caa12a'
        source='d79462d20b147ad34f8a3dbbeb9981676d03e3ec'
        source_tree='3bf405d936c4747035014fd1ecd2d2b4cb2ce4f1'
        branch='candidate/manual-alternative-repair-20261003'
        live='refs/heads/manual/whole-pilot-runner-replay-freeze-20260930'
        assert git('rev-parse','HEAD')==parent
        assert git('ls-remote','origin',live).split()[0]==parent,'live Manual changed'
        remote=git('ls-remote','origin','refs/heads/'+branch).split()
        assert remote and remote[0]==source,'candidate source changed'
        subprocess.run(['git','fetch','--no-tags','--depth=3','origin',branch],check=True)
        assert git('rev-parse','FETCH_HEAD')==source
        subprocess.run(['git','checkout','--detach',source],check=True)
        assert git('rev-parse','HEAD')==source
        assert git('rev-parse','HEAD^{tree}')==source_tree
        assert git('rev-parse','HEAD^')=='24ac94ecfa6bef1252e2a4ebd3456501579fffe9'
        assert git('rev-parse','HEAD^^')==parent
        assert not git('status','--porcelain')
        expected_paths=sorted([
          'docs/card-sdk-language-reference.md',
          'mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/ChoiceSlot.kt',
          'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/ConditionEvaluator.kt',
          'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/spell/CastSpellHandler.kt',
          'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/ZoneTransitionService.kt',
          'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt',
          'rules-engine/src/main/kotlin/com/wingedsheep/engine/state/components/battlefield/CastChoicesComponent.kt',
          'rules-engine/src/main/kotlin/com/wingedsheep/engine/state/components/stack/EntitySnapshot.kt',
          'rules-engine/src/test/kotlin/com/wingedsheep/engine/mechanics/casting/AlternativeCostConditionScenarioTest.kt',
          'rules-engine/src/test/kotlin/com/wingedsheep/engine/mechanics/casting/AlternativeCostProvenanceDiagnosticTest.kt',
        ])
        actual=sorted(git('diff','--name-only',parent+'..'+source).splitlines())
        assert actual==expected_paths,(actual,expected_paths)
        blobs={p:git('rev-parse','HEAD:'+p) for p in expected_paths}
        assert blobs['rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt']=='3a99bf6b2e8d2285a3273dba2d338394fc29a890'
        assert git('ls-remote','origin',live).split()[0]==parent,'live Manual changed during binding'
        binding={'source_head':source,'source_tree':source_tree,'parent_source_head':parent,'source_parent':'24ac94ecfa6bef1252e2a4ebd3456501579fffe9','validation_head':os.environ['GITHUB_SHA'],'source_git_blobs':blobs,'source_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected_paths},'scope':'REPAIRED_SHARED_ALTERNATIVE_COST_PROVENANCE_ONLY','official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
        out=pathlib.Path(os.environ['OUT'])
        (out/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
        print('SOURCE_ONLY_COMMIT='+source)
        helper='gym/src/test/kotlin/com/wingedsheep/gym/ManualTransmissionPhaseTwoRegistryAuditTest.kt'
        assert git('hash-object',helper)=='28a52995671550d87fba5f35d6b100a31fa23848'
        frozen=base64.b64decode('',validate=True)
        assert hashlib.sha256(frozen).hexdigest()=='09b8617057b9bd42fb6501f993588c9bf769e1f0af0c73426ca963da07d20084'
        (out/'registry-requests.json').write_bytes(frozen)
        (out/'baseline-resolved-bits.json').write_text(json.dumps({'manual-transmission-v07': '1111111111111111111111111111010111101111111111011111011111111111101111111111111111111111111111111111', 'blue-farm': '0001111110111011101001001111010011010101110101110100010110101011111101100100110000111101011101111111', 'rogsi': '0001111110111101110101000011110101101010000111100101101001101010011011011011001011110111110110110010', 'kinnan': '1111111110111110100011011110010100001010110100110011110000001110101011011010011101011010101010110111', 'sisay': '0110111011111110110100001100000010101010101111100111011001110100001111111100011101001111000110111111', 'magda': '0111101010101000101001110011000100100100101111011001111111000001010101101001101100001011000101001101', 'hashaton': '0101011101110000001010010001001000111101001111000110100010100000001101100110111000101011111100111011', 'shorikai': '1101111100111101010101100100101000100110011111110001011000011011011110100100100011110011110011011010'},indent=2)+'\n')
        PYCODE
    - name: Configure validation-only execution without coverage instrumentation
      shell: bash
      run: |
        cat > "$OUT/no-coverage.gradle" <<'GRADLE'
        allprojects { p ->
          p.plugins.withId('org.jetbrains.kotlinx.kover') {
            p.extensions.getByName('kover').currentProject {
              instrumentation { disabledForAll.set(true) }
            }
          }
        }
        GRADLE
    - name: Run exact composition and unchanged registry inventory
      shell: bash
      run: |
        set -uo pipefail
        set +e
        bash scripts/gradle-locked --init-script "$OUT/no-coverage.gradle" --no-daemon --no-configuration-cache --console=plain --continue --max-workers=1 -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g :rules-engine:test --tests com.wingedsheep.engine.mechanics.casting.AlternativeCostProvenanceDiagnosticTest --tests com.wingedsheep.engine.mechanics.casting.AlternativeCostConditionScenarioTest :gym:test --tests com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest 2>&1 | tee "$OUT/qualification.log"
        rc=${PIPESTATUS[0]}
        printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
        exit "$rc"
    - name: Audit actual cases and exact inventory delta
      if: always()
      shell: bash
      run: |
        python3 - <<'PYCODE'
        import pathlib,os,json,hashlib,shutil,xml.etree.ElementTree as ET
        out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
        expected={'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.mechanics.casting.AlternativeCostProvenanceDiagnosticTest.xml': 5, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.mechanics.casting.AlternativeCostConditionScenarioTest.xml': 3, 'gym/build/test-results/test/TEST-com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest.xml': 1}
        rows=[]
        for name,count in expected.items():
         p=pathlib.Path(name);cases=[]
         if p.exists():
          dest=out/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
          cases=[{'name':c.attrib['name'],'failure':c.find('failure') is not None,'error':c.find('error') is not None,'skipped':c.find('skipped') is not None} for c in ET.parse(p).getroot().findall('testcase')]
         rows.append({'path':name,'expected':count,'cases':cases})
        (out/'actual-cases.json').write_text(json.dumps(rows,indent=2)+'\n')
        # Write digests before assertions so failure evidence remains auditable.
        def digest():
         (out/'evidence-sha256.json').write_text(json.dumps({str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file() and p.name!='evidence-sha256.json'},indent=2)+'\n')
        digest()
        assert all(len(r['cases'])==r['expected'] and len({c['name'] for c in r['cases']})==r['expected'] for r in rows),rows
        assert not any(c['failure'] or c['error'] or c['skipped'] for r in rows for c in r['cases']),rows
        assert (out/'gradle-exit-code.txt').read_text().strip()=='0'
        request=json.loads((out/'registry-requests.json').read_text());report=json.loads((out/'registry/registry-report.json').read_text());baseline=json.loads((out/'baseline-resolved-bits.json').read_text())
        assert report['status']=='INVENTORY_ONLY_NOT_RULES_OR_PILOT_QUALIFICATION' and report['execution_allowed'] is False
        assert report['actual_deck_games_initialized']==report['official_outcomes']==0
        assert len(report['decks'])==len(request['decks'])==8
        admissions=['Spellskite', 'Veil of Summer', 'Phyrexian Metamorph']
        deltas=[];summary={}
        for frozen,deck in zip(request['decks'],report['decks']):
         assert deck['deck_id']==frozen['id']
         names=frozen['commanders']+frozen['mainboard'];assert deck['physical_cards']==len(deck['cards'])==len(names)==100
         assert deck['commander_count']==len(frozen['commanders'])
         for index,(name,card) in enumerate(zip(names,deck['cards'])):
          assert card['index']==index and card['requested_name']==name and card['rules_qualified'] is False
          previous=baseline[deck['deck_id']][index]=='1';expected=previous or name in admissions
          assert card['registry_resolved']==expected,(deck['deck_id'],name,expected,card)
          if card['registry_resolved']!=previous:deltas.append([deck['deck_id'],index,name,previous,card['registry_resolved']])
         missing=[c['requested_name'] for c in deck['cards'] if not c['registry_resolved']]
         summary[deck['deck_id']]={'resolved':100-len(missing),'missing':missing}
        assert summary['manual-transmission-v07']['resolved']==94+len(admissions)
        (out/'registry-summary.json').write_text(json.dumps({'decks':summary,'only_registry_delta':deltas,'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}},indent=2)+'\n');digest()
        PYCODE
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: manual-composition-${{ github.run_id }}
        path: ${{ env.OUT }}/
        if-no-files-found: error
        retention-days: 90
'on':
  push:
    branches:
    - validation/manual-alternative-repair-20261003
    paths:
    - .github/workflows/manual-alternative-repair-20261003.yml

name: Face Value Forge v1.2 Red Affinity Regression

on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-forge-v12-regression-red-affinity.yml]

permissions:
  contents: read

jobs:
  v12-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone Forge
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src rev-parse HEAD | tee forge-source-commit.txt
      - name: Build Forge
        run: |
          set -euxo pipefail
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"
      - name: Write frozen v1.2 and opponents
        run: |
          mkdir -p decks "$HOME/.forge/decks/constructed"
          cat > 'decks/Face Value v1.2 Ent.dck' <<'EOF'
          [metadata]
          Name=Face Value v1.2 Ent
          Deck Type=constructed
          [main]
          4 Llanowar Elves
          4 Nest Invader
          4 Eldrazi Repurposer
          1 Eyeless Watcher
          4 Wretched Gryff
          2 It of the Horrid Swarm
          2 Annoyed Altisaur
          1 Drownyard Lurker
          1 Nyxborn Hydra
          3 Generous Ent
          4 Malevolent Rumble
          4 Preordain
          2 Snap
          1 Lose Focus
          1 Tamiyo's Safekeeping
          2 Growth Spasm
          9 Forest
          8 Island
          3 Tangled Islet
          EOF
          cat > 'decks/Muril0Ambra Mono Red Madness 2026-09-12.dck' <<'EOF'
          [metadata]
          Name=Muril0Ambra Mono Red Madness 2026-09-12
          Deck Type=constructed
          [main]
          4 Voldaren Epicure
          4 Kessig Flamebreather
          4 Sneaky Snacker
          3 Guttersnipe
          4 Faithless Looting
          4 Grab the Prize
          4 Highway Robbery
          4 Lava Dart
          4 Lightning Bolt
          4 Fiery Temper
          3 Fireblast
          18 Mountain
          EOF
          cat > 'decks/VitorCarvalho01 Grixis Affinity 2026-09-14.dck' <<'EOF'
          [metadata]
          Name=VitorCarvalho01 Grixis Affinity 2026-09-14
          Deck Type=constructed
          [main]
          4 Drossforge Bridge
          2 Great Furnace
          4 Mistvault Bridge
          1 Mountain
          2 Seat of the Synod
          2 Silverbluff Bridge
          4 Vault of Whispers
          3 Krark-Clan Shaman
          4 Myr Enforcer
          4 Refurbished Familiar
          3 Utrom Monitor
          2 Cast Down
          4 Galvanic Blast
          4 Reckoner's Bargain
          4 Thoughtcast
          2 Toxin Analysis
          4 Black Mage's Rod
          2 Blood Fountain
          2 Ichor Wellspring
          2 Nihil Spellbomb
          1 Sewer-veillance Cam
          EOF
          cp decks/*.dck "$HOME/.forge/decks/constructed/"
          seq 1050001 1050020 > regression-seeds.txt
          sha256sum regression-seeds.txt decks/*.dck | tee regression-inputs.sha256
      - name: Run v1.2 regression block
        run: |
          set -euo pipefail
          mkdir -p regression-logs/red regression-logs/affinity
          while read -r seed; do
            "$FORGE_LAUNCHER" sim -d 'Face Value v1.2 Ent.dck' 'Muril0Ambra Mono Red Madness 2026-09-12.dck' -n 1 -s "$seed" -c 60 > "regression-logs/red/$seed.log" 2>&1
            "$FORGE_LAUNCHER" sim -d 'Face Value v1.2 Ent.dck' 'VitorCarvalho01 Grixis Affinity 2026-09-14.dck' -n 1 -s "$seed" -c 60 > "regression-logs/affinity/$seed.log" 2>&1
          done < regression-seeds.txt
      - name: Audit v1.2 regression block
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          opponents={'red':'Muril0Ambra Mono Red Madness 2026-09-12','affinity':'VitorCarvalho01 Grixis Affinity 2026-09-14'}
          out={}
          for key,opp in opponents.items():
            rec=[]
            for p in sorted((Path('regression-logs')/key).glob('*.log')):
              text=p.read_text(errors='replace')
              if re.search(r'Ai\(1\)-Face Value v1.2 Ent has won!',text): winner='face'
              elif re.search(r'Ai\(2\)-'+re.escape(opp)+r' has won!',text): winner='opp'
              elif 'ended in a Draw' in text: winner='draw'
              else: winner='unknown'
              rec.append({'seed':int(p.stem),'winner':winner,'ent_landcycles':len(re.findall(r'cycled Generous Ent',text)),'ent_casts':len(re.findall(r'cast Generous Ent',text)),'growth_spasm_casts':len(re.findall(r'cast Growth Spasm',text)),'gryff_emerge':len(re.findall(r'Wretched Gryff - Creature 3 / 4 \(Emerge\)',text)),'engine_exception':bool(re.search(r'Exception|StackOverflowError|Stopping slow match as draw',text))})
            n=len(rec); out[key]={'games':n,'wins':sum(x['winner']=='face' for x in rec),'losses':sum(x['winner']=='opp' for x in rec),'draws':sum(x['winner']=='draw' for x in rec),'unknown':sum(x['winner']=='unknown' for x in rec),'ent_landcycles':sum(x['ent_landcycles'] for x in rec),'ent_casts':sum(x['ent_casts'] for x in rec),'growth_spasm_casts':sum(x['growth_spasm_casts'] for x in rec),'gryff_emerge':sum(x['gryff_emerge'] for x in rec),'engine_exceptions':sum(x['engine_exception'] for x in rec),'records':rec}
          Path('v12-regression-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)); print(json.dumps({k:{kk:vv for kk,vv in v.items() if kk!='records'} for k,v in out.items()},indent=2,sort_keys=True))
          for k,v in out.items(): assert v['games']==20 and v['unknown']==0 and v['engine_exceptions']==0,(k,v)
          PY
      - name: Preserve v1.2 regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-forge-v12-regression-red-affinity
          path: |
            v12-regression-summary.json
            regression-seeds.txt
            regression-inputs.sha256
            regression-logs/**/*.log
            forge-source-commit.txt
            decks/*.dck
          if-no-files-found: warn

name: Manual Candidate02 hosted requalification 20261124
on:
  push:
    branches: [manual-transmission/clean-room-recovery-20261124]
    paths: ['.github/workflows/manual-host-requalification-surge-bushwhacker-20261124.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  RECORD: experiments/manual-transmission/research/surge-bushwhacker-consolidated-proposal-20261114
  RECOVERY: experiments/manual-transmission/autonomy/clean-room-recovery-20261124/lint-followup-20261124/host-requalification-20261124
  WORKFLOW: .github/workflows/manual-host-requalification-surge-bushwhacker-20261124.yml
  PYTHONDONTWRITEBYTECODE: '1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Authenticate the one hosted grant and immutable source before readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,urllib.request
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          def raw(ref,path):return subprocess.check_output(['git','show',ref+':'+path])
          def sha(b):return hashlib.sha256(b).hexdigest()
          def write(path,obj):path.write_text(json.dumps(obj,indent=2)+'\n')
          source_pin='9ae883029afe28e1969179b00343e2ebafc836e8'
          source_tree_pin='e6ec12d9a5b3c2d8ee344fe7a3ff403d2ef2256f'
          candidate_pins_blob='8fa371d1a97c910ef0e7f4b0cba08c6a75e276bf'
          assert not any(x.startswith('PENDING_') for x in (source_pin,source_tree_pin,candidate_pins_blob)), 'Unfinalized workflow'
          source_basis='82ec335573572edfd2a2e4d734d2f0d81801139f'
          branch='manual-transmission/clean-room-recovery-20261124'
          epoch='manual-host-requalification-20261124-01'
          record=os.environ['RECORD'];ns=os.environ['RECOVERY'];wf=os.environ['WORKFLOW']
          event=os.environ['GITHUB_SHA'];ref=os.environ['GITHUB_REF']
          assert os.environ['GITHUB_REPOSITORY']=='GodaPupa/argentum-batshit-test'
          assert os.environ['GITHUB_ACTIONS']=='true' and os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert os.environ['RUNNER_OS']=='Linux' and os.environ['RUNNER_ARCH']=='X64'
          assert ref=='refs/heads/'+branch and os.environ['GITHUB_EVENT_NAME']=='push'
          assert os.environ['GITHUB_RUN_NUMBER']==os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert os.environ['GITHUB_JOB']=='verify'
          assert git('rev-parse','HEAD')==event
          parents=git('show','-s','--format=%P',event).split();assert len(parents)==2
          first,validation=parents
          assert git('diff','--name-only',first,event)==wf
          c=json.loads(raw(first,ns+'/CURRENT.json'))
          assert c['branch']==branch and c['recovery_id']==epoch and c['status']=='HOSTED_ACTIVATION_RESERVED'
          assert c['owner']==c['lease']['owner']=='manual-host-requalification-foreground-20261124'
          assert c['lease']['sole_source_writer'] and c['lease']['scheduled_executor_enabled'] is False
          assert c['lease']['writable_ref']==ref
          assert c['selected_plan']=='B_HOSTED_ONCE' and c['execution_environment']=='github_hosted' and c['local_pass'] is False
          assert c['attempts']==dict(hosted_activations=1,readiness_reserved=1,readiness_started=0,readiness_completed=0,
               qualification_reserved=1,qualification_started=0,qualification_completed=0,
               original_artifact_downloads=0,original_artifact_receives=0,local_started=0)
          assert c['prior_candidate02_ci_activations']==0 and c['admitted'] is False
          charter_path=ns+'/CHARTER.json';charter_commit='bd1110a0fafcfe4039a432a9ad9e955166dbc523'
          charter_blob='2b2a03f45c8d2b490720ce2c7ccb375b5157bcd5'
          charter_sha256='5b4e30d8594b6c1e4a6d8f2ec2f4a0bdb0a6dba7e314e8deddffcad66b06f701'
          assert git('rev-parse',charter_commit+':'+charter_path)==charter_blob
          charter_bytes=raw(charter_commit,charter_path)
          assert sha(charter_bytes)==charter_sha256 and raw(first,charter_path)==charter_bytes
          charter=json.loads(charter_bytes)
          assert charter['selected_plan']=='B_HOSTED_ONCE' and charter['execution_environment']=='github_hosted'
          assert charter['local_pass'] is False and charter['replaces_local_pass_before_ci'] is True
          assert c['safeguards']==charter['safeguards']
          assert c['safeguards']['phase2_games']==c['safeguards']['phase2_seeds']==0
          historical_path='experiments/manual-transmission/autonomy/CURRENT.json'
          historical=raw('62b95ee8f854cb9a29830832c287106ad8baaac4',historical_path)
          assert raw(first,historical_path)==historical
          grant=json.loads(historical)['surge_bushwhacker_production_authorization']
          old_ns='experiments/manual-transmission/autonomy/clean-room-recovery-20261124'
          assert raw(first,old_ns+'/CURRENT.json')==raw('618f562154ff10a9da082a144d43c2011703d2e0',old_ns+'/CURRENT.json')
          lint_ns=old_ns+'/lint-followup-20261124'
          assert raw(first,lint_ns+'/CURRENT.json')==raw('a6dd2a6d84a9b046a7f77ac426c5dcbe9bb47b76',lint_ns+'/CURRENT.json')
          old_result=json.loads(raw(first,lint_ns+'/CURRENT.json'))['local_result']
          assert old_result['state']=='FAILED_OR_INCOMPLETE_LOCAL_ORIGINAL_PRESERVED'
          assert old_result['all_frozen_local_gates_pass'] is False
          q=c['source_freeze'];source=q['source']
          assert source==source_pin and q['source_basis']==source_basis
          assert git('show','-s','--format=%P',source)==source_basis
          assert git('diff','--name-only',source_basis,source).splitlines()==sorted([record+'/CANDIDATE_PINS.json',record+'/verify_dispatch.py'])
          assert q['candidate_index']=='02' and q['binding_count']==378
          assert q['validation']==validation and q['workflow_path']==wf
          assert git('show','-s','--format=%P',validation)==source
          assert git('diff','--name-only',source,validation)==wf
          assert git('rev-parse',source+'^{tree}')==q['source_tree']==source_tree_pin
          assert git('rev-parse',validation+'^{tree}')==q['validation_tree']
          assert git('rev-parse',source+':'+record+'/CANDIDATE_PINS.json')==q['candidate_pins_blob']==candidate_pins_blob
          assert git('rev-parse',source+':'+record+'/PROTOCOL.json')==grant['protocol_blob']=='a2c26c3b31834a7182bbe0b3a6ceb83922443cd4'
          workflow_bytes=Path(wf).read_bytes()
          assert workflow_bytes==raw(first,ns+'/CI_ACTIVATION.yml')==raw(validation,wf)
          assert git('rev-parse',event+':'+wf)==git('rev-parse',validation+':'+wf)==q['workflow_blob']
          assert sha(workflow_bytes)==q['workflow_sha256']
          freeze_bytes=raw(first,ns+'/SOURCE_FREEZE.json')
          assert sha(freeze_bytes)==q['source_freeze_sha256']
          freeze=json.loads(freeze_bytes)['qualification']
          assert all(q[k]==v for k,v in freeze.items())
          assert set(q)==set(freeze)|{'validation','validation_tree','workflow_path','workflow_blob','workflow_sha256',
               'source_freeze_sha256','receiver_sha256','receiver_blob','readback_sha256','readback_blob',
               'readiness_contract_sha256','readiness_helper_sha256','readiness_helper_blob'}
          for name,prefix in [('receive_hosted.py','receiver'),('immutable_hosted_readback.py','readback'),('hosted_runtime.py','readiness_helper')]:
              assert sha(raw(first,ns+'/'+name))==q[prefix+'_sha256']
              assert git('rev-parse',first+':'+ns+'/'+name)==q[prefix+'_blob']
          contract_bytes=raw(first,ns+'/READINESS_CONTRACT.json')
          assert sha(contract_bytes)==q['readiness_contract_sha256']==charter['readiness']['contract_sha256']
          assert contract_bytes==raw(charter_commit,ns+'/READINESS_CONTRACT.json')
          runtime=Path(os.environ['RUNNER_TEMP'])/'manual-host-requalification-runtime';runtime.mkdir(exist_ok=False)
          tool_dir=Path(os.environ['RUNNER_TEMP'])/'manual-host-requalification-tools';tool_dir.mkdir(exist_ok=False)
          # The positive job identity is obtained from the current authenticated run.
          run_id=int(os.environ['GITHUB_RUN_ID']);assert run_id>0
          url='https://api.github.com/repos/GodaPupa/argentum-batshit-test/actions/runs/'+str(run_id)+'/attempts/1/jobs?per_page=100&page=1'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=60) as response:jobs_bytes=response.read()
          (runtime/'GITHUB_JOB_DISCOVERY.json').write_bytes(jobs_bytes)
          jobs=json.loads(jobs_bytes);assert jobs['total_count']==1
          matching=[j for j in jobs['jobs'] if j['name']=='verify' and j['run_id']==run_id and j['head_sha']==event]
          assert len(matching)==1 and matching[0]['status']=='in_progress'
          job_id=matching[0]['id'];assert type(job_id) is int and job_id>0
          scope=dict(recovery_id=epoch,branch=branch,charter_commit=charter_commit,charter_blob=charter_blob,lane='ci',attempt=1,
                     attempt_id=epoch+'/ci-01',selected_plan='B_HOSTED_ONCE',execution_environment='github_hosted',local_pass=False)
          envelope=dict(event=event,first_parent=first,validation=validation,source=source,qualification=q,grant=grant,
                        run=str(run_id),attempt=1,job_id=job_id,local_execution=False,host_requalification=scope)
          write(runtime/'RECOVERY_EVENT.json',envelope)
          write(Path(os.environ['RUNNER_TEMP'])/'RECOVERY_EVENT.json',envelope)
          (runtime/'READINESS_CONTRACT.json').write_bytes(contract_bytes)
          (tool_dir/'hosted_runtime.py').write_bytes(raw(first,ns+'/hosted_runtime.py'))
          write(runtime/'ACTIVATION_CONTEXT.json',dict(event=event,first_parent=first,validation=validation,source=source,
                run_id=run_id,job_id=job_id,selected_plan='B_HOSTED_ONCE',execution_environment='github_hosted',local_pass=False,
                runtime=str(runtime),helper_sha256=q['readiness_helper_sha256'],charter_commit=charter_commit))
          subprocess.run(['git','checkout','--detach',validation],check=True)
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21.0.13+9'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.5'}
      - name: Run actual worker readiness, then the full qualification once on the same host
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/manual-host-requalification-tools/hosted_runtime.py" \
            --repo "$GITHUB_WORKSPACE" --runtime "$RUNNER_TEMP/manual-host-requalification-runtime"
      - name: Preserve original readiness and qualification evidence on every outcome
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import os,shutil,json,hashlib
          temporary=Path(os.environ['RUNNER_TEMP'])
          out=temporary/'manual-host-requalification-archive';out.mkdir(exist_ok=False)
          runtime=temporary/'manual-host-requalification-runtime'
          if runtime.is_dir():shutil.copytree(runtime,out,dirs_exist_ok=True)
          evidence=Path(os.environ['GITHUB_WORKSPACE'])/'manual-surge-bushwhacker-evidence'
          if evidence.is_dir():shutil.copytree(evidence,out/'qualification')
          if not (out/'HOSTED_RUN.json').exists():
              context=dict(schema='manual-transmission/hosted-run/v1',state='ACTIVATION_OR_SETUP_FAILED_ORIGINAL_RUNTIME_EVIDENCE_PRESERVED',
                   selected_plan='B_HOSTED_ONCE',execution_environment='github_hosted',local_pass=False,event=os.environ['GITHUB_SHA'],
                   run_id=int(os.environ['GITHUB_RUN_ID']),readiness_sequences_started=0,readiness_sequences_completed=0,
                   qualification_starts=0,qualification_completed=0,admitted=False,ended_utc=datetime.now(timezone.utc).isoformat())
              (out/'HOSTED_RUN.json').write_text(json.dumps(context,indent=2)+'\n')
          # The qualifier's original inner MANIFEST is copied only if it exists.
          # No inner qualification output or readiness PASS is synthesized here.
          files={p.relative_to(out).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file()}
          (out/'MANIFEST.json').write_text(json.dumps(files,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: manual-host-requalification-candidate02-20261124-${{ github.run_id }}
          path: ${{ runner.temp }}/manual-host-requalification-archive/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: Ferocity Resource06 DevelopmentAdmission byte comparison
on:
  push:
    branches: ["ferocity/resource06-byte-compare-20260929"]
    paths: [".github/workflows/ferocity-resource06-byte-compare.yml"]
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - name: Bind corrected Resource06 archive member source budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/ferocity-resource06-byte-compare
          test "$(git rev-parse HEAD^)" = "3913db5b852e299e8e0e96944e5f6ce582490121"
          test "$(git hash-object ferocity-recycling/evidence/build/publication-M1-source-audits/05-resource-boundary-06.zip)" = "a0fb48835413d80149331a7775e17820435cad7b"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/ferocity/FerocityDevelopmentAdmission.kt)" = "c64afaf0dac73fe4a73e47a58ababa60a5888064"
          test "$(git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/compare_resource06_development_admission.py)" = "cb10994db493ca22c26a178f772f55da1044a7bc"
          test "$(git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/RESOURCE06_DEVELOPMENT_ADMISSION_BYTE_COMPARE_BUDGET.json)" = "dc49d72c66922f04ec00d129639834253c282dfd"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object ferocity-recycling/evidence/build/publication-M1-source-audits/05-resource-boundary-06.zip; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/ferocity/FerocityDevelopmentAdmission.kt; git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/compare_resource06_development_admission.py; git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/RESOURCE06_DEVELOPMENT_ADMISSION_BYTE_COMPARE_BUDGET.json; git hash-object .github/workflows/ferocity-resource06-byte-compare.yml; git status --porcelain; } > build/reports/ferocity-resource06-byte-compare/source.txt
      - name: Compare exact Resource06 member and current source08 bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 ferocity-recycling/support-audits/source08-policy-selection-20260928/compare_resource06_development_admission.py | tee build/reports/ferocity-resource06-byte-compare/comparison.json
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ferocity-resource06-byte-compare-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/ferocity-resource06-byte-compare/
          if-no-files-found: error
          retention-days: 90

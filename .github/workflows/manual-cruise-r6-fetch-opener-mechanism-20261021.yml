name: Manual CRUISE R6 fetch-source opening control (NO GAMES)
on:
  push:
    branches: [research/manual-cruise-r6-fetch-opener-mechanism-20261021]
    paths:
      - '.github/workflows/manual-cruise-r6-fetch-opener-mechanism-20261021.yml'
      - 'experiments/manual-transmission/research/cruise-sport-race-20261021/CRUISE_R6_FETCH_MECHANISM_MANIFEST.json'
      - 'ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualCruiseR6FetchOpeningMechanismTest.kt'
permissions:
  contents: read
  actions: read
concurrency:
  group: manual-cruise-r6-exact-fetch-opener
  cancel-in-progress: false

jobs:
  exact-original-and-synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R4_ROOT: ${{ github.workspace }}
      MANUAL_R6_FETCH_ROOT: ${{ github.workspace }}
      MANUAL_R6_FETCH_ARCHIVES: ${{ github.workspace }}/cruise-r6-input
      MANUAL_R6_FETCH_OUTPUT: ${{ github.workspace }}/cruise-r6-evidence
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 45}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4

      - name: Lock original source, single-pair candidate scope and zero-game budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cruise-r6-input cruise-r6-evidence
          test "$GITHUB_REF" = 'refs/heads/research/manual-cruise-r6-fetch-opener-mechanism-20261021'
          git merge-base --is-ancestor dfcad1d380b7175d47b071c41998bdf9c2eed07b HEAD
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = 7984a2e87d8ddbe023d45620414d25a61691a040
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = 180918b2d7a59309e7b0617f2579fb2a6d06b7d5
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = ef5ba9dacb02bbf2a00303c9ee4724565769385a
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/EngineAiPlayerController.kt)" = 8a3c94041ca6cf781d5efe35d7a513b522b3856b
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt)" = d02fded3fd9656aa2d032c49ce8312e1d6baaf93
          git diff --name-only dfcad1d380b7175d47b071c41998bdf9c2eed07b HEAD > cruise-r6-evidence/changed-paths.txt
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/manual-cruise-r6-fetch-opener-mechanism-20261021.yml|experiments/manual-transmission/research/cruise-sport-race-20261021/CRUISE_R6_FETCH_MECHANISM_MANIFEST.json|ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualCruiseR6FetchOpeningMechanismTest.kt) ;;
              *) echo "UNAUTHORIZED_DELTA:$file"; exit 1 ;;
            esac
          done < cruise-r6-evidence/changed-paths.txt
          git rev-parse HEAD > cruise-r6-evidence/source-sha.txt
          git rev-parse HEAD^{tree} > cruise-r6-evidence/tree-sha.txt
          echo 'NO_INITIALIZER_NO_FULL_GAMES_NO_PRODUCTION_CHANGES_TWO_RESERVED' > cruise-r6-evidence/budget.txt
          chmod +x gradlew scripts/gradle-locked

      - name: Retrieve original two complete exact control/A R6 game archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('experiments/manual-transmission/research/cruise-sport-race-20261021')
          m=json.loads((d/'CRUISE_R6_FETCH_MECHANISM_MANIFEST.json').read_text())
          assert m['schema']=='ARGENTUM_CRUISE_R6_PAIRWISE_FETCH_MULLIGAN_MECHANISM_V1'
          assert [x['id'] for x in m['fixtures']]==['R6-CONTROL','R6-CHALLENGER-A','R6-FOREST-SWAP','R6-BREEDING-SWAP']
          assert m['budget']=={'used':10,'reserved':2,'new_games':0}
          assert {x['arm'] for x in m['original_reference_archives']}=={'control','a'}
          with open('cruise-r6-evidence/source-archives.tsv','w') as f:
              for x in m['original_reference_archives']:
                  f.write('\t'.join([x['arm'],str(x['artifact_id']),x['zip_sha256']])+'\n')
          PY
          while IFS=$'\t' read -r arm artifact sha; do
            file="cruise-r6-input/R6-$arm-202610202141-original.zip"
            gh api "/repos/GodaPupa/argentum-batshit-test/actions/artifacts/$artifact/zip" > "$file"
            printf '%s  %s\n' "$sha" "$file" | sha256sum -c -
          done < cruise-r6-evidence/source-archives.tsv

      - name: Exact existing hand and independently substituted land-identity controller decisions
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualCruiseR6FetchOpeningMechanismTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee cruise-r6-evidence/r6-fetch-mechanism.log
          test -s cruise-r6-evidence/R6_FETCH_MECHANISM.json

      - name: Archive original R6 JUnit
        if: always()
        shell: bash
        run: |
          mkdir -p cruise-r6-evidence/r6-junit
          cp -a ai/build/test-results/test/. cruise-r6-evidence/r6-junit/ || true

      - name: Protected original mulligan, Animar development and accepted R5 composition regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*EngineAiMomirMulliganTest' \
            --tests '*PestControlMonoRedMadnessMulliganPolicyTest' \
            --tests '*ManualAnimarDevelopmentPolicyTest' \
            --tests '*ManualR5CandidateCompositionTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee cruise-r6-evidence/protected-regressions.log

      - name: Archive independent original source evidence on GREEN or RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-cruise-r6-fetch-opener-mechanism-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            cruise-r6-evidence/
            ai/build/test-results/test/

name: Pest Tron optimization round 1 gated comparison
on:
  push:
    branches: [local/pest-tron-optimization-r1-20261018]
permissions:
  contents: read
  actions: read
jobs:
  decision-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - variant: candidate
            engine: a811254b1c158b102ccb56e4d6f547fd74648338
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a811254b1c158b102ccb56e4d6f547fd74648338
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.engine }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Restore exact baseline trace and common diagnostic
        run: |
          set -euo pipefail
          base64 --decode harness/tools/pest-tron-opt-r1/probe-trace.xz.b64 | xz --decompress > "$RUNNER_TEMP/probe.jsonl"
          echo "d1ac7c155074fe52ee606e93ceec419fc37daaa97b62ec622f3ffc47024e0cac  $RUNNER_TEMP/probe.jsonl" | sha256sum --check
          cp harness/gym/src/test/kotlin/com/wingedsheep/gym/PestTronOptimizationReplayTest.kt engine/gym/src/test/kotlin/com/wingedsheep/gym/
          chmod +x engine/gradlew engine/scripts/gradle-locked engine/scripts/test-class
      - name: Candidate AI regression including focused timing tests
        if: matrix.variant == 'candidate'
        working-directory: engine
        run: |
          set -euo pipefail
          just test-ai 2>&1 | tee "$RUNNER_TEMP/ai-regression.log"
      - name: Exact decision reconstruction and continuation
        working-directory: engine
        env:
          MTG_REPLAY_TRACE: ${{ runner.temp }}/probe.jsonl
          MTG_REPLAY_REPORT: ${{ runner.temp }}/replay.json
          MTG_REPLAY_EXPECT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          just test-class PestTronOptimizationReplayTest --no-daemon --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/replay.log"
      - name: Require preserved control decision gate without repeating it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/GodaPupa/argentum-batshit-test/actions/jobs/117807117464 > "$RUNNER_TEMP/control-gate.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          job=json.loads(Path(os.environ['RUNNER_TEMP'],'control-gate.json').read_text())
          assert job['run_id']==39172094307 and job['conclusion']=='success', job
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimization-r1-gate-${{ matrix.variant }}-${{ github.run_id }}
          retention-days: 30
          path: |
            engine/ai/build/test-results/test/
            engine/gym/build/test-results/test/
            ${{ runner.temp }}/ai-regression.log
            ${{ runner.temp }}/replay.log
            ${{ runner.temp }}/replay.json
            ${{ runner.temp }}/control-gate.json
  candidate-pair:
    needs: decision-gate
    if: github.ref == 'refs/heads/local/pest-tron-optimization-r1-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: ['2026101800', '2026101801', '2026101802', '2026101803', '2026101804', '2026101805', '2026101806', '2026101807', '2026101808', '2026101809']
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: a811254b1c158b102ccb56e4d6f547fd74648338
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Restore unchanged original gameplay runner and validator
        shell: bash
        run: |
          set -euo pipefail
          cat tools/pest-tron-batch/source-part-0*.b64 | base64 --decode > "$RUNNER_TEMP/runner.tar.xz"
          echo "ca51dd78c6343f32d9cd6d014fa11a5a1ec75c870e019e6fcbef28252d2c03f8  $RUNNER_TEMP/runner.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/runner"
          tar -xJf "$RUNNER_TEMP/runner.tar.xz" -C "$RUNNER_TEMP/runner"
          cp "$RUNNER_TEMP/runner/gym/src/test/kotlin/com/wingedsheep/gym/"PestMonsterTronBatch*.kt gym/src/test/kotlin/com/wingedsheep/gym/
          cp "$RUNNER_TEMP/runner/tools/pest-tron-batch/summarize.py" tools/pest-tron-batch/summarize.py
      - name: Execute one fresh deterministic seat-swapped pair
        shell: bash
        env:
          MTG_BATCH_RUN: '1'
          MTG_BATCH_GAMES: '2'
          MTG_BATCH_SEED: ${{ matrix.seed }}
          MTG_BATCH_OUTPUT: ${{ github.workspace }}/gym/build/nonofficial-pest-tron-optimization-r1-${{ matrix.seed }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew scripts/gradle-locked scripts/test-class
          mkdir -p "$MTG_BATCH_OUTPUT"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          seed = int(os.environ['MTG_BATCH_SEED'])
          assert 2026101800 <= seed <= 2026101809
          data = dict(evidenceGroup='OPTIMIZATION_R1_CANDIDATE', officialExperiment=False, diagnosticOnly=False,
              historicalOriginalEngineCommit='e21404f9ad0a27ea7c5499cfb98118e540575a7a',
              baselineEngineCommit='8e9c0877ea51bc0a112891066b2465d5c124ab09', baselineRun=39123402908, candidateCommit='a811254b1c158b102ccb56e4d6f547fd74648338',
              correctedRecoveryRun=39122511262, totalExpansionGames=20, totalPairs=10, pairNumber=seed-2026101800+1,
              seed=str(seed), pestSeats=[0,1], startingSeat=0, deckListsAndProfileParametersUnchanged=True,
              correction='Candidate policy holds pure lifegain through empty own combat absent visible survival pressure',
              separateFromOriginalRecoveryAndDiagnostic=True)
          Path(os.environ['MTG_BATCH_OUTPUT'],'expansion-provenance.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          just test-class PestMonsterTronBatchTest --no-daemon --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/optimization-r1-gradle.log"
      - name: Validate complete pair and produce human and machine summaries
        shell: bash
        env:
          MTG_BATCH_OUTPUT: ${{ github.workspace }}/gym/build/nonofficial-pest-tron-optimization-r1-${{ matrix.seed }}
        run: |
          set -euo pipefail
          python3 tools/pest-tron-batch/summarize.py "$MTG_BATCH_OUTPUT" 2>&1 | tee "$RUNNER_TEMP/optimization-r1-summary.log"
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'tools/pest-tron-batch')
          import summarize
          root=Path(os.environ['MTG_BATCH_OUTPUT'])
          data=summarize.summarize(root)
          assert data['completed']==2 and data['failed']==0
          assert [r['pestSeat'] for r in data['rows']]==[0,1]
          for row in data['rows']:
              trace=summarize.read_jsonl(root/row['trace'])
              events=[e for r in trace for e in r.get('emittedEvents',[]) if e['type']=='GameEndedEvent']
              assert len(events)==1
              row['terminationReason']=events[0]['reason']
          (root/'validated-summary.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Preserve full traces including failed or interrupted attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pest-tron-optimization-r1-${{ matrix.seed }}-${{ github.run_id }}
          retention-days: 30
          path: |
            gym/build/nonofficial-pest-tron-optimization-r1-*/
            gym/build/test-results/test/
            tools/pest-tron-batch/summarize.py
            ${{ runner.temp }}/optimization-r1-gradle.log
            ${{ runner.temp }}/optimization-r1-summary.log

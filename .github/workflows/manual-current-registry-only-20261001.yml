name: Manual Phase-2 current registry audit only
on:
  push:
    branches: ["validation/manual-current-registry-only-20261001"]
    paths: [".github/workflows/manual-current-registry-only-20261001.yml"]
permissions: {contents: read}
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_USER_HOME: /tmp/manual-current-registry-${{ github.run_id }}
      OUT: /tmp/manual-current-registry-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: 9e0d3ce3aa9d9f322d21e05a86efd76c9fdbe73c, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@v6
        with:
          ref: e7d37e2ea0f18dfa8d6b0fff68ef816b59555d2d
          path: .phase1-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Build exact registry request and run inventory only
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = 9e0d3ce3aa9d9f322d21e05a86efd76c9fdbe73c
          test ! -e "$OUT" && mkdir "$OUT"
          python3 experiments/manual-transmission-phase2/bootstrap_audit.py --phase1 .phase1-source --out "$OUT/source"
          MT_P2_AUDIT_INPUT="$OUT/source/registry-requests.json"           MT_P2_AUDIT_OUTPUT="$OUT/registry"             bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain :gym:test --tests com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest 2>&1 | tee "$OUT/test.log"
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest.xml "$OUT/"
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['OUT'])
          report=json.loads((out/'registry/registry-report.json').read_text())
          rows=[]
          for d in report['decks']:
              missing=[c['requested_name'] for c in d['cards'] if not c['registry_resolved']]
              rows.append({'deck_id':d['deck_id'],'missing':len(missing),'missing_names':missing})
          (out/'summary.json').write_text(json.dumps({
            'schema':'manual-current-registry-summary-v1',
            'authority':'REGISTRY_DIAGNOSTIC_ONLY_NOT_RULES_OR_PILOT_QUALIFICATION',
            'decks':rows,
            'total_missing_physical':sum(x['missing'] for x in rows),
            'official_games_initialized':0,
            'official_outcomes':0
          },sort_keys=True,indent=2)+'\n')
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-current-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: warn
          retention-days: 90

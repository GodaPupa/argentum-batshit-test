# INACTIVE LOCAL DRAFT. Publication and a qualification run need separate exact approval.
name: Receiving V2 corrected source excluded qualification proposal
on:
  push:
    branches: [play-first/receiving-v2-corrected-nongame-qualification-20261011]
permissions:
  contents: read
jobs:
  qualification:
    if: github.repository == 'GodaPupa/argentum-batshit-test' && github.event_name == 'push' && github.run_attempt == 1 && github.run_number == 1 && vars.ARGENTUM_RECEIVING_V2_QUALIFICATION_APPROVAL_JSON != ''
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ARGENTUM_QUALIFICATION_APPROVAL_JSON: ${{ vars.ARGENTUM_RECEIVING_V2_QUALIFICATION_APPROVAL_JSON }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 read-only resolution
        with:
          fetch-depth: 5
          persist-credentials: false
      - name: Verify externally approved exact source and validation identities
        id: source
        run: python3 scripts/play-first/qualification-v2/qualify.py preflight
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.5'
      - name: Eighty-four excluded Python designs in three predefined modes
        if: steps.source.outcome == 'success'
        run: python3 scripts/play-first/qualification-v2/qualify.py python
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: always() && steps.source.outcome == 'success'
        with:
          distribution: temurin
          java-version: '21'
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        if: always() && steps.source.outcome == 'success'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6 peeled to commit
        if: always() && steps.source.outcome == 'success'
        with:
          cache-disabled: true
      - name: Compile the complete gym test source without executing it
        id: compile
        if: always() && steps.source.outcome == 'success'
        run: python3 scripts/play-first/qualification-v2/qualify.py compile
      - name: Run only eight engine-free timing checks
        if: always() && steps.source.outcome == 'success' && steps.compile.outcome == 'success'
        run: python3 scripts/play-first/qualification-v2/qualify.py timing
      - name: Preserve the first original including failures and symlink fixtures
        if: always()
        run: python3 scripts/play-first/qualification-v2/qualify.py preserve
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: receiving-v2-corrected-nongame-original-${{ github.run_id }}-attempt-1
          path: |
            ${{ runner.temp }}/argentum-receiving-v2-${{ github.run_id }}-attempt-1-original.tar.gz
            ${{ runner.temp }}/argentum-receiving-v2-${{ github.run_id }}-attempt-1-original.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error
          overwrite: false

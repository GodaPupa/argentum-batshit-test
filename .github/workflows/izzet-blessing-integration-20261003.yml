name: Izzet protection lifecycle and Benevolent Blessing checkpoint
on:
  push:
    branches: [diagnostic/izzet-blessing-integration-20261003]
    paths: [.github/workflows/izzet-blessing-integration-20261003.yml]
permissions:
  contents: read
concurrency:
  group: izzet-blessing-integration-20261003
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/izzet-blessing-lifecycle-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source-only successor and workflow-only validation child
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['OUT'])
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          source='9d90006fcefed7005544da3615fd9ae95ebe1406';parent='363478df0ee17ed4c3a0ff19cf9e12e23334f9b0';workflow='.github/workflows/izzet-blessing-integration-20261003.yml'
          expected={'rules-engine/src/main/kotlin/com/wingedsheep/engine/core/CleanupPhaseManager.kt': '37dd55d578fb861cb7a4329d16bb6a120aa044fd', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/core/TurnManager.kt': 'fa4ce82045618d33c58676e41c288b511c67a66e', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/ProtectionAttachmentLifecycleTest.kt': '1ed4b5e6a2e071b06b1f6727a8588b1d743316f0', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/layers/ProtectionAttachmentLifecycle.kt': '5e6dd70b32e74ac50b521574d1cec4a676d8ebbe', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/ProtectionNoncastEntryDiagnosticTest.kt': 'd9916bb79dad10eecc69e438b63b4905cef1001c', 'mtg-sets/2017-2022/tests/build.gradle.kts': 'b781bde985764e241fcdb9a6d3b728aa1cc45f43'}
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==source
          assert git('rev-parse','HEAD^^')==parent
          assert git('rev-parse',source+'^{tree}')=='d1ba09907a8483c9438275910d48e0af7c2075e3'
          assert git('diff','--name-only',source,'HEAD').splitlines()==[workflow]
          assert git('diff','--name-only',parent,source).splitlines()==sorted(expected)
          assert not git('status','--porcelain')
          assert git('hash-object','gym/src/test/kotlin/com/wingedsheep/gym/izzet/IzzetPosition1RegistryInventoryTest.kt')=='197a99e6c17885bb70511916893d3a33de217feb'
          for p,blob in expected.items(): assert git('hash-object',p)==blob,p
          binding={'source_head':source,'source_tree':'d1ba09907a8483c9438275910d48e0af7c2075e3','parent_source_head':parent,
            'validation_head':git('rev-parse','HEAD'),'validation_tree':git('rev-parse','HEAD^{tree}'),
            'source_git_blobs':expected,'source_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected},
            'workflow_sha256':hashlib.sha256(pathlib.Path(workflow).read_bytes()).hexdigest(),
            'scope':'ISOLATED_BLESSING_LIFECYCLE_IMPLEMENTATION','registry_not_executed':True,'exact_card_admission':False,
            'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
          (out/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          PYCODE
      - name: Qualify protection lifecycle and exact Benevolent Blessing
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-configuration-cache --console=plain --continue --max-workers=1 \
            -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g \
            :rules-engine:test --tests com.wingedsheep.engine.scenarios.ProtectionAttachmentLifecycleTest --tests com.wingedsheep.engine.scenarios.ProtectionNoncastEntryDiagnosticTest --tests com.wingedsheep.engine.scenarios.ProtectionAttachmentProvenanceTest :mtg-sets:2017-2022:tests:test --tests com.wingedsheep.engine.scenarios.BenevolentBlessingScenarioTest \
            2>&1 | tee "$OUT/qualification.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
          exit "$rc"
      - name: Preserve exact mechanics and unchanged inventory evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,shutil,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
          expected={'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.ProtectionAttachmentLifecycleTest.xml': 16, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.ProtectionNoncastEntryDiagnosticTest.xml': 1, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.ProtectionAttachmentProvenanceTest.xml': 8, 'mtg-sets/2017-2022/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.BenevolentBlessingScenarioTest.xml': 10}
          suites=[];problems=[]
          for cls,count in expected.items():
            p=pathlib.Path(cls)
            if not p.exists(): problems.append('Missing '+str(p));continue
            shutil.copy2(p,out/p.name)
            root=ET.parse(p).getroot();cases=root.findall('.//testcase')
            totals={k:int(root.get(k,'0')) for k in ('tests','failures','errors','skipped')}
            suites.append({'class':cls,**totals,'actual_cases':len(cases)})
            if totals!={'tests':count,'failures':0,'errors':0,'skipped':0} or len(cases)!=count:
              problems.append(cls+': '+json.dumps(totals)+' actual='+str(len(cases)))
          (out/'summary.json').write_text(json.dumps({'suites':suites,'problems':problems,'expected_tests':sum(expected.values())},indent=2)+'\n')
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          if problems: raise SystemExit('\n'.join(problems))
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: izzet-blessing-lifecycle-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90


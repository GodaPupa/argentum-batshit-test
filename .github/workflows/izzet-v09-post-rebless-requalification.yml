name: Izzet v0.9 Post-Rebless Requalification

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-post-rebless-requalification.yml"

permissions:
  contents: read

jobs:
  requalify-current-head:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"

      - name: Requalify card-definition snapshots
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --stacktrace

      - name: Requalify current Izzet engine coverage
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/izzet-post-rebless.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=53' /tmp/izzet-post-rebless.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Boreal Druid' /tmp/izzet-post-rebless.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Llanowar Visionary' /tmp/izzet-post-rebless.txt

      - name: Assert official experiment remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt

      - name: Emit requalification manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izzet-post-rebless-artifact
          cp /tmp/izzet-post-rebless.txt /tmp/izzet-post-rebless-artifact/test-output.txt
          {
            echo "schema=izzet-v09-post-rebless-requalification-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "frozen_control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "aggregate_unresolved_current=53"
            echo "boreal_druid_resolved=true"
            echo "llanowar_visionary_resolved=true"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/src/test/resources/snapshots/cards/M21.json
            sha256sum mtg-sets/src/test/resources/snapshots/cards/CSP.json
            sha256sum /tmp/izzet-post-rebless-artifact/test-output.txt
          } > /tmp/izzet-post-rebless-artifact/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-post-rebless-requalification
          path: /tmp/izzet-post-rebless-artifact
          if-no-files-found: error
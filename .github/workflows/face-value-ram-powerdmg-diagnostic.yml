name: Face Value Ram PowerDmg Diagnostic
on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-ram-powerdmg-diagnostic.yml]
permissions: {contents: read}
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Instrument Forge PowerDmg selection
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Card-Forge/forge.git forge-src
          python3 - <<'PY'
          from pathlib import Path
          p=Path('forge-src/forge-ai/src/main/java/forge/ai/ability/FightAi.java'); s=p.read_text()
          needle='''                    } else if (canKill(aiCreature, humanCreature, power)) {
                        sa.getTargets().add(aiCreature);'''
          repl='''                    } else if (canKill(aiCreature, humanCreature, power)) {
                        if ("Ram Through".equals(sourceName)) {
                            System.out.println("FV_RAM_CHOICE source=" + aiCreature.getName()
                                    + " sourceCMC=" + aiCreature.getCMC()
                                    + " sourcePower=" + aiCreature.getNetPower()
                                    + " target=" + humanCreature.getName()
                                    + " targetCMC=" + humanCreature.getCMC()
                                    + " targetEval=" + ComputerUtilCard.evaluateCreature(humanCreature));
                        }
                        sa.getTargets().add(aiCreature);'''
          assert s.count(needle)==1,s.count(needle); p.write_text(s.replace(needle,repl,1))
          PY
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res && cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"
      - name: Run preserved Ram A deck on focused fresh diagnostics
        run: |
          mkdir -p decks logs "$HOME/.forge/decks/constructed"
          cp experiments/face-value/decks/fv-v13-ram-a.dck decks/ram.dck
          cp experiments/face-value/decks/gruul-ramp.dck decks/gruul.dck
          cp decks/*.dck "$HOME/.forge/decks/constructed/"
          seq 1270001 1270010 > seeds.txt
          while read s; do "$FORGE_LAUNCHER" sim -d ram.dck gruul.dck -n 1 -s "$s" -c 120 > "logs/$s.log" 2>&1; done < seeds.txt
      - name: Audit choices
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=[]
          for p in sorted(Path('logs').glob('*.log')):
            t=p.read_text(errors='replace'); lines=[x for x in t.splitlines() if 'FV_RAM_CHOICE' in x]
            r.append({'seed':int(p.stem),'choices':lines,'ram_casts':t.count('cast Ram Through')})
          o={'games':len(r),'ram_casts':sum(x['ram_casts'] for x in r),'choice_events':sum(len(x['choices']) for x in r),'records':r}
          Path('ram-powerdmg-diagnostic.json').write_text(json.dumps(o,indent=2)); print(json.dumps(o,indent=2))
          assert len(r)==10
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: face-value-ram-powerdmg-diagnostic
          path: |
            ram-powerdmg-diagnostic.json
            logs/*.log
            seeds.txt

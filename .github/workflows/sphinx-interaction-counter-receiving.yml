name: Sphinx Spell Pierce Dispel receiving
on:
  push:
    branches: ["sphinx/whole-actor-surface-inventory-20260928"]
    paths: [".github/workflows/sphinx-interaction-counter-receiving.yml"]
permissions: {contents: read}
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact source fixture budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/sphinx-interaction-counter-receiving
          test "$(git rev-parse HEAD^)" = "7ccf7dfbfbf5b41124e98d6e03efe174cee10ee3"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEPilotComponent.kt)" = "bdedb10bcfa4f78ef2fbb29853fce96755d45c27"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEWholeActor.kt)" = "63a5a294b7fcea8b6f8d9218f1ddfb64140c2894"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEActorAdapter.kt)" = "8260f3bd7a3fd0ee403803122cd2bd1bd183a854"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEInteractionCounterReceivingTest.kt)" = "2de9ffad090c1899a998a92b327b04191d33fcd3"
          test "$(git hash-object sphinx-approach/STAGE_E_INTERACTION_COUNTER_RECEIVING_BUDGET_20260928.json)" = "e829dce98a881384a0c0e350221526054f3de779"
          test "$(git hash-object mtg-sets/2025/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/dft/cards/SpellPierce.kt)" = "74698a4278e8eb84d70e5034c8faa733903f6108"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/wwk/cards/Dispel.kt)" = "1a4f8badfc9acafa537805b0435637bab53d9b6b"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEPilotComponent.kt
            git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEWholeActor.kt
            git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEActorAdapter.kt
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEInteractionCounterReceivingTest.kt
            git hash-object sphinx-approach/STAGE_E_INTERACTION_COUNTER_RECEIVING_BUDGET_20260928.json
            git hash-object mtg-sets/2025/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/dft/cards/SpellPierce.kt
            git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/wwk/cards/Dispel.kt
            git hash-object .github/workflows/sphinx-interaction-counter-receiving.yml
            git status --porcelain
          } > build/reports/sphinx-interaction-counter-receiving/source.txt
      - name: Run fresh targeted real-engine receiving bank
        shell: bash
        run: |
          set -o pipefail
          just test-class SphinxStageEInteractionCounterReceivingTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/sphinx-interaction-counter-receiving/test.log
      - name: Preserve XML
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find . -path '*/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageEInteractionCounterReceivingTest.xml' -type f -print -exec cp {} build/reports/sphinx-interaction-counter-receiving/ \; || true
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-interaction-counter-receiving-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-interaction-counter-receiving/
          if-no-files-found: error
          retention-days: 90

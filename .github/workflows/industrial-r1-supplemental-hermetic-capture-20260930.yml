name: Industrial R1 supplemental hermetic capture from accepted store
on:
  push:
    branches: ["industrial/r1-supplemental-hermetic-vm-hidden-successor-execute-20260930"]
    paths:
      - "industrial-waste/v2/R1_SUPPLEMENTAL_HERMETIC_VM_HIDDEN_SUCCESSOR_EXECUTION_MARKER_20260930.json"
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: catthehacker/ubuntu@sha256:7d51b26b65f00d97063cbda95699ee2aee2d4a7362f545ac29a4a18aaba7cfb3
      options: --platform linux/amd64
    env:
      ARGENTUM_DECLARED_IMAGE: catthehacker/ubuntu@sha256:7d51b26b65f00d97063cbda95699ee2aee2d4a7362f545ac29a4a18aaba7cfb3
      JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}

      - name: Bind exact independently reviewed store-backed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(uname -m)" = "x86_64"
          REVIEW=industrial-waste/v2/evidence/R1_SUPPLEMENTAL_HERMETIC_VM_HIDDEN_SUCCESSOR_IMPLEMENTATION_INDEPENDENT_REVIEW_20260930.json
          MARKER=industrial-waste/v2/R1_SUPPLEMENTAL_HERMETIC_VM_HIDDEN_SUCCESSOR_EXECUTION_MARKER_20260930.json
          /usr/bin/python3.10 - "$REVIEW" "$MARKER" <<'PY'
          import json,pathlib,subprocess,sys
          review=json.loads(pathlib.Path(sys.argv[1]).read_text())
          marker=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert review["decision"]=="ACCEPT_VM_HIDDEN_SUCCESSOR_IMPLEMENTATION_FOR_ONE_FRESH_SUPPLEMENTAL_CAPTURE_ORIGINAL"
          assert subprocess.check_output(["git","rev-parse","HEAD^^"],text=True).strip()==review["reviewed_implementation_commit"]
          assert marker["implementation_review_blob"]==subprocess.check_output(["git","hash-object",sys.argv[1]],text=True).strip()
          changed=subprocess.check_output(["git","diff","--name-only","HEAD^","HEAD"],text=True).splitlines()
          assert changed==[sys.argv[2]],changed
          for field,path in {
            "budget_blob":"industrial-waste/v2/R1_SUPPLEMENTAL_HERMETIC_VM_HIDDEN_SUCCESSOR_BUDGET_20260930.json",
            "capture_source_blob":"industrial-waste/v2/capture_supplemental_hermetic_r1.py",
            "gradle_probe_blob":"industrial-waste/v2/r1-supplemental-hermetic-capture.init.gradle",
            "store_bootstrap_blob":"industrial-waste/v2/r1-dependency-store-bootstrap.init.gradle",
            "workflow_blob":".github/workflows/industrial-r1-supplemental-hermetic-capture-20260930.yml",
          }.items():
              actual=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert actual==review[field],(field,actual,review[field])
          assert subprocess.call(["git","merge-base","--is-ancestor","de27e189e7597bdf48f213a40a0bbf1b70f63c1a","HEAD"])==0
          assert subprocess.check_output(["git","rev-parse","de27e189e7597bdf48f213a40a0bbf1b70f63c1a^{tree}"],text=True).strip()=="d62e3fbd59dd78cc444c09b26673ae1bf3a848ab"
          assert marker["official_counters_delta"]==0
          PY

      - name: Materialize exact accepted dependency store as read-only input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STORE_INPUT="$RUNNER_TEMP/industrial-r1-accepted-store-input"
          test ! -e "$STORE_INPUT"
          mkdir -p "$STORE_INPUT"
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11105215706/zip" \
            -o "$STORE_INPUT/original.zip"
          echo "3c8d31f1560cb6e52f862fcaed5de757d67ac4433bd84a1e729d44e2384da649  $STORE_INPUT/original.zip" | sha256sum -c -
          unzip -t "$STORE_INPUT/original.zip" >/dev/null
          unzip -p "$STORE_INPUT/original.zip" build/reports/industrial-r1-current-runtime-store-supplement-v5/immutable-current-runtime-gradle-store.tar.gz > "$STORE_INPUT/immutable-gradle-input-store.tar.gz"
          unzip -p "$STORE_INPUT/original.zip" build/reports/industrial-r1-current-runtime-store-supplement-v5/store-manifest.json > "$STORE_INPUT/store-manifest.json"
          echo "a282721ebdc4117ec20eaed1d711a5f20568c13ded082f00676843b894773be3  $STORE_INPUT/immutable-gradle-input-store.tar.gz" | sha256sum -c -
          echo "b5e458d3039e70cecbaf90337c4dbf1b81feb44aea86d54fe0cd8477a50430c4  $STORE_INPUT/store-manifest.json" | sha256sum -c -
          chmod 0444 "$STORE_INPUT/immutable-gradle-input-store.tar.gz" "$STORE_INPUT/store-manifest.json"
          /usr/bin/python3.10 - "$STORE_INPUT/store-manifest.json" <<'PY'
          import json,pathlib,sys
          m=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert len(m["files"])==1339
          assert len({x["path"] for x in m["files"]})==1339
          assert all(x["path"].startswith(("wrapper/dists/","caches/modules-2/")) for x in m["files"])
          PY
          printf '%s\n' "$STORE_INPUT/immutable-gradle-input-store.tar.gz" > "$RUNNER_TEMP/industrial-store-archive.path"
          printf '%s\n' "$STORE_INPUT/store-manifest.json" > "$RUNNER_TEMP/industrial-store-manifest.path"

      - name: Execute single store-backed supplemental capture original
        shell: bash
        run: |
          set -euo pipefail
          STORE_ARCHIVE="$(cat "$RUNNER_TEMP/industrial-store-archive.path")"
          STORE_MANIFEST="$(cat "$RUNNER_TEMP/industrial-store-manifest.path")"
          ARGENTUM_DEPENDENCY_STORE_ARCHIVE="$STORE_ARCHIVE" \
          ARGENTUM_DEPENDENCY_STORE_MANIFEST="$STORE_MANIFEST" \
            /usr/bin/python3.10 industrial-waste/v2/capture_supplemental_hermetic_r1.py \
            | tee build-industrial-r1-supplemental-hermetic.log
          /usr/bin/python3.10 - <<'PY'
          import json,pathlib
          p=pathlib.Path("build/reports/industrial-r1-supplemental-hermetic/summary.json")
          r=json.loads(p.read_text())
          assert r["authority"]=="SUPPLEMENTAL_HERMETIC_CAPTURE_ORIGINAL_FOR_INDEPENDENT_REVIEW_ONLY"
          assert r["class_census"]["equal"] is True
          assert r["class_census"]["policy"]=="PINNED_GENERATOR_INPUTS_VM_LOOKUP_DEFINE_MULTIPLICITY_EQUIVALENCE"
          assert r["class_census"]["repeat_equivalence"]["non_vm_multiplicity_equal"] is True
          assert r["class_census"]["repeat_equivalence"]["vm_lookup_define_family_set_equal"] is True
          assert r["fixed_worker"]=={"class":"com.wingedsheep.ai.engine.IndustrialWasteV2FrozenResponderEquivalenceTest","tests":10,"failures":0,"errors":0,"skipped":0}
          assert r["immutable_store"]["source_artifact_id"]==11105215706
          assert r["immutable_store"]["archive_sha256"]=="a282721ebdc4117ec20eaed1d711a5f20568c13ded082f00676843b894773be3"
          assert r["immutable_store"]["manifest_sha256"]=="b5e458d3039e70cecbaf90337c4dbf1b81feb44aea86d54fe0cd8477a50430c4"
          assert r["immutable_store"]["files"]==1339
          assert "--offline" in r["first_launch"]["argv"] and "--offline" in r["offline_repeat"]["argv"]
          assert r["official_seed_files_read"] is False
          assert r["official_counters"]=={"claims":0,"allocations":0,"games":0,"outcomes":0}
          PY

      - name: Preserve complete store-backed supplemental original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-r1-supplemental-hermetic-vm-hidden-successor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/industrial-r1-supplemental-hermetic/
            build-industrial-r1-supplemental-hermetic.log
            industrial-waste/v2/R1_SUPPLEMENTAL_HERMETIC_VM_HIDDEN_SUCCESSOR_BUDGET_20260930.json
            industrial-waste/v2/evidence/R1_SUPPLEMENTAL_HERMETIC_VM_HIDDEN_SUCCESSOR_IMPLEMENTATION_INDEPENDENT_REVIEW_20260930.json
            industrial-waste/v2/R1_SUPPLEMENTAL_HERMETIC_VM_HIDDEN_SUCCESSOR_EXECUTION_MARKER_20260930.json
          if-no-files-found: error
          retention-days: 90

name: Pest Tower Ent raw physical bottom parity targeted
on:
  push:
    branches: ["pest/london-raw-keep-parity-20260928"]
    paths:
      - ".github/workflows/pest-london-typecycle-bottom-targeted.yml"
permissions:
  contents: read
jobs:
  eight-declared-openings:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind frozen raw controller, lawful bottom candidate and exact test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-typecycle-bottom-targeted
          test "$(git rev-parse HEAD^)" = "ba1459b87267bc542444eb167522874afdb42ed6"
          test "$(git hash-object ai/src/main/kotlin/com/wingedsheep/ai/engine/EngineAiPlayerController.kt)" = "4f020ea2406e9bd6a87ec389685b48f15df4c5a3"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonBottomPolicy.kt)" = "d88e28bd46425a4c74d2a54348aa1c16f6f8ad6c"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonRawTypecycleBottomParityTest.kt)" = "2385bd2f225307ccd78fa08e084d6c9cd61b8610"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object ai/src/main/kotlin/com/wingedsheep/ai/engine/EngineAiPlayerController.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonBottomPolicy.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonRawTypecycleBottomParityTest.kt; git hash-object .github/workflows/pest-london-typecycle-bottom-targeted.yml; git status --porcelain; } > build/reports/pest-typecycle-bottom-targeted/source.txt
      - name: Execute exact eight physical bottom comparisons
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:test --tests 'com.wingedsheep.gym.matchup.PestMonsterLondonRawTypecycleBottomParityTest' --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-typecycle-bottom-targeted/test.log
      - name: Retain original XML
        if: always()
        shell: bash
        run: |
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.matchup.PestMonsterLondonRawTypecycleBottomParityTest.xml build/reports/pest-typecycle-bottom-targeted/ 2>/dev/null || true
      - name: Upload original targeted evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-typecycle-bottom-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-typecycle-bottom-targeted/
          if-no-files-found: error
          retention-days: 90

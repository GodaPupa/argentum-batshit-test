name: Pest Control Tier-1 Grixis Replication Artifact VALIDATE_ONLY

on:
  pull_request:
    paths:
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneGrixisReplicationOfficialArtifactValidationTest.kt
      - .github/workflows/pest-control-tier-one-grixis-replication-artifact-validate.yml
      - docs/experiments/pest-control/tier-one-grixis-replication-artifact-validation.md

permissions:
  actions: read
  contents: read

jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Download exact frozen replication artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/pest-grixis-replication-input
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10660335894/zip"             -o build/pest-grixis-replication-freeze.zip
          echo "49597c4a3011464e1d4bb707dfa1b554090054059e0675254524c92fcce8d6fd  build/pest-grixis-replication-freeze.zip" | sha256sum -c -
          unzip -q build/pest-grixis-replication-freeze.zip -d build/pest-grixis-replication-input
          cd build/pest-grixis-replication-input
          sha256sum -c artifacts.sha256

      - name: Validate exact artifact without gameplay
        env:
          PEST_GRIXIS_REPLICATION_MODE: VALIDATE_ONLY
          PEST_GRIXIS_REPLICATION_INPUT_DIR: ${{ github.workspace }}/build/pest-grixis-replication-input
        run: scripts/test-class PestControlTierOneGrixisReplicationOfficialArtifactValidationTest --info --stacktrace

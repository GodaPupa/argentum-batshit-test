name: Ferocity Recycling deterministic qualification

on:
  pull_request:
    branches: [ferocity-recycling/archetype-research]
    paths:
      - ferocity-recycling/**
      - .github/workflows/ferocity-recycling-validation.yml
      - mtg-sdk/**
      - rules-engine/**
      - ai/**
      - gym/**
      - game-server/**
      - mtg-search/**
      - oracle-assay/**
      - mtg-sets/**
      - buildSrc/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradlew
      - gradlew.bat
      - justfile
      - scripts/test-class
      - scripts/gradle-locked

permissions:
  contents: read

concurrency:
  group: ferocity-recycling-validation-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: rules-engine
            module: rules-engine
            expected_cases: 234
            classes: "PostBlockDeclarationPriorityScenarioTest DeclareBlockersPriorityWindowTest MultiDefenderCombatTest TwoHeadedGiantCombatTest ActivationPriorityScenarioTest BandingTrampleDrainScenarioTest BatchMayQuestionTest CombatAssignmentCurrentRulesTest CombatDamageAssignmentTest CombatResolutionBoardTest DamageSourceIdentityScenarioTest DamageSourceTriggerScenarioTest FerocityOfTheHuntScenarioTest FerocityPrereleaseDefinitionIdentityTest ManaAbilityColorChoicePipelineTest MoveToZoneEffectExecutorTest NestedManaPaymentBoundaryScenarioTest PaidFlashbackStackExitScenarioTest PlayerTargetRevalidationScenarioTest PredicateEvaluatorRecordTest SelfEntersTappedOffStackEntryScenarioTest TargetedDepartedSourceLkiTest TriggerOrderingConcessionScenarioTest TriggerOrderingScenarioTest GiftSpellResolutionTest GiftPromisedAtCastTimeTest"
          - suite: game-server
            module: game-server
            expected_cases: 12
            classes: "PostBlockDeclarationSessionTest TwoHeadedGiantSessionTest"
          - suite: gym
            module: gym
            expected_cases: 182
            classes: "ArtifactControlPolicyTest FerocityBloodActivationTest FerocityCardDefinitionBundleTest FerocityDevelopmentAdmissionTest FerocityDiagnosticsTest FerocityInlineTokenProvenanceTest FerocityObservationBoundaryTest FerocityStackSourceObservationTest FerocityTrialJournalTest FerocityTriggerOrderObservationTest FerocityWickedRoleSourceTest RedMadnessPilotScenarioTest FerocityResourceBoundaryTest FerocityPriorityObservationTest"
          - suite: mtg-sets-2000-2002-tests
            module: mtg-sets/2000-2002/tests
            expected_cases: 4
            classes: "FieryTemperScenarioTest LavaDartScenarioTest"
          - suite: mtg-sets-2003-2007-tests
            module: mtg-sets/2003-2007/tests
            expected_cases: 5
            classes: "KrarkClanShamanScenarioTest ThoughtcastScenarioTest"
          - suite: mtg-sets-2008-2016-tests
            module: mtg-sets/2008-2016/tests
            expected_cases: 6
            classes: "GalvanicBlastScenarioTest IchorWellspringScenarioTest NihilSpellbombScenarioTest"
          - suite: mtg-sets-2017-2022-tests
            module: mtg-sets/2017-2022/tests
            expected_cases: 11
            classes: "BloodFountainScenarioTest CastDownScenarioTest KessigFlamebreatherScenarioTest MakeshiftMunitionsScenarioTest ReckonersBargainScenarioTest"
          - suite: mtg-sets-2023-tests
            module: mtg-sets/2023/tests
            expected_cases: 3
            classes: "NotDeadAfterAllScenarioTest"
          - suite: mtg-sets-2024-tests
            module: mtg-sets/2024/tests
            expected_cases: 48
            classes: "GiftChosenOpponentTest GrabThePrizeScenarioTest HighwayRobberyScenarioTest RefurbishedFamiliarScenarioTest SazacapsBrewScenarioTest SneakySnackerScenarioTest ToxinAnalysisScenarioTest"
          - suite: mtg-sets-2025-tests
            module: mtg-sets/2025/tests
            expected_cases: 3
            classes: "MaraudingMakoScenarioTest"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Preserve setup provenance before provisioning
        run: |
          python - <<'PY'
          import datetime, json, os, pathlib, subprocess
          out = pathlib.Path('build/reports/ferocity-recycling')
          out.mkdir(parents=True)
          record = {
              'schema': 'ferocity-recycling-ci-setup-v1',
              'source_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'runner_image_os': os.environ.get('ImageOS'),
              'runner_image_version': os.environ.get('ImageVersion'),
              'runner_arch': os.environ.get('RUNNER_ARCH'),
              'started_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'scope': 'DETERMINISTIC_QUALIFICATION_ONLY',
              'suite': '${{ matrix.suite }}',
              'interactive_development_games': 0, 'evaluation_games': 0, 'confirmation_games': 0,
          }
          (out / 'setup-provenance.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Install exact verified Temurin JDK archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ferocity-tools"
          curl --fail --location --max-time 180 \
            --output "$RUNNER_TEMP/ferocity-tools/temurin-jdk.tar.gz" \
            https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz
          echo 'ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94  '"$RUNNER_TEMP/ferocity-tools/temurin-jdk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/ferocity-tools/temurin-jdk.tar.gz" -C "$RUNNER_TEMP/ferocity-tools"
          echo "JAVA_HOME=$RUNNER_TEMP/ferocity-tools/jdk-21.0.12.1+1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ferocity-tools/jdk-21.0.12.1+1/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ferocity-tools/jdk-21.0.12.1+1/bin/java" -version
          python - <<'PY'
          import json, pathlib
          pathlib.Path('build/reports/ferocity-recycling/jdk-provenance.json').write_text(json.dumps({
              'distribution': 'Eclipse Temurin', 'version': '21.0.12.1+1',
              'archive_url': 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz',
              'verified_archive_sha256': 'ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94',
              'installation_status': 'VERIFIED_AND_EXECUTED',
          }, indent=2) + '\n')
          PY
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate project arithmetic and frozen inputs without generating evidence
        run: |
          set -euo pipefail
          python -m unittest discover -s ferocity-recycling/tests -v
          python ferocity-recycling/tools/project.py validate
          if [ -f ferocity-recycling/protocols/initial-search-manifest.json ]; then
            python ferocity-recycling/tools/project.py verify
          fi
      - name: Bind the exact selected class sources and reviewed guard
        env:
          SELECTED_CLASSES: ${{ matrix.classes }}
          SELECTED_MODULE: ${{ matrix.module }}
          EXPECTED_CASES: ${{ matrix.expected_cases }}
        run: |
          python - <<'PYCI'
          import hashlib, json, os, pathlib
          root = pathlib.Path('.')
          plan = json.loads((root / 'ferocity-recycling/ci/common-fixed-selection-v1.json').read_text())
          rows = plan['classes']
          assert len(rows) == len({r['class'] for r in rows}) == plan['class_count'] == 63
          assert sum(r['expected_count'] for r in rows) == plan['expected_cases'] == 508
          selected = [r for r in rows if r['module'] == os.environ['SELECTED_MODULE']]
          assert [r['class'] for r in selected] == os.environ['SELECTED_CLASSES'].split()
          assert sum(r['expected_count'] for r in selected) == int(os.environ['EXPECTED_CASES'])
          for row in selected:
              assert hashlib.sha256((root / row['path']).read_bytes()).hexdigest() == row['sha256'], row['path']
          runner = root / 'ferocity-recycling/tools/validate_build.py'
          assert hashlib.sha256(runner.read_bytes()).hexdigest() == '07b1e71a0f8b1fdafe5c4419ca2baf5920e6194605220fe278ad9eb96be39a2c'
          (root / 'build/reports/ferocity-recycling/selection.json').write_text(json.dumps(selected, indent=2) + '\n')
          PYCI
      - name: Install exact verified just release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ferocity-tools"
          curl --fail --location --max-time 120 \
            --output "$RUNNER_TEMP/ferocity-tools/just.tar.gz" \
            https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz
          echo '4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  '"$RUNNER_TEMP/ferocity-tools/just.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/ferocity-tools/just.tar.gz" -C "$RUNNER_TEMP/ferocity-tools" just
          echo "$RUNNER_TEMP/ferocity-tools" >> "$GITHUB_PATH"
      - name: Qualify real engine with exact source and retained failures
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python ferocity-recycling/tools/validate_build.py \
            --expected-head "$EXPECTED_HEAD" \
            --batch \
            --classes ${{ matrix.classes }} \
            --out build/reports/ferocity-recycling/qualification
      - name: Retain observed runtime dependency identities after the attempted gate
        if: always()
        run: |
          if [ -f build/reports/ferocity-recycling/qualification/receipt.json ]; then
            python ferocity-recycling/tools/record_runtime_classpath.py \
              --root "$GITHUB_WORKSPACE" \
              --attempt build/reports/ferocity-recycling/qualification \
              --gradle-home "${GRADLE_USER_HOME:-$HOME/.gradle}"
          fi
      - name: Reconcile exact fresh case counts with the selected module
        if: always()
        run: |
          python - <<'PYCI'
          import json, pathlib
          base = pathlib.Path('build/reports/ferocity-recycling')
          receipt_path = base / 'qualification/receipt.json'
          if not receipt_path.exists():
              raise SystemExit(0)  # Earlier setup failure remains visible in its own step.
          receipt = json.loads(receipt_path.read_text())
          selected = json.loads((base / 'selection.json').read_text())
          expected = {r['class']: r['expected_count'] for r in selected}
          actual = {}
          for stage in receipt.get('stages', []):
              for name, counts in stage.get('class_fresh_test_task_totals', {}).items():
                  assert name not in actual, 'duplicate class result'
                  actual[name] = counts
          counts_match = set(actual) == set(expected) and all(actual[n]['tests'] == c for n, c in expected.items())
          result = {'expected': expected, 'actual_fresh': actual, 'counts_match': counts_match,
                    'original_receipt_status': receipt['status'], 'research_games': 0}
          (base / 'selection-result.json').write_text(json.dumps(result, indent=2) + '\n')
          assert receipt['status'] == 'PASS' and receipt['compiled_inputs_unchanged'] and counts_match
          PYCI
      - name: Preserve the already observed gym runtime for bounded calibration and export
        if: success() && matrix.suite == 'gym'
        run: |
          python ferocity-recycling/tools/archive_observed_gym_runtime.py \
            --root "$GITHUB_WORKSPACE" \
            --attempt build/reports/ferocity-recycling/qualification \
            --gradle-home "${GRADLE_USER_HOME:-$HOME/.gradle}"
      - name: Preserve qualification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ferocity-recycling-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/ferocity-recycling/
          if-no-files-found: error
          retention-days: 90

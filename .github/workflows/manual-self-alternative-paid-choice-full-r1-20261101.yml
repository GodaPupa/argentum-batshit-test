name: Manual paid-choice full compatibility R1
on:
  push:
    branches: [validation/manual-self-alternative-paid-choice-full-r1-20261101]
    paths: ['.github/workflows/manual-self-alternative-paid-choice-full-r1-20261101.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 54d58d643fce107aa635b3385675e9d4b9311f52
  SOURCE_TREE: 00a9a4a54549685905f5514ecd02582d9eb51b4a
  WORKFLOW: .github/workflows/manual-self-alternative-paid-choice-full-r1-20261101.yml
  RECORD: experiments/manual-transmission/research/self-alternative-paid-choice-full-r1-20261101
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web-client/package-lock.json}
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Fresh compile and same-source full compatibility
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-self-alternative-paid-choice-full-r1-${{ github.run_id }}
          path: manual-self-alternative-paid-choice-full-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

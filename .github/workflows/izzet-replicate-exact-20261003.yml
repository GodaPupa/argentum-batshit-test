name: Izzet replicate and Lose Focus qualification
on:
  push:
    branches: [diagnostic/izzet-replicate-exact-20261003]
    paths: [.github/workflows/izzet-replicate-exact-20261003.yml]
permissions:
  contents: read
concurrency:
  group: izzet-replicate-exact-20261003
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/izzet-replicate-exact-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source-only successor and workflow-only validation child
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['OUT'])
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          source='02c08101f9b585591814d298ba3d486ae1acce21';parent='601e243f617783974b0f36e75363990b94750ee9';workflow='.github/workflows/izzet-replicate-exact-20261003.yml'
          expected={'docs/card-sdk-language-reference.md': '45cc162a9852ad1ef0753f010064f064b5306aa7', 'mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/ChoiceSlot.kt': '08eedd051727865d4c611efc8be9e01bd9f33e0b', 'mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/KeywordAbility.kt': '121d0dd43f50d149aa858192167256b2547b59f3', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/spell/CastSpellHandler.kt': '17726fbb7f34bbbda36d28813fca82f28e325508', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/RepeatedSpellCopyTest.kt': '1fbf3350da6a29775eccd8d3be0b5f9caefe775c', 'mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/mh2/cards/LoseFocus.kt': '71927a7e10d73c2b336649da33b7ef0c8187f6bc', 'mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/LoseFocusScenarioTest.kt': '7dbacb38b858fb3ddcbe53f35902705c39ec70cc'}
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==source
          assert git('rev-parse','HEAD^^')==parent
          assert git('rev-parse',source+'^{tree}')=='1a2f6beafd41a9001321e594d26ce4a8223b303c'
          assert git('diff','--name-only',source,'HEAD').splitlines()==[workflow]
          assert git('diff','--name-only',parent,source).splitlines()==sorted(expected)
          assert not git('status','--porcelain')
          for p,blob in expected.items(): assert git('hash-object',p)==blob,p
          binding={'source_head':source,'source_tree':'1a2f6beafd41a9001321e594d26ce4a8223b303c','parent_source_head':parent,
            'validation_head':git('rev-parse','HEAD'),'validation_tree':git('rev-parse','HEAD^{tree}'),
            'source_git_blobs':expected,'source_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected},
            'workflow_sha256':hashlib.sha256(pathlib.Path(workflow).read_bytes()).hexdigest(),
            'scope':'REPLICATE_AND_LOSE_FOCUS_EXACT_QUALIFICATION','registry_not_executed':True,'exact_card_admission':False,
            'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
          (out/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          PYCODE
      - name: Compile repeated-cost primitive, replicate, and exact Lose Focus scenarios
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-configuration-cache --console=plain --continue --max-workers=1 \
            -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g \
            :rules-engine:test --tests com.wingedsheep.engine.scenarios.RepeatedOptionalCostTest --tests com.wingedsheep.engine.scenarios.RepeatedSpellCopyTest :mtg-sets:2017-2022:tests:test --tests com.wingedsheep.engine.scenarios.LoseFocusScenarioTest \
            2>&1 | tee "$OUT/qualification.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
          exit "$rc"
      - name: Preserve primary metadata if available
        if: always()
        shell: bash
        run: |
          curl --fail --location --max-time 30 --retry 1 -H 'User-Agent: ArgentumQualification/1.0' https://api.scryfall.com/cards/mh2/49 -o "$OUT/lose-focus-scryfall.json" || true
      - name: Preserve all actual prerequisite cases and failures; no registry or admission
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,shutil,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
          expected={'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.RepeatedOptionalCostTest.xml': 12, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.RepeatedSpellCopyTest.xml': 4, 'mtg-sets/2017-2022/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.LoseFocusScenarioTest.xml': 7}
          suites=[];problems=[]
          for cls,count in expected.items():
            p=pathlib.Path(cls)
            if not p.exists(): problems.append('Missing '+str(p));continue
            shutil.copy2(p,out/p.name)
            root=ET.parse(p).getroot();cases=root.findall('.//testcase')
            totals={k:int(root.get(k,'0')) for k in ('tests','failures','errors','skipped')}
            suites.append({'class':cls,**totals,'actual_cases':len(cases)})
            if totals!={'tests':count,'failures':0,'errors':0,'skipped':0} or len(cases)!=count:
              problems.append(cls+': '+json.dumps(totals)+' actual='+str(len(cases)))
          (out/'summary.json').write_text(json.dumps({'suites':suites,'problems':problems,'expected_tests':sum(expected.values())},indent=2)+'\n')
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          if problems: raise SystemExit('\n'.join(problems))
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: izzet-replicate-exact-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90


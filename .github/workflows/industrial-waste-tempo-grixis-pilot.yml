name: Industrial Waste — Tempo A Grixis Pilot
on:
  push:
    branches: [industrial-waste/lab]
    paths:
      - .github/workflows/industrial-waste-tempo-grixis-pilot.yml
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteTempoGrixisPilotBenchmark.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteAdvisorModule.kt
      - ai/src/main/kotlin/com/wingedsheep/ai/engine/Strategist.kt
      - ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/CardAdvisor.kt
      - industrial-waste/challengers/tempo-a.dck
      - industrial-waste/control/industrial-waste-v1.0-submitted.dck
      - industrial-waste/gauntlet/grixis-affinity-carlos-dc-2026-09-12.dck
      - industrial-waste/seed-registry.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tempo-grixis-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@v3
      - name: Execute frozen-vector pilot
        id: pilot
        continue-on-error: true
        env: {IW_TEMPO_GRIXIS_PILOT: "true"}
        run: ./gradlew :ai:test --tests IndustrialWasteTempoGrixisPilotBenchmark -Dbenchmark=true --no-daemon
      - name: Diagnose test runtime
        if: always()
        run: |
          echo "pilot_outcome=${{ steps.pilot.outcome }}"
          find ai/build/test-results -type f -maxdepth 4 -print 2>/dev/null || true
          for f in ai/build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            cat "$f"
          done
          find ai/build/reports/tests -type f -maxdepth 5 -print 2>/dev/null | head -100 || true
      - name: Enforce pilot success
        if: always()
        run: test "${{ steps.pilot.outcome }}" = "success"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-tempo-a-grixis-pilot
          path: industrial-waste/results/gate-6-tempo-a-grixis-pilot-v1.json
          if-no-files-found: ignore


name: Industrial Waste — Tempo A Grixis Pilot
on:
  push:
    branches: [industrial-waste/lab]
    paths:
      - .github/workflows/industrial-waste-tempo-grixis-pilot.yml
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteTempoGrixisPilotBenchmark.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteAdvisorModule.kt
      - ai/src/main/kotlin/com/wingedsheep/ai/engine/Strategist.kt
      - ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/CardAdvisor.kt
      - industrial-waste/challengers/tempo-a.dck
      - industrial-waste/control/industrial-waste-v1.0-submitted.dck
      - industrial-waste/gauntlet/grixis-affinity-carlos-dc-2026-09-12.dck
      - industrial-waste/seed-registry.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tempo-grixis-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@v3
      - name: Compute authoritative seed digest
        run: |
          python3 - <<'PY'
          import hashlib
          namespace="IW-G6-TEMPO-A-GRIXIS-PILOT-V1"
          seeds=[]
          for i in range(1,3):
              d=hashlib.sha256(f"{namespace}:{i}".encode()).digest()
              v=int.from_bytes(d[:8],"big",signed=True) & ((1<<63)-1)
              seeds.append(v or 1)
          digest=hashlib.sha256("\n".join(map(str,seeds)).encode()).hexdigest()
          print("TEMPO_GRIXIS_DIGEST="+digest)
          raise SystemExit(1)
          PY
      - name: Execute fail-closed pilot
        if: success()
        env: {IW_TEMPO_GRIXIS_PILOT: "true"}
        run: just test-class IndustrialWasteTempoGrixisPilotBenchmark
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-tempo-a-grixis-pilot
          path: industrial-waste/results/gate-6-tempo-a-grixis-pilot-v1.json
          if-no-files-found: ignore

# stdout-digest retry

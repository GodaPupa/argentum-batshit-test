name: Batshit Grixis Policy Focused

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/batshit-grixis-policy-focused.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact policy candidate
        uses: actions/checkout@v6
        with:
          ref: a326db872c0f6ebf44524db1c0477883fce2b054
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "a326db872c0f6ebf44524db1c0477883fce2b054"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Run focused Grixis policy regressions
        run: scripts/test-class GrixisAffinityPolicyRegressionTest --info --stacktrace

name: Industrial Waste — Stability A Engine Smoke

on:
  push:
    branches:
      - industrial-waste/lab
    paths:
      - .github/workflows/industrial-waste-stability-smoke.yml
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteStabilitySmokeBenchmark.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteAdvisorModule.kt
      - industrial-waste/control/industrial-waste-v1.0-submitted.dck
      - industrial-waste/challengers/stability-a.dck
      - industrial-waste/sim/**
      - justfile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability-engine-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@v3
      - name: Validate inputs
        run: |
          python3 -m unittest discover -s industrial-waste/sim -p 'test_*.py' -v
          python3 industrial-waste/sim/validate_inputs.py
      - name: Run deterministic engine smoke
        env:
          IW_STABILITY_SMOKE: "true"
        run: just test-class IndustrialWasteStabilitySmokeBenchmark
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-stability-a-engine-smoke
          path: industrial-waste/results/gate-6-stability-a-engine-smoke-v1.json
          if-no-files-found: error

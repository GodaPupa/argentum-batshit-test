name: Industrial Waste — Policy Screen

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Validate frozen inputs
        run: |
          python3 -m unittest discover -s industrial-waste/sim -p 'test_*.py' -v
          python3 industrial-waste/sim/validate_inputs.py

      - name: Run fresh paired Industrial policy screen
        run: just industrial-waste-goldfish
        env:
          IW_GOLDFISH: "true"
          IW_POLICY_SCREEN: "true"

      - name: Upload policy-screen evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-policy-screen
          path: industrial-waste/results/gate-3-policy-screen-v1.json
          if-no-files-found: error

name: Manual activation payment diagnostic R1
on:
  push:
    branches: [validation/manual-activation-payment-diagnostic-r1-20261027]
    paths: ['.github/workflows/manual-activation-payment-diagnostic-r1-20261027.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 66d94282f5e418f53fee8dcd8e52d77a11657262
  SOURCE_TREE: 1aa375eb78efa967c38ee1382897dec541b63a2c
  WORKFLOW: .github/workflows/manual-activation-payment-diagnostic-r1-20261027.yml
  RECORD: experiments/manual-transmission/research/activation-payment-diagnostic-r1-20261027
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile both forms then capture exact diagnostic witnesses
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-activation-payment-diagnostic-r1-${{ github.run_id }}
          path: manual-activation-payment-diagnostic-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

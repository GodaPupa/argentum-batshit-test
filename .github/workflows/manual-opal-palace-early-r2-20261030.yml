name: Manual Opal Palace early R2
on:
  push:
    branches: [validation/manual-opal-palace-early-r2-20261030]
    paths: ['.github/workflows/manual-opal-palace-early-r2-20261030.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 450e7f5ebac550f53ad14e5b5791fe8eb0daeaa5
  SOURCE_TREE: 388cd02183f2baaf3d72fceee1aa5311e4d8072d
  WORKFLOW: .github/workflows/manual-opal-palace-early-r2-20261030.yml
  RECORD: experiments/manual-transmission/research/opal-palace-early-r1-20261030
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile all normal and mutant forms before Opal early gates and restoration
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-opal-palace-early-r2-${{ github.run_id }}
          path: manual-opal-palace-early-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

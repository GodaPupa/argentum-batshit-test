name: Pest Monster Tron R1 A2 candidate qualification
on:
  push:
    branches: ["pest/monster-tron-r1-a2-candidate-20261006"]
    paths:
      - ".github/workflows/pest-control-tier-one-monster-tron-r1-official-smoke.yml"
      - "docs/experiments/pest-control/PEST_MONSTER_TRON_R1_A2_CANDIDATE_20261006.json"
      - "gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonsterTronRunnerSurfacePreflight.kt"
      - "gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonsterTronRunnerSurfacePreflightTest.kt"
      - "scripts/experiments/pest-control/verify_pest_monster_tron_r1_a2_candidate.py"
      - ".github/workflows/pest-monster-tron-r1-a2-candidate-qualify-20261006.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: pest-monster-tron-r1-a2-candidate-20261006
  cancel-in-progress: false
jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUT: /tmp/pest-monster-tron-r1-a2-candidate-structural
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact A2 candidate delta and reused identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 scripts/experiments/pest-control/verify_pest_monster_tron_r1_a2_candidate.py | tee "$OUT/verifier-result.json"
          sha256sum docs/experiments/pest-control/PEST_MONSTER_TRON_R1_A2_CANDIDATE_20261006.json | tee "$OUT/manifest.sha256"
          sha256sum .github/workflows/pest-control-tier-one-monster-tron-r1-official-smoke.yml | tee "$OUT/official-workflow.sha256"
          git rev-parse HEAD > "$OUT/head.txt"
          git rev-parse 'HEAD^{tree}' > "$OUT/tree.txt"
          printf '%s\n' 'A2_CANDIDATE_QUALIFICATION_ONLY__NO_A2_ACTIVATION__NO_CLAIM__NO_GAMEPLAY' > "$OUT/scope.txt"
      - name: Reconcile claim and execution refs read-only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/pest-control/official-attempts" -o "$OUT/live-official-attempt-refs.json"
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/pest-control/tier1-monster-tron-r1-official-smoke" -o "$OUT/live-r1-workflow-refs.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path("/tmp/pest-monster-tron-r1-a2-candidate-structural")
          refs=json.loads((out/"live-official-attempt-refs.json").read_text()); got={r["ref"]:r["object"]["sha"] for r in refs}
          old="refs/heads/pest-control/official-attempts/monster-tron-smoke-v1"; new="refs/heads/pest-control/official-attempts/monster-tron-replacement-smoke-r1"
          assert got=={old:"1c2e253ad7f5a7652304f7c9aaafc30e547a481e"},got; assert new not in got
          workflow_refs=json.loads((out/"live-r1-workflow-refs.json").read_text()); assert workflow_refs==[],workflow_refs
          print(json.dumps({"historical_claim":got[old],"future_r1_claim_ref":"ABSENT","execution_branch":"ABSENT","claim_created":False,"a2_active":False,"games":0,"actions":0,"outcomes":0},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pest-monster-tron-r1-a2-candidate-structural-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pest-monster-tron-r1-a2-candidate-structural/
          if-no-files-found: error
          retention-days: 90
  runner_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_USER_HOME: /tmp/pest-r1-a2-candidate-gradle-${{ github.run_id }}-${{ github.run_attempt }}
      OUT: /tmp/pest-monster-tron-r1-a2-candidate-runner-guard
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run changed runner/workflow coupling tests only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain :gym:test --tests com.wingedsheep.gym.PestControlTierOneMonsterTronRunnerSurfacePreflightTest 2>&1 | tee "$OUT/runner-surface-preflight.log"
          printf '%s\n' 'CHANGED_A2_WORKFLOW_GUARD_COUPLING_ONLY__NO_CLAIM__NO_GAMEPLAY' > "$OUT/scope.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pest-monster-tron-r1-a2-candidate-runner-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pest-monster-tron-r1-a2-candidate-runner-guard/
          if-no-files-found: error
          retention-days: 90

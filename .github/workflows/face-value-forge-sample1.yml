name: Face Value Forge Sample 1

on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-forge-sample1.yml]

permissions:
  contents: read

jobs:
  sample-one:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone Forge and apply validated Face Value heuristics
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src rev-parse HEAD | tee forge-source-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          energy=Path('forge-src/forge-gui/res/cardsfolder/e/energy_tap.txt')
          t=energy.read_text()
          old="A:SP$ Tap | TgtPrompt$ Select target untapped creature you control | ValidTgts$ Creature.untapped+YouCtrl | SubAbility$ DBMana | SpellDescription$ Tap target untapped creature you control. If you do, add an amount of {C} equal to that creature's mana value."
          new="A:SP$ Tap | TgtPrompt$ Select target untapped creature you control | ValidTgts$ Creature.untapped+YouCtrl | AILogic$ EnergyTap | SubAbility$ DBMana | SpellDescription$ Tap target untapped creature you control. If you do, add an amount of {C} equal to that creature's mana value."
          assert old in t
          energy.write_text(t.replace(old,new).replace('\nAI:RemoveDeck:All',''))

          tap=Path('forge-src/forge-ai/src/main/java/forge/ai/ability/TapAi.java')
          s=tap.read_text(); needle='        final Player turn = phase.getPlayerTurn();\n\n'; assert needle in s
          lines=[
            '        final Player turn = phase.getPlayerTurn();','',
            '        if ("EnergyTap".equals(sa.getParamOrDefault("AILogic", ""))) {',
            '            if (!phase.is(PhaseType.MAIN2, ai)) return new AiAbilityDecision(0, AiPlayDecision.WaitForMain2);',
            '            boolean hasFollowup = ai.getCardsIn(ZoneType.Hand).stream().anyMatch(c ->',
            '                    "Wretched Gryff".equals(c.getName()) || "Drownyard Lurker".equals(c.getName()) || "It of the Horrid Swarm".equals(c.getName()));',
            '            if (!hasFollowup) return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);',
            '            CardCollection candidates = CardLists.getTargetableCards(ai.getCreaturesInPlay(), sa);',
            '            candidates = CardLists.filter(candidates, CardPredicates.CAN_TAP);',
            '            Card choice = ComputerUtilCard.getMostExpensivePermanentAI(candidates);',
            '            if (choice == null || choice.getCMC() < 7) return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);',
            '            sa.resetTargets(); sa.getTargets().add(choice);',
            '            return new AiAbilityDecision(100, AiPlayDecision.WillPlay);',
            '        }',''
          ]
          tap.write_text(s.replace(needle,'\n'.join(lines),1))

          rush=Path('forge-src/forge-gui/res/cardsfolder/r/rush_of_knowledge.txt')
          r=rush.read_text(); rold='A:SP$ Draw | Defined$ You | NumCards$ X | SpellDescription$ Draw cards equal to the highest mana value among permanents you control.'
          rnew='A:SP$ Draw | Defined$ You | NumCards$ X | AILogic$ FaceValueRush | SpellDescription$ Draw cards equal to the highest mana value among permanents you control.'
          assert rold in r; rush.write_text(r.replace(rold,rnew))

          draw=Path('forge-src/forge-ai/src/main/java/forge/ai/ability/DrawAi.java')
          d=draw.read_text(); dn='        boolean aboutToBeMyTurn = ph.getNextTurn().equals(ai) && ph.is(PhaseType.END_OF_TURN);\n\n'; assert dn in d
          dl=[
            '        boolean aboutToBeMyTurn = ph.getNextTurn().equals(ai) && ph.is(PhaseType.END_OF_TURN);','',
            '        if ("FaceValueRush".equals(sa.getParamOrDefault("AILogic", ""))) {',
            '            int highest = ai.getCardsIn(ZoneType.Battlefield).stream().mapToInt(Card::getCMC).max().orElse(0);',
            '            if (highest < 7) return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);',
            '        }',''
          ]
          draw.write_text(d.replace(dn,'\n'.join(dl),1))
          PY
          git -C forge-src diff -- forge-gui/res/cardsfolder/e/energy_tap.txt forge-ai/src/main/java/forge/ai/ability/TapAi.java forge-gui/res/cardsfolder/r/rush_of_knowledge.txt forge-ai/src/main/java/forge/ai/ability/DrawAi.java > forge-face-value-ai.patch

      - name: Build patched Forge
        run: |
          set -euxo pipefail
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"

      - name: Install frozen decks and provenance
        run: |
          mkdir -p "$HOME/.forge/decks/constructed" decks
          cat > "decks/Face Value v0.7.dck" <<'EOF'
          [metadata]
          Name=Face Value v0.7
          Deck Type=constructed
          [main]
          4 Llanowar Elves
          4 Nest Invader
          4 Eldrazi Repurposer
          1 Eyeless Watcher
          4 Wretched Gryff
          2 It of the Horrid Swarm
          2 Annoyed Altisaur
          1 Drownyard Lurker
          1 Nyxborn Hydra
          4 Malevolent Rumble
          3 Energy Tap
          2 Rush of Knowledge
          4 Preordain
          2 Snap
          1 Lose Focus
          1 Tamiyo's Safekeeping
          8 Forest
          8 Island
          4 Tangled Islet
          EOF
          cat > "decks/Muril0Ambra Mono Red Madness 2026-09-12.dck" <<'EOF'
          [metadata]
          Name=Muril0Ambra Mono Red Madness 2026-09-12
          Deck Type=constructed
          [main]
          4 Voldaren Epicure
          4 Kessig Flamebreather
          4 Sneaky Snacker
          3 Guttersnipe
          4 Faithless Looting
          4 Grab the Prize
          4 Highway Robbery
          4 Lava Dart
          4 Lightning Bolt
          4 Fiery Temper
          3 Fireblast
          18 Mountain
          EOF
          cp decks/*.dck "$HOME/.forge/decks/constructed/"
          cat > sample-provenance.txt <<'EOF'
          Sample: FACE_VALUE_V07_VS_MURIL0AMBRA_2026_09_12_PREBOARD_FORGE_S1
          Face Value: v0.7 frozen 60
          Opponent: Muril0Ambra Mono Red Madness, 5-0, MTGO Pauper League #10991, 2026-09-12
          MTGDecks event: https://mtgdecks.net/Pauper/mtgo-pauper-league-10991-tournament-269860
          MTGDecks deck: https://mtgdecks.net/Pauper/mono-red-madness-decklist-by-muril0ambra-3086428
          Mode: preboard
          Retired diagnostic matchup seeds: 910001-910020
          Pilot-regression-only seeds: 915001-915010
          EOF
          sha256sum decks/*.dck sample-provenance.txt | tee frozen-inputs.sha256

      - name: Freeze Sample 1 seeds
        run: |
          seq 920001 920020 > sample1-seeds.txt
          sha256sum sample1-seeds.txt | tee sample1-seeds.sha256

      - name: Execute Sample 1 exactly once
        run: |
          set -euo pipefail
          mkdir sample1-logs
          : > sample1-combined.log
          while read -r seed; do
            echo "===== SEED $seed =====" | tee -a sample1-combined.log
            "$FORGE_LAUNCHER" sim -d "Face Value v0.7.dck" "Muril0Ambra Mono Red Madness 2026-09-12.dck" -n 1 -s "$seed" -c 60 2>&1 | tee "sample1-logs/$seed.log" | tee -a sample1-combined.log
          done < sample1-seeds.txt

      - name: Audit Sample 1
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib
          records=[]
          for p in sorted(Path('sample1-logs').glob('*.log')):
            text=p.read_text(errors='replace'); seed=int(p.stem)
            if re.search(r'Ai\(1\)-Face Value v0\.7 has won!',text): winner='face_value'
            elif re.search(r'Ai\(2\)-Muril0Ambra Mono Red Madness 2026-09-12 has won!',text): winner='mono_red'
            elif 'ended in a Draw' in text: winner='draw'
            else: winner='unknown'
            taps=list(re.finditer(r'Add To Stack: Ai\(1\)-Face Value v0\.7 cast Energy Tap targeting',text)); productive=0
            for m in taps:
              end=text.find("Phase: Ai(1)-Face Value v0.7's End step",m.end()); seg=text[m.end():end if end!=-1 else m.end()+2500]
              if re.search(r'Add To Stack: Ai\(1\)-Face Value v0\.7 cast (Wretched Gryff|Drownyard Lurker|It of the Horrid Swarm)',seg): productive+=1
            records.append({'seed':seed,'winner':winner,'energy_tap_casts':len(taps),'productive_energy_taps':productive,'rush_casts':len(re.findall(r'cast Rush of Knowledge',text)),'gryff_emerge':len(re.findall(r'Wretched Gryff - Creature 3 / 4 \(Emerge\)',text)),'it_emerge_mentions':len(re.findall(r'It of the Horrid Swarm.*Emerge',text)),'engine_exception':bool(re.search(r'Exception|StackOverflowError|Stopping slow match as draw',text))})
          s={'sample_id':'FACE_VALUE_V07_VS_MURIL0AMBRA_2026_09_12_PREBOARD_FORGE_S1','games':len(records),'face_value_wins':sum(x['winner']=='face_value' for x in records),'mono_red_wins':sum(x['winner']=='mono_red' for x in records),'draws':sum(x['winner']=='draw' for x in records),'unknown':sum(x['winner']=='unknown' for x in records),'energy_tap_casts':sum(x['energy_tap_casts'] for x in records),'productive_energy_taps':sum(x['productive_energy_taps'] for x in records),'rush_casts':sum(x['rush_casts'] for x in records),'gryff_emerge':sum(x['gryff_emerge'] for x in records),'it_emerge_mentions':sum(x['it_emerge_mentions'] for x in records),'engine_exceptions':sum(x['engine_exception'] for x in records),'seed_vector_sha256':hashlib.sha256(Path('sample1-seeds.txt').read_bytes()).hexdigest()}
          s['pilot_gate_clean']=(s['engine_exceptions']==0 and s['unknown']==0 and s['productive_energy_taps']==s['energy_tap_casts'])
          Path('sample1-records.json').write_text(json.dumps(records,indent=2,sort_keys=True)); Path('sample1-summary.json').write_text(json.dumps(s,indent=2,sort_keys=True)); print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Preserve Sample 1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-forge-sample1
          path: |
            sample1-combined.log
            sample1-logs/*.log
            sample1-records.json
            sample1-summary.json
            sample1-seeds.txt
            sample1-seeds.sha256
            sample-provenance.txt
            frozen-inputs.sha256
            forge-face-value-ai.patch
            forge-source-commit.txt
            decks/*.dck
          if-no-files-found: warn

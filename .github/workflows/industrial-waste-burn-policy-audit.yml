name: Industrial Waste — Burn Policy Audit

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  burn-policy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up just
        uses: extractions/setup-just@v3
      - name: Run deterministic Burn policy fixtures
        run: just test-class IndustrialWasteMadnessBurnPolicyAuditTest
      - name: Print focused test failure details
        if: failure()
        run: |
          find ai/build/test-results/test -name 'TEST-*IndustrialWasteMadnessBurnPolicyAuditTest*.xml' \
            -exec sed -n '1,220p' {} \;

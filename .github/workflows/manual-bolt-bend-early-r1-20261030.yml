name: Manual Bolt Bend compile-first early qualification R1
on:
  push:
    branches: [validation/manual-bolt-bend-early-r1-20261030]
    paths: ['.github/workflows/manual-bolt-bend-early-r1-20261030.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: b13631c6fcf726576b28df14abf2297a6f911f93
  SOURCE_TREE: 11673173c61d12242236e4c36f460ec8cecc0ce6
  WORKFLOW: .github/workflows/manual-bolt-bend-early-r1-20261030.yml
  RECORD: experiments/manual-transmission/research/bolt-bend-early-r1-20261030
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web-client/package-lock.json}
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile normal and all mutants before bounded behavioral gates
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-bolt-bend-early-r1-${{ github.run_id }}
          path: manual-bolt-bend-early-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

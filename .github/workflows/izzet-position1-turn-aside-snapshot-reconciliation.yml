name: Izzet Position-1 Turn Aside Snapshot Reconciliation
on:
  push:
    branches: ["izzet/position1-turn-aside-snapshot-reconcile-20260929"]
    paths:
      - "mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/som/cards/TurnAside.kt"
      - "mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/TurnAsideScenarioTest.kt"
      - "experiments/izzet-science/POSITION1_TURN_ASIDE_SNAPSHOT_RECONCILIATION_BUDGET_20260929.json"
      - ".github/workflows/izzet-position1-turn-aside-snapshot-reconciliation.yml"
permissions: {contents: read}
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact snapshot reconciliation sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/izzet-turn-aside-snapshot-reconcile/generated
          test "$(git rev-parse HEAD^)" = "799973561604747460e31521295e97ac8f9a6864"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/som/cards/TurnAside.kt)" = "96a656b7fdd77ae10045d523e281eb34f5cb711e"
          test "$(git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/TurnAsideScenarioTest.kt)" = "0eec9947e43bb43a9c3bbe9d90a33626a243cf3f"
          test "$(git hash-object experiments/izzet-science/evidence/position1-turn-aside-36550162966-original-audit.json)" = "f33d7e88d5732ef7a266da95d47671b4d1f020f9"
          test "$(git hash-object experiments/izzet-science/POSITION1_TURN_ASIDE_SNAPSHOT_RECONCILIATION_BUDGET_20260929.json)" = "f1f463de8102bd8046bba1f6291c5aa9da376f01"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/all/cards/ArcaneDenial.kt)" = "b80ac4364d27398cffde16e5f6d6a41eb0792ea9"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/hml/cards/MemoryLapse.kt)" = "e07d873bfccc9634cc0121fe988003e5af1e3fbc"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m13/cards/Archaeomancer.kt)" = "cc5b2951943c875982036f9b7506072ea65d9db6"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/roe/cards/MnemonicWall.kt)" = "dcfca24f1918f79092b7f3274ee454614d15d03e"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ulg/cards/Snap.kt)" = "15c15b39609e97796a110c5228e84265a60cc45d"
          test "$(git hash-object mtg-sets/src/test/resources/snapshots/cards/ALL.json)" = "0a92b0df2784fb5b91a9c275f0b1fbdb89b159e1"
          test "$(git hash-object mtg-sets/src/test/resources/snapshots/cards/HML.json)" = "c169b062c569a6a3b7eebb057812a27cf4b849b0"
          test "$(git hash-object mtg-sets/src/test/resources/snapshots/cards/M13.json)" = "5414bc0eca9b15c3036c017842b5771157fe7c59"
          test "$(git hash-object mtg-sets/src/test/resources/snapshots/cards/ROE.json)" = "0e7b2fd35a00e9a0457371d1121e1129f26611fa"
          test "$(git hash-object mtg-sets/src/test/resources/snapshots/cards/SOM.json)" = "2996ec679538e38b70f4ac5b1546b0ffca63463d"
          test "$(git hash-object mtg-sets/src/test/resources/snapshots/cards/ULG.json)" = "e73f3fd6a781b52a3af3b7735f2e0b2565e0cfea"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/som/cards/TurnAside.kt
            git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/TurnAsideScenarioTest.kt
            git hash-object experiments/izzet-science/evidence/position1-turn-aside-36550162966-original-audit.json
            git hash-object experiments/izzet-science/POSITION1_TURN_ASIDE_SNAPSHOT_RECONCILIATION_BUDGET_20260929.json
            git hash-object .github/workflows/izzet-position1-turn-aside-snapshot-reconciliation.yml
          } > build/reports/izzet-turn-aside-snapshot-reconcile/source.txt
          test -z "$(git status --porcelain)"
      - name: Fresh corpus snapshot generation and CardLint
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:test --tests '*CardDefinitionSnapshotTest' --tests '*CardLintTest' -DupdateSnapshots=true --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-turn-aside-snapshot-reconcile/snapshot-lint.log
      - name: Prove exact six-card reconciliation and preserve generated originals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess
          expected_paths=[
            "mtg-sets/src/test/resources/snapshots/cards/ALL.json",
            "mtg-sets/src/test/resources/snapshots/cards/HML.json",
            "mtg-sets/src/test/resources/snapshots/cards/M13.json",
            "mtg-sets/src/test/resources/snapshots/cards/ROE.json",
            "mtg-sets/src/test/resources/snapshots/cards/SOM.json",
            "mtg-sets/src/test/resources/snapshots/cards/ULG.json",
          ]
          expected_added={
            "ALL":"Arcane Denial",
            "HML":"Memory Lapse",
            "M13":"Archaeomancer",
            "ROE":"Mnemonic Wall",
            "SOM":"Turn Aside",
            "ULG":"Snap",
          }
          changed=sorted(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          assert changed == sorted(expected_paths), (changed, expected_paths)
          def records(text):
              out={}
              for block in re.split(r'\n\n(?=// )', text.strip()):
                  heading, body=block.split('\n',1)
                  assert heading.startswith("// "), heading
                  name=heading[3:]
                  assert name not in out, name
                  out[name]=(body,json.loads(body))
              return out
          out=pathlib.Path("build/reports/izzet-turn-aside-snapshot-reconcile/generated")
          bindings={}
          for path in expected_paths:
              code=pathlib.Path(path).stem
              before=subprocess.check_output(["git","show","HEAD:"+path],text=True)
              after=pathlib.Path(path).read_text()
              old,new=records(before),records(after)
              added=set(new)-set(old)
              removed=set(old)-set(new)
              assert added == {expected_added[code]}, (code, added)
              assert not removed, (code, removed)
              assert all(old[n] == new[n] for n in old), f"{code}: existing card tree changed"
              (out/f"{code}.json").write_bytes(pathlib.Path(path).read_bytes())
              (out/f"{code}.patch").write_bytes(subprocess.check_output(["git","diff","--",path]))
              bindings[code]={
                  "path":path,
                  "base_blob":subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip(),
                  "sha256":hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest(),
                  "added_record":expected_added[code],
                  "unchanged_existing_records":len(old),
              }
          pathlib.Path("build/reports/izzet-turn-aside-snapshot-reconcile/binding.json").write_text(
              json.dumps({"changed_paths":changed,"snapshots":bindings},indent=2)+"\n"
          )
          PY
          git diff --check
      - name: Preserve exact original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-position1-turn-aside-snapshot-reconcile-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-turn-aside-snapshot-reconcile/
          if-no-files-found: error
          retention-days: 90

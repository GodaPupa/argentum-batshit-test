name: Izzet Position-1 Batch C Snapshot Rebless

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-batch-c-snapshot-rebless.yml"

permissions:
  contents: write

jobs:
  rebless-batch-c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mayhem/izzet-science
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"

      - name: Regenerate snapshots canonically
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true --stacktrace

      - name: Fail closed on unrelated snapshot changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            "mtg-sets/src/test/resources/snapshots/cards/AFR.json"
            "mtg-sets/src/test/resources/snapshots/cards/M13.json"
            "mtg-sets/src/test/resources/snapshots/cards/ROE.json"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          git diff --check
          grep -Fq '// Owlbear' mtg-sets/src/test/resources/snapshots/cards/AFR.json
          grep -Fq '// Archaeomancer' mtg-sets/src/test/resources/snapshots/cards/M13.json
          grep -Fq '// Mnemonic Wall' mtg-sets/src/test/resources/snapshots/cards/ROE.json

      - name: Commit and safely integrate canonical snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             mtg-sets/src/test/resources/snapshots/cards/AFR.json             mtg-sets/src/test/resources/snapshots/cards/M13.json             mtg-sets/src/test/resources/snapshots/cards/ROE.json
          git commit -m "Rebless Position-1 Batch C snapshots"
          git fetch origin mayhem/izzet-science
          git rebase origin/mayhem/izzet-science
          git push origin HEAD:mayhem/izzet-science

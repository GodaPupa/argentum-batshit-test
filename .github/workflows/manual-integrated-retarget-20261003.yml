name: Manual fixed-slot retarget structure diagnostic
on:
  push:
    branches: [validation/manual-integrated-retarget-20261003]
    paths: [.github/workflows/manual-integrated-retarget-20261003.yml]
permissions:
  contents: read
concurrency:
  group: manual-integrated-retarget-20261003
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/manual-spellskite-structure-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source-only successor and workflow-only validation child
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['OUT'])
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          source='690c61c16325761f2c7e830c2e5828cc5ed978d6';parent='0acda06770dbd8e545dab62e9e99abccf488ad58';workflow='.github/workflows/manual-integrated-retarget-20261003.yml'
          expected={'mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/StackEffects.kt': '350d3737955093f7fe013583d42ea3418faeda41', 'mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/dsl/Effects.kt': '461050a58b25d2a216b88c48dbd8a724f9e2998e', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/core/CardSpecificContinuations.kt': 'c4c8e908f878d9dfa5f48a0fb50bda6497ef8825', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/core/Serialization.kt': '3db981304ef2aa5550c2ca3283fe99c697d94be6', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/stack/ChangeOneTargetToExecutor.kt': '1e7f6f03bbf8ecf429778482800a3ddc2d7231f1', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/stack/StackExecutors.kt': 'ed5c3a47625beada47c69ed8bc72e74389bc04d2', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/ObjectReferencePropagation.kt': '4634b693eaad70728b186d26edcd0b513d9500ca', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/CardSpecificContinuationResumer.kt': 'df198d885b146f40599de54cbbf31c508c82adb1', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/mechanics/targeting/FixedDestinationEffectTest.kt': '69393c5bffc75789dd369e33d162d6c9acbc9cca', 'docs/card-sdk-language-reference.md': '49586aba3fd937c446d4e8ef728e26443cb3ad6c', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/targeting/TargetValidator.kt': 'ca1776c683426d6aab31bc2f020d0a20035ad3b8', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/state/components/stack/StackComponents.kt': '0d452058ecef734f11f7140cacdfac8e73a9e9e9', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt': 'a3caefa6114b12077564d4b148452035f635ac92', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/mechanics/targeting/AnnouncedSpliceGroupsTest.kt': '13ba6258cfe453e28168087eefd6ddc9d75fd7b0', 'web-client/src/types/actions.ts': '52c3581fe138f981417196010d1e57c53b702305', 'web-client/src/store/slices/types.ts': '2d4c7da3ae9983e00c03db89dc0f6263986742f3', 'web-client/src/store/slices/ui/targetingSlice.ts': '3a0d97c8328c9c970451d851ac8005ee6457979e', 'web-client/src/store/slices/ui/pipelinePhases.ts': 'dc003fb467cfbb9d142ebc4e4a76ea5bd4cda5ce', 'web-client/src/store/slices/ui/targetingSlice.test.ts': '47f3fea71ffcbdb63554af56b8a46ef286474885', 'web-client/src/store/slices/ui/pipelinePhases.test.ts': 'cf88bc6afa05342d54f72c99e64893b0edcc5514', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/targeting/FixedDestinationRetarget.kt': 'b1ab5e6cce8199c5dc473dc6b1fa0fc3e8e4050b', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/mechanics/targeting/FixedDestinationRetargetTest.kt': '3c8b90e9f3382c081708cfefb0e1817eb456ebf3', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/mechanics/targeting/RetargetVisitIdentityDiagnosticTest.kt': 'f9e9a3adeee33aaf5c0f58b3a3b290c392c43567'}
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==source
          assert git('rev-parse','HEAD^^')==parent
          assert git('rev-parse',source+'^{tree}')=='5176b743377345efd46cf476f89c33e20b7b9106'
          assert git('diff','--name-only',source,'HEAD').splitlines()==[workflow]
          assert git('diff','--name-only',parent,source).splitlines()==sorted(expected)
          assert not git('status','--porcelain')
          for p,blob in expected.items(): assert git('hash-object',p)==blob,p
          binding={'source_head':source,'source_tree':'5176b743377345efd46cf476f89c33e20b7b9106','parent_source_head':parent,'validation_head':git('rev-parse','HEAD'),'source_git_blobs':expected,'scope':'EXCLUDED_FIXED_COMPONENT_DIAGNOSTIC','official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
          (out/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          PYCODE
      - name: Run integrated retarget scenarios and isolated visit-identity requirement
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-configuration-cache --console=plain --continue --max-workers=1 \
            -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g \
            :rules-engine:test --tests com.wingedsheep.engine.triggers.RetargetStructureBoundaryTest --tests com.wingedsheep.engine.mechanics.targeting.AnnouncedTargetGroupsTest --tests com.wingedsheep.engine.mechanics.targeting.TargetGroupProducerIntegrationTest --tests com.wingedsheep.engine.mechanics.targeting.FixedDestinationRetargetTest --tests com.wingedsheep.engine.mechanics.targeting.FixedDestinationEffectTest --tests com.wingedsheep.engine.mechanics.targeting.AnnouncedSpliceGroupsTest --tests com.wingedsheep.engine.mechanics.targeting.RetargetVisitIdentityDiagnosticTest \
            2>&1 | tee "$OUT/qualification.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
          exit "$rc"
      - uses: actions/setup-node@v5
        if: always()
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - name: Verify affected client target selection
        if: always()
        working-directory: web-client
        shell: bash
        run: |
          set -uo pipefail
          npm ci > "$OUT/client-install.log" 2>&1 || exit $?
          npm run typecheck > "$OUT/client-typecheck.log" 2>&1
          type_rc=$?
          npx vitest run src/store/slices/ui/targetingSlice.test.ts src/store/slices/ui/pipelinePhases.test.ts --reporter=json --outputFile="$OUT/client-tests.json" > "$OUT/client-tests.log" 2>&1
          test_rc=$?
          printf '%s %s\n' "$type_rc" "$test_rc" > "$OUT/client-exit-codes.txt"
          test "$type_rc" -eq 0 && test "$test_rc" -eq 0
      - name: Preserve every diagnostic result
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,shutil,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
          reports=out/'xml';reports.mkdir(exist_ok=True)
          cases=[]
          for path in pathlib.Path('rules-engine/build/test-results/test').glob('TEST-*.xml'):
            shutil.copy2(path,reports/path.name)
            for case in ET.parse(path).getroot().iter('testcase'):
              failure=case.find('failure');error=case.find('error')
              cases.append({'name':case.attrib['name'],'failure':None if failure is None else failure.attrib,'error':None if error is None else error.attrib,'skipped':case.find('skipped') is not None})
          summary={'tests':len(cases),'failures':sum(c['failure'] is not None for c in cases),'errors':sum(c['error'] is not None for c in cases),'skipped':sum(c['skipped'] for c in cases),'cases':cases,'card_admitted':False,'inventory_executed':False,'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
          (out/'test-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          (out/'evidence-sha256.json').write_text(json.dumps({str(f.relative_to(out)):hashlib.sha256(f.read_bytes()).hexdigest() for f in out.rglob('*') if f.is_file() and f.name!='evidence-sha256.json'},indent=2)+'\n')
          assert len(cases)==35,summary
          assert summary['failures']==1 and summary['errors']==0 and summary['skipped']==0,summary
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manual-spellskite-structure-${{ github.run_id }}
          path: ${{ env.OUT }}
          retention-days: 90
          if-no-files-found: error

name: Ferocity source08 mtgish software freshness supplement

on:
  push:
    branches: [lab/ferocity-source08-mtgish-freshness-20260926]

permissions:
  contents: read

jobs:
  verify-existing-cached-module:
    if: ${{ github.event.before == '0000000000000000000000000000000000000000' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 3a4f99a7653839506e96d19e6639f58d9e8c5ced
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Execute only the existing mtgish-tooling147 software cases
        run: python3 control/ferocity-mtgish-freshness.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ferocity-source08-mtgish-fresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

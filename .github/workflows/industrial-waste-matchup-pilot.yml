name: Industrial Waste — Madness Burn Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - industrial-waste/lab
    paths:
      - .github/workflows/industrial-waste-matchup-pilot.yml
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteMatchupPilotBenchmark.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteGoldfishTelemetry.kt
      - industrial-waste/gauntlet/madness-burn-canevazzi-2026-09-12.dck
      - industrial-waste/protocols/gate-4-madness-burn-pilot-v1.md
      - industrial-waste/seed-registry.json
      - justfile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matchup-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up just
        uses: extractions/setup-just@v3
      - name: Validate frozen inputs
        run: |
          python3 -m unittest discover -s industrial-waste/sim -p 'test_*.py' -v
          python3 industrial-waste/sim/validate_inputs.py
      - name: Run paired preboard pilot
        run: just industrial-waste-matchup-pilot
      - name: Upload matchup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-madness-burn-pilot
          path: industrial-waste/results/gate-4-madness-burn-pilot-v1.json
          if-no-files-found: error

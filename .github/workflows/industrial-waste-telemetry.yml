name: Industrial Waste — Telemetry Validation

on:
  workflow_dispatch:
  push:
    branches:
      - industrial-waste/lab
    paths:
      - .github/workflows/industrial-waste-telemetry.yml
      - ai/src/test/kotlin/com/wingedsheep/ai/arena/TableGameRunner.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/arena/TableGameRunnerObserverTest.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteGoldfishTelemetry.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteGoldfishTelemetryTest.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteAdvisorModule.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteAdvisorModuleTest.kt
      - industrial-waste/control/industrial-waste-v1.0-submitted.dck
      - industrial-waste/protocols/gate-3-telemetry-validation-v1.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  telemetry-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run focused telemetry fixtures
        run: >-
          scripts/gradle-locked :ai:test
          --tests '*TableGameRunnerObserverTest'
          --tests '*IndustrialWasteGoldfishTelemetryTest'
          --tests '*IndustrialWasteAdvisorModuleTest'

name: Manual paused-token R5 authorized oracle qualification
on:
  push:
    branches: [validation/manual-paused-token-entry-r5-20261023]
    paths: ['.github/workflows/manual-paused-token-entry-r5-20261023.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 0b5018a0df392acc96d8b38e20dd72ccae3ff48a
  SOURCE_TREE: 69bd3d85ff043c4f262dafe176d45b6d75752bed
  BASELINE: 418cdfdacd5191549e9fc8e4a071330120b071b7
  R3: 86a5dea55f088f1e242a151920aa83a671039b61
  HANDLER: rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/decision/SubmitDecisionHandler.kt
  RECORD: experiments/manual-transmission/research/paused-token-entry-r2-20261023
  R4_RECORD: experiments/manual-transmission/research/paused-token-entry-r4-20261023
  R5_RECORD: experiments/manual-transmission/research/paused-token-entry-r5-20261023
  WORKFLOW: .github/workflows/manual-paused-token-entry-r5-20261023.yml
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum" paused-token-r5-evidence
      - name: Bind authorized test delta, completed diagnostic, original assertions and protections
        run: |
          python3 "$R5_RECORD/gate.py" selfcheck
          python3 "$R5_RECORD/gate.py" bind
      - name: Reproduce four marker regressions with corrected tests and exact R3 handler
        id: control
        run: |
          python3 "$R5_RECORD/gate.py" prepare negative
          git restore --source="$R3" -- "$HANDLER"
          python3 "$R5_RECORD/gate.py" bind negative
          cat > paused-token-r5-evidence/negative.just <<'JUST'
          negative:
              scripts/gradle-locked :rules-engine:test --tests '*EntryChoiceEventProvenanceTest' --no-build-cache --no-daemon --console=plain --stacktrace --max-workers=2 -PkotlinCompileParallelism=1
          JUST
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile paused-token-r5-evidence/negative.just negative 2>&1 | tee paused-token-r5-evidence/negative/gradle.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > paused-token-r5-evidence/negative/exit.txt
          exit 0
      - name: Require four exact predicted assertion failures, not compilation errors
        if: always() && steps.control.outcome != 'skipped'
        run: python3 "$R5_RECORD/gate.py" negative
      - name: Restore exact candidate production and rebind before positive tests
        if: always()
        run: |
          git restore --source="$SOURCE" -- "$HANDLER"
          python3 "$R5_RECORD/gate.py" bind
      - name: Focused 690 cases and strict original JUnit receiving
        run: |
          python3 "$R5_RECORD/gate.py" prepare focused
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$R4_RECORD/validation.just" focused 2>&1 | tee paused-token-r5-evidence/focused/gradle.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > paused-token-r5-evidence/focused/exit.txt
          python3 "$R5_RECORD/gate.py" collect focused
          receiver_rc=$?
          if test "$rc" != 0; then exit "$rc"; fi
          exit "$receiver_rc"
      - name: Broad engine and nine card-era suites with lossless duplicate-label accounting
        run: |
          python3 "$R5_RECORD/gate.py" prepare broad
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$R4_RECORD/validation.just" broad 2>&1 | tee paused-token-r5-evidence/broad/gradle.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > paused-token-r5-evidence/broad/exit.txt
          python3 "$R5_RECORD/gate.py" collect broad
          receiver_rc=$?
          if test "$rc" != 0; then exit "$rc"; fi
          exit "$receiver_rc"
      - name: Ordinary whole-project build, routine AI tests and exact 43 baseline skips
        run: |
          python3 "$R5_RECORD/gate.py" prepare ordinary
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$R4_RECORD/validation.just" ordinary 2>&1 | tee paused-token-r5-evidence/ordinary/gradle.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > paused-token-r5-evidence/ordinary/exit.txt
          python3 "$R5_RECORD/gate.py" collect ordinary
          receiver_rc=$?
          if test "$rc" != 0; then exit "$rc"; fi
          exit "$receiver_rc"
      - name: Build Oracle Assay CLI
        run: |
          mkdir -p paused-token-r5-evidence/assay
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$R4_RECORD/validation.just" assay-build 2>&1 | tee paused-token-r5-evidence/assay/build.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > paused-token-r5-evidence/assay/build-exit.txt
          exit "$rc"
      - name: Assay 2000 cards and archive exact input corpus
        id: assay
        run: |
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$R4_RECORD/validation.just" assay 2>&1 | tee paused-token-r5-evidence/assay/gate.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > paused-token-r5-evidence/assay/gate-exit.txt
          capture_rc=0
          if test -f "$HOME/.cache/scryfall/_bulk-oracle-cards.jsonl.gz"; then
            sha256sum "$HOME/.cache/scryfall/_bulk-oracle-cards.jsonl.gz" > paused-token-r5-evidence/assay/oracle-bulk-sha256.txt || capture_rc=1
            wc -c "$HOME/.cache/scryfall/_bulk-oracle-cards.jsonl.gz" > paused-token-r5-evidence/assay/oracle-bulk-bytes.txt || capture_rc=1
            cp "$HOME/.cache/scryfall/_bulk-oracle-cards.jsonl.gz" paused-token-r5-evidence/assay/oracle-bulk-corpus.jsonl.gz || capture_rc=1
          else
            capture_rc=1
          fi
          printf '%s\n' "$capture_rc" > paused-token-r5-evidence/assay/corpus-capture-exit.txt
          if test "$capture_rc" != 0; then exit "$capture_rc"; fi
          exit "$rc"
      - name: Preserve full differential without reclassifying the original 51 findings
        run: |
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$R4_RECORD/validation.just" assay-differential 2>&1 | tee paused-token-r5-evidence/assay/differential.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > paused-token-r5-evidence/assay/differential-exit.txt
          exit "$rc"
      - name: Receive exact Assay metrics and original differential blocks
        if: always() && steps.assay.outcome != 'skipped'
        run: python3 "$R5_RECORD/gate.py" assay
      - name: Recheck candidate source, original assertion annex and all protections
        if: always()
        run: python3 "$R5_RECORD/gate.py" bind
      - name: Preserve source protocol, effective collectors and all available original evidence
        if: always()
        run: |
          mkdir -p paused-token-r5-evidence/protocol paused-token-r5-evidence/card
          cp -R "$R5_RECORD" paused-token-r5-evidence/protocol/r5
          cp "$R4_RECORD/PROTOCOL.json" paused-token-r5-evidence/protocol/R4_INHERITED_REQUIREMENTS.json
          cp "$R4_RECORD/EXPECTED_CASES.json" "$RECORD/BASELINE_SKIPS.json" paused-token-r5-evidence/protocol/
          cp "$WORKFLOW" paused-token-r5-evidence/protocol/WORKFLOW.yml
          if test -d mtg-sets/build/snapshots-actual; then cp -R mtg-sets/build/snapshots-actual paused-token-r5-evidence/card/; fi
          git rev-parse HEAD "$SOURCE^{tree}" > paused-token-r5-evidence/source-pins.txt
          git diff --name-status 9eb2be694761a4cae60ad4970d07e9d458d8054c "$SOURCE" > paused-token-r5-evidence/source-delta.txt
          git status --porcelain --untracked-files=no > paused-token-r5-evidence/final-tracked-changes.txt
      - name: Hash every evidence payload
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root=Path('paused-token-r5-evidence'); root.mkdir(exist_ok=True)
          manifest=root/'SHA256SUMS'
          manifest.write_text(''.join(sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(root))+'\n' for p in sorted(root.rglob('*')) if p.is_file() and p!=manifest))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-paused-token-entry-r5-${{ github.run_id }}
          path: paused-token-r5-evidence/
          retention-days: 90
          if-no-files-found: error

name: Manual Phase 2 Walking Ballista Snapshot Sync

on:
  push:
    branches:
      - manual-transmission/phase2-cedh
    paths:
      - .github/workflows/manual-transmission-walking-ballista-snapshot.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: manual-transmission/phase2-cedh
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Regenerate AER snapshot canonically
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true
      - name: Fail closed on unrelated snapshot drift
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "mtg-sets/src/test/resources/snapshots/cards/AER.json"
          git diff --check
      - name: Commit exact generated AER bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtg-sets/src/test/resources/snapshots/cards/AER.json
          git commit -m "Synchronize Walking Ballista snapshot"
          git push origin HEAD:manual-transmission/phase2-cedh

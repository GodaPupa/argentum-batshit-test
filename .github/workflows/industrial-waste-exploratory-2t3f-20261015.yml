name: Industrial Waste 2T3F — Nonofficial Engine Smoke 2026-10-15

on:
  push:
    branches:
      - exploratory/iw-2t3f-engine-20261015
    paths:
      - .github/workflows/industrial-waste-exploratory-2t3f-20261015.yml
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteExploratory2T3F20261015Test.kt
      - exploratory/industrial-waste-2t3f-20261015/PROTOCOL.md
      - exploratory/industrial-waste-2t3f-20261015/challenger-2t3f.dck

permissions:
  contents: read

concurrency:
  group: iw-nonofficial-2t3f-20261015
  cancel-in-progress: false

jobs:
  excluded-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IW_EXPLORATORY_2T3F: "true"
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v6
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v6
      - name: Recheck frozen control and prospective challenger bytes
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "CONTROLLING_BRANCH=exploratory/iw-2t3f-engine-20261015"
          echo "OFFICIAL_R1_ADMISSION=false"
          echo "R1_CORPUS_ROWS_LOADED=0"
          python3 - <<'PY'
          import hashlib, pathlib
          cases = {
              "industrial-waste/control/industrial-waste-v1.0-submitted.dck":
                  "9b8a2932d78c99dd13f5c4834066bfa644f065137ee90efa75f3418ab56d1f1a",
              "exploratory/industrial-waste-2t3f-20261015/challenger-2t3f.dck":
                  "8152ab16a703aa070d9ee4e9a989bccaf3f449efed420ea8a277f39a00d307c4",
          }
          for name, expected in cases.items():
              observed = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(f"Frozen candidate mismatch: {name}: {observed}")
              print(name, observed)
          PY
      - name: Run exactly one bounded first-attempt synthetic full-horizon grid
        shell: bash
        timeout-minutes: 38
        run: |
          set -o pipefail
          ./gradlew :ai:test --tests '*IndustrialWasteExploratory2T3F20261015Test' \
            --rerun-tasks --no-build-cache --no-daemon 2>&1 | tee /tmp/iw-2t3f-smoke.log
      - name: Preserve original raw traces and test outcome even if validation fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-2t3f-nonofficial-first-attempt
          path: |
            exploratory/industrial-waste-2t3f-20261015/runs/
            ai/build/test-results/test/TEST-com.wingedsheep.ai.industrialwaste.IndustrialWasteExploratory2T3F20261015Test.xml
          if-no-files-found: warn
          retention-days: 14

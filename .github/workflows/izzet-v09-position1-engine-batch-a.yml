name: Izzet Position-1 Engine Batch A Boreal Druid

on:
  pull_request:
    paths:
      - "mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/csp/cards/BorealDruid.kt"
      - "gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt"
      - "izzet-science/position1-engine-gap-triage.json"
      - "izzet-science/v09-position1-engine-gap-triage-correction-a.md"
      - "izzet-science/v09-position1-engine-batch-a-gate.md"
      - ".github/workflows/izzet-v09-position1-engine-batch-a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-batch-a:
    if: github.event_name != 'pull_request' || github.head_ref == 'mayhem/izzet-science'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify triage correction and frozen control
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'V09_POSITION1_ENGINE_GAP_TRIAGE_CORRECTION_A' izzet-science/v09-position1-engine-gap-triage-correction-a.md
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
      - name: Run Boreal Druid and coverage tests
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-a.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=54' /tmp/batch-a.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Boreal Druid' /tmp/batch-a.txt
      - name: Assert official execution remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
      - name: Emit Batch A manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/batch-a-artifact
          cp /tmp/batch-a.txt /tmp/batch-a-artifact/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-a-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "implemented=Boreal Druid"
            echo "unresolved_before=55"
            echo "unresolved_after=54"
            echo "experimental_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/csp/cards/BorealDruid.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/position1-engine-gap-triage.json
            sha256sum izzet-science/v09-position1-engine-gap-triage-correction-a.md
            sha256sum /tmp/batch-a-artifact/test-output.txt
          } > /tmp/batch-a-artifact/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-a
          path: /tmp/batch-a-artifact
          if-no-files-found: error

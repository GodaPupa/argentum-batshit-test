name: Izzet v0.9 Phase 28 Public Integration

on:
  pull_request:
    paths:
      - "izzet-science/sim/public_integration.py"
      - "izzet-science/sim/validate_v09_phase28_public_integration.py"
      - "izzet-science/v09-phase28-public-integration-gate.md"
      - "izzet-science/v09-phase27-observed-action-behavior-accepted.md"
      - ".github/workflows/izzet-v09-phase28-public-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-phase28:
    if: github.event_name != 'pull_request' || github.head_ref == 'mayhem/izzet-science'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen identities and parent acceptances
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'V09_PHASE25_ACTION_SURFACES_ACCEPTED' izzet-science/v09-phase25-real-opponent-action-surfaces-accepted.md
          grep -Fq 'V09_PHASE26_PUBLIC_STATE_COMPILER_ACCEPTED' izzet-science/v09-phase26-public-state-action-compiler-accepted.md
          grep -Fq 'V09_PHASE27_OBSERVED_ACTION_BEHAVIOR_ACCEPTED' izzet-science/v09-phase27-observed-action-behavior-accepted.md
      - name: Run Phase 28 seed-free integration qualification
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/izzet-science/sim"
          python izzet-science/sim/validate_v09_phase28_public_integration.py | tee /tmp/phase28.txt
          grep -Fx "V09_PHASE28_PUBLIC_INTEGRATION_VALIDATION_PASS" /tmp/phase28.txt
      - name: Assert no experimental execution surface
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'random\.|secrets\.|SystemRandom|experimental[_ -]?seed|sampled[_ -]?game|hidden[_ -]?hand|future draw'             izzet-science/sim/public_integration.py             izzet-science/sim/validate_v09_phase28_public_integration.py
      - name: Emit qualification manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase28-artifact
          cp /tmp/phase28.txt /tmp/phase28-artifact/validation.txt
          {
            echo "schema=izzet-v09-phase28-public-integration-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "experimental_seeds_consumed=0"
            echo "sampled_games=0"
            echo "outcome_exposure=0"
            sha256sum izzet-science/sim/public_integration.py
            sha256sum izzet-science/sim/validate_v09_phase28_public_integration.py
            sha256sum izzet-science/v09-phase28-public-integration-gate.md
            sha256sum /tmp/phase28-artifact/validation.txt
          } > /tmp/phase28-artifact/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-phase28-public-integration
          path: /tmp/phase28-artifact
          if-no-files-found: error

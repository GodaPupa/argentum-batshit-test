name: Pest Gate 5 Block A Validation Bridge

on:
  push:
    branches: [ "pest-control/gate5-block-a-validation-bridge" ]

permissions:
  contents: read

jobs:
  oracle-assay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Gate 5 source
        uses: actions/checkout@v4
        with:
          ref: c009c4b05a16d13eeabc34db60edcb6af58f040a
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "c009c4b05a16d13eeabc34db60edcb6af58f040a"
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Show validation environment
        run: |
          java -version
          gradle --version
      - name: Run missing Argentum Validation task
        run: ./gradlew :oracle-assay:test --stacktrace

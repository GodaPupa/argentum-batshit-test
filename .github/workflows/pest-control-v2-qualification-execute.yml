name: Pest Control V2 Qualification Execution
run-name: Pest V2 qualification EXECUTE

on:
  workflow_dispatch:
    inputs:
      execution_commit:
        description: Exact green authorization commit (40 lowercase hex characters).
        required: true
        type: string
      execution_tree:
        description: Exact tree of the green authorization commit (40 lowercase hex characters).
        required: true
        type: string
      execution_ack:
        description: Exact one-shot qualification acknowledgement.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: pest-control-v2-qualification-execution
  cancel-in-progress: false

env:
  FREEZE_ARTIFACT_ID: "10612245984"
  FREEZE_ARTIFACT_SHA256: bf7456303c355202587484f208da20a1ca37a2ba326d081e8a3fb7c3a31be8f0

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject replay rerun or unpinned execution
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_COMMIT: ${{ inputs.execution_commit }}
          EXECUTION_TREE: ${{ inputs.execution_tree }}
          EXECUTION_ACK: ${{ inputs.execution_ack }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "${EXECUTION_COMMIT}" != "0000000000000000000000000000000000000000"
          test "${EXECUTION_TREE}" != "0000000000000000000000000000000000000000"
          [[ "${EXECUTION_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXECUTION_TREE}" =~ ^[0-9a-f]{40}$ ]]
          test "${EXECUTION_ACK}" = "EXECUTE_FROZEN_PEST_V2_QUALIFICATION_50_EXACTLY_ONCE"
          prior="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pest-control-v2-qualification-execute.yml/runs?per_page=100" \
            | jq --arg current "${GITHUB_RUN_ID}" \
              '[.workflow_runs[] | select((.id | tostring) != $current)] | length')"
          test "${prior}" = "0"

      - name: Checkout exact green authorization commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.execution_commit }}

      - name: Verify exact commit and tree
        env:
          EXECUTION_COMMIT: ${{ inputs.execution_commit }}
          EXECUTION_TREE: ${{ inputs.execution_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXECUTION_COMMIT}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXECUTION_TREE}"

  shards:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        shard:
          - SHARD_01_OF_02
          - SHARD_02_OF_02
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.execution_commit }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify exact commit and tree
        env:
          EXECUTION_COMMIT: ${{ inputs.execution_commit }}
          EXECUTION_TREE: ${{ inputs.execution_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXECUTION_COMMIT}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXECUTION_TREE}"

      - name: Download exact qualification freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/pest-v2-qualification-input
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FREEZE_ARTIFACT_ID}/zip" \
            -o build/pest-v2-qualification-freeze.zip
          echo "${FREEZE_ARTIFACT_SHA256}  build/pest-v2-qualification-freeze.zip" | sha256sum -c -
          unzip -q build/pest-v2-qualification-freeze.zip -d build/pest-v2-qualification-input
          cd build/pest-v2-qualification-input
          sha256sum -c artifacts.sha256

      - name: Execute exact shard once
        env:
          PEST_V2_QUALIFICATION_RUNNER_MODE: EXECUTE
          PEST_V2_QUALIFICATION_EXECUTION_ACK: ${{ inputs.execution_ack }}
          PEST_V2_QUALIFICATION_SHARD_ID: ${{ matrix.shard }}
          PEST_V2_QUALIFICATION_INPUT_DIR: ${{ github.workspace }}/build/pest-v2-qualification-input
          PEST_V2_QUALIFICATION_OUTPUT_DIR: ${{ github.workspace }}/build/reports/pest-v2-qualification/${{ matrix.shard }}
          PEST_V2_QUALIFICATION_HARNESS_COMMIT: ${{ inputs.execution_commit }}
          PEST_V2_QUALIFICATION_HARNESS_TREE: ${{ inputs.execution_tree }}
        run: scripts/test-class PestControlV2QualificationShardRunnerTest --info --stacktrace

      - name: Upload exact shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-v2-qualification-${{ matrix.shard }}
          path: build/reports/pest-v2-qualification/${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 90

  reconcile:
    if: always() && needs.authorize.result == 'success'
    needs: [authorize, shards]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.execution_commit }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify exact commit and tree
        env:
          EXECUTION_COMMIT: ${{ inputs.execution_commit }}
          EXECUTION_TREE: ${{ inputs.execution_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXECUTION_COMMIT}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${EXECUTION_TREE}"

      - name: Download exact qualification freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/pest-v2-qualification-input
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FREEZE_ARTIFACT_ID}/zip" \
            -o build/pest-v2-qualification-freeze.zip
          echo "${FREEZE_ARTIFACT_SHA256}  build/pest-v2-qualification-freeze.zip" | sha256sum -c -
          unzip -q build/pest-v2-qualification-freeze.zip -d build/pest-v2-qualification-input
          cd build/pest-v2-qualification-input
          sha256sum -c artifacts.sha256

      - name: Download shard one if present
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pest-v2-qualification-SHARD_01_OF_02
          path: build/pest-v2-qualification-shards/SHARD_01_OF_02

      - name: Download shard two if present
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pest-v2-qualification-SHARD_02_OF_02
          path: build/pest-v2-qualification-shards/SHARD_02_OF_02

      - name: Reconcile the complete logical vector
        env:
          PEST_V2_QUALIFICATION_RECONCILE: "true"
          PEST_V2_QUALIFICATION_INPUT_DIR: ${{ github.workspace }}/build/pest-v2-qualification-input
          PEST_V2_QUALIFICATION_SHARDS_DIR: ${{ github.workspace }}/build/pest-v2-qualification-shards
          PEST_V2_QUALIFICATION_OUTPUT_DIR: ${{ github.workspace }}/build/reports/pest-v2-qualification-aggregate
          PEST_V2_QUALIFICATION_HARNESS_COMMIT: ${{ inputs.execution_commit }}
          PEST_V2_QUALIFICATION_HARNESS_TREE: ${{ inputs.execution_tree }}
        run: scripts/test-class PestControlV2QualificationReconcilerTest --info --stacktrace

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-v2-qualification-aggregate
          path: build/reports/pest-v2-qualification-aggregate/
          if-no-files-found: error
          retention-days: 90

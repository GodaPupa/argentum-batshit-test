name: Industrial Waste — Burn Production Replication

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  burn-production-replication:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up just
        uses: extractions/setup-just@v3
      - name: Validate frozen inputs
        run: |
          python3 -m unittest discover -s industrial-waste/sim -p 'test_*.py' -v
          python3 industrial-waste/sim/validate_inputs.py
          test "$(sha256sum industrial-waste/results/gate-4-madness-burn-production-screen-v1.json | cut -d' ' -f1)" = \
            "63243fefeae4e49e20751176e635f82bd7bf4eb2604b050cb29ba98b5c6e2134"
      - name: Run fresh production-profile Burn replication
        run: scripts/gradle-locked :ai:test --tests "*.IndustrialWasteMatchupPilotBenchmark"
        env:
          IW_MATCHUP_PRODUCTION_REPLICATION: "true"
          IW_MATCHUP_SHARD_COUNT: "8"
          IW_MATCHUP_SHARD_INDEX: ${{ matrix.shard }}
      - name: Upload fresh replication partition
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-madness-burn-production-replication-shard-${{ matrix.shard }}
          path: industrial-waste/results/gate-4-madness-burn-production-replication-v1-shard-*-of-8.json
          if-no-files-found: error

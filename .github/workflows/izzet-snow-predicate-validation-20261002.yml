name: Izzet generalized Snow predicate validation
on:
  push:
    branches: ["validation/izzet-snow-predicate-validation-20261002"]
    paths: [".github/workflows/izzet-snow-predicate-validation-20261002.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OUT: /tmp/izzet-snow-predicate-${{ github.run_id }}
      GRADLE_USER_HOME: /tmp/izzet-snow-predicate-gradle-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind exact Snow predicate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$OUT"
          test "$(git rev-parse HEAD^)" = "f8d6d43fac0921cfdcfabed882592bda1f164c2d"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/izzet-snow-predicate-validation-20261002.yml"
          test "$(git rev-parse HEAD^^)" = "0c9bc48c56162ba2e3c4e6600db370f4fe7de2cb"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/predicates/CardPredicate.kt)" = "e6be2f4841f943d923002a7ec501f534a6f58e1a"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/PredicateEvaluator.kt)" = "12d8aa6c5a9bd8ba2ba58685ced8536f11fe59ae"
          test "$(git hash-object rules-engine/src/test/kotlin/com/wingedsheep/engine/handlers/SnowCardPredicateTest.kt)" = "fdbcf14ab6fb820c3f66bdf158b6277ff823675d"
          git rev-parse HEAD HEAD^{tree} HEAD^ HEAD^^ > "$OUT/source.txt"
          printf '%s\n' 'BOUNDED_SHARED_PREDICATE_AUTHOR_VALIDATION_ONLY_NO_CARD_ADMISSION_NO_GAMEPLAY_AUTHORITY' > "$OUT/authority.txt"
      - name: Compile shared SDK and rules-engine tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sdk:compileTestKotlin :rules-engine:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
      - name: Run exact Snow predicate tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :rules-engine:test --tests com.wingedsheep.engine.handlers.SnowCardPredicateTest \
            2>&1 | tee "$OUT/snow.log"
          cp rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.handlers.SnowCardPredicateTest.xml "$OUT/"
      - name: Run unchanged predicate regressions
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :rules-engine:test --tests com.wingedsheep.engine.handlers.ChosenCardTypePredicateTest \
            2>&1 | tee "$OUT/predicate-regressions.log"
          cp rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.handlers.ChosenCardTypePredicateTest.xml "$OUT/"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-snow-predicate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

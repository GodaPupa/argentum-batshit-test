name: Temporary Lilysplash Snapshot Update

on:
  push:
    branches:
      - lilysplash/lab
    paths:
      - .github/workflows/lilysplash-snapshot-update.yml

permissions:
  contents: write

jobs:
  update-snapshots:
    if: github.event.head_commit.message == 'Run temporary Lilysplash snapshot update'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: lilysplash/lab
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate card snapshots
        run: |
          chmod +x gradlew scripts/gradle-locked
          scripts/gradle-locked :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true
      - name: Verify exact snapshot scope
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "mtg-sets/src/test/resources/snapshots/cards/10E.json"
            "mtg-sets/src/test/resources/snapshots/cards/AKH.json"
            "mtg-sets/src/test/resources/snapshots/cards/CMR.json"
            "mtg-sets/src/test/resources/snapshots/cards/DTK.json"
            "mtg-sets/src/test/resources/snapshots/cards/ICE.json"
            "mtg-sets/src/test/resources/snapshots/cards/J22.json"
            "mtg-sets/src/test/resources/snapshots/cards/LEA.json"
            "mtg-sets/src/test/resources/snapshots/cards/LEB.json"
            "mtg-sets/src/test/resources/snapshots/cards/M19.json"
            "mtg-sets/src/test/resources/snapshots/cards/M20.json"
            "mtg-sets/src/test/resources/snapshots/cards/NEO.json"
            "mtg-sets/src/test/resources/snapshots/cards/STH.json"
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected snapshot scope:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
      - name: Commit exact snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mtg-sets/src/test/resources/snapshots/cards/10E.json \
            mtg-sets/src/test/resources/snapshots/cards/AKH.json \
            mtg-sets/src/test/resources/snapshots/cards/CMR.json \
            mtg-sets/src/test/resources/snapshots/cards/DTK.json \
            mtg-sets/src/test/resources/snapshots/cards/ICE.json \
            mtg-sets/src/test/resources/snapshots/cards/J22.json \
            mtg-sets/src/test/resources/snapshots/cards/LEA.json \
            mtg-sets/src/test/resources/snapshots/cards/LEB.json \
            mtg-sets/src/test/resources/snapshots/cards/M19.json \
            mtg-sets/src/test/resources/snapshots/cards/M20.json \
            mtg-sets/src/test/resources/snapshots/cards/NEO.json \
            mtg-sets/src/test/resources/snapshots/cards/STH.json
          git commit -m "Update Lilysplash land-aura batch snapshots"
          git push origin HEAD:lilysplash/lab

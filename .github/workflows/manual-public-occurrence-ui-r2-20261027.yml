name: Manual actual public occurrence UI R2
on:
  push:
    branches: [validation/manual-public-occurrence-ui-r2-20261027]
    paths: ['.github/workflows/manual-public-occurrence-ui-r2-20261027.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 4a0cd58c09dd59ff9f3b34a311e989d3aeb7902b
  SOURCE_TREE: 935d1cd73b1a54b0b9d8ad00c7cc464b9fc2a478
  WORKFLOW: .github/workflows/manual-public-occurrence-ui-r2-20261027.yml
  RECORD: experiments/manual-transmission/research/public-occurrence-ui-r2-20261027
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile normal and mutants before real browser qualification
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-public-occurrence-ui-r2-${{ github.run_id }}
          path: manual-public-occurrence-ui-r2-evidence/
          include-hidden-files: true
          if-no-files-found: error

name: Izzet Position-1 recursion card batch
on:
  push:
    branches: ["izzet/position1-recursion-batch-20260928"]
    paths: [".github/workflows/izzet-position1-recursion-batch.yml"]
permissions: {contents: read}
jobs:
  four-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact source fixture budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/izzet-position1-recursion-batch
          test "$(git rev-parse HEAD^)" = "0054a78e3fde10ab7ef26a03a70d2a1f163dc546"
          test "$(git hash-object experiments/izzet-science/position1-recursion-batch-budget-20260928.json)" = "b4ba919bb333dc9532caca126fdbc4d6c8069f8e"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m13/cards/Archaeomancer.kt)" = "cc5b2951943c875982036f9b7506072ea65d9db6"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/roe/cards/MnemonicWall.kt)" = "dcfca24f1918f79092b7f3274ee454614d15d03e"
          test "$(git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/IzzetPosition1RecursionBatchScenarioTest.kt)" = "e54b924543b5ec8098ca322896d8ef15f3435352"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object experiments/izzet-science/position1-recursion-batch-budget-20260928.json
            git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m13/cards/Archaeomancer.kt
            git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/roe/cards/MnemonicWall.kt
            git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/IzzetPosition1RecursionBatchScenarioTest.kt
            git hash-object .github/workflows/izzet-position1-recursion-batch.yml
            git status --porcelain
          } > build/reports/izzet-position1-recursion-batch/source.txt
      - name: Run fresh real-engine recursion batch
        shell: bash
        run: |
          set -o pipefail
          just test-class IzzetPosition1RecursionBatchScenarioTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-position1-recursion-batch/test.log
      - name: Preserve XML
        if: always()
        shell: bash
        run: |
          find . -path '*/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.IzzetPosition1RecursionBatchScenarioTest.xml' -type f -print -exec cp {} build/reports/izzet-position1-recursion-batch/ \; || true
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-position1-recursion-batch-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-position1-recursion-batch/
          if-no-files-found: error
          retention-days: 90

name: Industrial Waste — Gate 9 Monster Tron Policy Audit

on:
  pull_request:
    branches: [industrial-waste/lab]
    paths:
      - .github/workflows/industrial-waste-g9-monster-tron-policy-audit.yml
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/MonsterTronAdvisorModule.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteMonsterTronPolicyAuditTest.kt
      - mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ulg/cards/CropRotation.kt
      - mtg-sets/2024/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/mh3/cards/NyxbornHydra.kt
      - mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ogw/cards/PulseOfMurasa.kt
      - mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/wwk/cards/BojukaBog.kt
      - mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c20/cards/BondersOrnament.kt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monster-tron-policy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Gate 9 seed-free Monster Tron policy fixtures
        run: ./gradlew :ai:test --tests IndustrialWasteMonsterTronPolicyAuditTest -Dbenchmark=true --no-daemon
      - name: Print focused failure details
        if: failure()
        run: |
          find ai/build/test-results/test -name 'TEST-*IndustrialWasteMonsterTronPolicyAuditTest*.xml' -exec sed -n '1,900p' {} \; || true

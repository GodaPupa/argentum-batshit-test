name: Face Value Freeze Elves E3 Discovery Vector

on:
  push:
    branches: [face-value/lab]
    paths:
      - .github/workflows/face-value-freeze-elves-e3-discovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: face-value/lab
          fetch-depth: 0
      - name: Generate fresh cryptographic discovery vector
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,secrets,subprocess
          root=pathlib.Path('experiments/face-value/qualification')
          out=root/'elves-e3-discovery-seed-registry.json'
          corpus='\n'.join(pathlib.Path(fp).read_text(encoding='utf-8',errors='ignore')
                           for fp in subprocess.check_output(['git','ls-files'],text=True).splitlines()
                           if pathlib.Path(fp).is_file())
          seeds=[]
          while len(seeds)<32:
              s=secrets.randbelow(2**63-1)+1
              if s in seeds or str(s) in corpus: continue
              seeds.append(s)
          rows=[{'run_index':i,'round':(i+1)//2,'face_value_seat':1 if i%2 else 2,
                 'matchup':'elves','opponent_file':'opponents/elves-mogged-2026-09-19.dck','seed':s}
                for i,s in enumerate(seeds,1)]
          doc={
            'classification':'DISCOVERY_ELVES_SIDEBOARD_E3',
            'challenger_file':'challengers/face-value-elves-sideboard-e3.dck',
            'authority':{
              'control_postboard':'13-19',
              'e1_discovery':'13-19',
              'e2_discovery':'11-21',
              'e3_protocol_commit':'8c9ac63b50427308e55b8f951eeaf3725923889e',
              'peace_capability_run':35640288402,
              'peace_capability_result':'8/8 terminal; 64 casts; 32 flashback markers; 0 flags'
            },
            'design':{'games':32,'games_per_seat':16,'outcomes_exposed_before_freeze':0,
                      'discovery_only':True,'promotion_authority':False},
            'generation':{'source':'python secrets.randbelow backed by operating-system CSPRNG',
                          'workflow_run_id':os.environ['RUN_ID']},
            'assignments':rows
          }
          out.write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n')
          assert len(seeds)==len(set(seeds))==32
          assert sum(r['face_value_seat']==1 for r in rows)==16
          assert sum(r['face_value_seat']==2 for r in rows)==16
          print('ELVES_E3_DISCOVERY_VECTOR_GREEN')
          PY
          cd experiments/face-value/qualification
          sha256sum elves-e3-discovery-seed-registry.json > elves-e3-discovery-seed-registry.sha256
          sha256sum -c elves-e3-discovery-seed-registry.sha256
      - name: Commit frozen discovery vector
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/face-value/qualification/elves-e3-discovery-seed-registry.json \
                  experiments/face-value/qualification/elves-e3-discovery-seed-registry.sha256
          git commit -m 'face-value: freeze Elves E3 discovery vector'
          git fetch origin face-value/lab
          git rebase origin/face-value/lab
          git push origin HEAD:face-value/lab

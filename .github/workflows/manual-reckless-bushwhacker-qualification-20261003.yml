name: Manual exact Reckless Bushwhacker qualification
on:
  push:
    branches: [validation/manual-reckless-bushwhacker-20261003]
    paths: [.github/workflows/manual-reckless-bushwhacker-qualification-20261003.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: manual-reckless-bushwhacker-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/manual-reckless-bushwhacker-${{ github.run_id }}
      MT_P2_AUDIT_INPUT: /tmp/manual-reckless-bushwhacker-${{ github.run_id }}/registry-requests.json
      MT_P2_AUDIT_OUTPUT: /tmp/manual-reckless-bushwhacker-${{ github.run_id }}/registry
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v6

      - name: Bind exact source-only candidate and frozen registry contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git fetch --no-tags --deepen=8 origin "$GITHUB_REF_NAME"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['OUT'])
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          source='2c6d640b6e28cdf4d9f34a06b75ba4e9c05a0c70'
          parent='d79462d20b147ad34f8a3dbbeb9981676d03e3ec'
          workflow='.github/workflows/manual-reckless-bushwhacker-qualification-20261003.yml'
          expected={
            'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/ConditionEvaluator.kt':'54be95600dcd353bc4e7f74b7d4b385beb3b8457',
            'mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/conditions/TeamCastConditions.kt':'48f5078b48358e8607a0b79ff70436e39f69ba93',
            'mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ogw/cards/RecklessBushwhacker.kt':'17dbcb43aa21e1330c6ede8bfeb0a9fd890fcb40',
            'mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/RecklessBushwhackerScenarioTest.kt':'a6b5da9b822e4c59f84f000bc9cab780d644e368'}
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==source
          assert git('merge-base',parent,source)==parent
          assert git('rev-list','--count',parent+'..'+source)=='4'
          assert git('rev-parse',source+'^{tree}')=='e572a207dd1d76d702f4fd22237738e5905ddf1b'
          assert git('diff','--name-only',source,'HEAD').splitlines()==[workflow]
          assert git('diff','--name-only',parent,source).splitlines()==sorted(expected)
          assert not git('status','--porcelain')
          for p,blob in expected.items():
            assert git('hash-object',p)==blob,(p,git('hash-object',p),blob)
          binding={
            'source_head':source,'source_tree':git('rev-parse',source+'^{tree}'),'parent_live':parent,
            'validation_head':git('rev-parse','HEAD'),'validation_tree':git('rev-parse','HEAD^{tree}'),
            'source_blobs':expected,'prior_provenance_run':37151070713,
            'prior_provenance_artifact':11283534356,
            'prior_provenance_artifact_sha256':'1545d503a9d0f0a4d2c09ebb9090d6d4f327966313d6b72aad9a543c6feb894a',
            'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
          (out/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          PY
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/GodaPupa/argentum-batshit-test/actions/artifacts/11283534356/zip" \
            -o "$OUT/prior-green.zip"
          unzip -p "$OUT/prior-green.zip" registry-requests.json > "$MT_P2_AUDIT_INPUT"
          test "$(sha256sum "$MT_P2_AUDIT_INPUT" | awk '{print $1}')" = "09b8617057b9bd42fb6501f993588c9bf769e1f0af0c73426ca963da07d20084"

      - name: Run exact Reckless Bushwhacker cases and unchanged registry audit
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --console=plain --continue --max-workers=1 \
            -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g \
            :mtg-sets:2008-2016:tests:test --tests com.wingedsheep.engine.scenarios.RecklessBushwhackerScenarioTest \
            :gym:test --tests com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest \
            2>&1 | tee "$OUT/qualification.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
          exit "$rc"

      - name: Audit actual cases and exact registry delta
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['OUT']); out.mkdir(parents=True,exist_ok=True)
          expected={
            'mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.RecklessBushwhackerScenarioTest.xml':9,
            'gym/build/test-results/test/TEST-com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest.xml':1}
          rows=[]
          for p,count in expected.items():
            path=pathlib.Path(p)
            row={'path':p,'expected':count,'missing':not path.exists(),'cases':[]}
            if path.exists():
              shutil.copyfile(path,out/path.name)
              suite=ET.parse(path).getroot()
              row['sha256']=hashlib.sha256(path.read_bytes()).hexdigest()
              row['cases']=[{'name':c.attrib['name'],'failure':c.find('failure') is not None,
                'error':c.find('error') is not None,'skipped':c.find('skipped') is not None}
                for c in suite.findall('testcase')]
            rows.append(row)
          (out/'actual-cases.json').write_text(json.dumps(rows,indent=2)+'\n')
          assert all(not r['missing'] for r in rows),rows
          assert all(len(r['cases'])==r['expected'] for r in rows),rows
          assert all(len({c['name'] for c in r['cases']})==r['expected'] for r in rows),rows
          assert not any(c['failure'] or c['error'] or c['skipped'] for r in rows for c in r['cases']),rows
          assert (out/'gradle-exit-code.txt').read_text().strip()=='0'

          report_path=out/'registry/registry-report.json'
          report=json.loads(report_path.read_text())
          assert report['schema']=='mt-phase2-live-registry-audit-v1'
          assert report['status']=='INVENTORY_ONLY_NOT_RULES_OR_PILOT_QUALIFICATION'
          assert report['execution_allowed'] is False
          assert report['actual_deck_games_initialized']==0 and report['official_outcomes']==0
          assert len(report['decks'])==8
          summary={}
          for deck in report['decks']:
            assert deck['physical_cards']==len(deck['cards'])==100
            assert all(c['rules_qualified'] is False for c in deck['cards'])
            missing=[c['requested_name'] for c in deck['cards'] if not c['registry_resolved']]
            summary[deck['deck_id']]={'resolved':100-len(missing),'missing':missing}
          expected_resolved={
            'manual-transmission-v07':98,'blue-farm':62,'rogsi':59,'kinnan':61,
            'sisay':60,'magda':50,'hashaton':49,'shorikai':56}
          assert {k:v['resolved'] for k,v in summary.items()}==expected_resolved,summary
          own=summary['manual-transmission-v07']
          assert own['missing']==['Amphin Mutineer','Disciple of Freyalise'],own
          assert sum(len(v['missing']) for v in summary.values())==305,summary
          reckless=[(d['deck_id'],c['index']) for d in report['decks'] for c in d['cards']
                    if c['requested_name']=='Reckless Bushwhacker']
          assert reckless==[('manual-transmission-v07',28)],reckless
          (out/'registry-summary.json').write_text(json.dumps({
            'decks':summary,'prior_manual_resolved':97,'current_manual_resolved':98,
            'exact_new_identity':'Reckless Bushwhacker','exact_new_position':['manual-transmission-v07',28],
            'prior_total_unresolved':306,'current_total_unresolved':305,
            'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}
          },indent=2)+'\n')
          PY

      - name: Digest evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
          (out/'evidence-sha256.json').write_text(json.dumps({
            str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest()
            for p in sorted(out.rglob('*')) if p.is_file() and p.name not in {'evidence-sha256.json','prior-green.zip'}
          },indent=2)+'\n')
          PY

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-reckless-bushwhacker-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

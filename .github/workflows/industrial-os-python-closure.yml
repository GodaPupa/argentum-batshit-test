name: Industrial seed-free OS Python closure
on:
  push:
    branches: ["industrial-waste/r1-manifest-capture-20260928"]
    paths: [".github/workflows/industrial-os-python-closure.yml"]
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact closure capture budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/industrial-os-python-closure
          test "$(git rev-parse HEAD^)" = "95b5b4541928f61e1fe14460ff0fad3f7c51752f"
          test "$(git hash-object industrial-waste/v2/capture_seed_free_os_python_closure.py)" = "556fb2fa493d16baddb9cdc61ef5e444584ddc9a"
          test "$(git hash-object industrial-waste/v2/r1-seed-free-os-python-closure-budget.json)" = "0b0e58d465257661ffb0580d01f38f9c45054fe8"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object industrial-waste/v2/capture_seed_free_os_python_closure.py; git hash-object industrial-waste/v2/r1-seed-free-os-python-closure-budget.json; git hash-object .github/workflows/industrial-os-python-closure.yml; git status --porcelain; } > build/reports/industrial-os-python-closure/source.txt
      - name: Capture seed-free OS and Python closure
        shell: bash
        run: |
          set -o pipefail
          python3 industrial-waste/v2/capture_seed_free_os_python_closure.py 2>&1 | tee build/reports/industrial-os-python-closure/capture.json
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-os-python-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/industrial-os-python-closure/
          if-no-files-found: error
          retention-days: 90

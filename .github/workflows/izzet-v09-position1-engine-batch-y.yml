name: Izzet Position-1 Engine Batch Y

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-y.yml"

permissions:
  contents: read

jobs:
  qualify-batch-y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch Y gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'V07_DECK_AUDIT_NO_CHANGE' izzet-science/v07-deck-level-audit-no-change.md
          grep -Fq 'V09_CARD_CONTROL_ARCHITECTURE_AUDIT_KEEP_V07' izzet-science/v09-card-control-architecture-audit.md
          grep -Fq 'Expected post-implementation unresolved count is exactly 28' izzet-science/v09-position1-engine-batch-y-gate.md
          grep -Fq '35959445056' izzet-science/v09-position1-engine-batch-y-gate.md
          grep -Fq '374bf6c342f5263d86aeb98a5e1b11d0f71269ea' izzet-science/v09-position1-engine-batch-y-gate.md

      - name: Requalify canonical card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --stacktrace

      - name: Run Destroy Evil semantics
        run: scripts/test-class DestroyEvilScenarioTest --info --stacktrace

      - name: Recheck modal and enchantment-destruction rails
        run: |
          scripts/test-class ModalCastTimeModeTest --info --stacktrace
          scripts/test-class NaturalizeTest --info --stacktrace

      - name: Run exact real-engine coverage regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-y.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=28' /tmp/batch-y.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Destroy Evil' /tmp/batch-y.txt
          ! grep -Fq 'V09_REAL_ENGINE_UNRESOLVED=unresolved Izzet card:' /tmp/batch-y.txt

      - name: Assert official experiment remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt

      - name: Emit Batch Y manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izzet-batch-y
          cp /tmp/batch-y.txt /tmp/izzet-batch-y/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-y-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "frozen_control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "implemented=Destroy Evil;existing modal targeting+toughness filter+enchantment target+destruction rails"
            echo "snapshot_run=35959445056"
            echo "snapshot_commit=374bf6c342f5263d86aeb98a5e1b11d0f71269ea"
            echo "unresolved_before=29"
            echo "unresolved_after=28"
            echo "unresolved_izzet_after=0"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/dmu/cards/DestroyEvil.kt
            sha256sum mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/DestroyEvilScenarioTest.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/v09-position1-engine-batch-y-gate.md
            sha256sum mtg-sets/src/test/resources/snapshots/cards/DMU.json
            sha256sum /tmp/izzet-batch-y/test-output.txt
          } > /tmp/izzet-batch-y/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-y
          path: /tmp/izzet-batch-y
          if-no-files-found: error

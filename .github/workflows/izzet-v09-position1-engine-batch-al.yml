name: Izzet Position-1 Engine Batch AL

on:
  push:
    branches: ["mayhem/izzet-science"]
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-al.yml"
      - "mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/tsp/cards/TemporalIsolation.kt"
      - "mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/clb/cards/GuardianNaga.kt"
      - "mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/emn/cards/UlvenwaldCaptive.kt"
      - "mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/TemporalIsolationScenarioTest.kt"
      - "mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/GuardianNagaScenarioTest.kt"
      - "mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/UlvenwaldCaptiveScenarioTest.kt"

permissions:
  contents: write

concurrency:
  group: izzet-position1-batch-al
  cancel-in-progress: false

jobs:
  qualify-batch-al:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen identities and preceding acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          test "$(sha256sum izzet-science/opponents/veteran-beastrider-commander-clash-2025.txt | cut -d' ' -f1)" = "c3ab6ee8e37a78219e7bbb7c6a75c634d78c1eb4965ab0db3abd5d853398b0be"
          grep -Fq 'Batch AK is accepted' izzet-science/v09-position1-engine-batch-ak-gate.md
          grep -Fq 'V07_DECK_AUDIT_NO_CHANGE' izzet-science/v07-deck-level-audit-no-change.md
          grep -Fq 'V09_CARD_CONTROL_ARCHITECTURE_AUDIT_KEEP_V07' izzet-science/v09-card-control-architecture-audit.md
          grep -Fq 'Expected post-implementation unresolved count is exactly **11**' izzet-science/v09-position1-engine-batch-al-gate.md
          mkdir -p /tmp/izzet-batch-al

      - name: Qualify exact registry aliases and the three individual card behaviors
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class "CardRegistry*Test" --info --stacktrace | tee /tmp/izzet-batch-al/registry-aliases.txt
          scripts/test-class TemporalIsolationScenarioTest --info --stacktrace | tee /tmp/izzet-batch-al/temporal.txt
          scripts/test-class GuardianNagaScenarioTest --info --stacktrace | tee /tmp/izzet-batch-al/guardian.txt
          scripts/test-class UlvenwaldCaptiveScenarioTest --info --stacktrace | tee /tmp/izzet-batch-al/ulvenwald.txt

      - name: Verify exact real-engine registry coverage
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/izzet-batch-al/readiness.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=11' /tmp/izzet-batch-al/readiness.txt
          ! grep -Fq 'unresolved Izzet card:' /tmp/izzet-batch-al/readiness.txt
          ! grep -Eq 'unresolved Veteran Beastrider card: (Temporal Isolation|Guardian Naga|Ulvenwald Captive)' /tmp/izzet-batch-al/readiness.txt

      - name: Regenerate canonical snapshots and reject unrelated changes
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true --stacktrace | tee /tmp/izzet-batch-al/snapshot-generation.txt
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          expected = {'TSP': 'Temporal Isolation', 'CLB': 'Guardian Naga', 'EMN': 'Ulvenwald Captive'}
          paths = {f'mtg-sets/src/test/resources/snapshots/cards/{code}.json' for code in expected}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed |= set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert changed == paths, (changed, paths)
          def records(text):
              chunks = re.split(r'^// ([^\n]+)\n', text, flags=re.M)
              assert not chunks[0].strip(), 'unexpected snapshot preamble'
              result = {}
              for i in range(1, len(chunks), 2):
                  assert chunks[i] not in result, 'duplicate card in snapshot'
                  result[chunks[i]] = json.loads(chunks[i + 1])
              return result
          for code, name in expected.items():
              path = f'mtg-sets/src/test/resources/snapshots/cards/{code}.json'
              prior = subprocess.run(['git', 'show', 'HEAD:' + path], text=True, capture_output=True)
              assert prior.returncode == 0, 'missing existing snapshot'
              before = records(prior.stdout)
              after = records(pathlib.Path(path).read_text())
              assert set(after) == set(before) | {name}
              assert name not in before
              for old_name, old_card in before.items():
                  assert after[old_name] == old_card, 'unrelated card changed: ' + old_name
          print('BATCH_AL_ONLY_THREE_EXPECTED_CARD_ADDITIONS_PASS')
          PY
          git diff --check

      - name: Requalify all canonical snapshots with updating disabled
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:cleanTest :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=false --stacktrace | tee /tmp/izzet-batch-al/snapshot-verification.txt

      - name: Verify untouched official execution and integrate exact snapshots
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtg-sets/src/test/resources/snapshots/cards/{TSP,CLB,EMN}.json
          git commit -m "Qualify three-card Izzet coverage batch AL snapshots"
          git fetch origin mayhem/izzet-science
          test "$(git rev-parse origin/mayhem/izzet-science)" = "${GITHUB_SHA}"
          git push origin HEAD:mayhem/izzet-science

      - name: Emit complete batch provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "schema=izzet-v09-position1-engine-batch-al-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "snapshot_commit=$(git rev-parse HEAD)"
            echo "snapshot_tree=$(git rev-parse HEAD^{tree})"
            echo "implemented=Temporal Isolation;Guardian Naga;Ulvenwald Captive"
            echo "unresolved_before=14"
            echo "unresolved_after=11"
            echo "unresolved_izzet_after=0"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum izzet-science/v0.7-control.md izzet-science/opponents/veteran-beastrider-commander-clash-2025.txt
            sha256sum izzet-science/v09-position1-engine-batch-al-gate.md .github/workflows/izzet-v09-position1-engine-batch-al.yml
            sha256sum mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/tsp/cards/TemporalIsolation.kt
            sha256sum mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/clb/cards/GuardianNaga.kt
            sha256sum mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/emn/cards/UlvenwaldCaptive.kt
            sha256sum mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/TemporalIsolationScenarioTest.kt mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/GuardianNagaScenarioTest.kt
            sha256sum mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/UlvenwaldCaptiveScenarioTest.kt
            sha256sum rules-engine/src/main/kotlin/com/wingedsheep/engine/registry/CardRegistry.kt rules-engine/src/test/kotlin/com/wingedsheep/engine/registry/CardRegistryCombinedNameTest.kt rules-engine/src/test/kotlin/com/wingedsheep/engine/registry/CardRegistryTest.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum mtg-sets/src/test/resources/snapshots/cards/{TSP,CLB,EMN}.json
            sha256sum /tmp/izzet-batch-al/{registry-aliases,temporal,guardian,ulvenwald,readiness,snapshot-generation,snapshot-verification}.txt
          } > /tmp/izzet-batch-al/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-al
          path: /tmp/izzet-batch-al
          if-no-files-found: error

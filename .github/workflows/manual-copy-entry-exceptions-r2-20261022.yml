name: Manual recovered copy-entry exception carrier qualification
on:
  push:
    branches: [validation/manual-copy-entry-exceptions-r2-20261022]
    paths: ['.github/workflows/manual-copy-entry-exceptions-r2-20261022.yml']
permissions: {contents: read}
concurrency:
  group: manual-copy-entry-exceptions-r2-20261022
  cancel-in-progress: false
env:
  SOURCE: 31e1267ef8f0398bd74f1ed1fcaa3c609113e5ce
  RECORD: experiments/manual-transmission/research/copy-entry-exceptions-r2-20261022
  GRADLE_OPTS: -Dorg.gradle.daemon=false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 4}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the repository recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          just --version
      - name: Bind source, original assertions, workflow locks, deck and goldens
        run: python3 "$RECORD/bind.py"
      - name: Unchanged donor10, SDK2, snapshots and lint
        id: targeted
        run: |
          mkdir -p copy-entry-evidence/targeted
          set +e
          just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" targeted 2>&1 | tee copy-entry-evidence/targeted/gradle.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > copy-entry-evidence/targeted/exit.txt
          exit "$rc"
      - name: Receive targeted XML before the ordinary build
        if: always() && steps.targeted.outcome != 'skipped'
        env: {STAGE: targeted}
        run: python3 "$RECORD/collect.py"
      - name: Ordinary whole-project build with routine AI tests
        id: ordinary
        run: |
          mkdir -p copy-entry-evidence/ordinary
          set +e
          just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" ordinary 2>&1 | tee copy-entry-evidence/ordinary/gradle.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > copy-entry-evidence/ordinary/exit.txt
          exit "$rc"
      - name: Receive every ordinary result and list all skips
        if: always() && steps.ordinary.outcome != 'skipped'
        env: {STAGE: ordinary}
        run: python3 "$RECORD/collect.py"
      - name: Build the Assay CLI against the recovered SDK
        run: |
          mkdir -p copy-entry-evidence/assay
          set +e
          just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" assay-build 2>&1 | tee copy-entry-evidence/assay/build.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > copy-entry-evidence/assay/build-exit.txt
          exit "$rc"
      - name: Verify 2000-card Assay touchstone and preserve corpus identity
        run: |
          set +e
          just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" assay 2>&1 | tee copy-entry-evidence/assay/gate.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > copy-entry-evidence/assay/gate-exit.txt
          if test -f "$HOME/.cache/scryfall/_bulk-oracle-cards.jsonl.gz"; then
            sha256sum "$HOME/.cache/scryfall/_bulk-oracle-cards.jsonl.gz" > copy-entry-evidence/assay/oracle-bulk-sha256.txt
            wc -c "$HOME/.cache/scryfall/_bulk-oracle-cards.jsonl.gz" > copy-entry-evidence/assay/oracle-bulk-bytes.txt
          fi
          exit "$rc"
      - name: Recheck unchanged source and safeguards after execution
        if: always()
        run: python3 "$RECORD/bind.py"
      - name: Hash complete evidence inventory
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          out=Path('copy-entry-evidence')
          out.mkdir(exist_ok=True)
          manifest=out/'SHA256SUMS'
          manifest.write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(out))+'\n' for p in sorted(out.rglob('*')) if p.is_file() and p != manifest))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-copy-entry-exceptions-${{ github.run_id }}
          path: copy-entry-evidence/
          retention-days: 90
          if-no-files-found: error

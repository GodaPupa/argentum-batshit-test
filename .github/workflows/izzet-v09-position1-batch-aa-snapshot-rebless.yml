name: Izzet Position-1 Batch AA Snapshot Rebless

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebless-batch-aa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mayhem/izzet-science
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch AA boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'Batch Z is accepted' izzet-science/v09-position1-engine-batch-z-gate.md
          grep -Fq '35997404054' izzet-science/v09-position1-engine-batch-z-gate.md
          grep -Fq 'Expected post-implementation unresolved count is exactly 26' izzet-science/v09-position1-engine-batch-aa-gate.md

      - name: Run Shrine Steward semantics
        run: scripts/test-class ShrineStewardScenarioTest --info --stacktrace

      - name: Run exact real-engine readiness expectation
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-aa-readiness.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=26' /tmp/batch-aa-readiness.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Shrine Steward' /tmp/batch-aa-readiness.txt
          ! grep -Fq 'unresolved Izzet card:' /tmp/batch-aa-readiness.txt

      - name: Regenerate snapshots canonically
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true --stacktrace

      - name: Fail closed on unrelated snapshot changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "mtg-sets/src/test/resources/snapshots/cards/NEO.json"
          git diff --check
          grep -Fq '// Shrine Steward' mtg-sets/src/test/resources/snapshots/cards/NEO.json

      - name: Commit and safely integrate canonical snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtg-sets/src/test/resources/snapshots/cards/NEO.json
          git commit -m "Rebless Position-1 Batch AA snapshot"
          git fetch origin mayhem/izzet-science
          git rebase origin/mayhem/izzet-science
          git push origin HEAD:mayhem/izzet-science

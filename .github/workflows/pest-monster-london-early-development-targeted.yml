name: Pest Monster London conditional next-turn payment targeted receiving
on:
  push:
    branches: ["pest/c2-pair-pilot-seam-20260927"]
    paths:
      - ".github/workflows/pest-monster-london-early-development-targeted.yml"
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact preflighted source, fixture and cards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-london-early-development-targeted
          test "$(git rev-parse HEAD^)" = "cbf7f11b8928ee8f93a61b4dc5f0dbddca28fda8"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonTypecyclingPlan.kt)" = "8adf7684a58e67374cd814323815f1887ad66e1a"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonEarlyDevelopmentTest.kt)" = "9c39ea80ddb7e783e93b5d7070dde2c7f54cbb62"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonSetupBridge.kt)" = "3dfaf5a1a560e8f5c30ab34de1c2583656832251"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/actorinput/PestMonsterLondonForestCertificate.kt)" = "8ba646f1c9edd256e8b8915f8da22788cf1ab8ab"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/atq/cards/UrzasTower.kt)" = "8f280147686880fd921acc43b49f8bb5d5234431"
          test "$(git hash-object mtg-sets/2023/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ltr/cards/GenerousEnt.kt)" = "eb2dc664f794b69442d479525537404ba4201875"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonTypecyclingPlan.kt
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonEarlyDevelopmentTest.kt
            git hash-object .github/workflows/pest-monster-london-early-development-targeted.yml
            git status --porcelain
          } > build/reports/pest-london-early-development-targeted/source.txt
      - name: Execute two conditional-payment cases
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:test --tests 'com.wingedsheep.gym.matchup.PestMonsterLondonEarlyDevelopmentTest' --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-london-early-development-targeted/test.log
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.matchup.PestMonsterLondonEarlyDevelopmentTest.xml build/reports/pest-london-early-development-targeted/
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-london-early-development-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-london-early-development-targeted/
          if-no-files-found: error
          retention-days: 90

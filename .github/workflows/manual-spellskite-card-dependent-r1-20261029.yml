name: Manual Spellskite production card dependent R1
on:
  push:
    branches: [validation/manual-spellskite-card-dependent-r1-20261029]
    paths: ['.github/workflows/manual-spellskite-card-dependent-r1-20261029.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 48beeca1fb5730b1a4ace43b3de6c2f22da3e82a
  SOURCE_TREE: 06712d82941e61f50a7f756fcf43aecece10a88b
  WORKFLOW: .github/workflows/manual-spellskite-card-dependent-r1-20261029.yml
  RECORD: experiments/manual-transmission/research/spellskite-card-dependent-r1-20261029
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web-client/package-lock.json}
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile then card corpus and exact ordinary regressions
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-spellskite-card-dependent-r1-${{ github.run_id }}
          path: manual-spellskite-card-dependent-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: Sphinx accepted Ponder continuation static preflight
on:
  push:
    branches: ["sphinx/accepted-transition-journal-20260928"]
    paths:
      - ".github/workflows/sphinx-accepted-shuffle-preflight.yml"
permissions:
  contents: read
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind changed accepted shuffle source and fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/sphinx-accepted-shuffle-preflight
          test "$(git rev-parse HEAD^)" = "5aa6608ec43dea76311a5d18611535242d7bbe99"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt)" = "ff29172b39ab9fb8099cba265e706530691de90f"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournalTest.kt)" = "a485f1faed6e647963b570e752560da238c5e686"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournalTest.kt; git hash-object .github/workflows/sphinx-accepted-shuffle-preflight.yml; git status --porcelain; } > build/reports/sphinx-accepted-shuffle-preflight/source.txt
      - name: Compile only, execute zero behavioral cases
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:compileTestKotlin --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/sphinx-accepted-shuffle-preflight/compile.log
      - name: Preserve original static evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-accepted-shuffle-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-accepted-shuffle-preflight/
          if-no-files-found: error
          retention-days: 90

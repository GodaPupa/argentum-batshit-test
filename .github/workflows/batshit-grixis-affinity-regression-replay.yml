name: Argentum Validation — Grixis Policy Candidate

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/batshit-grixis-affinity-regression-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Validate residual Affinity policy candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact policy candidate
        uses: actions/checkout@v4
        with:
          ref: a326db872c0f6ebf44524db1c0477883fce2b054
      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "a326db872c0f6ebf44524db1c0477883fce2b054"
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Show environment
        run: |
          java -version
          gradle --version
      - name: Compile Argentum
        run: ./gradlew classes --stacktrace
      - name: Run engine tests
        run: ./gradlew test --stacktrace
      - name: Run Gym tests
        run: ./gradlew :gym:test --stacktrace
      - name: Run Gym trainer tests
        run: ./gradlew :gym-trainer:test --stacktrace

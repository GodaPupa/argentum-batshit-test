name: Frozen Grixis Affinity Regression Replay

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/batshit-grixis-affinity-regression-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Replay frozen Affinity vector on residual policy candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout exact validated policy candidate
        uses: actions/checkout@v6
        with:
          ref: a326db872c0f6ebf44524db1c0477883fce2b054
      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "a326db872c0f6ebf44524db1c0477883fce2b054"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Run exact frozen 100-seed preboard harness
        env:
          BATSHIT_GRIXIS_AFFINITY_SAMPLE_1: "true"
        run: |
          set -o pipefail
          scripts/test-class BatshitGrixisAffinitySampleOneTest --info --stacktrace \
            | tee batshit-grixis-affinity-sample-1.log
      - name: Upload frozen vector, raw traces, and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batshit-grixis-affinity-regression-replay-a326db
          path: |
            batshit-grixis-affinity-sample-1.log
            gym/build/reports/batshit-grixis-affinity-sample-1/raw-traces.log
            gym/build/reports/batshit-grixis-affinity-sample-1/games.jsonl
            gym/build/reports/batshit-grixis-affinity-sample-1/summary.json
            gym/build/reports/batshit-grixis-affinity-sample-1/sample-report.md
            gym/build/reports/batshit-grixis-affinity-sample-1/batshit-grixis-affinity-sample-1-seeds.csv
            gym/src/test/resources/batshit-grixis-affinity-sample-1-seeds.csv
          if-no-files-found: error

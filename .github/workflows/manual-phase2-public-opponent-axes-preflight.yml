name: Manual Phase 2 frozen public opponent axes static preflight
on:
  push:
    branches: ["manual/clean-pilot-boundary-receiving-20260927"]
    paths:
      - ".github/workflows/manual-phase2-public-opponent-axes-preflight.yml"
      - "gym/src/main/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoPublicOpponentAxes.kt"
      - "gym/src/test/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoPublicOpponentAxesTest.kt"

permissions:
  contents: read

jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/manual-phase2-public-opponent-axes-preflight
          test "$(git rev-parse HEAD^)" = "5301e5682c0ac1c71ef4e1bf61d6c69600fbf97e"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoPublicOpponentAxes.kt)" = "8372b475e77849127439060902a06b0b2da8fdf2"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoPublicOpponentAxesTest.kt)" = "bab12ac38ea784ce7ca7f133169ff4257d88e363"
          test -x gradlew
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoPublicOpponentAxes.kt
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoPublicOpponentAxesTest.kt
            git hash-object .github/workflows/manual-phase2-public-opponent-axes-preflight.yml
            git status --porcelain
          } > build/reports/manual-phase2-public-opponent-axes-preflight/source.txt
      - name: Compile without behavioral execution
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:compileTestKotlin --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/manual-phase2-public-opponent-axes-preflight/compile.log
          test -f gym/build/classes/kotlin/main/com/wingedsheep/gym/manual/ManualPhaseTwoPublicOpponentAxes.class
          test -f gym/build/classes/kotlin/test/com/wingedsheep/gym/manual/ManualPhaseTwoPublicOpponentAxesTest.class
          test ! -e gym/build/test-results/test/TEST-com.wingedsheep.gym.manual.ManualPhaseTwoPublicOpponentAxesTest.xml
      - name: Retain original compile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-phase2-public-opponent-axes-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/manual-phase2-public-opponent-axes-preflight/
          if-no-files-found: error
          retention-days: 90

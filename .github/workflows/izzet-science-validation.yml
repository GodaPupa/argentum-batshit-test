name: Izzet Science Validation

permissions:
  contents: write

on:
  push:
    branches:
      - mayhem/izzet-science
    paths:
      - 'izzet-science/**'
      - '.github/workflows/izzet-science-validation.yml'
  workflow_dispatch:

jobs:
  turn-sequence-v1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mayhem/izzet-science
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen v0.1 deterministic harness
        run: |
          mkdir -p izzet-science/artifacts
          python izzet-science/sim/mana_harness.py             --deck izzet-science/v0.1-control.md             --samples 100000             --seed 0x1A22E7001             | tee izzet-science/artifacts/turn-sequence-v1.txt
      - name: Build self-published result
        run: |
          mkdir -p izzet-science/results/latest
          cp izzet-science/artifacts/turn-sequence-v1.txt izzet-science/results/latest/turn-sequence-v1.txt
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "seed=0x1A22E7001"
            echo "samples=100000"
            sha256sum izzet-science/artifacts/turn-sequence-v1.txt
          } > izzet-science/results/latest/manifest.txt
      - name: Run R1 red-access challenger
        run: |
          python izzet-science/sim/mana_harness.py             --deck izzet-science/challengers/R1-red-access-deck.md             --samples 100000             --seed 0x1A22E7001             | tee izzet-science/artifacts/R1-red-access.txt
          mkdir -p izzet-science/results/R1-red-access
          cp izzet-science/artifacts/R1-red-access.txt izzet-science/results/R1-red-access/turn-sequence-v1.txt
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "seed=0x1A22E7001"
            echo "samples=100000"
            echo "deck=izzet-science/challengers/R1-red-access-deck.md"
            sha256sum izzet-science/artifacts/R1-red-access.txt
          } > izzet-science/results/R1-red-access/manifest.txt
      - name: Run R0.5 midpoint challenger
        run: |
          python izzet-science/sim/mana_harness.py             --deck izzet-science/challengers/R0.5-midpoint-deck.md             --samples 100000             --seed 0x1A22E7001             | tee izzet-science/artifacts/R0.5-midpoint.txt
          mkdir -p izzet-science/results/R0.5-midpoint
          cp izzet-science/artifacts/R0.5-midpoint.txt izzet-science/results/R0.5-midpoint/turn-sequence-v1.txt
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "seed=0x1A22E7001"
            echo "samples=100000"
            echo "deck=izzet-science/challengers/R0.5-midpoint-deck.md"
            sha256sum izzet-science/artifacts/R0.5-midpoint.txt
          } > izzet-science/results/R0.5-midpoint/manifest.txt
      - name: Run infrastructure exclusion diagnostics
        run: |
          python izzet-science/sim/mana_harness.py             --deck izzet-science/challengers/infrastructure-A9.md             --diagnostic-size 98 --samples 100000 --seed 0x1A22E7001             | tee izzet-science/artifacts/infrastructure-A9.txt
          python izzet-science/sim/mana_harness.py             --deck izzet-science/challengers/infrastructure-B8.md             --diagnostic-size 97 --samples 100000 --seed 0x1A22E7001             | tee izzet-science/artifacts/infrastructure-B8.txt
          for name in infrastructure-A9 infrastructure-B8; do
            mkdir -p "izzet-science/results/$name"
            cp "izzet-science/artifacts/$name.txt" "izzet-science/results/$name/turn-sequence-v1.txt"
            {
              echo "source_sha=${GITHUB_SHA}"
              echo "run_id=${GITHUB_RUN_ID}"
              echo "seed=0x1A22E7001"
              echo "samples=100000"
              sha256sum "izzet-science/artifacts/$name.txt"
            } > "izzet-science/results/$name/manifest.txt"
          done
      - name: Run C1 lean-machine challenger
        run: |
          python izzet-science/sim/mana_harness.py             --deck izzet-science/challengers/C1-lean-machine.md             --samples 100000 --seed 0x1A22E7001             | tee izzet-science/artifacts/C1-lean-machine.txt
          mkdir -p izzet-science/results/C1-lean-machine
          cp izzet-science/artifacts/C1-lean-machine.txt izzet-science/results/C1-lean-machine/turn-sequence-v1.txt
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "seed=0x1A22E7001"
            echo "samples=100000"
            echo "deck=izzet-science/challengers/C1-lean-machine.md"
            sha256sum izzet-science/artifacts/C1-lean-machine.txt
          } > izzet-science/results/C1-lean-machine/manifest.txt
      - name: Preserve output
        uses: actions/upload-artifact@v4
        with:
          name: izzet-science-turn-sequence-v1
          path: |
            izzet-science/artifacts/turn-sequence-v1.txt
            izzet-science/artifacts/R1-red-access.txt
            izzet-science/artifacts/R0.5-midpoint.txt
            izzet-science/artifacts/infrastructure-A9.txt
            izzet-science/artifacts/infrastructure-B8.txt
            izzet-science/artifacts/C1-lean-machine.txt
          if-no-files-found: error

      - name: Publish result back to experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add izzet-science/results/latest/ izzet-science/results/R1-red-access/ izzet-science/results/R0.5-midpoint/ izzet-science/results/infrastructure-A9/ izzet-science/results/infrastructure-B8/ izzet-science/results/C1-lean-machine/
          if git diff --cached --quiet; then
            echo "No result changes to publish"
            exit 0
          fi
          git commit -m "Record Izzet Science validation result [skip ci]"
          git push origin HEAD:mayhem/izzet-science

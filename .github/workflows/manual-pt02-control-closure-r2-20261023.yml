name: Manual PT02 qualified-baseline control closure R2
on:
  push:
    branches: [validation/manual-pt02-control-closure-r2-20261023]
    paths: ['.github/workflows/manual-pt02-control-closure-r2-20261023.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 4abd907c0fa1c36ebddb1931f05fb6b6918ff001
  SOURCE_TREE: f05354ef3426b159e59343419d6e3d9abda3a95e
  RECORD: experiments/manual-transmission/research/pt02-control-closure-r1-20261023
  R2_RECORD: experiments/manual-transmission/research/pt02-control-closure-r2-20261023
  WORKFLOW: .github/workflows/manual-pt02-control-closure-r2-20261023.yml
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum" manual-pt02-closure-evidence
      - name: Bind exact derived fixture and unchanged R5 production and original tests
        run: python3 "$R2_RECORD/gate.py" bind candidate
      - name: Restore and verify all qualified-baseline production differences
        run: python3 "$R2_RECORD/gate.py" restore negative
      - name: Execute four PT02 controls on the qualified baseline
        id: negative
        run: |
          python3 "$R2_RECORD/gate.py" prepare negative
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" controls 2>&1 | tee manual-pt02-closure-evidence/negative/gradle.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > manual-pt02-closure-evidence/negative/exit.txt
          exit 0
      - name: Require the four exact predicted behavioral assertion failures
        if: always() && steps.negative.outcome != 'skipped'
        run: python3 "$R2_RECORD/gate.py" receive negative
      - name: Restore and rebind exact R5 production before positives
        if: always()
        run: python3 "$R2_RECORD/gate.py" restore candidate
      - name: Execute the same four exact-derived PT02 cases on R5
        id: positive
        run: |
          python3 "$R2_RECORD/gate.py" prepare positive
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" controls 2>&1 | tee manual-pt02-closure-evidence/positive/gradle.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > manual-pt02-closure-evidence/positive/exit.txt
          exit "$rc"
      - name: Receive four candidate passes with exact original identities
        if: always() && steps.positive.outcome != 'skipped'
        run: python3 "$R2_RECORD/gate.py" receive positive
      - name: Final source and protection binding
        if: always()
        run: python3 "$R2_RECORD/gate.py" bind candidate
      - name: Preserve original reports, exact fixture derivation and source pins
        if: always()
        run: |
          mkdir -p manual-pt02-closure-evidence/protocol
          cp "$RECORD/PROTOCOL.json" "$RECORD/gate.py" "$RECORD/validation.just" manual-pt02-closure-evidence/protocol/
          cp "$R2_RECORD/AMENDMENT.json" manual-pt02-closure-evidence/protocol/R2_AMENDMENT.json
          cp "$R2_RECORD/gate.py" manual-pt02-closure-evidence/protocol/R2_WRAPPER.py
          cp "$WORKFLOW" manual-pt02-closure-evidence/protocol/WORKFLOW.yml
          cp rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/PausedTokenInstructionScenarioTest.kt manual-pt02-closure-evidence/protocol/ORIGINAL_R5_PT02.kt
          cp rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/PausedTokenPT02ControlClosureTest.kt manual-pt02-closure-evidence/protocol/DERIVED_PT02.kt
          git rev-parse HEAD "$SOURCE^{tree}" > manual-pt02-closure-evidence/source-pins.txt
          git status --porcelain --untracked-files=no > manual-pt02-closure-evidence/final-tracked-changes.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('manual-pt02-closure-evidence')
          manifest=root/'SHA256SUMS'
          manifest.write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(root))+'\n' for p in sorted(root.rglob('*')) if p.is_file() and p!=manifest))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-pt02-control-closure-r2-${{ github.run_id }}
          path: manual-pt02-closure-evidence/
          retention-days: 90
          if-no-files-found: error

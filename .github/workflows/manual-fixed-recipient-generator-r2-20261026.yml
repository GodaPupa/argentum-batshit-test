name: Manual fixed recipient generator baseline repair and calibration R2
on:
  push:
    branches: [validation/manual-fixed-recipient-generator-r2-20261026]
    paths: ['.github/workflows/manual-fixed-recipient-generator-r2-20261026.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 49a82d93b9f65d24ac99d80e2df05686c49da36c
  SOURCE_TREE: 60199b084ff71b1b46e465efab1b2075b8e57bbe
  WORKFLOW: .github/workflows/manual-fixed-recipient-generator-r2-20261026.yml
  RECORD: experiments/manual-transmission/research/fixed-recipient-generator-qualification-r2-20261026
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Reuse received R1 controls; full module and frozen POR ISD calibration
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-fixed-recipient-generator-r2-${{ github.run_id }}
          path: manual-fixed-recipient-generator-r2-evidence/
          include-hidden-files: true
          if-no-files-found: error

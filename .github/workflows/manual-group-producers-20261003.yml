name: Manual fixed-slot retarget structure diagnostic
on:
  push:
    branches: [validation/manual-group-producers-20261003]
    paths: [.github/workflows/manual-group-producers-20261003.yml]
permissions:
  contents: read
concurrency:
  group: manual-group-producers-20261003
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/manual-spellskite-structure-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source-only successor and workflow-only validation child
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['OUT'])
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          source='29c96b66188459a2cabb93308aba7ee0114a175f';parent='b01e312106011af2aa904e7c70438df7620d5e0c';workflow='.github/workflows/manual-group-producers-20261003.yml'
          expected={'docs/experiments/manual/announced-target-groups-implementation-20261003.md': 'a0836bb10a43a49174b05a048da7708afc91b7f6', 'docs/experiments/manual/atomic-target-bindings-20261003.md': '1a2aa8950a104f558b663112d2a09f81c3921d66', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/core/GameAction.kt': '06fe90ca797b64dec4346be7d77a08ec0cfef9a0', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/core/LibraryAndZoneContinuations.kt': '8f7953c8d706a50bf6deb7cd410973e11b03a7d7', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/ability/ActivateAbilityHandler.kt': 'd605fb9d1a692abc16a34dbd974f06cea133909d', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/spell/CastSpellHandler.kt': '5d1f6bb8b4a38071d51f2c408c3098074833e849', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/ActivateAbilityXCostContinuationResumer.kt': 'c4772cec188b35930c03f46fba7443cedfb39aae', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/CastModalContinuationResumer.kt': 'a027daeee8ad3a74e460a949be2bd9dd73f95d94', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/EffectAndTriggerContinuationResumer.kt': 'e12df5ef1b9a9377d1d6343c26e354d48d3057ea', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/LibraryAndZoneContinuationResumer.kt': '314d1ab47c4b1191542ca61e2032932c31b9c169', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/MiscContinuationResumer.kt': 'cd75bf2883790d7acfb4ff905b7b0802cc8589a6', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/ModalTriggerContinuationResumer.kt': '708ce7c335bddcce1176714db4d3e3885d10433f', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/library/CastFromCollectionWithoutPayingCostExecutor.kt': '849f616506626c006f88d619223e22fa18e07444', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/stack/ContestedRetargetExecutors.kt': 'ab09b29188b4cd14df5f66640d45d7586421cead', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt': '7c9ea98f1839607e0c1dabf7a31427188541556e', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/TargetingEvents.kt': '38250bf1f75e5afced2cdf5b83b3814d82d08699', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/targeting/AnnouncedTargetGroups.kt': 'b7cf333200086438fcc62e45e6234e769d5ecffb', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/targeting/TargetValidator.kt': '54c55b100d3024ed29bb59b9ef809a3f64e37c9e', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/state/components/stack/StackComponents.kt': '4759bcc6363d3b9dc65496357794dd6e6d5bcda1', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/mechanics/targeting/AnnouncedTargetGroupsTest.kt': '323e08a4345df1d471c578dec531921283175c00', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/mechanics/targeting/TargetGroupProducerIntegrationTest.kt': '1ba73ca5e80b204beaa97340e190ccd35b4cd548', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/triggers/RetargetStructureBoundaryTest.kt': '1876d4309b6aac3ba8399071083b68089f0d63db'}
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==source
          assert git('rev-parse','HEAD^^')==parent
          assert git('rev-parse',source+'^{tree}')=='b96785b82bc7dd6ba14ba5c392640acc75d6ff64'
          assert git('diff','--name-only',source,'HEAD').splitlines()==[workflow]
          assert git('diff','--name-only',parent,source).splitlines()==sorted(expected)
          assert not git('status','--porcelain')
          for p,blob in expected.items(): assert git('hash-object',p)==blob,p
          binding={'source_head':source,'source_tree':'b96785b82bc7dd6ba14ba5c392640acc75d6ff64','parent_source_head':parent,'validation_head':git('rev-parse','HEAD'),'source_git_blobs':expected,'scope':'EXCLUDED_FIXED_COMPONENT_DIAGNOSTIC','official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
          (out/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          PYCODE
      - name: Run eighteen producer and binding scenarios
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-configuration-cache --console=plain --continue --max-workers=1 \
            -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g \
            :rules-engine:test --tests com.wingedsheep.engine.triggers.RetargetStructureBoundaryTest --tests com.wingedsheep.engine.mechanics.targeting.AnnouncedTargetGroupsTest --tests com.wingedsheep.engine.mechanics.targeting.TargetGroupProducerIntegrationTest \
            2>&1 | tee "$OUT/qualification.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
          exit "$rc"
      - name: Preserve every diagnostic result
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,shutil,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
          reports=out/'xml';reports.mkdir(exist_ok=True)
          cases=[]
          for path in pathlib.Path('rules-engine/build/test-results/test').glob('TEST-*.xml'):
            shutil.copy2(path,reports/path.name)
            for case in ET.parse(path).getroot().iter('testcase'):
              failure=case.find('failure');error=case.find('error')
              cases.append({'name':case.attrib['name'],'failure':None if failure is None else failure.attrib,'error':None if error is None else error.attrib,'skipped':case.find('skipped') is not None})
          summary={'tests':len(cases),'failures':sum(c['failure'] is not None for c in cases),'errors':sum(c['error'] is not None for c in cases),'skipped':sum(c['skipped'] for c in cases),'cases':cases,'card_admitted':False,'inventory_executed':False,'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
          (out/'test-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          (out/'evidence-sha256.json').write_text(json.dumps({str(f.relative_to(out)):hashlib.sha256(f.read_bytes()).hexdigest() for f in out.rglob('*') if f.is_file() and f.name!='evidence-sha256.json'},indent=2)+'\n')
          assert len(cases)==18,summary
          assert summary['failures']==0 and summary['errors']==0 and summary['skipped']==0,summary
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manual-spellskite-structure-${{ github.run_id }}
          path: ${{ env.OUT }}
          retention-days: 90
          if-no-files-found: error

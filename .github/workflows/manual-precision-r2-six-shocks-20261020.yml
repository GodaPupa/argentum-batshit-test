name: Manual Precision R2 all-six archived shockland microforks (NO GAMES)
on:
  push:
    branches: [research/manual-precision-r2-six-shocks-20261020]
    paths:
      - '.github/workflows/manual-precision-r2-six-shocks-20261020.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: manual-precision-r2-six-shocks-only
  cancel-in-progress: false
jobs:
  original-six-shocks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R2_SIX_OUTPUT: ${{ github.workspace }}/r2-six-output
      MANUAL_R2_ARCHIVE_202610202111: ${{ github.workspace }}/r2-original-111
      MANUAL_R2_ARCHIVE_202610202112: ${{ github.workspace }}/r2-original-112
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 32}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Bind to accepted R1 and successful R2 primary without gameplay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r2-six-output
          git rev-parse HEAD > r2-six-output/execution-source-sha.txt
          git rev-parse HEAD^{tree} > r2-six-output/execution-tree-sha.txt
          test "$GITHUB_REF" = "refs/heads/research/manual-precision-r2-six-shocks-20261020"
          test "$(git rev-parse HEAD^)" = "63648a87ae41d53b81785554214426720bacd9b6"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/manual-precision-r2-six-shocks-20261020.yml"
          git merge-base --is-ancestor 37e5cdd9b550a3b42c1c93f5c1d73b2751955822 HEAD
          test "$(git diff --name-only 37e5cdd9b550a3b42c1c93f5c1d73b2751955822 HEAD | wc -l)" -eq 2
          test "$(git rev-parse HEAD:ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualPrecisionR2ShockMicroforkTest.kt)" = "48704a5af388c88345b90fb9cfc32ac225bbf13c"
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          echo "ZERO_NEW_FULL_GAMES" > r2-six-output/game-budget.txt
          chmod +x gradlew scripts/gradle-locked
      - name: Verify successful original R1 and exact original A artifact identities
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/GodaPupa/argentum-batshit-test/actions/runs/39477314282 > r2-six-output/source-run.json
          jq -e '.status == "completed" and .conclusion == "success" and .head_sha == "84e6347bbcdfa2990eb304051771007daf849ce9"' r2-six-output/source-run.json >/dev/null
          gh api /repos/GodaPupa/argentum-batshit-test/actions/runs/39477314282/artifacts > r2-six-output/source-artifacts.json
          jq -e '[.artifacts[] | select(.id == 12290591119 and .digest == "sha256:7744f1916818bea1fcb3149474c7f696249c0fc075fce5380d268458eca1bb2c" and .expired == false)] | length == 1' r2-six-output/source-artifacts.json >/dev/null
          jq -e '[.artifacts[] | select(.id == 12290286293 and .digest == "sha256:a614eb9998b25dd34803434bb9ca80cf113b545483a185eac49cfcd419c7fd09" and .expired == false)] | length == 1' r2-six-output/source-artifacts.json >/dev/null
          gh api /repos/GodaPupa/argentum-batshit-test/actions/runs/39481840733 > r2-six-output/primary-run.json
          jq -e '.conclusion == "success" and .head_sha == "37e5cdd9b550a3b42c1c93f5c1d73b2751955822"' r2-six-output/primary-run.json >/dev/null
      - name: Download original R1 Challenger A 202610202111
        uses: actions/download-artifact@v4
        with:
          repository: GodaPupa/argentum-batshit-test
          run-id: 39477314282
          name: manual-precision-r1-stage1-game-a-202610202111-39477314282
          github-token: ${{ github.token }}
          path: r2-original-111
      - name: Download original R1 Challenger A 202610202112
        uses: actions/download-artifact@v4
        with:
          repository: GodaPupa/argentum-batshit-test
          run-id: 39477314282
          name: manual-precision-r1-stage1-game-a-202610202112-39477314282
          github-token: ${{ github.token }}
          path: r2-original-112
      - name: Pin both original initial snapshots and original actions
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum r2-original-111/precision-r1-stage1-output/a-seed-202610202111/initial-state.json | cut -d' ' -f1)" = "ca7032465c59f44966fef3c1e780e1861c73587e2f93f094f5f962c8d108fb89"
          test "$(sha256sum r2-original-111/precision-r1-stage1-output/a-seed-202610202111/actions.jsonl | cut -d' ' -f1)" = "5c180ce46d49db804d048056d993f6292518051a6e6647bb7c695e0f9820acfb"
          test "$(sha256sum r2-original-112/precision-r1-stage1-output/a-seed-202610202112/initial-state.json | cut -d' ' -f1)" = "cf00fb2f7c8f8cc7745639a081e403c9fc988d0cbb09d017a4130a92696a8adf"
          test "$(sha256sum r2-original-112/precision-r1-stage1-output/a-seed-202610202112/actions.jsonl | cut -d' ' -f1)" = "ae1c68d142b1661ed11102a2eb33238623ef94f4fda0e0ebc196f962d5e51d90"
          echo TWO_ARCHIVED_GAME_TRACES_HASH_VERIFIED > r2-six-output/source-hashes-passed.txt
      - name: Replay only original prefixes to six shock prompts and microfork real Yes/No decisions
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualPrecisionR2SixShockAuditTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r2-six-output/replay-six.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("r2-six-output/r2-six-shock-audit.json").read_text())
          assert j["status"] == "R2_SIX_SHOCK_EXACT_REPLAY_COMPLETE"
          assert j["observedShocks"] == 6 and len(j["decisions"]) == 6
          assert j["policyChanges"] == 0 and j["fullGamesExecuted"] == 0
          assert sorted((str(r["seed"]),r["index"]) for r in j["decisions"]) == [
            ("202610202111",468),("202610202111",555),("202610202111",599),
            ("202610202112",14),("202610202112",273),("202610202112",1002)]
          assert all(r["noTapped"] and not r["yesTapped"] and r["exactOriginalNoEventsMatch"] for r in j["decisions"])
          print("R2_ORIGINAL_SIX_CHOICES_REAL_ENGINE_VERIFIED")
          PY
      - name: Retain original-state forensic outputs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-precision-r2-six-shock-audit-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            r2-six-output/
            ai/build/test-results/test/

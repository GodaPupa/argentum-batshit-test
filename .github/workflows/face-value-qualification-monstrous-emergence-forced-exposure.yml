name: Face Value Qualification Monstrous Emergence Forced Exposure

on:
  push:
    branches: [face-value/lab]
    paths:
      - .github/workflows/face-value-qualification-monstrous-emergence-forced-exposure.yml
      - experiments/face-value/qualification/apply_forge_profile_v5.py
      - experiments/face-value/qualification/audit_monstrous_emergence_forced_exposure.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forced-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: face-value/lab
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate inputs and build profile v5
        run: |
          set -euxo pipefail
          python3 experiments/face-value/qualification/validate_inputs.py >/dev/null
          FORGE_SHA=f387ede550e336315637a8b765f0927ac768c113
          git clone --filter=blob:none https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src checkout --detach "$FORGE_SHA"
          for v in 1 2 3 4 5; do python3 "experiments/face-value/qualification/apply_forge_profile_v${v}.py" --forge-root forge-src > "forge-profile-v${v}-id.txt"; done
          test "$(cat forge-profile-v5-id.txt)" = 'FACE_VALUE_QUALIFICATION_FORGE_PROFILE_V5'
          git -C forge-src diff > forge-profile-v5.patch
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"
      - name: Freeze nonlegal forced-exposure fixture
        run: |
          set -euo pipefail
          mkdir -p emergence-fixtures emergence-logs "$HOME/.forge/decks/constructed"
          cat > emergence-fixtures/emergence-caster.dck <<'EOF'
          [metadata]
          Name=DIAGNOSTIC ONLY Monstrous Emergence Caster
          Deck Type=constructed
          [main]
          12 Monstrous Emergence
          12 Avenging Hunter
          12 Llanowar Elves
          24 Forest
          EOF
          cat > emergence-fixtures/red-creature-target.dck <<'EOF'
          [metadata]
          Name=DIAGNOSTIC ONLY Emergence Target
          Deck Type=constructed
          [main]
          24 Kessig Flamebreather
          36 Mountain
          EOF
          python3 - <<'PY'
          from pathlib import Path
          rows = [f'{seat}\t{seed}' for seat, seed in zip((1, 2, 1, 2), range(730067, 730071))]
          Path('emergence-assignments.tsv').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          cp emergence-fixtures/*.dck "$HOME/.forge/decks/constructed/"
          sha256sum emergence-fixtures/*.dck emergence-assignments.tsv forge-profile-v5.patch > emergence-inputs.sha256
          cat > emergence-disposition.txt <<'EOF'
          DIAGNOSTIC_ONLY_NONLEGAL_MONSTROUS_EMERGENCE_FORCED_EXPOSURE_PROFILE_V5
          Seeds 730067-730070 and all outcomes are permanently retired diagnostic material.
          The nonlegal fixture tests only casting, additional-cost handling, and opponent targeting.
          Results have no matchup, qualification, tuning, structural-diagnosis, or challenger authority.
          EOF
      - name: Run forced-exposure assignments
        run: |
          set -uo pipefail
          while IFS=$'\t' read -r seat seed; do
            if [ "$seat" = 1 ]; then first=emergence-caster.dck; second=red-creature-target.dck; else first=red-creature-target.dck; second=emergence-caster.dck; fi
            log="emergence-logs/emergence-caster-seat${seat}-seed${seed}.log"
            timeout 240 "$FORGE_LAUNCHER" sim -d "$first" "$second" -n 1 -s "$seed" -c 120 > "$log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then printf '\nDIAGNOSTIC_PROCESS_EXIT_%s\n' "$code" >> "$log"; fi
          done < emergence-assignments.tsv
          exit 0
      - name: Audit Monstrous Emergence capability
        id: audit
        continue-on-error: true
        run: |
          python3 experiments/face-value/qualification/audit_monstrous_emergence_forced_exposure.py \
            --logs emergence-logs --assignments emergence-assignments.tsv \
            --output emergence-summary.json
      - name: Preserve forced-exposure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-monstrous-emergence-forced-exposure
          path: |
            emergence-summary.json
            emergence-assignments.tsv
            emergence-inputs.sha256
            emergence-disposition.txt
            emergence-fixtures/*.dck
            emergence-logs/*.log
            forge-profile-v5.patch
            forge-profile-v*-id.txt
            experiments/face-value/qualification/input-validation-report.json
          if-no-files-found: warn
      - name: Enforce fail-closed capability gate
        if: steps.audit.outcome != 'success'
        run: exit 1

            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-generic-shock/misty.log

      - name: Original Wooded Foothills
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2000-2002:tests:test --tests '*WoodedFoothillsScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-generic-shock/wooded.log

      - name: Hand-played shocklands
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2003-2007:tests:test \
            --tests '*BreedingPoolScenarioTest' --tests '*SteamVentsScenarioTest' --tests '*StompingGroundScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \

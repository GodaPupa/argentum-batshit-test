name: Manual Precision R9 generic activation payment repair (NO GAMES)
on:
  push:
    branches: [research/manual-precision-r9-generic-activation-repair-20261020]
    paths:
      - '.github/workflows/manual-precision-r9-generic-activation-repair-20261020.yml'
permissions:
  contents: read
concurrency:
  group: manual-precision-r9-generic-activation-repair
  cancel-in-progress: false
jobs:
  generic-provenance-and-r5:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R4_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 32}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Pin exact generic repair, original witness and protected authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r9-generic-repair
          test "$GITHUB_REF" = "refs/heads/research/manual-precision-r9-generic-activation-repair-20261020"
          git rev-parse HEAD > r9-generic-repair/source-sha.txt
          git rev-parse HEAD^{tree} > r9-generic-repair/tree-sha.txt
          git merge-base --is-ancestor b2c7d2fa3a43775d8ef49b8ca5a18882d61d82d8 HEAD
          git diff --name-only b2c7d2fa3a43775d8ef49b8ca5a18882d61d82d8 HEAD > r9-generic-repair/delta-paths.txt
          test "$(wc -l < r9-generic-repair/delta-paths.txt)" -eq 2
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/manual-precision-r9-generic-activation-repair-20261020.yml|rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt) ;;
              *) echo "UNAUTHORIZED_DELTA:$file"; exit 1 ;;
            esac
          done < r9-generic-repair/delta-paths.txt
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt)" = "b44eec7a1b159989007b315f9c4547ed9c1e5b1c"
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaAbilitySideEffectExecutor.kt)" = "e34ab8703aeace3dd7930c8222c1937237a08b05"
          test "$(git rev-parse HEAD:mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9ProvenanceHardeningWitnessesTest.kt)" = "34e336056c0fee43d9849c1a1791fcf902f68e2f"
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = "7984a2e87d8ddbe023d45620414d25a61691a040"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          echo ZERO_FULL_GAMES > r9-generic-repair/budget.txt
          chmod +x gradlew scripts/gradle-locked
      - name: Original generic RED and four provenance witnesses plus Confluence and R9 mana
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2008-2016:tests:cleanTest :mtg-sets:2008-2016:tests:test \
            --tests '*ManualPrecisionR9GenericActivationCostHeldoutTest' \
            --tests '*ManualPrecisionR9ProvenanceHardeningWitnessesTest' \
            --tests '*ManaConfluenceScenarioTest' --tests '*ManualPrecisionR9ManaHeldoutScenarioTest' \
            --tests '*ManualPrecisionR9InternalManaCostScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-generic-repair/mana-witnesses.log

      - name: Hidden Grotto
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2024:tests:test --tests '*HiddenGrottoTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-generic-repair/grotto.log

      - name: City of Brass
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:1993-1999:tests:test --tests '*CityOfBrassScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-generic-repair/city.log

      - name: Ashiok replacement
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2023:tests:test --tests '*AshiokWickedManipulatorScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-generic-repair/ashiok.log

      - name: Protected R5 Pact Ballista Statue Encore and payment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualPactDebt*Test' --tests '*ManualBallista*Test' \
            --tests '*ManualStatue*Test' --tests '*ManualResolutionPaymentRegressionTest' \
            --tests '*ManualR5CandidateCompositionTest' --tests '*ManualEncoreRegressionTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-generic-repair/r5.log

          mkdir -p r9-generic-repair/r5-junit
          cp -a ai/build/test-results/test/. r9-generic-repair/r5-junit/
      - name: CONTROL versus A initializer parity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test --tests '*ManualPrecisionR1PreflightTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-generic-repair/initializers.log

      - name: Preserve original JUnit source and logs on GREEN and RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-precision-r9-generic-repair-core-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            r9-generic-repair/
            mtg-sets/2008-2016/tests/build/test-results/test/
            mtg-sets/2024/tests/build/test-results/test/
            mtg-sets/1993-1999/tests/build/test-results/test/
            mtg-sets/2023/tests/build/test-results/test/
            ai/build/test-results/test/

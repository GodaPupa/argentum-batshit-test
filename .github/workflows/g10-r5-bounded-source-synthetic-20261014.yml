{
  "name": "Argentum G10 R5 excluded bounded source-choice qualification",
  "on": {
    "push": {
      "branches": [
        "play-first/g10-r5-bounded-source-choice-20261014"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "argentum-r5-bounded-source-original-20261014",
    "cancel-in-progress": false
  },
  "jobs": {
    "qualify": {
      "if": "github.repository == 'GodaPupa/argentum-batshit-test' && github.event_name == 'push' && github.ref == 'refs/heads/play-first/g10-r5-bounded-source-choice-20261014' && github.run_number == 1 && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 29,
      "env": {
        "ARGENTUM_G10_R5_PROFILE": "EXCLUDED_LATE_BOARD_ONLY",
        "ARGENTUM_G10_R5_EVIDENCE_DIR": "/tmp/argentum-g10-r5-${{ github.run_id }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 10,
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact R5 frozen source and no gameplay scope",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD^)\" = 'b3b59cf74063a9ee9a5b2637dc5ccc640579e4ba'\ngit merge-base --is-ancestor 'b4fc0ae5ce7aa2e3ac97d9d7451f5de8935c8f72' HEAD\ntest \"$(git diff --name-only 'b4fc0ae5ce7aa2e3ac97d9d7451f5de8935c8f72' HEAD)\" = \"$(printf '%s\\n' '.github/workflows/g10-r5-bounded-source-synthetic-20261014.yml' 'ai/src/main/kotlin/com/wingedsheep/ai/engine/FocalSourceChoiceSampler.kt' 'ai/src/main/kotlin/com/wingedsheep/ai/engine/Strategist.kt' 'ai/src/test/kotlin/com/wingedsheep/ai/engine/FocalSourceChoiceSamplerTest.kt' 'docs/experiments/play-first/isolation-v2/G10_R5_BOUNDED_SOURCE_CHOICE_PROTOCOL.md' 'gym/src/test/kotlin/com/wingedsheep/gym/G10R5LateBoardBoundedSourceTest.kt' 'gym/src/test/kotlin/com/wingedsheep/gym/G10R5SparseDenseParityTest.kt')\"\ngit diff --check 'b4fc0ae5ce7aa2e3ac97d9d7451f5de8935c8f72' HEAD\ntest \"$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/FocalSourceChoiceSampler.kt)\" = '494d4921acc3f8877dc5be39904e3ac3ab832f7e'\ntest \"$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/Strategist.kt)\" = '360c40b490458cfba82d43b29b2fcb0ea0913b68'\ntest \"$(git rev-parse HEAD:ai/src/test/kotlin/com/wingedsheep/ai/engine/FocalSourceChoiceSamplerTest.kt)\" = 'cd0bbf46c3543bdfeb9a48bdf4f9e28d255eaa2d'\ntest \"$(git rev-parse HEAD:docs/experiments/play-first/isolation-v2/G10_R5_BOUNDED_SOURCE_CHOICE_PROTOCOL.md)\" = 'e52f65e8ac27740278fbc5d775d251ab8cdef249'\ntest \"$(git rev-parse HEAD:gym/src/test/kotlin/com/wingedsheep/gym/G10R5LateBoardBoundedSourceTest.kt)\" = 'cb63fa2dacfe49734e1d5673a910dc9fdcc90058'\ntest \"$(git rev-parse HEAD:gym/src/test/kotlin/com/wingedsheep/gym/G10R5SparseDenseParityTest.kt)\" = '9900641d4515dca6d691041e37fae0f1b75b5378'\ntest \"$(git rev-parse HEAD:gym/src/test/kotlin/com/wingedsheep/gym/PlayFirstOneShotPestMonsterTronTest.kt)\" = '5ae14e0ed7212c317deecfa1cbd6a54a809c211a'\ntest \"$(git rev-parse HEAD:.github/workflows/play-first-successor-nonofficial-v2.yml)\" = '18c451f9c20e09e58a109c85c8d3c96c645d2558'\ntest \"$(git rev-parse HEAD:.github/workflows/g10-r4-focal-cache-synthetic-20261014.yml)\" = '6f7e5e2c5b23138b3cac3cffe84011ef3e4984bd'\ntest -z \"${PLAY_FIRST_ONE_SHOT_ACK:-}\"\ntest -z \"${PLAY_FIRST_ISOLATED_ACK:-}\"\ntest -z \"${PLAY_FIRST_ISOLATED_CASE_FILE:-}\"\ntest -z \"${ARGENTUM_SUCCESSOR_REQUEST_JSON:-}\"\nmkdir -p \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"\ngit rev-parse HEAD HEAD^{tree} HEAD^ > \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/source-identities.txt\nprintf '%s\\n' 'R5_SYNTHETIC_SOURCE_ONLY_NO_GAME' > \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/scope-gate.txt\n"
        },
        {
          "uses": "actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961",
          "with": {
            "distribution": "temurin",
            "java-version": "21"
          }
        },
        {
          "uses": "extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b"
        },
        {
          "uses": "gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6",
          "with": {
            "cache-read-only": true
          }
        },
        {
          "name": "Only excluded R5 sampler and two synthetic decision fixture classes",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"\njava -version > \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/java-version.txt 2>&1\ntimeout --signal=TERM --kill-after=30s 6m just test-class FocalSourceChoiceSamplerTest --no-daemon --no-build-cache --console=plain 2>&1 | tee \"$ARGENTUM_G10_R5_EVIDENCE_DIR/sampler.log\"\ntest -s ai/build/test-results/test/TEST-com.wingedsheep.ai.engine.FocalSourceChoiceSamplerTest.xml\nmkdir -p \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/sampler\ncp -a ai/build/test-results/test \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/sampler/test-results\nif test -d ai/build/reports/tests/test; then cp -a ai/build/reports/tests/test \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/sampler/test-report; fi\nprintf '%s\\n' 'SAMPLER_XML_SAVED' > \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/sampler-complete.txt\ntimeout --signal=TERM --kill-after=30s 5m just test-class G10R5SparseDenseParityTest --no-daemon --no-build-cache --console=plain 2>&1 | tee \"$ARGENTUM_G10_R5_EVIDENCE_DIR/control.log\"\ntest -s gym/build/test-results/test/TEST-com.wingedsheep.gym.G10R5SparseDenseParityTest.xml\nmkdir -p \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/control\ncp -a gym/build/test-results/test \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/control/test-results\nif test -d gym/build/reports/tests/test; then cp -a gym/build/reports/tests/test \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/control/test-report; fi\nprintf '%s\\n' 'CONTROL_XML_SAVED' > \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/control-complete.txt\nprintf '%s\\n' 'LATE_STARTED_NOT_PASS' > \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/late-started.txt\ntimeout --signal=TERM --kill-after=30s 8m just test-class G10R5LateBoardBoundedSourceTest --no-daemon --no-build-cache --console=plain 2>&1 | tee \"$ARGENTUM_G10_R5_EVIDENCE_DIR/late.log\"\ntest -s gym/build/test-results/test/TEST-com.wingedsheep.gym.G10R5LateBoardBoundedSourceTest.xml\nmkdir -p \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/late\ncp -a gym/build/test-results/test \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/late/test-results\nif test -d gym/build/reports/tests/test; then cp -a gym/build/reports/tests/test \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/late/test-report; fi\nprintf '%s\\n' 'LATE_XML_SAVED' > \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/late-complete.txt\n"
        },
        {
          "name": "Preserve original excluded success failure timeout and partial evidence",
          "if": "always()",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"\nif test -d ai/build/test-results/test; then cp -a ai/build/test-results/test \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/unclassified-last-ai-results; fi\nif test -d gym/build/test-results/test; then cp -a gym/build/test-results/test \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/unclassified-last-gym-results; fi\nif test -d gym/build/reports/tests/test; then cp -a gym/build/reports/tests/test \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/unclassified-last-gym-report; fi\nprintf '%s\\n' 'Unclassified XML is not proof of test success' > \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/xml-readme.txt\nprintf '%s\\n' 'R5_EXCLUDED_NONOFFICIAL_SYNTHETIC_NOT_G10_G11_OR_FORMAL' > \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/evidence-scope.txt\nfind \"$ARGENTUM_G10_R5_EVIDENCE_DIR\" -maxdepth 6 -type f -printf '%P %s bytes\\n' | sort > \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/inventory.txt\n(cd \"$ARGENTUM_G10_R5_EVIDENCE_DIR\" && find . -type f ! -name payload-sha256.txt -print0 | sort -z | xargs -0 sha256sum) > \"$ARGENTUM_G10_R5_EVIDENCE_DIR\"/payload-sha256.txt\n"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "g10-r5-excluded-source-${{ github.run_id }}-attempt-${{ github.run_attempt }}",
            "path": "${{ env.ARGENTUM_G10_R5_EVIDENCE_DIR }}/",
            "if-no-files-found": "error",
            "overwrite": false,
            "retention-days": 90
          }
        }
      ]
    }
  }
}

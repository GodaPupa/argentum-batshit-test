name: Izzet Bestow Snapshot Synchronization

on:
  push:
    branches:
      - mayhem/izzet-bestow-integration
    paths:
      - .github/workflows/izzet-bestow-snapshot-sync.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: mayhem/izzet-bestow-integration
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Regenerate compiled card snapshots canonically
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true
      - name: Fail closed on unrelated snapshot drift
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n'             mtg-sets/src/test/resources/snapshots/cards/MH3.json             mtg-sets/src/test/resources/snapshots/cards/MMQ.json | sort)"
          test "$changed" = "$expected"
          git diff --check
      - name: Commit canonical Izzet snapshot bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             mtg-sets/src/test/resources/snapshots/cards/MMQ.json             mtg-sets/src/test/resources/snapshots/cards/MH3.json
          git commit -m "Synchronize Izzet Bestow card snapshots"
          git push origin HEAD:mayhem/izzet-bestow-integration

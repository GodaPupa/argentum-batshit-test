name: Izzet historical spell copy qualification
on:
  push:
    branches: [diagnostic/izzet-copy-history-final-20261003]
    paths: [.github/workflows/izzet-copy-history-final-20261003.yml]
permissions:
  contents: read
concurrency:
  group: izzet-copy-history-final-20261003
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/izzet-copy-history-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source-only successor and workflow-only validation child
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['OUT'])
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          source='d5729950a65fb10e0b32424d74c9ccb57ed2dfcf';parent='58e937fdc3776013e572d34e1c261d8799d84a2c';workflow='.github/workflows/izzet-copy-history-final-20261003.yml'
          expected={'docs/architecture-principles.md': '3c2553ba8d866cbbe409addd84641fe078186025', 'docs/experiments/izzet/historical-spell-copy-20261003.md': 'efe6b7f9417ee3663b5141e867d30553816d7a5a', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/core/CardSpecificContinuations.kt': '041259e904239bb75b2cf0675a3b8a907e176f30', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/MiscContinuationResumer.kt': 'd315b261f06b4c9cc5a7b8fa90ffe75ca2af5ba2', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/stack/StormCopyEffectExecutor.kt': '1d3a2229484762a69237a9f6fa5574e695e5f0e4', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt': '7b8e833d228f26d6a4a45783e42597969f9f6e03', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/state/GameState.kt': '5c8d9b521aad7f814559e5c0346ca23790bf800f', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/state/components/stack/SpellCopySnapshot.kt': '25c2ad3c4ca98abba24db6ed75d987594c5da658', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/HistoricalSpellCopyTest.kt': '2b09540293561ba7d851f9a35376d9c43efb064d'}
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==source
          assert git('rev-parse','HEAD^^')==parent
          assert git('rev-parse',source+'^{tree}')=='a4a829f62178b39e32f115c561ecc6382a6cc40d'
          assert git('diff','--name-only',source,'HEAD').splitlines()==[workflow]
          assert git('diff','--name-only',parent,source).splitlines()==sorted(expected)
          assert not git('status','--porcelain')
          for p,blob in expected.items(): assert git('hash-object',p)==blob,p
          binding={'source_head':source,'source_tree':'a4a829f62178b39e32f115c561ecc6382a6cc40d','parent_source_head':parent,
            'validation_head':git('rev-parse','HEAD'),'validation_tree':git('rev-parse','HEAD^{tree}'),
            'source_git_blobs':expected,'source_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected},
            'workflow_sha256':hashlib.sha256(pathlib.Path(workflow).read_bytes()).hexdigest(),
            'scope':'HISTORICAL_SPELL_COPY_SHARED_QUALIFICATION','registry_not_executed':True,'exact_card_admission':False,
            'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
          (out/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          PYCODE
      - name: Compile engine and execute ten historical plus eleven affected copy regressions
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-configuration-cache --console=plain --continue --max-workers=1 \
            -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g \
            :rules-engine:test --tests com.wingedsheep.engine.scenarios.HistoricalSpellCopyTest --tests com.wingedsheep.engine.scenarios.SpellCopyInheritedTargetIdentityTest --tests com.wingedsheep.engine.scenarios.StormCopyInheritsAllDecisionsTest --tests com.wingedsheep.engine.scenarios.StormIllegalTargetFizzleTest --tests com.wingedsheep.engine.scenarios.StormModalRetargetingTest \
            2>&1 | tee "$OUT/qualification.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
          exit "$rc"
      - name: Preserve all actual prerequisite cases and failures; no registry or admission
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,shutil,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
          expected={'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.HistoricalSpellCopyTest.xml': 10, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.SpellCopyInheritedTargetIdentityTest.xml': 4, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.StormCopyInheritsAllDecisionsTest.xml': 3, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.StormIllegalTargetFizzleTest.xml': 2, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.StormModalRetargetingTest.xml': 2}
          suites=[];problems=[]
          for cls,count in expected.items():
            p=pathlib.Path(cls)
            if not p.exists(): problems.append('Missing '+str(p));continue
            shutil.copy2(p,out/p.name)
            root=ET.parse(p).getroot();cases=root.findall('.//testcase')
            totals={k:int(root.get(k,'0')) for k in ('tests','failures','errors','skipped')}
            suites.append({'class':cls,**totals,'actual_cases':len(cases)})
            if totals!={'tests':count,'failures':0,'errors':0,'skipped':0} or len(cases)!=count:
              problems.append(cls+': '+json.dumps(totals)+' actual='+str(len(cases)))
          (out/'summary.json').write_text(json.dumps({'suites':suites,'problems':problems,'expected_tests':sum(expected.values())},indent=2)+'\n')
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          if problems: raise SystemExit('\n'.join(problems))
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: izzet-copy-history-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90


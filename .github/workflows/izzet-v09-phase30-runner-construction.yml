name: Izzet v0.9 Phase 30 Runner Construction

on:
  pull_request:
    paths:
      - "izzet-science/v09-phase30-runner-construction-gate.md"
      - "izzet-science/sim/sampled_pilot_runner.py"
      - "izzet-science/sim/validate_v09_phase30_runner_construction.py"
      - ".github/workflows/izzet-v09-phase30-runner-construction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-phase30:
    if: github.event_name != 'pull_request' || github.head_ref == 'mayhem/izzet-science'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen control and Phase 29 acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'V09_PHASE29_SAMPLED_PILOT_DESIGN_ACCEPTED' izzet-science/v09-phase29-sampled-pilot-design-accepted.md
      - name: Run Phase 30 seed-free runner qualification
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/izzet-science/sim"
          python izzet-science/sim/validate_v09_phase30_runner_construction.py | tee /tmp/phase30.txt
          grep -Fx "V09_PHASE30_RUNNER_CONSTRUCTION_VALIDATION_PASS" /tmp/phase30.txt
      - name: Assert seed-free nonexecution surface
        shell: bash
        run: |
          set -euo pipefail
          ! grep --line-number -E 'secrets\.SystemRandom\(|random\.SystemRandom\(|os\.urandom\(|execute_game\(|run_matchup\(|shuffle\('             izzet-science/sim/sampled_pilot_runner.py             izzet-science/sim/validate_v09_phase30_runner_construction.py
      - name: Emit qualification manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase30-artifact
          cp /tmp/phase30.txt /tmp/phase30-artifact/validation.txt
          {
            echo "schema=izzet-v09-phase30-runner-construction-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "experimental_seeds_generated=0"
            echo "experimental_seeds_consumed=0"
            echo "sampled_games=0"
            echo "outcome_exposure=0"
            sha256sum izzet-science/v09-phase30-runner-construction-gate.md
            sha256sum izzet-science/sim/sampled_pilot_runner.py
            sha256sum izzet-science/sim/validate_v09_phase30_runner_construction.py
            sha256sum /tmp/phase30-artifact/validation.txt
          } > /tmp/phase30-artifact/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-phase30-runner-construction
          path: /tmp/phase30-artifact
          if-no-files-found: error

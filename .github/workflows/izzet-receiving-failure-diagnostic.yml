name: Izzet preserved four-failure passive diagnostic

on:
  push:
    branches: [lab/izzet-receiving-failure-diagnostic-20260926]

permissions:
  contents: read

jobs:
  observe-existing-regressions:
    if: ${{ github.event.before == '0000000000000000000000000000000000000000' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 8b05f2cecee6e992f7eca6d77695040f32901f40
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Preserve passive observations from the unchanged six original cases
        run: python3 control/run.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: izzet-failure-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

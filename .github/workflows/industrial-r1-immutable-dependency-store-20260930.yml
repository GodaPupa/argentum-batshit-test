name: Industrial R1 immutable dependency store construction
on:
  push:
    branches: ["industrial/r1-dependency-store-execute-20260930"]
    paths:
      - "industrial-waste/v2/R1_IMMUTABLE_DEPENDENCY_STORE_EXECUTION_MARKER_20260930.json"
permissions: {contents: read}
jobs:
  construct:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    container:
      image: catthehacker/ubuntu@sha256:7d51b26b65f00d97063cbda95699ee2aee2d4a7362f545ac29a4a18aaba7cfb3
      options: --platform linux/amd64
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Bind exact independently reviewed store constructor
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          REVIEW=industrial-waste/v2/evidence/R1_IMMUTABLE_DEPENDENCY_STORE_IMPLEMENTATION_INDEPENDENT_REVIEW_20260930.json
          MARKER=industrial-waste/v2/R1_IMMUTABLE_DEPENDENCY_STORE_EXECUTION_MARKER_20260930.json
          python3 - "$REVIEW" "$MARKER" <<'PY'
          import json,pathlib,subprocess,sys
          review=json.loads(pathlib.Path(sys.argv[1]).read_text())
          marker=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert review["decision"]=="ACCEPT_IMPLEMENTATION_FOR_ONE_DEPENDENCY_STORE_ORIGINAL"
          assert subprocess.check_output(["git","rev-parse","HEAD^^"],text=True).strip()==review["reviewed_implementation_commit"]
          assert subprocess.check_output(["git","diff","--name-only","HEAD^","HEAD"],text=True).strip()==sys.argv[2]
          assert marker["implementation_review_blob"]==subprocess.check_output(["git","hash-object",sys.argv[1]],text=True).strip()
          for field,path in {
            "budget_blob":"industrial-waste/v2/R1_IMMUTABLE_DEPENDENCY_STORE_BUDGET_20260930.json",
            "init_blob":"industrial-waste/v2/r1-dependency-store-bootstrap.init.gradle",
            "constructor_blob":"industrial-waste/v2/construct_r1_immutable_dependency_store.py",
            "workflow_blob":".github/workflows/industrial-r1-immutable-dependency-store-20260930.yml",
          }.items():
              actual=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert actual==review[field],(field,actual,review[field])
          assert marker["official_counters_delta"]==0
          PY
          test "$(git hash-object gradle/wrapper/gradle-wrapper.properties)" = "a9db11550c6202b666ed9c44cafdc6726fd5b264"
          test "$(git hash-object buildSrc/build.gradle.kts)" = "6f476b8598831073d79a9cee7cc3c43a721650b1"
          test "$(git hash-object buildSrc/settings.gradle.kts)" = "705bfb5e577139e4a0f0c38abfc3749dcf26e12a"
          test "$(git hash-object gradle/libs.versions.toml)" = "1c9d36482bf902b332df50bd2d2332f4d6ad623a"
      - name: Construct and prove exact immutable Gradle input store
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3.10 industrial-waste/v2/construct_r1_immutable_dependency_store.py
          /usr/bin/python3.10 - <<'PY'
          import json,pathlib
          p=pathlib.Path("build/reports/industrial-r1-dependency-store/summary.json")
          r=json.loads(p.read_text())
          assert r["authority"]=="IMMUTABLE_GRADLE_9_6_1_DEPENDENCY_STORE_CANDIDATE_FOR_INDEPENDENT_REVIEW_ONLY"
          assert r["network"]["returncode"]==0
          assert r["offline"]["returncode"]==0
          assert r["store_files"]>0
          assert r["tests_executed"]==0
          assert r["official_seed_files_read"] is False
          assert r["official_counters"]=={"claims":0,"allocations":0,"games":0,"outcomes":0}
          PY
      - name: Preserve immutable dependency store original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-r1-immutable-dependency-store-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/industrial-r1-dependency-store/
            industrial-waste/v2/R1_IMMUTABLE_DEPENDENCY_STORE_BUDGET_20260930.json
            industrial-waste/v2/evidence/R1_IMMUTABLE_DEPENDENCY_STORE_IMPLEMENTATION_INDEPENDENT_REVIEW_20260930.json
            industrial-waste/v2/R1_IMMUTABLE_DEPENDENCY_STORE_EXECUTION_MARKER_20260930.json
          if-no-files-found: error
          retention-days: 90

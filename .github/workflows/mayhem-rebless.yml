name: Project Mayhem Snapshot Bless

on:
  workflow_dispatch:
  push:
    branches: [ "mayhem/project-x" ]

permissions:
  contents: write

jobs:
  rebless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mayhem/project-x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - run: chmod +x gradlew
      - name: Rebless card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true
      - name: Verify snapshot scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          expected="$(printf '%s\n' \\
            mtg-sets/src/test/resources/snapshots/cards/EVE.json \\
            mtg-sets/src/test/resources/snapshots/cards/KHM.json \\
            mtg-sets/src/test/resources/snapshots/cards/MBS.json \\
            mtg-sets/src/test/resources/snapshots/cards/MH1.json \\
            mtg-sets/src/test/resources/snapshots/cards/MH3.json)"
          test "$changed" = "$expected"
      - name: Commit snapshots
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mtg-sets/src/test/resources/snapshots/cards
          git commit -m "Bless Project X card snapshots"
          git push origin HEAD:mayhem/project-x

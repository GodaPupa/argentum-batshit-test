name: Pest Terror Snapshot Rebless
on:
  push:
    branches:
      - pest-control/tier1-mono-blue-terror-card-support-a

permissions:
  contents: read

jobs:
  rebless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Rebless deterministic card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true
      - name: Verify expected snapshot scope
        run: |
          set -euo pipefail
          changed="$(git status --short -- mtg-sets/src/test/resources/snapshots/cards)"
          printf '%s\n' "$changed"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev ' (mtg-sets/src/test/resources/snapshots/cards/(DKA|MH3)\.json)$' || true)"
          test -z "$unexpected"
      - uses: actions/upload-artifact@v7
        with:
          name: pest-terror-reblessed-snapshots
          path: |
            mtg-sets/src/test/resources/snapshots/cards/DKA.json
            mtg-sets/src/test/resources/snapshots/cards/MH3.json
          if-no-files-found: error

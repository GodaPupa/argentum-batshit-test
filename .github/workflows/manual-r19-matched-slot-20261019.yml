name: Manual R19 matched-slot methodology preflight (no games)
on:
  push:
    branches: [gameplay/manual-r19-matched-slot-20261019]
    paths:
      - 'ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualR19MatchedSlotHelper.kt'
      - 'ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualR19MatchedSlotTest.kt'
      - '.github/workflows/manual-r19-matched-slot-20261019.yml'
permissions:
  contents: read
jobs:
  matched-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify frozen deck, prior candidate and three-file test-only scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r19-output
          git rev-parse HEAD > r19-output/source-sha.txt
          git rev-parse HEAD^{tree} > r19-output/tree-sha.txt
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:gameplay/manual-v08-wan/CHALLENGER.decklist.txt)" = "854cedf1f3f789c2ddc49c1f9004f2fa63431851"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          test "$(git rev-parse HEAD:ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualR18WanChallengerHarnessTest.kt)" = "c5dd247102c28465213cc3bb9438c92b0c2a1385"
          git diff --name-only e4dadb7e3da3245ba6ac790dd7995221defe2c0b HEAD > r19-output/changed-files.txt
          test "$(wc -l < r19-output/changed-files.txt)" -eq 3
          while IFS= read -r path; do
            case "$path" in
              ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualR19MatchedSlotHelper.kt|ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualR19MatchedSlotTest.kt|.github/workflows/manual-r19-matched-slot-20261019.yml) ;;
              *) echo "Unexpected R19 change: $path"; exit 1 ;;
            esac
          done < r19-output/changed-files.txt
          chmod +x gradlew scripts/gradle-locked
      - name: Run only R19 decklist-order regressions; NEVER initialize a game
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test --tests '*ManualR19MatchedSlotTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace 2>&1 | tee r19-output/validation.log
      - name: Verify three green JUnit regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          matches=list(Path("ai/build/test-results/test").glob("TEST-*ManualR19MatchedSlotTest*.xml"))
          assert matches, "R19 Kotest JUnit XML missing"
          totals={"tests":0,"failures":0,"errors":0,"skipped":0}
          for p in matches:
              root=ET.parse(p).getroot()
              for k in totals:
                  totals[k]+=int(root.attrib.get(k,0))
          assert totals=={"tests":3,"failures":0,"errors":0,"skipped":0},totals
          print("R19_MATCHED_SLOT_PASS tests=3 failures=0 errors=0 skipped=0 new_games=0")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-r19-matched-slot-evidence
          retention-days: 30
          path: |
            r19-output/
            ai/build/test-results/test/

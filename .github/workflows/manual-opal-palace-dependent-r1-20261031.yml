name: Manual Opal Palace full dependent compatibility R1
on:
  push:
    branches: [validation/manual-opal-palace-dependent-r1-20261031]
    paths: ['.github/workflows/manual-opal-palace-dependent-r1-20261031.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: b470711655da386f0b3913cbbe16befe86d139ee
  SOURCE_TREE: 74975807a951f4389af71db741dabeff9900bd02
  WORKFLOW: .github/workflows/manual-opal-palace-dependent-r1-20261031.yml
  RECORD: experiments/manual-transmission/research/opal-palace-dependent-r1-20261031
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web-client/package-lock.json}
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile then full focused card ordinary client and Assay compatibility
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-opal-palace-dependent-r1-${{ github.run_id }}
          path: manual-opal-palace-dependent-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: Batshit Optimization Experiment C Replication

on:
  workflow_dispatch:
  push:
    branches:
      - 'optimization/experiment-c-replication'

permissions:
  contents: read

jobs:
  paired-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Experiment C replication paired games
        env:
          BATSHIT_OPTIMIZATION_C_REPLICATION: "true"
        run: scripts/test-class BatshitOptimizationExperimentCReplicationTest --info --stacktrace
      - name: Upload Experiment C replication artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batshit-optimization-experiment-c-replication
          path: |
            gym/build/reports/batshit-optimization-c-replication/paired-results.log
            gym/build/reports/batshit-optimization-c-replication/paired-results.jsonl
            gym/build/reports/batshit-optimization-c-replication/batshit-optimization-c-replication-seeds.csv
            gym/src/test/resources/batshit-optimization-c-replication-seeds.csv
          if-no-files-found: warn

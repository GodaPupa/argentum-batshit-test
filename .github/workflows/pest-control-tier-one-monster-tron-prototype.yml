name: Pest Control Tier-1 Monster Tron Prototype Validation

on:
  pull_request:
    paths:
      - mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/core/Keyword.kt
      - mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/KeywordAbility.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/core/GameAction.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/core/Serialization.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/core/LibraryAndZoneContinuations.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/state/components/identity/CardComponents.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/legalactions/LegalActionEnumerator.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/legalactions/enumerators/PrototypeCastEnumerator.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/spell/CastSpellHandler.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/library/CascadeExecutor.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/LibraryAndZoneContinuationResumer.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/ZoneTransitionService.kt
      - mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/bro/cards/BoulderbranchGolem.kt
      - mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/BoulderbranchGolemPrototypeScenarioTest.kt
      - rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/PrototypeKeywordTest.kt
      - rules-engine/src/test/kotlin/com/wingedsheep/engine/hygiene/SerializationPolymorphicRegistrationTest.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonsterTronPrototypeReadinessTest.kt
      - docs/experiments/pest-control/tier-one-monster-tron-prototype.md
      - .github/workflows/pest-control-tier-one-monster-tron-prototype.yml

permissions:
  contents: read

jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate generic Prototype rules and serialization
        run: scripts/test-class PrototypeKeywordTest --info --stacktrace

      - name: Validate polymorphic serialization registration
        run: scripts/test-class SerializationPolymorphicRegistrationTest --info --stacktrace

      - name: Validate Boulderbranch Prototype lifecycle and Cascade interaction
        run: scripts/test-class BoulderbranchGolemPrototypeScenarioTest --info --stacktrace

      - name: Validate exact Monster Tron support closure
        env:
          PEST_MONSTER_TRON_PROTOTYPE_REPORT: ${{ github.workspace }}/build/reports/pest-monster-tron-prototype/report.txt
        run: scripts/test-class PestControlTierOneMonsterTronPrototypeReadinessTest --info --stacktrace

      - name: Regenerate affected BRO golden snapshot for review
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true --info --stacktrace

      - name: Upload regenerated BRO snapshot
        uses: actions/upload-artifact@v7
        with:
          name: pest-control-tier-one-monster-tron-prototype-bro-snapshot
          path: mtg-sets/src/test/resources/snapshots/cards/BRO.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Prototype readiness report
        uses: actions/upload-artifact@v7
        with:
          name: pest-control-tier-one-monster-tron-prototype-readiness
          path: build/reports/pest-monster-tron-prototype/report.txt
          if-no-files-found: error
          retention-days: 90

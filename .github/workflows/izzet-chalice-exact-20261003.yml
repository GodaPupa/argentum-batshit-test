name: Izzet Everflowing Chalice qualification
on:
  push:
    branches: [diagnostic/izzet-chalice-exact-20261003]
    paths: [.github/workflows/izzet-chalice-exact-20261003.yml]
permissions:
  contents: read
concurrency:
  group: izzet-chalice-exact-20261003
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/izzet-chalice-exact-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source-only successor and workflow-only validation child
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['OUT'])
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          source='46625554c6b58cd6874f6799594fe608b6391daa';parent='601e243f617783974b0f36e75363990b94750ee9';workflow='.github/workflows/izzet-chalice-exact-20261003.yml'
          expected={'mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/wwk/cards/EverflowingChalice.kt': '7d0f9588eb4515de175a84ecee4c1965ea732102', 'mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/EverflowingChaliceScenarioTest.kt': '9f0ad6cda447330d91925e91731741a15cceaa84'}
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==source
          assert git('rev-parse','HEAD^^')==parent
          assert git('rev-parse',source+'^{tree}')=='eb6bf489768a6d91c7465f7163aa0730937d9318'
          assert git('diff','--name-only',source,'HEAD').splitlines()==[workflow]
          assert git('diff','--name-only',parent,source).splitlines()==sorted(expected)
          assert not git('status','--porcelain')
          for p,blob in expected.items(): assert git('hash-object',p)==blob,p
          binding={'source_head':source,'source_tree':'eb6bf489768a6d91c7465f7163aa0730937d9318','parent_source_head':parent,
            'validation_head':git('rev-parse','HEAD'),'validation_tree':git('rev-parse','HEAD^{tree}'),
            'source_git_blobs':expected,'source_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected},
            'workflow_sha256':hashlib.sha256(pathlib.Path(workflow).read_bytes()).hexdigest(),
            'scope':'EVERFLOWING_CHALICE_EXACT_QUALIFICATION','registry_not_executed':True,'exact_card_admission':False,
            'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
          (out/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          PYCODE
      - name: Compile repeated-cost primitive and exact Everflowing Chalice scenarios
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-configuration-cache --console=plain --continue --max-workers=1 \
            -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g \
            :rules-engine:test --tests com.wingedsheep.engine.scenarios.RepeatedOptionalCostTest :mtg-sets:2008-2016:tests:test --tests com.wingedsheep.engine.scenarios.EverflowingChaliceScenarioTest \
            2>&1 | tee "$OUT/qualification.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
          exit "$rc"
      - name: Preserve primary metadata if available
        if: always()
        shell: bash
        run: |
          curl --fail --location --max-time 30 --retry 1 -H 'User-Agent: ArgentumQualification/1.0' https://api.scryfall.com/cards/wwk/123 -o "$OUT/everflowing-chalice-scryfall.json" || true
      - name: Preserve all actual prerequisite cases and failures; no registry or admission
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,shutil,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
          expected={'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.RepeatedOptionalCostTest.xml': 12, 'mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.EverflowingChaliceScenarioTest.xml': 10}
          suites=[];problems=[]
          for cls,count in expected.items():
            p=pathlib.Path(cls)
            if not p.exists(): problems.append('Missing '+str(p));continue
            shutil.copy2(p,out/p.name)
            root=ET.parse(p).getroot();cases=root.findall('.//testcase')
            totals={k:int(root.get(k,'0')) for k in ('tests','failures','errors','skipped')}
            suites.append({'class':cls,**totals,'actual_cases':len(cases)})
            if totals!={'tests':count,'failures':0,'errors':0,'skipped':0} or len(cases)!=count:
              problems.append(cls+': '+json.dumps(totals)+' actual='+str(len(cases)))
          (out/'summary.json').write_text(json.dumps({'suites':suites,'problems':problems,'expected_tests':sum(expected.values())},indent=2)+'\n')
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          if problems: raise SystemExit('\n'.join(problems))
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: izzet-chalice-exact-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90


name: Face Value v1.3 Lorien Cut Isolation
on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-v13-lorien-cut-isolation.yml]
permissions: {contents: read}
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Build Forge
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src rev-parse HEAD | tee forge-source-commit.txt
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res && cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"
      - name: Freeze matched variants
        run: |
          mkdir -p decks "$HOME/.forge/decks/constructed"
          cat > /tmp/base <<'EOF'
          4 Llanowar Elves
          4 Nest Invader
          4 Eldrazi Repurposer
          1 Eyeless Watcher
          4 Wretched Gryff
          2 It of the Horrid Swarm
          2 Annoyed Altisaur
          1 Drownyard Lurker
          1 Nyxborn Hydra
          3 Generous Ent
          4 Malevolent Rumble
          4 Preordain
          2 Snap
          1 Lose Focus
          1 Tamiyo's Safekeeping
          2 Growth Spasm
          9 Forest
          8 Island
          3 Tangled Islet
          EOF
          mk(){ n="$1"; body="$2"; { printf '[metadata]\nName=%s\nDeck Type=constructed\n[main]\n' "$n"; cat "$body"; } > "decks/$n.dck"; }
          cp /tmp/base /tmp/control; mk 'FV v1.2 Control' /tmp/control
          sed -e '/1 Eyeless Watcher/d' -e 's/2 Growth Spasm/1 Growth Spasm/' /tmp/base > /tmp/A; echo '2 Lórien Revealed' >> /tmp/A; mk 'FV Lorien A Watcher Spasm' /tmp/A
          sed -e 's/3 Generous Ent/2 Generous Ent/' -e 's/2 Growth Spasm/1 Growth Spasm/' /tmp/base > /tmp/B; echo '2 Lórien Revealed' >> /tmp/B; mk 'FV Lorien B Ent Spasm' /tmp/B
          sed -e 's/3 Generous Ent/1 Generous Ent/' /tmp/base > /tmp/C; echo '2 Lórien Revealed' >> /tmp/C; mk 'FV Lorien C Two Ent' /tmp/C
          cat > 'decks/Mono Red Madness.dck' <<'EOF'
          [metadata]
          Name=Mono Red Madness
          Deck Type=constructed
          [main]
          4 Voldaren Epicure
          4 Kitchen Imp
          4 Sneaky Snacker
          4 Fiery Temper
          4 Lightning Bolt
          4 Chain Lightning
          4 Faithless Looting
          4 Demand Answers
          4 Grab the Prize
          4 Highway Robbery
          4 Fireblast
          16 Mountain
          EOF
          cp decks/*.dck "$HOME/.forge/decks/constructed/"
          seq 1210001 1210030 > seeds.txt
          sha256sum seeds.txt decks/*.dck > inputs.sha256
      - name: Run four-way matched screen
        run: |
          set -euo pipefail
          mkdir -p logs/control logs/A logs/B logs/C
          while read seed; do
            "$FORGE_LAUNCHER" sim -d 'FV v1.2 Control.dck' 'Mono Red Madness.dck' -n 1 -s "$seed" -c 300 > "logs/control/$seed.log" 2>&1
            "$FORGE_LAUNCHER" sim -d 'FV Lorien A Watcher Spasm.dck' 'Mono Red Madness.dck' -n 1 -s "$seed" -c 300 > "logs/A/$seed.log" 2>&1
            "$FORGE_LAUNCHER" sim -d 'FV Lorien B Ent Spasm.dck' 'Mono Red Madness.dck' -n 1 -s "$seed" -c 300 > "logs/B/$seed.log" 2>&1
            "$FORGE_LAUNCHER" sim -d 'FV Lorien C Two Ent.dck' 'Mono Red Madness.dck' -n 1 -s "$seed" -c 300 > "logs/C/$seed.log" 2>&1
          done < seeds.txt
      - name: Audit
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          names={'control':'FV v1.2 Control','A':'FV Lorien A Watcher Spasm','B':'FV Lorien B Ent Spasm','C':'FV Lorien C Two Ent'}
          out={}
          for cfg,name in names.items():
            rr=[]
            for p in sorted((Path('logs')/cfg).glob('*.log')):
              t=p.read_text(errors='replace')
              if re.search(r'Ai\(1\)-'+re.escape(name)+r' has won!',t): w='face'
              elif 'Ai(2)-Mono Red Madness has won!' in t: w='red'
              elif 'ended in a Draw' in t: w='draw'
              else: w='unknown'
              rr.append({'seed':int(p.stem),'winner':w,
                'lorien_casts':len(re.findall(r'cast L(?:o|ó)rien Revealed',t)),
                'lorien_cycles':len(re.findall(r'activated L(?:o|ó)rien Revealed',t)),
                'gryff_emerge':len(re.findall(r'Wretched Gryff - Creature 3 / 4 \(Emerge\)',t)),
                'bad':bool(re.search(r'StackOverflowError|TimeoutException|Stopping slow match as draw',t))})
            out[cfg]={'games':len(rr),'wins':sum(x['winner']=='face' for x in rr),'losses':sum(x['winner']=='red' for x in rr),
              'draws':sum(x['winner']=='draw' for x in rr),'unknown':sum(x['winner']=='unknown' for x in rr),
              'lorien_casts':sum(x['lorien_casts'] for x in rr),'lorien_cycles':sum(x['lorien_cycles'] for x in rr),
              'gryff_emerge':sum(x['gryff_emerge'] for x in rr),'bad':sum(x['bad'] for x in rr),'records':rr}
          Path('summary.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps({k:{kk:vv for kk,vv in v.items() if kk!='records'} for k,v in out.items()},indent=2))
          for k,v in out.items(): assert v['games']==30 and v['unknown']==0 and v['bad']==0,(k,v)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: face-value-v13-lorien-cut-isolation
          path: |
            summary.json
            seeds.txt
            inputs.sha256
            logs/**/*.log
            decks/*.dck
            forge-source-commit.txt

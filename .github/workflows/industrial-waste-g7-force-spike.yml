name: Industrial Waste — Force Spike Capability

on:
  push:
    branches: [industrial-waste/lab]
    paths:
      - .github/workflows/industrial-waste-g7-force-spike.yml
      - mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/leg/cards/ForceSpike.kt
      - mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ForceSpikeScenarioTest.kt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  force-spike-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Force Spike scenario
        run: ./gradlew :mtg-sets:1993-1999:tests:test --tests '*ForceSpikeScenarioTest' --no-daemon

# Gate 7 Force Spike capability trigger

name: Sphinx Lorien cycling receiving
on:
  push:
    branches: ["sphinx/whole-actor-surface-inventory-20260928"]
    paths: [".github/workflows/sphinx-lorien-cycling-receiving.yml"]
permissions: {contents: read}
jobs:
  two-decks:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact Lorien receiving sources and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/sphinx-lorien-cycling-receiving
          test "$(git rev-parse HEAD^)" = "577cb48b392f88096c64b2cae640f8930772ed30"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageELorienCyclingReceivingTest.kt)" = "69adf0683127359ea79722b86acb386fe49afd05"
          test "$(git hash-object sphinx-approach/STAGE_E_LORIEN_CYCLING_RECEIVING_BUDGET_20260929.json)" = "d046a7656089e759b66ee10b1c28ce30c382b1a0"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEVisibleChoice.kt)" = "3ffb0c200de6f2e1f554f7296fe343a27788ba6c"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEActorAdapter.kt)" = "20865204fec378f37045c54993ac1a85c3acac00"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageELorienCyclingReceivingTest.kt; git hash-object sphinx-approach/STAGE_E_LORIEN_CYCLING_RECEIVING_BUDGET_20260929.json; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEVisibleChoice.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEActorAdapter.kt; git hash-object .github/workflows/sphinx-lorien-cycling-receiving.yml; git status --porcelain; } > build/reports/sphinx-lorien-cycling-receiving/source.txt
      - name: Run two fresh Lorien receiving traces
        shell: bash
        run: |
          set -o pipefail
          just test-class SphinxStageELorienCyclingReceivingTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/sphinx-lorien-cycling-receiving/test.log
      - name: Preserve XML
        if: always()
        shell: bash
        run: |
          find . -path '*/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageELorienCyclingReceivingTest.xml' -type f -print -exec cp {} build/reports/sphinx-lorien-cycling-receiving/ \; || true
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-lorien-cycling-receiving-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-lorien-cycling-receiving/
          if-no-files-found: error
          retention-days: 90

name: Batshit Optimization Experiment B

on:
  workflow_dispatch:
  push:
    branches:
      - 'optimization/experiment-b'

permissions:
  contents: read

jobs:
  paired-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Experiment B paired games
        env:
          BATSHIT_OPTIMIZATION_B: "true"
        run: scripts/test-class BatshitOptimizationExperimentBTest --info --stacktrace
      - name: Upload Experiment B artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batshit-optimization-experiment-b
          path: |
            gym/build/reports/batshit-optimization-b/paired-results.log
            gym/build/reports/batshit-optimization-b/paired-results.jsonl
            gym/build/reports/batshit-optimization-b/batshit-optimization-b-seeds.csv
            gym/src/test/resources/batshit-optimization-b-seeds.csv
          if-no-files-found: warn

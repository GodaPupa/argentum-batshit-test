name: Izzet Position-1 Engine Batch G

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-g.yml"

permissions:
  contents: read

jobs:
  qualify-batch-g:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch G gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'V07_DECK_AUDIT_NO_CHANGE' izzet-science/v07-deck-level-audit-no-change.md
          grep -Fq 'V09_CARD_CONTROL_ARCHITECTURE_AUDIT_KEEP_V07' izzet-science/v09-card-control-architecture-audit.md
          grep -Fq 'Live unresolved count is exactly 46' izzet-science/v09-position1-engine-batch-g-gate.md

      - name: Requalify canonical card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --stacktrace

      - name: Run Izzet Guildmage semantics
        run: scripts/test-class IzzetGuildmageScenarioTest --info --stacktrace

      - name: Run exact real-engine coverage regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-g.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=46' /tmp/batch-g.txt
          ! grep -Fq 'unresolved Izzet card: Izzet Guildmage' /tmp/batch-g.txt

      - name: Assert official experiment remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt

      - name: Emit Batch G manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izzet-batch-g
          cp /tmp/batch-g.txt /tmp/izzet-batch-g/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-g-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "frozen_control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "implemented=Izzet Guildmage;CopyTargetSpellEffect;capped-controller-filtered instant+sorcery copy"
            echo "unresolved_before=47"
            echo "unresolved_after=46"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/gpt/cards/IzzetGuildmage.kt
            sha256sum mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/IzzetGuildmageScenarioTest.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/v09-position1-engine-batch-g-gate.md
            sha256sum mtg-sets/src/test/resources/snapshots/cards/GPT.json
            sha256sum /tmp/izzet-batch-g/test-output.txt
          } > /tmp/izzet-batch-g/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-g
          path: /tmp/izzet-batch-g
          if-no-files-found: error

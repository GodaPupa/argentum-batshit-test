name: Manual Fblthp entry origin early R3
on:
  push:
    branches: [validation/manual-fblthp-entry-origin-early-r3-20261029]
    paths: ['.github/workflows/manual-fblthp-entry-origin-early-r3-20261029.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: bad842502afdb8d4150cbef84bc1c7942666f193
  SOURCE_TREE: 7a32c0d3b3a96c90733de57316892bdf5f54509c
  WORKFLOW: .github/workflows/manual-fblthp-entry-origin-early-r3-20261029.yml
  RECORD: experiments/manual-transmission/research/fblthp-entry-origin-early-r3-20261029
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile nine forms then exact entry-origin and registration controls
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-fblthp-entry-origin-early-r3-${{ github.run_id }}
          path: manual-fblthp-entry-origin-early-r3-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

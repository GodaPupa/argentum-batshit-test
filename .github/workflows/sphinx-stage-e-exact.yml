name: Sphinx Stage E Exact Card Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/sphinx-stage-e-exact.yml'
      - 'sphinx-approach/**'
      - 'mtg-sdk/**'
      - 'rules-engine/**'
      - 'mtg-sets/2026/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/fra/**'
      - 'mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ulg/cards/Snap.kt'
      - 'mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/wwk/cards/GoliathSphinx.kt'
      - 'mtg-sets/**/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/SphinxsApproachScenarioTest.kt'
      - 'mtg-sets/**/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/GoliathSphinxScenarioTest.kt'
      - 'mtg-sets/**/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/SnapScenarioTest.kt'
      - 'mtg-sets/src/test/resources/snapshots/cards/FRA.json'
      - 'mtg-sets/src/test/resources/snapshots/cards/ULG.json'
      - 'mtg-sets/src/test/resources/snapshots/cards/WWK.json'

permissions:
  contents: read

concurrency:
  group: sphinx-stage-e-exact-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  exact-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: '-XX:MaxMetaspaceSize=768m'
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.workers.max=1
        -Dorg.gradle.daemon=false
        -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.project.kotlinCompileParallelism=1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'
      - name: Record exact combined source
        env:
          REQUESTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          RECEIVING_BASE_HEAD: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --exit-code
          mkdir -p sphinx-stage-e-artifact
          git rev-parse HEAD > sphinx-stage-e-artifact/runtime-head.txt
          git rev-parse 'HEAD^{tree}' > sphinx-stage-e-artifact/runtime-tree.txt
          printf '%s\n' "$REQUESTED_SOURCE_HEAD" > sphinx-stage-e-artifact/requested-source-head.txt
          printf '%s\n' "$RECEIVING_BASE_HEAD" > sphinx-stage-e-artifact/receiving-base-head.txt
      - name: Qualify exact card mechanics and atomic serialization
        run: |
          set -o pipefail
          just test-class SphinxsApproachScenarioTest \
            :mtg-sets:1993-1999:tests:test --tests SnapScenarioTest \
            :mtg-sets:2008-2016:tests:test --tests GoliathSphinxScenarioTest \
            :mtg-sdk:test --tests CardLinterTest \
            :rules-engine:test --tests MoveSourceAndExactCardsExecutorTest \
            --tests SerializationPolymorphicRegistrationTest \
            -Dorg.gradle.jvmargs=-Xmx4g -Pkotlin.compiler.execution.strategy=in-process \
            -PkotlinCompileParallelism=1 --max-workers=1 \
            2>&1 | tee sphinx-stage-e-artifact/exact-tests.log
      - name: Generate ordinary card snapshots
        run: |
          set -o pipefail
          just rebless-cards 2>&1 | tee sphinx-stage-e-artifact/snapshot-generation.log
      - name: Reject unrelated snapshot drift and collect generated bytes
        run: python sphinx-approach/collect-card-qualification.py
      - name: Verify generated snapshots and corpus lint
        run: |
          set -o pipefail
          just test-class CardDefinitionSnapshotTest --tests CardLintTest \
            -Dorg.gradle.jvmargs=-Xmx4g -Pkotlin.compiler.execution.strategy=in-process \
            -PkotlinCompileParallelism=1 --max-workers=1 \
            2>&1 | tee sphinx-stage-e-artifact/snapshot-verification.log
      - name: Preserve success or failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-stage-e-card-qualification-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          path: |
            sphinx-stage-e-artifact/
            mtg-sets/2026/tests/build/test-results/test/*.xml
            mtg-sets/1993-1999/tests/build/test-results/test/*.xml
            mtg-sets/2008-2016/tests/build/test-results/test/*.xml
            mtg-sdk/build/test-results/test/*.xml
            rules-engine/build/test-results/test/*.xml
            mtg-sets/build/test-results/test/*.xml

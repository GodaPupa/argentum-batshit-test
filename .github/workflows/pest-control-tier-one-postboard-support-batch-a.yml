name: Pest Control Tier-1 Postboard Support Batch A

on:
  pull_request:
    paths:
      - .github/workflows/pest-control-tier-one-postboard-support-batch-a.yml
      - docs/experiments/pest-control/tier-one-postboard-support-batch-a*
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOnePostboardSupportBatchATest.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonoBlueTerrorReadinessTest.kt
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonoBlueTerrorReadiness.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneSpyComboSupportBatchBTest.kt
      - '**/SmashToSmithereens.kt'
      - '**/SmashToSmithereensScenarioTest.kt'
      - '**/UnexpectedFangs.kt'
      - '**/UnexpectedFangsScenarioTest.kt'
      - '**/MurmuringMystic.kt'
      - '**/MurmuringMysticScenarioTest.kt'
      - '**/NyleasDisciple.kt'
      - '**/NyleasDiscipleScenarioTest.kt'
      - mtg-sets/src/test/resources/snapshots/cards/SHM.json
      - mtg-sets/src/test/resources/snapshots/cards/IKO.json
      - mtg-sets/src/test/resources/snapshots/cards/GRN.json
      - mtg-sets/src/test/resources/snapshots/cards/THS.json

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind source and preserve every existing snapshot block
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path('.')
          out = root / 'build/reports/pest-postboard-support-batch-a'
          out.mkdir(parents=True, exist_ok=True)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['EXPECTED_HEAD']
          manifest_path = root / 'docs/experiments/pest-control/tier-one-postboard-support-batch-a-sources.json'
          manifest = json.loads(manifest_path.read_text())
          integrated_main = manifest['integration_main_commit']
          subprocess.check_call(['git', 'merge-base', '--is-ancestor', integrated_main, head])
          for path, digest in manifest['source_files_sha256'].items():
              assert hashlib.sha256((root / path).read_bytes()).hexdigest() == digest, path
          snapshot_results = {}
          def blocks(raw):
              result = {}
              for block in re.split(r'(?m)^// ', raw)[1:]:
                  name, body = block.split('\n', 1)
                  assert name not in result, name
                  json.loads(body)
                  result[name] = body.rstrip('\n')
              return result
          for code, added_name in manifest['snapshot_additions'].items():
              path = f'mtg-sets/src/test/resources/snapshots/cards/{code}.json'
              before = blocks(subprocess.check_output(['git', 'show', manifest['base_commit'] + ':' + path], text=True))
              after = blocks((root / path).read_text())
              assert set(after) - set(before) == {added_name}, code
              assert set(before) <= set(after), code
              assert all(after[name] == body for name, body in before.items()), code
              snapshot_results[code] = {'unchanged_existing_blocks': len(before), 'added': added_name}
          provenance = {
              'schema': 'pest-postboard-support-batch-a-provenance-v1',
              'candidate_head': head,
              'base_commit': manifest['base_commit'],
              'integrated_main_commit': integrated_main,
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'github_event_name': os.environ['GITHUB_EVENT_NAME'],
              'source_manifest_sha256': hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              'source_files_sha256': manifest['source_files_sha256'],
              'snapshot_preservation': snapshot_results,
              'official_seeds_generated': 0, 'official_games_initialized': 0,
              'official_actions_submitted': 0, 'outcome_exposure': 0,
              'scope': 'DETERMINISTIC_CARD_AND_REGISTRY_VALIDATION_ONLY',
          }
          (out / 'source-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          (out / 'card-sources.json').write_bytes(manifest_path.read_bytes())
          print(json.dumps(provenance, indent=2))
          PY
      - name: Qualify card behavior, strict snapshots, and frozen sideboard coverage
        env:
          PEST_POSTBOARD_BATCH_A_REPORT: ${{ github.workspace }}/build/reports/pest-postboard-support-batch-a/batch-report.txt
          PEST_POSTBOARD_SUPPORT_REPORT: ${{ github.workspace }}/build/reports/pest-postboard-support-batch-a/full-inventory.txt
        run: |
          set -uo pipefail
          run_stage() {
            local stage="$1" test_class="$2" module="$3" status=0
            scripts/test-class "$test_class" --info --stacktrace || status=$?
            local dest="build/reports/pest-postboard-support-batch-a/tests/$stage"
            mkdir -p "$dest" || return 1
            if [ -d "$module/build/test-results/test" ]; then
              cp -R "$module/build/test-results/test/." "$dest/" || return 1
            else
              printf '%s\n' "Missing XML for $test_class" >&2
              return 1
            fi
            printf '%s\n' "$status" > "$dest/exit-status.txt" || return 1
            return "$status"
          }
          failed=0
          run_stage smash SmashToSmithereensScenarioTest mtg-sets/2008-2016/tests || failed=1
          run_stage fangs UnexpectedFangsScenarioTest mtg-sets/2017-2022/tests || failed=1
          run_stage mystic MurmuringMysticScenarioTest mtg-sets/2017-2022/tests || failed=1
          run_stage disciple NyleasDiscipleScenarioTest mtg-sets/2008-2016/tests || failed=1
          run_stage snapshots CardDefinitionSnapshotTest mtg-sets || failed=1
          run_stage lint CardLintTest mtg-sets || failed=1
          run_stage mono-blue-readiness PestControlTierOneMonoBlueTerrorReadinessTest gym || failed=1
          run_stage spy-b-compatibility PestControlTierOneSpyComboSupportBatchBTest gym || failed=1
          run_stage batch-coverage PestControlTierOnePostboardSupportBatchATest gym || failed=1
          run_stage full-inventory PestControlTierOnePostboardSupportAuditTest gym || failed=1
          exit "$failed"
      - name: Preserve complete validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-control-tier-one-postboard-support-batch-a
          path: build/reports/pest-postboard-support-batch-a/
          if-no-files-found: error
          retention-days: 90

name: Pest Phase-B final gate compile and static validation only
on:
  push:
    branches: ["validation/pest-phase-b-final-gate-20261001"]
    paths: [".github/workflows/pest-phase-b-final-gate-validation-20261001.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: catthehacker/ubuntu@sha256:7d51b26b65f00d97063cbda95699ee2aee2d4a7362f545ac29a4a18aaba7cfb3
      options: --platform linux/amd64
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64
      GRADLE_USER_HOME: /tmp/pest-phase-b-final-gate-${{ github.run_id }}
      EVIDENCE: /tmp/pest-phase-b-final-gate-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2029d61690a17bc4b730e61d15b609d0db5df124
          fetch-depth: 0
          persist-credentials: false
      - name: Validate gate structure and compile without behavior
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = 2029d61690a17bc4b730e61d15b609d0db5df124
          test ! -e "$GRADLE_USER_HOME" && test ! -L "$GRADLE_USER_HOME"
          test ! -e "$EVIDENCE" && mkdir "$EVIDENCE"
          /usr/bin/python3.10 -I -S scripts/experiments/pest-control/verify_phase_b_complete_bank_gate.py --plan docs/experiments/pest-control/PHASE_B_COMPLETE_BANK_GATE_20261001.json --mode implementation --implementation 2029d61690a17bc4b730e61d15b609d0db5df124
          git rev-parse HEAD HEAD^{tree} > "$EVIDENCE/source.txt"
          git diff --name-status a56aa9dc164cf06ad7e826a9d96d4d624fec4412..HEAD > "$EVIDENCE/gate-diff.txt"
          cat > "$EVIDENCE/compile-only.init.gradle" <<'GROOVY'
          import org.gradle.api.tasks.testing.Test
          import org.gradle.api.tasks.JavaExec
          gradle.taskGraph.whenReady { graph ->
              def forbidden=graph.allTasks.findAll { it instanceof Test || it instanceof JavaExec }
              if (!forbidden.empty) throw new GradleException('forbidden behavioral task: '+forbidden*.path)
              println 'PEST_FINAL_GATE_COMPILE_ONLY'
          }
          GROOVY
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain -I "$EVIDENCE/compile-only.init.gradle" :gym:compileTestKotlin 2>&1 | tee "$EVIDENCE/compile.log"
          test -z "$(git status --porcelain --untracked-files=all)"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-phase-b-final-gate-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: warn
          retention-days: 90

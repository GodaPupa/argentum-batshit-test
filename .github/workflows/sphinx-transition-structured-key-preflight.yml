name: Sphinx structured-key journal static preflight
on:
  push:
    branches: ["sphinx/accepted-transition-journal-20260928"]
    paths:
      - ".github/workflows/sphinx-transition-structured-key-preflight.yml"
permissions:
  contents: read
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind changed serializer and unchanged fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/sphinx-structured-key-preflight
          test "$(git rev-parse HEAD^)" = "ba45cf4a5143b58d7daba78ba632c54dbe85e098"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt)" = "39da11cc7ad37a340d4f7d383bad9cab57c9811e"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournalTest.kt)" = "29c0060b374cb7697a5250c87c5ea41ad3abd7a1"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournalTest.kt; git hash-object .github/workflows/sphinx-transition-structured-key-preflight.yml; git status --porcelain; } > build/reports/sphinx-structured-key-preflight/source.txt
      - name: Compile serializer change without behavioral cases
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:compileTestKotlin --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/sphinx-structured-key-preflight/compile.log
      - name: Preserve original static evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-structured-key-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-structured-key-preflight/
          if-no-files-found: error
          retention-days: 90

name: Face Value EDH R2-A/B/C Validation
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: face-value-edh/r1-reconstruction
      - name: Revalidate R2-A
        run: python3 research/face-value-edh/validate_r2a.py
      - name: Revalidate R2-B
        run: python3 research/face-value-edh/validate_r2b.py
      - name: Validate R2-C pilot totality and cross-regression
        run: python3 research/face-value-edh/validate_r2c.py

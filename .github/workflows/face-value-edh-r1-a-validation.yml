name: Face Value EDH R1-A/B/C/D Validation
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: face-value-edh/r1-reconstruction
      - name: R1-A positive fixture must validate
        run: python3 research/face-value-edh/validate_r1_fixture.py research/face-value-edh/fixtures/r1-schema-valid.json
      - name: R1-A negative fixture must fail closed
        run: |
          if python3 research/face-value-edh/validate_r1_fixture.py research/face-value-edh/fixtures/r1-failclosed-invalid.json; then exit 1; fi
      - name: R1-B five mandatory surfaces must validate
        run: |
          set -euo pipefail
          for f in research/face-value-edh/fixtures/r1b-ordinary-cast.json research/face-value-edh/fixtures/r1b-targeted-interaction.json research/face-value-edh/fixtures/r1b-stack-priority.json research/face-value-edh/fixtures/r1b-commander-unavailable.json research/face-value-edh/fixtures/r1b-food-chain-pressure.json; do
            python3 research/face-value-edh/validate_r1_fixture.py "$f"
          done
      - name: R1-C deterministic replay must match
        run: python3 research/face-value-edh/r1_replay.py
      - name: R1-D structural identity and historical serialization probe
        run: |
          set +e
          python3 research/face-value-edh/verify_r1d_identity.py
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "Structural identity passed; historical byte serialization not yet reproduced."
            exit 3
          fi
          exit "$rc"

name: Face Value EDH R2-A/B Validation
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: face-value-edh/r1-reconstruction
      - name: Revalidate R2-A contract
        run: python3 research/face-value-edh/validate_r2a.py
      - name: Validate R2-B commander denial and stack readiness
        run: python3 research/face-value-edh/validate_r2b.py
      - name: Preserve R1 deterministic regression floor
        run: python3 research/face-value-edh/r1_replay.py

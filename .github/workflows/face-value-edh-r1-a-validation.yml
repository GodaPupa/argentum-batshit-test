name: Face Value EDH R1-A/B Validation
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: face-value-edh/r1-reconstruction
      - name: R1-A positive fixture must validate
        run: python3 research/face-value-edh/validate_r1_fixture.py research/face-value-edh/fixtures/r1-schema-valid.json
      - name: R1-A negative fixture must fail closed
        run: |
          if python3 research/face-value-edh/validate_r1_fixture.py research/face-value-edh/fixtures/r1-failclosed-invalid.json; then
            echo "negative fixture incorrectly accepted"
            exit 1
          fi
          echo "negative fixture rejected as required"
      - name: R1-B five mandatory surfaces must validate
        run: |
          set -euo pipefail
          for f in             research/face-value-edh/fixtures/r1b-ordinary-cast.json             research/face-value-edh/fixtures/r1b-targeted-interaction.json             research/face-value-edh/fixtures/r1b-stack-priority.json             research/face-value-edh/fixtures/r1b-commander-unavailable.json             research/face-value-edh/fixtures/r1b-food-chain-pressure.json
          do
            python3 research/face-value-edh/validate_r1_fixture.py "$f"
          done

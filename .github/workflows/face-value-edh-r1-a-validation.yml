name: Face Value EDH R2-A Validation
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: face-value-edh/r1-reconstruction
      - name: Validate R2-A protocol and runner contract
        run: python3 research/face-value-edh/validate_r2a.py
      - name: Preserve R1 regression floor
        run: |
          python3 research/face-value-edh/validate_r1_fixture.py research/face-value-edh/fixtures/r1-schema-valid.json
          if python3 research/face-value-edh/validate_r1_fixture.py research/face-value-edh/fixtures/r1-failclosed-invalid.json; then exit 1; fi
          python3 research/face-value-edh/r1_replay.py

name: Ferocity current source08 Java provenance recovery
on:
  push:
    branches: ["ferocity/current-java-provenance-recovery-20260929"]
    paths: [".github/workflows/ferocity-current-java-provenance-recovery.yml"]
permissions: {contents: read}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - name: Bind exact archive parser budget and parent
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/ferocity-current-java-provenance
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD^)" = "748ae2dcab2dd68d67d3fb33a7828b0737b2c569"
          test "$(git hash-object ferocity-recycling/evidence/source08-takeover/publication-manifest.json)" = "262f78d820ac8834d796d3cc634bf45bbb155cf6"
          test "$(git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/CURRENT_SOURCE08_JAVA_PROVENANCE_RECOVERY_BUDGET_V2.json)" = "851fe4d6c661d13f94da57138c5d1e3689623471"
          test "$(git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/recover_current_source08_java_provenance.py)" = "15afc5797050897adc6dc3e443efbba60f558e91"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object ferocity-recycling/evidence/source08-takeover/publication-manifest.json
            git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/CURRENT_SOURCE08_JAVA_PROVENANCE_RECOVERY_BUDGET_V2.json
            git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/recover_current_source08_java_provenance.py
            git hash-object .github/workflows/ferocity-current-java-provenance-recovery.yml
            git status --porcelain
          } > "$OUT/source.txt"
      - name: Recover recorded Java provenance from preserved artifact only
        shell: bash
        run: |
          set -euo pipefail
          python3 ferocity-recycling/support-audits/source08-policy-selection-20260928/recover_current_source08_java_provenance.py | tee build/reports/ferocity-current-java-provenance/run.log
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ferocity-current-java-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/ferocity-current-java-provenance/
          if-no-files-found: error
          retention-days: 90

name: Pest Monster London setup bridge static preflight
on:
  push:
    branches: ["pest/c2-pair-pilot-seam-20260927"]
    paths:
      - ".github/workflows/pest-monster-london-setup-bridge-preflight.yml"
      - "gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonSetupBridge.kt"
      - "gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonSetupBridgeTest.kt"

permissions:
  contents: read

jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind source and original receipt parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-london-setup-bridge-preflight
          test "$(git rev-parse HEAD^)" = "401f5229eab7a500057e6c0b6c70260b3b22e5b6"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonSetupBridge.kt)" = "3dfaf5a1a560e8f5c30ab34de1c2583656832251"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonSetupBridgeTest.kt)" = "8443b15e67f74a32900ec0d94d8f0529907fe6d0"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonLoadedMainBinding.kt)" = "6c0ae894219822a48307d5847ca5e4e4aa9e23f1"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/actorinput/PestMonsterLondonForestCertificate.kt)" = "8ba646f1c9edd256e8b8915f8da22788cf1ab8ab"
          test -x gradlew
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonSetupBridge.kt
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonSetupBridgeTest.kt
            git hash-object .github/workflows/pest-monster-london-setup-bridge-preflight.yml
            git status --porcelain
          } > build/reports/pest-london-setup-bridge-preflight/source.txt
      - name: Compile without executing behavior
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:compileTestKotlin --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-london-setup-bridge-preflight/compile.log
          test -f gym/build/classes/kotlin/main/com/wingedsheep/gym/matchup/PestMonsterLondonSetupBridge.class
          test -f gym/build/classes/kotlin/test/com/wingedsheep/gym/matchup/PestMonsterLondonSetupBridgeTest.class
          test ! -e gym/build/test-results/test/TEST-com.wingedsheep.gym.matchup.PestMonsterLondonSetupBridgeTest.xml
      - name: Retain original compile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-london-setup-bridge-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-london-setup-bridge-preflight/
          if-no-files-found: error
          retention-days: 90

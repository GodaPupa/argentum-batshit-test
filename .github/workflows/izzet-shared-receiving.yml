name: Izzet exact shared receiving original banks

on:
  push:
    branches: [lab/izzet-shared-receiving-qualification-20260927]

permissions:
  contents: read

jobs:
  original-deterministic-banks:
    if: ${{ github.event.before == '0000000000000000000000000000000000000000' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 60d2d6f6412d1f4e9238ca0c84755c34cd31f8d5
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Execute original deterministic receiving banks on exact immutable source
        run: python3 control/izzet-receiving-qualification.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: izzet-shared-receiving-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: Pest Control Tier-1 Grixis Admission Gate

on:
  pull_request:
    paths:
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneGrixisExecutionAdmissionGate.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneGrixisExecutionAdmissionGateTest.kt
      - .github/workflows/pest-control-tier-one-grixis-admission-gate.yml
      - docs/experiments/pest-control/tier-one-grixis-execution-admission-gate.md
      - docs/experiments/pest-control/tier-one-grixis-official-loader-validation-provenance.json

permissions:
  contents: read

jobs:
  validate-fail-closed-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify digest-only admission gate
        run: scripts/test-class PestControlTierOneGrixisExecutionAdmissionGateTest --info --stacktrace

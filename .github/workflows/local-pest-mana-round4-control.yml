name: Round 4 original early mana decision replay
'on':
  push:
    branches:
    - local/pest-mana-round4-20261019
    paths:
    - .github/workflows/local-pest-mana-round4-control.yml
permissions:
  contents: read
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v4
    - uses: taiki-e/install-action@v2
      with:
        tool: just
    - name: Restore verified diagnostic fixture
      run: 'set -euo pipefail

        base64 --decode tools/pest-mana-round4/diagnostic.b64 > "$RUNNER_TEMP/diagnostic.tar.xz"

        echo "2552464f24c90427c2058124248a10330fe66b38de39de6c0bf4aa583f6ebf20  $RUNNER_TEMP/diagnostic.tar.xz"
        | sha256sum --check

        tar -xJf "$RUNNER_TEMP/diagnostic.tar.xz"

        chmod +x gradlew scripts/gradle-locked scripts/test-class

        '
    - name: Reproduce original decision and capture scoring
      env:
        MTG_REPLAY_TRACE: ${{ github.workspace }}/tools/pest-mana-round4/fixture.jsonl
        MTG_REPLAY_REPORT: ${{ runner.temp }}/early-mana-replay.json
        MTG_REPLAY_EXPECT: control
      run: 'set -o pipefail

        just test-class EarlyManaReplayTest --no-daemon --console=plain --stacktrace
        2>&1 | tee "$RUNNER_TEMP/replay.log"'
    - name: Preserve diagnostic evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: early-mana-control-${{ github.run_id }}
        retention-days: 30
        path: '${{ runner.temp }}/replay.log

          ${{ runner.temp }}/early-mana-replay.json

          gym/build/test-results/test/

          gym/src/test/kotlin/com/wingedsheep/gym/EarlyManaReplayTest.kt

          tools/pest-mana-round4/'

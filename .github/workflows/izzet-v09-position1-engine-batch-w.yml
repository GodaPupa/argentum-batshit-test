name: Izzet Position-1 Engine Batch W

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-w.yml"

permissions:
  contents: read

jobs:
  qualify-batch-w:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch W gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'V07_DECK_AUDIT_NO_CHANGE' izzet-science/v07-deck-level-audit-no-change.md
          grep -Fq 'V09_CARD_CONTROL_ARCHITECTURE_AUDIT_KEEP_V07' izzet-science/v09-card-control-architecture-audit.md
          grep -Fq '35926252699' izzet-science/v09-position1-engine-batch-w-gate.md
          grep -Fq '1b3140168c37bf892311a93d76fd9b158b0e6ae96c7923e5fac5f6b29cb0064e' izzet-science/v09-position1-engine-batch-w-gate.md
          grep -Fq '35929235572' izzet-science/v09-position1-engine-batch-w-gate.md
          grep -Fq '46cf05a9afdfbe9b42280daa93f2a5536d851d96' izzet-science/v09-position1-engine-batch-w-gate.md
          grep -Fq 'Expected post-implementation unresolved count is exactly 30' izzet-science/v09-position1-engine-batch-w-gate.md

      - name: Requalify canonical card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --stacktrace

      - name: Run Lose Focus semantics
        run: scripts/test-class LoseFocusScenarioTest --info --stacktrace

      - name: Recheck copy-mechanic regressions
        run: |
          scripts/test-class StormCopyRetargetingTest --info --stacktrace
          scripts/test-class StormCopiesAreSpellsTest --info --stacktrace
          scripts/test-class ConspireTest --info --stacktrace
          scripts/test-class CasualtyTest --info --stacktrace

      - name: Recheck repeatable optional-cost enumeration
        run: scripts/test-class CastSpellEnumeratorTest --info --stacktrace

      - name: Run exact real-engine coverage regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-w.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=30' /tmp/batch-w.txt
          ! grep -Fq 'V09_REAL_ENGINE_UNRESOLVED=unresolved Izzet card:' /tmp/batch-w.txt

      - name: Assert official experiment remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt

      - name: Emit Batch W manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izzet-batch-w
          cp /tmp/batch-w.txt /tmp/izzet-batch-w/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-w-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "frozen_control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "implemented=Lose Focus;generic Replicate keyword/slot;repeatable optional-cost copy trigger;independent retargeting"
            echo "snapshot_run=35929235572"
            echo "snapshot_commit=46cf05a9afdfbe9b42280daa93f2a5536d851d96"
            echo "unresolved_before=31"
            echo "unresolved_after=30"
            echo "remaining_izzet_unresolved=0"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/core/Keyword.kt
            sha256sum mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/ChoiceSlot.kt
            sha256sum mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/KeywordAbility.kt
            sha256sum rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/spell/CastSpellHandler.kt
            sha256sum rules-engine/src/main/kotlin/com/wingedsheep/engine/legalactions/enumerators/CastSpellEnumerator.kt
            sha256sum mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/mh2/cards/LoseFocus.kt
            sha256sum mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/LoseFocusScenarioTest.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/v09-position1-engine-batch-w-gate.md
            sha256sum mtg-sets/src/test/resources/snapshots/cards/MH2.json
            sha256sum /tmp/izzet-batch-w/test-output.txt
          } > /tmp/izzet-batch-w/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-w
          path: /tmp/izzet-batch-w
          if-no-files-found: error

name: Pest Control Tier-1 Monster Tron Official Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pest-control-tier-one-monster-tron-official-smoke.yml
      - docs/experiments/pest-control/tier-one-monster-tron-one-shot-activation.md
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonsterTronRunnerSurfacePreflight.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonsterTronRunnerSurfacePreflightTest.kt

permissions:
  contents: read
  actions: read

concurrency:
  group: pest-control-monster-tron-smoke-one-shot-v1
  cancel-in-progress: false

env:
  EXECUTION_SOURCE_SHA: 8a425d8532395e3d4262fbb35cfbac71e96feeb5
  ENGINE_BASELINE_SHA: a224ef0008a2b85e2c2c106df9959678782e765d

jobs:
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify prospective surface and claim logic without execution
        run: |
          python3 -m unittest discover -s tools/tests -p test_pest_monster_tron_one_shot_claim.py -v
          scripts/test-class PestControlTierOneMonsterTronRunnerSurfacePreflightTest --info --stacktrace

  execute:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.ref == 'refs/heads/pest-control/tier1-monster-tron-official-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXECUTION_SOURCE_SHA }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify immutable engine source before reserving the block
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_SOURCE_SHA"
          git fetch --no-tags origin "$ENGINE_BASELINE_SHA"
          git diff --exit-code "$ENGINE_BASELINE_SHA" HEAD -- mtg-sdk rules-engine ai/src/main mtg-sets gym/src/main \
            ':!gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonsterTronOneShotBoundary.kt' \
            ':!gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonsterTronRunnerSurfacePreflight.kt' \
            ':!gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonsterTronOperationalStack.kt'
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify exact frozen vector and current effective rules before claiming
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/pest-monster-tron-preflight build/pest-monster-tron-official
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10836436268/zip" \
            -o build/pest-monster-tron-preflight/freeze.zip
          echo "70b9a665fbb154342e2789c1b6b2c2fd912579431a6ae1f9ab289984d5e7801c  build/pest-monster-tron-preflight/freeze.zip" | sha256sum -c -
          curl -fsSL 'https://media.wizards.com/2026/downloads/MagicCompRules%2020260925.txt' \
            -o build/pest-monster-tron-preflight/effective-rules.txt
          echo "8d860e451f20f38865b725b42d82feb714c725373dd8f3b32b8652b3eeb070ca  build/pest-monster-tron-preflight/effective-rules.txt" | sha256sum -c -
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          assert datetime.now(timezone.utc).date().isoformat() == '2026-09-25', 'Current-date admission must be reviewed prospectively'
          text = Path('build/pest-monster-tron-preflight/effective-rules.txt').read_text()
          assert 'These rules are effective as of September 25, 2026.' in text
          PY
      - name: Run read-only frozen-input and excluded replay preflight before claiming
        env:
          PEST_MONSTER_TRON_EXECUTION_INPUT_ACK: LOAD_FROZEN_TIER_ONE_MONSTER_TRON_4_FOR_VALIDATION_ONLY
          PEST_MONSTER_TRON_EXECUTION_INPUT_ZIP: ${{ github.workspace }}/build/pest-monster-tron-preflight/freeze.zip
        run: |
          set -euo pipefail
          run_stage() {
            local stage="$1" class="$2" module="$3" status=0
            scripts/test-class "$class" --info --stacktrace || status=$?
            mkdir -p "build/pest-monster-tron-preflight/$stage"
            if [ -d "$module/build/test-results/test" ]; then
              cp -a "$module/build/test-results/test/." "build/pest-monster-tron-preflight/$stage/"
            fi
            return "$status"
          }
          run_stage boundary-tests PestControlTierOneMonsterTronOneShotBoundaryTest gym
          run_stage policy-tests PestMonsterTronPolicyAuditTest ai
      - name: Require the full execution budget and upload margin before claiming
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          from datetime import datetime, timezone
          import json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          request = Request(url, headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urlopen(request, timeout=40) as response:
              run = json.load(response)
          assert str(run['id']) == os.environ['GITHUB_RUN_ID'] and run['run_attempt'] == 1
          assert run['status'] == 'in_progress' and run['conclusion'] is None
          started = datetime.fromisoformat(run['run_started_at'].replace('Z', '+00:00'))
          elapsed = (datetime.now(timezone.utc) - started).total_seconds()
          # Workflow start is no later than this job start, making this a conservative deadline.
          # Ten minutes cover bounded claim API latency; fifteen minutes remain for upload.
          remaining = 6 * 3600 - elapsed
          report = {'run_started_at': run['run_started_at'], 'elapsed_seconds': elapsed,
                    'remaining_seconds': remaining, 'required_seconds': 5 * 3600 + 25 * 60,
                    'claim_created': False}
          Path('build/pest-monster-tron-preflight/time-budget.json').write_text(json.dumps(report, indent=2) + '\n')
          assert 0 <= elapsed and remaining >= report['required_seconds'], 'Insufficient time: refuse claim before official initialization'
          PYTHON
      - name: Reserve the original four assignments exactly once in the repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/pest-monster-tron-one-shot-claim.py \
            --source-sha "$EXECUTION_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --receipt build/pest-monster-tron-official/claim-receipt.json
      - name: Execute the sealed runner once and preserve every exit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PEST_MONSTER_TRON_OFFICIAL_MODE: EXECUTE
          PEST_MONSTER_TRON_EXECUTION_SOURCE_SHA: ${{ env.EXECUTION_SOURCE_SHA }}
          PEST_MONSTER_TRON_EXECUTION_INPUT_ACK: AUTOMATIC_ONE_SHOT_MONSTER_TRON_EXECUTION
          PEST_MONSTER_TRON_EXECUTION_INPUT_ZIP: ${{ github.workspace }}/build/pest-monster-tron-preflight/freeze.zip
          PEST_MONSTER_TRON_RULES_ARCHIVE: ${{ github.workspace }}/build/pest-monster-tron-preflight/effective-rules.txt
          PEST_MONSTER_TRON_CLAIM_RECEIPT: ${{ github.workspace }}/build/pest-monster-tron-official/claim-receipt.json
          PEST_MONSTER_TRON_OFFICIAL_OUTPUT_DIR: ${{ github.workspace }}/build/pest-monster-tron-official
        run: |
          set -euo pipefail
          status=0
          timeout --signal=TERM --kill-after=120s 5h scripts/test-class PestControlTierOneMonsterTronOfficialExecutionRunnerTest \
            --info --stacktrace --rerun-tasks --no-build-cache || status=$?
          if [ -d gym/build/test-results/test ]; then
            cp -a gym/build/test-results/test build/pest-monster-tron-official/runner-test-results
          fi
          printf '%s\n' "$status" > build/pest-monster-tron-official/process-exit-code.txt
          exit "$status"
      - name: Require actual complete execution evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('build/pest-monster-tron-official/execution')
          summary = json.loads((root / 'summary.json').read_text())
          assert summary['execution_source_sha'] == '8a425d8532395e3d4262fbb35cfbac71e96feeb5'
          assert summary['disposition'] == 'VALIDATED'
          for field in ('attempted_games', 'initialization_entries', 'initialized_games', 'recorded_games'):
              assert summary[field] == [1, 2, 3, 4], field
          assert summary['failure'] is None and summary['rejection_journal_failure'] is None
          assert (root / 'artifacts.sha256').is_file()
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pest-control-tier-one-monster-tron-official-smoke
          path: |
            build/pest-monster-tron-official
            build/pest-monster-tron-preflight
          if-no-files-found: error
          retention-days: 90

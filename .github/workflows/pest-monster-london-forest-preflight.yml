name: Pest Monster London Forest certificate static preflight
on:
  push:
    branches: ["pest/c2-pair-pilot-seam-20260927"]
    paths:
      - ".github/workflows/pest-monster-london-forest-preflight.yml"
      - "gym/src/main/kotlin/com/wingedsheep/gym/actorinput/PestMonsterLondonForestCertificate.kt"
      - "gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterLondonForestCertificateTest.kt"

permissions:
  contents: read

jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact London source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-london-forest-preflight
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/actorinput/PestMonsterLondonForestCertificate.kt)" = "8ba646f1c9edd256e8b8915f8da22788cf1ab8ab"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterLondonForestCertificateTest.kt)" = "805b722b5f0fa35df2fec3f0420c3a80395605d4"
          test -x gradlew
          {
            git rev-parse HEAD
            git hash-object gym/src/main/kotlin/com/wingedsheep/gym/actorinput/PestMonsterLondonForestCertificate.kt
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterLondonForestCertificateTest.kt
            git hash-object .github/workflows/pest-monster-london-forest-preflight.yml
            git status --porcelain
          } > build/reports/pest-london-forest-preflight/source.txt
      - name: Compile sources without executing cases
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:compileTestKotlin --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-london-forest-preflight/compile.log
          test -f gym/build/classes/kotlin/main/com/wingedsheep/gym/actorinput/PestMonsterLondonForestCertificate.class
          test -f gym/build/classes/kotlin/test/com/wingedsheep/gym/actorinput/PestMonsterLondonForestCertificateTest.class
          test ! -e gym/build/test-results/test/TEST-com.wingedsheep.gym.actorinput.PestMonsterLondonForestCertificateTest.xml
      - name: Retain original preflight result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-london-forest-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-london-forest-preflight/
          if-no-files-found: error
          retention-days: 90

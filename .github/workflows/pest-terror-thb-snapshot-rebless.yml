name: Pest Terror THB Snapshot Rebless
on:
  push:
    branches:
      - pest-control/tier1-mono-blue-terror-escape-support

permissions:
  contents: write

jobs:
  rebless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pest-control/tier1-mono-blue-terror-escape-support
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Rebless deterministic card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true
      - name: Verify THB is the only card snapshot changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short -- mtg-sets/src/test/resources/snapshots/cards)"
          printf '%s\n' "$changed"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev ' mtg-sets/src/test/resources/snapshots/cards/THB\.json$' || true)"
          test -z "$unexpected"
          git diff --check
      - name: Commit canonical THB snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtg-sets/src/test/resources/snapshots/cards/THB.json
          git commit -m "Rebless THB snapshot for Sleep of the Dead"
          git push origin HEAD:pest-control/tier1-mono-blue-terror-escape-support

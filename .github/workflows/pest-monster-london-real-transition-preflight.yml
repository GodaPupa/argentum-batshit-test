name: Pest Monster real-engine Tower Ent static preflight
on:
  push:
    branches: ["pest/c2-pair-pilot-seam-20260927"]
    paths:
      - ".github/workflows/pest-monster-london-real-transition-preflight.yml"
permissions:
  contents: read
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source, fixture, card, parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-london-real-transition-preflight
          test "$(git rev-parse HEAD^)" = "7196e697a9429373df29247975bb6e038a6cfe19"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonRealTransitionTest.kt)" = "de6e4b194390c2bedfce83f91d131769ae04279c"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonSetupBridge.kt)" = "3dfaf5a1a560e8f5c30ab34de1c2583656832251"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonTypecyclingPlan.kt)" = "8adf7684a58e67374cd814323815f1887ad66e1a"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/atq/cards/UrzasTower.kt)" = "8f280147686880fd921acc43b49f8bb5d5234431"
          test "$(git hash-object mtg-sets/2023/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ltr/cards/GenerousEnt.kt)" = "eb2dc664f794b69442d479525537404ba4201875"
          test -x gradlew
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonRealTransitionTest.kt
            git hash-object .github/workflows/pest-monster-london-real-transition-preflight.yml
            git status --porcelain
          } > build/reports/pest-london-real-transition-preflight/source.txt
      - name: Compile without behavioral execution
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:compileTestKotlin --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-london-real-transition-preflight/compile.log
          test -f gym/build/classes/kotlin/test/com/wingedsheep/gym/matchup/PestMonsterLondonRealTransitionTest.class
          test ! -e gym/build/test-results/test/TEST-com.wingedsheep.gym.matchup.PestMonsterLondonRealTransitionTest.xml
      - name: Retain original compile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-london-real-transition-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-london-real-transition-preflight/
          if-no-files-found: error
          retention-days: 90

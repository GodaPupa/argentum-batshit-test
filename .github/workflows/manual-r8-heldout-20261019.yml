name: Manual R8 held-out paired R5 versus R7 Ballista Commander validation
on:
  push:
    branches: [gameplay/manual-r8-heldout-20261019]
    paths:
      - 'ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualR8HeldoutHarnessTest.kt'
      - '.github/workflows/manual-r8-heldout-20261019.yml'
permissions:
  contents: read
jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        seed: ['202610191611', '202610191612']
        profile: ['r5', 'r7']
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R4_ROOT: ${{ github.workspace }}
      MANUAL_R8_OUTPUT: ${{ github.workspace }}/r8-output
      MANUAL_R8_SEED: ${{ matrix.seed }}
      MANUAL_R8_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Assert exact source, frozen inputs and predeclared R8 arm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r8-output
          git rev-parse HEAD > r8-output/source-sha.txt
          git rev-parse HEAD^{tree} > r8-output/tree-sha.txt
          case "$MANUAL_R8_SEED" in 202610191611|202610191612) ;; *) echo "Unapproved R8 seed"; exit 1 ;; esac
          case "$MANUAL_R8_PROFILE" in r5|r7) ;; *) echo "Unapproved R8 profile"; exit 1 ;; esac
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR4Candidate.kt)" = "550f3d160e783ddb71c19bb9b045037165b69172"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualR7BallistaAllocationCandidate.kt)" = "5bb856f37b9289ba09366401ad99228564d92a58"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/modules/ManualBallistaContinuationAdvisorModule.kt)" = "181c4c54f0cbbf39a7fdd788d890019b5ed81ea6"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/modules/ManualR7BallistaAllocationAdvisorModule.kt)" = "7359818f0d782581f0cb52af4319dcdbbb050202"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/modules/ManualPactDebtAdvisorModule.kt)" = "b8ace7c735f4561dc243ae6fa1fc197b16f61bc1"
          sha256sum experiments/manual-transmission/control/v0.7.decklist.txt > r8-output/frozen-deck.sha256
          printf '%s\n' "$MANUAL_R8_SEED" > r8-output/seed.txt
          printf '%s\n' "$MANUAL_R8_PROFILE" > r8-output/profile.txt
          chmod +x gradlew scripts/gradle-locked
      - name: First pass compile and verify 64 accepted actions in this exact arm
        env:
          MANUAL_R8_PREFIX_ONLY: '1'
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:test --tests '*ManualR8HeldoutHarnessTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace 2>&1 | tee r8-output/prefix-${{ matrix.profile }}-${{ matrix.seed }}.log
          test -s "r8-output/${{ matrix.profile }}-seed-${{ matrix.seed }}-prefix/smoke-passed.txt"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          seed=os.environ["MANUAL_R8_SEED"]
          arm=os.environ["MANUAL_R8_PROFILE"]
          j=json.loads(Path(f"r8-output/{arm}-seed-{seed}-prefix/summary.json").read_text())
          assert j["status"] == "PREFIX_COMPLETE" and j["accepted"] == 64 and j["submitted"] == 64 and j["error"] is None
          assert str(j["seed"]) == seed and j["profileName"] == arm
          print(f"R8_PREFIX_PASS seed={seed} profile={arm} accepted=64")
          PY
      - name: One bounded four-player R8 game (only after its arm's prefix)
        env:
          MANUAL_R8_PREFIX_ONLY: '0'
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test --tests '*ManualR8HeldoutHarnessTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace 2>&1 | tee r8-output/game-${{ matrix.profile }}-${{ matrix.seed }}.log
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          seed=os.environ["MANUAL_R8_SEED"]
          arm=os.environ["MANUAL_R8_PROFILE"]
          j=json.loads(Path(f"r8-output/{arm}-seed-{seed}/summary.json").read_text())
          assert str(j["seed"]) == seed and j["profileName"] == arm
          assert j["status"] == "COMPLETE" and j["gameOver"] and j["winner"] and j["error"] is None
          assert j["submitted"] == j["accepted"] and j["accepted"] >= 64
          print(f"R8_GAME_PASS seed={seed} profile={arm} actions={j['accepted']} winner={j['winner']} globalTurn={j['playerTurnNumber']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-r8-heldout-${{ matrix.profile }}-${{ matrix.seed }}-${{ github.run_id }}
          retention-days: 30
          path: |
            r8-output/
            ai/build/test-results/test/

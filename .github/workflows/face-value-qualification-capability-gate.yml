name: Face Value Qualification Capability Gate

on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-qualification-capability-gate.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify immutable qualification inputs
        run: python3 experiments/face-value/qualification/validate_inputs.py
      - name: Build pinned Forge snapshot once
        run: |
          set -euxo pipefail
          FORGE_SHA=f387ede550e336315637a8b765f0927ac768c113
          git clone --filter=blob:none https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src checkout --detach "$FORGE_SHA"
          test "$(git -C forge-src rev-parse HEAD)" = "$FORGE_SHA"
          printf '%s\n' "$FORGE_SHA" > forge-source-commit.txt
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"
      - name: Install frozen decks and diagnostic assignments
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.forge/decks/constructed" capability-logs
          cp experiments/face-value/qualification/control/*.dck "$HOME/.forge/decks/constructed/"
          cp experiments/face-value/qualification/opponents/*.dck "$HOME/.forge/decks/constructed/"
          cat > capability-assignments.tsv <<'EOF'
          mono-red-madness	mono-red-madness-john-marek-2026-09-19.dck	710001
          mono-blue-terror	mono-blue-terror-luminati-2026-09-19.dck	710002
          grixis-affinity	grixis-affinity-brunoramos93-2026-09-19.dck	710003
          monster-tron	monster-tron-discovern-2026-09-19.dck	710004
          jund-wildfire	jund-wildfire-blaze66-2026-09-19.dck	710005
          elves	elves-mogged-2026-09-19.dck	710006
          mono-red-rally	mono-red-rally-monturulez-2026-09-20.dck	710007
          mono-blue-faeries	mono-blue-faeries-enz091-2026-09-19.dck	710008
          EOF
          sha256sum capability-assignments.tsv experiments/face-value/qualification/input-identities.sha256 > capability-inputs.sha256
          cat > capability-disposition.txt <<'EOF'
          CAPABILITY_ONLY_NONQUALIFICATION_FIXTURES
          Seeds 710001-710008 and all outcomes from this workflow are diagnostic only.
          They are permanently ineligible for matchup evidence, pooling, tuning, promotion, or replay as official qualification seeds.
          EOF
      - name: Smoke every opponent in both seat orders
        run: |
          set -euo pipefail
          control='fv-temur-chrysalis-e-final-forge-75.dck'
          while IFS=$'\t' read -r matchup opponent seed; do
            timeout 300 "$FORGE_LAUNCHER" sim -d "$control" "$opponent" -n 1 -s "$seed" -c 120 > "capability-logs/${matchup}-face-seat1.log" 2>&1
            timeout 300 "$FORGE_LAUNCHER" sim -d "$opponent" "$control" -n 1 -s "$seed" -c 120 > "capability-logs/${matchup}-face-seat2.log" 2>&1
          done < capability-assignments.tsv
      - name: Fail-closed capability audit
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          assignments = []
          p = Path('capability-assignments.tsv')
          if p.exists():
              for line in p.read_text().splitlines():
                  matchup, opponent, seed = line.split('\t')
                  assignments.append((matchup, opponent, int(seed)))

          records = []
          bad_patterns = {
              'exception': r'Exception|StackOverflowError|AssertionError',
              'slow_draw': r'Stopping slow match as draw',
              'missing_deck': r'Deck not found|Unable to load deck',
              'unsupported': r'UnsupportedOperationException|not implemented',
          }
          for matchup, opponent, seed in assignments:
              for seat in (1, 2):
                  path = Path(f'capability-logs/{matchup}-face-seat{seat}.log')
                  text = path.read_text(errors='replace') if path.exists() else ''
                  flags = [name for name, pattern in bad_patterns.items() if re.search(pattern, text, re.I)]
                  terminal = bool(re.search(r'has won!|ended in a Draw', text))
                  records.append({
                      'matchup': matchup,
                      'opponent_file': opponent,
                      'diagnostic_seed': seed,
                      'face_value_seat': seat,
                      'log': str(path),
                      'terminal': terminal,
                      'flags': flags,
                  })

          summary = {
              'classification': 'CAPABILITY_ONLY_NONQUALIFICATION_FIXTURES',
              'expected_games': 16,
              'games_found': len(records),
              'terminal_games': sum(r['terminal'] for r in records),
              'flagged_games': sum(bool(r['flags']) for r in records),
              'records': records,
          }
          Path('capability-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps({k: v for k, v in summary.items() if k != 'records'}, indent=2, sort_keys=True))
          assert len(assignments) == 8, len(assignments)
          assert summary['games_found'] == 16, summary
          assert summary['terminal_games'] == 16, summary
          assert summary['flagged_games'] == 0, summary
          PY
      - name: Preserve capability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-qualification-capability-gate
          path: |
            capability-summary.json
            capability-assignments.tsv
            capability-inputs.sha256
            capability-disposition.txt
            capability-logs/*.log
            forge-source-commit.txt
            experiments/face-value/qualification/input-validation-report.json
          if-no-files-found: warn

name: Face Value Chrysalis Completion Shootout
on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-chrysalis-completion-shootout.yml]
permissions: {contents: read}
jobs:
  D:
    uses: ./.github/workflows/face-value-experiment-harness.yml
    with: {experiment_name: chrysalis-D-gruul, control_deck: experiments/face-value/decks/fv-v12-control.dck, challenger_deck: experiments/face-value/decks/fv-temur-chrysalis-d.dck, opponent_deck: experiments/face-value/decks/gruul-ramp.dck, seed_start: 1410001, games: 20}
  E:
    uses: ./.github/workflows/face-value-experiment-harness.yml
    with: {experiment_name: chrysalis-E-gruul, control_deck: experiments/face-value/decks/fv-v12-control.dck, challenger_deck: experiments/face-value/decks/fv-temur-chrysalis-e.dck, opponent_deck: experiments/face-value/decks/gruul-ramp.dck, seed_start: 1420001, games: 20}
  F:
    uses: ./.github/workflows/face-value-experiment-harness.yml
    with: {experiment_name: chrysalis-F-gruul, control_deck: experiments/face-value/decks/fv-v12-control.dck, challenger_deck: experiments/face-value/decks/fv-temur-chrysalis-f.dck, opponent_deck: experiments/face-value/decks/gruul-ramp.dck, seed_start: 1430001, games: 20}

name: Sphinx bounded multi-cast unique-proposal receiving
on:
  push:
    branches: ["sphinx/multicast-unique-proposal-20260929"]
    paths: [".github/workflows/sphinx-multicast-unique-proposal-20260929.yml"]
permissions: {contents: read}
jobs:
  two-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact candidate source test budget decks and parent
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/sphinx-multicast-unique-proposal
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD^)" = "18f399468fec6ba44bcf51e4d3bd4309e136833c"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEWholeActor.kt)" = "6fec3a563ef9c7392d8f5aa6795edbb64b93096b"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEMultiCastDiscriminatorReceivingTest.kt)" = "6b794b196d4ff65ab3a7fff5f14febb8f310ab35"
          test "$(git hash-object sphinx-approach/STAGE_E_MULTICAST_UNIQUE_PROPOSAL_BUDGET_20260929.json)" = "94877f7601c2afd63dcd0103ae4d513da4720511"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEApproachModeReceivingTest.kt)" = "a8abd8687e05abdc7845d4a2309e20c5864b164e"
          test "$(git hash-object sphinx-approach/decks/reconstructed-v01.csv)" = "e2f0abbc9f99be97b2562a18ae248d70cbefc0e1"
          test "$(git hash-object sphinx-approach/decks/reconstructed-hybrid.csv)" = "7f76c94e4fbc24acdc982039aa248a1fa9485cd4"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEWholeActor.kt
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEMultiCastDiscriminatorReceivingTest.kt
            git hash-object sphinx-approach/STAGE_E_MULTICAST_UNIQUE_PROPOSAL_BUDGET_20260929.json
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEApproachModeReceivingTest.kt
            git hash-object sphinx-approach/decks/reconstructed-v01.csv
            git hash-object sphinx-approach/decks/reconstructed-hybrid.csv
            git hash-object .github/workflows/sphinx-multicast-unique-proposal-20260929.yml
            git status --porcelain
          } > "$OUT/source.txt"
      - name: Execute exact bounded multi-cast receiving bank
        shell: bash
        run: |
          set -o pipefail
          just test-class SphinxStageEMultiCastDiscriminatorReceivingTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/sphinx-multicast-unique-proposal/multicast.log
      - name: Regress accepted Approach whole-actor receiving
        shell: bash
        run: |
          set -o pipefail
          just test-class SphinxStageEApproachModeReceivingTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/sphinx-multicast-unique-proposal/approach-regression.log
      - name: Preserve exact XML
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/sphinx-multicast-unique-proposal
          find . -path '*/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageEMultiCastDiscriminatorReceivingTest.xml' -type f -exec cp {} "$OUT/" \;
          find . -path '*/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageEApproachModeReceivingTest.xml' -type f -exec cp {} "$OUT/" \;
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-multicast-unique-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-multicast-unique-proposal/
          if-no-files-found: error
          retention-days: 90

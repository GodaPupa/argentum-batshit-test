name: Manual Phase 2 Reality Shift Snapshot Sync

on:
  push:
    branches:
      - manual-transmission/phase2-reality-shift
    paths:
      - .github/workflows/manual-transmission-reality-shift-snapshot.yml

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: manual-transmission/phase2-reality-shift
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Qualify Reality Shift exact behavior
        run: ./gradlew :mtg-sets:2008-2016:test --tests "*RealityShiftScenarioTest"

      - name: Regenerate FRF snapshot canonically
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true

      - name: Fail closed on unrelated snapshot drift
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "mtg-sets/src/test/resources/snapshots/cards/FRF.json"
          git diff --check
          grep -Fq "// Reality Shift" mtg-sets/src/test/resources/snapshots/cards/FRF.json

      - name: Qualify card lint
        run: ./gradlew :mtg-sets:test --tests "*CardLintTest"

      - name: Commit exact generated FRF bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtg-sets/src/test/resources/snapshots/cards/FRF.json
          git commit -m "Synchronize Reality Shift snapshot"
          git fetch origin manual-transmission/phase2-reality-shift
          test "$(git rev-parse origin/manual-transmission/phase2-reality-shift)" = "${GITHUB_SHA}"
          git push origin HEAD:manual-transmission/phase2-reality-shift

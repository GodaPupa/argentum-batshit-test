name: Pest Monster Ent typecycling receiving
on:
  push:
    branches: ["pest/c2-pair-pilot-seam-20260927"]
    paths:
      - ".github/workflows/pest-monster-c2-ent-typecycle-targeted.yml"
      - "gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterEntTypecycleReceivingTest.kt"

permissions:
  contents: read

jobs:
  prospective-ent-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact preflighted Ent source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-c2-ent
          test "$(git rev-parse HEAD^)" = "77ec4d8a0e12a9869c111ec3ffa8d1ca9ed19e7d"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterEntTypecycleReceivingTest.kt)" = "3af410404a63957c20b6e31ac2a29c467aaec395"
          test "$(git rev-parse 77ec4d8a0e12a9869c111ec3ffa8d1ca9ed19e7d:gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterEntTypecycleReceivingTest.kt)" = "3af410404a63957c20b6e31ac2a29c467aaec395"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterEntTypecycleReceivingTest.kt
            git hash-object .github/workflows/pest-monster-c2-ent-typecycle-targeted.yml
            git status --porcelain
          } > build/reports/pest-c2-ent/source.txt
      - name: Execute two fresh Ent typecycling fixtures
        shell: bash
        run: |
          set -o pipefail
          scripts/test-class PestMonsterEntTypecycleReceivingTest --rerun-tasks --info --stacktrace 2>&1 | tee build/reports/pest-c2-ent/gradle.log
      - name: Verify exact JUnit cases
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          paths=glob.glob("gym/build/test-results/test/TEST-*PestMonsterEntTypecycleReceivingTest.xml")
          assert len(paths)==1, paths
          root=ET.parse(paths[0]).getroot()
          cases=root.findall(".//testcase")
          expected=[f"P03-05 Monster seat {seat} Ent pays discards and selects offered Forest" for seat in (1,2)]
          assert sorted(c.get("name") for c in cases)==sorted(expected), [c.get("name") for c in cases]
          assert not root.findall(".//failure") and not root.findall(".//error") and not root.findall(".//skipped")
          PY
      - name: Retain original result and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-c2-ent-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/pest-c2-ent/
            gym/build/test-results/test/TEST-*PestMonsterEntTypecycleReceivingTest.xml
          if-no-files-found: error
          retention-days: 90

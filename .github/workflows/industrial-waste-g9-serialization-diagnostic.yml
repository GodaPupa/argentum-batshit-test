name: Industrial Waste — Gate 9 Serialization Diagnostic

on:
  pull_request:
    branches: [industrial-waste/lab]
    paths:
      - .github/workflows/industrial-waste-g9-serialization-diagnostic.yml
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/core/Serialization.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/state/components/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serialization-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v6
      - name: Run component registration test
        shell: bash
        run: |
          set +e
          ./gradlew :rules-engine:test             --tests '*SerializationPolymorphicRegistrationTest*'             --no-daemon
          status=$?
          echo '===== SERIALIZATION XML ====='
          find rules-engine/build/test-results/test             -name 'TEST-*SerializationPolymorphicRegistrationTest*.xml'             -exec sed -n '1,900p' {} \; || true
          exit $status

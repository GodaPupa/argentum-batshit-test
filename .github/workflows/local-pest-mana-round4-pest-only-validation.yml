name: Round 4 Pest-only policy validation
'on':
  push:
    branches:
    - local/pest-mana-round4-pest-only-20261019
    paths:
    - .github/workflows/local-pest-mana-round4-pest-only-validation.yml
permissions:
  contents: read
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v4
    - uses: taiki-e/install-action@v2
      with:
        tool: just
    - name: Restore verified diagnostic fixture
      run: 'set -euo pipefail

        base64 --decode tools/pest-mana-round4/pest-only-diagnostic.b64 > "$RUNNER_TEMP/diagnostic.tar.xz"

        echo "652825a63c4f11386f560787e0d81789ede35a358729fd66153b10be3f10475b  $RUNNER_TEMP/diagnostic.tar.xz"
        | sha256sum --check

        tar -xJf "$RUNNER_TEMP/diagnostic.tar.xz"

        chmod +x gradlew scripts/gradle-locked scripts/test-class

        '
    - name: Reproduce original decision and capture scoring
      env:
        MTG_REPLAY_TRACE: ${{ github.workspace }}/tools/pest-mana-round4/fixture.jsonl
        MTG_REPLAY_REPORT: ${{ runner.temp }}/early-mana-replay.json
        MTG_REPLAY_EXPECT: control
      run: 'set -o pipefail

        just test-class EarlyManaReplayTest --no-daemon --console=plain --stacktrace
        2>&1 | tee "$RUNNER_TEMP/replay.log"'
    - name: Verify Pest-only assignment in both seats
      run: 'set -euo pipefail

        base64 --decode tools/pest-mana-round4/pest-only-runner.b64 > "$RUNNER_TEMP/runner.tar.xz"

        echo "44aef9c31c2332ce4b1c8d2947b541cab937b2bb398de5d296fe5507fe656840  $RUNNER_TEMP/runner.tar.xz"
        | sha256sum --check

        tar -xJf "$RUNNER_TEMP/runner.tar.xz"

        just test-class Round4PolicyAssignmentTest --no-daemon --console=plain --stacktrace

        '
    - name: Preserve diagnostic evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: early-mana-candidate-${{ github.run_id }}
        retention-days: 30
        path: '${{ runner.temp }}/replay.log

          ${{ runner.temp }}/early-mana-replay.json

          gym/build/test-results/test/

          gym/src/test/kotlin/com/wingedsheep/gym/EarlyManaReplayTest.kt

          tools/pest-mana-round4/'
  ai-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v4
    - uses: taiki-e/install-action@v2
      with:
        tool: just
    - name: Restore verified diagnostic fixture
      run: 'set -euo pipefail

        base64 --decode tools/pest-mana-round4/pest-only-diagnostic.b64 > "$RUNNER_TEMP/diagnostic.tar.xz"

        echo "652825a63c4f11386f560787e0d81789ede35a358729fd66153b10be3f10475b  $RUNNER_TEMP/diagnostic.tar.xz"
        | sha256sum --check

        tar -xJf "$RUNNER_TEMP/diagnostic.tar.xz"

        chmod +x gradlew scripts/gradle-locked scripts/test-class

        '
    - name: AI regression gate including seven focused mana tests
      run: 'chmod +x gradlew scripts/gradle-locked scripts/test-class

        set -o pipefail

        just test-ai 2>&1 | tee "$RUNNER_TEMP/ai-gate.log"'
    - name: Preserve tests
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: early-mana-ai-${{ github.run_id }}
        retention-days: 30
        path: '${{ runner.temp }}/ai-gate.log

          ai/build/test-results/test/

          ai/src/test/kotlin/com/wingedsheep/ai/engine/EarlyManaDevelopmentTest.kt'

name: Izzet current-head compile and registry checkpoint v10
on:
  push:
    branches: ["validation/izzet-current-head-v10-20261002"]
    paths: [".github/workflows/izzet-current-head-v10-validation-20261002.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_USER_HOME: /tmp/izzet-v10-${{ github.run_id }}
      OUT: /tmp/izzet-v10-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind exact live Izzet checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "9ffd87d0547552a505d9da31f06d3aae2a0a39a5"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/izzet-current-head-v10-validation-20261002.yml"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/core/BeginningPhaseManager.kt)" = "20d20d542a83b2af684ef634a694769dc03709e1"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/event/TriggerMatcher.kt)" = "c6bee21d805084d62ecd45eb280c97caac3e4782"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/layers/AffectsFilterResolver.kt)" = "4f8aba459066378d8ce6c3f67ce1963225755f1b"
          test "$(git hash-object rules-engine/src/test/kotlin/com/wingedsheep/engine/predicates/CommanderStatePredicateTest.kt)" = "2c9d5dc2cb684f0ecdf8c787dccd42052ce72175"
          test "$(git hash-object mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m20/cards/LeafkinDruid.kt)" = "5927894349ef9adce1596b156dd14d9b3ba3e404"
          test "$(git hash-object mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c18/cards/ForgeOfHeroes.kt)" = "d81a0d3f9022564c5616473db6b1cf3e4a6feb76"
          mkdir "$OUT"
          git rev-parse HEAD HEAD^{tree} HEAD^ > "$OUT/source.txt"
          printf '%s\n' 'AUTHOR_VALIDATION_ONLY_NO_GAMEPLAY_AUTHORITY' > "$OUT/authority.txt"
      - name: Compile exact current source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :mtg-sdk:compileTestKotlin             :rules-engine:compileTestKotlin             :mtg-sets:2003-2007:tests:compileTestKotlin             :mtg-sets:2008-2016:tests:compileTestKotlin             :mtg-sets:2017-2022:tests:compileTestKotlin             :mtg-sets:2024:tests:compileTestKotlin             :gym:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
      - name: Run exact commander targeting and Leafkin regressions
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :rules-engine:test             --tests com.wingedsheep.engine.predicates.CommanderStatePredicateTest             --tests com.wingedsheep.engine.scenarios.PreventTargetingScenarioTest 2>&1 | tee "$OUT/rules-regressions.log"
          cp rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.predicates.CommanderStatePredicateTest.xml "$OUT/"
          cp rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.PreventTargetingScenarioTest.xml "$OUT/"
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :mtg-sdk:test --tests com.wingedsheep.sdk.serialization.PreventTargetingSerializationTest 2>&1 | tee "$OUT/sdk-targeting.log"
          cp mtg-sdk/build/test-results/test/TEST-com.wingedsheep.sdk.serialization.PreventTargetingSerializationTest.xml "$OUT/"
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :mtg-sets:2017-2022:tests:test --tests com.wingedsheep.engine.scenarios.LeafkinDruidBatchAGScenarioTest 2>&1 | tee "$OUT/leafkin.log"
          cp mtg-sets/2017-2022/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.LeafkinDruidBatchAGScenarioTest.xml "$OUT/"
      - name: Reinventory exact 55 Position-1 identities as diagnostic
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :gym:test --tests com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest 2>&1 | tee "$OUT/registry.log"
          rc=${PIPESTATUS[0]}
          set -e
          XML=gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml
          test -f "$XML"
          cp "$XML" "$OUT/"
          REGISTRY_RC="$rc" python3 - <<'PY'
          import json,os,pathlib,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ["OUT"])
          root=ET.parse(out/"TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml").getroot()
          assert int(root.attrib["tests"])==55
          suffix=" is registered in current runtime"
          registered=[];missing=[]
          for case in root.iter("testcase"):
              name=case.attrib["name"]
              card=name[:-len(suffix)] if name.endswith(suffix) else name
              (registered if case.find("failure") is None and case.find("error") is None else missing).append(card)
          required={"Forge of Heroes","Leafkin Druid","Opal Palace","Izzet Guildmage","Echoing Truth"}
          assert required.issubset(set(registered)), (required-set(registered),sorted(registered))
          summary={
            "schema":"izzet-position1-current-head-v10",
            "authority":"REGISTRY_DIAGNOSTIC_ONLY_NOT_MECHANICS_OR_GAMEPLAY_QUALIFICATION",
            "source":"9ffd87d0547552a505d9da31f06d3aae2a0a39a5",
            "registered":len(registered),"missing":len(missing),
            "registered_names":sorted(registered),"missing_names":sorted(missing),
            "gradle_exit_code":int(os.environ["REGISTRY_RC"]),
            "official_counters_delta":0
          }
          (out/"registry-summary.json").write_text(json.dumps(summary,sort_keys=True,indent=2)+"\n")
          PY
      - name: Summarize successful bounded checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ["OUT"])
          names=[
            "com.wingedsheep.engine.predicates.CommanderStatePredicateTest",
            "com.wingedsheep.engine.scenarios.PreventTargetingScenarioTest",
            "com.wingedsheep.sdk.serialization.PreventTargetingSerializationTest",
            "com.wingedsheep.engine.scenarios.LeafkinDruidBatchAGScenarioTest",
          ]
          rows=[]
          for name in names:
              root=ET.parse(out/f"TEST-{name}.xml").getroot()
              assert int(root.attrib["failures"])==0 and int(root.attrib["errors"])==0 and int(root.attrib["skipped"])==0
              rows.append({"suite":name,"tests":int(root.attrib["tests"])})
          (out/"targeted-summary.json").write_text(json.dumps({
            "schema":"izzet-current-head-v10-author-validation",
            "authority":"AUTHOR_VALIDATION_ONLY_NOT_INDEPENDENT_REVIEW_OR_GAMEPLAY_ADMISSION",
            "source":"9ffd87d0547552a505d9da31f06d3aae2a0a39a5",
            "suites":rows,"total_tests":sum(x["tests"] for x in rows),"official_counters_delta":0
          },sort_keys=True,indent=2)+"\n")
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-current-head-v10-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

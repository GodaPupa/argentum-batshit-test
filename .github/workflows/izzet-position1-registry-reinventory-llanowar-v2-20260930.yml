name: Izzet Position-1 registry reinventory after Llanowar Visionary adoption
on:
  push:
    branches: ["izzet/position1-registry-reinventory-llanowar-v2-20260930"]
    paths: [".github/workflows/izzet-position1-registry-reinventory-llanowar-v2-20260930.yml"]
permissions: {contents: read}
jobs:
  fifty-five-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact post-Llanowar runtime diagnostic
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/izzet-position1-registry-reinventory-llanowar
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD^^^)" = "96d6da744aa9051ce4064f1e768f10228e81744b"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/izzet/IzzetPosition1RegistryInventoryTest.kt)" = "197a99e6c17885bb70511916893d3a33de217feb"
          test "$(git hash-object experiments/izzet-science/POSITION1_REGISTRY_REINVENTORY_LLANOWAR_BUDGET_20260930.json)" = "2883006f7a6e3f6ca8a2690bc2b96915b125817a"
          test "$(git hash-object mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m21/cards/LlanowarVisionary.kt)" = "2cc1f07b325b4b7b5358418aa0aefc0ccabe430b"
          test "$(git hash-object mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/LlanowarVisionaryScenarioTest.kt)" = "7378eacb4e0d4ac7fe1292e73fc5d94ee9cf5ece"
          test "$(git hash-object mtg-sets/src/test/resources/snapshots/cards/M21.json)" = "0f864c1593cd5eb3678559abc12299c0fae8a88d"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git rev-parse HEAD^^
            git rev-parse HEAD^^^
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/izzet/IzzetPosition1RegistryInventoryTest.kt
            git hash-object experiments/izzet-science/POSITION1_REGISTRY_REINVENTORY_LLANOWAR_BUDGET_20260930.json
            git hash-object mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m21/cards/LlanowarVisionary.kt
            git hash-object mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/LlanowarVisionaryScenarioTest.kt
            git hash-object mtg-sets/src/test/resources/snapshots/cards/M21.json
            git hash-object .github/workflows/izzet-position1-registry-reinventory-llanowar-v2-20260930.yml
            git status --porcelain
          } > "$OUT/source.txt"
      - name: Execute exact 55 registry identities against current runtime
        shell: bash
        run: |
          set -o pipefail
          just test-class IzzetPosition1RegistryInventoryTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-position1-registry-reinventory-llanowar/test.log
      - name: Retain and summarize exact XML
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/izzet-position1-registry-reinventory-llanowar
          XML=gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml
          cp "$XML" "$OUT/"
          python3 - <<'PY'
          import json,pathlib,xml.etree.ElementTree as ET
          out=pathlib.Path("build/reports/izzet-position1-registry-reinventory-llanowar")
          root=ET.parse(out/"TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml").getroot()
          registered=[]; missing=[]; suffix=" is registered in current runtime"
          for case in root.iter("testcase"):
              name=case.attrib["name"]
              card=name[:-len(suffix)] if name.endswith(suffix) else name
              if case.find("failure") is None and case.find("error") is None: registered.append(card)
              else: missing.append(card)
          summary={"schema":"izzet-position1-registry-reinventory-llanowar-summary-v1",
                   "tests":int(root.attrib.get("tests","0")),
                   "failures":int(root.attrib.get("failures","0")),
                   "errors":int(root.attrib.get("errors","0")),
                   "skipped":int(root.attrib.get("skipped","0")),
                   "registered":len(registered),"missing":len(missing),
                   "registered_names":sorted(registered),"missing_names":sorted(missing),
                   "llanowar_visionary_registered":"Llanowar Visionary" in registered}
          assert summary["tests"]==55
          assert summary["llanowar_visionary_registered"] is True
          (out/"registry-summary.json").write_text(json.dumps(summary,sort_keys=True,indent=2)+"\n")
          PY
      - name: Preserve original diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-position1-registry-reinventory-llanowar-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-position1-registry-reinventory-llanowar/
          if-no-files-found: error
          retention-days: 90

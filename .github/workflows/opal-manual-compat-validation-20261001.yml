name: Manual Opal Palace shared compatibility author validation
on:
  push:
    branches: ["validation/opal-manual-20261001"]
    paths: [".github/workflows/opal-manual-compat-validation-20261001.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_USER_HOME: /tmp/opal-manual-${{ github.run_id }}
      OUT: /tmp/opal-manual-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v6
        with:
          ref: e7d37e2ea0f18dfa8d6b0fff68ef816b59555d2d
          path: .phase1-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind exact Manual source and shared Opal bytes
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "87e2cab93c9d1652deca3e19cbad1d1ef49be93c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/opal-manual-compat-validation-20261001.yml"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/ManaSpellRider.kt)" = "5c6c1d4e8374a5375f79643a6e282fb728ab23b6"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/state/components/stack/StackComponents.kt)" = "a3526220f4b7f172ad8270d01da77a10dacfc158"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/core/Serialization.kt)" = "7cb03c944411532f8ecdeccff470129260a2aa01"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/spell/CastSpellHandler.kt)" = "c005200da84155b33f64a32de22833717cf4ccbf"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/ZoneTransitionService.kt)" = "5d3a49519e39402aed6bc4f6991b92e96cd13f18"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt)" = "abf5991587509e2c6199eff8b53bd46775c5690f"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c13/cards/OpalPalace.kt)" = "544a440160528f4a08211109936a55e263c39d19"
          test "$(git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/OpalPalaceScenarioTest.kt)" = "5b1be3a666cc615d8a274419479f1a885df9968c"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ths/cards/SwanSong.kt)" = "385ab04b2d05e7f8d160f156746cb4b69b4fbee9"
          test "$(git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/SwanSongScenarioTest.kt)" = "34e5f47d835610f30ff45628afe98a6fcdc158bc"
          mkdir "$OUT"
          git rev-parse HEAD HEAD^{tree} HEAD^ HEAD^^ 2>/dev/null || true > "$OUT/source.txt"
          git rev-parse HEAD > "$OUT/validation-head.txt"
          git rev-parse HEAD^ > "$OUT/bound-source-head.txt"
          git rev-parse HEAD^^ > "$OUT/bound-source-parent.txt" || true
          git diff --name-status HEAD^ HEAD > "$OUT/validation-delta.txt"
          printf '%s\n' 'AUTHOR_VALIDATION_ONLY_NO_GAMEPLAY_AUTHORITY' > "$OUT/authority.txt"
      - name: Compile affected set and gym test modules
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :mtg-sets:2008-2016:tests:compileTestKotlin :gym:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
      - name: Run exact Opal Palace and unchanged Swan Song scenario suites
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :mtg-sets:2008-2016:tests:test             --tests com.wingedsheep.engine.scenarios.OpalPalaceScenarioTest             --tests com.wingedsheep.engine.scenarios.SwanSongScenarioTest 2>&1 | tee "$OUT/opal-swan.log"
          cp mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.OpalPalaceScenarioTest.xml "$OUT/"
          cp mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.SwanSongScenarioTest.xml "$OUT/"
          python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ["OUT"])
          expected={
            "com.wingedsheep.engine.scenarios.OpalPalaceScenarioTest":10,
            "com.wingedsheep.engine.scenarios.SwanSongScenarioTest":4,
          }
          rows=[]
          for name,count in expected.items():
              p=out/f"TEST-{name}.xml"
              root=ET.parse(p).getroot()
              assert int(root.attrib["tests"])==count
              assert int(root.attrib["failures"])==0
              assert int(root.attrib["errors"])==0
              assert int(root.attrib["skipped"])==0
              rows.append({"suite":name,"tests":count})
          (out/"mechanics-summary.json").write_text(json.dumps({
            "schema":"opal-manual-compat-author-validation-v1",
            "authority":"AUTHOR_VALIDATION_ONLY_NOT_INDEPENDENT_REVIEW_OR_GAMEPLAY_ADMISSION",
            "suites":rows,
            "opal_registered_via_scenario_fixture":True,
            "swan_song_source_changed":False,
            "official_counters_delta":0
          },sort_keys=True,indent=2)+"\n")
          PY
      - name: Reinventory exact Manual Phase-2 registries with zero games
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/manual-transmission-phase2/bootstrap_audit.py --phase1 .phase1-source --out "$OUT/manual-registry-source"
          MT_P2_AUDIT_INPUT="$OUT/manual-registry-source/registry-requests.json"           MT_P2_AUDIT_OUTPUT="$OUT/manual-registry"             bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain               :gym:test --tests com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest 2>&1 | tee "$OUT/manual-registry.log"
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest.xml "$OUT/"
          python3 - <<'PY'
          import json, os, pathlib
          out=pathlib.Path(os.environ["OUT"])
          report=json.loads((out/"manual-registry/registry-report.json").read_text())
          rows=[]
          for d in report["decks"]:
              missing=[c["requested_name"] for c in d["cards"] if not c["registry_resolved"]]
              rows.append({"deck_id":d["deck_id"],"missing":len(missing),"missing_names":missing})
          (out/"manual-registry-summary.json").write_text(json.dumps({
            "schema":"manual-current-registry-summary-v2",
            "authority":"REGISTRY_DIAGNOSTIC_ONLY_NOT_RULES_OR_PILOT_QUALIFICATION",
            "decks":rows,
            "total_missing_physical":sum(x["missing"] for x in rows),
            "official_games_initialized":0,
            "official_outcomes":0
          },sort_keys=True,indent=2)+"\n")
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opal-manual-compat-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

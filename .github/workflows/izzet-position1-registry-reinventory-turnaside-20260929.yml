name: Izzet Position-1 registry reinventory after Turn Aside adoption
on:
  push:
    branches: ["izzet/position1-registry-reinventory-turnaside-20260929"]
    paths: [".github/workflows/izzet-position1-registry-reinventory-turnaside-20260929.yml"]
permissions: {contents: read}
jobs:
  fifty-five-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact post-Turn-Aside runtime diagnostic
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/izzet-position1-registry-reinventory-turnaside
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD^)" = "6184ccf3582274cf5981130015d6311940fc707b"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/izzet/IzzetPosition1RegistryInventoryTest.kt)" = "197a99e6c17885bb70511916893d3a33de217feb"
          test "$(git hash-object experiments/izzet-science/POSITION1_REGISTRY_REINVENTORY_TURNASIDE_BUDGET_20260929.json)" = "962c66fa7c486acaade52c222e7228c97ff9f8d9"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/som/cards/TurnAside.kt)" = "96a656b7fdd77ae10045d523e281eb34f5cb711e"
          test "$(git hash-object experiments/izzet-science/evidence/position1-turn-aside-main-adoption-20260929.json)" = "d7d2fd0c4b475b8e57f4174091613e14695b6ffe"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/izzet/IzzetPosition1RegistryInventoryTest.kt
            git hash-object experiments/izzet-science/POSITION1_REGISTRY_REINVENTORY_TURNASIDE_BUDGET_20260929.json
            git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/som/cards/TurnAside.kt
            git hash-object experiments/izzet-science/evidence/position1-turn-aside-main-adoption-20260929.json
            git hash-object .github/workflows/izzet-position1-registry-reinventory-turnaside-20260929.yml
            git status --porcelain
          } > "$OUT/source.txt"
      - name: Execute exact 55 registry identities against current main-derived runtime
        shell: bash
        run: |
          set -o pipefail
          just test-class IzzetPosition1RegistryInventoryTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-position1-registry-reinventory-turnaside/test.log
      - name: Retain and summarize exact XML
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/izzet-position1-registry-reinventory-turnaside
          XML=gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml
          cp "$XML" "$OUT/"
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          out=pathlib.Path("build/reports/izzet-position1-registry-reinventory-turnaside")
          xml=out/"TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml"
          root=ET.parse(xml).getroot()
          registered=[]; missing=[]
          suffix=" is registered in current runtime"
          for case in root.iter("testcase"):
              name=case.attrib["name"]
              card=name[:-len(suffix)] if name.endswith(suffix) else name
              if case.find("failure") is None and case.find("error") is None:
                  registered.append(card)
              else:
                  missing.append(card)
          summary={
            "schema":"izzet-position1-registry-reinventory-turnaside-summary-v1",
            "tests":int(root.attrib.get("tests","0")),
            "failures":int(root.attrib.get("failures","0")),
            "errors":int(root.attrib.get("errors","0")),
            "skipped":int(root.attrib.get("skipped","0")),
            "registered":len(registered),
            "missing":len(missing),
            "registered_names":sorted(registered),
            "missing_names":sorted(missing),
            "turn_aside_registered":"Turn Aside" in registered,
          }
          assert summary["tests"]==55, summary
          (out/"registry-summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          PY
      - name: Preserve original diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-position1-registry-reinventory-turnaside-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-position1-registry-reinventory-turnaside/
          if-no-files-found: error
          retention-days: 90

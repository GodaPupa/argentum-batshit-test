name: Pest Control Tier-1 Spy Policy Qualification

on:
  pull_request:
    paths:
      - .github/workflows/pest-control-tier-one-spy-policy.yml
      - 'docs/experiments/pest-control/tier-one-spy-policy*'
      - 'ai/src/main/kotlin/com/wingedsheep/ai/engine/**'
      - 'ai/src/test/kotlin/com/wingedsheep/ai/pestcontrol/PestSpyComboPolicyAuditTest.kt'

permissions:
  contents: read

jobs:
  qualify-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Qualify the exact Spy policy and default-profile regressions
        env:
          PEST_SPY_CLOSURE_REPORT: ${{ github.workspace }}/build/reports/pest-spy-policy/main-closure.txt
          PEST_SPY_ADMISSION_REPORT: ${{ github.workspace }}/build/reports/pest-spy-policy/admission.txt
        run: |
          set -euo pipefail
          output=build/reports/pest-spy-policy
          mkdir -p "$output"
          git rev-parse HEAD > "$output/source-commit.txt"
          cp docs/experiments/pest-control/tier-one-spy-policy-sources.json "$output/"
          python3 - <<'PYVERIFY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('docs/experiments/pest-control/tier-one-spy-policy-sources.json').read_text())
          for filename, digest in manifest['code_sha256'].items():
              assert hashlib.sha256(Path(filename).read_bytes()).hexdigest() == digest, filename
          print('Exact policy source hashes verified; no sampled gameplay')
          PYVERIFY
          run_stage() {
            local stage="$1" class="$2" module="$3" status=0
            scripts/test-class "$class" --info --stacktrace || status=$?
            mkdir -p "$output/test-results/$stage"
            if [ -d "$module/build/test-results/test" ]; then
              cp -a "$module/build/test-results/test/." "$output/test-results/$stage/"
            fi
            return "$status"
          }
          run_stage spy-policy PestSpyComboPolicyAuditTest ai
          run_stage default-payment-regression AutomaticAdditionalCostPaymentAiTest ai
          run_stage monster-pilot-regression PestMonsterTronPolicyAuditTest ai
          run_stage exact-spy-main PestControlTierOneSpyComboSupportBatchCTest gym
          run_stage frozen-admission PestControlTierOneSpyComboAdmissionTest gym
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pest-control-tier-one-spy-policy
          path: build/reports/pest-spy-policy
          if-no-files-found: error
          retention-days: 90

name: Manual remaining-card source diagnostic R1
on:
  push:
    branches: [validation/manual-remaining-card-diagnostic-r1-20261030]
    paths: ['.github/workflows/manual-remaining-card-diagnostic-r1-20261030.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 4fbe7821c1c8083d2452d1ac78890f9e0caa74c8
  SOURCE_TREE: 25f06bfbe49bb7ce1f695e01bd6e23fa9d96502d
  WORKFLOW: .github/workflows/manual-remaining-card-diagnostic-r1-20261030.yml
  RECORD: experiments/manual-transmission/research/remaining-card-diagnostic-r1-20261030
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile unchanged tools and collect five-card source diagnostics
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-remaining-card-diagnostic-r1-${{ github.run_id }}
          path: manual-remaining-card-diagnostic-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

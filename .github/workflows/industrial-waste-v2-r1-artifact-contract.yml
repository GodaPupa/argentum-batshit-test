name: Industrial Waste v2 R1 Artifact Contract

on:
  push:
    branches:
      - industrial-waste/v2-structural-redesign
    paths:
      - industrial-waste/v2/r1_artifact_contract.py
      - industrial-waste/v2/test_r1_artifact_contract.py
      - .github/workflows/industrial-waste-v2-r1-artifact-contract.yml

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify fail-closed artifact and completeness contract
        run: python3 -m unittest industrial-waste/v2/test_r1_artifact_contract.py -v
      - name: Emit reviewable seed-free contract descriptor
        shell: bash
        run: |
          set -euo pipefail
          python3 industrial-waste/v2/r1_artifact_contract.py \
            --descriptor-out build/reports/industrial-waste-v2/r1-artifact-contract.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("build/reports/industrial-waste-v2/r1-artifact-contract.json").read_text())
          assert r["status"] == "QUALIFIED_SEED_FREE_ARTIFACT_AND_COMPLETENESS_CONTRACT_ONLY"
          assert r["required_allocation_count"] == 512
          assert r["official_counters"] == {
              "allocations_initialized": 0,
              "actions_submitted": 0,
              "comparative_outcomes_exposed": 0,
          }
          assert r["claim_creation_authorized"] is False
          assert r["initialization_admitted"] is False
          assert r["execution_authorized"] is False
          assert r["candidate_promotion_authorized"] is False
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-v2-r1-artifact-contract
          path: build/reports/industrial-waste-v2/r1-artifact-contract.json
          if-no-files-found: error
          retention-days: 90

name: Sphinx accepted Ponder reorder and shuffle targeted
on:
  push:
    branches: ["sphinx/accepted-transition-journal-20260928"]
    paths:
      - ".github/workflows/sphinx-accepted-shuffle-targeted.yml"
permissions:
  contents: read
jobs:
  two-declared-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind accepted continuation source and exact two-case fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/sphinx-accepted-shuffle-targeted
          test "$(git rev-parse HEAD^)" = "6e369fe939ff967061f8f5f93876b341871cf4b4"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt)" = "ff29172b39ab9fb8099cba265e706530691de90f"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournalTest.kt)" = "a485f1faed6e647963b570e752560da238c5e686"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournalTest.kt; git hash-object .github/workflows/sphinx-accepted-shuffle-targeted.yml; git status --porcelain; } > build/reports/sphinx-accepted-shuffle-targeted/source.txt
      - name: Execute exact two fresh reorder and shuffle acceptance traces
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:test --tests 'com.wingedsheep.gym.sphinx.SphinxStageEAcceptedTransitionJournalTest' --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/sphinx-accepted-shuffle-targeted/test.log
      - name: Preserve original XML
        if: always()
        shell: bash
        run: |
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageEAcceptedTransitionJournalTest.xml build/reports/sphinx-accepted-shuffle-targeted/ 2>/dev/null || true
      - name: Upload original targeted evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-accepted-shuffle-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-accepted-shuffle-targeted/
          if-no-files-found: error
          retention-days: 90

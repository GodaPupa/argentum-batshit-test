name: Izzet M21 Snapshot Rebless

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebless-csp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mayhem/izzet-science
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Regenerate card snapshots canonically
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true
      - name: Fail closed on unrelated snapshot changes
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "mtg-sets/src/test/resources/snapshots/cards/M21.json"
          git diff --check
      - name: Commit canonical M21 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtg-sets/src/test/resources/snapshots/cards/M21.json
          git commit -m "Rebless Core Set 2021 snapshot for Llanowar Visionary"
          git push origin HEAD:mayhem/izzet-science

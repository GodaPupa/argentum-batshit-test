name: Face Value Forge Mana Lab

on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-forge-mana-lab.yml]

permissions:
  contents: read

jobs:
  mana-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone Forge and apply validated Face Value heuristics
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src rev-parse HEAD | tee forge-source-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          energy=Path('forge-src/forge-gui/res/cardsfolder/e/energy_tap.txt')
          t=energy.read_text()
          old="A:SP$ Tap | TgtPrompt$ Select target untapped creature you control | ValidTgts$ Creature.untapped+YouCtrl | SubAbility$ DBMana | SpellDescription$ Tap target untapped creature you control. If you do, add an amount of {C} equal to that creature's mana value."
          new="A:SP$ Tap | TgtPrompt$ Select target untapped creature you control | ValidTgts$ Creature.untapped+YouCtrl | AILogic$ EnergyTap | SubAbility$ DBMana | SpellDescription$ Tap target untapped creature you control. If you do, add an amount of {C} equal to that creature's mana value."
          assert old in t
          energy.write_text(t.replace(old,new).replace('\nAI:RemoveDeck:All',''))
          tap=Path('forge-src/forge-ai/src/main/java/forge/ai/ability/TapAi.java')
          s=tap.read_text(); needle='        final Player turn = phase.getPlayerTurn();\n\n'; assert needle in s
          lines=['        final Player turn = phase.getPlayerTurn();','',
            '        if ("EnergyTap".equals(sa.getParamOrDefault("AILogic", ""))) {',
            '            if (!phase.is(PhaseType.MAIN2, ai)) return new AiAbilityDecision(0, AiPlayDecision.WaitForMain2);',
            '            boolean hasFollowup = ai.getCardsIn(ZoneType.Hand).stream().anyMatch(c ->',
            '                    "Wretched Gryff".equals(c.getName()) || "Drownyard Lurker".equals(c.getName()) || "It of the Horrid Swarm".equals(c.getName()));',
            '            if (!hasFollowup) return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);',
            '            CardCollection candidates = CardLists.getTargetableCards(ai.getCreaturesInPlay(), sa);',
            '            candidates = CardLists.filter(candidates, CardPredicates.CAN_TAP);',
            '            Card choice = ComputerUtilCard.getMostExpensivePermanentAI(candidates);',
            '            if (choice == null || choice.getCMC() < 7) return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);',
            '            sa.resetTargets(); sa.getTargets().add(choice);',
            '            return new AiAbilityDecision(100, AiPlayDecision.WillPlay);','        }','']
          tap.write_text(s.replace(needle,'\n'.join(lines),1))
          rush=Path('forge-src/forge-gui/res/cardsfolder/r/rush_of_knowledge.txt')
          r=rush.read_text(); rold='A:SP$ Draw | Defined$ You | NumCards$ X | SpellDescription$ Draw cards equal to the highest mana value among permanents you control.'
          rnew='A:SP$ Draw | Defined$ You | NumCards$ X | AILogic$ FaceValueRush | SpellDescription$ Draw cards equal to the highest mana value among permanents you control.'
          assert rold in r; rush.write_text(r.replace(rold,rnew))
          draw=Path('forge-src/forge-ai/src/main/java/forge/ai/ability/DrawAi.java')
          d=draw.read_text(); dn='        boolean aboutToBeMyTurn = ph.getNextTurn().equals(ai) && ph.is(PhaseType.END_OF_TURN);\n\n'; assert dn in d
          dl=['        boolean aboutToBeMyTurn = ph.getNextTurn().equals(ai) && ph.is(PhaseType.END_OF_TURN);','',
            '        if ("FaceValueRush".equals(sa.getParamOrDefault("AILogic", ""))) {',
            '            int highest = ai.getCardsIn(ZoneType.Battlefield).stream().mapToInt(Card::getCMC).max().orElse(0);',
            '            if (highest < 7) return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);','        }','']
          draw.write_text(d.replace(dn,'\n'.join(dl),1))
          PY
          git -C forge-src diff -- forge-gui/res/cardsfolder/e/energy_tap.txt forge-ai/src/main/java/forge/ai/ability/TapAi.java forge-gui/res/cardsfolder/r/rush_of_knowledge.txt forge-ai/src/main/java/forge/ai/ability/DrawAi.java > forge-face-value-ai.patch

      - name: Build patched Forge
        run: |
          set -euxo pipefail
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"

      - name: Write mana variants and opponent
        run: |
          mkdir -p decks "$HOME/.forge/decks/constructed"
          python3 - <<'PY'
          from pathlib import Path
          nonlands='''4 Llanowar Elves
4 Nest Invader
4 Eldrazi Repurposer
1 Eyeless Watcher
4 Wretched Gryff
2 It of the Horrid Swarm
2 Annoyed Altisaur
1 Drownyard Lurker
1 Nyxborn Hydra
4 Malevolent Rumble
3 Energy Tap
2 Rush of Knowledge
4 Preordain
2 Snap
1 Lose Focus
1 Tamiyo's Safekeeping'''
          variants={
            'Face Value v0.7 Control 8F8I4T': (8,8,4),
            'Face Value Mana A 10F7I3T': (10,7,3),
            'Face Value Mana B 11F6I3T': (11,6,3),
          }
          for name,(f,i,t) in variants.items():
            body='[metadata]\nName='+name+'\nDeck Type=constructed\n[main]\n'+nonlands+f'\n{f} Forest\n{i} Island\n{t} Tangled Islet\n'
            Path('decks',name+'.dck').write_text(body)
          red='''[metadata]
Name=Muril0Ambra Mono Red Madness 2026-09-12
Deck Type=constructed
[main]
4 Voldaren Epicure
4 Kessig Flamebreather
4 Sneaky Snacker
3 Guttersnipe
4 Faithless Looting
4 Grab the Prize
4 Highway Robbery
4 Lava Dart
4 Lightning Bolt
4 Fiery Temper
3 Fireblast
18 Mountain
'''
          Path('decks/Muril0Ambra Mono Red Madness 2026-09-12.dck').write_text(red)
          PY
          cp decks/*.dck "$HOME/.forge/decks/constructed/"
          seq 930001 930020 > mana-lab-seeds.txt
          sha256sum mana-lab-seeds.txt decks/*.dck | tee mana-lab-inputs.sha256

      - name: Run matched three-way mana lab
        run: |
          set -euo pipefail
          mkdir -p mana-logs
          for variant in "Face Value v0.7 Control 8F8I4T" "Face Value Mana A 10F7I3T" "Face Value Mana B 11F6I3T"; do
            slug=$(echo "$variant" | tr ' ' '_' | tr -cd '[:alnum:]_')
            mkdir -p "mana-logs/$slug"
            while read -r seed; do
              "$FORGE_LAUNCHER" sim -d "$variant.dck" "Muril0Ambra Mono Red Madness 2026-09-12.dck" -n 1 -s "$seed" -c 60 > "mana-logs/$slug/$seed.log" 2>&1
            done < mana-lab-seeds.txt
          done

      - name: Audit mana lab
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          names={
            'Face_Value_v07_Control_8F8I4T':'control_8F8I4T',
            'Face_Value_Mana_A_10F7I3T':'A_10F7I3T',
            'Face_Value_Mana_B_11F6I3T':'B_11F6I3T'}
          out={}
          for folder,label in names.items():
            rec=[]
            for p in sorted((Path('mana-logs')/folder).glob('*.log')):
              text=p.read_text(errors='replace')
              if 'Ai(1)-' in text and re.search(r'Ai\(1\)-.* has won!',text): win='face'
              elif 'Ai(2)-Muril0Ambra Mono Red Madness 2026-09-12 has won!' in text: win='red'
              elif 'ended in a Draw' in text: win='draw'
              else: win='unknown'
              rec.append({'seed':int(p.stem),'winner':win,
                'llanowar_casts':len(re.findall(r'cast Llanowar Elves',text)),
                'repurposer_casts':len(re.findall(r'cast Eldrazi Repurposer',text)),
                'rumble_casts':len(re.findall(r'cast Malevolent Rumble',text)),
                'gryff_emerge':len(re.findall(r'Wretched Gryff - Creature 3 / 4 \(Emerge\)',text)),
                'engine_exception':bool(re.search(r'Exception|StackOverflowError|Stopping slow match as draw',text))})
            out[label]={'games':len(rec),'wins':sum(x['winner']=='face' for x in rec),'losses':sum(x['winner']=='red' for x in rec),'draws':sum(x['winner']=='draw' for x in rec),'unknown':sum(x['winner']=='unknown' for x in rec),'avg_llanowar_casts':sum(x['llanowar_casts'] for x in rec)/len(rec),'avg_repurposer_casts':sum(x['repurposer_casts'] for x in rec)/len(rec),'avg_rumble_casts':sum(x['rumble_casts'] for x in rec)/len(rec),'gryff_emerge':sum(x['gryff_emerge'] for x in rec),'engine_exceptions':sum(x['engine_exception'] for x in rec),'records':rec}
          Path('mana-lab-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)); print(json.dumps({k:{kk:vv for kk,vv in v.items() if kk!='records'} for k,v in out.items()},indent=2,sort_keys=True))
          PY

      - name: Preserve mana lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-forge-mana-lab
          path: |
            mana-lab-summary.json
            mana-lab-seeds.txt
            mana-lab-inputs.sha256
            mana-logs/**/*.log
            forge-face-value-ai.patch
            forge-source-commit.txt
            decks/*.dck
          if-no-files-found: warn

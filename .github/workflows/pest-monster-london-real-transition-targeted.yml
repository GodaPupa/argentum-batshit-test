name: Pest Monster real Tower Ent two-seat targeted
on:
  push:
    branches: ["pest/c2-pair-pilot-seam-20260927"]
    paths:
      - ".github/workflows/pest-monster-london-real-transition-targeted.yml"
permissions:
  contents: read
jobs:
  two-seat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source and cards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-london-real-transition-targeted
          test "$(git rev-parse HEAD^)" = "48763a47feac73cae53fef303d7c2cc89b970eb3"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonRealTransitionTest.kt)" = "de6e4b194390c2bedfce83f91d131769ae04279c"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonSetupBridge.kt)" = "3dfaf5a1a560e8f5c30ab34de1c2583656832251"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonTypecyclingPlan.kt)" = "8adf7684a58e67374cd814323815f1887ad66e1a"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/atq/cards/UrzasTower.kt)" = "8f280147686880fd921acc43b49f8bb5d5234431"
          test "$(git hash-object mtg-sets/2023/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ltr/cards/GenerousEnt.kt)" = "eb2dc664f794b69442d479525537404ba4201875"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonRealTransitionTest.kt; git hash-object .github/workflows/pest-monster-london-real-transition-targeted.yml; git status --porcelain; } > build/reports/pest-london-real-transition-targeted/source.txt
      - name: Execute two fresh legal action fixtures
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:test --tests 'com.wingedsheep.gym.matchup.PestMonsterLondonRealTransitionTest' --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-london-real-transition-targeted/test.log
      - name: Retain original XML and source
        if: always()
        shell: bash
        run: |
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.matchup.PestMonsterLondonRealTransitionTest.xml build/reports/pest-london-real-transition-targeted/ 2>/dev/null || true
      - name: Upload original evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-london-real-transition-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-london-real-transition-targeted/
          if-no-files-found: error
          retention-days: 90

name: Manual canonical Shorikai mechanics targeted
on:
  push:
    branches: ["manual/clean-pilot-boundary-receiving-20260927"]
    paths: [".github/workflows/manual-shorikai-mechanics-targeted.yml"]
permissions:
  contents: read
jobs:
  three-declared-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind canonical Shorikai Pilot test and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/manual-shorikai-mechanics-targeted
          test "$(git rev-parse HEAD^)" = "63768757e30f73d05351ba39e8e0dd1051988ec1"
          test "$(git hash-object mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/nec/NeonDynastyCommanderSet.kt)" = "abd90862c9207fcd120e1a5984b2e5bd3ffe98b1"
          test "$(git hash-object mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/nec/cards/ShorikaiGenesisEngine.kt)" = "43a869fce6dba351b2e2c4d981123c419fc94cc7"
          test "$(git hash-object mtg-sets/src/main/kotlin/com/wingedsheep/mtg/sets/tokens/PredefinedTokens.kt)" = "e0cf9e74b126aa103f7d2a35fe4d43c9f5c4ff34"
          test "$(git hash-object mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ShorikaiGenesisEngineScenarioTest.kt)" = "f1de9ae1ca8e41d205d48eaacafd14eb806af5a1"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/nec/NeonDynastyCommanderSet.kt; git hash-object mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/nec/cards/ShorikaiGenesisEngine.kt; git hash-object mtg-sets/src/main/kotlin/com/wingedsheep/mtg/sets/tokens/PredefinedTokens.kt; git hash-object mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ShorikaiGenesisEngineScenarioTest.kt; git hash-object .github/workflows/manual-shorikai-mechanics-targeted.yml; git status --porcelain; } > build/reports/manual-shorikai-mechanics-targeted/source.txt
      - name: Execute exact Shorikai and Pilot mechanics cases
        shell: bash
        run: |
          set -o pipefail
          just test-class ShorikaiGenesisEngineScenarioTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/manual-shorikai-mechanics-targeted/test.log
      - name: Retain exact XML
        if: always()
        run: cp mtg-sets/2017-2022/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.ShorikaiGenesisEngineScenarioTest.xml build/reports/manual-shorikai-mechanics-targeted/ 2>/dev/null || true
      - name: Preserve original evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-shorikai-mechanics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/manual-shorikai-mechanics-targeted/
          if-no-files-found: error
          retention-days: 90

name: Lilysplash Preflight

on:
  push:
    branches: ["lilysplash/lab"]
    paths:
      - ".github/workflows/lilysplash-preflight.yml"
      - "ai/src/test/kotlin/com/wingedsheep/ai/engine/LilysplashOpeningHandBenchmark.kt"

permissions:
  contents: read

jobs:
  opening-hands:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Setup just
        uses: extractions/setup-just@v3
      - name: Run paired mulligan-policy preflight
        run: just lilysplash-preflight

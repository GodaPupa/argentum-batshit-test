name: Lilysplash Preflight

on:
  push:
    branches: ["lilysplash/lab"]
    paths:
      - ".github/workflows/lilysplash-preflight.yml"
      - "ai/src/test/kotlin/com/wingedsheep/ai/engine/LilysplashOpeningHandBenchmark.kt"
      - "docs/experiments/lilysplash/challenger-land-v1.txt"
      - "docs/experiments/lilysplash/challenger-selection-v1.txt"
      - "docs/experiments/lilysplash/challenger-aura-v1.txt"
      - "docs/experiments/lilysplash/challenger-untap-v1.txt"
      - "docs/experiments/lilysplash/challenger-stack-v1.txt"
      - "docs/experiments/lilysplash/challenger-wincon-v1.txt"
      - "buildSrc/src/main/kotlin/kotlin-jvm.gradle.kts"
      - "justfile"

permissions:
  contents: read

jobs:
  land-challenger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Setup just
        uses: extractions/setup-just@v3
      - name: Run land-base challenger v1 preflight
        run: just lilysplash-land-challenger

  selection-challenger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 21

name: Izzet Owlbear exact three-case qualification candidate
on:
  push:
    branches: ["izzet/qualification-execute-20261001"]
    paths: ["experiments/izzet-science/IZZET_GATE_EXECUTION_MARKER_20261001.json"]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: catthehacker/ubuntu@sha256:7d51b26b65f00d97063cbda95699ee2aee2d4a7362f545ac29a4a18aaba7cfb3
      options: --platform linux/amd64
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64
      GRADLE_USER_HOME: /tmp/izzet-owlbear-gradle-20261001
      TZ: UTC
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Bind exact gate review and separate authorization before build
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(uname -m)" = x86_64
          echo '7d51cd6b48b521277f5caa4610a82126e315fa2be4df069823a8b1eeb5bd4a86  /usr/bin/python3.10' | sha256sum -c -
          echo '11af352aa2c506c4123a4e4c19c187d59e06cd0dff317d54f5e6806e07c6715d  /usr/lib/jvm/temurin-21-jdk-amd64/bin/java' | sha256sum -c -
          /usr/bin/python3.10 -I -S experiments/izzet-science/verify_owlbear_gate.py --plan experiments/izzet-science/OWLBEAR_QUALIFICATION_GATE_20261001.json --mode execution
          test ! -e "$GRADLE_USER_HOME" && test ! -L "$GRADLE_USER_HOME"
          test ! -e build/reports/izzet-owlbear-qualification-20261001
          test ! -e mtg-sets/2017-2022/tests/build/test-results/test
          test -z "${JAVA_TOOL_OPTIONS:-}${JDK_JAVA_OPTIONS:-}${_JAVA_OPTIONS:-}${CLASSPATH:-}${JAVA_OPTS:-}${GRADLE_OPTS:-}"
          mkdir -p build/reports/izzet-owlbear-qualification-20261001
          git rev-parse HEAD HEAD^{tree} > build/reports/izzet-owlbear-qualification-20261001/source.txt
          git ls-tree -r HEAD > build/reports/izzet-owlbear-qualification-20261001/source-tree.txt
          date -u +%s > build/reports/izzet-owlbear-qualification-20261001/start-epoch.txt
      - name: Compile only then execute the exact declared suites once
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/izzet-owlbear-qualification-20261001
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain :mtg-sets:2017-2022:tests:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
          date -u +%s > "$OUT/test-start-epoch.txt"
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain --info :mtg-sets:2017-2022:tests:test --tests com.wingedsheep.engine.scenarios.OwlbearScenarioTest --tests com.wingedsheep.engine.scenarios.OwlbearTrampleScenarioTest 2>&1 | tee "$OUT/tests.log"
          date -u +%s > "$OUT/test-end-epoch.txt"
          /usr/bin/python3.10 -I -S - <<'PY'
          import datetime,hashlib,json,pathlib,xml.etree.ElementTree as ET
          out=pathlib.Path('build/reports/izzet-owlbear-qualification-20261001')
          results=pathlib.Path('mtg-sets/2017-2022/tests/build/test-results/test')
          expected={'com.wingedsheep.engine.scenarios.OwlbearScenarioTest':1,'com.wingedsheep.engine.scenarios.OwlbearTrampleScenarioTest':2}
          files=list(results.glob('TEST-*.xml'))
          assert {p.name for p in files}=={'TEST-'+n+'.xml' for n in expected}
          rows=[];seen=set()
          low=int((out/'test-start-epoch.txt').read_text());high=int((out/'test-end-epoch.txt').read_text())
          for p in sorted(files):
              raw=p.read_bytes();suite=ET.fromstring(raw);name=suite.attrib['name']
              assert suite.tag=='testsuite' and name in expected
              assert p.name=='TEST-'+name+'.xml' and name not in seen
              seen.add(name)
              assert int(suite.attrib['tests'])==expected[name]
              assert all(int(suite.attrib[k])==0 for k in ('failures','errors','skipped'))
              cases=list(suite.iter('testcase'));assert len(cases)==expected[name]
              assert not any(list(suite.iter(k)) for k in ('failure','error','skipped'))
              stamp=datetime.datetime.fromisoformat(suite.attrib['timestamp'].replace('Z','+00:00'))
              if stamp.tzinfo is None:stamp=stamp.replace(tzinfo=datetime.timezone.utc)
              assert low-1 <= stamp.timestamp() <= high+1
              (out/p.name).write_bytes(raw)
              rows.append({'class':name,'tests':len(cases),'sha256':hashlib.sha256(raw).hexdigest()})
          assert seen==set(expected)
          total=sum(row['tests'] for row in rows)
          assert total==sum(expected.values())==3
          (out/'result.json').write_text(json.dumps({'authority':'ORIGINAL_FOR_SEPARATE_AUDIT_ONLY','suites':rows,'tests':total,'official_counters_delta':0,'registry_adoption':False},sort_keys=True)+'\n')
          PY
      - name: Preserve original even on compile or fixture failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-owlbear-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/izzet-owlbear-qualification-20261001/
            mtg-sets/2017-2022/tests/build/test-results/test/
            experiments/izzet-science/OWLBEAR_QUALIFICATION_GATE_20261001.json
            experiments/izzet-science/evidence/IZZET_GATE_ACCEPTANCE_20261001.json
            experiments/izzet-science/IZZET_GATE_EXECUTION_MARKER_20261001.json
          if-no-files-found: error
          retention-days: 90

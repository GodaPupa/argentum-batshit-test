name: Pest raw London M5 comparator probe
on:
  push:
    branches: ["pest/london-predicate-vector-20260928"]
    paths: [".github/workflows/pest-london-raw-m5-probe.yml"]
permissions: {contents: read}
jobs:
  six-atoms:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact frozen raw controller probe budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-london-raw-m5-probe
          test "$(git rev-parse HEAD^)" = "582008d67465bc93fa78b585d57f6ad33cd4eaba"
          test "$(git hash-object ai/src/main/kotlin/com/wingedsheep/ai/engine/EngineAiPlayerController.kt)" = "4f020ea2406e9bd6a87ec389685b48f15df4c5a3"
          test "$(git hash-object ai/src/test/kotlin/com/wingedsheep/ai/engine/PestMonsterLondonRawM5ProbeTest.kt)" = "6e9697d7359b8cbb47fa2741206d44888db2110a"
          test "$(git hash-object docs/experiments/pest-control/london-raw-m5-probe-budget-20260929.json)" = "02b98ef40a036044ef788a76a22cbffb7605f6bd"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object ai/src/main/kotlin/com/wingedsheep/ai/engine/EngineAiPlayerController.kt; git hash-object ai/src/test/kotlin/com/wingedsheep/ai/engine/PestMonsterLondonRawM5ProbeTest.kt; git hash-object docs/experiments/pest-control/london-raw-m5-probe-budget-20260929.json; git hash-object .github/workflows/pest-london-raw-m5-probe.yml; git status --porcelain; } > build/reports/pest-london-raw-m5-probe/source.txt
      - name: Execute six raw M5 representative atoms
        shell: bash
        run: |
          set -o pipefail
          just test-class PestMonsterLondonRawM5ProbeTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-london-raw-m5-probe/test.log
      - name: Preserve XML
        if: always()
        shell: bash
        run: |
          find . -path '*/build/test-results/test/TEST-com.wingedsheep.ai.engine.PestMonsterLondonRawM5ProbeTest.xml' -type f -exec cp {} build/reports/pest-london-raw-m5-probe/ \; || true
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-london-raw-m5-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-london-raw-m5-probe/
          if-no-files-found: error
          retention-days: 90

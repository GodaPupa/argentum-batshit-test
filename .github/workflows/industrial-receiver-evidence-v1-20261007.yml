name: Industrial receiver evidence v1 qualification
on:
  push:
    branches: ["validation/industrial-receiver-evidence-v1-20261007"]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: catthehacker/ubuntu@sha256:7d51b26b65f00d97063cbda95699ee2aee2d4a7362f545ac29a4a18aaba7cfb3
      options: --platform linux/amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Bind and preserve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "8c2826dd5e7eb5e75bef9f9d96b2380d9a7da511"
          test "$(git rev-parse 'HEAD^{tree}')" != ""
          test "$(git rev-parse 'HEAD^:')" = "29a1df47dfc8a880fc47d05a8b34f8af1853df2c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/industrial-receiver-evidence-v1-20261007.yml"
          test "$(git rev-parse HEAD^:industrial-waste/v2/R1_RECEIVER_EVIDENCE_SCOPE_20261007.json)" = "35da56085d050577cfacda28d8859ff27a093464"
          test "$(git rev-parse HEAD^:industrial-waste/v2/r1_receiver_evidence.py)" = "367845cb868990c8e31bb620aa8d0c0c9a1755a4"
          test "$(git rev-parse HEAD^:industrial-waste/v2/test_r1_receiver_evidence.py)" = "44f369c3851b5b4faf43be01695176905c06f142"
          git rev-parse HEAD 'HEAD^{tree}' HEAD^ 'HEAD^:' > /tmp/evidence/identities.txt
          /usr/bin/python3.10 --version > /tmp/evidence/python-version.txt
          sha256sum /usr/bin/python3.10 > /tmp/evidence/python-sha256.txt
          uname -a > /tmp/evidence/platform.txt
          cp industrial-waste/v2/R1_RECEIVER_EVIDENCE_SCOPE_20261007.json industrial-waste/v2/r1_receiver_evidence.py industrial-waste/v2/test_r1_receiver_evidence.py /tmp/evidence/
      - name: Synthetic qualification only
        shell: bash
        run: |
          set -euo pipefail
          cd industrial-waste/v2
          /usr/bin/python3.10 -B test_r1_receiver_evidence.py 2>&1 | tee /tmp/evidence/tests.log
      - name: Preserve original evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: industrial-receiver-evidence-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/evidence/
          if-no-files-found: error
          retention-days: 90

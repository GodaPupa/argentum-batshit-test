name: Ferocity current source08 one-shot offline export
on:
  push:
    branches: ["ferocity/current-offline-export-20260929"]
    paths: [".github/workflows/ferocity-current-offline-export.yml"]
permissions: {contents: read}
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACCEPTED_PATH_TOKEN: "36655120463"
      ACCEPTED_PLAN_SHA256: "3706ce1ef2276694bd3eebee66b3924bbec627841dec085ef35a0819c37b237b"
      ACCEPTED_MATERIAL_SHA256: "4bbac9ebf1dabd0e37486e461d967895fd62a89cb2c476ce607c20fa07ce2c53"
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Bind exact one-shot export budget source and review
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/ferocity-offline-export
          mkdir -p "$OUT/prelaunch"
          test "$(git rev-parse HEAD^)" = "c053cbfa6d8beb0d3654898f17e8d49c61719954"
          test "$(git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/CURRENT_SOURCE08_OFFLINE_EXPORT_EXECUTION_BUDGET.json)" = "8af7adffb84a72cb99262e50b6a201ac6bf6a3c9"
          test "$(git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/CURRENT_SOURCE08_EXPORT_PLAN_INDEPENDENT_REVIEW_20260929.json)" = "891bc3aa709164db26bb439cce110d4f4f920c32"
          test "$(git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/prepare_current_source08_export_material.py)" = "dd001c437f627b1615ccb590f2331589d4161f72"
          test "$(git hash-object ferocity-recycling/tools/first-cell-export/plan-assembly/assemble_export_plan.py)" = "1f0bb7bb71a4dc5cb5b61bcaf01f8359c6e426b4"
          test "$(git hash-object ferocity-recycling/tools/first-cell-export/export_first_cell.py)" = "c0657160a7b299a9d4a4eded6d1cebdeeb96e6c2"
          test "$(git hash-object ferocity-recycling/tools/first-cell-export/FerocityFinitePoolExport.java)" = "16ee5db350ee56e782a9f8c580e58bd8d24d80e6"
          test "$(git hash-object ferocity-recycling/tools/first-cell-export/GETTERS.json)" = "4acf900e4c3b100db5b71ba391ff615aba521bb8"
          test "$(git hash-object ferocity-recycling/tools/trial_watchdog.py)" = "2a236b9aa682c0f34b2a526033f58327fe7b99dd"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/CURRENT_SOURCE08_OFFLINE_EXPORT_EXECUTION_BUDGET.json
            git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/CURRENT_SOURCE08_EXPORT_PLAN_INDEPENDENT_REVIEW_20260929.json
            git hash-object ferocity-recycling/support-audits/source08-policy-selection-20260928/prepare_current_source08_export_material.py
            git hash-object ferocity-recycling/tools/first-cell-export/plan-assembly/assemble_export_plan.py
            git hash-object ferocity-recycling/tools/first-cell-export/export_first_cell.py
            git hash-object ferocity-recycling/tools/first-cell-export/FerocityFinitePoolExport.java
            git hash-object ferocity-recycling/tools/first-cell-export/GETTERS.json
            git hash-object ferocity-recycling/tools/trial_watchdog.py
            git hash-object .github/workflows/ferocity-current-offline-export.yml
            git status --porcelain
          } > "$OUT/prelaunch/source.txt"
      - name: Recreate and require exact independently reviewed plan before Java
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build/reports/ferocity-offline-export"
          FEROCITY_ACCEPTED_PATH_TOKEN="$ACCEPTED_PATH_TOKEN"             python3 ferocity-recycling/support-audits/source08-policy-selection-20260928/prepare_current_source08_export_material.py             | tee "$OUT/prelaunch/prepare.log"
          MATERIAL="$GITHUB_WORKSPACE/build/reports/ferocity-export-plan-assembly/material.json"
          MATERIAL_SHA="$(sha256sum "$MATERIAL" | awk '{print $1}')"
          test "$MATERIAL_SHA" = "$ACCEPTED_MATERIAL_SHA256"
          PLAN_DIR="$RUNNER_TEMP/ferocity-accepted-plan-$ACCEPTED_PATH_TOKEN"
          test ! -e "$PLAN_DIR"
          python3 ferocity-recycling/tools/first-cell-export/plan-assembly/assemble_export_plan.py             --material "$MATERIAL"             --material-sha256 "$ACCEPTED_MATERIAL_SHA256"             --output "$PLAN_DIR"             | tee "$OUT/prelaunch/assembly.log"
          PLAN_SHA="$(sha256sum "$PLAN_DIR/export-plan.json" | awk '{print $1}')"
          test "$PLAN_SHA" = "$ACCEPTED_PLAN_SHA256"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$PLAN_DIR/PLAN_ASSEMBLY_RECEIPT.json")" = "EXACT_MATERIAL_VALIDATED_REQUIRES_PLAN_AND_GATE_REVIEW"
          cp "$PLAN_DIR/export-plan.json" "$OUT/prelaunch/export-plan.json"
          cp "$PLAN_DIR/PLAN_ASSEMBLY_RECEIPT.json" "$OUT/prelaunch/PLAN_ASSEMBLY_RECEIPT.json"
          cp "$MATERIAL" "$OUT/prelaunch/material.json"
          cp "$GITHUB_WORKSPACE/build/reports/ferocity-export-plan-assembly/restore-receipt.json" "$OUT/prelaunch/restore-receipt.json"
          cp "$GITHUB_WORKSPACE/build/reports/ferocity-export-plan-assembly/class-path.json" "$OUT/prelaunch/class-path.json"
          printf '%s\n' "$PLAN_DIR/export-plan.json" > "$OUT/prelaunch/plan-path.txt"
          python3 - <<'PY'
          import json, pathlib
          out=pathlib.Path("build/reports/ferocity-offline-export/prelaunch")
          (out/"launch-permit.json").write_text(json.dumps({
            "scope":"ONE_PROSPECTIVE_OFFLINE_EXPORT_NO_GAME_NO_ENTROPY",
            "acceptedPlanSha256":"3706ce1ef2276694bd3eebee66b3924bbec627841dec085ef35a0819c37b237b",
            "acceptedMaterialSha256":"4bbac9ebf1dabd0e37486e461d967895fd62a89cb2c476ce607c20fa07ce2c53",
            "acceptedPathToken":"36655120463",
            "prelaunchPassed":True,
            "officialSeedsAllocated":0,
            "gamesInitialized":0
          },indent=2)+"\n")
          PY
      - name: Execute exact one-shot offline definition export and reload
        shell: bash
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/build/reports/ferocity-offline-export"
          PLAN_PATH="$(cat "$OUT/prelaunch/plan-path.txt")"
          EXPORT_OUTPUT="$RUNNER_TEMP/ferocity-offline-export-$GITHUB_RUN_ID"
          printf '%s\n' "$EXPORT_OUTPUT" > "$OUT/output-path.txt"
          set +e
          python3 ferocity-recycling/tools/first-cell-export/export_first_cell.py             --plan "$PLAN_PATH"             --plan-sha256 "$ACCEPTED_PLAN_SHA256"             --output "$EXPORT_OUTPUT"             2>&1 | tee "$OUT/export.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$OUT/export-exit-status.txt"
          exit "$status"
      - name: Verify successful export remains no-game and requires final admission
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build/reports/ferocity-offline-export"
          EXPORT_OUTPUT="$(cat "$OUT/output-path.txt")"
          python3 - "$EXPORT_OUTPUT" <<'PY'
          import hashlib, json, pathlib, sys
          output=pathlib.Path(sys.argv[1])
          receipt=json.loads((output/"export-receipt.json").read_text())
          launch=json.loads((output/"launch.json").read_text())
          process=json.loads((output/"process-result.json").read_text())
          assert receipt["scope"]=="OFFLINE_ARTIFACT_EXPORT_NO_GAME_NO_ENTROPY"
          assert receipt["status"]=="RAW_BUNDLE_AND_INLINE_DESCRIPTOR_RELOADED_WITH_QUALIFIED_VALIDATORS"
          assert receipt["definitions"]==36
          assert receipt["requiresFinalDevelopmentAdmissionVerificationBeforeEntropy"] is True
          assert launch["scope"]=="OFFLINE_EXPORT_NO_GAME_NO_ENTROPY"
          assert launch["planSha256"]=="3706ce1ef2276694bd3eebee66b3924bbec627841dec085ef35a0819c37b237b"
          assert process["classification"]=="EXIT_ZERO_REQUIRES_ENGINE_REPLAY"
          summary={
            "scope":"OFFLINE_EXPORT_NO_GAME_NO_ENTROPY",
            "definitions":36,
            "definitionBundleSha256":receipt["definitionBundleSha256"],
            "inlineTokenAdmissionSha256":receipt["inlineTokenAdmissionSha256"],
            "artifactValidationPinsSha256":receipt["artifactValidationPinsSha256"],
            "classpathSha256":receipt["classpathSha256"],
            "requiresFinalDevelopmentAdmissionVerificationBeforeEntropy":True,
            "processClassification":process["classification"],
            "officialSeedsAllocated":0,
            "gamesInitialized":0,
            "gameplayAuthorized":False
          }
          pathlib.Path("build/reports/ferocity-offline-export/success-summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          PY
      - name: Preserve complete original whether success or failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build/reports/ferocity-offline-export"
          EXPORT_OUTPUT="$(cat "$OUT/output-path.txt" 2>/dev/null || true)"
          if [ -n "$EXPORT_OUTPUT" ] && [ -d "$EXPORT_OUTPUT" ]; then
            mkdir -p "$OUT/export-output"
            cp -a "$EXPORT_OUTPUT/." "$OUT/export-output/"
          fi
          python3 - <<'PY'
          import json, pathlib
          out=pathlib.Path("build/reports/ferocity-offline-export")
          export=out/"export-output"
          state={
            "outputPresent":export.is_dir(),
            "launchRecorded":(export/"launch.json").is_file(),
            "supervisionSpecRecorded":(export/"supervision-spec.json").is_file(),
            "processResultRecorded":(export/"process-result.json").is_file(),
            "exportReceiptRecorded":(export/"export-receipt.json").is_file(),
            "definitionBundleRecorded":(export/"definition-bundle.json").is_file(),
            "officialSeedsAllocated":0,
            "gamesInitialized":0
          }
          (out/"execution-state.json").write_text(json.dumps(state,indent=2)+"\n")
          PY
      - name: Upload exact original offline-export evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ferocity-current-offline-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/ferocity-offline-export/
          if-no-files-found: error
          retention-days: 90

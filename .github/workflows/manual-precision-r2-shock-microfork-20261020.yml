name: Manual Precision R2 exact shockland microfork - NO FULL GAMES
on:
  push:
    branches: [research/manual-precision-r2-shock-microfork-20261020]
    paths:
      - '.github/workflows/manual-precision-r2-shock-microfork-20261020.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: manual-precision-r2-exact-primary-only
  cancel-in-progress: false
jobs:
  exact-source-forks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R2_OUTPUT: ${{ github.workspace }}/r2-shock-output
      MANUAL_R2_ORIGINAL_DIR: ${{ github.workspace }}/r2-original
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 32}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require exact single-workflow child of source-bound test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r2-shock-output
          git rev-parse HEAD > r2-shock-output/execution-commit.txt
          git rev-parse HEAD^{tree} > r2-shock-output/execution-tree.txt
          test "$GITHUB_REF" = "refs/heads/research/manual-precision-r2-shock-microfork-20261020"
          test "$(git rev-parse HEAD^)" = "0a341a1276f2d727a6aad8919578834174536727"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/manual-precision-r2-shock-microfork-20261020.yml"
          git merge-base --is-ancestor 84e6347bbcdfa2990eb304051771007daf849ce9 HEAD
          test "$(git rev-parse HEAD:ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualPrecisionR1GameplayHarnessTest.kt)" = "d90de59f63a3791128809d845abf4ee09124dc1c"
          test "$(git rev-parse HEAD:ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualPrecisionR2ShockMicroforkTest.kt)" = "48704a5af388c88345b90fb9cfc32ac225bbf13c"
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = "7984a2e87d8ddbe023d45620414d25a61691a040"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/core/GameInitializer.kt)" = "b4232ac2034b6d6163268ba8a72f4f628525ec5c"
          test "$(git diff --name-only 84e6347bbcdfa2990eb304051771007daf849ce9 HEAD | wc -l)" -eq 2
          echo "NO_NEW_COMMANDER_GAMES" > r2-shock-output/game-budget.txt
          chmod +x gradlew scripts/gradle-locked
      - name: Bind original Stage1 run and exact Challenger A seed 112 artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/GodaPupa/argentum-batshit-test/actions/runs/39477314282 > r2-shock-output/original-run.json
          jq -e '.id == 39477314282 and .status == "completed" and .conclusion == "success" and .head_sha == "84e6347bbcdfa2990eb304051771007daf849ce9"' r2-shock-output/original-run.json >/dev/null
          gh api /repos/GodaPupa/argentum-batshit-test/actions/runs/39477314282/artifacts > r2-shock-output/original-artifacts.json
          jq -e '[.artifacts[] | select(.id == 12290286293 and .name == "manual-precision-r1-stage1-game-a-202610202112-39477314282" and .expired == false and .digest == "sha256:a614eb9998b25dd34803434bb9ca80cf113b545483a185eac49cfcd419c7fd09")] | length == 1' r2-shock-output/original-artifacts.json >/dev/null
      - name: Retrieve the original exact R1 seed112 Challenger A game
        uses: actions/download-artifact@v4
        with:
          name: manual-precision-r1-stage1-game-a-202610202112-39477314282
          repository: GodaPupa/argentum-batshit-test
          run-id: 39477314282
          github-token: ${{ github.token }}
          path: r2-original
      - name: Hash original trace files before any replay
        shell: bash
        run: |
          set -euo pipefail
          echo "cf00fb2f7c8f8cc7745639a081e403c9fc988d0cbb09d017a4130a92696a8adf  r2-original/precision-r1-stage1-output/a-seed-202610202112/initial-state.json" | sha256sum --check
          echo "ae1c68d142b1661ed11102a2eb33238623ef94f4fda0e0ebc196f962d5e51d90  r2-original/precision-r1-stage1-output/a-seed-202610202112/actions.jsonl" | sha256sum --check
          printf '%s\n' cf00fb2f7c8f8cc7745639a081e403c9fc988d0cbb09d017a4130a92696a8adf > r2-shock-output/original-initial-hash.txt
          printf '%s\n' ae1c68d142b1661ed11102a2eb33238623ef94f4fda0e0ebc196f962d5e51d90 > r2-shock-output/original-actions-hash.txt
      - name: Replay 13 original actions and fork exact r0 two-life decision with ActionProcessor
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualPrecisionR2ShockMicroforkTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r2-shock-output/r2-primary-test.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("r2-shock-output/r2-primary-microfork.json").read_text())
          assert x["status"] == "R2_EXACT_REAL_ENGINE_MICROFORK"
          assert x["originalRun"] == 39477314282 and x["originalArtifact"] == 12290286293
          assert x["originalActionsReplayedExactly"] == 13 and x["originalDecisionAction"] == 14
          assert x["r5RespondedNo"] is True
          assert x["noPaymentLife"] == 40 and x["yesPaymentLife"] == 38
          assert x["noPaymentTapped"] is True and x["yesPaymentTapped"] is False
          assert x["noPaymentAffordableArborElf"] is False and x["yesPaymentAffordableArborElf"] is True
          assert x["yesArborElfEngineCastAccepted"] is True and x["noEventsMatchOriginal"] is True
          assert x["newFullGames"] == 0 and x["productionPolicyChanges"] == 0
          print("MANUAL_R2_EXACT_PRIMARY_MICROFORK_CONFIRMED")
          PY
      - name: Preserve original-state microfork receipts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-precision-r2-shock-microfork-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            r2-shock-output/
            ai/build/test-results/test/

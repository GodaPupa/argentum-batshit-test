name: Izzet Position-1 Engine Batch AA

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-aa.yml"

permissions:
  contents: read

jobs:
  qualify-batch-aa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch AA gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'V07_DECK_AUDIT_NO_CHANGE' izzet-science/v07-deck-level-audit-no-change.md
          grep -Fq 'V09_CARD_CONTROL_ARCHITECTURE_AUDIT_KEEP_V07' izzet-science/v09-card-control-architecture-audit.md
          grep -Fq 'Expected post-implementation unresolved count is exactly 26' izzet-science/v09-position1-engine-batch-aa-gate.md
          grep -Fq '35998536694' izzet-science/v09-position1-engine-batch-aa-gate.md
          grep -Fq '660374cd8ae40104c23f1c46464c87c8633696f3' izzet-science/v09-position1-engine-batch-aa-gate.md

      - name: Requalify canonical card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --stacktrace

      - name: Run Shrine Steward semantics
        run: scripts/test-class ShrineStewardScenarioTest --info --stacktrace

      - name: Run exact real-engine coverage regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-aa.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=26' /tmp/batch-aa.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Shrine Steward' /tmp/batch-aa.txt
          ! grep -Fq 'V09_REAL_ENGINE_UNRESOLVED=unresolved Izzet card:' /tmp/batch-aa.txt

      - name: Assert official experiment remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt

      - name: Emit Batch AA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izzet-batch-aa
          cp /tmp/batch-aa.txt /tmp/izzet-batch-aa/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-aa-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "frozen_control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "implemented=Shrine Steward;existing optional ETB library-search+OR-subtype filter rail"
            echo "snapshot_run=35998536694"
            echo "snapshot_commit=660374cd8ae40104c23f1c46464c87c8633696f3"
            echo "unresolved_before=27"
            echo "unresolved_after=26"
            echo "unresolved_izzet_after=0"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/neo/cards/ShrineSteward.kt
            sha256sum mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ShrineStewardScenarioTest.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/v09-position1-engine-batch-aa-gate.md
            sha256sum mtg-sets/src/test/resources/snapshots/cards/NEO.json
            sha256sum /tmp/izzet-batch-aa/test-output.txt
          } > /tmp/izzet-batch-aa/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-aa
          path: /tmp/izzet-batch-aa
          if-no-files-found: error

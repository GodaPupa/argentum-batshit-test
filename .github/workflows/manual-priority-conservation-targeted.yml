name: Manual R3-P executable priority choice targeted
on:
  push:
    branches: ["manual/clean-pilot-boundary-receiving-20260927"]
    paths: [".github/workflows/manual-priority-conservation-targeted.yml"]
permissions:
  contents: read
jobs:
  eight-declared-choices:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind prospective source fixture boundary and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/manual-priority-targeted
          test "$(git rev-parse HEAD^)" = "6a9cd3ac9724d9f1acce1a438da63dc884acd7ae"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoPriorityConservationPolicy.kt)" = "8fec7b06ed4d20ac138b4f0d0500fc6d39926d4e"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoPriorityConservationPolicyTest.kt)" = "83feaee194c4010f8078ccf583b21424e8447258"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/PhaseTwoPilotBoundary.kt)" = "321c4234b4670284d8c9fa9b7a0ef819e3ccc8fb"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoPriorityConservationPolicy.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoPriorityConservationPolicyTest.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/PhaseTwoPilotBoundary.kt; git hash-object experiments/manual-transmission-phase2/priority-conservation-receiving-budget.json; git hash-object .github/workflows/manual-priority-conservation-targeted.yml; git status --porcelain; } > build/reports/manual-priority-targeted/source.txt
      - name: Execute exactly eight fresh declared strategic choices
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:test --tests 'com.wingedsheep.gym.manual.ManualPhaseTwoPriorityConservationPolicyTest' --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/manual-priority-targeted/test.log
      - name: Retain exact XML
        if: always()
        shell: bash
        run: |
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.manual.ManualPhaseTwoPriorityConservationPolicyTest.xml build/reports/manual-priority-targeted/ 2>/dev/null || true
      - name: Retain original behavioral evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-priority-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/manual-priority-targeted/
          if-no-files-found: error
          retention-days: 90

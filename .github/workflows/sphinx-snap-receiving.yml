name: Sphinx Snap receiving
on:
  push:
    branches: ["sphinx/whole-actor-surface-inventory-20260928"]
    paths: [".github/workflows/sphinx-snap-receiving.yml"]
permissions: {contents: read}
jobs:
  three-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact Snap sources fixture budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/sphinx-snap-receiving
          test "$(git rev-parse HEAD^)" = "c9c29c46b7c40d43fd475aabfca098099021fdfb"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEActorAdapter.kt)" = "20865204fec378f37045c54993ac1a85c3acac00"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEPilotComponent.kt)" = "095a2e8d32dd96d62960128eebcd17b09e8f4bb2"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageESnapReceivingTest.kt)" = "ba526e0720792ebd89da345a2bd87a852eeffb86"
          test "$(git hash-object sphinx-approach/STAGE_E_SNAP_RECEIVING_BUDGET_20260928.json)" = "8ea3cdca7c700f9caaf378215ae0963a70d71281"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEActorAdapter.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEPilotComponent.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageESnapReceivingTest.kt; git hash-object sphinx-approach/STAGE_E_SNAP_RECEIVING_BUDGET_20260928.json; git hash-object .github/workflows/sphinx-snap-receiving.yml; git status --porcelain; } > build/reports/sphinx-snap-receiving/source.txt
      - name: Run three fresh real Snap receiving traces
        shell: bash
        run: |
          set -o pipefail
          just test-class SphinxStageESnapReceivingTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/sphinx-snap-receiving/test.log
      - name: Preserve XML
        if: always()
        shell: bash
        run: cp gym/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageESnapReceivingTest.xml build/reports/sphinx-snap-receiving/ 2>/dev/null || true
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-snap-receiving-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-snap-receiving/
          if-no-files-found: error
          retention-days: 90

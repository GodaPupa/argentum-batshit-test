name: Industrial Waste v2 R1 Allocation Plan

on:
  push:
    branches:
      - industrial-waste/v2-structural-redesign
    paths:
      - industrial-waste/v2/r1_allocation_plan.py
      - industrial-waste/v2/test_r1_allocation_plan.py
      - .github/workflows/industrial-waste-v2-r1-allocation-plan.yml

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify exact fail-closed plan compiler
        run: python3 -m unittest industrial-waste/v2/test_r1_allocation_plan.py -v
      - name: Compile the frozen 512-allocation plan
        shell: bash
        run: |
          set -euo pipefail
          python3 industrial-waste/v2/r1_allocation_plan.py \
            --source-head "$GITHUB_SHA" \
            --out build/reports/industrial-waste-v2/r1-allocation-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/reports/industrial-waste-v2/r1-allocation-plan.json")
          r = json.loads(p.read_text())
          assert r["status"] == "QUALIFIED_SEED_FREE_EXACT_512_ALLOCATION_PLAN_ONLY"
          assert len(r["allocations"]) == 512
          assert r["allocations"][0]["allocation_id"] == "IW_V2_R1_0001"
          assert r["allocations"][-1]["allocation_id"] == "IW_V2_R1_0512"
          assert r["official_counters"] == {
              "allocations_initialized": 0,
              "actions_submitted": 0,
              "comparative_outcomes_exposed": 0,
          }
          assert r["claim_creation_authorized"] is False
          assert r["initialization_admitted"] is False
          assert r["execution_authorized"] is False
          assert r["closes_official_r1_corpus_runner_binding"] is False
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-v2-r1-allocation-plan
          path: build/reports/industrial-waste-v2/r1-allocation-plan.json
          if-no-files-found: error
          retention-days: 90

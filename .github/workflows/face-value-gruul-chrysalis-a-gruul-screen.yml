name: Face Value Gruul Chrysalis A Gruul Screen
on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-gruul-chrysalis-a-gruul-screen.yml]
permissions: {contents: read}
jobs:
  screen:
    uses: ./.github/workflows/face-value-experiment-harness.yml
    with:
      experiment_name: gruul-chrysalis-a-gruul-screen
      control_deck: experiments/face-value/decks/fv-v12-control.dck
      challenger_deck: experiments/face-value/decks/fv-gruul-chrysalis-a.dck
      opponent_deck: experiments/face-value/decks/gruul-ramp.dck
      seed_start: 1310001
      games: 20

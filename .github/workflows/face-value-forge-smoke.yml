name: Face Value Forge Energy Tap AI Audit

on:
  push:
    branches:
      - face-value/lab
    paths:
      - .github/workflows/face-value-forge-smoke.yml

permissions:
  contents: read

jobs:
  forge-energy-tap-ai-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone current Forge source
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src rev-parse HEAD | tee forge-source-commit.txt

      - name: Apply narrow Energy Tap AI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          card = Path('forge-src/forge-gui/res/cardsfolder/e/energy_tap.txt')
          text = card.read_text()
          old = "A:SP$ Tap | TgtPrompt$ Select target untapped creature you control | ValidTgts$ Creature.untapped+YouCtrl | SubAbility$ DBMana | SpellDescription$ Tap target untapped creature you control. If you do, add an amount of {C} equal to that creature's mana value."
          new = "A:SP$ Tap | TgtPrompt$ Select target untapped creature you control | ValidTgts$ Creature.untapped+YouCtrl | AILogic$ EnergyTap | SubAbility$ DBMana | SpellDescription$ Tap target untapped creature you control. If you do, add an amount of {C} equal to that creature's mana value."
          assert old in text
          card.write_text(text.replace(old, new).replace('\nAI:RemoveDeck:All', ''))
          tap = Path('forge-src/forge-ai/src/main/java/forge/ai/ability/TapAi.java')
          src = tap.read_text()
          needle = '        final Player turn = phase.getPlayerTurn();\n\n'
          assert needle in src
          lines = [
              '        final Player turn = phase.getPlayerTurn();',
              '',
              '        if ("EnergyTap".equals(sa.getParamOrDefault("AILogic", ""))) {',
              '            if (!phase.is(PhaseType.MAIN2, ai)) {',
              '                return new AiAbilityDecision(0, AiPlayDecision.WaitForMain2);',
              '            }',
              '            boolean hasFollowup = ai.getCardsIn(ZoneType.Hand).stream()',
              '                    .anyMatch(c -> c.getCMC() >= 3 || "Nyxborn Hydra".equals(c.getName()));',
              '            if (!hasFollowup) {',
              '                return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);',
              '            }',
              '            CardCollection candidates = CardLists.getTargetableCards(ai.getCreaturesInPlay(), sa);',
              '            candidates = CardLists.filter(candidates, CardPredicates.CAN_TAP);',
              '            Card choice = ComputerUtilCard.getMostExpensivePermanentAI(candidates);',
              '            if (choice == null || choice.getCMC() < 7) {',
              '                return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);',
              '            }',
              '            sa.resetTargets();',
              '            sa.getTargets().add(choice);',
              '            return new AiAbilityDecision(100, AiPlayDecision.WillPlay);',
              '        }',
              ''
          ]
          tap.write_text(src.replace(needle, '\n'.join(lines), 1))
          Path('energy-tap-ai.patch.txt').write_text('Energy Tap AI lab patch v2: Main2 only, MV7+ target, 3+ MV or Hydra follow-up.\n')
          PY
          git -C forge-src diff -- forge-gui/res/cardsfolder/e/energy_tap.txt forge-ai/src/main/java/forge/ai/ability/TapAi.java | tee forge-energy-tap.patch

      - name: Build patched Forge desktop
        run: |
          set -euxo pipefail
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"

      - name: Write and install test decks
        run: |
          mkdir -p decks "$HOME/.forge/decks/constructed"
          cat > "decks/Face Value v0.7.dck" <<'EOF'
          [metadata]
          Name=Face Value v0.7
          Deck Type=constructed
          [main]
          4 Llanowar Elves
          4 Nest Invader
          4 Eldrazi Repurposer
          1 Eyeless Watcher
          4 Wretched Gryff
          2 It of the Horrid Swarm
          2 Annoyed Altisaur
          1 Drownyard Lurker
          1 Nyxborn Hydra
          4 Malevolent Rumble
          3 Energy Tap
          2 Rush of Knowledge
          4 Preordain
          2 Snap
          1 Lose Focus
          1 Tamiyo's Safekeeping
          8 Forest
          8 Island
          4 Tangled Islet
          EOF
          cat > "decks/Mono Red Madness Aggregate.dck" <<'EOF'
          [metadata]
          Name=Mono Red Madness Aggregate
          Deck Type=constructed
          [main]
          4 Fiery Temper
          4 Lightning Bolt
          4 Sneaky Snacker
          4 Grab the Prize
          3 Fireblast
          3 Guttersnipe
          4 Lava Dart
          4 Highway Robbery
          4 Faithless Looting
          4 Kessig Flamebreather
          4 Voldaren Epicure
          18 Mountain
          EOF
          cp decks/*.dck "$HOME/.forge/decks/constructed/"

      - name: Run 20-game patched Forge audit
        run: |
          set -o pipefail
          "$FORGE_LAUNCHER" sim -d "Face Value v0.7.dck" "Mono Red Madness Aggregate.dck" -n 20 -c 60 2>&1 | tee forge-energy-tap-audit.log

      - name: Summarize patched pilot behavior
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          text = Path('forge-energy-tap-audit.log').read_text(errors='replace') if Path('forge-energy-tap-audit.log').exists() else ''
          summary = {
              'games_reported': len(re.findall(r'Game Result: Game \d+', text)),
              'face_value_wins': len(re.findall(r'Ai\(1\)-Face Value v0\.7 has won', text)),
              'mono_red_wins': len(re.findall(r'Ai\(2\)-Mono Red Madness Aggregate has won', text)),
              'energy_tap_casts': len(re.findall(r'cast Energy Tap targeting', text)),
              'energy_tap_resolutions': len(re.findall(r'Resolve Stack: Energy Tap', text)),
              'wretched_gryff_emerge_resolutions': len(re.findall(r'Wretched Gryff - Creature 3 / 4 \(Emerge\)', text)),
              'it_emerge_mentions': len(re.findall(r'It of the Horrid Swarm.*Emerge', text)),
              'rush_casts': len(re.findall(r'cast Rush of Knowledge', text)),
              'hydra_bestow_casts': len(re.findall(r'cast Nyxborn Hydra targeting', text)),
              'hydra_total_mentions': text.count('Nyxborn Hydra')
          }
          Path('forge-energy-tap-audit-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True))
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Preserve patched Forge audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-forge-energy-tap-ai-audit
          path: |
            forge-energy-tap-audit.log
            forge-energy-tap-audit-summary.json
            forge-energy-tap.patch
            energy-tap-ai.patch.txt
            forge-source-commit.txt
            decks/*.dck
          if-no-files-found: warn

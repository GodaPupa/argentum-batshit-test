name: Face Value Forge Pilot Audit

on:
  push:
    branches:
      - face-value/lab
    paths:
      - .github/workflows/face-value-forge-smoke.yml

permissions:
  contents: read

jobs:
  forge-pilot-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download Forge 2.0.15 snapshot desktop distribution
        run: |
          set -euxo pipefail
          curl -L --retry 3 -o forge.tar.bz2 \
            https://github.com/Card-Forge/forge/releases/download/daily-snapshots/forge-installer-2.0.15-SNAPSHOT-09.16.tar.bz2
          mkdir forge-dist
          tar -xjf forge.tar.bz2 -C forge-dist
          find forge-dist -maxdepth 4 -type f > forge-files.txt
          FORGE_LAUNCHER="$(find forge-dist -type f -name 'forge.sh' -print -quit)"
          test -n "$FORGE_LAUNCHER"
          chmod +x "$FORGE_LAUNCHER"
          echo "FORGE_LAUNCHER=$FORGE_LAUNCHER" >> "$GITHUB_ENV"

      - name: Write Face Value v0.7 deck
        run: |
          mkdir -p decks
          cat > "decks/Face Value v0.7.dck" <<'EOF'
          [metadata]
          Name=Face Value v0.7
          Deck Type=constructed
          [main]
          4 Llanowar Elves
          4 Nest Invader
          4 Eldrazi Repurposer
          1 Eyeless Watcher
          4 Wretched Gryff
          2 It of the Horrid Swarm
          2 Annoyed Altisaur
          1 Drownyard Lurker
          1 Nyxborn Hydra
          4 Malevolent Rumble
          3 Energy Tap
          2 Rush of Knowledge
          4 Preordain
          2 Snap
          1 Lose Focus
          1 Tamiyo's Safekeeping
          8 Forest
          8 Island
          4 Tangled Islet
          EOF

      - name: Write current Mono-Red Madness aggregate deck
        run: |
          cat > "decks/Mono Red Madness Aggregate.dck" <<'EOF'
          [metadata]
          Name=Mono Red Madness Aggregate
          Deck Type=constructed
          [main]
          4 Fiery Temper
          4 Lightning Bolt
          4 Sneaky Snacker
          4 Grab the Prize
          3 Fireblast
          3 Guttersnipe
          4 Lava Dart
          4 Highway Robbery
          4 Faithless Looting
          4 Kessig Flamebreather
          4 Voldaren Epicure
          18 Mountain
          EOF

      - name: Validate and install decks for Forge
        run: |
          python3 - <<'PY'
          import re, pathlib
          for path in pathlib.Path('decks').glob('*.dck'):
              in_main=False; total=0
              for line in path.read_text().splitlines():
                  if line.strip()=='[main]': in_main=True; continue
                  if line.startswith('[') and line.strip()!='[main]': in_main=False
                  if in_main:
                      m=re.match(r'^(\d+)\s+', line.strip())
                      if m: total += int(m.group(1))
              print(path.name, total)
              assert total==60, (path,total)
          PY
          mkdir -p "$HOME/.forge/decks/constructed"
          cp decks/*.dck "$HOME/.forge/decks/constructed/"

      - name: Run 20-game Forge pilot audit
        run: |
          set -o pipefail
          "$FORGE_LAUNCHER" sim \
            -d "Face Value v0.7.dck" "Mono Red Madness Aggregate.dck" \
            -n 20 -c 60 2>&1 | tee forge-pilot-audit.log

      - name: Summarize pilot behavior
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('forge-pilot-audit.log')
          text=p.read_text(errors='replace') if p.exists() else ''
          keys=['Wretched Gryff','It of the Horrid Swarm','Energy Tap','Rush of Knowledge','Nyxborn Hydra','Drownyard Lurker','Annoyed Altisaur']
          summary={k: text.count(k) for k in keys}
          summary['games_reported']=len(re.findall(r'Game Result: Game \d+', text))
          summary['face_value_wins']=len(re.findall(r'Ai\(1\)-Face Value v0\.7 has won', text))
          summary['mono_red_wins']=len(re.findall(r'Ai\(2\)-Mono Red Madness Aggregate has won', text))
          # Indicators useful for manual trace audit; these are text-presence counts, not final strategic classifications.
          summary['emerge_mentions']=len(re.findall(r'(?i)emerge', text))
          summary['bestow_mentions']=len(re.findall(r'(?i)bestow', text))
          Path('forge-pilot-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True))
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Preserve Forge pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-forge-pilot-audit
          path: |
            forge-pilot-audit.log
            forge-pilot-summary.json
            forge-files.txt
            decks/*.dck
          if-no-files-found: warn

name: Face Value Forge Fixed-Seed Matchup Block

on:
  push:
    branches:
      - face-value/lab
    paths:
      - .github/workflows/face-value-forge-smoke.yml

permissions:
  contents: read

jobs:
  forge-fixed-seed-matchup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone current Forge source
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src rev-parse HEAD | tee forge-source-commit.txt

      - name: Apply Face Value pilot heuristics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          energy = Path('forge-src/forge-gui/res/cardsfolder/e/energy_tap.txt')
          et = energy.read_text()
          et_old = "A:SP$ Tap | TgtPrompt$ Select target untapped creature you control | ValidTgts$ Creature.untapped+YouCtrl | SubAbility$ DBMana | SpellDescription$ Tap target untapped creature you control. If you do, add an amount of {C} equal to that creature's mana value."
          et_new = "A:SP$ Tap | TgtPrompt$ Select target untapped creature you control | ValidTgts$ Creature.untapped+YouCtrl | AILogic$ EnergyTap | SubAbility$ DBMana | SpellDescription$ Tap target untapped creature you control. If you do, add an amount of {C} equal to that creature's mana value."
          assert et_old in et
          energy.write_text(et.replace(et_old, et_new).replace('\nAI:RemoveDeck:All', ''))

          tap = Path('forge-src/forge-ai/src/main/java/forge/ai/ability/TapAi.java')
          src = tap.read_text()
          needle = '        final Player turn = phase.getPlayerTurn();\n\n'
          assert needle in src
          tap_lines = [
              '        final Player turn = phase.getPlayerTurn();',
              '',
              '        if ("EnergyTap".equals(sa.getParamOrDefault("AILogic", ""))) {',
              '            if (!phase.is(PhaseType.MAIN2, ai)) {',
              '                return new AiAbilityDecision(0, AiPlayDecision.WaitForMain2);',
              '            }',
              '            boolean hasFollowup = ai.getCardsIn(ZoneType.Hand).stream()',
              '                    .anyMatch(c -> c.getCMC() >= 5 || "Nyxborn Hydra".equals(c.getName()));',
              '            if (!hasFollowup) {',
              '                return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);',
              '            }',
              '            CardCollection candidates = CardLists.getTargetableCards(ai.getCreaturesInPlay(), sa);',
              '            candidates = CardLists.filter(candidates, CardPredicates.CAN_TAP);',
              '            Card choice = ComputerUtilCard.getMostExpensivePermanentAI(candidates);',
              '            if (choice == null || choice.getCMC() < 7) {',
              '                return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);',
              '            }',
              '            sa.resetTargets();',
              '            sa.getTargets().add(choice);',
              '            return new AiAbilityDecision(100, AiPlayDecision.WillPlay);',
              '        }',
              ''
          ]
          tap.write_text(src.replace(needle, '\n'.join(tap_lines), 1))

          rush = Path('forge-src/forge-gui/res/cardsfolder/r/rush_of_knowledge.txt')
          rt = rush.read_text()
          r_old = 'A:SP$ Draw | Defined$ You | NumCards$ X | SpellDescription$ Draw cards equal to the highest mana value among permanents you control.'
          r_new = 'A:SP$ Draw | Defined$ You | NumCards$ X | AILogic$ FaceValueRush | SpellDescription$ Draw cards equal to the highest mana value among permanents you control.'
          assert r_old in rt
          rush.write_text(rt.replace(r_old, r_new))

          draw = Path('forge-src/forge-ai/src/main/java/forge/ai/ability/DrawAi.java')
          ds = draw.read_text()
          dneedle = '        boolean aboutToBeMyTurn = ph.getNextTurn().equals(ai) && ph.is(PhaseType.END_OF_TURN);\n\n'
          assert dneedle in ds
          draw_lines = [
              '        boolean aboutToBeMyTurn = ph.getNextTurn().equals(ai) && ph.is(PhaseType.END_OF_TURN);',
              '',
              '        if ("FaceValueRush".equals(sa.getParamOrDefault("AILogic", ""))) {',
              '            int highest = ai.getCardsIn(ZoneType.Battlefield).stream()',
              '                    .mapToInt(Card::getCMC).max().orElse(0);',
              '            if (highest < 7) {',
              '                return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);',
              '            }',
              '        }',
              ''
          ]
          draw.write_text(ds.replace(dneedle, '\n'.join(draw_lines), 1))

          Path('face-value-forge-ai-notes.txt').write_text(
              'Lab-only Forge AI heuristics:\n'
              '- Energy Tap: Main2, MV7+ target, CMC5+ or Nyxborn Hydra follow-up.\n'
              '- Rush of Knowledge: cast only with MV7+ permanent already on battlefield.\n'
          )
          PY
          git -C forge-src diff -- forge-gui/res/cardsfolder/e/energy_tap.txt forge-ai/src/main/java/forge/ai/ability/TapAi.java forge-gui/res/cardsfolder/r/rush_of_knowledge.txt forge-ai/src/main/java/forge/ai/ability/DrawAi.java | tee forge-face-value-ai.patch

      - name: Build patched Forge desktop
        run: |
          set -euxo pipefail
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"

      - name: Write and install frozen decks
        run: |
          mkdir -p decks "$HOME/.forge/decks/constructed"
          cat > "decks/Face Value v0.7.dck" <<'EOF'
          [metadata]
          Name=Face Value v0.7
          Deck Type=constructed
          [main]
          4 Llanowar Elves
          4 Nest Invader
          4 Eldrazi Repurposer
          1 Eyeless Watcher
          4 Wretched Gryff
          2 It of the Horrid Swarm
          2 Annoyed Altisaur
          1 Drownyard Lurker
          1 Nyxborn Hydra
          4 Malevolent Rumble
          3 Energy Tap
          2 Rush of Knowledge
          4 Preordain
          2 Snap
          1 Lose Focus
          1 Tamiyo's Safekeeping
          8 Forest
          8 Island
          4 Tangled Islet
          EOF
          cat > "decks/Muril0Ambra Mono Red Madness 2026-09-12.dck" <<'EOF'
          [metadata]
          Name=Muril0Ambra Mono Red Madness 2026-09-12
          Deck Type=constructed
          [main]
          4 Voldaren Epicure
          4 Kessig Flamebreather
          4 Sneaky Snacker
          3 Guttersnipe
          4 Faithless Looting
          4 Grab the Prize
          4 Highway Robbery
          4 Lava Dart
          4 Lightning Bolt
          4 Fiery Temper
          3 Fireblast
          18 Mountain
          EOF
          cp decks/*.dck "$HOME/.forge/decks/constructed/"
          python3 - <<'PY'
          import pathlib, re, hashlib, json
          for p in pathlib.Path('decks').glob('*.dck'):
              total=0; main=False
              for line in p.read_text().splitlines():
                  if line.strip() == '[main]': main=True; continue
                  if line.startswith('[') and line.strip() != '[main]': main=False
                  if main:
                      m=re.match(r'^(\d+)\s+', line.strip())
                      if m: total += int(m.group(1))
              assert total == 60, (p, total)
              print(p.name, total, hashlib.sha256(p.read_bytes()).hexdigest())
          provenance = {
              'opponent': 'Muril0Ambra Mono Red Madness, MTGO Pauper League #10991, 5-0, 2026-09-12',
              'mtgdecks_event': 'https://mtgdecks.net/Pauper/mtgo-pauper-league-10991-tournament-269860',
              'mtgdecks_deck': 'https://mtgdecks.net/Pauper/mono-red-madness-decklist-by-muril0ambra-3086428',
              'mode': 'preboard',
          }
          pathlib.Path('matchup-provenance.json').write_text(json.dumps(provenance, indent=2, sort_keys=True))
          PY

      - name: Freeze fixed seed vector
        run: |
          cat > forge-seeds.txt <<'EOF'
          910001
          910002
          910003
          910004
          910005
          910006
          910007
          910008
          910009
          910010
          910011
          910012
          910013
          910014
          910015
          910016
          910017
          910018
          910019
          910020
          EOF
          sha256sum forge-seeds.txt | tee forge-seeds.sha256

      - name: Run 20 fixed-seed Forge games
        run: |
          set -euo pipefail
          mkdir -p forge-fixed-logs
          : > forge-fixed-combined.log
          while read -r seed; do
            echo "===== SEED $seed =====" | tee -a forge-fixed-combined.log
            "$FORGE_LAUNCHER" sim \
              -d "Face Value v0.7.dck" "Muril0Ambra Mono Red Madness 2026-09-12.dck" \
              -n 1 -s "$seed" -c 60 2>&1 | tee "forge-fixed-logs/seed-${seed}.log" | tee -a forge-fixed-combined.log
          done < forge-seeds.txt

      - name: Summarize fixed-seed block
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, hashlib
          records=[]
          for p in sorted(Path('forge-fixed-logs').glob('seed-*.log')):
              seed=int(p.stem.split('-')[1])
              text=p.read_text(errors='replace')
              winner='unknown'
              if re.search(r'Ai\(1\)-Face Value v0\.7 has won!', text): winner='face_value'
              elif re.search(r'Ai\(2\)-Muril0Ambra Mono Red Madness 2026-09-12 has won!', text): winner='mono_red'
              elif 'ended in a Draw' in text: winner='draw'
              taps=list(re.finditer(r'Add To Stack: Ai\(1\)-Face Value v0\.7 cast Energy Tap targeting', text))
              productive=0
              for m in taps:
                  end=text.find("Phase: Ai(1)-Face Value v0.7's End step", m.end())
                  seg=text[m.end(): end if end!=-1 else m.end()+2500]
                  if re.search(r'Add To Stack: Ai\(1\)-Face Value v0\.7 cast (?!Energy Tap)', seg): productive+=1
              records.append({
                  'seed': seed,
                  'winner': winner,
                  'energy_tap_casts': len(taps),
                  'energy_tap_productive': productive,
                  'rush_casts': len(re.findall(r'cast Rush of Knowledge', text)),
                  'gryff_emerge': len(re.findall(r'Wretched Gryff - Creature 3 / 4 \(Emerge\)', text)),
                  'it_emerge_mentions': len(re.findall(r'It of the Horrid Swarm.*Emerge', text)),
                  'hydra_bestow_casts': len(re.findall(r'cast Nyxborn Hydra targeting', text)),
                  'engine_exception': bool(re.search(r'Exception|StackOverflowError|Stopping slow match as draw', text)),
              })
          summary={
              'games': len(records),
              'face_value_wins': sum(r['winner']=='face_value' for r in records),
              'mono_red_wins': sum(r['winner']=='mono_red' for r in records),
              'draws': sum(r['winner']=='draw' for r in records),
              'unknown': sum(r['winner']=='unknown' for r in records),
              'energy_tap_casts': sum(r['energy_tap_casts'] for r in records),
              'energy_tap_productive': sum(r['energy_tap_productive'] for r in records),
              'rush_casts': sum(r['rush_casts'] for r in records),
              'gryff_emerge': sum(r['gryff_emerge'] for r in records),
              'it_emerge_mentions': sum(r['it_emerge_mentions'] for r in records),
              'hydra_bestow_casts': sum(r['hydra_bestow_casts'] for r in records),
              'engine_exceptions': sum(r['engine_exception'] for r in records),
              'seed_vector_sha256': hashlib.sha256(Path('forge-seeds.txt').read_bytes()).hexdigest(),
          }
          Path('forge-fixed-records.json').write_text(json.dumps(records, indent=2, sort_keys=True))
          Path('forge-fixed-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True))
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Preserve fixed-seed matchup artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-forge-fixed-seed-muril0ambra
          path: |
            forge-fixed-combined.log
            forge-fixed-logs/*.log
            forge-fixed-records.json
            forge-fixed-summary.json
            forge-seeds.txt
            forge-seeds.sha256
            matchup-provenance.json
            forge-face-value-ai.patch
            face-value-forge-ai-notes.txt
            forge-source-commit.txt
            decks/*.dck
          if-no-files-found: warn

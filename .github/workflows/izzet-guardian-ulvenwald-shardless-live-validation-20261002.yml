name: Izzet Guardian Ulvenwald Shardless live checkpoint
on:
  push:
    branches: ["validation/izzet-guardian-ulvenwald-shardless-live-20261002"]
    paths: [".github/workflows/izzet-guardian-ulvenwald-shardless-live-validation-20261002.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_USER_HOME: /tmp/izzet-three-card-${{ github.run_id }}
      OUT: /tmp/izzet-three-card-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind exact composed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$OUT"
          test "$(git rev-parse HEAD^)" = "34dd4f458769976022e0b9b2999a7c1144e4080d"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/izzet-guardian-ulvenwald-shardless-live-validation-20261002.yml"
          test "$(git hash-object mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/clb/cards/GuardianNaga.kt)" = "511cf024fb9b4c858cda0d563cb943b6c1d711f9"
          test "$(git hash-object mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/GuardianNagaScenarioTest.kt)" = "7253de68eee88f20d089f9ef338eb9db7bd79867"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/emn/cards/UlvenwaldCaptive.kt)" = "2b0be33095886adfd92f93a39e0099e587a1d761"
          test "$(git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/UlvenwaldCaptiveScenarioTest.kt)" = "89eceac1a71246dbf044fdc9ddddbcb044a00fb9"
          test "$(git hash-object mtg-sets/2024/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/j25/FoundationsJumpstartSet.kt)" = "7cd6809b7971423341282cf3d6be814cdf23aff8"
          test "$(git hash-object mtg-sets/2024/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/j25/cards/ShardlessOutlander.kt)" = "7b9955cb83895f561d7bb5c4e3b57f87c697188e"
          test "$(git hash-object mtg-sets/2024/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ShardlessOutlanderScenarioTest.kt)" = "1b572cc099340547d90ddb77f525bdb5719de267"
          git rev-parse HEAD HEAD^{tree} HEAD^ > "$OUT/source.txt"
          printf '%s\n' 'AUTHOR_VALIDATION_ONLY_NO_GAMEPLAY_AUTHORITY' > "$OUT/authority.txt"
      - name: Compile every affected shard and gym test source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :mtg-sets:2008-2016:tests:compileTestKotlin             :mtg-sets:2017-2022:tests:compileTestKotlin             :mtg-sets:2024:tests:compileTestKotlin             :gym:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
      - name: Run exact Guardian mechanics
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :mtg-sets:2017-2022:tests:test --tests com.wingedsheep.engine.scenarios.GuardianNagaScenarioTest 2>&1 | tee "$OUT/guardian.log"
          cp mtg-sets/2017-2022/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.GuardianNagaScenarioTest.xml "$OUT/"
      - name: Run exact Ulvenwald mechanics
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :mtg-sets:2008-2016:tests:test --tests com.wingedsheep.engine.scenarios.UlvenwaldCaptiveScenarioTest 2>&1 | tee "$OUT/ulvenwald.log"
          cp mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.UlvenwaldCaptiveScenarioTest.xml "$OUT/"
      - name: Run exact Shardless mechanics
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :mtg-sets:2024:tests:test --tests com.wingedsheep.engine.scenarios.ShardlessOutlanderScenarioTest 2>&1 | tee "$OUT/shardless.log"
          cp mtg-sets/2024/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.ShardlessOutlanderScenarioTest.xml "$OUT/"
      - name: Run unchanged set-catalog invariants
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :mtg-sets:test --tests com.wingedsheep.mtg.sets.MtgSetCatalogTest 2>&1 | tee "$OUT/catalog.log"
          cp mtg-sets/build/test-results/test/TEST-com.wingedsheep.mtg.sets.MtgSetCatalogTest.xml "$OUT/"
      - name: Reinventory Position-1 exact identities
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain             :gym:test --tests com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest 2>&1 | tee "$OUT/registry.log"
          rc=${PIPESTATUS[0]}
          set -e
          XML=gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml
          test -f "$XML"; cp "$XML" "$OUT/"
          REGISTRY_RC="$rc" python3 - <<'PY'
          import json,os,pathlib,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ["OUT"])
          root=ET.parse(out/"TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml").getroot()
          assert int(root.attrib["tests"])==55
          suffix=" is registered in current runtime"; reg=[]; miss=[]
          for c in root.iter("testcase"):
              n=c.attrib["name"]; card=n[:-len(suffix)] if n.endswith(suffix) else n
              (reg if c.find("failure") is None and c.find("error") is None else miss).append(card)
          expected_missing={
              "Benevolent Blessing","Capsize","Cosmic Hunger","Everflowing Chalice","Lose Focus",
              "Rolling Thunder","Shattering Pulse","Skred","Snake Umbra","Star Compass"
          }
          assert set(miss)==expected_missing, (len(reg),len(miss),sorted(miss))
          assert len(reg)==45 and len(miss)==10
          for name in ["Guardian Naga // Banishing Coils","Ulvenwald Captive // Ulvenwald Abomination","Shardless Outlander"]:
              assert name in reg
          (out/"registry-summary.json").write_text(json.dumps({
              "registered":len(reg),"missing":len(miss),"missing_names":sorted(miss),
              "official_counters_delta":{"allocations":0,"claims":0,"games":0,"outcomes":0}
          },indent=2,sort_keys=True)+"\n")
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-three-card-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

name: Pest v5.1 dispatch remedy clean validation
on:
  push:
    branches: ["validation/pest-v5-dispatch-remedy-clean-20261004"]
    paths: [".github/workflows/pest-v5-dispatch-remedy-clean-validation-20261004.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bbdd90a4e7988ee1fa69f45fcb97f7c20d7e369f
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact I R2 M2 chain and frozen verifier
        shell: bash
        run: |
          set -euo pipefail
          I=b5402d973979428008ed2703e8737bae61a38c19
          R2=fa0632552fe54aef9d61a83d202d123e96532c53
          M2=bbdd90a4e7988ee1fa69f45fcb97f7c20d7e369f
          RECEIPT=docs/experiments/pest-control/evidence/PHASE_B_SHARDED_GATE_V5_ACCEPTANCE_20261004.json
          MARKER=docs/experiments/pest-control/PHASE_B_SHARDED_V5_EXECUTION_MARKER_20261004.json
          PLAN=docs/experiments/pest-control/PHASE_B_SHARDED_GATE_V5_20261004.json
          GUARD=scripts/experiments/pest-control/verify_phase_b_sharded_gate_v5.py
          test "$(git rev-parse HEAD)" = "$M2"
          test "$(git rev-parse HEAD^)" = "$R2"
          test "$(git rev-parse HEAD^^)" = "$I"
          test "$(git diff --name-only "$I" "$R2")" = "$RECEIPT"
          test "$(git diff --name-only "$R2" "$M2")" = "$MARKER"
          git diff --name-only bf80aaa908521a7165af59b6343f119bfff7904d "$M2" | grep -Fx "$MARKER" >/dev/null
          test "$(git rev-parse "$R2:$RECEIPT")" = 7322a3be2be73095981747da40df88011cc7cc49
          test "$(git rev-parse "$M2:$MARKER")" = 0bc93ffd74fee3b256fb7ef511446c960fa9e9c0
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("docs/experiments/pest-control/evidence/PHASE_B_SHARDED_GATE_V5_ACCEPTANCE_20261004.json").read_text())
          m=json.loads(pathlib.Path("docs/experiments/pest-control/PHASE_B_SHARDED_V5_EXECUTION_MARKER_20261004.json").read_text())
          g=json.loads(pathlib.Path("docs/experiments/pest-control/PHASE_B_SHARDED_GATE_V5_20261004.json").read_text())
          assert r["execution_authorization_record_sha256"]=="c1fb768a95df77027f74192a635ea238a44f267a2360e7352004c8ffb9494101"
          assert m["execution_authorization_record_sha256"]==r["execution_authorization_record_sha256"]
          assert m["external_review_record_sha256"]=="14c9f2d094246b98efcad5633948e970e4d6d6163042ed1f86b4d904bedc792a"
          assert m["execution_authorization_record_sha256"] not in g["forbidden_record_sha256"]
          assert r["planner_identity"]==g["planner_identity"] and r["shards"]==g["shards"]
          assert r["supersedes_inert_receipt"]=="344431aa233f80ed068c7b50561912b0bfe18ecb"
          assert m["supersedes_inert_marker"]=="bf80aaa908521a7165af59b6343f119bfff7904d"
          PY
          env GITHUB_REPOSITORY=GodaPupa/argentum-batshit-test             GITHUB_EVENT_NAME=push             GITHUB_REF=refs/heads/pest/phase-b-sharded-v5-execute-20261004             GITHUB_SHA="$M2" GITHUB_RUN_ATTEMPT=1             /usr/bin/python3 -I -S "$GUARD" --plan "$PLAN" --mode execution             > /tmp/verifier-result.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/verifier-result.json"))
          assert r=={
            "status":"STRUCTURALLY_BOUND_FRESH_V5_REVIEW_AND_AUTHORIZATION_REQUIRED",
            "implementation":"b5402d973979428008ed2703e8737bae61a38c19",
            "receipt":"fa0632552fe54aef9d61a83d202d123e96532c53",
            "marker":"bbdd90a4e7988ee1fa69f45fcb97f7c20d7e369f"
          }
          json.dump({"status":"PASS","accepted_truth_loaded":False,"shard_behavior_executed":False},open("/tmp/validation.json","w"),sort_keys=True)
          PY
      - name: Preserve validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: pest-v5-dispatch-remedy-clean-${{ github.run_id }}
          path: |
            /tmp/verifier-result.json
            /tmp/validation.json
          if-no-files-found: error
          retention-days: 90

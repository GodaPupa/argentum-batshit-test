name: Pest London M5 truth to predicate-vector receiving
on:
  push:
    branches: ["pest/london-m5-truth-vector-receiving-successor2-20260930"]
    paths: [".github/workflows/pest-london-m5-truth-vector-receiving.yml"]
permissions:
  contents: read
  actions: read
jobs:
  receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 3}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact accepted receiving source
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/pest-london-m5-truth-receiving
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD^)" = "17df9486e1a613cb20a73133df46dcf7855451db"
          test "$(git rev-parse HEAD^^)" = "45bd364facec9c0eeeabadc612afde05700198ae"
          test "$(git rev-parse HEAD^^^)" = "95c3f2baeac19a811928a53816edea08a0d83624"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonPredicateVector.kt)" = "bb8e2247dc64a64403094c691d83b8eed53048bd"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonM5TruthReceiving.kt)" = "1936f537b737fb1b839e53fae0a727aab7a0f0ab"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonM5TruthReceivingTest.kt)" = "6261fcc2bdfda526de12feac421dfcc842fbaf77"
          test "$(git hash-object docs/experiments/pest-control/london-m5-truth-vector-receiving-budget-20260929.json)" = "9a65b890f2444f335ef3c403bc3066608d4231a0"
          test "$(git hash-object docs/experiments/pest-control/evidence/london-m5-atomic-comparator-36531232867-original-audit.json)" = "f8b0e9129e6c811a40b600d3666d01a8c90b0d9f"
          test "$(git hash-object docs/experiments/pest-control/evidence/london-predicate-vector-36496673330-original-audit.json)" = "3cd8cf75468927625f51f85e4644a525f7486091"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object gym/src/main/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonPredicateVector.kt
            git hash-object gym/src/main/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonM5TruthReceiving.kt
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/pest/PestMonsterLondonM5TruthReceivingTest.kt
            git hash-object docs/experiments/pest-control/london-m5-truth-vector-receiving-budget-20260929.json
            git hash-object .github/workflows/pest-london-m5-truth-vector-receiving.yml
            git status --porcelain
          } > "$OUT/source.txt"

      - name: Consume accepted M5 truth original by exact digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT=build/reports/pest-london-m5-truth-receiving
          curl -L --fail --retry 3             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11016925265/zip"             -o "$OUT/accepted-m5-original.zip"
          echo "cd16753d52704ab31904531cf94e4390c7ceabacd382d09deb66afc155951528  $OUT/accepted-m5-original.zip" | sha256sum -c -
          unzip -t "$OUT/accepted-m5-original.zip"
          unzip -p "$OUT/accepted-m5-original.zip" truth-bank.json > "$OUT/truth-bank.json"
          echo "8d7e3e97a4dc70aab696b2d27012e410d57598d477f7b97689f4de5b442f348f  $OUT/truth-bank.json" | sha256sum -c -
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("build/reports/pest-london-m5-truth-receiving/truth-bank.json")
          bank=json.loads(p.read_text())
          assert bank["schema"]=="pest-monster-london-m5-atomic-truth-bank-v1"
          assert bank["source_atomic_bank_sha256"]=="8825cb587a6337d8173a9d93c642a1d979617ef053833fb849362e18a519a49b"
          assert bank["source_signature_to_atoms_sha256"]=="51ffc25991361eaa3bc8f457583eabb964d07442a4205b022ec890b134aac645"
          assert len(bank["rows"])==6850
          keys=[]
          for row in bank["rows"]:
              atom=row["atom"]
              keys.append((tuple(tuple(x) for x in atom["physical_lands"]),atom["m2_opening_candidate"],atom["early_spell"]))
          assert len(set(keys))==6850
          PY

      - name: Execute exact M5 truth receiving into lawful vector seam
        shell: bash
        run: |
          set -o pipefail
          just test-class PestMonsterLondonM5TruthReceivingTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-london-m5-truth-receiving/test.log

      - name: Retain exact XML and receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/pest-london-m5-truth-receiving
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.pest.PestMonsterLondonM5TruthReceivingTest.xml "$OUT/" 2>/dev/null || true
          sha256sum "$OUT/truth-bank.json" > "$OUT/truth-bank.sha256" 2>/dev/null || true

      - name: Preserve original receiving evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-london-m5-truth-vector-receiving-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-london-m5-truth-receiving/
          if-no-files-found: error
          retention-days: 90

name: Manual R9 paid activation full-cost heldout (NO GAMES)
on:
  push:
    branches: [research/manual-precision-r9-activation-cost-coverage-20261021]
    paths:
      - '.github/workflows/manual-precision-r9-multipip-funded-heldout-20261021.yml'
      - 'mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9MultiPipFundingHeldoutTest.kt'
      - 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt'
permissions:
  contents: read
concurrency:
  group: manual-precision-r9-multipip-coverage
  cancel-in-progress: false

jobs:
  multipip-and-protections:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R4_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 32}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Protect source, test identity and game budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r9-multipip-evidence
          test "$GITHUB_REF" = "refs/heads/research/manual-precision-r9-activation-cost-coverage-20261021"
          git merge-base --is-ancestor 7b493d53a1de21a043adc82b0972d2058426ccb2 HEAD
          git rev-parse HEAD > r9-multipip-evidence/source-sha.txt
          git rev-parse HEAD^{tree} > r9-multipip-evidence/tree-sha.txt
          git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt > r9-multipip-evidence/solver-blob-sha.txt
          test "$(git rev-parse HEAD:mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9MultiPipFundingHeldoutTest.kt)" = "42444bec7fbae191dcfbecbb2df85c4133417921"
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = "7984a2e87d8ddbe023d45620414d25a61691a040"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          git diff --name-only 7b493d53a1de21a043adc82b0972d2058426ccb2 HEAD > r9-multipip-evidence/delta-paths.txt
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/manual-precision-r9-multipip-funded-heldout-20261021.yml|mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9MultiPipFundingHeldoutTest.kt|rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt) ;;
              *) echo "UNAUTHORIZED_DELTA:$file"; exit 1 ;;
            esac
          done < r9-multipip-evidence/delta-paths.txt
          echo ZERO_FULL_GAMES > r9-multipip-evidence/budget.txt
          chmod +x gradlew scripts/gradle-locked

      - name: Independent multi-pip paid activation witnesses
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2008-2016:tests:cleanTest :mtg-sets:2008-2016:tests:test \
            --tests '*ManualPrecisionR9MultiPipFundingHeldoutTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-multipip-evidence/heldout.log

      - name: Preserve immutable new JUnit before protected suites
        if: always()
        shell: bash
        run: |
          mkdir -p r9-multipip-evidence/new-witness-junit
          cp -a mtg-sets/2008-2016/tests/build/test-results/test/. r9-multipip-evidence/new-witness-junit/ || true

      - name: Original R9 funded mana, strict colorless, provenance and Confluence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2008-2016:tests:cleanTest :mtg-sets:2008-2016:tests:test \
            --tests '*ManualPrecisionR9FundedManaCompletenessHeldoutTest' \
            --tests '*ManualPrecisionR9SelfFundingIntegrityWitnessesTest' \
            --tests '*ManualPrecisionR9ColorlessRestrictedXHeldoutTest' \
            --tests '*ManualPrecisionR9GenericActivationCostHeldoutTest' \
            --tests '*ManualPrecisionR9ProvenanceHardeningWitnessesTest' \
            --tests '*ManaConfluenceScenarioTest' --tests '*ManualPrecisionR9ManaHeldoutScenarioTest' \
            --tests '*ManualPrecisionR9InternalManaCostScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-multipip-evidence/protected-mana.log

      - name: Preserve original R9 JUnit separately
        if: always()
        shell: bash
        run: |
          mkdir -p r9-multipip-evidence/protected-mana-junit
          cp -a mtg-sets/2008-2016/tests/build/test-results/test/. r9-multipip-evidence/protected-mana-junit/ || true

      - name: Protected R5 Pact Ballista Statue Encore and payment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualPactDebt*Test' --tests '*ManualBallista*Test' \
            --tests '*ManualStatue*Test' --tests '*ManualResolutionPaymentRegressionTest' \
            --tests '*ManualR5CandidateCompositionTest' --tests '*ManualEncoreRegressionTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-multipip-evidence/r5.log

      - name: Preserve R5 JUnit before initializer cleanTest
        if: always()
        shell: bash
        run: |
          mkdir -p r9-multipip-evidence/r5-junit
          cp -a ai/build/test-results/test/. r9-multipip-evidence/r5-junit/ || true

      - name: CONTROL-A initializer parity (PRE-FLIGHT ONLY)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test --tests '*ManualPrecisionR1PreflightTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-multipip-evidence/initializer.log

      - name: Preserve evidence on GREEN or RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-precision-r9-multipip-coverage-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            r9-multipip-evidence/
            mtg-sets/2008-2016/tests/build/test-results/test/
            ai/build/test-results/test/

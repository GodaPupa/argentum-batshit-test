name: Industrial Waste — Grixis Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - industrial-waste/lab
    paths:
      - .github/workflows/industrial-waste-grixis-readiness.yml
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteGrixisPolicyAuditTest.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteGrixisReadinessSmokeTest.kt
      - industrial-waste/control/industrial-waste-v1.0-submitted.dck
      - industrial-waste/gauntlet/grixis-affinity-carlos-dc-2026-09-12.dck
      - industrial-waste/input-identities.sha256
      - industrial-waste/sim/**
      - justfile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  grixis-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up just
        uses: extractions/setup-just@v3
      - name: Validate frozen inputs
        run: |
          python3 -m unittest discover -s industrial-waste/sim -p 'test_*.py' -v
          python3 industrial-waste/sim/validate_inputs.py
      - name: Run deterministic Grixis policy fixtures
        run: just test-class IndustrialWasteGrixisPolicyAuditTest
      - name: Run exact-deck readiness smoke
        env:
          IW_G6_GRIXIS_READINESS_SMOKE: "true"
        run: just test-class IndustrialWasteGrixisReadinessSmokeTest
      - name: Print focused test failure details
        if: failure()
        run: |
          find ai/build/test-results/test -name 'TEST-*IndustrialWasteGrixis*.xml' \
            -exec sed -n '1,700p' {} \; || true
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-grixis-readiness
          path: industrial-waste/results/gate-6-grixis-readiness-smoke-v1.json
          if-no-files-found: warn

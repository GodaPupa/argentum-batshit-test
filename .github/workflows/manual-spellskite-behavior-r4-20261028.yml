name: Manual actual Spellskite behavior R4
on:
  push:
    branches: [validation/manual-spellskite-behavior-r4-20261028]
    paths: ['.github/workflows/manual-spellskite-behavior-r4-20261028.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 9fc60272b4cb0a61cdef5b28a06659acc216ebe3
  SOURCE_TREE: d22a87cb721d1181f6bb59696e07438fe1436cc3
  WORKFLOW: .github/workflows/manual-spellskite-behavior-r4-20261028.yml
  RECORD: experiments/manual-transmission/research/spellskite-behavior-r4-20261028
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile all forms then qualify exact behavioral reports
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-spellskite-behavior-r4-${{ github.run_id }}
          path: manual-spellskite-behavior-r4-evidence/
          include-hidden-files: true
          if-no-files-found: error

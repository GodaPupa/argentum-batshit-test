name: Face Value Chrysalis C affinity Screen
on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-chrysalis-c-affinity-screen.yml]
permissions: {contents: read}
jobs:
  screen:
    uses: ./.github/workflows/face-value-experiment-harness.yml
    with:
      experiment_name: chrysalis-c-affinity-screen
      control_deck: experiments/face-value/decks/fv-v12-control.dck
      challenger_deck: experiments/face-value/decks/fv-temur-chrysalis-c.dck
      opponent_deck: experiments/face-value/decks/grixis-affinity.dck
      seed_start: 1390001
      games: 20

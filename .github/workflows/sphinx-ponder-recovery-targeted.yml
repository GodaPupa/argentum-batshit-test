name: Sphinx trusted Ponder memory recovery targeted
on:
  push:
    branches: ["sphinx/accepted-transition-journal-20260928"]
    paths:
      - ".github/workflows/sphinx-ponder-recovery-targeted.yml"
permissions:
  contents: read
jobs:
  two-declared-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact trusted transition, durable file and two-case fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/sphinx-ponder-recovery-targeted
          test "$(git rev-parse HEAD^)" = "8525d0d6aef37b3bd01ecac00ad4daee7579738d"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt)" = "63efac3d9321d658f9590ffbab689a187516487c"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageETrustedTransitionFile.kt)" = "6671a492891d6dc41db6dcc6de6244918872c611"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEPonderSessionTest.kt)" = "af65cfc46768bcb0fbf1226ca454db7c9f51934f"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEPonderSession.kt)" = "e80e943e7d04164f4ca2fd033e6de6a34c15a653"
          { git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEPonderSession.kt; git hash-object sphinx-approach/PONDER_RECOVERY_RECEIVING_BUDGET.json; git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageETrustedTransitionFile.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEPonderSessionTest.kt; git hash-object .github/workflows/sphinx-ponder-recovery-targeted.yml; git status --porcelain; } > build/reports/sphinx-ponder-recovery-targeted/source.txt
      - name: Execute exactly two predeclared recovered-memory traces
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:test --tests 'com.wingedsheep.gym.sphinx.SphinxStageEPonderSessionTest' --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/sphinx-ponder-recovery-targeted/test.log
      - name: Retain exact XML
        if: always()
        shell: bash
        run: |
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageEPonderSessionTest.xml build/reports/sphinx-ponder-recovery-targeted/ 2>/dev/null || true
      - name: Preserve original behavioral evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-ponder-recovery-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-ponder-recovery-targeted/
          if-no-files-found: error
          retention-days: 90

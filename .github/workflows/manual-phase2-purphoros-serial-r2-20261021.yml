name: Manual Phase 2 Purphoros exact JSON modifier repair (25 ORIGINAL + 3 serial, NO GAMES)
on:
  push:
    branches: [candidate/manual-phase2-purphoros-type-discriminator-r2-20261021]
    paths:
      - '.github/workflows/manual-phase2-purphoros-serial-r2-20261021.yml'
      - 'experiments/manual-transmission/research/phase2-current-main-20261021/PURPHOROS_TYPE_SERIALIZATION_R2_PROTOCOL.json'
      - 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/layers/ProjectionModels.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/mechanics/layers/ModificationJsonDiscriminatorTest.kt'
permissions: {contents: read}
concurrency:
  group: manual-phase2-purphoros-type-wire-r2
  cancel-in-progress: false

jobs:
  exact-donor-modifier-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R4_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 30}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4

      - name: Enforce original failed source, only exact donor wire fix, frozen 25 cases and budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p purphoros-serial-r2/original-junit purphoros-serial-r2/modifier-junit
          test "$GITHUB_REF" = 'refs/heads/candidate/manual-phase2-purphoros-type-discriminator-r2-20261021'
          git merge-base --is-ancestor 47661fa7b0411703f70cda56837715295d09b443 HEAD
          git diff --name-only 47661fa7b0411703f70cda56837715295d09b443 HEAD > purphoros-serial-r2/changed-paths.txt
          python3 - <<'PY' | tee purphoros-serial-r2/source-hash-guard.log
          import json,subprocess
          from pathlib import Path
          p=Path("experiments/manual-transmission/research/phase2-current-main-20261021/PURPHOROS_TYPE_SERIALIZATION_R2_PROTOCOL.json")
          r=json.loads(p.read_text())
          assert r["schema"]=="ARGENTUM_MANUAL_PHASE2_PURPHOROS_POLYMORPHIC_TYPE_SERIALIZATION_R2"
          assert r["status"]=="PREDECLARED_AFTER_25_CASE_ORIGINAL_RED_BEFORE_ANY_SOURCE_REPAIR"
          assert r["original_failed_parent"]=="47661fa7b0411703f70cda56837715295d09b443"
          assert r["failed_run"]["id"]==39702798101 and r["failed_run"]["failures"]==22
          assert r["source_repair"]["expected_repaired_git_blob"]=="9ce21dea649168e5b6ed86668ced82f9f1e5af48"
          assert r["protected"]["precision_used"]==10 and r["protected"]["precision_reserved"]==2
          assert r["protected"]["no_game_seed"] and r["protected"]["no_full_game"]
          def git(path):
              return subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
          expected={str(p),
             "rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/layers/ProjectionModels.kt",
             "rules-engine/src/test/kotlin/com/wingedsheep/engine/mechanics/layers/ModificationJsonDiscriminatorTest.kt",
             ".github/workflows/manual-phase2-purphoros-serial-r2-20261021.yml"}
          actual=set(Path("purphoros-serial-r2/changed-paths.txt").read_text().splitlines())
          assert actual==expected,(len(actual),actual^expected)
          assert git(r["failing_source"]["path"])==r["source_repair"]["expected_repaired_git_blob"]
          for path,blob in {
            r["protected"]["purphoros_card_path"]:r["protected"]["purphoros_card_blob"],
            r["protected"]["original_test_path"]:r["protected"]["original_test_blob"],
            "experiments/manual-transmission/control/v0.7.decklist.txt":r["protected"]["frozen_deck"],
            "ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt":r["protected"]["current_ai"],
            "rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt":r["protected"]["current_solver"]
          }.items():
              assert git(path)==blob,(path,git(path),blob)
          print("PURPHOROS_EXACT_HISTORICAL_ANNOTATION_WIRE_PATCH_SOURCE_MATCH_NO_GAMES")
          PY
          git rev-parse HEAD > purphoros-serial-r2/source-sha.txt
          git rev-parse HEAD^{tree} > purphoros-serial-r2/tree-sha.txt
          echo 'No full games/seeds; official Phase2 capability 0/36, primary 0/864; Precision 10/12 used, 2 reserved' > purphoros-serial-r2/game-budget.txt
          chmod +x gradlew scripts/gradle-locked

      - name: Execute new three exact Modify.AddType and RemoveType JSON tests
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :rules-engine:cleanTest :rules-engine:test \
            --tests '*ModificationJsonDiscriminatorTest' \
            --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee purphoros-serial-r2/three-modifier-actual.log

      - name: Preserve actual three-case Kotlin JUnit before next Gradle execution
        if: always()
        shell: bash
        run: |
          mkdir -p purphoros-serial-r2/modifier-junit
          cp -a rules-engine/build/test-results/test/. purphoros-serial-r2/modifier-junit/ || true

      - name: Rerun all 25 untouched original Purphoros component/mechanics/serialization scenarios
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2008-2016:tests:cleanTest :mtg-sets:2008-2016:tests:test \
            --tests '*PurphorosGodOfTheForgeScenarioTest' \
            --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee purphoros-serial-r2/original-25-actual.log

      - name: Preserve original 25-case JUnit even if behavioral test is RED
        if: always()
        shell: bash
        run: |
          mkdir -p purphoros-serial-r2/original-junit
          cp -a mtg-sets/2008-2016/tests/build/test-results/test/. purphoros-serial-r2/original-junit/ || true

      - name: Independently count all 25 original + three new cases and prohibit errors/skips
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee purphoros-serial-r2/independent-28-case-verdict.log
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          checks=[
           ("purphoros-serial-r2/modifier-junit/TEST-com.wingedsheep.engine.mechanics.layers.ModificationJsonDiscriminatorTest.xml",3),
           ("purphoros-serial-r2/original-junit/TEST-com.wingedsheep.engine.scenarios.PurphorosGodOfTheForgeScenarioTest.xml",25)]
          for pa,count in checks:
              f=Path(pa);assert f.is_file(),str(f)
              x=ET.parse(f).getroot()
              ts=x.findall(".//testcase")
              assert len(ts)==count,(f,len(ts),count)
              assert len({(t.get("classname"),t.get("name")) for t in ts})==count
              assert not x.findall(".//failure") and not x.findall(".//error") and not x.findall(".//skipped")
              assert all(int(x.get(s,"0"))==0 for s in ("failures","errors","skipped"))
              print(f"{f.name}: {count}/{count} real source cases GREEN")
          outcome={"schema":"ARGENTUM_MANUAL_PHASE2_PURPHOROS_R2_SERIALIZATION_VERDICT_V1",
             "status":"PURPHOROS_ORIGINAL_25_AND_MODIFIER_3_GREEN_SOURCE_ONLY",
             "original_failed_run":39702798101,"original_failed_cases":22,
             "bounded_source_repair":"9ce21dea649168e5b6ed86668ced82f9f1e5af48",
             "purphoros_original_cases":25,"new_json_discriminator_cases":3,
             "failures":0,"errors":0,"skips":0,
             "official_capability_games":0,"official_primary_games":0,
             "precision_remaining":2,"gameplay_authorized":False,
             "next_gate":"A separate coherent R3 receiving and full 800-slot registry requalification, then remainder of roster/actual adversarial pilot."
          }
          Path("purphoros-serial-r2/EXACT_SERIAL_PURPHOROS_VERDICT.json").write_text(json.dumps(outcome,indent=2)+"\n")
          print("PURPHOROS_25_ORIGINAL_PLUS_THREE_DISCRIMINATOR_CURRENT_ENGINE_PASS_0_GAMES")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-purphoros-serial-r2-${{ github.run_id }}
          path: purphoros-serial-r2/
          if-no-files-found: warn
          retention-days: 30

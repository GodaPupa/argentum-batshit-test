name: Sphinx durable accepted Ponder journal static preflight
on:
  push:
    branches: ["sphinx/accepted-transition-journal-20260928"]
    paths:
      - ".github/workflows/sphinx-durable-accepted-journal-preflight.yml"
permissions:
  contents: read
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact trusted transition, durable file and two-case fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/sphinx-durable-journal-preflight
          test "$(git rev-parse HEAD^)" = "560c552b9986b43dd3c48a18223996a5b0a77683"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt)" = "ff29172b39ab9fb8099cba265e706530691de90f"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageETrustedTransitionFile.kt)" = "a7fcf072d30ec5d87216a533027dfa2b4eb46756"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournalTest.kt)" = "1c6b9d36a839aef350bfbc2143f08eab10fce706"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageETrustedTransitionFile.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournalTest.kt; git hash-object .github/workflows/sphinx-durable-accepted-journal-preflight.yml; git status --porcelain; } > build/reports/sphinx-durable-journal-preflight/source.txt
      - name: Compile durable journal fixture with zero behavioral cases
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:compileTestKotlin --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/sphinx-durable-journal-preflight/compile.log
      - name: Preserve original static evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-durable-journal-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-durable-journal-preflight/
          if-no-files-found: error
          retention-days: 90

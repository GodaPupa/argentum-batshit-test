name: Izzet Position-1 Engine Batch R

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-r.yml"

permissions:
  contents: read

jobs:
  qualify-batch-r:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch R gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'V07_DECK_AUDIT_NO_CHANGE' izzet-science/v07-deck-level-audit-no-change.md
          grep -Fq 'V09_CARD_CONTROL_ARCHITECTURE_AUDIT_KEEP_V07' izzet-science/v09-card-control-architecture-audit.md
          grep -Fq 'Live unresolved count is exactly 35' izzet-science/v09-position1-engine-batch-r-gate.md
          grep -Fq '35882535605' izzet-science/v09-position1-engine-batch-r-gate.md
          grep -Fq 'f112ce65f89ca9aa4d7698132a665a034ca2bffe' izzet-science/v09-position1-engine-batch-r-gate.md

      - name: Requalify canonical card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --stacktrace

      - name: Run Arcane Denial semantics
        run: scripts/test-class ArcaneDenialScenarioTest --info --stacktrace

      - name: Run exact real-engine coverage regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-r.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=35' /tmp/batch-r.txt
          ! grep -Fq 'unresolved Izzet card: Arcane Denial' /tmp/batch-r.txt

      - name: Assert official experiment remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt

      - name: Emit Batch R manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izzet-batch-r
          cp /tmp/batch-r.txt /tmp/izzet-batch-r/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-r-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "frozen_control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "implemented=Arcane Denial;delayed DrawUpTo TargetController capture;state-aware DrawUpTo player resolution"
            echo "snapshot_run=35882535605"
            echo "snapshot_commit=f112ce65f89ca9aa4d7698132a665a034ca2bffe"
            echo "unresolved_before=36"
            echo "unresolved_after=35"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/all/cards/ArcaneDenial.kt
            sha256sum mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ArcaneDenialScenarioTest.kt
            sha256sum rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/composite/CreateDelayedTriggerExecutor.kt
            sha256sum rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/drawing/DrawUpToExecutor.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/v09-position1-engine-batch-r-gate.md
            sha256sum mtg-sets/src/test/resources/snapshots/cards/ALL.json
            sha256sum /tmp/izzet-batch-r/test-output.txt
          } > /tmp/izzet-batch-r/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-r
          path: /tmp/izzet-batch-r
          if-no-files-found: error

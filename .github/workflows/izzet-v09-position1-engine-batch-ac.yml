name: Izzet Position-1 Engine Batch AC

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-ac.yml"

permissions:
  contents: read

jobs:
  qualify-batch-ac:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch AC provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'Batch AB is accepted' izzet-science/v09-position1-engine-batch-ab-gate.md
          grep -Fq 'Expected post-implementation unresolved count is exactly 24' izzet-science/v09-position1-engine-batch-ac-gate.md
          test "$(git show --format= --name-only a4260a4cf83eb71369eb3c93c28d1a421751d91e | sed '/^$/d' | wc -l)" -eq 1
          test "$(git show --format= --name-only a4260a4cf83eb71369eb3c93c28d1a421751d91e | sed '/^$/d')" = "mtg-sets/src/test/resources/snapshots/cards/THB.json"

      - name: Requalify canonical card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --stacktrace

      - name: Requalify Ilysian Caryatid semantics
        run: scripts/test-class IlysianCaryatidScenarioTest --info --stacktrace

      - name: Run exact real-engine coverage regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-ac.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=24' /tmp/batch-ac.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Ilysian Caryatid' /tmp/batch-ac.txt
          ! grep -Fq 'V09_REAL_ENGINE_UNRESOLVED=unresolved Izzet card:' /tmp/batch-ac.txt

      - name: Assert official experiment remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt

      - name: Emit Batch AC manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izzet-batch-ac
          cp /tmp/batch-ac.txt /tmp/izzet-batch-ac/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-ac-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "frozen_control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "implemented=Ilysian Caryatid;existing conditional-any-color-mana+projected-power rails"
            echo "snapshot_run=36026261710"
            echo "snapshot_commit=a4260a4cf83eb71369eb3c93c28d1a421751d91e"
            echo "unresolved_before=25"
            echo "unresolved_after=24"
            echo "unresolved_izzet_after=0"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/thb/cards/IlysianCaryatid.kt
            sha256sum mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/IlysianCaryatidScenarioTest.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/v09-position1-engine-batch-ac-gate.md
            sha256sum mtg-sets/src/test/resources/snapshots/cards/THB.json
            sha256sum /tmp/izzet-batch-ac/test-output.txt
          } > /tmp/izzet-batch-ac/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-ac
          path: /tmp/izzet-batch-ac
          if-no-files-found: error
          retention-days: 90

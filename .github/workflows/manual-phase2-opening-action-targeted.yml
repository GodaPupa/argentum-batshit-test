name: Manual Phase 2 first executable action targeted
on:
  push:
    branches: ["manual/clean-pilot-boundary-receiving-20260927"]
    paths:
      - ".github/workflows/manual-phase2-opening-action-targeted.yml"
permissions:
  contents: read
jobs:
  six-declared-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact unchanged policy and precompiled fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/manual-opening-action-targeted
          test "$(git rev-parse HEAD^)" = "79c886db4745f97fd47b2e26183601493f75bdfc"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoOpeningActionPolicy.kt)" = "bd58d1b166a86a8d6e076f4dd2e8f34f533e2a6e"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoOpeningActionPolicyTest.kt)" = "b031ac163f0ecf5ab4ccaa3fe7674e054618272e"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoOpeningActionPolicy.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoOpeningActionPolicyTest.kt; git hash-object .github/workflows/manual-phase2-opening-action-targeted.yml; git status --porcelain; } > build/reports/manual-opening-action-targeted/source.txt
      - name: Execute only six declared excluded action decisions
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:test --tests 'com.wingedsheep.gym.manual.ManualPhaseTwoOpeningActionPolicyTest' --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/manual-opening-action-targeted/test.log
      - name: Retain original XML and source
        if: always()
        shell: bash
        run: |
          if test -f gym/build/test-results/test/TEST-com.wingedsheep.gym.manual.ManualPhaseTwoOpeningActionPolicyTest.xml; then
            cp gym/build/test-results/test/TEST-com.wingedsheep.gym.manual.ManualPhaseTwoOpeningActionPolicyTest.xml build/reports/manual-opening-action-targeted/
          fi
      - name: Upload original targeted evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-opening-action-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/manual-opening-action-targeted/
          if-no-files-found: error
          retention-days: 90

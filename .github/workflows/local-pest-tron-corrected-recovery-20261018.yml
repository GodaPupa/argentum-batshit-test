name: Nonofficial Pest Tron corrected recovery of remaining seats
on:
  push:
    branches: [local/pest-tron-corrected-recovery-20261018]
permissions:
  contents: read
jobs:
  recover-remaining-seat:
    if: github.ref == 'refs/heads/local/pest-tron-corrected-recovery-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - seed: '20261021'
            originalSlot: 8
            attemptKind: previously_unstarted
          - seed: '20261022'
            originalSlot: 10
            attemptKind: retry_interrupted
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 8e9c0877ea51bc0a112891066b2465d5c124ab09
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Recover original runner and select only uncompleted Pest seat 1
        shell: bash
        run: |
          set -euo pipefail
          cat tools/pest-tron-batch/source-part-0*.b64 | base64 --decode > "$RUNNER_TEMP/runner.tar.xz"
          echo "ca51dd78c6343f32d9cd6d014fa11a5a1ec75c870e019e6fcbef28252d2c03f8  $RUNNER_TEMP/runner.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/runner"
          tar -xJf "$RUNNER_TEMP/runner.tar.xz" -C "$RUNNER_TEMP/runner"
          cp "$RUNNER_TEMP/runner/gym/src/test/kotlin/com/wingedsheep/gym/"PestMonsterTronBatch*.kt gym/src/test/kotlin/com/wingedsheep/gym/
          mkdir -p tools/pest-tron-batch
          cp "$RUNNER_TEMP/runner/tools/pest-tron-batch/summarize.py" tools/pest-tron-batch/summarize.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gym/src/test/kotlin/com/wingedsheep/gym/PestMonsterTronBatchTest.kt')
          s = p.read_text()
          old = 'val plans = planPestMonsterTronMatches(games, baseSeed)'
          assert s.count(old) == 1
          s = s.replace(old, old + '.filter { it.pestSeat == 1 }\n        check(games == 2 && plans.size == 1 && plans.single().gameNumber == 2)')
          old = 'put("gamesRequested", games)'
          assert s.count(old) == 1
          s = s.replace(old, 'put("gamesRequested", plans.size)\n            put("scheduledPairSize", games)\n            put("selectedGameNumber", 2)\n            put("evidenceGroup", "CORRECTED_RECOVERY")\n            put("engineCommit", "8e9c0877ea51bc0a112891066b2465d5c124ab09")')
          old = 'put("schedule", "Consecutive games share a seed; Pest seats alternate 0,1")'
          assert s.count(old) == 1
          s = s.replace(old, 'put("schedule", "Only original pair game 2: Pest seat 1, seat 0 starts; completed games excluded")')
          p.write_text(s)
          PY
      - name: Execute only the remaining seed and seat
        shell: bash
        env:
          MTG_BATCH_RUN: '1'
          MTG_BATCH_GAMES: '2'
          MTG_BATCH_SEED: ${{ matrix.seed }}
          MTG_BATCH_OUTPUT: ${{ github.workspace }}/gym/build/nonofficial-pest-tron-corrected-recovery-${{ matrix.seed }}
          ORIGINAL_SLOT: ${{ matrix.originalSlot }}
          ATTEMPT_KIND: ${{ matrix.attemptKind }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew scripts/gradle-locked scripts/test-class
          mkdir -p "$MTG_BATCH_OUTPUT"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = dict(originalRun=39096754088, originalAdditionalSlot=int(os.environ['ORIGINAL_SLOT']),
              seed=os.environ['MTG_BATCH_SEED'], pestSeat=1, startingSeat=0,
              attemptKind=os.environ['ATTEMPT_KIND'], officialExperiment=False,
              evidenceGroup='CORRECTED_RECOVERY', originalEngineCommit='e21404f9ad0a27ea7c5499cfb98118e540575a7a',
              correctedEngineCommit='8e9c0877ea51bc0a112891066b2465d5c124ab09', verificationRun=39117815882,
              originalRecordsUnchanged=True, profilesAndDecksUnchanged=True,
              slot7Disposition='Completed only as corrected diagnostic in 39117815882; excluded from baseline and not replayed')
          Path(os.environ['MTG_BATCH_OUTPUT'], 'recovery-mapping.json').write_text(json.dumps(data, indent=2)+'\n')
          PY
          just test-class PestMonsterTronBatchTest --no-daemon --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/corrected-recovery-gradle.log"
      - name: Validate selected game with unchanged original per-game validator
        shell: bash
        env:
          MTG_BATCH_SEED: ${{ matrix.seed }}
          MTG_BATCH_OUTPUT: ${{ github.workspace }}/gym/build/nonofficial-pest-tron-corrected-recovery-${{ matrix.seed }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, html
          from pathlib import Path
          sys.path.insert(0, 'tools/pest-tron-batch')
          import summarize
          root = Path(os.environ['MTG_BATCH_OUTPUT'])
          rows = summarize.read_jsonl(root/'results.jsonl')
          assert len(rows) == 1, 'Exactly one selected game must be recorded'
          row = rows[0]
          summarize.validate_one(root, row, 2, int(os.environ['MTG_BATCH_SEED']))
          assert row['outcome'] != 'FAILED', row
          assert sorted(p.name for p in root.glob('game-*.jsonl')) == ['game-002.jsonl']
          trace = summarize.read_jsonl(root/row['trace'])
          endings = [e for r in trace for e in r.get('emittedEvents',[]) if e['type']=='GameEndedEvent']
          assert len(endings)==1
          data = dict(evidenceGroup='CORRECTED_RECOVERY', completed=1, failed=0, officialExperiment=False,
              originalValidator='validate_one(number=2, base_seed=original seed); original numbering retained',
              row=row, terminationReason=endings[0]['reason'])
          (root/'validated-summary.json').write_text(json.dumps(data,indent=2)+'\n')
          (root/'report.html').write_text('<!doctype html><meta charset="utf-8"><title>Corrected recovery</title><h1>Nonofficial corrected recovery</h1><p>Separate from original baseline and diagnostic results. No completed game replayed.</p><pre>'+html.escape(json.dumps(data,indent=2))+'</pre>')
          print(json.dumps(data))
          PY
      - name: Preserve full traces and provenance including any partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pest-tron-corrected-recovery-${{ matrix.seed }}-${{ github.run_id }}
          retention-days: 30
          path: |
            gym/build/nonofficial-pest-tron-corrected-recovery-*/
            gym/build/test-results/test/
            gym/src/test/kotlin/com/wingedsheep/gym/PestMonsterTronBatchTest.kt
            tools/pest-tron-batch/summarize.py
            ${{ runner.temp }}/corrected-recovery-gradle.log

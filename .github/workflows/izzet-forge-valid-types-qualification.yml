name: Izzet Forge Valid Type Fixture Qualification

on:
  push:
    branches: [mayhem/izzet-forge-valid-types]
    paths:
      - .github/workflows/izzet-forge-valid-types-qualification.yml
      - mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ForgeOfHeroesScenarioTest.kt

permissions:
  contents: read

concurrency:
  group: izzet-forge-valid-types-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Retain exact source, frozen decks and previously reviewed golden before assertions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/izzet-forge-valid-types
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          expected = {
            'izzet-science/v0.7-control.md': '726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01',
            'izzet-science/opponents/veteran-beastrider-commander-clash-2025.txt': 'c3ab6ee8e37a78219e7bbb7c6a75c634d78c1eb4965ab0db3abd5d853398b0be',
            'mtg-sets/src/test/resources/snapshots/cards/C18.json': '8956f2db1a40917015600b29eece16803fb2c929d669a84661ed5d2cde0ceeaa',
            'mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ForgeOfHeroesScenarioTest.kt': 'd5b9b096054d0f05d547720e33aa59cc723989ab2f4bd4cb207482c1b83808a7',
          }
          observed = {path: hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              if pathlib.Path(path).is_file() else None for path in expected}
          binding = {
              'requested_head': os.environ['GITHUB_SHA'],
              'actual_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'actual_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'checkout_status': subprocess.check_output(['git', 'status', '--porcelain'], text=True),
              'expected': expected, 'observed': observed,
              'prior_target_source': '4aae1f9669769649e989735b4170f9bded15bc13',
              'prior_423_case_run': 36249667143,
              'scope': 'TEN_EXACT_FORGE_SCENARIOS_WITH_EXPLICIT_VALID_SYNTHETIC_TYPES_AND_SUBTYPES',
          }
          pathlib.Path('build/reports/izzet-forge-valid-types/source-binding.json').write_text(json.dumps(binding, indent=2) + '\n')
          assert binding['actual_head'] == binding['requested_head'], binding
          assert observed == expected, binding
          assert not binding['checkout_status'].strip(), binding
          PYTHON
      - name: Execute the same ten exact Forge scenarios with strengthened complete preconditions
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2017-2022:tests:test --tests '*ForgeOfHeroesScenarioTest' \
            --max-workers=1 -PkotlinCompileParallelism=1 \
            -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g \
            --info --stacktrace 2>&1 | tee build/reports/izzet-forge-valid-types/exact-card.log
      - name: Require all ten actual cases without failure, error or skip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('mtg-sets/2017-2022/tests/build/test-results/test')
          files = list(root.glob('TEST-*.xml'))
          assert len(files) == 1, files
          path = files[0]
          suite = ET.parse(path).getroot()
          assert suite.attrib['name'] == 'com.wingedsheep.engine.scenarios.ForgeOfHeroesScenarioTest', suite.attrib
          cases = suite.findall('testcase')
          assert len(cases) == int(suite.attrib['tests']) == 10, suite.attrib
          assert all(int(suite.attrib.get(key, 0)) == 0 for key in ['failures', 'errors', 'skipped']), suite.attrib
          assert all(not any(case.find(key) is not None for key in ['failure', 'error', 'skipped']) for case in cases)
          expected_projected = {
              'counter resolution reads projected types [PLANESWALKER] rather than printed creature type',
              'counter resolution reads projected types [CREATURE, PLANESWALKER] rather than printed creature type',
              'counter resolution reads projected types [LAND] rather than printed creature type',
          }
          names = [case.attrib['name'] for case in cases]
          assert len(set(names)) == 10 and expected_projected.issubset(names), names
          report = {'disposition': 'TARGETED_FIXTURE_ONLY_PENDING_INDEPENDENT_AUDIT_AND_FULL_RECEIVING_CI',
              'run_id': os.environ['GITHUB_RUN_ID'], 'actual_cases': 10, 'case_names': names,
              'xml_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'general_type_change_qualification': False, 'official_gameplay': 0, 'seeds_consumed': 0}
          pathlib.Path('build/reports/izzet-forge-valid-types/result.json').write_text(json.dumps(report, indent=2) + '\n')
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: izzet-forge-valid-types-qualification
          path: |
            build/reports/izzet-forge-valid-types
            mtg-sets/2017-2022/tests/build/test-results/test/*.xml
          if-no-files-found: warn

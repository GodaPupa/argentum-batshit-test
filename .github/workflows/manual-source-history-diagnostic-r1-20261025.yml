name: Manual source history diagnostic R1
on:
  push:
    branches: [validation/manual-source-history-diagnostic-r1-20261025]
    paths: ['.github/workflows/manual-source-history-diagnostic-r1-20261025.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: dd50a5ce32331912c7193c3a453d12548424ce2e
  SOURCE_TREE: 0fd4dd776d992eab49d85c239471388d0a5aaf7a
  WORKFLOW: .github/workflows/manual-source-history-diagnostic-r1-20261025.yml
  RECORD: experiments/manual-transmission/research/source-history-diagnostic-r1-20261025
  EVIDENCE: manual-source-history-diagnostic-r1-evidence
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  diagnostic:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install existing locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum" "$EVIDENCE"
      - name: Bind accepted production and exact four added diagnostic paths
        run: python3 "$RECORD/gate.py" bind
      - name: Compile unchanged production and new diagnostic tests
        run: |
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$EVIDENCE/validation.just" compile 2>&1 | tee "$EVIDENCE/compile.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$EVIDENCE/compile-exit.txt"
          exit "$rc"
      - name: Execute exactly five novel source-history diagnostic cases
        id: cases
        run: |
          python3 "$RECORD/gate.py" prepare
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$EVIDENCE/validation.just" diagnostic 2>&1 | tee "$EVIDENCE/diagnostic.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$EVIDENCE/test-exit.txt"
          python3 "$RECORD/gate.py" receive
          exit "$?"
      - name: Rebind unchanged accepted source after diagnostic
        if: always()
        run: python3 "$RECORD/gate.py" bind
      - name: Preserve original source logs reports and manifest
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil
          root = Path(os.environ['EVIDENCE'])
          for path in Path('.').glob('**/build/test-results/test/TEST-*.xml'):
              if root.name in path.parts: continue
              dest = root / 'original-junit' / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, dest)
          PY
          python3 "$RECORD/gate.py" archive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-source-history-diagnostic-r1-${{ github.run_id }}
          path: manual-source-history-diagnostic-r1-evidence/
          if-no-files-found: error
          retention-days: 30

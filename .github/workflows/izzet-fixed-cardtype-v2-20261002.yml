name: Izzet fixed card-type predicate v2
on:
  push:
    branches: ["validation/izzet-fixed-cardtype-v2-20261002"]
    paths: [".github/workflows/izzet-fixed-cardtype-v2-20261002.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUT: /tmp/izzet-fixed-cardtype-v2-${{ github.run_id }}
      GRADLE_USER_HOME: /tmp/izzet-fixed-cardtype-v2-gradle-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind exact corrected shared source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$OUT"
          test "$(git rev-parse HEAD^)" = "fe33513d47d4f38e16cfffd9f54cf97ee6be34c5"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/izzet-fixed-cardtype-v2-20261002.yml"
          test "$(git rev-parse HEAD^^)" = "b91e02ab9fd0ac8583dd9e880209811d842f1e2f"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/filters/unified/ObjectFilter.kt)" = "57ead5d283f9da1011ec8bbeb397bdf57f8cbced"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/predicates/CardPredicate.kt)" = "711f6bf6c66eeb0d0489bd8ba21d89898100b280"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/PredicateEvaluator.kt)" = "1329b8f79675ccd54e21689b3cfaa2a75315c65d"
          test "$(git hash-object rules-engine/src/test/kotlin/com/wingedsheep/engine/handlers/FixedCardTypePredicateTest.kt)" = "6cf227b1293cfcd74940bdfa366cc98f75a531f8"
          git rev-parse HEAD HEAD^{tree} HEAD^ HEAD^^ > "$OUT/source.txt"
          printf '%s\n' 'BOUNDED_SHARED_FIXED_CARDTYPE_AUTHOR_VALIDATION_ONLY_NO_CARD_ADMISSION_NO_GAMEPLAY_AUTHORITY' > "$OUT/authority.txt"
      - name: Compile shared SDK and rules-engine tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sdk:compileKotlin :rules-engine:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
      - name: Run fixed card-type regression
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :rules-engine:test --tests com.wingedsheep.engine.handlers.FixedCardTypePredicateTest \
            --tests com.wingedsheep.engine.handlers.ChosenCardTypePredicateTest 2>&1 | tee "$OUT/cardtype.log"
          cp rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.handlers.FixedCardTypePredicateTest.xml "$OUT/"
      - name: Run current AnyTarget regression
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sdk:test --tests com.wingedsheep.sdk.scripting.targets.AnyTargetUnlimitedTest 2>&1 | tee "$OUT/anytarget.log"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-fixed-cardtype-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

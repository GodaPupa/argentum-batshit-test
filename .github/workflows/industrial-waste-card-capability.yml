name: Industrial Waste — Card Capability Gate

on:
  workflow_dispatch:
  push:
    branches:
      - industrial-waste/lab
    paths:
      - .github/workflows/industrial-waste-card-capability.yml
      - industrial-waste/control/industrial-waste-v1.0-submitted.dck
      - industrial-waste/challengers/pactdoll-a.dck
      - industrial-waste/challengers/recursive-a.dck
      - industrial-waste/challengers/turbo-a.dck
      - industrial-waste/input-identities.sha256
      - industrial-waste/sim/**
      - mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ulg/cards/CropRotation.kt
      - mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c14/cards/IchorWellspringReprint.kt
      - mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c16/cards/IchorWellspringReprint.kt
      - mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/mbs/cards/IchorWellspring.kt
      - mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/som/cards/GolemFoundry.kt
      - mtg-sets/2024/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/mh3/cards/EvisceratorsInsight.kt
      - mtg-sets/2000-2002/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/jud/cards/BattleScreech.kt
      - mtg-sets/2000-2002/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/jud/cards/PrismaticStrands.kt
      - mtg-sets/2000-2002/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/BattleScreechScenarioTest.kt
      - mtg-sets/2000-2002/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/PrismaticStrandsScenarioTest.kt
      - mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/stx/cards/ThrillingDiscovery.kt
      - mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/mh1/cards/BattleScreechReprint.kt
      - mtg-sets/2024/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/mh3/cards/PerilousLandscape.kt
      - mtg-sdk/src/main/**
      - rules-engine/src/main/**
      - docs/card-sdk-language-reference.md
      - mtg-sets/src/test/resources/snapshots/cards/JUD.json
      - mtg-sets/src/test/resources/snapshots/cards/STX.json
      - mtg-sets/src/test/resources/snapshots/cards/MBS.json
      - mtg-sets/src/test/resources/snapshots/cards/MH3.json
      - mtg-sets/src/test/resources/snapshots/cards/SOM.json
      - mtg-sets/src/test/resources/snapshots/cards/ULG.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  card-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Validate frozen Industrial Waste inputs
        run: |
          python3 -m unittest discover -s industrial-waste/sim -p 'test_*.py' -v
          python3 industrial-waste/sim/validate_inputs.py

      - name: Verify committed card snapshots
        run: |
          set -o pipefail
          just rebless-cards 2>&1 | tee industrial-waste-card-snapshots.log
          git diff --binary > industrial-waste-card-snapshots.patch
          base64 -w0 industrial-waste-card-snapshots.patch

      - name: Run targeted card build gate
        run: |
          set -o pipefail
          scripts/gradle-locked \
            :mtg-sets:1993-1999:compileKotlin \
            :mtg-sets:2000-2002:tests:test --tests "*BattleScreechScenarioTest" --tests "*PrismaticStrandsScenarioTest" \
            :mtg-sets:2008-2016:compileKotlin \
            :mtg-sets:2017-2022:compileKotlin \
            :mtg-sets:2024:compileKotlin \
            :mtg-sets:test --tests "*CardDefinitionSnapshotTest" \
            2>&1 | tee industrial-waste-card-build.log

      - name: Verify canonical printings
        run: |
          just check-card-printing "Crop Rotation"
          just check-card-printing "Eviscerator's Insight"
          just check-card-printing "Golem Foundry"
          just check-card-printing "Ichor Wellspring"
          just check-card-printing "Battle Screech"
          just check-card-printing "Prismatic Strands"
          just check-card-printing "Thrilling Discovery"
          just check-card-printing "Perilous Landscape"

      - name: Run Assay differential checks
        run: |
          set -o pipefail
          {
            just assay-differential --set ULG
            just assay-differential --set MH3
            just assay-differential --set SOM
            just assay-differential --set MBS
            just assay-differential --set JUD
            just assay-differential --set STX
          } 2>&1 | tee industrial-waste-assay-differential.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-card-capability
          path: |
            industrial-waste-card-snapshots.log
            industrial-waste-card-snapshots.patch
            industrial-waste-card-build.log
            industrial-waste-assay-differential.log
          if-no-files-found: warn

      - name: Require committed snapshots
        run: git diff --exit-code

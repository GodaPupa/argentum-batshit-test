name: Industrial Waste — Card Capability Gate

on:
  workflow_dispatch:
  push:
    branches:
      - industrial-waste/lab

permissions:
  contents: read

jobs:
  card-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Validate frozen Industrial Waste inputs
        run: |
          python3 -m unittest discover -s industrial-waste/sim -p 'test_*.py' -v
          python3 industrial-waste/sim/validate_inputs.py

      - name: Generate card snapshots
        run: |
          set -o pipefail
          just rebless-cards 2>&1 | tee industrial-waste-card-snapshots.log
          git diff --binary > industrial-waste-card-snapshots.patch

      - name: Enforce exact snapshot scope
        run: |
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            mtg-sets/src/test/resources/snapshots/cards/MBS.json \
            mtg-sets/src/test/resources/snapshots/cards/MH3.json \
            mtg-sets/src/test/resources/snapshots/cards/SOM.json \
            mtg-sets/src/test/resources/snapshots/cards/ULG.json \
            | sort)"
          test "$actual" = "$expected"

      - name: Run full card build gate
        run: |
          set -o pipefail
          just build 2>&1 | tee industrial-waste-card-build.log

      - name: Verify canonical printings
        run: |
          just check-card-printing "Crop Rotation"
          just check-card-printing "Eviscerator's Insight"
          just check-card-printing "Golem Foundry"
          just check-card-printing "Ichor Wellspring"

      - name: Run Assay differential checks
        run: |
          set -o pipefail
          {
            just assay-differential --set ULG
            just assay-differential --set MH3
            just assay-differential --set SOM
            just assay-differential --set MBS
          } 2>&1 | tee industrial-waste-assay-differential.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-card-capability
          path: |
            industrial-waste-card-snapshots.log
            industrial-waste-card-snapshots.patch
            industrial-waste-card-build.log
            industrial-waste-assay-differential.log
          if-no-files-found: warn

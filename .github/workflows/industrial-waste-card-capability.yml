name: Industrial Waste — Card Capability Gate

on:
  workflow_dispatch:
  push:
    branches:
      - industrial-waste/lab
    paths:
      - .github/workflows/industrial-waste-card-capability.yml
      - industrial-waste/**
      - mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ulg/cards/CropRotation.kt
      - mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c14/cards/IchorWellspringReprint.kt
      - mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c16/cards/IchorWellspringReprint.kt
      - mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/mbs/cards/IchorWellspring.kt
      - mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/som/cards/GolemFoundry.kt
      - mtg-sets/2024/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/mh3/cards/EvisceratorsInsight.kt
      - mtg-sets/src/test/resources/snapshots/cards/MBS.json
      - mtg-sets/src/test/resources/snapshots/cards/MH3.json
      - mtg-sets/src/test/resources/snapshots/cards/SOM.json
      - mtg-sets/src/test/resources/snapshots/cards/ULG.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  card-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Validate frozen Industrial Waste inputs
        run: |
          python3 -m unittest discover -s industrial-waste/sim -p 'test_*.py' -v
          python3 industrial-waste/sim/validate_inputs.py

      - name: Verify committed card snapshots
        run: |
          set -o pipefail
          just rebless-cards 2>&1 | tee industrial-waste-card-snapshots.log
          git diff --exit-code

      - name: Run targeted card build gate
        run: |
          set -o pipefail
          scripts/gradle-locked \
            :mtg-sets:1993-1999:compileKotlin \
            :mtg-sets:2008-2016:compileKotlin \
            :mtg-sets:2024:compileKotlin \
            :mtg-sets:test --tests "*CardDefinitionSnapshotTest" \
            2>&1 | tee industrial-waste-card-build.log

      - name: Verify canonical printings
        run: |
          just check-card-printing "Crop Rotation"
          just check-card-printing "Eviscerator's Insight"
          just check-card-printing "Golem Foundry"
          just check-card-printing "Ichor Wellspring"

      - name: Run Assay differential checks
        run: |
          set -o pipefail
          {
            just assay-differential --set ULG
            just assay-differential --set MH3
            just assay-differential --set SOM
            just assay-differential --set MBS
          } 2>&1 | tee industrial-waste-assay-differential.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-card-capability
          path: |
            industrial-waste-card-snapshots.log
            industrial-waste-card-build.log
            industrial-waste-assay-differential.log
          if-no-files-found: warn

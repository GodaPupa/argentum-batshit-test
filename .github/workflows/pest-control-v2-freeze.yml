name: Pest Control V2 Official Seed Freeze

on:
  push:
    branches:
      - 'pest-control/v2-calibration'

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate freeze artifacts only
        env:
          PEST_V2_FREEZE: "true"
          PEST_V2_FREEZE_ACK: "GENERATE_V2_OFFICIAL_SEEDS_NO_GAMEPLAY"
          PEST_V2_QUALIFIED_RUNNER: "43d9c29cbde78d070761bc617570a72a225f3e0f"
        run: scripts/test-class PestControlV2OfficialSeedFreezeGeneratorTest --info --stacktrace
      - name: Upload frozen seed evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-control-v2-official-seed-freeze
          path: build/reports/pest-control-v2-freeze/
          if-no-files-found: error

name: Manual Pact of Negation static preflight
on:
  push:
    branches: ["manual/clean-pilot-boundary-receiving-20260927"]
    paths: [".github/workflows/manual-pact-negation-preflight.yml"]
permissions: {contents: read}
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact Pact source test and parent
        run: |
          set -euo pipefail
          mkdir -p build/reports/manual-pact-preflight
          test "$(git rev-parse HEAD^)" = "5814390ee330f07e24a623123644bc69d21b4bcb"
          test "$(git hash-object mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/fut/cards/PactOfNegation.kt)" = "c786551484cfb001eea9fc2b05e14ea23fd63bf9"
          test "$(git hash-object mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/PactOfNegationScenarioTest.kt)" = "f3f2315ba698327ef2e930bf2990c44a888e7b38"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/fut/cards/PactOfNegation.kt; git hash-object mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/PactOfNegationScenarioTest.kt; git hash-object .github/workflows/manual-pact-negation-preflight.yml; } > build/reports/manual-pact-preflight/source.txt
      - name: Compile Pact source and prospective bank without executing cases
        run: just test-class PactOfNegationScenarioTest --dry-run 2>&1 | tee build/reports/manual-pact-preflight/compile.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-pact-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/manual-pact-preflight/
          if-no-files-found: error
          retention-days: 90

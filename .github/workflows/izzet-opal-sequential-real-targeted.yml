name: Izzet real sequential two-Palace payment targeted
on:
  push:
    branches: ["izzet/opal-sequential-real-payment-20260928"]
    paths:
      - ".github/workflows/izzet-opal-sequential-real-targeted.yml"
permissions:
  contents: read
jobs:
  payment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source and physical Palace card
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/izzet-opal-sequential-real-targeted
          test "$(git rev-parse HEAD^)" = "ab63f8f3bb7f44ff9eba2a6dfbe3859d9ff237b2"
          test "$(git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/OpalPalaceSequentialRealPaymentTest.kt)" = "9af8ea09deaaeaed72c3bb020a4ef552429429bd"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c13/cards/OpalPalace.kt)" = "544a440160528f4a08211109936a55e263c39d19"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/OpalPalaceSequentialRealPaymentTest.kt; git hash-object .github/workflows/izzet-opal-sequential-real-targeted.yml; git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c13/cards/OpalPalace.kt; git status --porcelain; } > build/reports/izzet-opal-sequential-real-targeted/source.txt
      - name: Execute one fresh physical sequential payment fixture
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :mtg-sets:2008-2016:tests:test --tests 'com.wingedsheep.engine.scenarios.OpalPalaceSequentialRealPaymentTest' --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-opal-sequential-real-targeted/test.log
      - name: Retain original XML
        if: always()
        shell: bash
        run: |
          cp mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.OpalPalaceSequentialRealPaymentTest.xml build/reports/izzet-opal-sequential-real-targeted/ 2>/dev/null || true
      - name: Upload original evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-opal-sequential-real-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-opal-sequential-real-targeted/
          if-no-files-found: error
          retention-days: 90

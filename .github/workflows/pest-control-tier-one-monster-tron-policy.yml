name: Pest Control Tier-1 Monster Tron Policy Calibration

on:
  push:
    branches:
      - "pest-control/tier1-monster-tron-policy"
  pull_request:
    paths:
      - "ai/src/test/kotlin/com/wingedsheep/ai/arena/PestMonsterTronAdvisorModule.kt"
      - "ai/src/test/kotlin/com/wingedsheep/ai/arena/PestMonsterTronPolicyAuditTest.kt"
      - "gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonsterTronPolicyReadiness.kt"
      - "gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonsterTronPolicyReadinessTest.kt"
      - "docs/experiments/pest-control/tier-one-monster-tron-policy.md"
      - ".github/workflows/pest-control-tier-one-monster-tron-policy.yml"

permissions:
  contents: read

jobs:
  seedless-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Requalify exact-60 predecessor boundary
        run: scripts/test-class PestControlTierOneMonsterTronReadinessTest --info --stacktrace

      - name: Qualify exact Monster Tron opponent policy
        run: scripts/test-class PestMonsterTronPolicyAuditTest --info --stacktrace

      - name: Close only the policy blocker
        env:
          PEST_MONSTER_TRON_POLICY_REPORT: ${{ github.workspace }}/build/reports/pest-monster-tron-policy/report.txt
        run: scripts/test-class PestControlTierOneMonsterTronPolicyReadinessTest --info --stacktrace

      - name: Requalify Cascade and Prototype predecessors
        run: |
          scripts/test-class CascadeKeywordTest --info --stacktrace
          scripts/test-class MaelstromColossusCascadeScenarioTest --info --stacktrace
          scripts/test-class BoulderbranchGolemPrototypeScenarioTest --info --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: pest-control-tier-one-monster-tron-policy
          path: build/reports/pest-monster-tron-policy/report.txt
          if-no-files-found: error
          retention-days: 90

name: Manual public occurrence matrix R3
on:
  push:
    branches: [validation/manual-public-occurrence-matrix-r3-20261027]
    paths: ['.github/workflows/manual-public-occurrence-matrix-r3-20261027.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 587bc4070595bed27a7a5cb4970b423655374a50
  SOURCE_TREE: 1cd3ad2d6736ca6fe4a95ef8d281c8debe1eac7a
  WORKFLOW: .github/workflows/manual-public-occurrence-matrix-r3-20261027.yml
  RECORD: experiments/manual-transmission/research/public-occurrence-matrix-r3-20261027
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile normal and all mutants before public matrix behavior
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-public-occurrence-matrix-r3-${{ github.run_id }}
          path: manual-public-occurrence-matrix-r3-evidence/
          include-hidden-files: true
          if-no-files-found: error

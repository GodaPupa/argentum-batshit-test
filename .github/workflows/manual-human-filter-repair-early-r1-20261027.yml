name: Manual Human filter repair early R1
on:
  push:
    branches: [validation/manual-human-filter-repair-early-r1-20261027]
    paths: ['.github/workflows/manual-human-filter-repair-early-r1-20261027.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 8e2c68327c4317ec9245c6fb6ec0f141f2152b1b
  SOURCE_TREE: 17bba3b9d04e24d9dac1e648b56f6639b39b4877
  WORKFLOW: .github/workflows/manual-human-filter-repair-early-r1-20261027.yml
  RECORD: experiments/manual-transmission/research/human-filter-repair-early-r1-20261027
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile normal and all mutants before exact controls and output inventory
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-human-filter-repair-early-r1-${{ github.run_id }}
          path: manual-human-filter-repair-early-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error

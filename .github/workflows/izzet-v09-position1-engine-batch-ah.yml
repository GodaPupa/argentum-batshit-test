name: Izzet Position-1 Engine Batch AH

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-ah.yml"

permissions:
  contents: read

jobs:
  qualify-batch-ah:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch AH provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'Batch AG is accepted' izzet-science/v09-position1-engine-batch-ag-gate.md
          grep -Fq 'Expected post-implementation unresolved count is exactly **19**' izzet-science/v09-position1-engine-batch-ah-gate.md
          test "$(git show --format= --name-only dd3dae645f88bd987f2e31d34523598fa6a1c8e7 | sed '/^$/d' | wc -l)" -eq 1
          test "$(git show --format= --name-only dd3dae645f88bd987f2e31d34523598fa6a1c8e7 | sed '/^$/d')" = "mtg-sets/src/test/resources/snapshots/cards/M12.json"

      - name: Requalify canonical card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --stacktrace

      - name: Requalify Stave Off semantics
        run: scripts/test-class StaveOffBatchAHScenarioTest --info --stacktrace

      - name: Run exact real-engine coverage regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-ah.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=19' /tmp/batch-ah.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Stave Off' /tmp/batch-ah.txt
          ! grep -Fq 'V09_REAL_ENGINE_UNRESOLVED=unresolved Izzet card:' /tmp/batch-ah.txt

      - name: Assert official experiment remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt

      - name: Emit Batch AH manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izzet-batch-ah
          cp /tmp/batch-ah.txt /tmp/izzet-batch-ah/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-ah-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "frozen_control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "implemented=Stave Off;existing choose-color+temporary-protection rails"
            echo "snapshot_run=36059365434"
            echo "snapshot_commit=dd3dae645f88bd987f2e31d34523598fa6a1c8e7"
            echo "unresolved_before=20"
            echo "unresolved_after=19"
            echo "unresolved_izzet_after=0"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m12/cards/StaveOff.kt
            sha256sum mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/StaveOffBatchAHScenarioTest.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/v09-position1-engine-batch-ah-gate.md
            sha256sum mtg-sets/src/test/resources/snapshots/cards/M12.json
            sha256sum /tmp/izzet-batch-ah/test-output.txt
          } > /tmp/izzet-batch-ah/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-ah
          path: /tmp/izzet-batch-ah
          if-no-files-found: error
          retention-days: 90

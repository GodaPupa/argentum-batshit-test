name: Manual Pact of Negation mechanics targeted
on:
  push:
    branches: ["manual/clean-pilot-boundary-receiving-20260927"]
    paths: [".github/workflows/manual-pact-negation-targeted.yml"]
permissions: {contents: read}
jobs:
  three-declared-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact Pact source test and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/manual-pact-targeted
          test "$(git rev-parse HEAD^)" = "3aa5f6e88c17f5f7eae2c843d36b651ad7de97d7"
          test "$(git hash-object mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/fut/cards/PactOfNegation.kt)" = "c786551484cfb001eea9fc2b05e14ea23fd63bf9"
          test "$(git hash-object mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/PactOfNegationScenarioTest.kt)" = "62b059d8f9cf5181cc7778c85098320ef14cd0ec"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/fut/cards/PactOfNegation.kt; git hash-object mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/PactOfNegationScenarioTest.kt; git hash-object .github/workflows/manual-pact-negation-targeted.yml; git status --porcelain; } > build/reports/manual-pact-targeted/source.txt
      - name: Execute exactly three Pact mechanics traces
        shell: bash
        run: |
          set -o pipefail
          just test-class PactOfNegationScenarioTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/manual-pact-targeted/test.log
      - name: Retain exact XML
        if: always()
        run: cp mtg-sets/2003-2007/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.PactOfNegationScenarioTest.xml build/reports/manual-pact-targeted/ 2>/dev/null || true
      - name: Preserve original behavioral evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-pact-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/manual-pact-targeted/
          if-no-files-found: error
          retention-days: 90

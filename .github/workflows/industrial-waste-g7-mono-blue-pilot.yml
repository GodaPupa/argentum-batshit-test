name: Industrial Waste — Gate 7 Mono-Blue Pilot

on:
  push:
    branches: [industrial-waste/lab]
    paths:
      - .github/workflows/industrial-waste-g7-mono-blue-pilot.yml
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteMonoBluePilotBenchmark.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/MonoBlueTerrorAdvisorModule.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteAdvisorModule.kt
      - industrial-waste/protocols/gate-7-mono-blue-terror-pilot-v1.md
      - industrial-waste/control/industrial-waste-v1.0-submitted.dck
      - industrial-waste/challengers/pactdoll-a.dck
      - industrial-waste/gauntlet/mono-blue-terror-joan-rubies-2026-09-12.dck
      - industrial-waste/seed-registry.json
      - industrial-waste/input-identities.sha256
      - industrial-waste/sim/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mono-blue-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Verify frozen inputs and fresh disjoint vector
        run: |
          python3 industrial-waste/sim/validate_inputs.py
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          namespace = "IW-G7-MONO-BLUE-PILOT-V1"
          expected_count = 2
          expected_digest = "c83699168fb75acea7092666817792ca4bb611e1e59ac62533347e4e8126d733"
          expected_opponent_digest = "f99a01d040e8d0c5d0144db019ca53db7a07bb251c07ac6fb3118f695d3fc3d3"

          def seed_for(ns, index):
              raw = hashlib.sha256(f"{ns}:{index}".encode()).digest()[:8]
              value = int.from_bytes(raw, "big") & ((1 << 63) - 1)
              return value or 1

          entries = json.loads(Path("industrial-waste/seed-registry.json").read_text())
          entry = next(item for item in entries if item["namespace"] == namespace)
          assert entry["count"] == expected_count
          assert entry["status"] == "reserved"
          vector = [seed_for(namespace, i) for i in range(1, expected_count + 1)]
          digest = hashlib.sha256("\n".join(map(str, vector)).encode()).hexdigest()
          assert digest == expected_digest == entry["vector_sha256"]
          mine = set(vector)
          for other in entries:
              if other["namespace"] == namespace:
                  continue
              other_vector = {seed_for(other["namespace"], i) for i in range(1, other["count"] + 1)}
              assert mine.isdisjoint(other_vector), f"seed overlap with {other['namespace']}"

          opponent = Path("industrial-waste/gauntlet/mono-blue-terror-joan-rubies-2026-09-12.dck")
          opponent_digest = hashlib.sha256(opponent.read_bytes()).hexdigest()
          assert opponent_digest == expected_opponent_digest
          print(f"Gate 7 vector fresh/disjoint: {vector} sha256={digest}")
          print(f"Mono-Blue opponent identity: {opponent_digest}")
          PY
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v6
      - name: Execute frozen-vector Gate 7 pilot
        id: pilot
        continue-on-error: true
        env:
          IW_MONO_BLUE_PILOT: "true"
        run: ./gradlew :ai:test --tests IndustrialWasteMonoBluePilotBenchmark -Dbenchmark=true --no-daemon
      - name: Diagnose pilot runtime
        if: always()
        run: |
          echo "pilot_outcome=${{ steps.pilot.outcome }}"
          find ai/build/test-results -type f -maxdepth 4 -print 2>/dev/null || true
          for f in ai/build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            cat "$f"
          done
      - name: Enforce pilot success
        if: always()
        run: test "${{ steps.pilot.outcome }}" = "success"
      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-g7-mono-blue-pilot
          path: industrial-waste/results/gate-7-mono-blue-pilot-v1.json
          if-no-files-found: ignore

name: Industrial Waste — Murmuring Mystic Capability

on:
  push:
    branches: [industrial-waste/lab]
    paths:
      - .github/workflows/industrial-waste-g7-murmuring-mystic.yml
      - mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/grn/cards/MurmuringMystic.kt
      - mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/MurmuringMysticScenarioTest.kt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  murmuring-mystic-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Murmuring Mystic scenarios
        run: ./gradlew :mtg-sets:2017-2022:tests:test --tests '*MurmuringMysticScenarioTest' --no-daemon

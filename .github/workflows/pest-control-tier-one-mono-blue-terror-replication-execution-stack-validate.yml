name: Pest Control Tier-1 Mono-Blue Terror Replication Authorization VALIDATE_ONLY

on:
  pull_request:
    paths:
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonoBlueTerrorReplicationExecutionAuthorization.kt
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonoBlueTerrorReplicationAuthorizedInitializer.kt
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonoBlueTerrorReplicationDurableAttempts.kt
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonoBlueTerrorReplicationArtifactContract.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonoBlueTerrorReplicationOfficialExecutionRunnerTest.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonoBlueTerrorReplicationComposedValidationTest.kt
      - .github/workflows/pest-control-tier-one-mono-blue-terror-replication-execution-stack-validate.yml
      - .github/workflows/pest-control-tier-one-mono-blue-terror-replication-official-execute.yml
      - docs/experiments/pest-control/tier-one-mono-blue-terror-replication-execution-stack.md
      - docs/experiments/pest-control/tier-one-mono-blue-terror-replication-auto-execution-authorization.json

permissions:
  actions: read
  contents: read

jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify exact execution authorization
        run: |
          set -euo pipefail
          echo "9668fde1aa109433b8b87b3677aab1f8ce4995efea98f145e7324df191085572  docs/experiments/pest-control/tier-one-mono-blue-terror-replication-auto-execution-authorization.json" | sha256sum -c -
          grep -F 'PRIMARY_REPLICATION_EXECUTION_AUTHORIZED'             gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonoBlueTerrorReplicationExecutionAuthorization.kt
          test -f .github/workflows/pest-control-tier-one-mono-blue-terror-replication-official-execute.yml

      - name: Verify automatic one-shot workflow contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/pest-control-tier-one-mono-blue-terror-replication-official-execute.yml").read_text()
          assert ("workflow" + "_dispatch") not in text
          assert "\n  push:" in text
          assert "github.event_name == 'push'" in text
          assert "GITHUB_RUN_ATTEMPT" in text
          assert "PestControlTierOneMonoBlueTerrorReplicationOfficialExecutionRunnerTest" in text
          assert "pest-control-tier-one-mono-blue-terror-replication-official-execution" in text
          PY

      - name: Download exact frozen replication artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/pest-terror-replication-input
          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10773131628/zip"             -o build/pest-terror-replication-freeze.zip
          echo "4d3a19ef7febacb336911ff1271c14ab83a6ea1f99ed34ae154ae154d6ef5f25  build/pest-terror-replication-freeze.zip" | sha256sum -c -
          unzip -q build/pest-terror-replication-freeze.zip -d build/pest-terror-replication-input
          cd build/pest-terror-replication-input
          sha256sum -c artifacts.sha256

      - name: Validate authorized replication execution stack without gameplay
        run: scripts/test-class PestControlTierOneMonoBlueTerrorReplicationComposedValidationTest --info --stacktrace

      - name: Revalidate exact frozen replication artifact without gameplay
        env:
          PEST_TERROR_REPLICATION_MODE: VALIDATE_ONLY
          PEST_TERROR_REPLICATION_INPUT_DIR: ${{ github.workspace }}/build/pest-terror-replication-input
        run: scripts/test-class PestControlTierOneMonoBlueTerrorReplicationOfficialArtifactValidationTest --info --stacktrace

name: Pest Control Tier-1 Mono-Blue Terror Replication Execution Stack Accepted

on:
  pull_request:
    paths:
      - .github/workflows/pest-control-tier-one-mono-blue-terror-replication-execution-stack-validate.yml
      - docs/experiments/pest-control/tier-one-mono-blue-terror-replication-execution-stack.md

permissions:
  contents: read

jobs:
  validate-accepted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify accepted execution-stack provenance
        run: |
          set -euo pipefail
          grep -F '`728e2d5e150c527b2049e10b8bc304945e2b7d99`' docs/experiments/pest-control/tier-one-mono-blue-terror-replication-execution-stack.md
          grep -F '`b8468b5b7865db5a2138852968b9e6ef89278273`' docs/experiments/pest-control/tier-one-mono-blue-terror-replication-execution-stack.md
          grep -F '`35925031349` — success' docs/experiments/pest-control/tier-one-mono-blue-terror-replication-execution-stack.md
          grep -F '`35925031432` — success' docs/experiments/pest-control/tier-one-mono-blue-terror-replication-execution-stack.md
          grep -F 'games initialized: `0/12`' docs/experiments/pest-control/tier-one-mono-blue-terror-replication-execution-stack.md

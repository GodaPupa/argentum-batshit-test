name: Pest frozen raw London keep parity targeted
on:
  push:
    branches: ["pest/london-raw-keep-parity-20260928"]
    paths:
      - ".github/workflows/pest-london-raw-keep-targeted.yml"
permissions:
  contents: read
jobs:
  four-declared-openings:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind unchanged raw controller and bounded actor decision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-raw-keep-targeted
          test "$(git rev-parse HEAD^)" = "aae278542a5a01970a2823a75a363bd2cb78ff90"
          test "$(git hash-object ai/src/main/kotlin/com/wingedsheep/ai/engine/EngineAiPlayerController.kt)" = "4f020ea2406e9bd6a87ec389685b48f15df4c5a3"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonKeepPolicy.kt)" = "389d42600f28c8f7ffe025dc4b4daa124fda82e8"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonRawKeepParityTest.kt)" = "73275bc0cb4086e1c6beaacd8fa1feb1a394fa38"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object ai/src/main/kotlin/com/wingedsheep/ai/engine/EngineAiPlayerController.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonKeepPolicy.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/matchup/PestMonsterLondonRawKeepParityTest.kt; git hash-object .github/workflows/pest-london-raw-keep-targeted.yml; git status --porcelain; } > build/reports/pest-raw-keep-targeted/source.txt
      - name: Execute only four raw keep/mulligan comparisons
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:test --tests 'com.wingedsheep.gym.matchup.PestMonsterLondonRawKeepParityTest' --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/pest-raw-keep-targeted/test.log
      - name: Retain original exact XML
        if: always()
        shell: bash
        run: |
          if test -f gym/build/test-results/test/TEST-com.wingedsheep.gym.matchup.PestMonsterLondonRawKeepParityTest.xml; then
            cp gym/build/test-results/test/TEST-com.wingedsheep.gym.matchup.PestMonsterLondonRawKeepParityTest.xml build/reports/pest-raw-keep-targeted/
          fi
      - name: Upload original targeted evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-raw-keep-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-raw-keep-targeted/
          if-no-files-found: error
          retention-days: 90

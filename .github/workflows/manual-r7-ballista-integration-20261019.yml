name: Manual R7 Ballista gated prefix and one bounded Commander integration
on:
  push:
    branches: [gameplay/manual-r7-ballista-integration-20261019]
    paths:
      - 'ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualR7AllocationIntegrationSmokeTest.kt'
      - '.github/workflows/manual-r7-ballista-integration-20261019.yml'
permissions:
  contents: read
  actions: read
jobs:
  bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R4_ROOT: ${{ github.workspace }}
      MANUAL_R7_ALLOCATION_GAME_OUTPUT: ${{ github.workspace }}/r7-allocation-integration-output/smoke
      MANUAL_R7_ALLOCATION_GAME: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Bind frozen deck and accepted R7 targeted-pass source before gameplay
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p r7-allocation-integration-output
          git rev-parse HEAD > r7-allocation-integration-output/source-sha.txt
          git rev-parse HEAD^{tree} > r7-allocation-integration-output/tree-sha.txt
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/modules/ManualBallistaContinuationAdvisorModule.kt)" = "181c4c54f0cbbf39a7fdd788d890019b5ed81ea6"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/modules/ManualR7BallistaAllocationAdvisorModule.kt)" = "7359818f0d782581f0cb52af4319dcdbbb050202"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualR7BallistaAllocationCandidate.kt)" = "5bb856f37b9289ba09366401ad99228564d92a58"
          receipt="$(gh api -H "Accept: application/vnd.github+json" /repos/GodaPupa/argentum-batshit-test/actions/runs/39337184560)"
          printf '%s\n' "$receipt" | jq -e '.status == "completed" and .conclusion == "success" and .head_sha == "a4a4234533c78c3be628fd1e22f0fd7c54f54f8a"'
          printf '%s\n' 'PASS: targeted-positive, nine-negative, retained-R4/R5-regressions' > r7-allocation-integration-output/targeted-preflight.txt
          chmod +x gradlew scripts/gradle-locked
      - name: Gate 64 accepted real four-player actions before any full game
        shell: bash
        env:
          MANUAL_R7_ALLOCATION_PREFIX_ONLY: '1'
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:test --tests '*ManualR7AllocationIntegrationSmokeTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace 2>&1 | tee r7-allocation-integration-output/prefix.log
          test -s r7-allocation-integration-output/smoke/prefix-seed-202610191609/smoke-passed.txt
      - name: Exactly one opt-in same-seed four-player Commander integration
        shell: bash
        env:
          MANUAL_R7_ALLOCATION_PREFIX_ONLY: '0'
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test --tests '*ManualR7AllocationIntegrationSmokeTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace 2>&1 | tee r7-allocation-integration-output/game.log
          test -s r7-allocation-integration-output/smoke/seed-202610191609/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-r7-allocation-integration-${{ github.run_id }}
          retention-days: 30
          path: |
            r7-allocation-integration-output/
            ai/build/test-results/test/

name: Industrial seed-free actual build-output capture
on:
  push:
    branches: ["industrial-waste/r1-manifest-capture-20260928"]
    paths: [".github/workflows/industrial-seed-free-build-capture.yml"]
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact capture source budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/industrial-seed-free-build-capture
          test "$(git rev-parse HEAD^)" = "3a6b5d9b9431b4ed5ffe2c013c9f3c9df55c79d6"
          test "$(git hash-object industrial-waste/v2/capture_seed_free_build_slice.py)" = "0d3c82426f81233ff599fa50d42dce0bae872107"
          test "$(git hash-object industrial-waste/v2/r1-seed-free-build-output-capture-budget.json)" = "2964e1a3870d9da1e81a519af42ada0f5ceecd5a"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object industrial-waste/v2/capture_seed_free_build_slice.py; git hash-object industrial-waste/v2/r1-seed-free-build-output-capture-budget.json; git hash-object .github/workflows/industrial-seed-free-build-capture.yml; git status --porcelain; } > build/reports/industrial-seed-free-build-capture/source.txt
      - name: Produce deterministic non-corpus build outputs
        shell: bash
        run: |
          set -o pipefail
          just test-class IndustrialWasteV2RegistryAuditTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/industrial-seed-free-build-capture/build.log
      - name: Capture actual compiled output bytes and toolchain
        shell: bash
        run: |
          set -o pipefail
          python3 industrial-waste/v2/capture_seed_free_build_slice.py 2>&1 | tee build/reports/industrial-seed-free-build-capture/capture.log
      - name: Preserve original capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-seed-free-build-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/industrial-seed-free-build-capture/
          if-no-files-found: error
          retention-days: 90

name: Manual pre-entry land payment ordering qualification

on:
  push:
    branches:
      - validation/manual-disciple-preentry-ordering-v2-20261003

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      OUT: /tmp/manual-disciple-preentry-${{ github.run_id }}
      GRADLE_LOCK_SLOTS: "1"
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Bind exact source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git fetch --no-tags --deepen=8 origin "$GITHUB_REF_NAME"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out=pathlib.Path(os.environ["OUT"])
          source="ad6bde239aac9dab60f231ee2ba7c86e9f1c59a7"
          parent="5055df90b530e00f9dd044e1dab57e9b18ddc7f7"
          workflow=".github/workflows/manual-disciple-preentry-ordering-v2-20261003.yml"
          expected={
            "rules-engine/src/main/kotlin/com/wingedsheep/engine/core/ModalAndCloneContinuations.kt":"bc0172c3b53db87aee5f959f0ffadaddef2f5c58",
            "rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/land/PlayLandHandler.kt":"73c12bd58b13cede961b94618ab4ecf9052ddffe",
            "rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/ModalAndCloneContinuationResumer.kt":"e76cf4af6bbe40c76aec7f0ca9c84a74242a11ae",
            "rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/PreEntryLandPlayPaymentTest.kt":"b1d1eb18713eb5d5cd300e0c91bba0c97c2d5e7d",
          }
          def git(*args):
              return subprocess.check_output(["git",*args],text=True).strip()
          assert git("rev-parse","HEAD")==os.environ["GITHUB_SHA"]
          assert git("rev-parse","HEAD^")==source
          assert git("merge-base",parent,source)==parent
          assert git("rev-list","--count",parent+".."+source)=="1"
          assert git("rev-parse",source+"^{tree}")=="5e8834e89d4f789f6087a87bd52f4b52abdae6b2"
          assert git("diff","--name-only",source,"HEAD").splitlines()==[workflow]
          assert git("diff","--name-only",parent,source).splitlines()==sorted(expected)
          for path,blob in expected.items():
              assert git("hash-object",path)==blob,(path,git("hash-object",path),blob)
          (out/"source-binding.json").write_text(json.dumps({
              "source_head":source,
              "source_tree":git("rev-parse",source+"^{tree}"),
              "parent_live":parent,
              "source_blobs":expected,
              "official_counters_delta":{"allocations":0,"claims":0,"games":0,"outcomes":0},
          },indent=2)+"\n")
          PY

      - name: Run focused pre-entry land-payment regressions
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --console=plain --max-workers=1             -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g             :rules-engine:test --tests com.wingedsheep.engine.scenarios.PreEntryLandPlayPaymentTest             2>&1 | tee "$OUT/qualification.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
          exit "$rc"

      - name: Audit actual cases
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ["OUT"]); out.mkdir(parents=True,exist_ok=True)
          path=pathlib.Path("rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.PreEntryLandPlayPaymentTest.xml")
          row={"path":str(path),"expected":7,"missing":not path.exists(),"cases":[]}
          if path.exists():
              root=ET.parse(path).getroot()
              row["cases"]=[{
                  "name":c.attrib.get("name"),
                  "failure":c.find("failure") is not None,
                  "error":c.find("error") is not None,
                  "skipped":c.find("skipped") is not None,
              } for c in root.findall("testcase")]
              shutil.copy2(path,out/path.name)
          (out/"actual-cases.json").write_text(json.dumps(row,indent=2)+"\n")
          assert not row["missing"],row
          assert len(row["cases"])==7,row
          assert len({c["name"] for c in row["cases"]})==7,row
          assert not any(c["failure"] or c["error"] or c["skipped"] for c in row["cases"]),row
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manual-disciple-preentry-${{ github.run_id }}
          path: /tmp/manual-disciple-preentry-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90

name: Pest Control Tier-1 Grixis Replication Official Execution
run-name: Pest Grixis replication EXECUTE 12

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pest-control-tier-one-grixis-replication-official-execution
  cancel-in-progress: false

env:
  REPLICATION_ARTIFACT_ID: "10660335894"
  REPLICATION_ARTIFACT_SHA256: 49597c4a3011464e1d4bb707dfa1b554090054059e0675254524c92fcce8d6fd

jobs:
  official:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - name: Reject GitHub rerun
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"

      - name: Checkout exact workflow-dispatch commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Capture exact commit and tree
        id: identity
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          test "${commit}" = "${GITHUB_SHA}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "tree=${tree}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Download exact frozen replication artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/pest-grixis-replication-input
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REPLICATION_ARTIFACT_ID}/zip"             -o build/pest-grixis-replication-freeze.zip
          echo "${REPLICATION_ARTIFACT_SHA256}  build/pest-grixis-replication-freeze.zip" | sha256sum -c -
          unzip -q build/pest-grixis-replication-freeze.zip -d build/pest-grixis-replication-input
          cd build/pest-grixis-replication-input
          sha256sum -c artifacts.sha256

      - name: Create durable execution envelope
        env:
          EXECUTION_COMMIT: ${{ steps.identity.outputs.commit }}
          EXECUTION_TREE: ${{ steps.identity.outputs.tree }}
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-control-tier-one-grixis-replication-official
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "execution_commit=${EXECUTION_COMMIT}"
            echo "execution_tree=${EXECUTION_TREE}"
            echo "replication_artifact_id=${REPLICATION_ARTIFACT_ID}"
            echo "replication_artifact_sha256=${REPLICATION_ARTIFACT_SHA256}"
            echo "vector_sha256=5cd8a78fb62a59495d07ed31c4579fab7bafe2bc9c075aa7757a7f67953c75d4"
            echo "assignments_sha256=d85a30dcf46132609bdcd29d3a2b2e8621dba82b4e2111d95a385fb7642b4fab"
            echo "manifest_sha256=5adea1d05defd4232d5117822c5a0afdf01532d75e05f180ea488b1b83e41a65"
          } > build/reports/pest-control-tier-one-grixis-replication-official/execution-envelope.txt

      - name: Execute frozen twelve-game replication vector exactly once
        env:
          PEST_GRIXIS_REPLICATION_MODE: EXECUTE
          PEST_GRIXIS_REPLICATION_INPUT_DIR: ${{ github.workspace }}/build/pest-grixis-replication-input
          PEST_GRIXIS_REPLICATION_EXECUTION_COMMIT: ${{ steps.identity.outputs.commit }}
          PEST_GRIXIS_REPLICATION_OUTPUT_DIR: ${{ github.workspace }}/build/reports/pest-control-tier-one-grixis-replication-official
        run: scripts/test-class PestControlTierOneGrixisReplicationOfficialExecutionRunnerTest --info --stacktrace

      - name: Upload official replication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-control-tier-one-grixis-replication-official-execution
          path: build/reports/pest-control-tier-one-grixis-replication-official/
          if-no-files-found: error
          retention-days: 90

name: Retrieve existing Ferocity historical fixed Gift template candidate

on:
  push:
    branches: [lab/ferocity-historical-gift-retrieval-20260926]

permissions:
  contents: read

jobs:
  retrieve-published-fixed-archive:
    if: ${{ github.event.before == '0000000000000000000000000000000000000000' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out only this reviewed retrieval source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retrieve and inspect exactly one immutable published archive
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: python3 ferocity-recycling/tools/retrieve-historical-gift-template.py
      - name: Preserve source binding, archive inspection and original bytes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ferocity-historical-gift-retrieval-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

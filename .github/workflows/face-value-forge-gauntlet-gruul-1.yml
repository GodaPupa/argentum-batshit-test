name: Face Value Forge Gauntlet Gruul 1

on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-forge-gauntlet-gruul-1.yml]

permissions:
  contents: read

jobs:
  gruul-gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone Forge and apply validated Face Value heuristics
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src rev-parse HEAD | tee forge-source-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          energy=Path('forge-src/forge-gui/res/cardsfolder/e/energy_tap.txt'); t=energy.read_text()
          old="A:SP$ Tap | TgtPrompt$ Select target untapped creature you control | ValidTgts$ Creature.untapped+YouCtrl | SubAbility$ DBMana | SpellDescription$ Tap target untapped creature you control. If you do, add an amount of {C} equal to that creature's mana value."
          new="A:SP$ Tap | TgtPrompt$ Select target untapped creature you control | ValidTgts$ Creature.untapped+YouCtrl | AILogic$ EnergyTap | SubAbility$ DBMana | SpellDescription$ Tap target untapped creature you control. If you do, add an amount of {C} equal to that creature's mana value."
          assert old in t; energy.write_text(t.replace(old,new).replace('\nAI:RemoveDeck:All',''))
          tap=Path('forge-src/forge-ai/src/main/java/forge/ai/ability/TapAi.java'); s=tap.read_text(); needle='        final Player turn = phase.getPlayerTurn();\n\n'; assert needle in s
          lines=['        final Player turn = phase.getPlayerTurn();','', '        if ("EnergyTap".equals(sa.getParamOrDefault("AILogic", ""))) {','            if (!phase.is(PhaseType.MAIN2, ai)) return new AiAbilityDecision(0, AiPlayDecision.WaitForMain2);','            boolean hasFollowup = ai.getCardsIn(ZoneType.Hand).stream().anyMatch(c ->','                    "Wretched Gryff".equals(c.getName()) || "Drownyard Lurker".equals(c.getName()) || "It of the Horrid Swarm".equals(c.getName()));','            if (!hasFollowup) return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);','            CardCollection candidates = CardLists.getTargetableCards(ai.getCreaturesInPlay(), sa);','            candidates = CardLists.filter(candidates, CardPredicates.CAN_TAP);','            Card choice = ComputerUtilCard.getMostExpensivePermanentAI(candidates);','            if (choice == null || choice.getCMC() < 7) return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);','            sa.resetTargets(); sa.getTargets().add(choice);','            return new AiAbilityDecision(100, AiPlayDecision.WillPlay);','        }','']
          tap.write_text(s.replace(needle,'\n'.join(lines),1))
          rush=Path('forge-src/forge-gui/res/cardsfolder/r/rush_of_knowledge.txt'); r=rush.read_text(); rold='A:SP$ Draw | Defined$ You | NumCards$ X | SpellDescription$ Draw cards equal to the highest mana value among permanents you control.'; rnew='A:SP$ Draw | Defined$ You | NumCards$ X | AILogic$ FaceValueRush | SpellDescription$ Draw cards equal to the highest mana value among permanents you control.'; assert rold in r; rush.write_text(r.replace(rold,rnew))
          draw=Path('forge-src/forge-ai/src/main/java/forge/ai/ability/DrawAi.java'); d=draw.read_text(); dn='        boolean aboutToBeMyTurn = ph.getNextTurn().equals(ai) && ph.is(PhaseType.END_OF_TURN);\n\n'; assert dn in d
          dl=['        boolean aboutToBeMyTurn = ph.getNextTurn().equals(ai) && ph.is(PhaseType.END_OF_TURN);','','        if ("FaceValueRush".equals(sa.getParamOrDefault("AILogic", ""))) {','            int highest = ai.getCardsIn(ZoneType.Battlefield).stream().mapToInt(Card::getCMC).max().orElse(0);','            if (highest < 7) return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);','        }','']
          draw.write_text(d.replace(dn,'\n'.join(dl),1))
          PY
          git -C forge-src diff > forge-face-value-ai.patch
      - name: Build patched Forge
        run: |
          set -euxo pipefail
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"
      - name: Write frozen gauntlet decks
        run: |
          mkdir -p decks "$HOME/.forge/decks/constructed"
          cat > 'decks/Face Value v1.1.dck' <<'EOF'
          [metadata]
          Name=Face Value v1.1
          Deck Type=constructed
          [main]
          4 Llanowar Elves
          4 Nest Invader
          4 Eldrazi Repurposer
          1 Eyeless Watcher
          4 Wretched Gryff
          2 It of the Horrid Swarm
          2 Annoyed Altisaur
          1 Drownyard Lurker
          1 Nyxborn Hydra
          4 Malevolent Rumble
          4 Preordain
          2 Snap
          1 Lose Focus
          1 Tamiyo's Safekeeping
          2 Energy Tap
          1 Rush of Knowledge
          2 Growth Spasm
          9 Forest
          8 Island
          3 Tangled Islet
          EOF
          cat > 'decks/Ixidor29 Gruul Ramp 2026-09-16.dck' <<'EOF'
          [metadata]
          Name=Ixidor29 Gruul Ramp 2026-09-16
          Deck Type=constructed
          [main]
          3 Eldrazi Repurposer
          4 Writhing Chrysalis
          3 Avenging Hunter
          2 Generous Ent
          3 Annoyed Altisaur
          4 Boarding Party
          4 Arbor Elf
          2 Malevolent Rumble
          4 Thermokarst
          4 Mwonvuli Acid-Moss
          2 Structural Distortion
          1 Bonder's Ornament
          1 Colossal Dreadmask
          4 Utopia Sprawl
          2 Wild Growth
          14 Forest
          2 Mountain
          1 Wooded Ridgeline
          EOF
          cp decks/*.dck "$HOME/.forge/decks/constructed/"
          seq 1030001 1030020 > gruul-seeds.txt
          sha256sum gruul-seeds.txt decks/*.dck | tee gruul-inputs.sha256
      - name: Run fixed Gruul gauntlet
        run: |
          set -euo pipefail
          mkdir -p gruul-logs
          while read -r seed; do
            "$FORGE_LAUNCHER" sim -d 'Face Value v1.1.dck' 'Ixidor29 Gruul Ramp 2026-09-16.dck' -n 1 -s "$seed" -c 60 > "gruul-logs/$seed.log" 2>&1
          done < gruul-seeds.txt
      - name: Audit Gruul gauntlet
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          rec=[]
          for p in sorted(Path('gruul-logs').glob('*.log')):
            text=p.read_text(errors='replace')
            if re.search(r'Ai\(1\)-Face Value v1.1 has won!',text): winner='face'
            elif re.search(r'Ai\(2\)-Ixidor29 Gruul Ramp 2026-09-16 has won!',text): winner='gruul'
            elif 'ended in a Draw' in text: winner='draw'
            else: winner='unknown'
            rec.append({'seed':int(p.stem),'winner':winner,'energy_tap_casts':len(re.findall(r'cast Energy Tap targeting',text)),'rush_casts':len(re.findall(r'cast Rush of Knowledge',text)),'growth_spasm_casts':len(re.findall(r'cast Growth Spasm',text)),'gryff_emerge':len(re.findall(r'Wretched Gryff - Creature 3 / 4 \(Emerge\)',text)),'thermokarst_casts':len(re.findall(r'cast Thermokarst',text)),'acid_moss_casts':len(re.findall(r'cast Mwonvuli Acid-Moss',text)),'chrysalis_casts':len(re.findall(r'cast Writhing Chrysalis',text)),'hunter_casts':len(re.findall(r'cast Avenging Hunter',text)),'boarding_party_casts':len(re.findall(r'cast Boarding Party',text)),'altisaur_casts':len(re.findall(r'cast Annoyed Altisaur',text)),'engine_exception':bool(re.search(r'Exception|StackOverflowError|Stopping slow match as draw',text))})
          n=len(rec); out={'games':n,'wins':sum(x['winner']=='face' for x in rec),'losses':sum(x['winner']=='gruul' for x in rec),'draws':sum(x['winner']=='draw' for x in rec),'unknown':sum(x['winner']=='unknown' for x in rec),'energy_tap_casts':sum(x['energy_tap_casts'] for x in rec),'rush_casts':sum(x['rush_casts'] for x in rec),'growth_spasm_casts':sum(x['growth_spasm_casts'] for x in rec),'gryff_emerge':sum(x['gryff_emerge'] for x in rec),'thermokarst_casts':sum(x['thermokarst_casts'] for x in rec),'acid_moss_casts':sum(x['acid_moss_casts'] for x in rec),'chrysalis_casts':sum(x['chrysalis_casts'] for x in rec),'hunter_casts':sum(x['hunter_casts'] for x in rec),'boarding_party_casts':sum(x['boarding_party_casts'] for x in rec),'altisaur_casts':sum(x['altisaur_casts'] for x in rec),'engine_exceptions':sum(x['engine_exception'] for x in rec),'records':rec}
          Path('gruul-gauntlet-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)); print(json.dumps({k:v for k,v in out.items() if k!='records'},indent=2,sort_keys=True))
          assert n==20 and out['unknown']==0 and out['engine_exceptions']==0,out
          PY
      - name: Preserve Gruul artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-forge-gauntlet-gruul-1
          path: |
            gruul-gauntlet-summary.json
            gruul-seeds.txt
            gruul-inputs.sha256
            gruul-logs/*.log
            forge-face-value-ai.patch
            forge-source-commit.txt
            decks/*.dck
          if-no-files-found: warn

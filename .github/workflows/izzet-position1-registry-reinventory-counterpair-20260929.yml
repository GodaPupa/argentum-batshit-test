name: Izzet Position-1 changed-runtime registry reinventory after counter pair adoption
on:
  push:
    branches: ["izzet/position1-registry-reinventory-counterpair-20260929"]
    paths: [".github/workflows/izzet-position1-registry-reinventory-counterpair-20260929.yml"]
permissions: {contents: read}
jobs:
  fifty-five-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact post-adoption runtime diagnostic and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/izzet-position1-registry-reinventory
          test "$(git rev-parse HEAD^)" = "e3e27b6a68a3fdaa1fd3ba9c52a0891f2a84f496"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/izzet/IzzetPosition1RegistryInventoryTest.kt)" = "197a99e6c17885bb70511916893d3a33de217feb"
          test "$(git hash-object experiments/izzet-science/POSITION1_REGISTRY_REINVENTORY_BUDGET_20260928.json)" = "93573c6e365aba4af1b9dfa094adb88553a08dbc"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/all/cards/ArcaneDenial.kt)" = "b80ac4364d27398cffde16e5f6d6a41eb0792ea9"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/hml/cards/MemoryLapse.kt)" = "e07d873bfccc9634cc0121fe988003e5af1e3fbc"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/izzet/IzzetPosition1RegistryInventoryTest.kt
            git hash-object experiments/izzet-science/POSITION1_REGISTRY_REINVENTORY_BUDGET_20260928.json
            git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/all/cards/ArcaneDenial.kt
            git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/hml/cards/MemoryLapse.kt
            git hash-object .github/workflows/izzet-position1-registry-reinventory-counterpair-20260929.yml
            git status --porcelain
          } > build/reports/izzet-position1-registry-reinventory/source.txt
      - name: Execute exact 55 registry identities against changed runtime
        shell: bash
        run: |
          set -o pipefail
          just test-class IzzetPosition1RegistryInventoryTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-position1-registry-reinventory/test.log
      - name: Retain exact XML
        if: always()
        run: cp gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml build/reports/izzet-position1-registry-reinventory/ 2>/dev/null || true
      - name: Preserve original diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-position1-registry-reinventory-counterpair-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-position1-registry-reinventory/
          if-no-files-found: error
          retention-days: 90

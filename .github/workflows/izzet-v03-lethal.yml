name: Izzet v0.6 Pair Acquisition

on:
  workflow_dispatch:

jobs:
  pair-acquisition-v06:
    if: github.event_name != 'pull_request' || github.head_ref == 'mayhem/izzet-science'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mayhem/izzet-science
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen v0.5 control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p izzet-science/artifacts
          python izzet-science/sim/mana_harness.py \
            --deck izzet-science/v0.5-control.md \
            --samples 100000 \
            --seed 0x1A22E7001 \
            | tee izzet-science/artifacts/v05-control.txt
          test -s izzet-science/artifacts/v05-control.txt
      - name: Run v0.6-A Pieces of the Puzzle challenger
        shell: bash
        run: |
          set -euo pipefail
          python izzet-science/sim/mana_harness.py \
            --deck izzet-science/challengers/v06A-pieces-of-the-puzzle.md \
            --samples 100000 \
            --seed 0x1A22E7001 \
            | tee izzet-science/artifacts/v06A-pieces-of-the-puzzle.txt
          test -s izzet-science/artifacts/v06A-pieces-of-the-puzzle.txt
      - name: Preserve paired acquisition output
        uses: actions/upload-artifact@v4
        with:
          name: izzet-v05-v06A-paired-acquisition
          path: |
            izzet-science/artifacts/v05-control.txt
            izzet-science/artifacts/v06A-pieces-of-the-puzzle.txt
          if-no-files-found: error

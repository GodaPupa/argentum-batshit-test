name: Izzet v0.3 Lethal Validation

on:
  push:
    branches: [mayhem/izzet-science]
    paths:
      - 'izzet-science/sim/**'
      - 'izzet-science/v0.3-control.md'
      - 'izzet-science/challengers/v04A-strategic-planning.md'
      - '.github/workflows/izzet-v03-lethal.yml'
  pull_request:
    branches: [main]
    paths:
      - 'izzet-science/sim/**'
      - 'izzet-science/v0.3-control.md'
      - 'izzet-science/challengers/v04A-strategic-planning.md'
      - '.github/workflows/izzet-v03-lethal.yml'
  workflow_dispatch:

jobs:
  lethal-v03:
    if: github.event_name != 'pull_request' || github.head_ref == 'mayhem/izzet-science'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mayhem/izzet-science
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v0.3 lethal sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p izzet-science/artifacts
          python izzet-science/sim/mana_harness.py             --deck izzet-science/v0.3-control.md             --samples 100000             --seed 0x1A22E7001             | tee izzet-science/artifacts/v03-lethal.txt
          test -s izzet-science/artifacts/v03-lethal.txt
      - name: Run v0.4-A Strategic Planning sample
        shell: bash
        run: |
          set -euo pipefail
          python izzet-science/sim/mana_harness.py             --deck izzet-science/challengers/v04A-strategic-planning.md             --samples 100000             --seed 0x1A22E7001             | tee izzet-science/artifacts/v04A-strategic-planning.txt
          test -s izzet-science/artifacts/v04A-strategic-planning.txt
      - name: Preserve lethal output
        uses: actions/upload-artifact@v4
        with:
          name: izzet-v03-v04A-paired-clock
          path: |
            izzet-science/artifacts/v03-lethal.txt
            izzet-science/artifacts/v04A-strategic-planning.txt
          if-no-files-found: error

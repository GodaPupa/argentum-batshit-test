name: Izzet Position-1 Engine Batch AI

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-ai.yml"

permissions:
  contents: read

jobs:
  qualify-batch-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch AI gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'V07_DECK_AUDIT_NO_CHANGE' izzet-science/v07-deck-level-audit-no-change.md
          grep -Fq 'V09_CARD_CONTROL_ARCHITECTURE_AUDIT_KEEP_V07' izzet-science/v09-card-control-architecture-audit.md
          grep -Fq 'Expected post-implementation unresolved count is exactly **18**' izzet-science/v09-position1-engine-batch-ai-gate.md
          grep -Fq '36067996431' izzet-science/v09-position1-engine-batch-ai-gate.md
          grep -Fq '0b07bc7fada66c24e57018f34ca2693a348a014f' izzet-science/v09-position1-engine-batch-ai-gate.md

      - name: Requalify canonical card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --stacktrace

      - name: Run Alabaster Host Intercessor semantics
        run: scripts/test-class AlabasterHostIntercessorBatchAIScenarioTest --info --stacktrace

      - name: Run exact real-engine coverage regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-ai.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=18' /tmp/batch-ai.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Alabaster Host Intercessor' /tmp/batch-ai.txt
          ! grep -Fq 'unresolved Izzet card:' /tmp/batch-ai.txt

      - name: Assert official experiment remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt

      - name: Emit Batch AI manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izzet-batch-ai
          cp /tmp/batch-ai.txt /tmp/izzet-batch-ai/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-ai-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "frozen_control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "implemented=Alabaster Host Intercessor;linked temporary exile+Plainscycling"
            echo "snapshot_run=36067996431"
            echo "snapshot_commit=0b07bc7fada66c24e57018f34ca2693a348a014f"
            echo "unresolved_before=19"
            echo "unresolved_after=18"
            echo "unresolved_izzet_after=0"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/2023/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/mom/cards/AlabasterHostIntercessor.kt
            sha256sum mtg-sets/2023/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/AlabasterHostIntercessorBatchAIScenarioTest.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/v09-position1-engine-batch-ai-gate.md
            sha256sum mtg-sets/src/test/resources/snapshots/cards/MOM.json
            sha256sum /tmp/izzet-batch-ai/test-output.txt
          } > /tmp/izzet-batch-ai/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-ai
          path: /tmp/izzet-batch-ai
          if-no-files-found: error

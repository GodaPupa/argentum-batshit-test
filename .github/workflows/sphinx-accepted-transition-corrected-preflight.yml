name: Sphinx corrected accepted-transition static preflight
on:
  push:
    branches: ["sphinx/accepted-transition-journal-20260928"]
    paths:
      - ".github/workflows/sphinx-accepted-transition-corrected-preflight.yml"
permissions:
  contents: read
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind changed projection repair and exact fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/sphinx-transition-corrected-preflight
          test "$(git rev-parse HEAD^)" = "bd78bf83689b063e2bbce1bf8cdc98803caa5e0a"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt)" = "cba32ed847cef96f2f7039e8902591364bb809bb"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournalTest.kt)" = "29c0060b374cb7697a5250c87c5ea41ad3abd7a1"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournalTest.kt; git hash-object .github/workflows/sphinx-accepted-transition-corrected-preflight.yml; git status --porcelain; } > build/reports/sphinx-transition-corrected-preflight/source.txt
      - name: Compile changed journal and fixture without behavior
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:compileTestKotlin --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/sphinx-transition-corrected-preflight/compile.log
      - name: Retain original static evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-transition-corrected-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-transition-corrected-preflight/
          if-no-files-found: error
          retention-days: 90

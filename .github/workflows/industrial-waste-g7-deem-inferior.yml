name: Industrial Waste — Deem Inferior Capability

on:
  push:
    branches: [industrial-waste/lab]
    paths:
      - .github/workflows/industrial-waste-g7-deem-inferior.yml
      - mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/CostStaticAbilities.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/CostCalculator.kt
      - mtg-sets/2024/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/mh3/cards/DeemInferior.kt
      - mtg-sets/2024/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/DeemInferiorScenarioTest.kt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deem-inferior-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v6
      - name: Run Deem Inferior scenarios
        run: ./gradlew :mtg-sets:2024:tests:test --tests '*DeemInferior*' --no-daemon

# validate Deem Inferior for Gate 7

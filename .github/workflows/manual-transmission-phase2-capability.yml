name: Manual Transmission Phase 2 Capability Audit

on:
  pull_request:
    paths:
      - 'experiments/manual-transmission-phase2/**'
      - 'rules-engine/src/main/kotlin/com/wingedsheep/engine/core/GameInitializer.kt'
      - 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/spell/CastSpellHandler.kt'
      - 'mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualTransmissionLandSpellGuardScenarioTest.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/core/CommanderSetupTest.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/CommanderPodCapabilityTest.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/multiplayer/CommanderPodTest.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/multiplayer/MultiplayerSmokeTest.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/multiplayer/MultiplayerMulliganTest.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/multiplayer/LeaveTheGameTest.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/mana/CommanderTaxTest.kt'
      - 'gym/src/test/kotlin/com/wingedsheep/gym/ManualTransmissionPhaseTwoRegistryAuditTest.kt'
      - 'mtg-sets/**/cards/AnimarSoulOfElements.kt'
      - 'mtg-sets/**/cards/AncestralStatue.kt'
      - 'mtg-sets/**/cards/ParadiseDruid.kt'
      - 'mtg-sets/**/cards/Pongify.kt'
      - 'mtg-sets/**/cards/RapidHybridization.kt'
      - 'mtg-sets/**/cards/CloudOfFaeries.kt'
      - 'mtg-sets/**/cards/PeregrineDrake.kt'
      - 'mtg-sets/**/scenarios/AnimarSoulOfElementsScenarioTest.kt'
      - 'mtg-sets/**/scenarios/AncestralStatueScenarioTest.kt'
      - 'mtg-sets/**/scenarios/ParadiseDruidScenarioTest.kt'
      - 'mtg-sets/**/scenarios/PongifyScenarioTest.kt'
      - 'mtg-sets/**/scenarios/RapidHybridizationScenarioTest.kt'
      - 'mtg-sets/**/cards/WorldBreaker.kt'
      - 'mtg-sets/**/scenarios/WorldBreakerScenarioTest.kt'
      - 'mtg-sets/**/cards/RealityShift.kt'
      - 'mtg-sets/**/scenarios/RealityShiftScenarioTest.kt'
      - 'mtg-sets/**/scenarios/CloudOfFaeriesScenarioTest.kt'
      - 'mtg-sets/**/scenarios/PeregrineDrakeScenarioTest.kt'
      - 'mtg-sets/**/cards/NestInvader.kt'
      - 'mtg-sets/**/scenarios/NestInvaderScenarioTest.kt'
      - 'mtg-sets/**/cards/EmrakulsHatcher.kt'
      - 'mtg-sets/**/scenarios/EmrakulsHatcherScenarioTest.kt'
      - 'mtg-sets/**/cards/EyelessWatcher.kt'
      - 'mtg-sets/**/scenarios/EyelessWatcherScenarioTest.kt'
      - 'mtg-sets/**/cards/EldraziRepurposer.kt'
      - 'mtg-sets/**/scenarios/EldraziRepurposerScenarioTest.kt'
      - 'mtg-sets/**/cards/WrithingChrysalis.kt'
      - 'mtg-sets/**/scenarios/WrithingChrysalisScenarioTest.kt'
      - 'mtg-sets/**/cards/WalkingBallista.kt'
      - 'mtg-sets/**/scenarios/WalkingBallistaScenarioTest.kt'
      - 'mtg-sets/**/cards/ArborElf.kt'
      - 'mtg-sets/**/scenarios/ArborElfScenarioTest.kt'
      - 'mtg-sets/**/cards/WildGrowth.kt'
      - 'mtg-sets/**/scenarios/WildGrowthScenarioTest.kt'
      - 'mtg-sets/**/cards/UtopiaSprawl.kt'
      - 'mtg-sets/**/scenarios/UtopiaSprawlScenarioTest.kt'
      - 'mtg-sets/**/cards/CoilingOracle.kt'
      - 'mtg-sets/**/scenarios/CoilingOracleScenarioTest.kt'
      - 'mtg-sets/**/cards/HopeEnderCoatl.kt'
      - 'mtg-sets/**/scenarios/HopeEnderCoatlScenarioTest.kt'
      - 'mtg-sets/**/cards/RejuvenatingSprings.kt'
      - 'mtg-sets/**/scenarios/RejuvenatingSpringsScenarioTest.kt'
      - 'mtg-sets/**/cards/TrainingCenter.kt'
      - 'mtg-sets/**/scenarios/TrainingCenterScenarioTest.kt'
      - 'mtg-sets/**/cards/SpireGarden.kt'
      - 'mtg-sets/**/scenarios/SpireGardenScenarioTest.kt'
      - 'mtg-sets/**/definitions/bbd/BattlebondSet.kt'
      - 'mtg-sets/**/scenarios/OpponentCountLandScenarioSpec.kt'
      - 'rules-engine/src/testFixtures/kotlin/com/wingedsheep/engine/support/SerializationTestSupport.kt'
      - 'mtg-sets/src/test/resources/snapshots/cards/**'
      - '.github/workflows/manual-transmission-phase2-capability.yml'

permissions:
  contents: read

jobs:
  source-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: e7d37e2ea0f18dfa8d6b0fff68ef816b59555d2d
          path: .phase1-source
          persist-credentials: false
      - name: Read-only provenance and source inventory
        run: python3 experiments/manual-transmission-phase2/bootstrap_audit.py --phase1 .phase1-source --out build/reports/manual-transmission-phase2/source --bundle
      - name: Validate prospective telemetry contract without gameplay
        run: python3 -m unittest discover -s experiments/manual-transmission-phase2 -p test_metrics_contract.py -v
      - name: Verify and archive the effective rules source without qualifying engine semantics
        run: |
          python3 -m unittest discover -s experiments/manual-transmission-phase2 -p test_rules_archive.py
          python3 experiments/manual-transmission-phase2/verify_rules_archive.py --as-of 2026-09-25 --out build/reports/manual-transmission-phase2/source/rules
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manual-transmission-phase2-source-audit
          path: build/reports/manual-transmission-phase2/source/
          if-no-files-found: error
          retention-days: 90
  engine-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: e7d37e2ea0f18dfa8d6b0fff68ef816b59555d2d
          path: .phase1-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare exact registry requests without seeds
        run: python3 experiments/manual-transmission-phase2/bootstrap_audit.py --phase1 .phase1-source --out build/reports/manual-transmission-phase2/source
      - name: Bind the existing World Breaker source before scenario execution
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, pathlib
          gate = json.loads(pathlib.Path('experiments/manual-transmission-phase2/world-breaker-routing-correction-r1.json').read_text())
          for path, digest in gate['source_sha256'].items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == digest, path
          PYTHON
      - name: Exact frozen hardware card scenarios
        run: |
          scripts/gradle-locked :mtg-sets:2003-2007:tests:test --rerun --tests "*CoilingOracleScenarioTest" --tests "*KurgadonTest" --tests "*UtopiaSprawlScenarioTest" --tests "*PongifyScenarioTest" \
            :mtg-sets:1993-1999:tests:test --rerun --tests "*WildGrowthScenarioTest" --tests "*CloudOfFaeriesScenarioTest" --tests "*PeregrineDrakeScenarioTest" \
            :mtg-sets:2008-2016:tests:test --rerun --tests "*ManualTransmissionLandSpellGuardScenarioTest" --tests "*ArborElfScenarioTest" --tests "*AnimarSoulOfElementsScenarioTest" --tests "*AncestralStatueScenarioTest" --tests "*RapidHybridizationScenarioTest" --tests "*WorldBreakerScenarioTest" --tests "*RealityShiftScenarioTest" --tests "*NestInvaderScenarioTest" --tests "*EmrakulsHatcherScenarioTest" --tests "*EyelessWatcherScenarioTest" \
            :mtg-sets:2017-2022:tests:test --rerun --tests "*ParadiseDruidScenarioTest" --tests "*RejuvenatingSpringsScenarioTest" --tests "*TrainingCenterScenarioTest" --tests "*SpireGardenScenarioTest" --tests "*WalkingBallistaScenarioTest" \
            :mtg-sets:2024:tests:test --rerun --tests "*HopeEnderCoatlScenarioTest" --tests "*EldraziRepurposerScenarioTest" --tests "*WrithingChrysalisScenarioTest" \
            :mtg-sets:2025:tests:test --rerun --tests "*TownLandSpellAdventureScenarioTest" --info --stacktrace
      - name: Preserve per-card scenario evidence
        if: always()
        run: |
          mkdir -p build/reports/manual-transmission-phase2/card-scenarios
          for era in 1993-1999 2003-2007 2008-2016 2017-2022 2024 2025; do
            if [ -d "mtg-sets/$era/tests/build/test-results/test" ]; then
              cp -R "mtg-sets/$era/tests/build/test-results/test" "build/reports/manual-transmission-phase2/card-scenarios/$era"
            fi
          done
      - name: Require the exact World Breaker cases in fresh raw XML
        if: always()
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, pathlib, xml.etree.ElementTree as ET
          gate = json.loads(pathlib.Path('experiments/manual-transmission-phase2/world-breaker-routing-correction-r1.json').read_text())
          path = pathlib.Path(gate['required_xml'])
          out = pathlib.Path('build/reports/manual-transmission-phase2/world-breaker-routing-audit.json')
          audit = {'scope': 'EXCLUDED_EXISTING_CARD_FIXTURE_ROUTING_ONLY',
              'official_initializations': 0, 'execution_allowed': False,
              'required_class': gate['required_class'], 'required_cases': gate['required_cases'],
              'xml_exists': path.is_file(), 'actual_cases': [], 'failures': None,
              'errors': None, 'skips': None}
          if path.is_file():
              raw = path.read_bytes()
              suite = ET.fromstring(raw)
              cases = suite.findall('testcase')
              audit.update(xml_sha256=hashlib.sha256(raw).hexdigest(),
                  actual_class=suite.attrib['name'], actual_cases=[c.attrib['name'] for c in cases],
                  failures=sum(c.find('failure') is not None for c in cases),
                  errors=sum(c.find('error') is not None for c in cases),
                  skips=sum(c.find('skipped') is not None for c in cases))
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(audit, indent=2)+'\n')
          assert audit['xml_exists'], 'Required World Breaker test class did not execute'
          assert audit['actual_class'] == gate['required_class']
          assert len(audit['actual_cases']) == len(set(audit['actual_cases'])) == 2
          assert set(audit['actual_cases']) == set(gate['required_cases'])
          assert audit['failures'] == audit['errors'] == audit['skips'] == 0
          assert int(suite.attrib['tests']) == 2
          assert all(int(suite.attrib[k]) == 0 for k in ('failures', 'errors', 'skipped'))
          PYTHON
      - name: Generic commander and multiplayer capability fixtures
        # One invocation preserves every requested class without later invocations overwriting XML.
        run: |
          scripts/gradle-locked :rules-engine:test \
            --tests "*CommanderPodCapabilityTest" \
            --tests "*CommanderSetupTest" \
            --tests "*CommanderTaxTest" \
            --tests "*MultiplayerSmokeTest" \
            --tests "*MultiplayerMulliganTest" \
            --tests "*CommanderPodTest" \
            --tests "*LeaveTheGameTest" \
            --info --stacktrace
      - name: Actual catalog inventory without actual-deck games
        env:
          MT_P2_AUDIT_INPUT: ${{ github.workspace }}/build/reports/manual-transmission-phase2/source/registry-requests.json
          MT_P2_AUDIT_OUTPUT: ${{ github.workspace }}/build/reports/manual-transmission-phase2/registry
        run: scripts/test-class ManualTransmissionPhaseTwoRegistryAuditTest --info --stacktrace
      - name: Validate snapshots and preserve reviewable actual output
        if: success() || failure()
        # The historical provenance checkout contains the same test class; select only this Gradle module.
        run: scripts/gradle-locked :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --info --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manual-transmission-phase2-engine-audit
          path: |
            build/reports/manual-transmission-phase2/
            rules-engine/build/test-results/test/
            gym/build/test-results/test/
            mtg-sets/build/snapshots-actual/
            mtg-sets/build/test-results/test/
          if-no-files-found: error
          retention-days: 90

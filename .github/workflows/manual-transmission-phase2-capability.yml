name: Manual Transmission Phase 2 Capability Audit

on:
  pull_request:
    paths:
      - 'experiments/manual-transmission-phase2/**'
      - 'rules-engine/src/main/kotlin/com/wingedsheep/engine/core/GameInitializer.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/core/CommanderSetupTest.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/CommanderPodCapabilityTest.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/multiplayer/CommanderPodTest.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/multiplayer/MultiplayerSmokeTest.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/multiplayer/MultiplayerMulliganTest.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/multiplayer/LeaveTheGameTest.kt'
      - 'rules-engine/src/test/kotlin/com/wingedsheep/engine/mana/CommanderTaxTest.kt'
      - 'gym/src/test/kotlin/com/wingedsheep/gym/ManualTransmissionPhaseTwoRegistryAuditTest.kt'
      - 'mtg-sets/**/cards/AnimarSoulOfElements.kt'
      - 'mtg-sets/**/cards/AncestralStatue.kt'
      - 'mtg-sets/**/cards/ParadiseDruid.kt'
      - 'mtg-sets/**/cards/Pongify.kt'
      - 'mtg-sets/**/cards/RapidHybridization.kt'
      - 'mtg-sets/**/cards/CloudOfFaeries.kt'
      - 'mtg-sets/**/cards/PeregrineDrake.kt'
      - 'mtg-sets/**/scenarios/AnimarSoulOfElementsScenarioTest.kt'
      - 'mtg-sets/**/scenarios/AncestralStatueScenarioTest.kt'
      - 'mtg-sets/**/scenarios/ParadiseDruidScenarioTest.kt'
      - 'mtg-sets/**/scenarios/PongifyScenarioTest.kt'
      - 'mtg-sets/**/scenarios/RapidHybridizationScenarioTest.kt'
      - 'mtg-sets/**/scenarios/CloudOfFaeriesScenarioTest.kt'
      - 'mtg-sets/**/scenarios/PeregrineDrakeScenarioTest.kt'
      - 'mtg-sets/**/cards/NestInvader.kt'
      - 'mtg-sets/**/scenarios/NestInvaderScenarioTest.kt'
      - 'mtg-sets/**/cards/EmrakulsHatcher.kt'
      - 'mtg-sets/**/scenarios/EmrakulsHatcherScenarioTest.kt'
      - 'mtg-sets/**/cards/EyelessWatcher.kt'
      - 'mtg-sets/**/scenarios/EyelessWatcherScenarioTest.kt'
      - 'mtg-sets/**/cards/EldraziRepurposer.kt'
      - 'mtg-sets/**/scenarios/EldraziRepurposerScenarioTest.kt'
      - 'mtg-sets/**/cards/ArborElf.kt'
      - 'mtg-sets/**/scenarios/ArborElfScenarioTest.kt'
      - 'mtg-sets/**/cards/WildGrowth.kt'
      - 'mtg-sets/**/scenarios/WildGrowthScenarioTest.kt'
      - 'mtg-sets/**/cards/UtopiaSprawl.kt'
      - 'mtg-sets/**/scenarios/UtopiaSprawlScenarioTest.kt'
      - 'mtg-sets/src/test/resources/snapshots/cards/**'
      - '.github/workflows/manual-transmission-phase2-capability.yml'

permissions:
  contents: read

jobs:
  source-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: e7d37e2ea0f18dfa8d6b0fff68ef816b59555d2d
          path: .phase1-source
          persist-credentials: false
      - name: Read-only provenance and source inventory
        run: python3 experiments/manual-transmission-phase2/bootstrap_audit.py --phase1 .phase1-source --out build/reports/manual-transmission-phase2/source --bundle
      - name: Validate prospective telemetry contract without gameplay
        run: python3 -m unittest discover -s experiments/manual-transmission-phase2 -p test_metrics_contract.py -v
      - name: Verify and archive the effective rules source without qualifying engine semantics
        run: |
          python3 -m unittest discover -s experiments/manual-transmission-phase2 -p test_rules_archive.py
          python3 experiments/manual-transmission-phase2/verify_rules_archive.py --as-of 2026-09-25 --out build/reports/manual-transmission-phase2/source/rules
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manual-transmission-phase2-source-audit
          path: build/reports/manual-transmission-phase2/source/
          if-no-files-found: error
          retention-days: 90
  engine-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: e7d37e2ea0f18dfa8d6b0fff68ef816b59555d2d
          path: .phase1-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare exact registry requests without seeds
        run: python3 experiments/manual-transmission-phase2/bootstrap_audit.py --phase1 .phase1-source --out build/reports/manual-transmission-phase2/source
      - name: Exact frozen hardware card scenarios
        run: |
          scripts/gradle-locked :mtg-sets:2003-2007:tests:test --tests "*UtopiaSprawlScenarioTest" --tests "*PongifyScenarioTest" \
            :mtg-sets:1993-1999:tests:test --tests "*WildGrowthScenarioTest" --tests "*CloudOfFaeriesScenarioTest" --tests "*PeregrineDrakeScenarioTest" \
            :mtg-sets:2008-2016:tests:test --tests "*ArborElfScenarioTest" --tests "*AnimarSoulOfElementsScenarioTest" --tests "*AncestralStatueScenarioTest" --tests "*RapidHybridizationScenarioTest" --tests "*NestInvaderScenarioTest" --tests "*EmrakulsHatcherScenarioTest" --tests "*EyelessWatcherScenarioTest" \
            :mtg-sets:2017-2022:tests:test --tests "*ParadiseDruidScenarioTest" \
            :mtg-sets:2024:tests:test --tests "*EldraziRepurposerScenarioTest" --info --stacktrace
      - name: Preserve per-card scenario evidence
        if: always()
        run: |
          mkdir -p build/reports/manual-transmission-phase2/card-scenarios
          for era in 1993-1999 2003-2007 2008-2016 2017-2022 2024; do
            if [ -d "mtg-sets/$era/tests/build/test-results/test" ]; then
              cp -R "mtg-sets/$era/tests/build/test-results/test" "build/reports/manual-transmission-phase2/card-scenarios/$era"
            fi
          done
      - name: Generic commander and multiplayer capability fixtures
        # One invocation preserves every requested class without later invocations overwriting XML.
        run: |
          scripts/gradle-locked :rules-engine:test \
            --tests "*CommanderPodCapabilityTest" \
            --tests "*CommanderSetupTest" \
            --tests "*CommanderTaxTest" \
            --tests "*MultiplayerSmokeTest" \
            --tests "*MultiplayerMulliganTest" \
            --tests "*CommanderPodTest" \
            --tests "*LeaveTheGameTest" \
            --info --stacktrace
      - name: Actual catalog inventory without actual-deck games
        env:
          MT_P2_AUDIT_INPUT: ${{ github.workspace }}/build/reports/manual-transmission-phase2/source/registry-requests.json
          MT_P2_AUDIT_OUTPUT: ${{ github.workspace }}/build/reports/manual-transmission-phase2/registry
        run: scripts/test-class ManualTransmissionPhaseTwoRegistryAuditTest --info --stacktrace
      - name: Validate snapshots and preserve reviewable actual output
        if: success() || failure()
        # The historical provenance checkout contains the same test class; select only this Gradle module.
        run: scripts/gradle-locked :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --info --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manual-transmission-phase2-engine-audit
          path: |
            build/reports/manual-transmission-phase2/
            rules-engine/build/test-results/test/
            gym/build/test-results/test/
            mtg-sets/build/snapshots-actual/
            mtg-sets/build/test-results/test/
          if-no-files-found: error
          retention-days: 90

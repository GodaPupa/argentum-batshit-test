name: Sphinx Stage E Excluded Opening Receiving

on:
  push:
    branches: [lab/sphinx-opening-qualification-20260927]

permissions:
  contents: read

concurrency:
  group: sphinx-opening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b

      - name: Bind exact source and excluded opening bank
        run: python3 sphinx-approach/collect-stage-e-opening.py bind

      - name: Run 32 prospective opening plus 16 preserved initialized checks
        shell: bash
        run: |
          set -uo pipefail
          set +e
          just test-class SphinxStageEOpeningActorTest --tests '*SphinxStageEInitializedSeatTest' --rerun --max-workers=1 -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g --info --stacktrace 2>&1 | tee build/reports/sphinx-stage-e-opening/tests.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > build/reports/sphinx-stage-e-opening/test-exit-code.txt
          exit "$result"

      - name: Audit raw XML and source after attempt
        if: always()
        run: python3 sphinx-approach/collect-stage-e-opening.py collect

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sphinx-stage-e-opening-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/reports/sphinx-stage-e-opening
            gym/build/test-results/test/TEST-*.SphinxStageEOpeningActorTest.xml
            gym/build/test-results/test/TEST-*.SphinxStageEInitializedSeatTest.xml

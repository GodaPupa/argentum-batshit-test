name: Manual R16 original-state Animar development valuation
on:
  push:
    branches: [gameplay/manual-r16-animar-valuation-20261019]
    paths:
      - 'ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualR16AnimarValuationTest.kt'
      - '.github/workflows/manual-r16-animar-valuation-20261019.yml'
permissions:
  contents: read
  actions: read
jobs:
  valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R16_R15_ARCHIVE: ${{ github.workspace }}/r16-input/r15-original.zip
      MANUAL_R16_OUTPUT: ${{ github.workspace }}/r16-output
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify frozen policy inputs and exact accepted R15 archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p r16-input r16-output
          git rev-parse HEAD > r16-output/source-sha.txt
          git rev-parse HEAD^{tree} > r16-output/tree-sha.txt
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/modules/ManualAnimarDevelopmentAdvisorModule.kt)" = "b995dfc8d27dbc71da7785f7f708b0b0a442c3e8"
          test "$(git rev-parse HEAD:ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualR15ExactDecisionReplayTest.kt)" = "9cf41772c42505ebc4fb6493bc8d40c665dedf08"
          gh api /repos/GodaPupa/argentum-batshit-test/actions/artifacts/12239496615/zip > r16-input/r15-original.zip
          printf '%s  %s\n' '251dc4cd30d955bbee3fef6172ca285664df78923859efa258299e5cd3fe7a5f' r16-input/r15-original.zip | sha256sum -c -
          printf '%s\n' 'No new Commander games: exactly three historical state-dependent advisor evaluations' > r16-output/scope.txt
          chmod +x gradlew scripts/gradle-locked
      - name: Check original advisor credit and immediate hand-creature opportunities
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:test --tests '*ManualR16AnimarValuationTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace 2>&1 | tee r16-output/validation.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('r16-output/r16-valuation.json')
          s=json.loads(p.read_text())
          assert [x['actionIndex'] for x in s] == [1336,1497,1998]
          for x in s:
            assert x['handCreatureCount'] == 0
            assert x['sameTurnCreatureFollowupsAfterAnimar'] == 0
            assert x['originalAdvisorWouldAddDevelopmentCredit'] is False
            assert x['advisorOverrideScore'] is None
            assert x['rawCastEngineAccepted'] and x['rawPassEngineAccepted']
            assert abs(x['originalPassScoreAdvantage']-0.465)<1e-7
          summary=json.loads(Path('r16-output/r16-summary.json').read_text())
          assert summary['status']=='EXACT_SAME_TURN_ADVISOR_VALIDATED'
          assert summary['defectsProven']==0
          assert summary['noNewFullCommanderGames'] is True
          print('R16_ORIGINAL_ADVISOR_PASS all three checkpoints; no immediate creature follow-up')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-r16-animar-valuation-${{ github.run_id }}
          retention-days: 30
          path: |
            r16-output/
            ai/build/test-results/test/

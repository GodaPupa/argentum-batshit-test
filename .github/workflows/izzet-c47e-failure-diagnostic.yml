name: Izzet c47e Existing Failure Diagnostics

on:
  push:
    branches: [mayhem/izzet-c47e-diagnostic-20260926]
    paths:
      - '.github/workflows/izzet-c47e-failure-diagnostic.yml'
      - 'izzet-science/diagnostics/c47e/**'

permissions:
  contents: read

concurrency:
  group: izzet-c47e-failure-diagnostic-20260926
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: accepted-base
            source: 50eca5fb955013d70ea26c3c6a09efabef4bcff4
          - label: candidate
            source: c47e9dbafc1fd582f81be1db04e9f35a09f067b5
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source }}
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Record environment and available resources
        run: |
          df -h .
          df -i .
          java -version
          just --version
      - name: Preserve original tests and exact baseline hash input without changing any assertion
        run: |
          python3 control/izzet-science/diagnostics/c47e/run.py \
            --source-root source \
            --scope control/izzet-science/diagnostics/c47e/scope.json \
            --case '${{ matrix.label }}' \
            --control-source '${{ github.sha }}' \
            --output 'evidence-${{ matrix.label }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: izzet-c47e-diagnostic-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 90

name: Izzet Benevolent Blessing Pre-authoring Probes

on:
  push:
    branches: [mayhem/izzet-benevolent-qualification]
    paths: [.github/workflows/izzet-benevolent-preflight.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=1 -Dorg.gradle.project.kotlinCompileParallelism=1 -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind unchanged frozen inputs and prove the card is not authored
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          root = pathlib.Path('.')
          output = root / 'build/reports/izzet-benevolent-preflight'
          output.mkdir(parents=True, exist_ok=True)
          source = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source == os.environ['GITHUB_SHA']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          subprocess.run(['git','merge-base','--is-ancestor','50eca5fb955013d70ea26c3c6a09efabef4bcff4','HEAD'],check=True)
          files = subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD'],text=True).splitlines()
          assert not any(p.endswith('/BenevolentBlessing.kt') for p in files)
          frozen = {'izzet-science/v0.7-control.md':'726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01',
              'izzet-science/opponents/veteran-beastrider-commander-clash-2025.txt':'c3ab6ee8e37a78219e7bbb7c6a75c634d78c1eb4965ab0db3abd5d853398b0be'}
          for p, expected in frozen.items():
              assert hashlib.sha256((root/p).read_bytes()).hexdigest() == expected, p
          archive = root / 'izzet-science/evidence/remaining-card-sources-36254350504/artifact.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '3caeca30b7d94e7704dafcc4f8bad16c384fe76734fc46ea217e2643725de5be'
          with zipfile.ZipFile(archive) as z:
              card = json.loads(z.read('cmr-13-card.json'))
          assert card['name'] == 'Benevolent Blessing' and card['set'] == 'cmr' and card['collector_number'] == '13'
          binding = {'source':source,'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'scope':'PRE_AUTHORING_PREDICTIVE_PROBES_ONLY','card_definition_present':False,'frozen_decks':frozen,
              'official_seeds_read':0,'official_initializations':0,'gameplay_authorized':False}
          (output/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          PY
      - name: Read the card with Assay then inspect the draft
        shell: bash
        run: |
          set +e
          output=build/reports/izzet-benevolent-preflight
          timeout --kill-after=15s 15m just assay parse '"Benevolent Blessing"' > "$output/parse.log" 2>&1
          printf '%s\n' "$?" > "$output/parse.exit"
          timeout --kill-after=15s 5m just assay explain '"Benevolent Blessing"' > "$output/explain.log" 2>&1
          printf '%s\n' "$?" > "$output/explain.exit"
          timeout --kill-after=15s 15m just coverage-fidelity --emit '"Benevolent Blessing"' > "$output/draftability.log" 2>&1
          printf '%s\n' "$?" > "$output/draftability.exit"
          set -e
          git diff --exit-code
          python3 - <<'PY'
          import hashlib, json, pathlib
          output=pathlib.Path('build/reports/izzet-benevolent-preflight')
          codes={name:int((output/(name+'.exit')).read_text()) for name in ('parse','explain','draftability')}
          report={'exit_codes':codes,'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(output.iterdir())},
              'scope':'PREDICTIVE_ONLY_NOT_RULES_OR_GAMEPLAY_ACCEPTANCE','official_initializations':0}
          (output/'receipt.json').write_text(json.dumps(report,indent=2)+'\n')
          assert all(code==0 for code in codes.values()), codes
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: izzet-benevolent-preflight-${{ github.sha }}
          path: build/reports/izzet-benevolent-preflight
          if-no-files-found: error
          retention-days: 90

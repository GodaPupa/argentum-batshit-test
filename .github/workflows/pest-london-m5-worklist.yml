name: Pest exhaustive London M5 worklist
on:
  push:
    branches: ["pest/london-predicate-vector-20260928"]
    paths: [".github/workflows/pest-london-m5-worklist.yml"]
permissions: {contents: read}
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - name: Bind exact generator budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/pest-london-m5-worklist
          test "$(git rev-parse HEAD^)" = "aa92c5048982f66be9566c70a8ccf40c1aef6d9a"
          test "$(git hash-object docs/experiments/pest-control/generate_london_m5_worklist.py)" = "a9c10bc0ad72d5a533fdf597c1ff5a07209c9788"
          test "$(git hash-object docs/experiments/pest-control/london-m5-worklist-budget-20260929.json)" = "ec8bef8f7caf53294f7479c74bf6b16c26c462f9"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object docs/experiments/pest-control/generate_london_m5_worklist.py; git hash-object docs/experiments/pest-control/london-m5-worklist-budget-20260929.json; git hash-object .github/workflows/pest-london-m5-worklist.yml; git status --porcelain; } > build/reports/pest-london-m5-worklist/source.txt
      - name: Generate exact M5 qualification worklist
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/experiments/pest-control/generate_london_m5_worklist.py > build/reports/pest-london-m5-worklist/worklist.json
          python3 - <<'PY'
          import json
          p="build/reports/pest-london-m5-worklist/worklist.json"
          x=json.load(open(p))
          print({k:x[k] for k in ["reachable_seven_card_name_multisets","unique_m5_input_signatures","m2_opening_candidate_hands","color_functional_true_hands","canonical_worklist_sha256","m5_truth_assigned"]})
          assert x["reachable_seven_card_name_multisets"]==882297
          assert x["m5_truth_assigned"] is False
          assert sum(r["reachable_name_multisets"] for r in x["rows"])==882297
          PY
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-london-m5-worklist-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/pest-london-m5-worklist/
          if-no-files-found: error
          retention-days: 90

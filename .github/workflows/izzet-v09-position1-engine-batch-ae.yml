name: Izzet Position-1 Engine Batch AE

on:
  push:
    branches:
      - "mayhem/izzet-science"
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-ae.yml"

permissions:
  contents: read

jobs:
  qualify-batch-ae:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen control and Batch AE provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          grep -Fq 'Batch AD is accepted' izzet-science/v09-position1-engine-batch-ad-gate.md
          grep -Fq 'Expected post-implementation unresolved count is exactly **22**' izzet-science/v09-position1-engine-batch-ae-gate.md
          grep -Fq '36036706908' izzet-science/v09-position1-engine-batch-ae-gate.md
          test "$(git show --format= --name-only 1d0226a274e7e2dcf643eee023d6d469e109f986 | sed '/^$/d' | wc -l)" -eq 1
          test "$(git show --format= --name-only 1d0226a274e7e2dcf643eee023d6d469e109f986 | sed '/^$/d')" = "mtg-sets/src/test/resources/snapshots/cards/C20.json"

      - name: Requalify canonical card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" --stacktrace

      - name: Requalify Bonder's Ornament semantics
        run: scripts/test-class BondersOrnamentBatchAEScenarioTest --info --stacktrace

      - name: Run exact real-engine coverage regression
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-ae.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=22' /tmp/batch-ae.txt
          ! grep -Fq "unresolved Veteran Beastrider card: Bonder's Ornament" /tmp/batch-ae.txt
          ! grep -Fq 'V09_REAL_ENGINE_UNRESOLVED=unresolved Izzet card:' /tmp/batch-ae.txt

      - name: Assert official experiment remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt

      - name: Emit Batch AE manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/izzet-batch-ae
          cp /tmp/batch-ae.txt /tmp/izzet-batch-ae/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-ae-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "frozen_control_sha256=726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
            echo "implemented=Bonder's Ornament;existing any-color-mana+per-player-name-filter+conditional-draw rails"
            echo "snapshot_run=36036706908"
            echo "snapshot_commit=1d0226a274e7e2dcf643eee023d6d469e109f986"
            echo "unresolved_before=23"
            echo "unresolved_after=22"
            echo "unresolved_izzet_after=0"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c20/cards/BondersOrnament.kt
            sha256sum mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/BondersOrnamentBatchAEScenarioTest.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/v09-position1-engine-batch-ae-gate.md
            sha256sum mtg-sets/src/test/resources/snapshots/cards/C20.json
            sha256sum /tmp/izzet-batch-ae/test-output.txt
          } > /tmp/izzet-batch-ae/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-ae
          path: /tmp/izzet-batch-ae
          if-no-files-found: error
          retention-days: 90

name: Manual R4 Ballista AI discovery
on:
  push:
    branches: [gameplay/manual-r4-ai-20261019]
    paths: ['ai/**', 'rules-engine/**', '.github/workflows/manual-r4-ai-20261019.yml']
permissions:
  contents: read
jobs:
  ai-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R4_OUTPUT: ${{ github.workspace }}/r4-output/ai
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Baseline observations and opt-in terminal execution regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r4-output
          git rev-parse HEAD > r4-output/source-sha.txt
          sha256sum experiments/manual-transmission/control/v0.7.decklist.txt ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt > r4-output/preserved-inputs.sha256
          chmod +x gradlew scripts/gradle-locked
          scripts/gradle-locked :ai:test --tests '*ManualBallista*Test' --tests '*ManualStatuePayoffRegressionTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace 2>&1 | tee r4-output/ai.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-r4-ai-${{ github.run_id }}
          retention-days: 30
          path: |
            r4-output/
            ai/build/test-results/test/

name: Sphinx Deem Inferior receiving
on:
  push:
    branches: ["sphinx/whole-actor-surface-inventory-20260928"]
    paths: [".github/workflows/sphinx-deem-inferior-receiving.yml"]
permissions: {contents: read}
jobs:
  one-case:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact Deem receiving source budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/sphinx-deem-inferior-receiving
          test "$(git rev-parse HEAD^)" = "d1cba902f51590aa082cddc0c8e03aa72795b9ad"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEActorAdapter.kt)" = "78badbf65fd1608d8cb8095eb92bec67c83ac04d"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEPilotComponent.kt)" = "470e6679713ebc12ceb09410f4ba642663091ba2"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEWholeActor.kt)" = "351d33e661e181c09f5e931a738d5ade3f19e2bf"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEDeemInferiorReceivingTest.kt)" = "1b626dae47d60f35008f6b1dee0b9473caca8d18"
          test "$(git hash-object sphinx-approach/STAGE_E_DEEM_INFERIOR_RECEIVING_BUDGET_20260929.json)" = "b26ec07633ebfd5092d56ae6ec9327093a14ad68"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEActorAdapter.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEPilotComponent.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEWholeActor.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEDeemInferiorReceivingTest.kt; git hash-object sphinx-approach/STAGE_E_DEEM_INFERIOR_RECEIVING_BUDGET_20260929.json; git hash-object .github/workflows/sphinx-deem-inferior-receiving.yml; git status --porcelain; } > build/reports/sphinx-deem-inferior-receiving/source.txt
      - name: Run one fresh real Deem receiving case
        shell: bash
        run: |
          set -o pipefail
          just test-class SphinxStageEDeemInferiorReceivingTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/sphinx-deem-inferior-receiving/test.log
      - name: Preserve XML
        if: always()
        shell: bash
        run: |
          find . -path '*/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageEDeemInferiorReceivingTest.xml' -type f -exec cp {} build/reports/sphinx-deem-inferior-receiving/ \; || true
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-deem-inferior-receiving-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-deem-inferior-receiving/
          if-no-files-found: error
          retention-days: 90

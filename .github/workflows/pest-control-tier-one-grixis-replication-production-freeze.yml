name: Pest Control Tier-1 Grixis Replication Production Freeze

on:
  pull_request:
    paths:
      - .github/workflows/pest-control-tier-one-grixis-replication-production-freeze.yml
      - docs/experiments/pest-control/tier-one-grixis-replication-freeze-provenance.json

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm production freeze is permanently retired
        run: |
          set -euo pipefail
          echo "Replication vector frozen successfully in run 35644821800."
          echo "Production generation is permanently disabled."

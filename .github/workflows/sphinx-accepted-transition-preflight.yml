name: Sphinx accepted-transition journal static preflight
on:
  push:
    branches: ["sphinx/accepted-transition-journal-20260928"]
    paths:
      - ".github/workflows/sphinx-accepted-transition-preflight.yml"
permissions:
  contents: read
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact prospective source and fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/sphinx-accepted-transition-preflight
          test "$(git rev-parse HEAD^)" = "5b29a579327ec6341cbcea98fc3405b1b606632c"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt)" = "0931c82bf48d7e2f1639ba2995e55ff9320b7251"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournalTest.kt)" = "4a8fda7c17eb0febe67df0f18ce98ba617677953"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournal.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEAcceptedTransitionJournalTest.kt; git hash-object .github/workflows/sphinx-accepted-transition-preflight.yml; git status --porcelain; } > build/reports/sphinx-accepted-transition-preflight/source.txt
      - name: Compile new journal and trace without executing cases
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :gym:compileTestKotlin --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/sphinx-accepted-transition-preflight/compile.log
      - name: Preserve original preflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-accepted-transition-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-accepted-transition-preflight/
          if-no-files-found: error
          retention-days: 90

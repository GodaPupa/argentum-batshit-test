name: Industrial Waste — Gate 9 Pulse Capability

on:
  pull_request:
    branches: [industrial-waste/lab]
    paths:
      - .github/workflows/industrial-waste-g9-pulse-capability.yml
      - mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ogw/cards/PulseOfMurasa.kt
      - mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/IndustrialWasteGate9OgwScenarioTest.kt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pulse-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate Pulse of Murasa
        run: ./gradlew :mtg-sets:2008-2016:tests:test --tests '*IndustrialWasteGate9OgwScenarioTest' --no-daemon

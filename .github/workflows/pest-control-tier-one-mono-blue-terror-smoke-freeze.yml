name: Pest Control Tier-1 Mono-Blue Terror Smoke Vector Freeze Validation

on:
  pull_request:
    paths:
      - scripts/experiments/pest-control/generate_tier_one_mono_blue_terror_smoke_freeze.py
      - .github/workflows/pest-control-tier-one-mono-blue-terror-smoke-freeze.yml
      - docs/experiments/pest-control/tier-one-mono-blue-terror-auto-freeze-authorization.json
      - docs/experiments/pest-control/tier-one-mono-blue-terror-vector-freeze-gate.md
      - docs/experiments/pest-control/tier-one-mono-blue-terror-vector-freeze-provenance.json

permissions:
  contents: read

concurrency:
  group: pest-control-tier-one-mono-blue-terror-smoke-vector-freeze-validation
  cancel-in-progress: false

jobs:
  validate-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deterministic entropy-free validation
        run: |
          set -euo pipefail
          python3 scripts/experiments/pest-control/generate_tier_one_mono_blue_terror_smoke_freeze.py --preflight
          python3 scripts/experiments/pest-control/generate_tier_one_mono_blue_terror_smoke_freeze.py \
            --validate-fixture \
            --output-dir build/reports/pest-control-tier-one-mono-blue-terror-smoke-freeze-fixture
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path("build/reports/pest-control-tier-one-mono-blue-terror-smoke-freeze-fixture")
          manifest=json.loads((root/"freeze-manifest.json").read_text())
          assert manifest["status"]=="NONEXPERIMENTAL_FIXTURE"
          assert manifest["collision_audit"]=={
              "excluded_seed_count":550,
              "new_seed_count":4,
              "new_unique_count":4,
              "overlap_count":0,
              "result":"PASS",
          }
          assert manifest["official_counters"]=={
              "actions_submitted":0,
              "artifacts_with_outcomes":0,
              "games_initialized":0,
              "outcome_exposure":0,
          }

          workflow=Path(".github/workflows/pest-control-tier-one-mono-blue-terror-smoke-freeze.yml").read_text()
          assert ("workflow" + "_dispatch") not in workflow
          assert ("github.event_name == " + "'push'") not in workflow
          assert ("-" + "-generate") not in workflow
          assert ("PEST_TERROR_" + "AUTO_FREEZE_AUTH") not in workflow
          PY

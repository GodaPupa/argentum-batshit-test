name: Batshit Optimization Experiment A

on:
  workflow_dispatch:
  push:
    branches:
      - 'optimization/experiment-a'

permissions:
  contents: read

jobs:
  paired-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Experiment A paired games
        env:
          BATSHIT_OPTIMIZATION_A: "true"
        run: |
          scripts/test-class BatshitOptimizationExperimentATest \
            --info \
            --stacktrace

      - name: Upload Experiment A artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batshit-optimization-experiment-a
          path: |
            gym/build/reports/batshit-optimization-a/paired-results.log
            gym/build/reports/batshit-optimization-a/paired-results.jsonl
            gym/build/reports/batshit-optimization-a/batshit-optimization-a-seeds.csv
            gym/src/test/resources/batshit-optimization-a-seeds.csv
          if-no-files-found: warn

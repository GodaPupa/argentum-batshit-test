name: Izzet resumable destruction qualification
on:
  push:
    branches: [diagnostic/izzet-destruction-final-20261003]
    paths: [.github/workflows/izzet-destruction-final-20261003.yml]
permissions:
  contents: read
concurrency:
  group: izzet-destruction-final-20261003
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/izzet-destruction-resume-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source-only successor and workflow-only validation child
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['OUT'])
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          source='8ea03b139457af996b811883fa0c933389c4edec';parent='08b665750134cf6c8af25d76273d9c804cee456b';workflow='.github/workflows/izzet-destruction-final-20261003.yml'
          expected={'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/zones/ZonesExecutors.kt': '4822e574b895a08b9eaef920e428b7a9ac10e853', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/DestructionReplacements.kt': '00ddb1bc8b314dcaa81ed1bb6d3495505482158c', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/DestructionContinuationResumer.kt': '13061b9abfc72ac74b392b277e78360aa4b90181', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/UmbraArmorReplacementTest.kt': 'aa18650f7afade09244be8c869cd0128c85bcdcc', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/sba/creature/LethalDamageCheck.kt': '4e99f0a5f23108eef9ea8a8302867d652e9d9310', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/core/DestructionContinuations.kt': 'fa996bc29e120a63cf324d49d25b577368158e19', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/ZoneMovementUtils.kt': '6eb0161509a76213a4dffc88675610ba7855575d', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/zones/DestroyAllEquipmentOnTargetExecutor.kt': '6d252176cc63473cd16d757da16b2aa7693ac162', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/DestructionReplacementResumeTest.kt': '122ee84cc8ad1419f60b8d5ffd6bf007225322f9', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/library/MoveCollectionExecutor.kt': 'b9147f8abd95b1d34e31999a320c503f5a1a2ea8'}
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==source
          assert git('rev-parse','HEAD^^')==parent
          assert git('rev-parse',source+'^{tree}')=='dd1f6ca156372303b97f86485b3a8dabb63210d9'
          assert git('diff','--name-only',source,'HEAD').splitlines()==[workflow]
          assert git('diff','--name-only',parent,source).splitlines()==sorted(expected)
          assert not git('status','--porcelain')
          for p,blob in expected.items(): assert git('hash-object',p)==blob,p
          binding={'source_head':source,'source_tree':'dd1f6ca156372303b97f86485b3a8dabb63210d9','parent_source_head':parent,
            'validation_head':git('rev-parse','HEAD'),'validation_tree':git('rev-parse','HEAD^{tree}'),
            'source_git_blobs':expected,'source_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected},
            'workflow_sha256':hashlib.sha256(pathlib.Path(workflow).read_bytes()).hexdigest(),
            'scope':'RESUMABLE_DESTRUCTION_SHARED_QUALIFICATION','registry_not_executed':True,'exact_card_admission':False,
            'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
          (out/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          PYCODE
      - name: Compile and run eighteen destruction and umbra regressions
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-configuration-cache --console=plain --continue --max-workers=1 \
            -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g \
            :rules-engine:test --tests com.wingedsheep.engine.scenarios.DestructionReplacementResumeTest --tests com.wingedsheep.engine.scenarios.UmbraArmorReplacementTest \
            2>&1 | tee "$OUT/qualification.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
          exit "$rc"
      - name: Preserve all actual prerequisite cases and failures; no registry or admission
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,shutil,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
          expected={'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.DestructionReplacementResumeTest.xml': 8, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.UmbraArmorReplacementTest.xml': 10}
          suites=[];problems=[]
          for cls,count in expected.items():
            p=pathlib.Path(cls)
            if not p.exists(): problems.append('Missing '+str(p));continue
            shutil.copy2(p,out/p.name)
            root=ET.parse(p).getroot();cases=root.findall('.//testcase')
            totals={k:int(root.get(k,'0')) for k in ('tests','failures','errors','skipped')}
            suites.append({'class':cls,**totals,'actual_cases':len(cases)})
            if totals!={'tests':count,'failures':0,'errors':0,'skipped':0} or len(cases)!=count:
              problems.append(cls+': '+json.dumps(totals)+' actual='+str(len(cases)))
          (out/'summary.json').write_text(json.dumps({'suites':suites,'problems':problems,'expected_tests':sum(expected.values())},indent=2)+'\n')
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          if problems: raise SystemExit('\n'.join(problems))
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: izzet-destruction-resume-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90


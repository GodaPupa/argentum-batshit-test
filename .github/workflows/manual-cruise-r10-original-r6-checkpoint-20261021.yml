name: Manual CRUISE R10 exact original R6 prefix checkpoint (NO GAMES)
on:
  push:
    branches: [research/manual-cruise-r10-original-r6-checkpoint-20261021]
    paths:
      - '.github/workflows/manual-cruise-r10-original-r6-checkpoint-20261021.yml'
      - 'ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualCruiseR10OriginalR6CheckpointExportTest.kt'
permissions:
  contents: read
  actions: read
concurrency:
  group: manual-cruise-r10-original-r6-exact-source
  cancel-in-progress: true

jobs:
  source-bound-prefix-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R10_OLD_ARCHIVE: ${{ github.workspace }}/cruise-r10-original-r6-input/original-game.zip
      MANUAL_R10_OLD_OUTPUT: ${{ github.workspace }}/cruise-r10-original-r6-output
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 35}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4

      - name: Protect EXACT old R6 source, full-game budget, and changed-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cruise-r10-original-r6-input cruise-r10-original-r6-output
          test "$GITHUB_REF" = 'refs/heads/research/manual-cruise-r10-original-r6-checkpoint-20261021'
          git merge-base --is-ancestor 53a5162eb3659310b1878894a90ae58c244a6745 HEAD
          git diff --name-only 53a5162eb3659310b1878894a90ae58c244a6745 HEAD > cruise-r10-original-r6-output/changed-files.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/manual-cruise-r10-original-r6-checkpoint-20261021.yml|ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualCruiseR10OriginalR6CheckpointExportTest.kt) ;;
              *) echo "UNAUTHORIZED_ORIGINAL_SOURCE_CHANGE:$path"; exit 1 ;;
            esac
          done < cruise-r10-original-r6-output/changed-files.txt
          git rev-parse HEAD > cruise-r10-original-r6-output/source-sha.txt
          git rev-parse HEAD^{tree} > cruise-r10-original-r6-output/tree-sha.txt
          echo 'EXACT_ORIGINAL_R6_SOURCE_PREFIX_3016_ONLY; ZERO_NEW_GAMES; TWO_RESERVED' > cruise-r10-original-r6-output/budget.txt
          chmod +x gradlew scripts/gradle-locked

      - name: Retrieve and digest-check exact R6 A2143 previously finished original trace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/GodaPupa/argentum-batshit-test/actions/artifacts/12299271355/zip > "$MANUAL_R10_OLD_ARCHIVE"
          printf '%s  %s\n' '1bb49d6bd7179ec4561cb2c635dca5a08653163d361c5509e81791521b46714d' "$MANUAL_R10_OLD_ARCHIVE" | sha256sum -c -

      - name: Reproduce 3016 archived accepted actions with exact original event and life stream
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:cleanTest :ai:test \
            --tests '*ManualCruiseR10OriginalR6CheckpointExportTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee cruise-r10-original-r6-output/original-r6-exact-prefix.log
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          out=Path('cruise-r10-original-r6-output')
          p=json.loads((out/'r10-original-r6-a-2143-provenance.json').read_text())
          raw=(out/'r10-original-r6-a-2143-before-3017.json').read_bytes()
          assert p['schema']=='ARGENTUM_R10_ORIGINAL_R6_SOURCE_PROVEN_CHECKPOINT_V1'
          assert p['originalR6CommitSha']=='53a5162eb3659310b1878894a90ae58c244a6745'
          assert p['originalActionBefore']==3017
          assert p['exactOriginalAcceptedActionsReplayed']==p['fullEventAndLifeComparisons']==3016
          assert hashlib.sha256(raw).hexdigest()==p['snapshotSha256']
          assert p['newFullGames']==0 and not p['sourcePortToR9Complete']
          print('CRUISE_R10_EXACT_R6_SOURCE_PREFIX_PASS index=3017 actions=3016 games=0')
          PY

      - name: Preserve original R6 JUnit/provenance on GREEN or RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-cruise-r10-original-r6-checkpoint-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            cruise-r10-original-r6-output/
            ai/build/test-results/test/

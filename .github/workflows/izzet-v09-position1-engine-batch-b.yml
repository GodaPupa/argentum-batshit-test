name: Izzet Position-1 Engine Batch B Llanowar Visionary
on:
  pull_request:
    paths:
      - "mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m21/cards/LlanowarVisionary.kt"
      - "gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt"
      - "izzet-science/v09-position1-engine-batch-b-gate.md"
      - ".github/workflows/izzet-v09-position1-engine-batch-b.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-batch-b:
    if: github.event_name != 'pull_request' || github.head_ref == 'mayhem/izzet-science'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify frozen control
        run: test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
      - name: Run Llanowar Visionary and coverage tests
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/batch-b.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=53' /tmp/batch-b.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Llanowar Visionary' /tmp/batch-b.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Boreal Druid' /tmp/batch-b.txt
      - name: Assert official execution remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
      - name: Emit Batch B manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/batch-b-artifact
          cp /tmp/batch-b.txt /tmp/batch-b-artifact/test-output.txt
          {
            echo "schema=izzet-v09-position1-engine-batch-b-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "implemented=Llanowar Visionary"
            echo "unresolved_before=54"
            echo "unresolved_after=53"
            echo "experimental_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m21/cards/LlanowarVisionary.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum /tmp/batch-b-artifact/test-output.txt
          } > /tmp/batch-b-artifact/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-b
          path: /tmp/batch-b-artifact
          if-no-files-found: error

name: Izzet Position-1 Snap mechanics batch
on:
  push:
    branches: ["izzet/position1-snap-batch-20260928"]
    paths: [".github/workflows/izzet-position1-snap-batch.yml"]
permissions: {contents: read}
jobs:
  four-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact Snap source fixture budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/izzet-position1-snap-batch
          test "$(git rev-parse HEAD^)" = "fdccce8950ec4bba2a419e59ed4886321e4bf0ce"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ulg/cards/Snap.kt)" = "15c15b39609e97796a110c5228e84265a60cc45d"
          test "$(git hash-object mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/IzzetPosition1SnapScenarioTest.kt)" = "edb7dead06d3c94d467116da93c72eb901d55def"
          test "$(git hash-object experiments/izzet-science/position1-snap-mechanics-budget-20260928.json)" = "fa5036f45da95416b7859fef5da80daeba02674c"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ulg/cards/Snap.kt; git hash-object mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/IzzetPosition1SnapScenarioTest.kt; git hash-object experiments/izzet-science/position1-snap-mechanics-budget-20260928.json; git hash-object .github/workflows/izzet-position1-snap-batch.yml; git status --porcelain; } > build/reports/izzet-position1-snap-batch/source.txt
      - name: Run four fresh Snap mechanics cases
        shell: bash
        run: |
          set -o pipefail
          just test-class IzzetPosition1SnapScenarioTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-position1-snap-batch/test.log
      - name: Preserve XML
        if: always()
        shell: bash
        run: |
          find . -path '*/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.IzzetPosition1SnapScenarioTest.xml' -type f -print -exec cp {} build/reports/izzet-position1-snap-batch/ \; || true
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-position1-snap-batch-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-position1-snap-batch/
          if-no-files-found: error
          retention-days: 90

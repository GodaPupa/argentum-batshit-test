name: Manual typed enter-as-copy shared qualification
on:
  push:
    branches: [validation/manual-copy-exceptions-20261003]
    paths: [.github/workflows/manual-copy-exceptions-20261003.yml]
permissions:
  contents: read
concurrency:
  group: manual-copy-exceptions-20261003
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/manual-copy-exceptions-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact source-only successor and workflow-only validation child
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['OUT'])
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          source='b7aad288948b3845d418dc3baa70938d920df00c';parent='43c0143350b482ad91137cfba67a94d8d1384cd2';workflow='.github/workflows/manual-copy-exceptions-20261003.yml'
          expected={"docs/card-sdk-language-reference.md":"3943994e97970fb8fe178cffdff059f3aa6c7bfc","mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/ReplacementEffect.kt":"adc0c923c007b77c318751bf66dc0ed4874a6609","mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/CopyExceptions.kt":"28d848656f3567a5eb28c9627193880cf455b2a7","rules-engine/src/main/kotlin/com/wingedsheep/engine/core/ModalAndCloneContinuations.kt":"e77fc22f01bcfe7972ba4c01304d0052667601b8","rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/continuations/ModalAndCloneContinuationResumer.kt":"606d28521ff4b35f53a4e0463014ac11ff4a61dd","rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/PermanentEntryReplacements.kt":"1d5d8b12f605850c986640cc4af324e131cd02cc","rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt":"4d4acb2bfb4b9cef1552e77a5f51180ae54e4e68","mtg-sdk/src/test/kotlin/com/wingedsheep/sdk/scripting/EntersAsCopyExceptionsTest.kt":"037049939c66774b297fe8b06a0687d59769e175","rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/EntersAsCopyExceptionsScenarioTest.kt":"8c13efccd3fd605962f011a794f40ded7ef5f939"}
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==source
          assert git('rev-parse','HEAD^^')==parent
          assert git('rev-parse',source+'^{tree}')=='5279d7b18acd91a186fafab886089fabc101513b'
          assert git('diff','--name-only',source,'HEAD').splitlines()==[workflow]
          assert git('diff','--name-only',parent,source).splitlines()==sorted(expected)
          assert not git('status','--porcelain')
          for p,blob in expected.items(): assert git('hash-object',p)==blob,p
          binding={'source_head':source,'source_tree':'5279d7b18acd91a186fafab886089fabc101513b','parent_source_head':parent,
            'validation_head':git('rev-parse','HEAD'),'validation_tree':git('rev-parse','HEAD^{tree}'),
            'source_git_blobs':expected,'source_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected},
            'workflow_sha256':hashlib.sha256(pathlib.Path(workflow).read_bytes()).hexdigest(),
            'scope':'EXCLUDED_FIXED_SHARED_PRIMITIVE_QUALIFICATION',
            'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
          (out/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          PYCODE
      - name: Compile affected slices and run typed exception, copy, and unchanged Clone regressions
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-configuration-cache --console=plain --continue --max-workers=1 \
            -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g \
            :mtg-sdk:test --tests com.wingedsheep.sdk.scripting.EntersAsCopyExceptionsTest \
            :rules-engine:test --tests com.wingedsheep.engine.scenarios.EntersAsCopyExceptionsScenarioTest \
            --tests com.wingedsheep.engine.handlers.effects.copy.CopyExceptionsTest \
            :mtg-sets:2000-2002:tests:test --tests com.wingedsheep.engine.scenarios.CloneTest \
            2>&1 | tee "$OUT/qualification.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
          exit "$rc"
      - name: Preserve evidence and require all 40 actual tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,shutil,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
          expected={"mtg-sdk/build/test-results/test/TEST-com.wingedsheep.sdk.scripting.EntersAsCopyExceptionsTest.xml":4,"rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.EntersAsCopyExceptionsScenarioTest.xml":10,"rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.handlers.effects.copy.CopyExceptionsTest.xml":21,"mtg-sets/2000-2002/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.CloneTest.xml":5}
          suites=[];problems=[]
          for cls,count in expected.items():
            p=pathlib.Path(cls)
            if not p.exists(): problems.append('Missing '+str(p));continue
            shutil.copy2(p,out/p.name)
            root=ET.parse(p).getroot();cases=root.findall('.//testcase')
            totals={k:int(root.get(k,'0')) for k in ('tests','failures','errors','skipped')}
            suites.append({'class':cls,**totals,'actual_cases':len(cases)})
            if totals!={'tests':count,'failures':0,'errors':0,'skipped':0} or len(cases)!=count:
              problems.append(cls+': '+json.dumps(totals)+' actual='+str(len(cases)))
          (out/'summary.json').write_text(json.dumps({'suites':suites,'problems':problems,'expected_tests':sum(expected.values())},indent=2)+'\n')
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          if problems: raise SystemExit('\n'.join(problems))
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manual-copy-exceptions-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90

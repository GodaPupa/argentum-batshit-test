name: Pest Control Tier-1 Spy Support Batch C

on:
  pull_request:
    paths:
      - .github/workflows/pest-control-tier-one-spy-support-batch-c.yml
      - 'docs/experiments/pest-control/tier-one-spy-support-batch-c*'
      - '**/NyxbornHydra.kt'
      - '**/NyxbornHydraScenarioTest.kt'
      - '**/BestowComponent.kt'
      - '**/BestowCastEnumerator.kt'
      - '**/PestControlTierOneSpyComboSupportBatchBTest.kt'
      - '**/PestControlTierOneSpyComboSupportBatchCTest.kt'
      - 'mtg-sdk/src/main/**'
      - 'rules-engine/src/main/**'
      - 'mtg-sets/src/test/resources/snapshots/cards/MH3.json'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Qualify canonical Bestow and exact Spy main closure
        env:
          PEST_SPY_CLOSURE_REPORT: ${{ github.workspace }}/build/reports/pest-spy-support-batch-c/closure.txt
          PEST_SPY_ADMISSION_REPORT: ${{ github.workspace }}/build/reports/pest-spy-support-batch-c/admission.txt
        run: |
          set -euo pipefail
          output=build/reports/pest-spy-support-batch-c
          mkdir -p "$output"
          git rev-parse HEAD > "$output/source-commit.txt"
          cp docs/experiments/pest-control/tier-one-spy-support-batch-c-sources.json "$output/"
          run_stage() {
            local stage="$1" class="$2" module="$3" status=0
            scripts/test-class "$class" --info --stacktrace || status=$?
            mkdir -p "$output/test-results/$stage"
            if [ -d "$module/build/test-results/test" ]; then
              cp -a "$module/build/test-results/test/." "$output/test-results/$stage/"
            fi
            return "$status"
          }
          run_stage component-registration SerializationPolymorphicRegistrationTest rules-engine
          run_stage card-serialization CardSerializationRoundTripTest mtg-sdk
          run_stage card-lint CardLinterTest mtg-sdk
          run_stage nyxborn-hydra NyxbornHydraScenarioTest mtg-sets/2024/tests
          run_stage prototype-regression PrototypeKeywordTest rules-engine
          run_stage cascade-regression CascadeKeywordTest rules-engine
          run_stage prior-support PestControlTierOneSpyComboSupportBatchBTest gym
          run_stage main-closure PestControlTierOneSpyComboSupportBatchCTest gym
          run_stage frozen-admission PestControlTierOneSpyComboAdmissionTest gym
          snapshot_status=0
          run_stage strict-snapshots CardDefinitionSnapshotTest mtg-sets || snapshot_status=$?
          if [ -d mtg-sets/build/snapshots-actual ]; then
            cp -a mtg-sets/build/snapshots-actual "$output/"
          fi
          exit "$snapshot_status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pest-control-tier-one-spy-support-batch-c
          path: build/reports/pest-spy-support-batch-c
          if-no-files-found: error
          retention-days: 90

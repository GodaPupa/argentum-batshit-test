name: Manual multiplayer registry inventory R1
on:
  push:
    branches: [validation/manual-multiplayer-registry-inventory-r1-20261029]
    paths: ['.github/workflows/manual-multiplayer-registry-inventory-r1-20261029.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: f4a25fba9126c80af1909ffb9d2bd073c85ce987
  SOURCE_TREE: fe0c4378e876a4b04efa44e9b8dcf5a9b72c3835
  WORKFLOW: .github/workflows/manual-multiplayer-registry-inventory-r1-20261029.yml
  RECORD: experiments/manual-transmission/research/multiplayer-registry-inventory-r1-20261029
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile then exact frozen eight-deck seedless registry inventory
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-multiplayer-registry-inventory-r1-${{ github.run_id }}
          path: manual-multiplayer-registry-inventory-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

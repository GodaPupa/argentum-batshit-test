name: Pest Control Tier-1 Monster Tron Runner Construction

on:
  pull_request:
    paths:
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonsterTronRunnerContract.kt
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonsterTronSmokeHarness.kt
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonsterTronOfficialInitializationBoundary.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonsterTronRunnerConstructionTest.kt
      - docs/experiments/pest-control/tier-one-monster-tron-runner-construction.md
      - .github/workflows/pest-control-tier-one-monster-tron-runner-construction.yml

permissions:
  contents: read

jobs:
  construction:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate disabled runner construction
        run: scripts/test-class PestControlTierOneMonsterTronRunnerConstructionTest --info --stacktrace
      - name: Revalidate exact Monster Tron policy boundary
        run: scripts/test-class PestControlTierOneMonsterTronPolicyReadinessTest --info --stacktrace

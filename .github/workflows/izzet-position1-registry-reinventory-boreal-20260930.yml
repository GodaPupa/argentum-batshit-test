name: Izzet Position-1 registry reinventory after Boreal Druid adoption
on:
  push:
    branches: ["izzet/position1-registry-reinventory-boreal-20260930"]
    paths: [".github/workflows/izzet-position1-registry-reinventory-boreal-20260930.yml"]
permissions: {contents: read}
jobs:
  fifty-five-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact post-Boreal runtime diagnostic
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/izzet-position1-registry-reinventory-boreal
          mkdir -p "$OUT"
          git merge-base --is-ancestor e28f27e4ce3f84dca511b49f9cc4005f1cbb6ed9 HEAD
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/izzet/IzzetPosition1RegistryInventoryTest.kt)" = "197a99e6c17885bb70511916893d3a33de217feb"
          test "$(git hash-object experiments/izzet-science/POSITION1_REGISTRY_REINVENTORY_BOREAL_BUDGET_20260930.json)" = "47381bd3072a1c5ccc4d501d8b94c48adda02a3d"
          test "$(git hash-object mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/csp/cards/BorealDruid.kt)" = "73c1d53e5c331d4809482698fdff7d4f55cb22c9"
          test "$(git hash-object mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/BorealDruidScenarioTest.kt)" = "1ed9a4c472f1f497de6bea12a3d17e9fce3bd710"
          test "$(git hash-object mtg-sets/src/test/resources/snapshots/cards/CSP.json)" = "a1f8f732760e11625a4bcf4e6809b0daabe0c75b"
          {
            git rev-parse HEAD
            git rev-parse e28f27e4ce3f84dca511b49f9cc4005f1cbb6ed9
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/izzet/IzzetPosition1RegistryInventoryTest.kt
            git hash-object experiments/izzet-science/POSITION1_REGISTRY_REINVENTORY_BOREAL_BUDGET_20260930.json
            git hash-object mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/csp/cards/BorealDruid.kt
            git hash-object mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/BorealDruidScenarioTest.kt
            git hash-object mtg-sets/src/test/resources/snapshots/cards/CSP.json
            git hash-object .github/workflows/izzet-position1-registry-reinventory-boreal-20260930.yml
            git status --porcelain
          } > "$OUT/source.txt"
      - name: Execute exact 55 registry identities against current runtime
        shell: bash
        run: |
          set -o pipefail
          just test-class IzzetPosition1RegistryInventoryTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-position1-registry-reinventory-boreal/test.log
      - name: Retain and summarize exact XML
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/izzet-position1-registry-reinventory-boreal
          XML=gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml
          cp "$XML" "$OUT/"
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          out=pathlib.Path("build/reports/izzet-position1-registry-reinventory-boreal")
          root=ET.parse(out/"TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml").getroot()
          registered=[]; missing=[]; suffix=" is registered in current runtime"
          for case in root.iter("testcase"):
              name=case.attrib["name"]
              card=name[:-len(suffix)] if name.endswith(suffix) else name
              if case.find("failure") is None and case.find("error") is None: registered.append(card)
              else: missing.append(card)
          summary={"schema":"izzet-position1-registry-reinventory-boreal-summary-v1",
                   "tests":int(root.attrib.get("tests","0")),
                   "failures":int(root.attrib.get("failures","0")),
                   "errors":int(root.attrib.get("errors","0")),
                   "skipped":int(root.attrib.get("skipped","0")),
                   "registered":len(registered),"missing":len(missing),
                   "registered_names":sorted(registered),"missing_names":sorted(missing),
                   "boreal_druid_registered":"Boreal Druid" in registered}
          assert summary["tests"]==55
          assert summary["boreal_druid_registered"] is True
          (out/"registry-summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          PY
      - name: Preserve original diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-position1-registry-reinventory-boreal-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-position1-registry-reinventory-boreal/
          if-no-files-found: error
          retention-days: 90

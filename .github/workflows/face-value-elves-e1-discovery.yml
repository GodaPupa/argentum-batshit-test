name: Face Value Elves E1 Discovery

on:
  push:
    branches: [face-value/lab]
    paths:
      - experiments/face-value/qualification/elves-e1-discovery-seed-registry.json

permissions:
  contents: write

concurrency:
  group: face-value-elves-e1-discovery
  cancel-in-progress: false

jobs:
  execute-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: face-value/lab
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate frozen discovery inputs
        run: |
          set -euo pipefail
          python3 experiments/face-value/qualification/validate_inputs.py >/dev/null
          cd experiments/face-value/qualification
          sha256sum -c elves-e1-discovery-seed-registry.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('elves-e1-discovery-seed-registry.json').read_text())
          rows=d['assignments']
          assert d['classification']=='DISCOVERY_ELVES_SIDEBOARD_E1'
          assert d['design']['discovery_only'] is True
          assert d['design']['promotion_authority'] is False
          assert d['authority']['capability_run']==35615792326
          assert len(rows)==32 and len({r['seed'] for r in rows})==32
          assert sum(r['face_value_seat']==1 for r in rows)==16
          assert sum(r['face_value_seat']==2 for r in rows)==16
          PY

      - name: Build pinned Forge profile
        run: |
          set -euxo pipefail
          FORGE_SHA=f387ede550e336315637a8b765f0927ac768c113
          git clone --filter=blob:none https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src checkout --detach "$FORGE_SHA"
          python3 experiments/face-value/qualification/apply_forge_profile_v1.py --forge-root forge-src >/dev/null
          python3 experiments/face-value/qualification/apply_forge_profile_v2.py --forge-root forge-src >/dev/null
          python3 experiments/face-value/qualification/apply_forge_profile_v3.py --forge-root forge-src >/dev/null
          python3 experiments/face-value/qualification/apply_forge_profile_v4.py --forge-root forge-src >/dev/null
          python3 experiments/face-value/qualification/apply_forge_profile_v6.py --forge-root forge-src > forge-profile-v6-id.txt
          test "$(cat forge-profile-v6-id.txt)" = 'FACE_VALUE_QUALIFICATION_FORGE_PROFILE_V6_UNDERCITY_TARGETING'
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"

      - name: Install challenger, opponent, and assignments
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.forge/decks/constructed" e1-logs
          cp experiments/face-value/qualification/challengers/face-value-elves-sideboard-e1-postboard.dck "$HOME/.forge/decks/constructed/e1-postboard.dck"
          cp experiments/face-value/qualification/opponents/elves-mogged-2026-09-19.dck "$HOME/.forge/decks/constructed/opponent-elves.dck"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('experiments/face-value/qualification/elves-e1-discovery-seed-registry.json').read_text())
          with Path('e1-assignments.tsv').open('w') as f:
              for r in d['assignments']:
                  print(r['run_index'],r['face_value_seat'],r['seed'],sep='\t',file=f)
          PY

      - name: Execute 32 frozen discovery assignments once
        run: |
          set -uo pipefail
          : > e1-exit-status.tsv
          while IFS=$'\t' read -r idx seat seed; do
            log=$(printf 'e1-logs/%02d-seat%s-%s.log' "$idx" "$seat" "$seed")
            if [ "$seat" = 1 ]; then
              timeout 300 "$FORGE_LAUNCHER" sim -d e1-postboard.dck opponent-elves.dck -n 1 -s "$seed" -c 120 > "$log" 2>&1
            else
              timeout 300 "$FORGE_LAUNCHER" sim -d opponent-elves.dck e1-postboard.dck -n 1 -s "$seed" -c 120 > "$log" 2>&1
            fi
            code=$?
            printf '%s\t%s\t%s\n' "$idx" "$seed" "$code" >> e1-exit-status.tsv
          done < e1-assignments.tsv
          exit 0

      - name: Audit discovery block
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          exits={}
          for line in Path('e1-exit-status.tsv').read_text().splitlines():
              i,s,c=line.split('\t'); exits[int(i)]=int(c)
          rows=[]
          for line in Path('e1-assignments.tsv').read_text().splitlines():
              i_s,seat_s,seed_s=line.split('\t'); i=int(i_s); seat=int(seat_s); seed=int(seed_s)
              p=Path('e1-logs')/f'{i:02d}-seat{seat}-{seed}.log'
              t=p.read_text(errors='replace') if p.exists() else ''
              opp=3-seat
              fv=bool(re.search(rf'Ai\({seat}\)-Face Value Elves Sideboard E1 POSTBOARD has won!',t))
              op=bool(re.search(rf'Ai\({opp}\)-.+ has won!',t))
              draw='ended in a Draw' in t
              flags=[]
              if exits.get(i,999)!=0: flags.append(f'process_exit_{exits.get(i,"missing")}')
              if sum((fv,op,draw))!=1: flags.append('terminal_count_not_1')
              for name,pat in {
                'exception':r'Exception|StackOverflowError|AssertionError',
                'slow_draw':r'Stopping slow match as draw',
                'missing_deck':r'Deck not found|Unable to load deck',
                'unsupported':r'UnsupportedOperationException|not implemented',
                'undercity_target_failure':r'Undercity.*failed to target.*Goad target creature'
              }.items():
                  if re.search(pat,t,re.I): flags.append(name)
              rows.append({'run_index':i,'face_value_seat':seat,'seed':seed,
                           'winner':'face_value' if fv else 'opponent' if op else 'draw' if draw else 'unknown',
                           'flags':sorted(set(flags)),
                           'end_casts':len(re.findall(r'cast End the Festivities',t,re.I)),
                           'breath_casts':len(re.findall(r'cast Breath Weapon',t,re.I)),
                           'log':str(p)})
          bad=[r for r in rows if r['flags']]
          wins=sum(r['winner']=='face_value' for r in rows)
          losses=sum(r['winner']=='opponent' for r in rows)
          draws=sum(r['winner']=='draw' for r in rows)
          summary={'classification':'DISCOVERY_ELVES_SIDEBOARD_E1',
                   'acceptance':'DISCOVERY_VALID_PENDING_INTERPRETATION' if not bad and len(rows)==32 else 'QUARANTINED',
                   'games':len(rows),'wins':wins,'losses':losses,'draws':draws,
                   'flagged_games':len(bad),
                   'end_casts':sum(r['end_casts'] for r in rows),
                   'breath_casts':sum(r['breath_casts'] for r in rows),
                   'records':rows}
          Path('e1-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in summary.items() if k!='records'},indent=2,sort_keys=True))
          assert len(rows)==32 and not bad
          PY

      - name: Preserve discovery evidence
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tar -czf e1-raw-logs.tar.gz e1-logs e1-exit-status.tsv
          dest="experiments/face-value/qualification/evidence/elves-e1-discovery/run-${RUN_ID}"
          mkdir -p "$dest"
          cp e1-summary.json e1-raw-logs.tar.gz forge-profile-v6-id.txt "$dest/"
          printf 'workflow_run=https://github.com/%s/actions/runs/%s\nhead_sha=%s\n' "$GITHUB_REPOSITORY" "$RUN_ID" "$HEAD_SHA" > "$dest/provenance.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$dest"
          git commit -m "face-value: preserve Elves E1 discovery evidence run ${RUN_ID}"
          git push origin HEAD:face-value/lab

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-elves-e1-discovery-${{ github.run_id }}
          path: |
            e1-summary.json
            e1-raw-logs.tar.gz
            forge-profile-v6-id.txt
          if-no-files-found: warn

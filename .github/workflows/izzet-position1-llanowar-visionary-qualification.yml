name: Izzet Position-1 Llanowar Visionary Qualification
on:
  push:
    branches: ["izzet/position1-llanowar-visionary-snapshot-contract-execute-v3-20260930"]
    paths:
      - "mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m21/cards/LlanowarVisionary.kt"
      - "mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/LlanowarVisionaryScenarioTest.kt"
      - "experiments/izzet-science/POSITION1_LLANOWAR_VISIONARY_BUDGET_20260930.json"
      - ".github/workflows/izzet-position1-llanowar-visionary-qualification.yml"\n      - "experiments/izzet-science/POSITION1_LLANOWAR_VISIONARY_SNAPSHOT_CONTRACT_EXECUTION_MARKER_V3_20260930.json"
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact candidate reused primitives budget and ancestry
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/izzet-llanowar-visionary
          mkdir -p "$OUT"
          MARKER=experiments/izzet-science/POSITION1_LLANOWAR_VISIONARY_SNAPSHOT_CONTRACT_EXECUTION_MARKER_V2_20260930.json
          git merge-base --is-ancestor e28f27e4ce3f84dca511b49f9cc4005f1cbb6ed9 HEAD
          test "$(git diff --name-only HEAD^ HEAD)" = "$MARKER"
          python3 - "$MARKER" <<'PY'
          import json,pathlib,subprocess,sys
          marker=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert marker["authorization"]=="ONE_FRESH_LLANOWAR_VISIONARY_QUALIFICATION_ORIGINAL"
          assert marker["workflow_blob"]==subprocess.check_output(["git","hash-object",".github/workflows/izzet-position1-llanowar-visionary-qualification.yml"],text=True).strip()
          assert marker["repair_budget_blob"]==subprocess.check_output(["git","hash-object","experiments/izzet-science/POSITION1_LLANOWAR_VISIONARY_SNAPSHOT_CONTRACT_REPAIR_BUDGET_20260930.json"],text=True).strip()
          assert marker["source_blob"]=="2cc1f07b325b4b7b5358418aa0aefc0ccabe430b"
          assert marker["test_blob"]=="7378eacb4e0d4ac7fe1292e73fc5d94ee9cf5ece"
          assert marker["official_counters_delta"]==0
          PY
          test "$(git hash-object mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m21/cards/LlanowarVisionary.kt)" = "2cc1f07b325b4b7b5358418aa0aefc0ccabe430b"
          test "$(git hash-object mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/LlanowarVisionaryScenarioTest.kt)" = "7378eacb4e0d4ac7fe1292e73fc5d94ee9cf5ece"
          test "$(git hash-object experiments/izzet-science/POSITION1_LLANOWAR_VISIONARY_BUDGET_20260930.json)" = "2986c682c32c5fe493eee5fd4bfaae867e174925"
          test "$(git hash-object mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ala/cards/ElvishVisionary.kt)" = "5331cf565a1407d77e70c987ce2d4f120748ddc7"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/lea/cards/LlanowarElves.kt)" = "e0b1fa2f73dbe52e5eb0e3e21c35d55d40df249d"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/effects/ManaEffects.kt)" = "ce3a338dc502068662da0b21884005b5eec1a52a"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/dsl/Effects.kt)" = "1904846d3b5ad489224784b5d9687c68f8b207ee"
          {
            git rev-parse HEAD
            git rev-parse HEAD~4
            git hash-object mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m21/cards/LlanowarVisionary.kt
            git hash-object mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/LlanowarVisionaryScenarioTest.kt
            git hash-object experiments/izzet-science/POSITION1_LLANOWAR_VISIONARY_BUDGET_20260930.json
            git hash-object .github/workflows/izzet-position1-llanowar-visionary-qualification.yml
            git status --porcelain
          } > "$OUT/source.txt"
          test ! -s <(git status --porcelain)
      - name: Run exact Llanowar Visionary semantic cases
        shell: bash
        run: |
          set -euo pipefail
          just test-class LlanowarVisionaryScenarioTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-llanowar-visionary/scenarios.log
          xml="$(find . -path '*/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.LlanowarVisionaryScenarioTest.xml' -type f -print -quit)"
          test -n "$xml" && test -s "$xml"
          cp "$xml" build/reports/izzet-llanowar-visionary/
      - name: Regenerate snapshots and run card lint
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:test --tests '*CardDefinitionSnapshotTest' --tests '*CardLintTest' -DupdateSnapshots=true --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/izzet-llanowar-visionary/snapshot-lint.log
      - name: Require only Llanowar Visionary snapshot additions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,re,subprocess,hashlib
          targets=[
            "mtg-sets/src/test/resources/snapshots/cards/M21.json",
          ]
          changed=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          assert changed == targets, changed
          def records(text):
              out={}
              for block in re.split(r'\n\n(?=// )',text.strip()):
                  heading,body=block.split('\n',1)
                  assert heading.startswith("// "),heading
                  name=heading[3:]
                  assert name not in out,name
                  out[name]=(body,json.loads(body))
              return out
          report={}
          for target in targets:
              before=subprocess.check_output(["git","show","HEAD:"+target],text=True)
              after=pathlib.Path(target).read_text()
              old,new=records(before),records(after)
              assert set(new)-set(old)=={"Llanowar Visionary"},(target,set(new)-set(old))
              assert not(set(old)-set(new)),(target,set(old)-set(new))
              assert all(old[n]==new[n] for n in old),target+" existing record changed"
              card=new["Llanowar Visionary"][1]
              assert card["name"]=="Llanowar Visionary"
              assert card["manaCost"]=="{2}{G}"
              assert card["typeLine"]=="Creature — Elf Druid"
              assert card["oracleText"]=="When this creature enters, draw a card.\n{T}: Add {G}."
              report[target]={"sha256":hashlib.sha256(pathlib.Path(target).read_bytes()).hexdigest(),
                              "added_records":["Llanowar Visionary"],
                              "unchanged_existing_records":len(old)}
              pathlib.Path("build/reports/izzet-llanowar-visionary/"+pathlib.Path(target).name).write_bytes(pathlib.Path(target).read_bytes())
          pathlib.Path("build/reports/izzet-llanowar-visionary/generated-binding.json").write_text(json.dumps(report,indent=2)+"\n")
          pathlib.Path("build/reports/izzet-llanowar-visionary/generated-delta.patch").write_bytes(subprocess.check_output(["git","diff","--"]+targets))
          PY
          git diff --check
      - name: Verify exact semantic XML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          p=pathlib.Path("build/reports/izzet-llanowar-visionary/TEST-com.wingedsheep.engine.scenarios.LlanowarVisionaryScenarioTest.xml")
          x=ET.parse(p).getroot()
          assert int(x.attrib["tests"])==2
          assert int(x.attrib.get("failures","0"))==0
          assert int(x.attrib.get("errors","0"))==0
          assert int(x.attrib.get("skipped","0"))==0
          PY
      - name: Preserve exact original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-position1-llanowar-visionary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/izzet-llanowar-visionary/
          if-no-files-found: error
          retention-days: 90

name: Manual R7 Ballista bounded counter-preservation forks
on:
  push:
    branches: [gameplay/manual-r7-ballista-forks-20261019]
    paths:
      - 'ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualR7BallistaCounterForkTest.kt'
      - '.github/workflows/manual-r7-ballista-forks-20261019.yml'
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R7_BALLISTA_OUTPUT: ${{ github.workspace }}/r7-ballista-output
      MANUAL_R7_ARTIFACT_1609: ${{ github.workspace }}/r7-ballista-input/1609.zip
      MANUAL_R7_ARTIFACT_1610: ${{ github.workspace }}/r7-ballista-input/1610.zip
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Bind frozen baseline and exact archived R7 originals
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p r7-ballista-input r7-ballista-output
          git rev-parse HEAD > r7-ballista-output/source-sha.txt
          git rev-parse HEAD^{tree} > r7-ballista-output/tree-sha.txt
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/modules/ManualPactDebtAdvisorModule.kt)" = "b8ace7c735f4561dc243ae6fa1fc197b16f61bc1"
          gh api -H "Accept: application/vnd.github+json" /repos/GodaPupa/argentum-batshit-test/actions/artifacts/12218767899/zip > r7-ballista-input/1609.zip
          printf '%s  %s\n' '1367da258c0ebb9f216101adf3440cf748e251be64c7789fdaff80a25ab5c8eb' r7-ballista-input/1609.zip | sha256sum -c -
          gh api -H "Accept: application/vnd.github+json" /repos/GodaPupa/argentum-batshit-test/actions/artifacts/12219790862/zip > r7-ballista-input/1610.zip
          printf '%s  %s\n' '111687fab8c483c227ec22478822aa4824ccb736d031b716b9c4855f0fa58ba9' r7-ballista-input/1610.zip | sha256sum -c -
          chmod +x gradlew scripts/gradle-locked
      - name: Exact 2659 original versus tactical hold and actual 2764 nine-shot kill
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:test --tests '*ManualR7BallistaCounterForkTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace 2>&1 | tee r7-ballista-output/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-r7-ballista-forks-${{ github.run_id }}
          retention-days: 30
          path: |
            r7-ballista-output/
            ai/build/test-results/test/

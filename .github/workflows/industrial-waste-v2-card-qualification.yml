name: Industrial Waste v2 card qualification

on:
  pull_request:
    branches: [industrial-waste/lab, industrial-waste/v2-structural-redesign]
    paths:
      - .github/workflows/industrial-waste-v2-card-qualification.yml
      - industrial-waste/v2/**
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2*.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/arena/TableGameRunner.kt
      - rules-engine/src/testFixtures/kotlin/com/wingedsheep/engine/support/GameTestDriver.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/actions/spell/CastSpellHandler.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/core/GameInitializer.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/core/Serialization.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/MulliganHandler.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/library/ShuffleLibraryExecutor.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/library/LibraryOrderingService.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/state/components/player/LibraryOrderingComponent.kt
      - rules-engine/src/test/kotlin/com/wingedsheep/engine/library/LibraryOrderingServiceTest.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/CostHandler.kt
      - rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/permanent/ExploreEffectExecutor.kt
      - rules-engine/src/test/kotlin/com/wingedsheep/engine/handlers/CostHandlerDiscardChoiceTest.kt
      - mtg-sets/**/ChromaticStar*.kt
      - mtg-sets/**/AncientStirrings*.kt
      - mtg-sets/**/DrossSkullbomb*.kt
      - mtg-sets/**/CandyTrailScenarioTest.kt
      - mtg-sets/**/ConduitPylonsScenarioTest.kt
      - mtg-sets/**/GolemFoundryScenarioTest.kt
      - mtg-sets/**/MyrKinsmithScenarioTest.kt
      - mtg-sets/**/TreeOfTalesScenarioTest.kt
      - mtg-sets/**/VaultOfWhispersScenarioTest.kt
      - mtg-sets/**/DarkmossBridgeScenarioTest.kt
      - mtg-sets/**/PactdollTerrorScenarioTest.kt
      - mtg-sets/**/BloodFountainScenarioTest.kt
      - mtg-sets/**/FanaticalOfferingScenarioTest.kt
      - mtg-sets/src/test/resources/snapshots/cards/TSP.json
      - mtg-sets/src/test/resources/snapshots/cards/ROE.json

permissions:
  contents: read

concurrency:
  group: industrial-waste-v2-cards-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  seed-free-card-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IW_V2_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@v3
      - name: Verify immutable construction inputs
        run: |
          python3 - <<'PY'
          import os, subprocess
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != os.environ['IW_V2_EXPECTED_HEAD']:
              raise SystemExit('Checked-out source does not match the requested PR head')
          PY
          python3 industrial-waste/v2/validate_r0.py
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          path = pathlib.Path('industrial-waste/v2/execution-status-capability.json')
          capability = json.loads(path.read_text())
          receiving_path = pathlib.Path('industrial-waste/v2/execution-status-receiving-source.json')
          receiving = json.loads(receiving_path.read_text())
          if hashlib.sha256(path.read_bytes()).hexdigest() != receiving['predecessor_capability_sha256']:
              raise SystemExit('Accepted predecessor capability bytes changed')
          fixture = 'ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2ExecutionStatusTest.kt'
          changed = {'ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteV2ExecutionStatus.kt',
              '.github/workflows/industrial-waste-v2-card-qualification.yml', fixture}
          if set(receiving['source_sha256']) != changed:
              raise SystemExit('Unexpected receiving status source scope')
          review = pathlib.Path(receiving['independent_source_review']['path'])
          if hashlib.sha256(review.read_bytes()).hexdigest() != receiving['independent_source_review']['sha256']:
              raise SystemExit('Receiving independent source review bytes changed')
          binding = receiving['frozen_strategy_receiving_binding']
          fixture_review_path = pathlib.Path(binding['review_path'])
          if hashlib.sha256(fixture_review_path.read_bytes()).hexdigest() != binding['review_sha256']:
              raise SystemExit('Frozen-strategy fixture review bytes changed')
          fixture_review = json.loads(fixture_review_path.read_text())
          reviewed_manifest_path = pathlib.Path(fixture_review['source_manifest_path'])
          if hashlib.sha256(reviewed_manifest_path.read_bytes()).hexdigest() != fixture_review['source_manifest_sha256']:
              raise SystemExit('Reviewed constructor manifest bytes changed')
          reviewed_manifest = json.loads(reviewed_manifest_path.read_text())
          fixture_bindings = [row for row in reviewed_manifest['constructor_bindings'] if row['path'] == fixture]
          if len(fixture_bindings) != 1 or fixture_bindings[0]['before_sha256'] != capability['source_sha256'][fixture] or fixture_bindings[0]['receiving_sha256'] != receiving['source_sha256'][fixture]:
              raise SystemExit('Status fixture pin differs from the independently reviewed constructor binding')
          for name, digest in capability['source_sha256'].items():
              expected = receiving['source_sha256'].get(name, digest)
              if hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Status capability source binding drift: ' + name)
          protocol = json.loads(pathlib.Path(capability['protocol']).read_text())
          if capability['limits'] != {key: protocol['design'][key] for key in ('own_turn_cap', 'submitted_action_cap')}:
              raise SystemExit('Status capability caps differ from the frozen protocol')
          exclusions = json.loads(pathlib.Path('industrial-waste/v2/regression-fixtures.json').read_text())
          if capability['fixtures']['seed'] not in exclusions['seeds']:
              raise SystemExit('Status fixture seed is not excluded from official sampling')
          provenance = {
              'scope': 'SEED_FREE_STATUS_CAPABILITY_NOT_R1_EXECUTION',
              'source_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'expected_head': os.environ['IW_V2_EXPECTED_HEAD'],
              'capability_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'accepted_predecessor_pins': capability['source_sha256'],
              'verified_receiving_pins': {**capability['source_sha256'], **receiving['source_sha256']},
              'receiving_source_manifest_sha256': hashlib.sha256(receiving_path.read_bytes()).hexdigest(),
              'disposition': 'RECEIVING_QUALIFICATION_ONLY_PENDING_ACTUAL_RESULTS_AND_INDEPENDENT_ARTIFACT_REVIEW',
              'official_initializations_by_gate': 0,
              'official_execution_authorized': False,
          }
          pathlib.Path('/tmp/iw-v2-status-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY
          python3 - <<'PY'
          import hashlib, json, pathlib
          path = pathlib.Path('industrial-waste/v2/produced-token-qualification-source.json')
          manifest = json.loads(path.read_text())
          assert manifest['scope'] == 'DETERMINISTIC_PRODUCED_TOKEN_FIXTURES_NO_R1_AUTHORITY'
          assert manifest['official_execution_authorized'] is False
          assert manifest['expected_cases'] == {'BloodFountainScenarioTest': 7, 'FanaticalOfferingScenarioTest': 11, 'CostHandlerDiscardChoiceTest': 2}
          for name, digest in manifest['source_sha256'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          pathlib.Path('/tmp/iw-v2-produced-token-provenance.json').write_text(json.dumps({
              'manifest_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'verified_source_sha256': manifest['source_sha256'],
              'expected_cases': manifest['expected_cases'],
              'official_initializations': 0,
              'official_execution_authorized': False,
          }, indent=2) + '\n')
          PY
      - name: Qualify discard choices and produced Blood and Map transactions first
        run: |
          set -o pipefail
          just test-class CostHandlerDiscardChoiceTest \
            :mtg-sets:2017-2022:tests:test --tests '*BloodFountainScenarioTest' \
            :mtg-sets:2023:tests:test --tests '*FanaticalOfferingScenarioTest' \
            --rerun-tasks --no-build-cache --no-daemon 2>&1 | tee /tmp/iw-v2-produced-token-focused.log
          python3 - <<'PY'
          import pathlib, shutil, xml.etree.ElementTree as ET
          out = pathlib.Path('/tmp/iw-v2-produced-token-focused-xml')
          out.mkdir()
          for directory, name, count in [('mtg-sets/2017-2022/tests', 'BloodFountainScenarioTest', 7), ('mtg-sets/2023/tests', 'FanaticalOfferingScenarioTest', 11), ('rules-engine', 'CostHandlerDiscardChoiceTest', 2)]:
              paths = list(pathlib.Path(directory + '/build/test-results/test').glob('TEST-*.' + name + '.xml'))
              assert len(paths) == 1, (name, paths)
              suite = ET.parse(paths[0]).getroot()
              cases = suite.findall('testcase')
              assert len(cases) == int(suite.attrib['tests']) == count, suite.attrib
              assert len({c.attrib['name'] for c in cases}) == count, name
              assert all(int(suite.attrib.get(k, 0)) == 0 for k in ('failures', 'errors', 'skipped')), suite.attrib
              assert all(c.find(k) is None for c in cases for k in ('failure', 'error', 'skipped')), name
              shutil.copyfile(paths[0], out / paths[0].name)
          PY
      - name: Qualify cards, public-information selections and unchanged legacy golden
        run: |
          set -o pipefail
          just test-class LibraryOrderingServiceTest --tests '*CostHandlerDiscardChoiceTest' \
            :mtg-sets:2003-2007:tests:test --tests '*ChromaticStarScenarioTest' --tests '*TreeOfTalesScenarioTest' --tests '*VaultOfWhispersScenarioTest' --tests '*KurgadonTest' \
            :mtg-sets:2008-2016:tests:test --tests '*AncientStirringsScenarioTest' --tests '*GolemFoundryScenarioTest' \
            :mtg-sets:2017-2022:tests:test --tests '*DarkmossBridgeScenarioTest' --tests '*BloodFountainScenarioTest' \
            :mtg-sets:2023:tests:test --tests '*DrossSkullbombScenarioTest' --tests '*CandyTrailScenarioTest' --tests '*MyrKinsmithScenarioTest' --tests '*FanaticalOfferingScenarioTest' \
            :mtg-sets:2024:tests:test --tests '*ConduitPylonsScenarioTest' \
            :mtg-sets:2025:tests:test --tests '*PactdollTerrorScenarioTest' --tests '*TownLandSpellAdventureScenarioTest' \
            :ai:test --tests '*IndustrialWasteV2RegistryAuditTest' --tests '*IndustrialWasteV2SelectionAdvisorTest' --tests '*IndustrialWasteV2PublicActionPolicyTest' --tests '*IndustrialWasteV2OrderingIntegrationTest' --tests '*IndustrialWasteV2EventMetricsTest' --tests '*IndustrialWasteV2ExecutionStatusTest' --tests '*IndustrialWasteV2RuntimeFailureTest' --tests '*IndustrialWasteV2CapabilityRunnerTest' --tests '*IndustrialWasteAdvisorModuleTest' --tests '*FrozenBaselineTest' \
            --continue --rerun-tasks --no-build-cache --no-daemon 2>&1 | tee /tmp/iw-v2-card-receiving.log
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for name, count in {'IndustrialWasteV2ExecutionStatusTest':10,'IndustrialWasteV2RuntimeFailureTest':4}.items():
              paths = list(pathlib.Path('ai/build/test-results/test').glob('TEST-*.' + name + '.xml'))
              assert len(paths) == 1, (name, paths)
              suite = ET.parse(paths[0]).getroot()
              cases = suite.findall('testcase')
              assert len(cases) == int(suite.attrib['tests']) == count, suite.attrib
              assert all(int(suite.attrib.get(k,0)) == 0 for k in ['failures','errors','skipped']), suite.attrib
              assert all(c.find(k) is None for c in cases for k in ['failure','error','skipped']), name
          PY
      - name: Generate reviewable card snapshots for only the newly admitted cards
        run: |
          just rebless-cards
          python3 - <<'PY'
          import subprocess
          expected = {'mtg-sets/src/test/resources/snapshots/cards/TSP.json', 'mtg-sets/src/test/resources/snapshots/cards/ROE.json'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if not changed <= expected:
              raise SystemExit('Unexpected snapshot or source drift: ' + repr(sorted(changed - expected)))
          PY
          git diff -- mtg-sets/src/test/resources/snapshots/cards/TSP.json mtg-sets/src/test/resources/snapshots/cards/ROE.json > /tmp/iw-v2-card-snapshot.diff
      - name: Run bounded VOW and LCI Assay differential without adopting results
        run: |
          set -o pipefail
          mkdir -p /tmp/iw-v2-assay
          git fetch --no-tags --depth=1 origin 8f8ec082343b0fedcbb6956aeb875cbe29b6ae62
          python3 - <<'PYASSAY'
          import hashlib, json, pathlib, subprocess
          base = '8f8ec082343b0fedcbb6956aeb875cbe29b6ae62'
          paths = ['oracle-assay', 'mtg-sdk', 'gradle', 'buildSrc', 'build-logic',
              'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'justfile',
              'scripts/gradle-locked', 'mtg-sets/src/test/resources/snapshots/cards/VOW.json',
              'mtg-sets/src/test/resources/snapshots/cards/LCI.json']
          subprocess.run(['git', 'diff', '--exit-code', base, '--', *paths], check=True)
          entries = subprocess.check_output(['git', 'ls-tree', '-r', 'HEAD', '--', *paths], text=True)
          assert entries == subprocess.check_output(['git', 'ls-tree', '-r', base, '--', *paths], text=True)
          pins = {line.split('\t', 1)[1]: hashlib.sha256(pathlib.Path(line.split('\t', 1)[1]).read_bytes()).hexdigest()
              for line in entries.splitlines()}
          pathlib.Path('/tmp/iw-v2-assay/input-equivalence.json').write_text(json.dumps({
              'base': base, 'candidate': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'same_tracked_assay_sdk_build_and_two_golden_inputs': True, 'git_tree_entries': entries,
              'actual_source_sha256': pins, 'engine_behavior_is_not_compared_by_assay': True,
              'divergences_require_independent_classification_not_automatic_adoption': True}, indent=2) + '\n')
          PYASSAY
          prepare_status=0
          just assay corpus > /tmp/iw-v2-assay/corpus.log 2>&1 || prepare_status=$?
          printf '%s\n' "$prepare_status" > /tmp/iw-v2-assay/corpus-exit.txt
          if [ "$prepare_status" -ne 0 ]; then exit "$prepare_status"; fi
          python3 - <<'PYASSAY'
          import gzip, hashlib, json, pathlib
          out = pathlib.Path('/tmp/iw-v2-assay')
          bulk = pathlib.Path.home() / '.cache/scryfall/_bulk-oracle-cards.jsonl.gz'
          names, ids, goldens = set(), set(), []
          for code in ['VOW', 'LCI']:
              path = pathlib.Path('mtg-sets/src/test/resources/snapshots/cards') / (code + '.json')
              current, body = None, []
              def retain():
                  if current is None: return
                  definition = json.loads('\n'.join(body))
                  names.add(current.lower())
                  if definition.get('oracleId'): ids.add(definition['oracleId'])
                  goldens.append({'set': code, 'name': current, 'oracle_id': definition.get('oracleId')})
              for line in path.read_text().splitlines():
                  if line.startswith('// '):
                      retain(); current, body = line[3:].strip(), []
                  elif current is not None: body.append(line)
              retain()
          excluded = {'art_series', 'token', 'double_faced_token', 'emblem', 'vanguard', 'scheme', 'planar'}
          selected, records = [], []
          with gzip.open(bulk, 'rb') as stream:
              for ordinal, raw in enumerate(stream, 1):
                  text = raw.strip().rstrip(b',')
                  if text in [b'', b'[', b']']: continue
                  card = json.loads(text)
                  name = card.get('name')
                  if not name or card.get('lang', 'en') != 'en' or card.get('layout', 'normal') in excluded: continue
                  if card.get('oracle_id') not in ids and name.lower() not in names and name.split(' // ')[0].lower() not in names: continue
                  selected.append(raw)
                  records.append({'bulk_line': ordinal, 'name': name, 'oracle_id': card.get('oracle_id'),
                      'raw_line_sha256': hashlib.sha256(raw).hexdigest()})
          assert len(goldens) > 0 and len(selected) > 0
          assert all(0 < sum(g['set'] == code for g in goldens) <= 1000 for code in ['VOW', 'LCI'])
          (out / 'relevant-oracle-inputs.jsonl.gz').write_bytes(gzip.compress(b''.join(selected), mtime=0))
          metadata = {'whole_bulk_bytes': bulk.stat().st_size, 'whole_bulk_sha256': hashlib.sha256(bulk.read_bytes()).hexdigest(),
              'bulk_cache_mtime_ns': bulk.stat().st_mtime_ns, 'goldens': goldens, 'selected_rows': records,
              'selection': 'All eligible full-name/front-name/oracle-id matches, retained in original bulk order; duplicates preserved so first-wins lookup matches Assay. Differential set filter is golden filename. Unmatched golden names remain visible in raw differential output.',
              'subset_sha256': hashlib.sha256((out / 'relevant-oracle-inputs.jsonl.gz').read_bytes()).hexdigest(),
              'no_engine_or_gameplay_execution': True}
          (out / 'reference-inputs.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PYASSAY
          final_status=0
          for set_code in VOW LCI; do
            status=0
            just assay-differential --set "$set_code" --top 1000 > "/tmp/iw-v2-assay/${set_code}.log" 2>&1 || status=$?
            printf '%s\n' "$status" > "/tmp/iw-v2-assay/${set_code}-exit.txt"
            if [ "$status" -ne 0 ]; then final_status=1; fi
          done
          python3 - <<'PYASSAY'
          import hashlib, json, pathlib
          out = pathlib.Path('/tmp/iw-v2-assay')
          bulk = pathlib.Path.home() / '.cache/scryfall/_bulk-oracle-cards.jsonl.gz'
          expected = json.loads((out / 'reference-inputs.json').read_text())['whole_bulk_sha256']
          actual = hashlib.sha256(bulk.read_bytes()).hexdigest()
          (out / 'reference-after.json').write_text(json.dumps({'whole_bulk_sha256': actual, 'unchanged': actual == expected}) + '\n')
          assert actual == expected, 'Oracle reference changed during bounded differential'
          PYASSAY
          exit "$final_status"
      - name: Preserve exact validation and snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industrial-waste-v2-card-qualification
          path: |
            ai/build/test-results/test/TEST-*.xml
            rules-engine/build/test-results/test/TEST-*.xml
            mtg-sets/2003-2007/tests/build/test-results/test/TEST-*.xml
            mtg-sets/2008-2016/tests/build/test-results/test/TEST-*.xml
            mtg-sets/2017-2022/tests/build/test-results/test/TEST-*.xml
            mtg-sets/2023/tests/build/test-results/test/TEST-*.xml
            mtg-sets/2024/tests/build/test-results/test/TEST-*.xml
            mtg-sets/2025/tests/build/test-results/test/TEST-*.xml
            industrial-waste/v2/runtime-evidence/registry-audit.txt
            /tmp/iw-v2-card-snapshot.diff
            /tmp/iw-v2-assay/
            /tmp/iw-v2-status-provenance.json
            /tmp/iw-v2-produced-token-provenance.json
            /tmp/iw-v2-produced-token-focused.log
            /tmp/iw-v2-card-receiving.log
            /tmp/iw-v2-produced-token-focused-xml/TEST-*.xml
            industrial-waste/v2/produced-token-qualification-source.json
            industrial-waste/v2/execution-status-capability.json
            industrial-waste/v2/execution-status-receiving-source.json
            mtg-sets/src/test/resources/snapshots/cards/TSP.json
            mtg-sets/src/test/resources/snapshots/cards/ROE.json
          if-no-files-found: error

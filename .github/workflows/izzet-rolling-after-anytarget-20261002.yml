name: Izzet Rolling Thunder after AnyTarget unlimited
on:
  push:
    branches: ["validation/izzet-rolling-after-anytarget-20261002"]
    paths: [".github/workflows/izzet-rolling-after-anytarget-20261002.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUT: /tmp/izzet-rolling-${{ github.run_id }}
      GRADLE_USER_HOME: /tmp/izzet-rolling-gradle-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - name: Bind exact Rolling Thunder candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$OUT"
          test "$(git rev-parse HEAD^)" = "e263678d0286b181ad85e97d08f7c2122c365068"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/izzet-rolling-after-anytarget-20261002.yml"
          test "$(git rev-parse HEAD^^)" = "9eed0179f807984576fd238730f08b21363b6e87"
          test "$(git rev-parse HEAD^^^^)" = "f1cc969db03a93dce068a45f72b04d502071d006"
          test "$(git hash-object mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/scripting/targets/TargetRequirement.kt)" = "9cee0c4f5acf0ea2a0392a7a8fed11ae058a8175"
          test "$(git hash-object mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/tmp/cards/RollingThunder.kt)" = "f8359187f2297f60a849523bb7629fe40cf4c0fa"
          test "$(git hash-object mtg-sets/1993-1999/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/RollingThunderScenarioTest.kt)" = "1efbe57a13484e29dc92f37f472e076616e3e9fd"
          git rev-parse HEAD HEAD^{tree} HEAD^ HEAD^^ > "$OUT/source.txt"
          printf '%s\n' 'AUTHOR_VALIDATION_ONLY_NO_GAMEPLAY_AUTHORITY' > "$OUT/authority.txt"
      - name: Compile affected modules
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sdk:compileTestKotlin :mtg-sets:1993-1999:tests:compileTestKotlin :gym:compileTestKotlin 2>&1 | tee "$OUT/compile.log"
      - name: Run AnyTarget unlimited regression
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sdk:test --tests com.wingedsheep.sdk.scripting.targets.AnyTargetUnlimitedTest 2>&1 | tee "$OUT/anytarget.log"
      - name: Run exact Rolling Thunder scenario
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :mtg-sets:1993-1999:tests:test --tests com.wingedsheep.engine.scenarios.RollingThunderScenarioTest 2>&1 | tee "$OUT/rolling.log"
          cp mtg-sets/1993-1999/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.RollingThunderScenarioTest.xml "$OUT/"
      - name: Reinventory Position-1 relative to current live composition
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain \
            :gym:test --tests com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest 2>&1 | tee "$OUT/registry.log"
          rc=${PIPESTATUS[0]}
          set -e
          XML=gym/build/test-results/test/TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml
          test -f "$XML"; cp "$XML" "$OUT/"
          REGISTRY_RC="$rc" python3 - <<'PY'
          import json,os,pathlib,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ["OUT"])
          root=ET.parse(out/"TEST-com.wingedsheep.gym.izzet.IzzetPosition1RegistryInventoryTest.xml").getroot()
          assert int(root.attrib["tests"])==55
          suffix=" is registered in current runtime"; reg=[]; miss=[]
          for c in root.iter("testcase"):
              n=c.attrib["name"]; card=n[:-len(suffix)] if n.endswith(suffix) else n
              (reg if c.find("failure") is None and c.find("error") is None else miss).append(card)
          expected={"Benevolent Blessing","Cosmic Hunger","Everflowing Chalice","Lose Focus","Skred","Snake Umbra"}
          assert set(miss)==expected, (len(reg),len(miss),sorted(miss))
          assert len(reg)==49 and len(miss)==6
          assert "Rolling Thunder" in reg
          (out/"registry-summary.json").write_text(json.dumps({
            "registered":len(reg),"missing":len(miss),"missing_names":sorted(miss),
            "official_counters_delta":{"allocations":0,"claims":0,"games":0,"outcomes":0}
          },indent=2,sort_keys=True)+"\n")
          PY
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: izzet-rolling-after-anytarget-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

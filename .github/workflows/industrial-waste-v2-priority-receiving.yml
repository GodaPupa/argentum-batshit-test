name: Industrial Waste v2 Priority Receiving

on:
  push:
    branches: [industrial-waste/v2-structural-redesign]
    paths:
      - rules-engine/src/**
      - game-server/src/**
      - ai/src/**
      - mtg-sets/**/tests/**
      - industrial-waste/v2/priority-*.json
      - industrial-waste/v2/evidence/priority-source-*/
      - lab-coordinator/shared-capabilities/collect-priority-receiving.py
      - lab-coordinator/shared-capabilities/receiving-case-banks-v1.json
      - .github/workflows/industrial-waste-v2-priority-receiving.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        bank: [priority, cast-observer]
    env:
      IW_PRIORITY_BANK: ${{ matrix.bank }}
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact receiving source and preserved bank authority
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess, urllib.request
          bank = os.environ['IW_PRIORITY_BANK']
          report = pathlib.Path('build/reports/industrial-v2-priority') / bank
          report.mkdir(parents=True, exist_ok=False)
          path = pathlib.Path('industrial-waste/v2/priority-receiving-' + bank + '.json')
          raw = path.read_bytes()
          manifest = json.loads(raw)
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          status = subprocess.check_output(['git','status','--porcelain'], text=True)
          observed = {p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
              if pathlib.Path(p).is_file() else None for p in manifest['source_files_sha256']}
          attempt = {'candidate_head':head,'tree':tree,'requested_head':os.environ['GITHUB_SHA'],
              'checkout_status':status,'manifest_sha256':hashlib.sha256(raw).hexdigest(),
              'source_files_sha256':observed,'bank':bank,'official_execution_authorized':False}
          (report/'binding-attempt.json').write_text(json.dumps(attempt,indent=2)+'\n')
          (report/'source-manifest.json').write_bytes(raw)
          assert not os.environ.get('IW_V2_R1_PREPARED_DIRECTORY')
          assert head == os.environ['GITHUB_SHA'] and not status
          subprocess.run(['git','merge-base','--is-ancestor',manifest['receiving_base'],head],check=True)
          assert observed == manifest['source_files_sha256']
          banks_raw = pathlib.Path('lab-coordinator/shared-capabilities/receiving-case-banks-v1.json').read_bytes()
          assert hashlib.sha256(banks_raw).hexdigest() == 'fbcd17ca4beda7da01a58fed7c627c66dc154bf4955d6b5556b02de9e0a82a97'
          assert manifest['stages'] == json.loads(banks_raw)['banks'][bank]
          for item in manifest['preserved_authorities']:
              assert hashlib.sha256(pathlib.Path(item['path']).read_bytes()).hexdigest() == item['sha256']
          assert manifest['frozen_r1_protocol_sha256'] == 'fd697b6d56b5a5451f4dc6f9ee4bd20584a705570c6f99861dd64f0086ed95bc'
          assert hashlib.sha256(pathlib.Path('industrial-waste/v2/protocol-v2-r1.json').read_bytes()).hexdigest() == manifest['frozen_r1_protocol_sha256']
          rules = manifest['rules']
          request = urllib.request.Request(rules['source_url'],headers={'User-Agent':'Argentum-rules-validation/1.0'})
          with urllib.request.urlopen(request,timeout=60) as response:
              rules_raw = response.read()
          (report/'effective-rules.txt').write_bytes(rules_raw)
          assert len(rules_raw) == rules['byte_length']
          assert hashlib.sha256(rules_raw).hexdigest() == rules['sha256']
          assert rules['effective_date'] <= datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          attempt['rules'] = rules
          (report/'source-provenance.json').write_text(json.dumps(attempt,indent=2)+'\n')
          PY
      - name: Execute the complete declared receiving bank
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess, time
          bank = os.environ['IW_PRIORITY_BANK']
          manifest = json.loads(pathlib.Path('industrial-waste/v2/priority-receiving-'+bank+'.json').read_text())
          root = pathlib.Path('build/reports/industrial-v2-priority') / bank
          stages = manifest['stages']
          groups = [[stage] for stage in stages] if bank == 'priority' else [
              [stage for stage in stages if stage['module'] == module]
              for module in ('rules-engine','game-server')]
          failed = False
          for index, group in enumerate(groups):
              assert group
              names = [stage['class'].rsplit('.',1)[-1] for stage in group]
              command = ['just','test-class',names[0]]
              for name in names[1:]:
                  command += ['--tests','*'+name]
              command += ['--rerun','--no-build-cache','--info','--stacktrace',
                  '--max-workers=1','-PkotlinCompileParallelism=1',
                  '-Pkotlin.compiler.execution.strategy=in-process','-Dorg.gradle.jvmargs=-Xmx4g']
              started = time.time_ns()
              log = root / ('command-'+str(index+1)+'.log')
              with log.open('wb') as handle:
                  result = subprocess.run(command,stdout=handle,stderr=subprocess.STDOUT)
              finished = time.time_ns()
              command_record = {'command':command,'exit_status':result.returncode,
                  'started_epoch_ns':started,'finished_epoch_ns':finished,
                  'classes':names,'log':log.name,
                  'scope':'Actual command covers exactly the listed group; no independent class execution is implied.'}
              (root/('command-'+str(index+1)+'.json')).write_text(json.dumps(command_record,indent=2)+'\n')
              failed |= result.returncode != 0
              for stage in group:
                  dest = root/'tests'/stage['stage']
                  dest.mkdir(parents=True,exist_ok=False)
                  (dest/'exit-status.txt').write_text(str(result.returncode)+'\n')
                  (dest/'command.json').write_text(json.dumps(command_record,indent=2)+'\n')
                  xml = pathlib.Path(stage['module'])/'build/test-results/test'/('TEST-'+stage['class']+'.xml')
                  if not xml.is_file() or xml.stat().st_mtime_ns < started - 2_000_000_000:
                      (dest/'capture-error.txt').write_text('Missing or stale XML from this actual command\n')
                      failed = True
                      if xml.is_file():
                          shutil.copyfile(xml,dest/('rejected-stale-'+xml.name))
                  else:
                      shutil.copyfile(xml,dest/xml.name)
              print(json.dumps({'bank':bank,'classes':names,'actual_exit':result.returncode}),flush=True)
          raise SystemExit(1 if failed else 0)
          PY
      - name: Require complete actual cases and unchanged receiving source
        if: always()
        run: |
          python3 lab-coordinator/shared-capabilities/collect-priority-receiving.py \
            --manifest "industrial-waste/v2/priority-receiving-${IW_PRIORITY_BANK}.json" \
            --output "build/reports/industrial-v2-priority/${IW_PRIORITY_BANK}" \
            --bank "${IW_PRIORITY_BANK}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: industrial-v2-priority-${{ matrix.bank }}
          if-no-files-found: error
          retention-days: 90
          path: build/reports/industrial-v2-priority/${{ matrix.bank }}/

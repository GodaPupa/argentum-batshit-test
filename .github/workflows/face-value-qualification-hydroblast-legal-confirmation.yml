name: Face Value Qualification Hydroblast Legal Confirmation

on:
  push:
    branches: [face-value/lab]
    paths:
      - .github/workflows/face-value-qualification-hydroblast-legal-confirmation.yml
      - experiments/face-value/qualification/audit_hydroblast_legal_confirmation.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: face-value/lab
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify inputs and build profile v4
        run: |
          set -euxo pipefail
          python3 experiments/face-value/qualification/validate_inputs.py >/dev/null
          cd experiments/face-value/qualification && sha256sum -c postboard-map-v1.sha256 && cd ../../..
          FORGE_SHA=f387ede550e336315637a8b765f0927ac768c113
          git clone --filter=blob:none https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src checkout --detach "$FORGE_SHA"
          python3 experiments/face-value/qualification/apply_forge_profile_v1.py --forge-root forge-src >/dev/null
          python3 experiments/face-value/qualification/apply_forge_profile_v2.py --forge-root forge-src >/dev/null
          python3 experiments/face-value/qualification/apply_forge_profile_v3.py --forge-root forge-src >/dev/null
          python3 experiments/face-value/qualification/apply_forge_profile_v4.py --forge-root forge-src > forge-profile-v4-id.txt
          git -C forge-src diff > forge-profile-v4.patch
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"
      - name: Materialize maps and fresh targeted seeds
        run: |
          set -euo pipefail
          mkdir -p hydro-decks hydro-legal-logs "$HOME/.forge/decks/constructed"
          python3 experiments/face-value/qualification/materialize_postboard_decks.py --output hydro-decks
          python3 - <<'PY'
          from pathlib import Path
          terror = Path('hydro-decks/opponent-mono-blue-terror.dck')
          terror.write_text(terror.read_text(encoding='utf-8').replace('4 Lorien Revealed', '4 Lórien Revealed'), encoding='utf-8')
          rows = []
          seed = 730059
          for matchup in ('mono-blue-terror', 'monster-tron'):
              for seat in (1, 2, 1, 2):
                  rows.append(f'{matchup}\t{seat}\t{seed}')
                  seed += 1
          Path('hydro-legal-assignments.tsv').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          cp hydro-decks/*.dck "$HOME/.forge/decks/constructed/"
          sha256sum hydro-decks/*.dck hydro-legal-assignments.tsv forge-profile-v4.patch > hydro-legal-inputs.sha256
          cat > hydro-legal-disposition.txt <<'EOF'
          DIAGNOSTIC_ONLY_LEGAL_HYDROBLAST_PROFILE_V4_CONFIRMATION
          Seeds 730059-730066 and all outcomes are permanently retired diagnostic material.
          This targeted confirmation addresses only absent legal Hydroblast exposure; prior blocks remain preserved.
          Results have no matchup, qualification, tuning, structural-diagnosis, or challenger authority.
          EOF
      - name: Run targeted legal confirmation
        run: |
          set -uo pipefail
          while IFS=$'\t' read -r matchup face_seat seed; do
            face="face-value-vs-${matchup}.dck"; opponent="opponent-${matchup}.dck"
            if [ "$face_seat" = 1 ]; then first="$face"; second="$opponent"; else first="$opponent"; second="$face"; fi
            log="hydro-legal-logs/${matchup}-face-seat${face_seat}-seed${seed}.log"
            timeout 300 "$FORGE_LAUNCHER" sim -d "$first" "$second" -n 1 -s "$seed" -c 120 > "$log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then printf '\nDIAGNOSTIC_PROCESS_EXIT_%s\n' "$code" >> "$log"; fi
          done < hydro-legal-assignments.tsv
          exit 0
      - name: Audit Hydroblast legal confirmation
        id: audit
        continue-on-error: true
        run: |
          python3 experiments/face-value/qualification/audit_hydroblast_legal_confirmation.py \
            --logs hydro-legal-logs --assignments hydro-legal-assignments.tsv \
            --output hydro-legal-summary.json
      - name: Preserve confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-hydroblast-legal-confirmation
          path: |
            hydro-legal-summary.json
            hydro-legal-assignments.tsv
            hydro-legal-inputs.sha256
            hydro-legal-disposition.txt
            hydro-decks/*.dck
            hydro-legal-logs/*.log
            forge-profile-v4.patch
            forge-profile-v4-id.txt
            experiments/face-value/qualification/input-validation-report.json
          if-no-files-found: warn
      - name: Enforce fail-closed confirmation gate
        if: steps.audit.outcome != 'success'
        run: exit 1

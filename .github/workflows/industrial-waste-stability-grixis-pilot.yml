name: Industrial Waste — Stability A Grixis Pilot

on:
  push:
    branches:
      - industrial-waste/lab
    paths:
      - .github/workflows/industrial-waste-stability-grixis-pilot.yml
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteStabilityGrixisPilotBenchmark.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteGrixisAdvisorModule.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteAdvisorModule.kt
      - industrial-waste/control/industrial-waste-v1.0-submitted.dck
      - industrial-waste/challengers/stability-a.dck
      - industrial-waste/gauntlet/grixis-affinity-carlos-dc-2026-09-12.dck
      - industrial-waste/seed-registry.json
      - industrial-waste/sim/**
      - justfile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability-grixis-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@v3
      - name: Validate frozen inputs
        run: |
          python3 -m unittest discover -s industrial-waste/sim -p 'test_*.py' -v
          python3 industrial-waste/sim/validate_inputs.py
      - name: Execute two-seed paired Stability A Grixis pilot
        env:
          IW_STABILITY_GRIXIS_PILOT: "true"
        run: just test-class IndustrialWasteStabilityGrixisPilotBenchmark
      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-stability-a-grixis-pilot
          path: industrial-waste/results/gate-6-stability-a-grixis-pilot-v1.json
          if-no-files-found: error

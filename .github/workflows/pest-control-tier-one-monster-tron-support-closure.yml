name: Pest Control Tier-1 Monster Tron Support Closure

on:
  pull_request:
    paths:
      - mtg-sets/1993-1999/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/ulg/cards/CropRotation.kt
      - mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/wwk/cards/BojukaBog.kt
      - mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/c20/**
      - mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/roe/cards/AncientStirrings.kt
      - mtg-sets/2024/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/mh3/cards/UnfathomableTruths.kt
      - mtg-sets/2008-2016/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/dka/cards/HauntedFengraf.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonsterTronSupportClosureTest.kt
      - docs/experiments/pest-control/tier-one-monster-tron-support-closure.md
      - .github/workflows/pest-control-tier-one-monster-tron-support-closure.yml

permissions:
  contents: read

jobs:
  support-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify non-Prototype support closure
        env:
          PEST_MONSTER_TRON_SUPPORT_CLOSURE_REPORT: ${{ github.workspace }}/build/reports/pest-monster-tron-support-closure/report.txt
        run: scripts/test-class PestControlTierOneMonsterTronSupportClosureTest --info --stacktrace

      - name: Upload support closure audit
        uses: actions/upload-artifact@v7
        with:
          name: pest-control-tier-one-monster-tron-support-closure
          path: build/reports/pest-monster-tron-support-closure/report.txt
          if-no-files-found: error
          retention-days: 90

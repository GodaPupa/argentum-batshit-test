name: Pest Control Tier-1 Monster Tron Admission Audit

on:
  pull_request:
    paths:
      - gym/src/main/kotlin/com/wingedsheep/gym/matchup/PestControlTierOneMonsterTronAdmission.kt
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneMonsterTronAdmissionTest.kt
      - .github/workflows/pest-control-tier-one-monster-tron-admission.yml
      - docs/experiments/pest-control/tier-one-monster-tron-admission.md

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Audit exact admission identity and registry support
        env:
          PEST_MONSTER_TRON_SUPPORT_REPORT: ${{ github.workspace }}/build/reports/pest-monster-tron-admission/support-audit.txt
        run: scripts/test-class PestControlTierOneMonsterTronAdmissionTest --info --stacktrace

      - name: Upload support audit
        uses: actions/upload-artifact@v7
        with:
          name: pest-control-tier-one-monster-tron-support-audit
          path: build/reports/pest-monster-tron-admission/support-audit.txt
          if-no-files-found: error
          retention-days: 90

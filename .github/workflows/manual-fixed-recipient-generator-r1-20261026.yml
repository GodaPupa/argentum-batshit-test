name: Manual fixed recipient generator early R1
on:
  push:
    branches: [validation/manual-fixed-recipient-generator-r1-20261026]
    paths: ['.github/workflows/manual-fixed-recipient-generator-r1-20261026.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: f54094584f283ace86035492b1566c16effd5be2
  SOURCE_TREE: 6b4de96afd6f13df8448ad9d49a22d9cdbf123ad
  WORKFLOW: .github/workflows/manual-fixed-recipient-generator-r1-20261026.yml
  RECORD: experiments/manual-transmission/research/fixed-recipient-generator-qualification-r1-20261026
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile normal and mutant forms then exact controls and full module golden tests
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-fixed-recipient-generator-r1-${{ github.run_id }}
          path: manual-fixed-recipient-generator-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error

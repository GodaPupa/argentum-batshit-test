name: Industrial Waste — Gate 11 Hygiene Diagnostic

on:
  push:
    branches:
      - "industrial-waste/gate-11-spy-combo-readiness"
    paths:
      - ".github/workflows/industrial-waste-g11-hygiene-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Diagnose serializer and current-branch frozen baseline
        shell: bash
        run: |
          set +e
          ./gradlew :rules-engine:test --tests '*SerializationPolymorphicRegistrationTest' --stacktrace
          ser=$?
          echo '=== SERIALIZATION JUNIT ==='
          find rules-engine/build/test-results/test -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null

          ./gradlew :ai:test --tests '*FrozenBaselineTest' --stacktrace
          base=$?
          echo '=== CURRENT FROZEN BASELINE JUNIT ==='
          find ai/build/test-results/test -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null

          if [ "$ser" -ne 0 ] || [ "$base" -ne 0 ]; then
            exit 1
          fi

  diagnose-lab-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: industrial-waste/lab
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Run accepted lab frozen baseline
        shell: bash
        run: |
          set +e
          ./gradlew :ai:test --tests '*FrozenBaselineTest' --stacktrace
          rc=$?
          echo '=== LAB FROZEN BASELINE JUNIT ==='
          find ai/build/test-results/test -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null
          exit "$rc"

name: Manual Fblthp exact card and unchanged registry qualification
on:
  push:
    branches: [validation/manual-fblthp-exact-20261003]
    paths: [.github/workflows/manual-fblthp-exact-qualification.yml]
permissions:
  contents: read
concurrency:
  group: manual-fblthp-exact-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/manual-fblthp-evidence-${{ github.run_id }}
      MT_P2_AUDIT_INPUT: /tmp/manual-fblthp-evidence-${{ github.run_id }}/registry-requests.json
      MT_P2_AUDIT_OUTPUT: /tmp/manual-fblthp-evidence-${{ github.run_id }}/registry
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact card, qualified provenance ancestor, and unchanged inventory helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PYCODE'
          import base64,hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['OUT'])
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          source='43c0143350b482ad91137cfba67a94d8d1384cd2'
          provenance='e6862c65ae796c088a5c626554cf9b3c5e0c75a9'
          workflow='.github/workflows/manual-fblthp-exact-qualification.yml'
          expected={
            'mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/war/cards/FblthpTheLost.kt':'a5564b127cb8b5b2e4d031590c145c4309ef29ed',
            'mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/FblthpTheLostScenarioTest.kt':'1f2443b130083a015b8365d46ab18c1eb2785bad'}
          helper='gym/src/test/kotlin/com/wingedsheep/gym/ManualTransmissionPhaseTwoRegistryAuditTest.kt'
          helper_blob='28a52995671550d87fba5f35d6b100a31fa23848'
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==source
          assert git('rev-parse','HEAD^^')==provenance
          assert git('diff','--name-only',source,'HEAD').splitlines()==[workflow]
          assert git('diff','--name-only',provenance,source).splitlines()==sorted(expected)
          assert not git('status','--porcelain')
          assert git('hash-object',helper)==helper_blob
          for p,blob in expected.items():
            assert git('hash-object',p)==blob,p
            (out/pathlib.Path(p).name).write_bytes(pathlib.Path(p).read_bytes())
          frozen=base64.b64decode('',validate=True)
          assert hashlib.sha256(frozen).hexdigest()=='09b8617057b9bd42fb6501f993588c9bf769e1f0af0c73426ca963da07d20084'
          (out/'registry-requests.json').write_bytes(frozen)
          request=json.loads(frozen)
          assert request['schema']=='mt-phase2-registry-requests-v1'
          assert request['phase1_commit']=='e7d37e2ea0f18dfa8d6b0fff68ef816b59555d2d'
          assert len(request['decks'])==8
          assert all(len(d['commanders'])+len(d['mainboard'])==100 for d in request['decks'])
          assert request['decks'][0]['id']=='manual-transmission-v07'
          baseline={"manual-transmission-v07": "1111111111111111111111101111010111101111111111011111011111111111101111111111111111111111111111111111", "blue-farm": "0001111110111011101001001111010011010101110101110100010110101011111101100100110000111101011101111111", "rogsi": "0001111110111101110101000011110101101010000111100101101001101010011011011011001011110111110110110010", "kinnan": "1111111110111110100011011110010100001010110100110011110000001110101011011010011101011010101010110111", "sisay": "0110111011111110110100001100000010101010101111100111011001110100001111111100011101001111000110111111", "magda": "0111101010101000101001110011000100100100101111011001111111000001010101101001101100001011000101001101", "hashaton": "0101011101110000001010010001001000111101001111000110100010100000001101100110111000101011111100111011", "shorikai": "1101111100111101010101100100101000100110011111110001011000011011011110100100100011110011110011011010"}
          assert list(baseline)==[d['id'] for d in request['decks']]
          assert sum(v.count('0') for v in baseline.values())==312
          assert baseline['manual-transmission-v07'].count('0')==7
          (out/'baseline-resolved-bits.json').write_text(json.dumps(baseline,indent=2)+'\n')
          binding={'source_head':source,'source_tree':git('rev-parse',source+'^{tree}'),
            'qualified_provenance_head':provenance,'validation_head':git('rev-parse','HEAD'),
            'validation_tree':git('rev-parse','HEAD^{tree}'),'definition_test_git_blobs':expected,
            'inventory_helper':helper,'inventory_helper_git_blob':helper_blob,
            'source_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in [*expected,helper]},
            'workflow_sha256':hashlib.sha256(pathlib.Path(workflow).read_bytes()).hexdigest(),
            'registry_requests_sha256':hashlib.sha256(frozen).hexdigest(),
            'prior_registry_run':37097563915,'prior_registry_artifact':11264654478,
            'prior_registry_artifact_sha256':'0314b2b288f7de39742979e7fc6d2df653eb2734172eb6e976df0a4c6964fce9',
            'prior_registry_report_sha256':'edbe64b5ad40f89a6438fbc5d72a512e87971bd24ebe020f7580dc063e8fb34f',
            'scope':'EXCLUDED_FIXED_EXACT_CARD_AND_REGISTRY_QUALIFICATION',
            'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
          (out/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          PYCODE
      - name: Compile affected sources and execute exact nine card cases plus read-only registry audit
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/gradle-locked --no-daemon --console=plain --continue --max-workers=1 \
            -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g \
            :mtg-sets:2017-2022:tests:test --tests com.wingedsheep.engine.scenarios.FblthpTheLostScenarioTest \
            :gym:test --tests com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest \
            2>&1 | tee "$OUT/qualification.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
          exit "$rc"
      - name: Preserve XML and require complete actual cases and only the expected inventory delta
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,shutil,xml.etree.ElementTree as ET
          out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
          expected={
            'mtg-sets/2017-2022/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.FblthpTheLostScenarioTest.xml':10,
            'gym/build/test-results/test/TEST-com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest.xml':1}
          rows=[]
          for p,count in expected.items():
            path=pathlib.Path(p)
            if not path.exists():
              rows.append({'path':p,'expected_cases':count,'missing_xml':True});continue
            shutil.copyfile(path,out/path.name)
            suite=ET.parse(path).getroot();cases=suite.findall('testcase')
            rows.append({'path':p,'expected_cases':count,'missing_xml':False,
              'xml_sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
              'cases':[{'name':c.attrib['name'],'failure':c.find('failure') is not None,
                'error':c.find('error') is not None,'skipped':c.find('skipped') is not None} for c in cases]})
          (out/'actual-cases.json').write_text(json.dumps({'suites':rows,
            'total_actual_cases':sum(len(r.get('cases',[])) for r in rows)},indent=2)+'\n')
          assert len(rows)==2 and all(not r['missing_xml'] for r in rows),rows
          assert all(len(r['cases'])==r['expected_cases'] for r in rows),rows
          assert all(len({c['name'] for c in r['cases']})==r['expected_cases'] for r in rows),rows
          assert not any(c['failure'] or c['error'] or c['skipped'] for r in rows for c in r['cases']),rows
          assert (out/'gradle-exit-code.txt').read_text().strip()=='0'
          request=json.loads((out/'registry-requests.json').read_text())
          report_path=out/'registry/registry-report.json'
          report=json.loads(report_path.read_text())
          assert report['schema']=='mt-phase2-live-registry-audit-v1'
          assert report['status']=='INVENTORY_ONLY_NOT_RULES_OR_PILOT_QUALIFICATION'
          assert report['execution_allowed'] is False
          assert report['actual_deck_games_initialized']==report['official_outcomes']==0
          assert len(report['decks'])==len(request['decks'])==8
          baseline=json.loads((out/'baseline-resolved-bits.json').read_text())
          deltas=[];summary={}
          for frozen,deck in zip(request['decks'],report['decks']):
            assert deck['deck_id']==frozen['id']
            names=frozen['commanders']+frozen['mainboard']
            assert deck['physical_cards']==len(deck['cards'])==len(names)==100
            assert deck['commander_count']==len(frozen['commanders'])
            for index,(name,card) in enumerate(zip(names,deck['cards'])):
              assert card['index']==index and card['requested_name']==name
              assert card['rules_qualified'] is False
              expected_resolved=baseline[deck['deck_id']][index]=='1'
              if card['registry_resolved']!=expected_resolved:
                deltas.append((deck['deck_id'],index,name,expected_resolved,card['registry_resolved']))
            unresolved=[c['requested_name'] for c in deck['cards'] if not c['registry_resolved']]
            summary[deck['deck_id']]={'resolved':100-len(unresolved),'unresolved':len(unresolved),'missing_names':unresolved}
          assert deltas==[('manual-transmission-v07',23,'Fblthp, the Lost',False,True)],deltas
          own=summary['manual-transmission-v07']
          assert own['unresolved']==6 and 'Fblthp, the Lost' not in own['missing_names']
          assert set(own['missing_names'])=={'Reckless Bushwhacker','Amphin Mutineer','Spellskite',
            'Phyrexian Metamorph','Disciple of Freyalise','Veil of Summer'}
          assert sum(d['unresolved'] for d in summary.values())==311
          assert (out/'registry/manual-transmission-v07-23.json').exists()
          summary_out={'decks':summary,'only_registry_delta':deltas,'physical_entries':800,
            'resolved_physical_entries':489,'unresolved_physical_entries':311,
            'registry_report_sha256':hashlib.sha256(report_path.read_bytes()).hexdigest(),
            'fblthp_definition_export_sha256':hashlib.sha256((out/'registry/manual-transmission-v07-23.json').read_bytes()).hexdigest(),
            'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0},
            'registry_presence_is_rules_or_pilot_qualification':False}
          (out/'registry-summary.json').write_text(json.dumps(summary_out,indent=2)+'\n')
          PYCODE
      - name: Digest preserved evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
          (out/'evidence-sha256.json').write_text(json.dumps({str(p.relative_to(out)):
            hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*'))
            if p.is_file() and p.name!='evidence-sha256.json'},indent=2)+'\n')
          PYCODE
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-fblthp-exact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 90

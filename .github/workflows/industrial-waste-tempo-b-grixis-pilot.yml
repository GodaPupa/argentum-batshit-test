name: Industrial Waste — Tempo B Grixis Pilot

on:
  push:
    branches: [industrial-waste/lab]
    paths:
      - .github/workflows/industrial-waste-tempo-b-grixis-pilot.yml
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteTempoBGrixisPilotBenchmark.kt
      - industrial-waste/challengers/tempo-b.dck
      - industrial-waste/protocols/gate-6-tempo-b-readiness-v1.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tempo-b-grixis-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Verify fresh disjoint reserved vector
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          namespace = "IW-G6-TEMPO-B-GRIXIS-PILOT-V1"
          expected_count = 2
          expected_digest = "141f7260e26541398054b64487f37906c368a195e8720babe54668499c0b965b"

          def seed_for(ns, index):
              raw = hashlib.sha256(f"{ns}:{index}".encode()).digest()[:8]
              value = int.from_bytes(raw, "big") & ((1 << 63) - 1)
              return value or 1

          entries = json.loads(Path("industrial-waste/seed-registry.json").read_text())
          entry = next(item for item in entries if item["namespace"] == namespace)
          assert entry["count"] == expected_count
          assert entry["status"] == "reserved"
          vector = [seed_for(namespace, i) for i in range(1, expected_count + 1)]
          digest = hashlib.sha256("\n".join(map(str, vector)).encode()).hexdigest()
          assert digest == expected_digest == entry["vector_sha256"]
          mine = set(vector)
          for other in entries:
              if other["namespace"] == namespace:
                  continue
              other_vector = {seed_for(other["namespace"], i) for i in range(1, other["count"] + 1)}
              assert mine.isdisjoint(other_vector), f"seed overlap with {other['namespace']}"
          print(f"Tempo B vector fresh/disjoint: {vector} sha256={digest}")
          PY
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v6
      - name: Execute frozen-vector pilot
        id: pilot
        continue-on-error: true
        env: {IW_TEMPO_B_GRIXIS_PILOT: "true"}
        run: ./gradlew :ai:test --tests IndustrialWasteTempoBGrixisPilotBenchmark -Dbenchmark=true --no-daemon
      - name: Diagnose test runtime
        if: always()
        run: |
          echo "pilot_outcome=${{ steps.pilot.outcome }}"
          find ai/build/test-results -type f -maxdepth 4 -print 2>/dev/null || true
          for f in ai/build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            cat "$f"
          done
      - name: Enforce pilot success
        if: always()
        run: test "${{ steps.pilot.outcome }}" = "success"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-tempo-b-grixis-pilot
          path: industrial-waste/results/gate-6-tempo-b-grixis-pilot-v1.json
          if-no-files-found: ignore

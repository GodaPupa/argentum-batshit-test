name: Manual SPORT S2 Pact card mechanics integration (FOUR CASES, NO GAMES)
on:
  push:
    branches: [research/manual-sport-s2-card-mechanics-integration-20261021]
    paths:
      - '.github/workflows/manual-sport-s2-card-mechanics-integration-20261021.yml'
      - 'experiments/manual-transmission/research/cruise-sport-race-20261021/SPORT_S2_CARD_MECHANICS_INTEGRATION_PROTOCOL.json'
permissions:
  contents: read
concurrency:
  group: manual-sport-s2-card-mechanics-exact-four
  cancel-in-progress: false

jobs:
  exact-pact-four:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4

      - name: Bind S2 qualified parent and protect gameplay, card, AI, and deck sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sport-s2-card-evidence
          test "$GITHUB_REF" = 'refs/heads/research/manual-sport-s2-card-mechanics-integration-20261021'
          parent=3ade1e75aef9b1fe9fa38ac20a2c154370400c61
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = 7984a2e87d8ddbe023d45620414d25a61691a040
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = 180918b2d7a59309e7b0617f2579fb2a6d06b7d5
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = ef5ba9dacb02bbf2a00303c9ee4724565769385a
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/modules/ManualCruiseR9ExecutableFetchAdvisorModule.kt)" = afb19c325bf38f3d82bd0fefba64e1f4057db858
          test "$(git rev-parse HEAD:mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/fut/cards/PactOfNegation.kt)" = c786551484cfb001eea9fc2b05e14ea23fd63bf9
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/event/TriggerDetector.kt)" = c95f059d375e3df107284e1081d00c449ca3f28d
          test "$(git rev-parse HEAD:rules-engine/src/test/kotlin/com/wingedsheep/engine/event/ManualSportS2DelayedTriggerMetadataTest.kt)" = cd1ca2fbf3e2c3b751b10918fec034b04a3ee001
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt)" = d02fded3fd9656aa2d032c49ce8312e1d6baaf93
          test "$(git rev-parse HEAD:mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/PactOfNegationScenarioTest.kt)" = 04a2ae1c6301f21b3ba5a77151bff3c339ed2cbb
          test "$(git rev-parse HEAD:mtg-sets/2003-2007/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/PactOfNegationUnpaidScenarioTest.kt)" = 4f546f0c30fbff1d4548ffcd39b23c5a5530d7cd
          git diff --name-only "$parent" HEAD > sport-s2-card-evidence/changed-paths.txt
          test "$(wc -l < sport-s2-card-evidence/changed-paths.txt)" -eq 2
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/manual-sport-s2-card-mechanics-integration-20261021.yml|experiments/manual-transmission/research/cruise-sport-race-20261021/SPORT_S2_CARD_MECHANICS_INTEGRATION_PROTOCOL.json) ;;
              *) echo "UNAUTHORIZED_SOURCE_DELTA:$file"; exit 1 ;;
            esac
          done < sport-s2-card-evidence/changed-paths.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("experiments/manual-transmission/research/cruise-sport-race-20261021/SPORT_S2_CARD_MECHANICS_INTEGRATION_PROTOCOL.json").read_text())
          assert p["schema"]=="ARGENTUM_MANUAL_SPORT_S2_EXISTING_CARD_MECHANICS_INTEGRATION_V1"
          assert p["status"]=="PREDECLARED_BEFORE_INTEGRATION_RUN"
          assert p["basis"]["source_parent"]=="3ade1e75aef9b1fe9fa38ac20a2c154370400c61"
          assert sum(len(z["expected_cases"]) for z in p["target_classes"].values())==4
          assert p["budget"]["new_full_games"]==0 and p["budget"]["reserved"]==2
          assert p["admission"]["merge_authorized"] is False
          print("SPORT_S2_FOUR_EXISTING_CARD_CASES_PREDECLARED_NO_GAMES")
          PY
          git rev-parse HEAD > sport-s2-card-evidence/source-sha.txt
          git rev-parse HEAD^{tree} > sport-s2-card-evidence/source-tree.txt
          echo 'NO FULL GAMES; PRECISION 10/12; TWO RESERVED; MAIN/CURRENT/R5/R9 UNTOUCHED' > sport-s2-card-evidence/budget.txt
          chmod +x gradlew scripts/gradle-locked

      - name: Execute exactly three Pact scenarios and one unpaid-decline scenario on S2 patched engine
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2003-2007:tests:cleanTest :mtg-sets:2003-2007:tests:test \
            --tests '*PactOfNegationScenarioTest' \
            --tests '*PactOfNegationUnpaidScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee sport-s2-card-evidence/four-card-scenarios.log

      - name: Audit exact four fresh JUnit cases and zero failure error skip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee sport-s2-card-evidence/junit-audit.log
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=json.loads(Path("experiments/manual-transmission/research/cruise-sport-race-20261021/SPORT_S2_CARD_MECHANICS_INTEGRATION_PROTOCOL.json").read_text())
          root=Path("mtg-sets/2003-2007/tests/build/test-results/test")
          seen=[]
          for cls,detail in p["target_classes"].items():
              xml=root / f"TEST-com.wingedsheep.engine.scenarios.{cls}.xml"
              assert xml.is_file(),f"MISSING_FRESH_XML:{xml}"
              top=ET.parse(xml).getroot()
              tests=top.findall(".//testcase")
              names=[t.attrib["name"] for t in tests]
              assert len(names)==len(detail["expected_cases"]), (cls,names)
              assert set(names)==set(detail["expected_cases"]), (cls,names)
              assert not top.findall(".//failure"), (cls,"FAILURE")
              assert not top.findall(".//error"), (cls,"ERROR")
              assert not top.findall(".//skipped"), (cls,"SKIP")
              for key in ("failures","errors","skipped"):
                  assert int(top.attrib.get(key,"0"))==0,(cls,key)
              seen.extend((cls,n) for n in names)
              print(f"{cls}: {len(names)}/{len(detail['expected_cases'])} PASS, 0 failures/errors/skips")
          assert len(seen)==4 and len(set(seen))==4
          print("SPORT_S2_CARD_INTEGRATION=PASS_FOUR_OF_FOUR_SOURCE_ONLY")
          PY

      - name: Preserve source-bound original JUnit and logs (GREEN or RED)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-sport-s2-four-card-mechanics-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            sport-s2-card-evidence/
            mtg-sets/2003-2007/tests/build/test-results/test/

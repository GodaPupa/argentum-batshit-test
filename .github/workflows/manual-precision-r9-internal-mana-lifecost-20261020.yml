name: Manual Precision R9 internal mana life-cost fidelity (NO GAMES)
on:
  push:
    branches: [research/manual-precision-r9-internal-mana-lifecost-20261020]
    paths:
      - '.github/workflows/manual-precision-r9-internal-mana-lifecost-20261020.yml'
      - 'mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9InternalManaCostScenarioTest.kt'
      - 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaAbilitySideEffectExecutor.kt'
      - 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt'
permissions:
  contents: read
concurrency:
  group: manual-precision-r9-internal-mana-lifecost
  cancel-in-progress: false
jobs:
  internal-mana-source-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 32}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify isolated delta and immutable decks/R5 (no full games)
        shell: bash
        run: |
          set -euo pipefail
          base=ab660bd77fe451716c5126e09cdf14b30b81879b
          mkdir -p r9-internal-evidence
          git rev-parse HEAD > r9-internal-evidence/source-sha.txt
          git rev-parse HEAD^{tree} > r9-internal-evidence/tree-sha.txt
          git diff --name-only "$base" HEAD > r9-internal-evidence/delta-paths.txt
          git merge-base --is-ancestor "$base" HEAD
          test "$GITHUB_REF" = "refs/heads/research/manual-precision-r9-internal-mana-lifecost-20261020"
          test "$(wc -l < r9-internal-evidence/delta-paths.txt)" -ge 2
          test "$(wc -l < r9-internal-evidence/delta-paths.txt)" -le 4
          git diff --quiet "$base" HEAD -- ai/ experiments/ rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/manual-precision-r9-internal-mana-lifecost-20261020.yml|mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9InternalManaCostScenarioTest.kt|rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaAbilitySideEffectExecutor.kt|rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt) ;;
              *) echo "UNAUTHORIZED_DELTA:$file"; exit 1 ;;
            esac
          done < r9-internal-evidence/delta-paths.txt
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = "7984a2e87d8ddbe023d45620414d25a61691a040"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          echo ZERO_FULL_GAMES > r9-internal-evidence/budget.txt
          chmod +x gradlew scripts/gradle-locked
      - name: Internal cost witness plus R8 and R9 Confluence gates
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2008-2016:tests:test \
            --tests '*ManualPrecisionR9InternalManaCostScenarioTest' \
            --tests '*ManualPrecisionR9ManaHeldoutScenarioTest' \
            --tests '*ManaConfluenceScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-internal-evidence/internal-and-confluence.log
      - name: Existing Hidden Grotto internal mana cost scenarios
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2024:tests:test \
            --tests '*HiddenGrottoTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-internal-evidence/hidden-grotto.log
      - name: Preserve original JUnit, logs, source and budget even on RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-precision-r9-internal-mana-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            r9-internal-evidence/
            mtg-sets/2008-2016/tests/build/test-results/test/
            mtg-sets/2024/tests/build/test-results/test/

name: Face Value Forge Sideboard Affinity Deglamer Replication

on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-forge-sideboard-affinity-deglamer-replication.yml]

permissions:
  contents: read

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone and build stock Forge
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src rev-parse HEAD | tee forge-source-commit.txt
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"
      - name: Freeze exact replication decks
        run: |
          set -euo pipefail
          mkdir -p decks "$HOME/.forge/decks/constructed"
          cat > 'decks/Face Value v1.2 Control.dck' <<'EOF'
          [metadata]
          Name=Face Value v1.2 Control
          Deck Type=constructed
          [main]
          4 Llanowar Elves
          4 Nest Invader
          4 Eldrazi Repurposer
          1 Eyeless Watcher
          4 Wretched Gryff
          2 It of the Horrid Swarm
          2 Annoyed Altisaur
          1 Drownyard Lurker
          1 Nyxborn Hydra
          3 Generous Ent
          4 Malevolent Rumble
          4 Preordain
          2 Snap
          1 Lose Focus
          1 Tamiyo's Safekeeping
          2 Growth Spasm
          9 Forest
          8 Island
          3 Tangled Islet
          EOF
          cat > 'decks/Face Value Affinity Deglamer 3.dck' <<'EOF'
          [metadata]
          Name=Face Value Affinity Deglamer 3
          Deck Type=constructed
          [main]
          4 Llanowar Elves
          4 Nest Invader
          4 Eldrazi Repurposer
          4 Wretched Gryff
          2 It of the Horrid Swarm
          2 Annoyed Altisaur
          1 Drownyard Lurker
          3 Generous Ent
          4 Malevolent Rumble
          3 Preordain
          2 Snap
          1 Lose Focus
          1 Tamiyo's Safekeeping
          2 Growth Spasm
          3 Deglamer
          9 Forest
          8 Island
          3 Tangled Islet
          EOF
          cat > 'decks/Grixis Affinity.dck' <<'EOF'
          [metadata]
          Name=Grixis Affinity
          Deck Type=constructed
          [main]
          4 Myr Enforcer
          4 Refurbished Familiar
          4 Krark-Clan Shaman
          4 Deadly Dispute
          4 Reckoner's Bargain
          4 Galvanic Blast
          4 Thoughtcast
          4 Ichor Wellspring
          4 Nihil Spellbomb
          4 Blood Fountain
          4 Drossforge Bridge
          4 Mistvault Bridge
          4 Silverbluff Bridge
          4 Vault of Whispers
          4 Seat of the Synod
          EOF
          cp decks/*.dck "$HOME/.forge/decks/constructed/"
          seq 1140001 1140020 > replication-seeds.txt
          sha256sum replication-seeds.txt decks/*.dck | tee replication-inputs.sha256
      - name: Run paired fresh-seed replication
        run: |
          set -euo pipefail
          mkdir -p replication-logs/control replication-logs/deg
          while read -r seed; do
            "$FORGE_LAUNCHER" sim -d 'Face Value v1.2 Control.dck' 'Grixis Affinity.dck' -n 1 -s "$seed" -c 300 > "replication-logs/control/$seed.log" 2>&1
            "$FORGE_LAUNCHER" sim -d 'Face Value Affinity Deglamer 3.dck' 'Grixis Affinity.dck' -n 1 -s "$seed" -c 300 > "replication-logs/deg/$seed.log" 2>&1
          done < replication-seeds.txt
      - name: Audit replication
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          names={'control':'Face Value v1.2 Control','deg':'Face Value Affinity Deglamer 3'}
          out={}
          for cfg,name in names.items():
            rec=[]
            for p in sorted((Path('replication-logs')/cfg).glob('*.log')):
              t=p.read_text(errors='replace')
              if re.search(r'Ai\(1\)-'+re.escape(name)+r' has won!',t): w='face'
              elif re.search(r'Ai\(2\)-Grixis Affinity has won!',t): w='affinity'
              elif 'ended in a Draw' in t: w='draw'
              else: w='unknown'
              rec.append({'seed':int(p.stem),'winner':w,'timeout':bool(re.search(r'java\.util\.concurrent\.TimeoutException|Stopping slow match as draw',t)),'stack_overflow':bool(re.search(r'java\.lang\.StackOverflowError',t)),'deglamer_casts':len(re.findall(r'cast Deglamer',t)),'gryff_emerge':len(re.findall(r'Wretched Gryff - Creature 3 / 4 \(Emerge\)',t))})
            out[cfg]={'games':len(rec),'wins':sum(x['winner']=='face' for x in rec),'losses':sum(x['winner']=='affinity' for x in rec),'draws':sum(x['winner']=='draw' for x in rec),'unknown':sum(x['winner']=='unknown' for x in rec),'timeouts':sum(x['timeout'] for x in rec),'stack_overflows':sum(x['stack_overflow'] for x in rec),'deglamer_casts':sum(x['deglamer_casts'] for x in rec),'gryff_emerge':sum(x['gryff_emerge'] for x in rec),'records':rec}
          Path('replication-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps({k:{kk:vv for kk,vv in v.items() if kk!='records'} for k,v in out.items()},indent=2,sort_keys=True))
          for cfg,v in out.items(): assert v['games']==20 and v['unknown']==0 and v['timeouts']==0 and v['stack_overflows']==0,(cfg,v)
          PY
      - name: Preserve replication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-forge-sideboard-affinity-deglamer-replication
          path: |
            replication-summary.json
            replication-seeds.txt
            replication-inputs.sha256
            replication-logs/**/*.log
            forge-source-commit.txt
            decks/*.dck
          if-no-files-found: warn

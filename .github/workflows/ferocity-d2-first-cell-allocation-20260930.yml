name: Ferocity D2 first-cell one-shot allocation
on:
  push:
    branches: ["ferocity/d2-first-cell-allocation-execute-v6-20260930"]
    paths:
      - "ferocity-recycling/support-audits/source08-policy-selection-20260928/FIRST_CELL_D2_ALLOCATION_EXECUTION_MARKER_V6_20260930.json"
permissions:
  contents: read
  actions: read
jobs:
  allocate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/devcontainers/universal:linux@sha256:584e41561451c910dcd96221634be07545803aed9cd437a60288f06ddeaf5880
    env:
      EXACT_REPO: /home/runner/work/argentum-batshit-test/argentum-batshit-test
      EXACT_RUNNER_TEMP: /home/runner/work/_temp
      FEROCITY_ACCEPTED_PATH_TOKEN: "36655120463"
      MANIFEST_SHA256: 44316db63408797e45b07cc084acc2d3479e6284601ca65f13847e348ac6662d
      JAVA_EXACT: /home/runner/work/_temp/ferocity-source08-jdk-36655120463/jdk-21.0.12.1+1/bin/java
      PYTHON_EXACT: /usr/local/python/3.14.2/bin/python3.14
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}

      - name: Bind exact independently reviewed allocation implementation
        shell: bash
        run: |
          set -euo pipefail
          EXACT_REPO_LITERAL="/home/runner/work/argentum-batshit-test/argentum-batshit-test"
          EXACT_RUNNER_TEMP_LITERAL="/home/runner/work/_temp"\n          JAVA_EXACT_LITERAL="/home/runner/work/_temp/ferocity-source08-jdk-36655120463/jdk-21.0.12.1+1/bin/java"\n          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          REVIEW=ferocity-recycling/support-audits/source08-policy-selection-20260928/FIRST_CELL_D2_ALLOCATION_CANONICAL_REPO_V6_INDEPENDENT_REVIEW_20260930.json
          MARKER=ferocity-recycling/support-audits/source08-policy-selection-20260928/FIRST_CELL_D2_ALLOCATION_EXECUTION_MARKER_V6_20260930.json
          "$PYTHON_EXACT" - "$REVIEW" "$MARKER" <<'PY'
          import json,pathlib,subprocess,sys
          review=json.loads(pathlib.Path(sys.argv[1]).read_text())
          marker=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert review["decision"]=="ACCEPT_CANONICAL_REPO_V6_IMPLEMENTATION_FOR_ONE_D2_FIRST_CELL_ALLOCATION_ORIGINAL"
          assert subprocess.check_output(["git","rev-parse","HEAD^^"],text=True).strip()==review["reviewed_implementation_commit"]
          assert marker["implementation_review_blob"]==subprocess.check_output(["git","hash-object",sys.argv[1]],text=True).strip()
          changed=subprocess.check_output(["git","diff","--name-only","HEAD^","HEAD"],text=True).splitlines()
          assert changed==[sys.argv[2]],changed
          for field,path in {
            "budget_blob":"ferocity-recycling/support-audits/source08-policy-selection-20260928/FIRST_CELL_D2_ALLOCATION_BUDGET_20260930.json",
            "verify_acceptance_blob":"ferocity-recycling/support-audits/source08-policy-selection-20260928/final-development-verify-only-36709748908-original-audit.json",
            "restore_helper_blob":"ferocity-recycling/support-audits/source08-policy-selection-20260928/prepare_current_source08_export_material.py",
            "workflow_blob":".github/workflows/ferocity-d2-first-cell-allocation-20260930.yml",
            "repair_budget_blob":"ferocity-recycling/support-audits/source08-policy-selection-20260928/FIRST_CELL_D2_ALLOCATION_CANONICAL_REPO_V6_REPAIR_BUDGET_20260930.json",
            "v5_audit_blob":"ferocity-recycling/support-audits/source08-policy-selection-20260928/d2-first-cell-allocation-36746049068-original-audit.json",
          }.items():
              actual=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert actual==review[field],(field,actual,review[field])
          assert marker["accepted_manifest_sha256"]=="44316db63408797e45b07cc084acc2d3479e6284601ca65f13847e348ac6662d"
          PY
          echo "4c275e98e459979b46ff33a08ab0e317db9267fecaffa01d3c70fd0a34711601  $PYTHON_EXACT" | sha256sum -c -

      - name: Materialize exact accepted manifest into canonical repository path
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXACT_REPO_LITERAL="/home/runner/work/argentum-batshit-test/argentum-batshit-test"
          EXACT_RUNNER_TEMP_LITERAL="/home/runner/work/_temp"\n          JAVA_EXACT_LITERAL="/home/runner/work/_temp/ferocity-source08-jdk-36655120463/jdk-21.0.12.1+1/bin/java"\n          mkdir -p "$(dirname "$EXACT_REPO_LITERAL")" "$EXACT_RUNNER_TEMP_LITERAL"
          if [ -e "$EXACT_REPO_LITERAL" ]; then
            test -d "$EXACT_REPO_LITERAL/.git"
            test "$(readlink -f "$EXACT_REPO_LITERAL")" = "$EXACT_REPO_LITERAL"
            test "$(stat -Lc '%d:%i' "$EXACT_REPO_LITERAL")" = "$(stat -Lc '%d:%i' "$GITHUB_WORKSPACE")"
          else
            cp -a "$GITHUB_WORKSPACE" "$EXACT_REPO_LITERAL"
          fi
          git config --global --add safe.directory "$EXACT_REPO_LITERAL"
          cd "$EXACT_REPO_LITERAL"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11093470964/zip" \
            -o "$EXACT_RUNNER_TEMP_LITERAL/ferocity-final-manifest-repaired.zip"
          echo "12406295c2c96b9d6e09519517edeb57c6557a25440a7184877f4431157cdadf  $EXACT_RUNNER_TEMP_LITERAL/ferocity-final-manifest-repaired.zip" | sha256sum -c -
          unzip -t "$EXACT_RUNNER_TEMP_LITERAL/ferocity-final-manifest-repaired.zip" >/dev/null
          mkdir "$EXACT_RUNNER_TEMP_LITERAL/ferocity-final-manifest-allocation"
          unzip -q "$EXACT_RUNNER_TEMP_LITERAL/ferocity-final-manifest-repaired.zip" -d "$EXACT_RUNNER_TEMP_LITERAL/ferocity-final-manifest-allocation"
          MATERIALIZED="$EXACT_RUNNER_TEMP_LITERAL/ferocity-final-manifest-allocation/build/reports/ferocity-final-manifest-watchdog-path-repair/materialized"
          test -d "$MATERIALIZED"
          cp -a "$MATERIALIZED/." "$EXACT_REPO_LITERAL/"
          MANIFEST="$EXACT_REPO_LITERAL/ferocity-recycling/evidence/admission/D2-first-cell-current/manifest.json"
          echo "$MANIFEST_SHA256  $MANIFEST" | sha256sum -c -
          test ! -e "$EXACT_REPO_LITERAL/ferocity-recycling/allocations/D2-first-cell"
          test ! -e "$EXACT_REPO_LITERAL/ferocity-recycling/evidence/development/D2-first-cell"
          test ! -e "$EXACT_REPO_LITERAL/ferocity-recycling/evidence/process/development/D2-first-cell"

      - name: Restore exact source08 runtime and Java without executing Java
        shell: bash
        run: |
          set -euo pipefail
          EXACT_REPO_LITERAL="/home/runner/work/argentum-batshit-test/argentum-batshit-test"
          EXACT_RUNNER_TEMP_LITERAL="/home/runner/work/_temp"\n          JAVA_EXACT_LITERAL="/home/runner/work/_temp/ferocity-source08-jdk-36655120463/jdk-21.0.12.1+1/bin/java"\n          cd "$EXACT_REPO_LITERAL"
          RUNNER_TEMP="$EXACT_RUNNER_TEMP_LITERAL" FEROCITY_ACCEPTED_PATH_TOKEN="$FEROCITY_ACCEPTED_PATH_TOKEN" \
            "$PYTHON_EXACT" ferocity-recycling/support-audits/source08-policy-selection-20260928/prepare_current_source08_export_material.py \
            | tee "$EXACT_RUNNER_TEMP_LITERAL/ferocity-allocation-restore.log"
          "$PYTHON_EXACT" - "$EXACT_REPO_LITERAL/build/reports/ferocity-export-plan-assembly/class-path.json" <<'PY'
          import hashlib,json,pathlib,shutil,sys
          p=pathlib.Path(sys.argv[1])
          rows=json.loads(p.read_text())
          assert len(rows)==56
          observed_runtime=pathlib.Path("/__w/_temp/ferocity-source08-runtime-36655120463")
          accepted_runtime=pathlib.Path("/home/runner/work/_temp/ferocity-source08-runtime-36655120463")
          observed_jdk=pathlib.Path("/__w/_temp/ferocity-source08-jdk-36655120463")
          accepted_jdk=pathlib.Path("/home/runner/work/_temp/ferocity-source08-jdk-36655120463")
          assert observed_runtime.is_dir() and observed_jdk.is_dir()
          assert not accepted_runtime.exists() and not accepted_jdk.exists()
          accepted_runtime.parent.mkdir(parents=True,exist_ok=True)
          # Materialize exact bytes at the historical absolute paths. Dereference any
          # distribution symlinks so every admitted runtime/JDK path is a real object.
          shutil.copytree(observed_runtime,accepted_runtime,symlinks=False,copy_function=shutil.copy2)
          shutil.copytree(observed_jdk,accepted_jdk,symlinks=False,copy_function=shutil.copy2)
          def sha_file(q):
              h=hashlib.sha256()
              with q.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              return h.hexdigest()
          def require_real_tree(root):
              assert root.is_dir() and not root.is_symlink()
              for q in root.rglob("*"):
                  assert not q.is_symlink(), q
                  assert q.is_file() or q.is_dir(), q
          require_real_tree(accepted_runtime)
          require_real_tree(accepted_jdk)
          observed_prefix=str(observed_runtime)+"/"
          accepted_prefix=str(accepted_runtime)+"/"
          for row in rows:
              raw_path=row["path"]
              assert raw_path.startswith(observed_prefix), raw_path
              q=pathlib.Path(accepted_prefix+raw_path[len(observed_prefix):])
              assert q.exists() and not q.is_symlink(), q
              row["path"]=str(q)
              if row["directory"]:
                  assert q.is_dir()
                  actual={}
                  for f in sorted(q.rglob("*")):
                      assert not f.is_symlink(), f
                      if f.is_file():
                          actual[f.relative_to(q).as_posix()]=sha_file(f)
                      else:
                          assert f.is_dir(), f
                  assert actual==row["files"], (q,len(actual),len(row["files"]))
                  digest=hashlib.sha256(json.dumps(actual,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode()).hexdigest()
                  assert digest==row["sha256"], (q,digest,row["sha256"])
              else:
                  assert q.is_file() and row["files"]=={}
                  assert sha_file(q)==row["sha256"], q
          raw=json.dumps(rows,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode()
          assert hashlib.sha256(raw).hexdigest()=="3615e99ef8a8c108eb6fc0bf4bbd65c6f8843c5bb37894cc5fa360752f103415"
          p.write_bytes(raw)
          java=pathlib.Path("/home/runner/work/_temp/ferocity-source08-jdk-36655120463/jdk-21.0.12.1+1/bin/java")
          assert java.is_file() and not java.is_symlink()
          assert sha_file(java)=="2a207f5e7d075afa01d97f8048389a64432a44c4a5af0f5e77d6e286ec5f401d"
          PY
          echo "2a207f5e7d075afa01d97f8048389a64432a44c4a5af0f5e77d6e286ec5f401d  $JAVA_EXACT_LITERAL" | sha256sum -c -
          echo "3615e99ef8a8c108eb6fc0bf4bbd65c6f8843c5bb37894cc5fa360752f103415  $EXACT_REPO_LITERAL/build/reports/ferocity-export-plan-assembly/class-path.json" | sha256sum -c -
          test ! -e "$EXACT_REPO_LITERAL/ferocity-recycling/allocations/D2-first-cell"
          test ! -e "$EXACT_REPO_LITERAL/ferocity-recycling/evidence/development/D2-first-cell"
          test ! -e "$EXACT_REPO_LITERAL/ferocity-recycling/evidence/process/development/D2-first-cell"

      - name: Execute exactly one allocation invocation and no game
        shell: bash
        run: |
          set -euo pipefail
          EXACT_REPO_LITERAL="/home/runner/work/argentum-batshit-test/argentum-batshit-test"
          EXACT_RUNNER_TEMP_LITERAL="/home/runner/work/_temp"\n          JAVA_EXACT_LITERAL="/home/runner/work/_temp/ferocity-source08-jdk-36655120463/jdk-21.0.12.1+1/bin/java"\n          cd "$EXACT_REPO_LITERAL"
          OUT="$EXACT_REPO_LITERAL/build/reports/ferocity-d2-first-cell-allocation"
          mkdir -p "$OUT"
          MANIFEST="$EXACT_REPO_LITERAL/ferocity-recycling/evidence/admission/D2-first-cell-current/manifest.json"
          CP="$("$PYTHON_EXACT" - "$MANIFEST" <<'PY'
          import json,sys,os
          m=json.load(open(sys.argv[1]))
          print(os.pathsep.join(x["path"] for x in m["source"]["classPath"]))
          PY
          )"
          printf '%s\n' "$JAVA_EXACT_LITERAL" "-Xmx2048m" "-cp" "$CP" \
            "com.wingedsheep.gym.ferocity.FerocityDevelopmentCli" "allocate" \
            "$EXACT_REPO_LITERAL" "$MANIFEST" "$MANIFEST_SHA256" > "$OUT/argv.txt"
          set +e
          "$JAVA_EXACT_LITERAL" -Xmx2048m -cp "$CP" \
            com.wingedsheep.gym.ferocity.FerocityDevelopmentCli \
            allocate "$EXACT_REPO_LITERAL" "$MANIFEST" "$MANIFEST_SHA256" \
            >"$OUT/stdout.json" 2>"$OUT/stderr.log"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/exit-code.txt"
          ALLOC="$EXACT_REPO_LITERAL/ferocity-recycling/allocations/D2-first-cell"
          if [ "$rc" -eq 0 ]; then
            test -f "$ALLOC/ALLOCATION_INTENT.json"
            test -f "$ALLOC/ledger.json"
            "$PYTHON_EXACT" - "$OUT/stdout.json" "$ALLOC/ALLOCATION_INTENT.json" "$ALLOC/ledger.json" <<'PY'
          import hashlib,json,pathlib,sys
          stdout=json.loads(pathlib.Path(sys.argv[1]).read_text())
          intent=json.loads(pathlib.Path(sys.argv[2]).read_text())
          ledger=pathlib.Path(sys.argv[3])
          ledger_sha=hashlib.sha256(ledger.read_bytes()).hexdigest()
          assert stdout["status"]=="LEDGER_DURABLE_NO_GAME",stdout
          assert stdout["ledgerSha256"]==ledger_sha
          assert stdout["logicalSourceCommit"]=="3a4f99a7653839506e96d19e6639f58d9e8c5ced"
          assert intent["admissionSha256"]=="44316db63408797e45b07cc084acc2d3479e6284601ca65f13847e348ac6662d"
          assert intent["cellId"]=="D2-FIRST-A3-RED"
          assert len(intent["allocations"])==16 and len(set(intent["allocations"]))==16
          assert intent["entropyCalls"]==48
          assert intent["replacementsAuthorized"]==0
          receipt={
            "schema":"ferocity-d2-first-cell-allocation-result-v1",
            "status":"LEDGER_DURABLE_NO_GAME",
            "manifest_sha256":intent["admissionSha256"],
            "ledger_sha256":ledger_sha,
            "allocation_identities":16,
            "seed_streams":48,
            "replacements_authorized":0,
            "trial_claims":0,
            "games_initialized":0,
            "outcomes_exposed":0,
            "official_state":{"claims":0,"allocations":16,"seed_streams":48,"games":0,"outcomes":0}
          }
          pathlib.Path(sys.argv[1]).parent.joinpath("result.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          PY
            test ! -e "$EXACT_REPO_LITERAL/ferocity-recycling/evidence/development/D2-first-cell"
            test ! -e "$EXACT_REPO_LITERAL/ferocity-recycling/evidence/process/development/D2-first-cell"
          fi
          echo "$MANIFEST_SHA256  $MANIFEST" | sha256sum -c - > "$OUT/post-hashes.txt"
          echo "2a207f5e7d075afa01d97f8048389a64432a44c4a5af0f5e77d6e286ec5f401d  $JAVA_EXACT_LITERAL" | sha256sum -c - >> "$OUT/post-hashes.txt"
          exit "$rc"

      - name: Preserve exact allocation original
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EXACT_REPO_LITERAL="/home/runner/work/argentum-batshit-test/argentum-batshit-test"
          EXACT_RUNNER_TEMP_LITERAL="/home/runner/work/_temp"\n          JAVA_EXACT_LITERAL="/home/runner/work/_temp/ferocity-source08-jdk-36655120463/jdk-21.0.12.1+1/bin/java"\n          DEST="$GITHUB_WORKSPACE/build/reports/ferocity-d2-first-cell-allocation-preserved"
          mkdir -p "$DEST"
          cp -a "$EXACT_REPO_LITERAL/build/reports/ferocity-d2-first-cell-allocation/." "$DEST/" 2>/dev/null || true
          cp "$EXACT_RUNNER_TEMP_LITERAL/ferocity-allocation-restore.log" "$DEST/" 2>/dev/null || true
          cp "$EXACT_REPO_LITERAL/build/reports/ferocity-export-plan-assembly/restore-receipt.json" "$DEST/" 2>/dev/null || true
          cp "$EXACT_REPO_LITERAL/build/reports/ferocity-export-plan-assembly/class-path.json" "$DEST/" 2>/dev/null || true
          cp "$EXACT_REPO_LITERAL/ferocity-recycling/evidence/admission/D2-first-cell-current/manifest.json" "$DEST/" 2>/dev/null || true
          if [ -d "$EXACT_REPO_LITERAL/ferocity-recycling/allocations/D2-first-cell" ]; then
            mkdir -p "$DEST/allocation"
            cp -a "$EXACT_REPO_LITERAL/ferocity-recycling/allocations/D2-first-cell/." "$DEST/allocation/"
          fi

      - name: Upload exact allocation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ferocity-d2-first-cell-allocation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/ferocity-d2-first-cell-allocation-preserved/
          if-no-files-found: error
          retention-days: 90

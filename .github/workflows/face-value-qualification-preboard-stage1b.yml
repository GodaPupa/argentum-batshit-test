name: Face Value Qualification Preboard Stage 1B

on:
  push:
    branches: [face-value/lab]
    paths:
      - experiments/face-value/qualification/preboard-stage1b-seed-registry.json
      - experiments/face-value/qualification/preboard-stage1b-seed-registry.sha256
      - .github/workflows/face-value-qualification-preboard-stage1b.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: face-value-qualification-preboard-stage1b
  cancel-in-progress: false

jobs:
  execute-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: face-value/lab
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate immutable inputs and frozen assignment vector
        run: |
          set -euo pipefail
          python3 experiments/face-value/qualification/validate_inputs.py >/dev/null
          cd experiments/face-value/qualification
          sha256sum -c preboard-stage1b-seed-registry.sha256
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          data = json.loads(Path('preboard-stage1b-seed-registry.json').read_text())
          rows = data['assignments']
          seeds = [row['seed'] for row in rows]
          assert data['classification'] == 'OFFICIAL_QUALIFICATION_PREBOARD_STAGE1B_HYBRID_SCOPE'
          assert data['design'] == {
              'full_gauntlet_aggregate_permitted': False,
              'games_per_matchup': 32,
              'games_per_seat_per_matchup': 16,
              'matchups': 7,
              'outcomes_exposed_before_freeze': 0,
              'total_games': 224,
          }
          assert len(rows) == len(set(seeds)) == 224
          assert all(0 < seed < 2**63 for seed in seeds)
          assert not (set(seeds) & (set(range(710001, 710009)) | set(range(720001, 720177))))
          counts = Counter((row['matchup'], row['face_value_seat']) for row in rows)
          assert len(counts) == 14 and set(counts.values()) == {16}, counts
          assert [row['run_index'] for row in rows] == list(range(1, 225))
          PY
      - name: Build the capability-qualified Forge snapshot once
        run: |
          set -euxo pipefail
          FORGE_SHA=f387ede550e336315637a8b765f0927ac768c113
          git clone --filter=blob:none https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src checkout --detach "$FORGE_SHA"
          test "$(git -C forge-src rev-parse HEAD)" = "$FORGE_SHA"
          printf '%s\n' "$FORGE_SHA" > forge-source-commit.txt
          python3 experiments/face-value/qualification/apply_forge_profile_v1.py --forge-root forge-src > forge-profile-v1-id.txt
          test "$(cat forge-profile-v1-id.txt)" = 'FACE_VALUE_QUALIFICATION_FORGE_PROFILE_V1'
          python3 experiments/face-value/qualification/apply_forge_profile_v2.py --forge-root forge-src > forge-profile-id.txt
          test "$(cat forge-profile-id.txt)" = 'FACE_VALUE_QUALIFICATION_FORGE_PROFILE_V2'
          git -C forge-src diff > forge-profile-v2.patch
          test -s forge-profile-v2.patch
          sha256sum forge-profile-v2.patch experiments/face-value/qualification/apply_forge_profile_v1.py experiments/face-value/qualification/apply_forge_profile_v2.py > forge-profile-v2.sha256
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"
      - name: Install frozen decks and materialize assignments
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.forge/decks/constructed" preboard-stage1b-logs runtime-decks
          cp experiments/face-value/qualification/control/*.dck "$HOME/.forge/decks/constructed/"
          cp experiments/face-value/qualification/opponents/*.dck runtime-decks/
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('experiments/face-value/qualification')
          terror = Path('runtime-decks/mono-blue-terror-luminati-2026-09-19.dck')
          text = terror.read_text(encoding='utf-8')
          assert text.count('4 Lorien Revealed') == 1
          terror.write_text(text.replace('4 Lorien Revealed', '4 Lórien Revealed'), encoding='utf-8')
          rows = json.loads((root / 'preboard-stage1b-seed-registry.json').read_text())['assignments']
          with Path('preboard-stage1b-assignments.tsv').open('w') as out:
              for row in rows:
                  opponent = Path(row['opponent_file']).name
                  print(row['run_index'], row['matchup'], opponent, row['face_value_seat'], row['seed'], sep='\t', file=out)
          PY
          cp runtime-decks/*.dck "$HOME/.forge/decks/constructed/"
          sha256sum \
            experiments/face-value/qualification/input-identities.sha256 \
            experiments/face-value/qualification/preboard-stage1b-seed-registry.json \
            preboard-stage1b-assignments.tsv \
            runtime-decks/*.dck \
            forge-profile-v2.patch \
            forge-source-commit.txt > preboard-stage1b-inputs.sha256
      - name: Execute all frozen assignments once
        run: |
          set -uo pipefail
          control='fv-temur-chrysalis-e-final-forge-75.dck'
          : > preboard-stage1b-exit-status.tsv
          while IFS=$'\t' read -r run_index matchup opponent face_seat seed; do
            log=$(printf 'preboard-stage1b-logs/%03d-%s-seat%s-%s.log' "$run_index" "$matchup" "$face_seat" "$seed")
            if [ "$face_seat" = 1 ]; then
              timeout 300 "$FORGE_LAUNCHER" sim -d "$control" "$opponent" -n 1 -s "$seed" -c 120 > "$log" 2>&1
            else
              timeout 300 "$FORGE_LAUNCHER" sim -d "$opponent" "$control" -n 1 -s "$seed" -c 120 > "$log" 2>&1
            fi
            status=$?
            printf '%s\t%s\t%s\n' "$run_index" "$seed" "$status" >> preboard-stage1b-exit-status.tsv
          done < preboard-stage1b-assignments.tsv
          exit 0
      - name: Fail-closed automated audit and telemetry extraction
        id: audit
        run: |
          python3 - <<'PY'
          from collections import Counter, defaultdict
          from pathlib import Path
          import json, math, re

          control_name = 'Face Value Temur Chrysalis E Final Forge 75'
          exits = {}
          for line in Path('preboard-stage1b-exit-status.tsv').read_text().splitlines():
              index, seed, status = line.split('\t')
              exits[int(index)] = int(status)
          records = []
          bad_patterns = {
              'exception': r'Exception|StackOverflowError|AssertionError',
              'slow_draw': r'Stopping slow match as draw',
              'missing_deck': r'Deck not found|Unable to load deck',
              'unsupported': r'UnsupportedOperationException|not implemented',
          }
          key_cards = [
              'Llanowar Elves', 'Nest Invader', 'Eldrazi Repurposer', 'Eyeless Watcher',
              'Writhing Chrysalis', 'Wretched Gryff', 'It of the Horrid Swarm',
              'Annoyed Altisaur', 'Drownyard Lurker', 'Generous Ent',
              'Malevolent Rumble', 'Growth Spasm', 'Snap', 'Preordain',
          ]
          for line in Path('preboard-stage1b-assignments.tsv').read_text().splitlines():
              index_s, matchup, opponent, seat_s, seed_s = line.split('\t')
              index, seat, seed = int(index_s), int(seat_s), int(seed_s)
              glob = list(Path('preboard-stage1b-logs').glob(f'{index:03d}-{matchup}-seat{seat}-{seed}.log'))
              path = glob[0] if len(glob) == 1 else None
              text = path.read_text(errors='replace') if path else ''
              opp_seat = 3 - seat
              win_face = bool(re.search(rf'Ai\({seat}\)-{re.escape(control_name)} has won!', text))
              win_opp = bool(re.search(rf'Ai\({opp_seat}\)-.+ has won!', text))
              draw = 'ended in a Draw' in text
              terminal_count = sum((win_face, win_opp, draw))
              flags = [name for name, pattern in bad_patterns.items() if re.search(pattern, text, re.I)]
              if exits.get(index, 999) != 0:
                  flags.append(f'process_exit_{exits.get(index, "missing")}')
              if terminal_count != 1:
                  flags.append(f'terminal_count_{terminal_count}')
              if len(re.findall(r'^Game Outcome: .+ has won because', text, re.I | re.M)) > 1:
                  flags.append('contradictory_terminal_bookkeeping')
              turns = [int(x) for x in re.findall(r'^Turn: Turn (\d+)', text, re.M)]
              keep = {}
              for player_seat, label in ((seat, 'face'), (opp_seat, 'opponent')):
                  sizes = re.findall(rf'Mulligan: Ai\({player_seat}\)-.+ has kept a hand of (\d+) cards', text)
                  keep[label] = int(sizes[-1]) if sizes else None
                  if keep[label] is None:
                      flags.append(f'missing_{label}_mulligan')
              casts = {
                  card: len(re.findall(rf'Ai\({seat}\)-{re.escape(control_name)} cast {re.escape(card)}(?:\s|$)', text, re.M))
                  for card in key_cards
              }
              opponent_metrics = {
                  'faithless_looting_casts': len(re.findall(r'cast Faithless Looting', text, re.I)),
                  'highway_robbery_casts': len(re.findall(r'cast Highway Robbery', text, re.I)),
                  'lorien_uses': len(re.findall(r'(?:cast|activated) L.rien Revealed', text, re.I)),
                  'shaman_casts': len(re.findall(r'cast Krark-Clan Shaman', text, re.I)),
                  'shaman_activations': len(re.findall(r'activated Krark-Clan Shaman', text, re.I)),
                  'reckoners_bargain_casts': len(re.findall(r"cast Reckoner's Bargain", text, re.I)),
                  'prism_casts': len(re.findall(r'cast Prophetic Prism', text, re.I)),
                  'ranger_casts': len(re.findall(r'cast Quirion Ranger', text, re.I)),
                  'ranger_activations': len(re.findall(r'activated Quirion Ranger', text, re.I)),
                  'winding_way_casts': len(re.findall(r'cast Winding Way', text, re.I)),
              }
              joint = violations = 0
              for chunk in re.split(r'(?=^Turn: Turn )', text, flags=re.M):
                  rally = [m.start() for m in re.finditer(r'cast Rally at the Hornburg', chunk, re.I)]
                  bush = [m.start() for m in re.finditer(r'cast Goblin Bushwhacker', chunk, re.I)]
                  if rally and bush:
                      joint += 1
                      violations += int(min(bush) < min(rally))
              opponent_metrics['rally_bushwhacker_joint_turns'] = joint
              opponent_metrics['rally_order_violations'] = violations
              records.append({
                  'run_index': index,
                  'matchup': matchup,
                  'opponent_file': opponent,
                  'face_value_seat': seat,
                  'seed': seed,
                  'log': str(path) if path else None,
                  'process_exit': exits.get(index),
                  'winner': 'face_value' if win_face else 'opponent' if win_opp else 'draw' if draw else 'unknown',
                  'turns': max(turns) if turns else None,
                  'face_kept': keep['face'],
                  'opponent_kept': keep['opponent'],
                  'face_casts': casts,
                  'face_ent_landcycles': len(re.findall(rf'Ai\({seat}\)-{re.escape(control_name)} activated Generous Ent', text)),
                  'opponent_metrics': opponent_metrics,
                  'flags': sorted(set(flags)),
              })

          requirements = {
              'mono-red-madness': {'faithless_looting_casts': 1, 'highway_robbery_casts': 1},
              'mono-blue-terror': {'lorien_uses': 1},
              'grixis-affinity': {'shaman_casts': 1, 'shaman_activations': 1, 'reckoners_bargain_casts': 1},
              'monster-tron': {'prism_casts': 1},
              'jund-wildfire': {'shaman_casts': 1, 'shaman_activations': 1},
              'elves': {'ranger_casts': 1, 'ranger_activations': 1, 'winding_way_casts': 1},
              'mono-red-rally': {'rally_bushwhacker_joint_turns': 1, 'rally_order_violations': 0},
          }
          blocks = {}
          for matchup in sorted({r['matchup'] for r in records}):
              rr = [r for r in records if r['matchup'] == matchup]
              flagged = [r for r in rr if r['flags']]
              opponent_totals = {
                  key: sum(r['opponent_metrics'][key] for r in rr)
                  for key in rr[0]['opponent_metrics']
              } if rr else {}
              capability_reasons = []
              for metric, required in requirements[matchup].items():
                  value = opponent_totals.get(metric, 0)
                  if metric == 'rally_order_violations':
                      if value != required:
                          capability_reasons.append(f'{metric}={value}, required {required}')
                  elif value < required:
                      capability_reasons.append(f'{metric}={value}, required at least {required}')
              seats = {}
              for seat in (1, 2):
                  ss = [r for r in rr if r['face_value_seat'] == seat]
                  seats[str(seat)] = {
                      'games': len(ss),
                      'wins': sum(r['winner'] == 'face_value' for r in ss),
                      'losses': sum(r['winner'] == 'opponent' for r in ss),
                      'draws': sum(r['winner'] == 'draw' for r in ss),
                  }
              blocks[matchup] = {
                  'disposition': 'AUTOMATED_AUDIT_GREEN_PENDING_GAMEPLAY_REVIEW' if not flagged and not capability_reasons and len(rr) == 32 else 'QUARANTINED',
                  'games': len(rr),
                  'flagged_games': len(flagged),
                  'capability_reasons': capability_reasons,
                  'opponent_metrics': opponent_totals,
                  'seats': seats,
              }
          summary = {
              'classification': 'OFFICIAL_QUALIFICATION_PREBOARD_STAGE1B_HYBRID_SCOPE',
              'acceptance': 'PENDING_GAMEPLAY_QUALITY_AUDIT',
              'expected_games': 224,
              'games_found': len(records),
              'flagged_games': sum(bool(r['flags']) for r in records),
              'blocks': blocks,
              'records': records,
          }
          Path('preboard-stage1b-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          green = len(records) == 224 and summary['flagged_games'] == 0 and all(
              v['games'] == 32 and not v['capability_reasons'] for v in blocks.values()
          )
          Path('preboard-stage1b-automated-audit.txt').write_text('GREEN_PENDING_GAMEPLAY_REVIEW\n' if green else 'QUARANTINED\n')
          print(json.dumps({'games_found': len(records), 'flagged_games': summary['flagged_games'], 'block_dispositions': {k:v['disposition'] for k,v in blocks.items()}}, indent=2))
          assert green, summary
          PY
      - name: Package immutable raw evidence
        if: always()
        run: |
          set -euo pipefail
          if [ ! -d preboard-stage1b-logs ]; then
            mkdir preboard-stage1b-logs
            printf 'No game execution occurred in workflow run %s.\n' "$GITHUB_RUN_ID" > preboard-stage1b-logs/NO_GAMES_EXECUTED.txt
          fi
          if [ ! -f preboard-stage1b-exit-status.tsv ]; then
            : > preboard-stage1b-exit-status.tsv
          fi
          if [ ! -f preboard-stage1b-summary.json ]; then
            printf '{"acceptance":"INFRASTRUCTURE_FAILURE_NO_GAME_EXECUTION","workflow_run_id":%s}\n' "$GITHUB_RUN_ID" > preboard-stage1b-summary.json
          fi
          if [ ! -f preboard-stage1b-automated-audit.txt ]; then
            printf 'INFRASTRUCTURE_FAILURE_NO_GAME_EXECUTION\n' > preboard-stage1b-automated-audit.txt
          fi
          if [ ! -f preboard-stage1b-inputs.sha256 ]; then
            printf 'unavailable: workflow failed before input materialization\n' > preboard-stage1b-inputs.sha256
          fi
          if [ ! -f forge-source-commit.txt ]; then
            printf 'unavailable: workflow failed before Forge checkout\n' > forge-source-commit.txt
          fi
          for profile_file in forge-profile-id.txt forge-profile-v1-id.txt forge-profile-v2.patch forge-profile-v2.sha256; do
            if [ ! -f "$profile_file" ]; then
              printf 'unavailable: workflow failed before profile materialization\n' > "$profile_file"
            fi
          done
          tar -czf preboard-stage1b-raw-logs.tar.gz preboard-stage1b-logs preboard-stage1b-exit-status.tsv
          sha256sum preboard-stage1b-raw-logs.tar.gz preboard-stage1b-summary.json > preboard-stage1b-evidence.sha256
      - name: Preserve evidence on the laboratory branch
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          dest="experiments/face-value/qualification/evidence/preboard-stage1b/run-${RUN_ID}"
          test ! -e "$dest"
          mkdir -p "$dest"
          cp preboard-stage1b-summary.json preboard-stage1b-automated-audit.txt preboard-stage1b-evidence.sha256 preboard-stage1b-inputs.sha256 forge-source-commit.txt forge-profile-id.txt forge-profile-v1-id.txt forge-profile-v2.patch forge-profile-v2.sha256 "$dest/"
          cp preboard-stage1b-raw-logs.tar.gz "$dest/"
          printf 'workflow_run=https://github.com/%s/actions/runs/%s\nhead_sha=%s\n' "$GITHUB_REPOSITORY" "$RUN_ID" "$HEAD_SHA" > "$dest/provenance.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$dest"
          git commit -m "face-value: preserve preboard stage 1B evidence run ${RUN_ID}"
          git push origin HEAD:face-value/lab
      - name: Upload redundant workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-qualification-preboard-stage1b-${{ github.run_id }}
          path: |
            preboard-stage1b-summary.json
            preboard-stage1b-automated-audit.txt
            preboard-stage1b-evidence.sha256
            preboard-stage1b-inputs.sha256
            preboard-stage1b-raw-logs.tar.gz
            forge-source-commit.txt
            forge-profile-id.txt
            forge-profile-v1-id.txt
            forge-profile-v2.patch
            forge-profile-v2.sha256
          if-no-files-found: error

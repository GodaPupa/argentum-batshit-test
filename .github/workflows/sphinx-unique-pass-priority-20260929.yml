name: Sphinx unique-pass priority receiving
on:
  push:
    branches: ["sphinx/unique-pass-priority-20260929"]
    paths: [".github/workflows/sphinx-unique-pass-priority-20260929.yml"]
permissions: {contents: read}
jobs:
  two-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 5}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact unique-pass candidate
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/sphinx-unique-pass-priority
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD^)" = "e993dbf48ecbf548ad27609dfa85c853c69b6fa3"
          git merge-base --is-ancestor fecc132822a63fe0c7572c255725f37ef61f1be5 HEAD
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEWholeActor.kt)" = "dd9c493db93b0664ad07ceef97a9bbbc20943091"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEUniquePassPriorityReceivingTest.kt)" = "d7a141cf2be33dd5eed826aa7bb52460c66a5209"
          test "$(git hash-object sphinx-approach/STAGE_E_UNIQUE_PASS_PRIORITY_BUDGET_20260929.json)" = "1f7a56cd1bbbeb9ecd88302bfa2df0d99e447791"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEMultiCastDiscriminatorReceivingTest.kt)" = "6b794b196d4ff65ab3a7fff5f14febb8f310ab35"
          test "$(git hash-object sphinx-approach/decks/reconstructed-v01.csv)" = "e2f0abbc9f99be97b2562a18ae248d70cbefc0e1"
          test "$(git hash-object sphinx-approach/decks/reconstructed-hybrid.csv)" = "7f76c94e4fbc24acdc982039aa248a1fa9485cd4"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEWholeActor.kt
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEUniquePassPriorityReceivingTest.kt
            git hash-object sphinx-approach/STAGE_E_UNIQUE_PASS_PRIORITY_BUDGET_20260929.json
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEMultiCastDiscriminatorReceivingTest.kt
            git hash-object sphinx-approach/decks/reconstructed-v01.csv
            git hash-object sphinx-approach/decks/reconstructed-hybrid.csv
            git hash-object .github/workflows/sphinx-unique-pass-priority-20260929.yml
            git status --porcelain
          } > "$OUT/source.txt"
      - name: Execute exact unique-pass receiving bank
        shell: bash
        run: |
          set -o pipefail
          OUT=build/reports/sphinx-unique-pass-priority
          just test-class SphinxStageEUniquePassPriorityReceivingTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee "$OUT/unique-pass.log"
          xml="$(find . -path '*/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageEUniquePassPriorityReceivingTest.xml' -type f -print -quit)"
          test -n "$xml" && test -s "$xml"
          cp "$xml" "$OUT/"
      - name: Regress accepted bounded multi-cast discriminator
        shell: bash
        run: |
          set -o pipefail
          OUT=build/reports/sphinx-unique-pass-priority
          just test-class SphinxStageEMultiCastDiscriminatorReceivingTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee "$OUT/multicast-regression.log"
          xml="$(find . -path '*/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageEMultiCastDiscriminatorReceivingTest.xml' -type f -print -quit)"
          test -n "$xml" && test -s "$xml"
          cp "$xml" "$OUT/"
      - name: Validate preserved XML
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          out=pathlib.Path("build/reports/sphinx-unique-pass-priority")
          result={}
          for cls,expected in [
              ("SphinxStageEUniquePassPriorityReceivingTest",2),
              ("SphinxStageEMultiCastDiscriminatorReceivingTest",2),
          ]:
              p=out/f"TEST-com.wingedsheep.gym.sphinx.{cls}.xml"
              root=ET.parse(p).getroot()
              row={k:int(root.attrib.get(k,"0")) for k in ("tests","failures","errors","skipped")}
              assert row["tests"]==expected and row["failures"]==0 and row["errors"]==0 and row["skipped"]==0, (cls,row)
              result[cls]=row
          (out/"summary.json").write_text(json.dumps(result,indent=2)+"\n")
          PY
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-unique-pass-priority-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-unique-pass-priority/
          if-no-files-found: error
          retention-days: 90

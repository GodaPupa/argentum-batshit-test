name: Manual authorized one-test exception and dependent R1
on:
  push:
    branches: [validation/manual-fblthp-one-test-exception-r1-20261029]
    paths: ['.github/workflows/manual-fblthp-one-test-exception-r1-20261029.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: ce5145a2f3a361ad202ebc9cb86ef5b88a57dfc3
  SOURCE_TREE: 7492a347e325f51c682d74c507a907f0d4e29b4c
  WORKFLOW: .github/workflows/manual-fblthp-one-test-exception-r1-20261029.yml
  RECORD: experiments/manual-transmission/research/fblthp-one-test-exception-r1-20261029
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web-client/package-lock.json}
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile all forms then focused controls, card, ordinary and client gates
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-fblthp-one-test-exception-r1-${{ github.run_id }}
          path: manual-fblthp-one-test-exception-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

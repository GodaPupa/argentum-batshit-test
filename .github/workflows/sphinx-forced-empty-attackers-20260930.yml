name: Sphinx forced-empty attackers receiving
on:
  push:
    branches: ["sphinx/forced-empty-attackers-20260930"]
    paths: [".github/workflows/sphinx-forced-empty-attackers-20260930.yml"]
permissions: {contents: read}
jobs:
  two-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 5}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact forced-empty combat candidate
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/reports/sphinx-forced-empty-attackers
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD~4)" = "d5a6fa73f95552632ab5171da9ca38035a707fb6"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEWholeActor.kt)" = "08ce654878257d469d5af5a1b72e7fd0186bc674"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEForcedEmptyAttackersReceivingTest.kt)" = "4c2fdbc3c408822dda64216c3ad91882bd81b6c1"
          test "$(git hash-object sphinx-approach/STAGE_E_FORCED_EMPTY_ATTACKERS_BUDGET_20260930.json)" = "5903d672ff9c35597df70382e7a7e3337d421340"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/legalactions/enumerators/CombatEnumerator.kt)" = "15d5642cd0d22baeb5e8b3ccb79e62de563f784a"
          test "$(git hash-object rules-engine/src/main/kotlin/com/wingedsheep/engine/core/GameAction.kt)" = "f7e36eb2416756fd4fbe3c22bb76c3c0c71d7ac0"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/actorinput/ActorLegalAction.kt)" = "5931e80c5c35f52b91e6143c7ba0b777be67e623"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEUniquePassPriorityReceivingTest.kt)" = "d7a141cf2be33dd5eed826aa7bb52460c66a5209"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEMultiCastDiscriminatorReceivingTest.kt)" = "6b794b196d4ff65ab3a7fff5f14febb8f310ab35"
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git rev-parse HEAD^^
            git rev-parse HEAD~3
            git rev-parse HEAD~4
            git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEWholeActor.kt
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEForcedEmptyAttackersReceivingTest.kt
            git hash-object sphinx-approach/STAGE_E_FORCED_EMPTY_ATTACKERS_BUDGET_20260930.json
            git hash-object .github/workflows/sphinx-forced-empty-attackers-20260930.yml
            git status --porcelain
          } > "$OUT/source.txt"
          test ! -s <(git status --porcelain)
      - name: Execute exact forced-empty attacker receiving bank
        shell: bash
        run: |
          set -o pipefail
          OUT=build/reports/sphinx-forced-empty-attackers
          just test-class SphinxStageEForcedEmptyAttackersReceivingTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee "$OUT/combat.log"
          xml="$(find . -path '*/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageEForcedEmptyAttackersReceivingTest.xml' -type f -print -quit)"
          test -n "$xml" && test -s "$xml"
          cp "$xml" "$OUT/"
      - name: Regress accepted unique-pass seam
        shell: bash
        run: |
          set -o pipefail
          OUT=build/reports/sphinx-forced-empty-attackers
          just test-class SphinxStageEUniquePassPriorityReceivingTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee "$OUT/unique-pass-regression.log"
          xml="$(find . -path '*/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageEUniquePassPriorityReceivingTest.xml' -type f -print -quit)"
          test -n "$xml" && test -s "$xml"
          cp "$xml" "$OUT/"
      - name: Regress accepted multicast discriminator
        shell: bash
        run: |
          set -o pipefail
          OUT=build/reports/sphinx-forced-empty-attackers
          just test-class SphinxStageEMultiCastDiscriminatorReceivingTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee "$OUT/multicast-regression.log"
          xml="$(find . -path '*/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageEMultiCastDiscriminatorReceivingTest.xml' -type f -print -quit)"
          test -n "$xml" && test -s "$xml"
          cp "$xml" "$OUT/"
      - name: Validate preserved XML
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          out=pathlib.Path("build/reports/sphinx-forced-empty-attackers")
          expected={
            "SphinxStageEForcedEmptyAttackersReceivingTest":2,
            "SphinxStageEUniquePassPriorityReceivingTest":2,
            "SphinxStageEMultiCastDiscriminatorReceivingTest":2,
          }
          result={}
          for cls,n in expected.items():
              p=out/f"TEST-com.wingedsheep.gym.sphinx.{cls}.xml"
              root=ET.parse(p).getroot()
              row={k:int(root.attrib.get(k,"0")) for k in ("tests","failures","errors","skipped")}
              assert row=={"tests":n,"failures":0,"errors":0,"skipped":0}, (cls,row)
              result[cls]=row
          (out/"summary.json").write_text(json.dumps(result,indent=2)+"\n")
          PY
      - name: Preserve original
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-forced-empty-attackers-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/sphinx-forced-empty-attackers/
          if-no-files-found: error
          retention-days: 90

name: Manual identity R5 bounded original-state micro-forks (NO GAMES)
on:
  push:
    branches: [research/manual-identity-r5-bounded-forks-20261020]
    paths:
      - '.github/workflows/manual-identity-r5-bounded-forks-20261020.yml'
      - 'ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualIdentityR5Bounded1622ForksTest.kt'
      - 'experiments/manual-transmission/identity-r5/PROTOCOL.md'
permissions:
  contents: read
  actions: read
jobs:
  micro-forks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_IDENTITY_R5_MODE: EXPLICIT_R4_SOURCE_BOUND_MICRO_FORKS
      MANUAL_IDENTITY_R5_R4_ARCHIVE: ${{ github.workspace }}/r5-input/exact-r4.zip
      MANUAL_IDENTITY_R5_OUTPUT: ${{ github.workspace }}/r5-receipt
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Pin one-commit R5 scope and unchanged authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-receipt r5-input
          git rev-parse HEAD > r5-receipt/source-sha.txt
          test "$(git rev-parse HEAD^)" = "68a8e331c84ebf53575deab9951ec80ca75312a3"
          cat > /tmp/r5-expected.txt <<'EOF'
          .github/workflows/manual-identity-r5-bounded-forks-20261020.yml
          ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualIdentityR5Bounded1622ForksTest.kt
          experiments/manual-transmission/identity-r5/PROTOCOL.md
          EOF
          git diff --name-only HEAD^ HEAD > /tmp/r5-actual.txt
          diff -u /tmp/r5-expected.txt /tmp/r5-actual.txt
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          test "$(git rev-parse HEAD:experiments/manual-transmission/results/FINAL_CONCLUSION_2026_09_24.md)" = "dbf081b0c6e205c65750866adcb6f7d43f532caf"
          test "$(git rev-parse HEAD:ai/src/test/kotlin/com/wingedsheep/ai/engine/ManualIdentityR4Exact1622ReplayTest.kt)" = "764ebf01527db01cc8c74a583876681f9034dbc1"
          chmod +x gradlew scripts/gradle-locked
          echo 'R5_SOURCE_FROZEN_PASS'
      - name: Retrieve and pin successful R4 original-state ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/GodaPupa/argentum-batshit-test/actions/runs/39454771346 |
            jq -e '.status=="completed" and .conclusion=="success" and .head_sha=="68a8e331c84ebf53575deab9951ec80ca75312a3"' > /dev/null
          gh api /repos/GodaPupa/argentum-batshit-test/actions/artifacts/12280017350/zip > r5-input/exact-r4.zip
          echo 'd27a0b8bedc4377c1852cfde23f217e6b92c62a193bdf67972da7320be7ac492  r5-input/exact-r4.zip' | sha256sum -c -
      - name: Execute bounded source-state cast forks only
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :ai:test --tests '*ManualIdentityR5Bounded1622ForksTest' -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace 2>&1 | tee r5-receipt/build.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('r5-receipt')
          s=json.loads((root/'summary.json').read_text())
          a=json.loads((root/'forks.json').read_text())
          assert s['status']=='BOUNDED_ORIGINAL_STATE_MICRO_FORKS_COMPLETE'
          assert s['statesExamined']==len(a)==4
          assert s['newGameInitializations']==s['newFullGameRuns']==s['defectsProven']==0
          assert s['productionChanges']==s['acceptedHardwareChanges']==0
          assert not s['opponentResponsiveStrategicWinComparison']
          assert s['conclusion']=='NO_PROVEN_DEFECT'
          assert set(x['actionIndex'] for x in a)=={1153,1158,1325,1514}
          for x in a:
            for side in ('chosenThenAnimar','animarThenChosen'):
              b=x[side]
              assert b['rawFirstCastAccepted'] is True
              assert b['opponentsAutopassedDuringSimulation'] is True
              assert b['opponentResponsive'] is False
              assert b['strategicDefectProven'] is False
          print('R5_BOUNDED_QUIET_FORKS_PASS source_states=4 new_games=0 no_claimed_defects=1')
          PY
          sha256sum r5-receipt/summary.json r5-receipt/forks.json > r5-receipt/evidence.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-identity-r5-bounded-forks
          retention-days: 30
          if-no-files-found: warn
          path: |
            r5-receipt/
            ai/build/test-results/test/

name: Manual generic retarget and Fblthp early R3
on:
  push:
    branches: [validation/manual-generic-retarget-early-r3-20261029]
    paths: ['.github/workflows/manual-generic-retarget-early-r3-20261029.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 29cc05870960bc23fcc1551039a0839fdd0bd213
  SOURCE_TREE: 7cce9c7b9f1b1a6b36f04e7855aeb8d1d6cace5d
  WORKFLOW: .github/workflows/manual-generic-retarget-early-r3-20261029.yml
  RECORD: experiments/manual-transmission/research/generic-retarget-early-r3-20261029
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile seventeen forms then generic retarget and unchanged Fblthp controls
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-generic-retarget-early-r3-${{ github.run_id }}
          path: manual-generic-retarget-early-r3-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

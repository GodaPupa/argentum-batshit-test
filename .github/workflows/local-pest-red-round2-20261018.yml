name: Exploratory Round 2 Pest vs SoterX Mono-Red Madness
'on':
  push:
    branches:
    - local/pest-red-round2-20261018
    paths:
    - .github/workflows/local-pest-red-round2-20261018.yml
permissions:
  contents: read
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
jobs:
  focused-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v4
    - uses: taiki-e/install-action@v2
      with:
        tool: just
    - name: Restore SHA-bound matchup runner
      shell: bash
      run: 'set -euo pipefail

        base64 --decode tools/pest-red-round2/runner.b64 > "$RUNNER_TEMP/runner.tar.xz"

        echo "a8bccd1016ca652def1c33d07a649edc6bdf3096800df1bc19187ab3f83774fa  $RUNNER_TEMP/runner.tar.xz" | sha256sum --check

        tar -xJf "$RUNNER_TEMP/runner.tar.xz"

        chmod +x gradlew scripts/gradle-locked scripts/test-class

        '
    - name: Compile runner and verify schedule
      run: 'set -o pipefail

        just test-class PestMonoRedBatchPlanTest --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/plan-tests.log"'
    - name: Verify existing matchup decision and mulligan policies
      run: 'set -o pipefail

        just test-class ''PestControlMonoRedMadness*Test'' --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/policy-tests.log"

        '
    - name: Preserve gate evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pest-red-round2-gates-${{ github.run_id }}
        retention-days: 30
        path: 'ai/build/test-results/test/

          gym/build/test-results/test/

          ${{ runner.temp }}/*tests.log

          tools/pest-red-round2/

          gym/src/test/kotlin/com/wingedsheep/gym/PestMonoRedBatch*.kt'
  seat-swapped-pair:
    needs: focused-gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed:
        - '2026101900'
        - '2026101901'
        - '2026101902'
        - '2026101903'
        - '2026101904'
        - '2026101905'
        - '2026101906'
        - '2026101907'
        - '2026101908'
        - '2026101909'
    env:
      MTG_BATCH_RUN: '1'
      MTG_BATCH_GAMES: '2'
      MTG_BATCH_SEED: ${{ matrix.seed }}
      MTG_BATCH_OUTPUT: ${{ github.workspace }}/gym/build/pest-red-round2-${{ matrix.seed }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v4
    - uses: taiki-e/install-action@v2
      with:
        tool: just
    - name: Restore SHA-bound matchup runner
      shell: bash
      run: 'set -euo pipefail

        base64 --decode tools/pest-red-round2/runner.b64 > "$RUNNER_TEMP/runner.tar.xz"

        echo "a8bccd1016ca652def1c33d07a649edc6bdf3096800df1bc19187ab3f83774fa  $RUNNER_TEMP/runner.tar.xz" | sha256sum --check

        tar -xJf "$RUNNER_TEMP/runner.tar.xz"

        chmod +x gradlew scripts/gradle-locked scripts/test-class

        '
    - name: Execute exactly one seat-swapped pair
      run: "set -euo pipefail\nmkdir -p \"$MTG_BATCH_OUTPUT\"\npython3 - <<'PY'\nimport json,os\nfrom pathlib import Path\n\
        seed=int(os.environ['MTG_BATCH_SEED'])\nassert 2026101900<=seed<=2026101909\np=dict(evidenceGroup='ROUND_2_PEST_VS_MONO_RED',officialExperiment=False,totalGames=20,\n\
        \    baseEngineCommit='8e9c0877ea51bc0a112891066b2465d5c124ab09',runnerCommit=os.environ['GITHUB_SHA'],\n    seed=str(seed),pestSeats=[0,1],startingSeat=0,unchangedDecksAndPolicies=True,\n\
        \    rejectedRound1CandidateIncluded=False,aiProfileBothSeats='PRODUCTION_CANDIDATE_EXPIRING')\nPath(os.environ['MTG_BATCH_OUTPUT'],'provenance.json').write_text(json.dumps(p,indent=2)+'\\\
        n')\nPY\njust test-class PestMonoRedBatchTest --no-daemon --console=plain --stacktrace 2>&1 | tee \"$RUNNER_TEMP/gameplay.log\"\
        \n"
    - name: Validate pair and emit summaries
      run: "set -euo pipefail\npython3 tools/pest-red-round2/summarize.py \"$MTG_BATCH_OUTPUT\"\npython3 - <<'PY'\nimport\
        \ json,os,sys\nfrom pathlib import Path\nsys.path.insert(0,'tools/pest-red-round2')\nimport summarize\nroot=Path(os.environ['MTG_BATCH_OUTPUT']);s=summarize.summarize(root)\n\
        assert s['completed']==2 and s['failed']==0\nfor row in s['rows']:\n    t=summarize.read_jsonl(root/row['trace'])\n\
        \    ends=[e for r in t for e in r.get('emittedEvents',[]) if e['type']=='GameEndedEvent']\n    assert len(ends)==1\n\
        \    row['terminationReason']=ends[0]['reason']\n(root/'validated-summary.json').write_text(json.dumps(s,indent=2)+'\\\
        n')\nPY\n"
    - name: Preserve complete or interrupted traces
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pest-red-round2-${{ matrix.seed }}-${{ github.run_id }}
        retention-days: 30
        path: 'gym/build/pest-red-round2-*/

          gym/build/test-results/test/

          ${{ runner.temp }}/gameplay.log

          tools/pest-red-round2/

          gym/src/test/kotlin/com/wingedsheep/gym/PestMonoRedBatch*.kt'

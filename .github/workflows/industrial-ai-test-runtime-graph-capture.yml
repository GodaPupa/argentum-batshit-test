name: Industrial seed-free AI test runtime graph capture
on:
  push:
    branches: ["industrial-waste/r1-manifest-capture-20260928"]
    paths: [".github/workflows/industrial-ai-test-runtime-graph-capture.yml"]
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - name: Bind exact candidate source budget and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/industrial-ai-test-runtime-graph
          test "$(git rev-parse HEAD^)" = "eca7170980f6ba6805c78812e14eb582ecb824fa"
          test "$(git hash-object industrial-waste/v2/capture_seed_free_ai_test_runtime_graph.py)" = "a893c4e446be60da616cdd51714b4ed337274ef3"
          test "$(git hash-object industrial-waste/v2/r1-seed-free-ai-test-runtime-graph-budget.json)" = "32815c24198b7d38404e57fb5ee7dcd1b9385737"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object industrial-waste/v2/capture_seed_free_ai_test_runtime_graph.py; git hash-object industrial-waste/v2/r1-seed-free-ai-test-runtime-graph-budget.json; git hash-object .github/workflows/industrial-ai-test-runtime-graph-capture.yml; git status --porcelain; } > build/reports/industrial-ai-test-runtime-graph/source.txt
      - name: Produce fresh deterministic non-corpus build outputs
        shell: bash
        run: |
          set -o pipefail
          just test-class IndustrialWasteV2RegistryAuditTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/industrial-ai-test-runtime-graph/build.log
      - name: Capture AI test runtime graph and ordered classpath
        shell: bash
        run: |
          set -o pipefail
          python3 industrial-waste/v2/capture_seed_free_ai_test_runtime_graph.py 2>&1 | tee build/reports/industrial-ai-test-runtime-graph/capture.log
      - name: Preserve original capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-ai-test-runtime-graph-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/industrial-ai-test-runtime-graph/
          if-no-files-found: error
          retention-days: 90

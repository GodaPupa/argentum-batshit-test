name: Manual pre-entry land payment qualification
permissions:
  contents: read
concurrency:
  group: validation/manual-preentry-land-20261003
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/manual-preentry-land-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 918b6bb6d66426ab346829493797327c8681d7f1
        fetch-depth: 10
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v6
    - name: Bind exact generalized source
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$OUT"
        python3 - <<'PY'
        import json,hashlib,pathlib,subprocess,os
        def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
        live='d79462d20b147ad34f8a3dbbeb9981676d03e3ec'
        source='918b6bb6d66426ab346829493797327c8681d7f1'
        assert git('rev-parse','HEAD')==source
        assert git('ls-remote','origin','refs/heads/manual/whole-pilot-runner-replay-freeze-20260930').split()[0]==live
        assert git('ls-remote','origin','refs/heads/candidate/manual-preentry-land-20261003').split()[0]==source
        assert git('merge-base',live,source)==live
        paths=git('diff','--name-only',live+'..'+source).splitlines()
        assert not any(p.startswith('.github/workflows/') for p in paths)
        record={'live':live,'source':source,'tree':git('rev-parse','HEAD^{tree}'),'paths':paths,
          'blobs':{p:git('rev-parse','HEAD:'+p) for p in paths},
          'sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},
          'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
        pathlib.Path(os.environ['OUT'],'source-binding.json').write_text(json.dumps(record,indent=2)+'\n')
        PY
    - name: Configure validation-only execution without coverage instrumentation
      shell: bash
      run: |
        cat > "$OUT/no-coverage.gradle" <<'GRADLE'
        allprojects { p ->
          p.plugins.withId('org.jetbrains.kotlinx.kover') {
            p.extensions.getByName('kover').currentProject { instrumentation { disabledForAll.set(true) } }
          }
        }
        GRADLE
    - name: Run generalized and compatibility regressions
      shell: bash
      run: |
        set -uo pipefail
        set +e
        bash scripts/gradle-locked --init-script "$OUT/no-coverage.gradle" --no-daemon --no-configuration-cache --console=plain --continue --max-workers=1 -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g \
          :rules-engine:test --tests com.wingedsheep.engine.scenarios.PreEntryLandPlayPaymentTest \
          :mtg-sets:2017-2022:tests:test --tests com.wingedsheep.engine.scenarios.RiverglidePathwayScenarioTest \
          :mtg-sets:2025:tests:test --tests com.wingedsheep.engine.scenarios.TheWanderingMinstrelScenarioTest --tests com.wingedsheep.engine.scenarios.LightstallInquisitorScenarioTest \
          2>&1 | tee "$OUT/qualification.log"
        rc=${PIPESTATUS[0]}
        printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
        exit "$rc"
    - name: Audit actual cases
      if: always()
      shell: bash
      run: |
        python3 - <<'PY'
        import pathlib,os,json,hashlib,shutil,xml.etree.ElementTree as ET
        out=pathlib.Path(os.environ['OUT']); rows=[]
        expected={
          'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.PreEntryLandPlayPaymentTest.xml':7,
          'mtg-sets/2017-2022/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.RiverglidePathwayScenarioTest.xml':6,
          'mtg-sets/2025/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.TheWanderingMinstrelScenarioTest.xml':4,
          'mtg-sets/2025/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.LightstallInquisitorScenarioTest.xml':4,
        }
        for name,count in expected.items():
          p=pathlib.Path(name); cases=[]
          if p.exists():
            d=out/name; d.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(p,d)
            cases=[{'name':c.attrib['name'],'failure':c.find('failure') is not None,'error':c.find('error') is not None,'skipped':c.find('skipped') is not None} for c in ET.parse(p).getroot().findall('testcase')]
          rows.append({'path':name,'expected':count,'cases':cases})
        (out/'actual-cases.json').write_text(json.dumps(rows,indent=2)+'\n')
        (out/'evidence-sha256.json').write_text(json.dumps({str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*') if p.is_file() and p.name!='evidence-sha256.json'},indent=2)+'\n')
        assert all(len(r['cases'])==r['expected'] for r in rows),rows
        assert not any(c['failure'] or c['error'] or c['skipped'] for r in rows for c in r['cases']),rows
        assert (out/'gradle-exit-code.txt').read_text().strip()=='0'
        PY
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: manual-preentry-land-${{ github.run_id }}
        path: ${{ env.OUT }}/
        if-no-files-found: error
        retention-days: 90
'on':
  push:
    branches:
    - validation/manual-preentry-land-20261003
    paths:
    - .github/workflows/manual-preentry-land-qualification-20261003.yml

name: Sphinx whole-actor Snap routing qualification v2
on:
  push:
    branches: ["validation/sphinx-whole-actor-snap-routing-v2-20261001"]
    paths: [".github/workflows/sphinx-whole-actor-snap-routing-v2-20261001.yml"]
permissions: {contents: read}
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: catthehacker/ubuntu@sha256:7d51b26b65f00d97063cbda95699ee2aee2d4a7362f545ac29a4a18aaba7cfb3
      options: --platform linux/amd64
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64
      GRADLE_USER_HOME: /tmp/sphinx-whole-snap-v2-${{ github.run_id }}
      EVIDENCE: /tmp/sphinx-whole-snap-v2-evidence-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: 4773a44d3a3af4a92e665acad801605cae69168c, fetch-depth: 1, persist-credentials: false}
      - name: Execute only repaired whole-actor Snap composition regression
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = 4773a44d3a3af4a92e665acad801605cae69168c
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEWholeActor.kt)" = 63ad03689f7ebe9551ea7ab3d344f1703ea9eb96
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/sphinx/SphinxStageEWholeActorSnapRoutingTest.kt)" = de19161052af74fa7800ff600ff831e392f4bc98
          test ! -e "$GRADLE_USER_HOME" && test ! -L "$GRADLE_USER_HOME"
          test ! -e "$EVIDENCE" && mkdir "$EVIDENCE"
          git rev-parse HEAD HEAD^{tree} > "$EVIDENCE/source.txt"
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain :gym:compileTestKotlin 2>&1 | tee "$EVIDENCE/compile.log"
          bash scripts/gradle-locked --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --console=plain --info :gym:test --tests com.wingedsheep.gym.sphinx.SphinxStageEWholeActorSnapRoutingTest 2>&1 | tee "$EVIDENCE/tests.log"
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.sphinx.SphinxStageEWholeActorSnapRoutingTest.xml "$EVIDENCE/"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-whole-actor-snap-routing-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: warn
          retention-days: 90

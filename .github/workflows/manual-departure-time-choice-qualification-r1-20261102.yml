name: Manual departure-time choice qualification R1
on:
  push:
    branches: [validation/manual-departure-time-choice-qualification-r1-20261102]
    paths: ['.github/workflows/manual-departure-time-choice-qualification-r1-20261102.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 09be265845acc297d4d38f1993426a38a4d3337c
  SOURCE_TREE: 5168a3f0483bfb2a386548c6230b55e54e9f648f
  WORKFLOW: .github/workflows/manual-departure-time-choice-qualification-r1-20261102.yml
  RECORD: experiments/manual-transmission/research/departure-time-choice-qualification-r1-20261102
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile all forms then require positive negative and restoration witnesses
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-departure-time-choice-r1-${{ github.run_id }}
          path: manual-departure-time-choice-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

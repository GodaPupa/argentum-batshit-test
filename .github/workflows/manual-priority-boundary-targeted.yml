name: Manual canonical Kinnan + R3-P four-seat boundary targeted
on:
  push:
    branches: ["manual/clean-pilot-boundary-receiving-20260927"]
    paths: [".github/workflows/manual-priority-boundary-targeted.yml"]
permissions:
  contents: read
jobs:
  four-declared-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind prospective source fixture boundary and parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/manual-priority-boundary-targeted
          test "$(git rev-parse HEAD^)" = "cbb73c0b337af62871360d644c2a8921030a60ab"
          test "$(git hash-object mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/iko/cards/KinnanBonderProdigy.kt)" = "14907968026b2f307bd792ccd22481788ac3d2e5"\n          test "$(git hash-object mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/KinnanBonderProdigyScenarioTest.kt)" = "2eeea62b0cb87d231aebaeaf5119f959f1a7ca2b"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoPriorityConservationPolicy.kt)" = "8fec7b06ed4d20ac138b4f0d0500fc6d39926d4e"
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoPriorityBoundaryTest.kt)" = "c76561e4c156d0476c2ab9637e2c8658eb892255"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/PhaseTwoPilotBoundary.kt)" = "321c4234b4670284d8c9fa9b7a0ef819e3ccc8fb"
          test "$(git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/PhaseTwoTelemetryAdapter.kt)" = "44608301d535a2114073d80c06d5ca0480c40043"
          test "$(git hash-object experiments/manual-transmission-phase2/priority-boundary-receiving-budget.json)" = "d8c8e98f932675b1ea8440b2809f4b3b6e1d8035"
          { git rev-parse HEAD; git rev-parse HEAD^; git hash-object mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/iko/cards/KinnanBonderProdigy.kt; git hash-object mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/KinnanBonderProdigyScenarioTest.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoPriorityConservationPolicy.kt; git hash-object gym/src/test/kotlin/com/wingedsheep/gym/manual/ManualPhaseTwoPriorityBoundaryTest.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/PhaseTwoPilotBoundary.kt; git hash-object gym/src/main/kotlin/com/wingedsheep/gym/manual/PhaseTwoTelemetryAdapter.kt; git hash-object experiments/manual-transmission-phase2/priority-boundary-receiving-budget.json; git hash-object .github/workflows/manual-priority-boundary-targeted.yml; git status --porcelain; } > build/reports/manual-priority-boundary-targeted/source.txt
      - name: Execute exactly four fresh declared real boundary replay traces
        shell: bash
        run: |
          set -o pipefail
          just test-class ManualPhaseTwoPriorityBoundaryTest --rerun-tasks --no-build-cache --console=plain 2>&1 | tee build/reports/manual-priority-boundary-targeted/test.log
      - name: Retain exact XML
        if: always()
        shell: bash
        run: |
          cp gym/build/test-results/test/TEST-com.wingedsheep.gym.manual.ManualPhaseTwoPriorityBoundaryTest.xml build/reports/manual-priority-boundary-targeted/ 2>/dev/null || true
      - name: Retain original behavioral evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-priority-boundary-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/manual-priority-boundary-targeted/
          if-no-files-found: error
          retention-days: 90

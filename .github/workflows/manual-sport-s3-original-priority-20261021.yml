name: Manual SPORT S3 original opponent-priority inventory (ZERO NEW GAMES)
on:
  push:
    branches: [research/manual-sport-s3-original-priority-audit-20261021]
    paths:
      - '.github/workflows/manual-sport-s3-original-priority-20261021.yml'
      - 'experiments/manual-transmission/research/cruise-sport-race-20261021/SPORT_S3_ORIGINAL_PRIORITY_INVENTORY_PROTOCOL.json'
      - 'experiments/manual-transmission/research/cruise-sport-race-20261021/audit_sport_s3_original_priority.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: manual-sport-s3-original-ten-source-inventory
  cancel-in-progress: false

jobs:
  all-archived-priority-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MANUAL_S3_INPUT: ${{ github.workspace }}/sport-s3-originals
      MANUAL_S3_OUTPUT: ${{ github.workspace }}/sport-s3-evidence
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 20}

      - name: Protect exact S2 source and original ten-game limits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sport-s3-evidence sport-s3-originals
          test "$GITHUB_REF" = refs/heads/research/manual-sport-s3-original-priority-audit-20261021
          git merge-base --is-ancestor 177b24c048baaf4c2f81adb38ff0e93eb9f1f6b2 HEAD
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = 7984a2e87d8ddbe023d45620414d25a61691a040
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = 180918b2d7a59309e7b0617f2579fb2a6d06b7d5
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = ef5ba9dacb02bbf2a00303c9ee4724565769385a
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/advisor/modules/ManualCruiseR9ExecutableFetchAdvisorModule.kt)" = afb19c325bf38f3d82bd0fefba64e1f4057db858
          test "$(git rev-parse HEAD:mtg-sets/2003-2007/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/fut/cards/PactOfNegation.kt)" = c786551484cfb001eea9fc2b05e14ea23fd63bf9
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/event/TriggerDetector.kt)" = c95f059d375e3df107284e1081d00c449ca3f28d
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt)" = d02fded3fd9656aa2d032c49ce8312e1d6baaf93
          git diff --name-only 177b24c048baaf4c2f81adb38ff0e93eb9f1f6b2 HEAD > sport-s3-evidence/changed-paths.txt
          test "$(wc -l < sport-s3-evidence/changed-paths.txt)" -eq 3
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/manual-sport-s3-original-priority-20261021.yml|experiments/manual-transmission/research/cruise-sport-race-20261021/SPORT_S3_ORIGINAL_PRIORITY_INVENTORY_PROTOCOL.json|experiments/manual-transmission/research/cruise-sport-race-20261021/audit_sport_s3_original_priority.py) ;;
              *) echo "UNAUTHORIZED_SOURCE_DELTA:$path"; exit 1 ;;
            esac
          done < sport-s3-evidence/changed-paths.txt
          git rev-parse HEAD > sport-s3-evidence/source-sha.txt
          git rev-parse HEAD^{tree} > sport-s3-evidence/tree-sha.txt
          echo 'S3 SOURCE AUDIT ONLY; ORIGINAL PRECISION 10/12; TWO RESERVED; NO GAMES/SEEDS/PILOT OR MAIN MODIFICATION' > sport-s3-evidence/budget.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("experiments/manual-transmission/research/cruise-sport-race-20261021")
          p=json.loads((root/"SPORT_S3_ORIGINAL_PRIORITY_INVENTORY_PROTOCOL.json").read_text())
          m=json.loads((root/"CRUISE_R2_ZONE_MANIFEST.json").read_text())
          assert p["status"]=="PREDECLARED_BEFORE_S3_ARCHIVE_INVENTORY_EXECUTION"
          assert p["source_parent"]=="177b24c048baaf4c2f81adb38ff0e93eb9f1f6b2"
          assert m["original_game_count"]==10 and m["original_accepted_actions"]==33440
          assert m["original_priority_decisions_matched"]==7827 and p["boundaries"]["no_new_full_games"] is True
          assert p["boundaries"]["full_game_budget"]=={"used":10,"max":12,"reserved":2,"new":0}
          print("SPORT_S3_EXACT_PREDECLARATION_AND_ZERO_GAME_BUDGET_PASS")
          PY

      - name: Retrieve ten exact source-bound archival game ZIPs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > sport-s3-evidence/archive-list.tsv
          import json
          from pathlib import Path
          m=json.loads(Path("experiments/manual-transmission/research/cruise-sport-race-20261021/CRUISE_R2_ZONE_MANIFEST.json").read_text())
          for x in m["archives"]:
              print("\t".join(str(x[k]) for k in ("cohort","arm","seed","id","sha256")))
          PY
          while IFS=$'\t' read -r cohort arm seed artifact digest; do
            out="sport-s3-originals/${cohort}-${arm}-${seed}-original.zip"
            gh api "/repos/GodaPupa/argentum-batshit-test/actions/artifacts/${artifact}/zip" > "$out"
            printf '%s  %s\n' "$digest" "$out" | sha256sum --check --status
            printf '%s:%s:%s:%s:SHA256_PASS\n' "$cohort" "$arm" "$seed" "$artifact" | tee -a sport-s3-evidence/archive-digests-verified.txt
          done < sport-s3-evidence/archive-list.tsv
          test "$(wc -l < sport-s3-evidence/archive-digests-verified.txt)" -eq 10

      - name: Join all historical priority offers to 33,440 accepted actions (no replay)
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/manual-transmission/research/cruise-sport-race-20261021/audit_sport_s3_original_priority.py \
            2>&1 | tee sport-s3-evidence/source-inventory.log

      - name: Preserve source evidence and bounded verdict (never original hidden ZIPs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-sport-s3-original-priority-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            sport-s3-evidence/

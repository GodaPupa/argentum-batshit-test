name: Industrial Waste — Gate 8 Jund Pilot

on:
  push:
    branches: [industrial-waste/lab]
    paths:
      - .github/workflows/industrial-waste-g8-jund-pilot.yml
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteJundPilotBenchmark.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/JundWildfireAdvisorModule.kt
      - ai/src/test/kotlin/com/wingedsheep/ai/industrialwaste/IndustrialWasteAdvisorModule.kt
      - industrial-waste/protocols/gate-8-jund-wildfire-pilot-v1.md
      - industrial-waste/control/industrial-waste-v1.0-submitted.dck
      - industrial-waste/challengers/pactdoll-a.dck
      - industrial-waste/gauntlet/jund-wildfire-manohito-2026-09-15.dck
      - industrial-waste/seed-registry.json
      - industrial-waste/input-identities.sha256
      - industrial-waste/sim/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jund-pilot:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Reserve and execute Gate 8 Jund pilot')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Verify frozen inputs and fresh disjoint vector
        run: |
          python3 industrial-waste/sim/validate_inputs.py
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          namespace = "IW-G8-JUND-PILOT-V1"
          expected_count = 2
          expected_digest = "077c92b6d6d31bf82fc4e2b13d2f1336126f3a080801c69573f9d2d6c987ff7e"
          expected_opponent_digest = "b3c5722946b3e32adc0c716a7b08a0688f2ab62b0f6bb87d9d0faec12c09cc29"

          def seed_for(ns, index):
              raw = hashlib.sha256(f"{ns}:{index}".encode()).digest()[:8]
              value = int.from_bytes(raw, "big") & ((1 << 63) - 1)
              return value or 1

          entries = json.loads(Path("industrial-waste/seed-registry.json").read_text())
          entry = next(item for item in entries if item["namespace"] == namespace)
          assert entry["count"] == expected_count
          assert entry["status"] == "reserved"
          vector = [seed_for(namespace, i) for i in range(1, expected_count + 1)]
          digest = hashlib.sha256("\n".join(map(str, vector)).encode()).hexdigest()
          assert digest == expected_digest == entry["vector_sha256"]
          mine = set(vector)
          for other in entries:
              if other["namespace"] == namespace:
                  continue
              other_vector = {seed_for(other["namespace"], i) for i in range(1, other["count"] + 1)}
              assert mine.isdisjoint(other_vector), f"seed overlap with {other['namespace']}"

          opponent = Path("industrial-waste/gauntlet/jund-wildfire-manohito-2026-09-15.dck")
          opponent_digest = hashlib.sha256(opponent.read_bytes()).hexdigest()
          assert opponent_digest == expected_opponent_digest
          print(f"Gate 8 vector fresh/disjoint: {vector} sha256={digest}")
          print(f"Jund opponent identity: {opponent_digest}")
          PY
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v6
      - name: Execute frozen-vector Gate 8 pilot
        id: pilot
        continue-on-error: true
        env:
          IW_JUND_PILOT: "true"
        run: ./gradlew :ai:test --tests IndustrialWasteJundPilotBenchmark -Dbenchmark=true --no-daemon
      - name: Diagnose pilot runtime
        if: always()
        run: |
          echo "pilot_outcome=${{ steps.pilot.outcome }}"
          find ai/build/test-results -type f -maxdepth 4 -print 2>/dev/null || true
          for f in ai/build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            cat "$f"
          done
      - name: Enforce pilot success
        if: always()
        run: test "${{ steps.pilot.outcome }}" = "success"
      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: industrial-waste-g8-jund-pilot
          path: industrial-waste/results/gate-8-jund-pilot-v1.json
          if-no-files-found: ignore

name: Pest Pass-Terminal Validation Bridge

on:
  push:
    branches: [ "pest-control/pass-terminal-validation-bridge" ]

permissions:
  contents: read

jobs:
  exact-source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pass-terminal candidate
        uses: actions/checkout@v6
        with:
          ref: 44e28ab405afa7ca1f36d761f76ac9ec1506ffdf
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "44e28ab405afa7ca1f36d761f76ac9ec1506ffdf"
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Just
        uses: extractions/setup-just@v3
        with:
          just-version: '1.42.4'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Validate exact candidate through mandated runner
        run: just test

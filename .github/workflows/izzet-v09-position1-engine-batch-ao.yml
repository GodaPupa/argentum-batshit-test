name: Izzet Position-1 Engine Batch AO

on:
  push:
    branches: ["mayhem/izzet-science"]
    paths:
      - ".github/workflows/izzet-v09-position1-engine-batch-ao.yml"
      - "mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/iko/cards/RamThrough.kt"
      - "mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/RamThroughScenarioTest.kt"
      - "mtg-sets/2000-2002/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/jud/cards/PrismaticStrands.kt"
      - "mtg-sets/2000-2002/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/PrismaticStrandsScenarioTest.kt"
      - "rules-engine/src/test/kotlin/com/wingedsheep/engine/handlers/effects/ExcessDamageSelfReplacementTest.kt"
      - "rules-engine/src/test/kotlin/com/wingedsheep/engine/handlers/effects/SourceGroupDamagePreventionTest.kt"

permissions:
  contents: write

concurrency:
  group: izzet-position1-batch-ao
  cancel-in-progress: false

jobs:
  qualify-batch-ao:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify frozen identities and preceding acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum izzet-science/v0.7-control.md | cut -d' ' -f1)" = "726f5e9458b46dda30b33a6ce9f3c3237b25d6e11b81dac85308c3065c108a01"
          test "$(sha256sum izzet-science/opponents/veteran-beastrider-commander-clash-2025.txt | cut -d' ' -f1)" = "c3ab6ee8e37a78219e7bbb7c6a75c634d78c1eb4965ab0db3abd5d853398b0be"
          grep -Fq 'Batch AN is accepted' izzet-science/v09-position1-engine-batch-an-gate.md
          grep -Fq 'V07_DECK_AUDIT_NO_CHANGE' izzet-science/v07-deck-level-audit-no-change.md
          grep -Fq 'V09_CARD_CONTROL_ARCHITECTURE_AUDIT_KEEP_V07' izzet-science/v09-card-control-architecture-audit.md
          grep -Fq 'Expected post-implementation unresolved count is exactly **7**' izzet-science/v09-position1-engine-batch-ao-gate.md
          mkdir -p /tmp/izzet-batch-ao

      - name: Qualify damage ordering, chosen-color prevention and exact cards
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class ExcessDamageSelfReplacementTest --info --stacktrace | tee /tmp/izzet-batch-ao/excess.txt
          scripts/test-class SourceGroupDamagePreventionTest --info --stacktrace | tee /tmp/izzet-batch-ao/prevention.txt
          scripts/test-class FloatingEffectSerializationRoundTripTest --info --stacktrace | tee /tmp/izzet-batch-ao/serialization.txt
          scripts/test-class CombatDamagePreventionBadgeTest --info --stacktrace | tee /tmp/izzet-batch-ao/badges.txt
          scripts/test-class RamThroughScenarioTest --info --stacktrace | tee /tmp/izzet-batch-ao/ram.txt
          scripts/test-class PrismaticStrandsScenarioTest --info --stacktrace | tee /tmp/izzet-batch-ao/strands.txt
          scripts/test-class GandalfsSanctionScenarioTest --info --stacktrace | tee /tmp/izzet-batch-ao/gandalf.txt
          scripts/test-class ExcessDamageTriggerScenarioTest --info --stacktrace | tee /tmp/izzet-batch-ao/excess-triggers.txt
          scripts/test-class PreventAllDamageToGroupScenarioTest --info --stacktrace | tee /tmp/izzet-batch-ao/recipient-shields.txt
          scripts/test-class PlayerProtectionDamageScenarioTest --info --stacktrace | tee /tmp/izzet-batch-ao/protection.txt
          scripts/test-class DamageDealtThisTurnTest --info --stacktrace | tee /tmp/izzet-batch-ao/damage-ledger.txt
          scripts/test-class IzzetSciencePdhMechanicsQualificationTest --info --stacktrace | tee /tmp/izzet-batch-ao/pdh.txt

      - name: Verify exact real-engine registry coverage
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-class IzzetScienceVeteranBeastriderEngineReadinessTest --info --stacktrace | tee /tmp/izzet-batch-ao/readiness.txt
          grep -Fq 'V09_REAL_ENGINE_UNRESOLVED_COUNT=7' /tmp/izzet-batch-ao/readiness.txt
          ! grep -Fq 'unresolved Izzet card:' /tmp/izzet-batch-ao/readiness.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Ram Through' /tmp/izzet-batch-ao/readiness.txt
          ! grep -Fq 'unresolved Veteran Beastrider card: Prismatic Strands' /tmp/izzet-batch-ao/readiness.txt

      - name: Regenerate canonical snapshots and reject unrelated changes
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true --stacktrace | tee /tmp/izzet-batch-ao/snapshot-generation.txt
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          expected = {'IKO': 'Ram Through', 'JUD': 'Prismatic Strands'}
          paths = {f'mtg-sets/src/test/resources/snapshots/cards/{code}.json' for code in expected}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed |= set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert changed == paths, (changed, paths)
          def records(text):
              chunks = re.split(r'^// ([^\n]+)\n', text, flags=re.M)
              assert not chunks[0].strip(), 'unexpected snapshot preamble'
              result = {}
              for i in range(1, len(chunks), 2):
                  assert chunks[i] not in result, 'duplicate card in snapshot'
                  result[chunks[i]] = json.loads(chunks[i + 1])
              return result
          for code, name in expected.items():
              path = f'mtg-sets/src/test/resources/snapshots/cards/{code}.json'
              prior = subprocess.run(['git', 'show', 'HEAD:' + path], text=True, capture_output=True)
              assert prior.returncode == 0, 'missing existing snapshot'
              before = records(prior.stdout)
              after = records(pathlib.Path(path).read_text())
              assert set(after) == set(before) | {name}
              assert name not in before
              for old_name, old_card in before.items():
                  assert after[old_name] == old_card, 'unrelated card changed: ' + old_name
          print('BATCH_AO_ONLY_RAM_STRANDS_ADDITIONS_PASS')
          PY
          git diff --check

      - name: Requalify all canonical snapshots with updating disabled
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:cleanTest :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=false --stacktrace | tee /tmp/izzet-batch-ao/snapshot-verification.txt

      - name: Verify untouched official execution and integrate exact snapshots
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'officialGamesAuthorized: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'officialSeedsConsumed: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          grep -Fq 'outcomeExposure: Int = 0' gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtg-sets/src/test/resources/snapshots/cards/IKO.json mtg-sets/src/test/resources/snapshots/cards/JUD.json
          git commit -m "Qualify Ram Through and Prismatic Strands Izzet batch AO snapshots"
          git fetch origin mayhem/izzet-science
          test "$(git rev-parse origin/mayhem/izzet-science)" = "${GITHUB_SHA}"
          git push origin HEAD:mayhem/izzet-science

      - name: Emit complete batch provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "schema=izzet-v09-position1-engine-batch-ao-v1"
            echo "source_sha=${GITHUB_SHA}"
            echo "snapshot_commit=$(git rev-parse HEAD)"
            echo "snapshot_tree=$(git rev-parse HEAD^{tree})"
            echo "implemented=Ram Through|Prismatic Strands"
            echo "unresolved_before=9"
            echo "unresolved_after=7"
            echo "unresolved_izzet_after=0"
            echo "damage_scope=ORDINARY_CREATURE_EXCESS_AND_SOURCE_ONLY_CHOSEN_COLOR_PREVENTION"
            echo "full_readiness_guards_remaining=6"
            echo "registry_only_acceptance=true"
            echo "simultaneous_damage_interaction_qualified=false"
            echo "official_seeds_consumed=0"
            echo "games_initialized=0"
            echo "outcome_exposure=0"
            sha256sum izzet-science/v0.7-control.md
            sha256sum izzet-science/opponents/veteran-beastrider-commander-clash-2025.txt
            sha256sum izzet-science/v09-position1-engine-batch-an-gate.md
            sha256sum izzet-science/v09-position1-engine-batch-ao-gate.md
            sha256sum .github/workflows/izzet-v09-position1-engine-batch-ao.yml
            sha256sum rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/DamageUtils.kt
            sha256sum rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/combat/PreventDamageExecutor.kt
            sha256sum rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/combat/CombatDamageManager.kt
            sha256sum rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/combat/CombatDamagePipeline.kt
            sha256sum rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/layers/ActiveFloatingEffect.kt
            sha256sum rules-engine/src/main/kotlin/com/wingedsheep/engine/view/ClientStateTransformer.kt
            sha256sum rules-engine/src/testFixtures/kotlin/com/wingedsheep/engine/support/SerializationTestSupport.kt
            sha256sum mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/iko/cards/RamThrough.kt
            sha256sum mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/RamThroughScenarioTest.kt
            sha256sum mtg-sets/2000-2002/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/jud/cards/PrismaticStrands.kt
            sha256sum mtg-sets/2000-2002/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/PrismaticStrandsScenarioTest.kt
            sha256sum rules-engine/src/test/kotlin/com/wingedsheep/engine/handlers/effects/ExcessDamageSelfReplacementTest.kt
            sha256sum rules-engine/src/test/kotlin/com/wingedsheep/engine/handlers/effects/SourceGroupDamagePreventionTest.kt
            sha256sum rules-engine/src/test/kotlin/com/wingedsheep/engine/hygiene/FloatingEffectSerializationRoundTripTest.kt
            sha256sum rules-engine/src/test/kotlin/com/wingedsheep/engine/view/CombatDamagePreventionBadgeTest.kt
            sha256sum mtg-sets/2023/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/GandalfsSanctionScenarioTest.kt
            sha256sum rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/ExcessDamageTriggerScenarioTest.kt
            sha256sum rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/PreventAllDamageToGroupScenarioTest.kt
            sha256sum rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/PlayerProtectionDamageScenarioTest.kt
            sha256sum rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/DamageDealtThisTurnTest.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetSciencePdhMechanicsQualificationTest.kt
            sha256sum gym/src/main/kotlin/com/wingedsheep/gym/matchup/IzzetScienceVeteranBeastriderEngineReadiness.kt
            sha256sum gym/src/test/kotlin/com/wingedsheep/gym/IzzetScienceVeteranBeastriderEngineReadinessTest.kt
            sha256sum izzet-science/capability-drafts/remaining-queue-findings.md
            sha256sum mtg-sets/src/test/resources/snapshots/cards/IKO.json
            sha256sum mtg-sets/src/test/resources/snapshots/cards/JUD.json
            sha256sum /tmp/izzet-batch-ao/{excess,prevention,serialization,badges,ram,strands,gandalf,excess-triggers,recipient-shields,protection,damage-ledger,pdh,readiness,snapshot-generation,snapshot-verification}.txt
          } > /tmp/izzet-batch-ao/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: izzet-v09-position1-engine-batch-ao
          path: /tmp/izzet-batch-ao
          if-no-files-found: error

name: Manual Phase 2 Bane of Progress Qualification

on:
  push:
    branches:
      - manual-transmission/phase2-cedh
    paths:
      - .github/workflows/manual-transmission-bane-of-progress.yml

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: manual-transmission/phase2-cedh
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Regenerate exact C13 snapshot
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true

      - name: Fail closed on unrelated snapshot drift
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "mtg-sets/src/test/resources/snapshots/cards/C13.json"
          git diff --check

      - name: Qualify exact Bane of Progress behavior
        run: ./gradlew :mtg-sets:2008-2016:test --tests "*BaneOfProgressScenarioTest"

      - name: Qualify card lint
        run: ./gradlew :mtg-sets:test --tests "*CardLintTest"

      - name: Commit exact generated C13 bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtg-sets/src/test/resources/snapshots/cards/C13.json
          git commit -m "Synchronize Bane of Progress snapshot"
          git push origin HEAD:manual-transmission/phase2-cedh

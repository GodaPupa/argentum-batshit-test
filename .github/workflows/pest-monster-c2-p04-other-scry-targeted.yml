name: Pest Monster P04 other scry surveil receiving
on:
  push:
    branches: ["pest/c2-pair-pilot-seam-20260927"]
    paths:
      - ".github/workflows/pest-monster-c2-p04-other-scry-targeted.yml"
      - "gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterOtherScrySurveilReceivingTest.kt"

permissions:
  contents: read

jobs:
  prospective-other-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Bind exact fixture source
        run: |
          mkdir -p build/reports/pest-c2-p04-other
          {
            git rev-parse HEAD
            git hash-object gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterOtherScrySurveilReceivingTest.kt
            git status --porcelain
          } > build/reports/pest-c2-p04-other/source.txt
          test "$(git hash-object gym/src/test/kotlin/com/wingedsheep/gym/actorinput/PestMonsterOtherScrySurveilReceivingTest.kt)" = "c037e32e5458b0ab364486bb5f8ae4f91bdb167e"
      - name: Execute four fresh Boulder and Pylons fixtures
        shell: bash
        run: |
          set -o pipefail
          scripts/test-class PestMonsterOtherScrySurveilReceivingTest --rerun-tasks --info --stacktrace 2>&1 | tee build/reports/pest-c2-p04-other/gradle.log
      - name: Verify exact JUnit cases
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          paths=glob.glob("gym/build/test-results/test/TEST-*PestMonsterOtherScrySurveilReceivingTest.xml")
          assert len(paths)==1, paths
          root=ET.parse(paths[0]).getroot()
          cases=root.findall(".//testcase")
          expected=[f"P04-03 Monster seat {seat} {card}" for seat in (1,2) for card in
              ("Giant's Boulder bottom and reorder","Conduit Pylons surveils physical top card")]
          assert sorted(c.get("name") for c in cases)==sorted(expected), [c.get("name") for c in cases]
          assert not root.findall(".//failure") and not root.findall(".//error") and not root.findall(".//skipped")
          PY
      - name: Retain original result and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-c2-p04-other-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/pest-c2-p04-other/
            gym/build/test-results/test/TEST-*PestMonsterOtherScrySurveilReceivingTest.xml
          if-no-files-found: error
          retention-days: 90

name: Manual Spellskite same-source compatibility R1
on:
  push:
    branches: [validation/manual-spellskite-full-r1-20261028]
    paths: ['.github/workflows/manual-spellskite-full-r1-20261028.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 5a956c8713ee1b49d7d15266bdc3bda13119b130
  SOURCE_TREE: 6563e2bbda2f2c3fd0c695e92f626e1be934744d
  WORKFLOW: .github/workflows/manual-spellskite-full-r1-20261028.yml
  RECORD: experiments/manual-transmission/research/spellskite-full-r1-20261028
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web-client/package-lock.json}
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Exact dependent compatibility and original reports
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-spellskite-full-r1-${{ github.run_id }}
          path: manual-spellskite-full-r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

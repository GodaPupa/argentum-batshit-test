name: Manual R9 adjacent safety corroboration (NO GAMES)
on:
  push:
    branches: [research/manual-r9-adjacent-corroboration-20261021]
    paths:
      - '.github/workflows/manual-r9-adjacent-corroboration-20261021.yml'
permissions:
  contents: read
concurrency:
  group: manual-r9-adjacent-corroboration
  cancel-in-progress: false
jobs:
  existing-adjacent-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MANUAL_R4_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 32}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Source and artifact identity (no policy or engine edits)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r9-adjacent-evidence
          test "$GITHUB_REF" = "refs/heads/research/manual-r9-adjacent-corroboration-20261021"
          git merge-base --is-ancestor 3ea58cae2cb087379a64608f0eb7373793aff2ed HEAD
          test "$(git diff --name-only 3ea58cae2cb087379a64608f0eb7373793aff2ed HEAD)" = ".github/workflows/manual-r9-adjacent-corroboration-20261021.yml"
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt)" = "d02fded3fd9656aa2d032c49ce8312e1d6baaf93"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = "7984a2e87d8ddbe023d45620414d25a61691a040"
          echo 39622338973 > r9-adjacent-evidence/r9-original-green-run.txt
          echo 009507befd259f6ea09ec1545e45e6355495932d86ba80c439d4ff3a1f3fe321 > r9-adjacent-evidence/r9-original-green-artifact-sha256.txt
          echo ZERO_FULL_GAMES > r9-adjacent-evidence/game-budget.txt
          git rev-parse HEAD > r9-adjacent-evidence/source-sha.txt
          git rev-parse HEAD^{tree} > r9-adjacent-evidence/tree-sha.txt
          git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt > r9-adjacent-evidence/solver-blob.txt
          chmod +x gradlew scripts/gradle-locked

      - name: Hidden Grotto existing scenarios
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2024:tests:test \
            --tests '*HiddenGrottoTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-adjacent-evidence/hidden-grotto.log

      - name: City of Brass original scenario
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:1993-1999:tests:test \
            --tests '*CityOfBrassScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-adjacent-evidence/city-of-brass.log

      - name: Ashiok life-payment replacement
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2023:tests:test \
            --tests '*AshiokWickedManipulatorScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-adjacent-evidence/ashiok.log

      - name: Misty Rainforest and R9 fetch witnesses
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2008-2016:tests:test \
            --tests '*ManualPrecisionR9FetchHeldoutScenarioTest' \
            --tests '*MistyRainforestScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-adjacent-evidence/misty-fetch.log

      - name: Wooded Foothills fetch / shock choice
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2000-2002:tests:test \
            --tests '*WoodedFoothillsScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-adjacent-evidence/wooded-fetch.log

      - name: Hand-played shockland tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2003-2007:tests:test \
            --tests '*BreedingPoolScenarioTest' \
            --tests '*SteamVentsScenarioTest' \
            --tests '*StompingGroundScenarioTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-adjacent-evidence/hand-shocks.log

      - name: Preserve original JUnit / logs on GREEN or RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-r9-adjacent-corroboration-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            r9-adjacent-evidence/
            mtg-sets/2024/tests/build/test-results/test/
            mtg-sets/1993-1999/tests/build/test-results/test/
            mtg-sets/2023/tests/build/test-results/test/
            mtg-sets/2008-2016/tests/build/test-results/test/
            mtg-sets/2000-2002/tests/build/test-results/test/
            mtg-sets/2003-2007/tests/build/test-results/test/

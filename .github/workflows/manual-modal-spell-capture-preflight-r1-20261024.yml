name: Manual modal spell capture early preflight R1
on:
  push:
    branches: [validation/manual-modal-spell-capture-preflight-r1-20261024]
    paths: ['.github/workflows/manual-modal-spell-capture-preflight-r1-20261024.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 2de4b397ad8c3f54fd18f8697e3467de4b16b25a
  SOURCE_TREE: 05508e45dd832150ea71674d2718fff519584666
  WORKFLOW: .github/workflows/manual-modal-spell-capture-preflight-r1-20261024.yml
  RECORD: experiments/manual-transmission/research/modal-spell-capture-preflight-r1-20261024
  EVIDENCE: manual-modal-spell-preflight-evidence
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  preflight:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum" "$EVIDENCE"
      - name: Bind immutable source and protected originals
        run: python3 "$RECORD/gate.py" bind
      - name: Compile normal source through approved lock
        run: |
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" compile 2>&1 | tee "$EVIDENCE/compile.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$EVIDENCE/compile-exit.txt"
          exit "$rc"
      - name: Eight targeted integration and fixture cases
        run: |
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" targeted 2>&1 | tee "$EVIDENCE/targeted.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$EVIDENCE/targeted-exit.txt"
          python3 "$RECORD/gate.py" receive
          audit_rc=$?
          if test "$rc" != 0; then exit "$rc"; fi
          exit "$audit_rc"
      - name: Preserve original preflight evidence on success or failure
        if: always()
        run: python3 "$RECORD/gate.py" archive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-modal-spell-preflight-r1-${{ github.run_id }}
          path: manual-modal-spell-preflight-evidence/
          retention-days: 90
          if-no-files-found: error

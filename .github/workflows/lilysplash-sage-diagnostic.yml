name: Lilysplash Sage Diagnostic

on:
  push:
    branches: [ "lilysplash/lab" ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Run focused scenario and print report
        shell: bash
        run: |
          set +e
          ./gradlew :mtg-sets:2008-2016:tests:test \
            --tests SagesRowDenizenScenarioTest --rerun-tasks
          status=$?
          find mtg-sets/2008-2016/tests/build/test-results/test \
            -name 'TEST-*SagesRowDenizenScenarioTest.xml' \
            -exec sed -n '1,260p' {} \;
          exit "$status"

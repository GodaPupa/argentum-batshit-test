name: Manual exact composition and unchanged registry qualification
permissions:
  contents: write
concurrency:
  group: validation/manual-exact-composition-v2-20261003
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GRADLE_LOCK_SLOTS: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxMetaspaceSize=768m
      OUT: /tmp/manual-composition-${{ github.run_id }}
      MT_P2_AUDIT_INPUT: /tmp/manual-composition-${{ github.run_id }}/registry-requests.json
      MT_P2_AUDIT_OUTPUT: /tmp/manual-composition-${{ github.run_id }}/registry
    steps:
    - uses: actions/checkout@v6
      with:
        ref: c1a2f4e8b5ca900518b4ca47cda58ff346dc43fa
        fetch-depth: 1
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v6
    - name: Prepare exact source-only candidate without workflow ancestry
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$OUT"
        python3 - <<'PYCODE'
        import base64,hashlib,json,os,pathlib,subprocess
        def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
        parent='c1a2f4e8b5ca900518b4ca47cda58ff346dc43fa'
        branch='candidate/manual-exact-composition-v2-20261003'
        live='refs/heads/manual/whole-pilot-runner-replay-freeze-20260930'
        assert git('rev-parse','HEAD')==parent
        assert git('ls-remote','origin',live).split()[0]=='b01e312106011af2aa904e7c70438df7620d5e0c','live Manual changed'
        assert not git('ls-remote','origin','refs/heads/'+branch),'candidate already exists'
        expected={'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/targeting/PlayerColorHexproof.kt': '9a6432a978f6b0fc1284d758f3e63d8ae801b63b', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/targeting/TargetValidator.kt': 'dad3c54d7781f6383afeeb16d9ec9c764d0d48d9', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt': 'addfc4453e73a4745d8290b517eb7bf090474b1d', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/TargetFinder.kt': 'e3e7850f0313c6cc0a4e29a516bf62aeca38f654', 'rules-engine/src/main/kotlin/com/wingedsheep/engine/legalactions/utils/TargetEnumerationUtils.kt': '750751d9cf0e31e69c35785443430aab0fac5c96', 'rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/FixedColorHexproofScenarioTest.kt': 'df81a8a3fc374dc2005b1aacf68e8124e78d7ef3', 'mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/m20/cards/VeilOfSummer.kt': '127438babd92bb2d9c1f3cc1989afab2394fdbe0'}
        patch=base64.b64decode('',validate=True)
        subprocess.run(['git','apply','--index','-'],input=patch,check=True)
        assert git('diff','--cached','--name-only').splitlines()==sorted(expected)
        for p,b in expected.items(): assert git('hash-object',p)==b,p
        tree=git('write-tree')
        env=dict(os.environ,GIT_AUTHOR_NAME='Argentum source preparation',GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com',GIT_COMMITTER_NAME='Argentum source preparation',GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
        source=subprocess.check_output(['git','commit-tree',tree,'-p',parent,'-m','Compose qualified Manual mechanics and exact card definitions'],text=True,env=env).strip()
        assert git('ls-remote','origin',live).split()[0]=='b01e312106011af2aa904e7c70438df7620d5e0c','live Manual changed before publication'
        subprocess.run(['git','push','origin',source+':refs/heads/'+branch],check=True)
        subprocess.run(['git','checkout','--detach',source],check=True)
        assert git('rev-parse','HEAD^')==parent
        assert not git('status','--porcelain')
        binding={'source_head':source,'source_tree':tree,'parent_source_head':parent,'validation_head':os.environ['GITHUB_SHA'],'source_git_blobs':expected,'source_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in expected},'scope':'EXCLUDED_EXACT_MANUAL_COMPOSITION','official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}}
        (pathlib.Path(os.environ['OUT'])/'source-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
        print('SOURCE_ONLY_COMMIT='+source)
        helper='gym/src/test/kotlin/com/wingedsheep/gym/ManualTransmissionPhaseTwoRegistryAuditTest.kt'
        assert git('hash-object',helper)=='28a52995671550d87fba5f35d6b100a31fa23848'
        frozen=base64.b64decode('',validate=True)
        assert hashlib.sha256(frozen).hexdigest()=='09b8617057b9bd42fb6501f993588c9bf769e1f0af0c73426ca963da07d20084'
        out=pathlib.Path(os.environ['OUT']);(out/'registry-requests.json').write_bytes(frozen)
        (out/'baseline-resolved-bits.json').write_text(json.dumps({'manual-transmission-v07': '1111111111111111111111111111010111101111111111011111011111111111101111111111111111111111111111111111', 'blue-farm': '0001111110111011101001001111010011010101110101110100010110101011111101100100110000111101011101111111', 'rogsi': '0001111110111101110101000011110101101010000111100101101001101010011011011011001011110111110110110010', 'kinnan': '1111111110111110100011011110010100001010110100110011110000001110101011011010011101011010101010110111', 'sisay': '0110111011111110110100001100000010101010101111100111011001110100001111111100011101001111000110111111', 'magda': '0111101010101000101001110011000100100100101111011001111111000001010101101001101100001011000101001101', 'hashaton': '0101011101110000001010010001001000111101001111000110100010100000001101100110111000101011111100111011', 'shorikai': '1101111100111101010101100100101000100110011111110001011000011011011110100100100011110011110011011010'},indent=2)+'\n')

        PYCODE
    - name: Run exact composition and unchanged registry inventory
      shell: bash
      run: |
        set -uo pipefail
        set +e
        bash scripts/gradle-locked --no-daemon --no-configuration-cache --console=plain --continue --max-workers=1 -PkotlinCompileParallelism=1 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx4g :rules-engine:test --tests com.wingedsheep.engine.mechanics.mana.PhyrexianAbilityPaymentTest --tests com.wingedsheep.engine.mechanics.targeting.AnnouncedSpliceGroupsTest --tests com.wingedsheep.engine.mechanics.targeting.AnnouncedTargetGroupsTest --tests com.wingedsheep.engine.mechanics.targeting.FixedDestinationEffectTest --tests com.wingedsheep.engine.mechanics.targeting.FixedDestinationRetargetTest --tests com.wingedsheep.engine.mechanics.targeting.RetargetVisitIdentityDiagnosticTest --tests com.wingedsheep.engine.mechanics.targeting.TargetGroupProducerIntegrationTest --tests com.wingedsheep.engine.mechanics.targeting.TargetVisitResolutionTest --tests com.wingedsheep.engine.scenarios.SpellskiteScenarioTest --tests com.wingedsheep.engine.triggers.RetargetStructureBoundaryTest --tests com.wingedsheep.engine.scenarios.FixedColorHexproofScenarioTest :mtg-sets:2008-2016:tests:test --tests com.wingedsheep.engine.scenarios.SpellskiteCardScenarioTest :mtg-sets:2017-2022:tests:test --tests com.wingedsheep.engine.scenarios.VeilOfSummerScenarioTest :gym:test --tests com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest :mtg-sets:test --tests '*CardDefinitionSnapshotTest.NPH*' --tests '*CardDefinitionSnapshotTest.M20*' 2>&1 | tee "$OUT/qualification.log"
        rc=${PIPESTATUS[0]}
        printf '%s\n' "$rc" > "$OUT/gradle-exit-code.txt"
        exit "$rc"
      env:
        UPDATE_SNAPSHOTS: '1'
    - name: Preserve scoped snapshot outputs and reject unrelated changes
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$OUT/snapshots"
        cp mtg-sets/src/test/resources/snapshots/cards/{NPH,M20}.json "$OUT/snapshots/"
        python3 - <<'PYCODE'
        import pathlib,json,subprocess,re,os
        out=pathlib.Path(os.environ['OUT']);delta={}
        def cards(s):return {b.split('\n',1)[0]:b.split('\n',1)[1].strip() for b in re.split(r'^// ',s,flags=re.M)[1:]}
        for code in ['NPH','M20']:
         path='mtg-sets/src/test/resources/snapshots/cards/'+code+'.json'
         before=cards(subprocess.check_output(['git','show','HEAD:'+path],text=True));after=cards(pathlib.Path(path).read_text())
         delta[code]={'added':sorted(after.keys()-before.keys()),'removed':sorted(before.keys()-after.keys()),'changed':sorted(n for n in before.keys()&after.keys() if before[n]!=after[n])}
        (out/'snapshot-delta.json').write_text(json.dumps(delta,indent=2)+'\n')
        assert delta=={'NPH':{'added':['Spellskite'],'removed':[],'changed':[]},'M20':{'added':['Veil of Summer'],'removed':[],'changed':[]}},delta
        PYCODE
    - name: Audit actual cases and exact inventory delta
      if: always()
      shell: bash
      run: |
        python3 - <<'PYCODE'
        import pathlib,os,json,hashlib,shutil,xml.etree.ElementTree as ET
        out=pathlib.Path(os.environ['OUT']);out.mkdir(parents=True,exist_ok=True)
        expected={'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.mechanics.mana.PhyrexianAbilityPaymentTest.xml': 8, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.mechanics.targeting.AnnouncedSpliceGroupsTest.xml': 1, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.mechanics.targeting.AnnouncedTargetGroupsTest.xml': 5, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.mechanics.targeting.FixedDestinationEffectTest.xml': 2, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.mechanics.targeting.FixedDestinationRetargetTest.xml': 14, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.mechanics.targeting.RetargetVisitIdentityDiagnosticTest.xml': 1, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.mechanics.targeting.TargetGroupProducerIntegrationTest.xml': 6, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.mechanics.targeting.TargetVisitResolutionTest.xml': 11, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.SpellskiteScenarioTest.xml': 6, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.triggers.RetargetStructureBoundaryTest.xml': 7, 'rules-engine/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.FixedColorHexproofScenarioTest.xml': 18, 'mtg-sets/2008-2016/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.SpellskiteCardScenarioTest.xml': 10, 'mtg-sets/2017-2022/tests/build/test-results/test/TEST-com.wingedsheep.engine.scenarios.VeilOfSummerScenarioTest.xml': 15, 'gym/build/test-results/test/TEST-com.wingedsheep.gym.ManualTransmissionPhaseTwoRegistryAuditTest.xml': 1, 'mtg-sets/build/test-results/test/TEST-com.wingedsheep.mtg.sets.CardDefinitionSnapshotTest.xml': 4}
        rows=[]
        for name,count in expected.items():
         p=pathlib.Path(name);cases=[]
         if p.exists():
          dest=out/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
          cases=[{'name':c.attrib['name'],'failure':c.find('failure') is not None,'error':c.find('error') is not None,'skipped':c.find('skipped') is not None} for c in ET.parse(p).getroot().findall('testcase')]
         rows.append({'path':name,'expected':count,'cases':cases})
        (out/'actual-cases.json').write_text(json.dumps(rows,indent=2)+'\n')
        # Write digests before assertions so failure evidence remains auditable.
        def digest():
         (out/'evidence-sha256.json').write_text(json.dumps({str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file() and p.name!='evidence-sha256.json'},indent=2)+'\n')
        digest()
        assert all(len(r['cases'])==r['expected'] and len({c['name'] for c in r['cases']})==r['expected'] for r in rows),rows
        assert not any(c['failure'] or c['error'] or c['skipped'] for r in rows for c in r['cases']),rows
        assert (out/'gradle-exit-code.txt').read_text().strip()=='0'
        request=json.loads((out/'registry-requests.json').read_text());report=json.loads((out/'registry/registry-report.json').read_text());baseline=json.loads((out/'baseline-resolved-bits.json').read_text())
        assert report['status']=='INVENTORY_ONLY_NOT_RULES_OR_PILOT_QUALIFICATION' and report['execution_allowed'] is False
        assert report['actual_deck_games_initialized']==report['official_outcomes']==0
        assert len(report['decks'])==len(request['decks'])==8
        admissions=['Spellskite', 'Veil of Summer']
        deltas=[];summary={}
        for frozen,deck in zip(request['decks'],report['decks']):
         assert deck['deck_id']==frozen['id']
         names=frozen['commanders']+frozen['mainboard'];assert deck['physical_cards']==len(deck['cards'])==len(names)==100
         assert deck['commander_count']==len(frozen['commanders'])
         for index,(name,card) in enumerate(zip(names,deck['cards'])):
          assert card['index']==index and card['requested_name']==name and card['rules_qualified'] is False
          previous=baseline[deck['deck_id']][index]=='1';expected=previous or name in admissions
          assert card['registry_resolved']==expected,(deck['deck_id'],name,expected,card)
          if card['registry_resolved']!=previous:deltas.append([deck['deck_id'],index,name,previous,card['registry_resolved']])
         missing=[c['requested_name'] for c in deck['cards'] if not c['registry_resolved']]
         summary[deck['deck_id']]={'resolved':100-len(missing),'missing':missing}
        assert summary['manual-transmission-v07']['resolved']==94+len(admissions)
        (out/'registry-summary.json').write_text(json.dumps({'decks':summary,'only_registry_delta':deltas,'official_counters_delta':{'allocations':0,'claims':0,'games':0,'outcomes':0}},indent=2)+'\n');digest()
        PYCODE
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: manual-composition-${{ github.run_id }}
        path: ${{ env.OUT }}/
        if-no-files-found: error
        retention-days: 90
'on':
  push:
    branches:
    - validation/manual-exact-composition-v2-20261003
    paths:
    - .github/workflows/manual-exact-composition-v2-20261003.yml

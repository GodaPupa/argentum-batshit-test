name: Pest Control Tier-1 Grixis Composed VALIDATE_ONLY

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - gym/src/test/kotlin/com/wingedsheep/gym/PestControlTierOneGrixisComposedValidationTest.kt
      - .github/workflows/pest-control-tier-one-grixis-composed-validate.yml

permissions:
  actions: read
  contents: read

jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Download exact frozen Grixis artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/pest-grixis-official-input
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10620940806/zip" \
            -o build/pest-grixis-official-freeze.zip
          echo "88b5e99d7aab2065fb26d51c074478d43310209d45b084d9dcfe552e8c328373  build/pest-grixis-official-freeze.zip" | sha256sum -c -
          unzip -q build/pest-grixis-official-freeze.zip -d build/pest-grixis-official-input
          cd build/pest-grixis-official-input
          sha256sum -c artifacts.sha256

      - name: Validate full composed path without official gameplay
        env:
          PEST_GRIXIS_COMPOSED_MODE: VALIDATE_ONLY
          PEST_GRIXIS_EXECUTION_INPUT_ACK: LOAD_FROZEN_TIER_ONE_GRIXIS_4_FOR_VALIDATION_ONLY
          PEST_GRIXIS_EXECUTION_INPUT_DIR: ${{ github.workspace }}/build/pest-grixis-official-input
          PEST_GRIXIS_COMPOSED_OUTPUT_DIR: ${{ github.workspace }}/build/reports/pest-control-tier-one-grixis-composed-validation
          PEST_GRIXIS_COMPOSED_EXECUTION_COMMIT: ${{ github.sha }}
        run: scripts/test-class PestControlTierOneGrixisComposedValidationTest --info --stacktrace

      - name: Upload composed validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-control-tier-one-grixis-composed-validation-${{ github.run_id }}
          path: build/reports/pest-control-tier-one-grixis-composed-validation/
          if-no-files-found: error
          retention-days: 30

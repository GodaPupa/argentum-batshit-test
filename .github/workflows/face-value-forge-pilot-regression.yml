name: Face Value Forge Pilot Regression

on:
  push:
    branches: [face-value/lab]
    paths: [.github/workflows/face-value-forge-pilot-regression.yml]

permissions:
  contents: read

jobs:
  pilot-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone Forge and patch Face Value AI
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Card-Forge/forge.git forge-src
          git -C forge-src rev-parse HEAD | tee forge-source-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          energy=Path('forge-src/forge-gui/res/cardsfolder/e/energy_tap.txt')
          text=energy.read_text()
          old="A:SP$ Tap | TgtPrompt$ Select target untapped creature you control | ValidTgts$ Creature.untapped+YouCtrl | SubAbility$ DBMana | SpellDescription$ Tap target untapped creature you control. If you do, add an amount of {C} equal to that creature's mana value."
          new="A:SP$ Tap | TgtPrompt$ Select target untapped creature you control | ValidTgts$ Creature.untapped+YouCtrl | AILogic$ EnergyTap | SubAbility$ DBMana | SpellDescription$ Tap target untapped creature you control. If you do, add an amount of {C} equal to that creature's mana value."
          assert old in text
          energy.write_text(text.replace(old,new).replace('\nAI:RemoveDeck:All',''))

          tap=Path('forge-src/forge-ai/src/main/java/forge/ai/ability/TapAi.java')
          src=tap.read_text()
          needle='        final Player turn = phase.getPlayerTurn();\n\n'
          assert needle in src
          lines=[
            '        final Player turn = phase.getPlayerTurn();',
            '',
            '        if ("EnergyTap".equals(sa.getParamOrDefault("AILogic", ""))) {',
            '            if (!phase.is(PhaseType.MAIN2, ai)) {',
            '                return new AiAbilityDecision(0, AiPlayDecision.WaitForMain2);',
            '            }',
            '            boolean hasFollowup = ai.getCardsIn(ZoneType.Hand).stream().anyMatch(c ->',
            '                    "Wretched Gryff".equals(c.getName()) ||',
            '                    "Drownyard Lurker".equals(c.getName()) ||',
            '                    "It of the Horrid Swarm".equals(c.getName()));',
            '            if (!hasFollowup) {',
            '                return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);',
            '            }',
            '            CardCollection candidates = CardLists.getTargetableCards(ai.getCreaturesInPlay(), sa);',
            '            candidates = CardLists.filter(candidates, CardPredicates.CAN_TAP);',
            '            Card choice = ComputerUtilCard.getMostExpensivePermanentAI(candidates);',
            '            if (choice == null || choice.getCMC() < 7) {',
            '                return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);',
            '            }',
            '            sa.resetTargets();',
            '            sa.getTargets().add(choice);',
            '            return new AiAbilityDecision(100, AiPlayDecision.WillPlay);',
            '        }',
            ''
          ]
          tap.write_text(src.replace(needle,'\n'.join(lines),1))

          rush=Path('forge-src/forge-gui/res/cardsfolder/r/rush_of_knowledge.txt')
          rt=rush.read_text()
          rold='A:SP$ Draw | Defined$ You | NumCards$ X | SpellDescription$ Draw cards equal to the highest mana value among permanents you control.'
          rnew='A:SP$ Draw | Defined$ You | NumCards$ X | AILogic$ FaceValueRush | SpellDescription$ Draw cards equal to the highest mana value among permanents you control.'
          assert rold in rt
          rush.write_text(rt.replace(rold,rnew))

          draw=Path('forge-src/forge-ai/src/main/java/forge/ai/ability/DrawAi.java')
          ds=draw.read_text()
          dneedle='        boolean aboutToBeMyTurn = ph.getNextTurn().equals(ai) && ph.is(PhaseType.END_OF_TURN);\n\n'
          assert dneedle in ds
          dlines=[
            '        boolean aboutToBeMyTurn = ph.getNextTurn().equals(ai) && ph.is(PhaseType.END_OF_TURN);',
            '',
            '        if ("FaceValueRush".equals(sa.getParamOrDefault("AILogic", ""))) {',
            '            int highest = ai.getCardsIn(ZoneType.Battlefield).stream().mapToInt(Card::getCMC).max().orElse(0);',
            '            if (highest < 7) {',
            '                return new AiAbilityDecision(0, AiPlayDecision.CantPlayAi);',
            '            }',
            '        }',
            ''
          ]
          draw.write_text(ds.replace(dneedle,'\n'.join(dlines),1))
          PY
          git -C forge-src diff -- forge-gui/res/cardsfolder/e/energy_tap.txt forge-ai/src/main/java/forge/ai/ability/TapAi.java forge-gui/res/cardsfolder/r/rush_of_knowledge.txt forge-ai/src/main/java/forge/ai/ability/DrawAi.java > forge-pilot-regression.patch

      - name: Build patched Forge
        run: |
          set -euxo pipefail
          cd forge-src
          mvn -B -DskipTests -pl forge-gui-desktop -am package
          chmod +x forge-gui-desktop/target/forge.sh
          rm -rf forge-gui-desktop/target/res
          cp -R forge-gui/res forge-gui-desktop/target/res
          echo "FORGE_LAUNCHER=$(pwd)/forge-gui-desktop/target/forge.sh" >> "$GITHUB_ENV"

      - name: Install frozen decks
        run: |
          mkdir -p "$HOME/.forge/decks/constructed" decks
          cat > "decks/Face Value v0.7.dck" <<'EOF'
          [metadata]
          Name=Face Value v0.7
          Deck Type=constructed
          [main]
          4 Llanowar Elves
          4 Nest Invader
          4 Eldrazi Repurposer
          1 Eyeless Watcher
          4 Wretched Gryff
          2 It of the Horrid Swarm
          2 Annoyed Altisaur
          1 Drownyard Lurker
          1 Nyxborn Hydra
          4 Malevolent Rumble
          3 Energy Tap
          2 Rush of Knowledge
          4 Preordain
          2 Snap
          1 Lose Focus
          1 Tamiyo's Safekeeping
          8 Forest
          8 Island
          4 Tangled Islet
          EOF
          cat > "decks/Muril0Ambra Mono Red Madness 2026-09-12.dck" <<'EOF'
          [metadata]
          Name=Muril0Ambra Mono Red Madness 2026-09-12
          Deck Type=constructed
          [main]
          4 Voldaren Epicure
          4 Kessig Flamebreather
          4 Sneaky Snacker
          3 Guttersnipe
          4 Faithless Looting
          4 Grab the Prize
          4 Highway Robbery
          4 Lava Dart
          4 Lightning Bolt
          4 Fiery Temper
          3 Fireblast
          18 Mountain
          EOF
          cp decks/*.dck "$HOME/.forge/decks/constructed/"

      - name: Run 10 diagnostic pilot seeds
        run: |
          set -euo pipefail
          mkdir logs
          : > pilot-combined.log
          for seed in $(seq 915001 915010); do
            echo "===== SEED $seed =====" | tee -a pilot-combined.log
            "$FORGE_LAUNCHER" sim -d "Face Value v0.7.dck" "Muril0Ambra Mono Red Madness 2026-09-12.dck" -n 1 -s "$seed" -c 60 2>&1 | tee "logs/$seed.log" | tee -a pilot-combined.log
          done

      - name: Audit pilot regression
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          rec=[]
          for p in sorted(Path('logs').glob('*.log')):
            text=p.read_text(errors='replace')
            taps=list(re.finditer(r'Add To Stack: Ai\(1\)-Face Value v0\.7 cast Energy Tap targeting',text))
            productive=0
            for m in taps:
              end=text.find("Phase: Ai(1)-Face Value v0.7's End step",m.end())
              seg=text[m.end():end if end!=-1 else m.end()+2500]
              if re.search(r'Add To Stack: Ai\(1\)-Face Value v0\.7 cast (Wretched Gryff|Drownyard Lurker|It of the Horrid Swarm)',seg): productive+=1
            rec.append({'seed':int(p.stem),'taps':len(taps),'productive_taps':productive,'rush':len(re.findall(r'cast Rush of Knowledge',text)),'exceptions':bool(re.search(r'Exception|StackOverflowError|Stopping slow match as draw',text))})
          summary={'games':len(rec),'energy_tap_casts':sum(x['taps'] for x in rec),'productive_energy_taps':sum(x['productive_taps'] for x in rec),'rush_casts':sum(x['rush'] for x in rec),'engine_exceptions':sum(x['exceptions'] for x in rec)}
          Path('pilot-records.json').write_text(json.dumps(rec,indent=2,sort_keys=True))
          Path('pilot-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Preserve pilot regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-value-forge-pilot-regression
          path: |
            pilot-combined.log
            pilot-records.json
            pilot-summary.json
            logs/*.log
            forge-pilot-regression.patch
            forge-source-commit.txt
            decks/*.dck
          if-no-files-found: warn

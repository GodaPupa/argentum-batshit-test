name: Manual Precision R9 colorless and restricted X heldouts (NO GAMES)
on:
  push:
    branches: [research/manual-precision-r9-colorless-restricted-x-heldout-20261020]
    paths:
      - '.github/workflows/manual-precision-r9-colorless-restricted-x-heldout-20261020.yml'
      - 'mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9ColorlessRestrictedXHeldoutTest.kt'
permissions:
  contents: read
concurrency:
  group: manual-precision-r9-colorless-restricted-x-heldout
  cancel-in-progress: false
jobs:
  strict-colorless-and-restricted-x:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 32}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Pin immutable GREEN source witness-only delta and zero games
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r9-colorless-x-heldout
          test "$GITHUB_REF" = "refs/heads/research/manual-precision-r9-colorless-restricted-x-heldout-20261020"
          git rev-parse HEAD > r9-colorless-x-heldout/source-sha.txt
          git rev-parse HEAD^{tree} > r9-colorless-x-heldout/tree-sha.txt
          git merge-base --is-ancestor b943528be65975003be79aadd0081faa3fc2aee3 HEAD
          git diff --name-only b943528be65975003be79aadd0081faa3fc2aee3 HEAD > r9-colorless-x-heldout/delta-paths.txt
          test "$(wc -l < r9-colorless-x-heldout/delta-paths.txt)" -eq 2
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/manual-precision-r9-colorless-restricted-x-heldout-20261020.yml|mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9ColorlessRestrictedXHeldoutTest.kt) ;;
              *) echo "UNAUTHORIZED_DELTA:$file"; exit 1 ;;
            esac
          done < r9-colorless-x-heldout/delta-paths.txt
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaSolver.kt)" = "b44eec7a1b159989007b315f9c4547ed9c1e5b1c"
          test "$(git rev-parse HEAD:rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/mana/ManaAbilitySideEffectExecutor.kt)" = "e34ab8703aeace3dd7930c8222c1937237a08b05"
          test "$(git rev-parse HEAD:mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9ProvenanceHardeningWitnessesTest.kt)" = "34e336056c0fee43d9849c1a1791fcf902f68e2f"
          test "$(git rev-parse HEAD:mtg-sets/2008-2016/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/ManualPrecisionR9GenericActivationCostHeldoutTest.kt)" = "07c25714d2c393d1e1e91e8a61dee96057cccf28"
          test "$(git rev-parse HEAD:experiments/manual-transmission/control/v0.7.decklist.txt)" = "c350bdc86eb2d37e5da4eb712e8ee2fa729b7e89"
          test "$(git rev-parse HEAD:experiments/manual-transmission/research/precision-upgrade-20261020/CHALLENGER-A.mana.decklist.txt)" = "7984a2e87d8ddbe023d45620414d25a61691a040"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/AiProfile.kt)" = "180918b2d7a59309e7b0617f2579fb2a6d06b7d5"
          test "$(git rev-parse HEAD:ai/src/main/kotlin/com/wingedsheep/ai/engine/ManualTransmissionR5Candidate.kt)" = "ef5ba9dacb02bbf2a00303c9ee4724565769385a"
          echo ZERO_FULL_GAMES > r9-colorless-x-heldout/budget.txt
          chmod +x gradlew scripts/gradle-locked
      - name: Original five strict colorless and restricted X witnesses and controls
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:2008-2016:tests:cleanTest :mtg-sets:2008-2016:tests:test \
            --tests '*ManualPrecisionR9ColorlessRestrictedXHeldoutTest' \
            -Dbenchmark=true --no-build-cache --no-daemon --console=plain --stacktrace \
            2>&1 | tee r9-colorless-x-heldout/witnesses.log
      - name: Preserve original JUnit source and logs on GREEN or RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-precision-r9-colorless-x-heldout-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            r9-colorless-x-heldout/
            mtg-sets/2008-2016/tests/build/test-results/test/

name: Manual Disciple primitive diagnostic R2
on:
  push:
    branches: [validation/manual-disciple-primitives-diagnostic-r2-20261031]
    paths: ['.github/workflows/manual-disciple-primitives-diagnostic-r2-20261031.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: a3355618c4de98681be19d6bd04df7bc9a54b271
  SOURCE_TREE: a011d9fb843c713314f856cbd10340034d13a1f7
  WORKFLOW: .github/workflows/manual-disciple-primitives-diagnostic-r2-20261031.yml
  RECORD: experiments/manual-transmission/research/disciple-freyalise-primitives-diagnostic-r2-20261031
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web-client/package-lock.json}
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile every diagnostic form before original behavioral observations
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-disciple-primitives-diagnostic-r2-${{ github.run_id }}
          path: manual-disciple-primitives-diagnostic-r2-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

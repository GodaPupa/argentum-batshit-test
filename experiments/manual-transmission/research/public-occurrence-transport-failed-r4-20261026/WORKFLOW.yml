name: Manual public occurrence transport early R4
on:
  push:
    branches: [validation/manual-public-occurrence-transport-r4-20261026]
    paths: ['.github/workflows/manual-public-occurrence-transport-r4-20261026.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: 4c8d4b81ecc6e6fbf431d743be7ff87702f905a1
  SOURCE_TREE: d2c3ffef9865733289c0fbb63e6054a28efc3637
  WORKFLOW: .github/workflows/manual-public-occurrence-transport-r4-20261026.yml
  RECORD: experiments/manual-transmission/research/public-occurrence-transport-qualification-r4-20261026
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: '1'
jobs:
  verify:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install approved locked recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p "$HOME/.cache/argentum"
      - name: Compile all source forms then execute exact transport controls and restore
        run: flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" python3 "$RECORD/run.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-public-occurrence-transport-r4-${{ github.run_id }}
          path: manual-public-occurrence-transport-r4-evidence/
          include-hidden-files: true
          if-no-files-found: error

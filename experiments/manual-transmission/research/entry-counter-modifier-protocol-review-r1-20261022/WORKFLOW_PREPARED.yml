name: Manual entry-counter-modifier boundary qualification
on:
  push:
    branches: [validation/manual-entry-counter-modifier-r1-20261022]
    paths: ['.github/workflows/manual-entry-counter-modifier-r1-20261022.yml']
permissions: {contents: read}
concurrency:
  group: manual-transmission-engine-qualification
  cancel-in-progress: false
env:
  SOURCE: COUNTER_MODIFIER_SOURCE_SHA_PENDING
  BASELINE: c486fe51a3cecc4ebde845371242c791839f1954
  RECORD: experiments/manual-transmission/research/entry-counter-modifier-r1-20261022
  WORKFLOW: .github/workflows/manual-entry-counter-modifier-r1-20261022.yml
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_LOCK_SLOTS: "1"
jobs:
  verify:
    if: github.run_number == '1' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install recipe runner
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          command -v flock
          mkdir -p entry-counter-modifier-evidence/toolchain
          flock --version > entry-counter-modifier-evidence/toolchain/flock-version.txt
          mkdir -p "$HOME/.cache/argentum"
          flock -x "$HOME/.cache/argentum/manual-transmission.lock" bash -c 'if flock -n "$1" true; then exit 1; fi' _ "$HOME/.cache/argentum/manual-transmission.lock"
      - name: Bind candidate, protected tests, deck, locks and goldens
        run: |
          git cat-file -e "$BASELINE^{tree}"
          python3 "$RECORD/bind.py"
      - name: Run16 original baseline controls against qualified entry-observer source
        id: negative
        run: |
          mkdir -p entry-counter-modifier-evidence/negative
          RESTORE_MODE=baseline python3 "$RECORD/restore.py"
          BIND_MODE=negative python3 "$RECORD/bind.py"
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" negative 2>&1 | tee entry-counter-modifier-evidence/negative/gradle.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > entry-counter-modifier-evidence/negative/exit.txt
          exit 0
      - name: Require8 preregistered assertion failures and8 passing controls
        if: always() && steps.negative.outcome != 'skipped'
        env: {STAGE: negative}
        run: python3 "$RECORD/collect.py"
      - name: Restore and rebind exactly the candidate source
        if: always()
        run: |
          RESTORE_MODE=candidate python3 "$RECORD/restore.py"
          python3 "$RECORD/bind.py"
      - name: 561 focused cases including original counter, object-identity and observer regressions
        id: focused
        run: |
          mkdir -p entry-counter-modifier-evidence/focused
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" focused 2>&1 | tee entry-counter-modifier-evidence/focused/gradle.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > entry-counter-modifier-evidence/focused/exit.txt
          exit "$rc"
      - name: Receive focused original reports
        if: always() && steps.focused.outcome != 'skipped'
        env: {STAGE: focused}
        run: python3 "$RECORD/collect.py"
      - name: Complete engine and all nine card-era scenario suites
        id: broad
        run: |
          mkdir -p entry-counter-modifier-evidence/broad
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" broad 2>&1 | tee entry-counter-modifier-evidence/broad/gradle.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > entry-counter-modifier-evidence/broad/exit.txt
          exit "$rc"
      - name: Receive every broad report
        if: always() && steps.broad.outcome != 'skipped'
        env: {STAGE: broad}
        run: python3 "$RECORD/collect.py"
      - name: Ordinary whole-project build with routine AI tests
        id: ordinary
        run: |
          mkdir -p entry-counter-modifier-evidence/ordinary
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" ordinary 2>&1 | tee entry-counter-modifier-evidence/ordinary/gradle.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > entry-counter-modifier-evidence/ordinary/exit.txt
          exit "$rc"
      - name: Receive ordinary results and require exact baseline skips
        if: always() && steps.ordinary.outcome != 'skipped'
        env: {STAGE: ordinary}
        run: python3 "$RECORD/collect.py"
      - name: Build candidate Assay CLI
        run: |
          mkdir -p entry-counter-modifier-evidence/assay
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" assay-build 2>&1 | tee entry-counter-modifier-evidence/assay/build.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > entry-counter-modifier-evidence/assay/build-exit.txt
          exit "$rc"
      - name: Assay 2000-card touchstone and corpus identity
        run: |
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" assay 2>&1 | tee entry-counter-modifier-evidence/assay/gate.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > entry-counter-modifier-evidence/assay/gate-exit.txt
          capture_rc=0
          if test -f "$HOME/.cache/scryfall/_bulk-oracle-cards.jsonl.gz"; then
            sha256sum "$HOME/.cache/scryfall/_bulk-oracle-cards.jsonl.gz" > entry-counter-modifier-evidence/assay/oracle-bulk-sha256.txt || capture_rc=1
            wc -c "$HOME/.cache/scryfall/_bulk-oracle-cards.jsonl.gz" > entry-counter-modifier-evidence/assay/oracle-bulk-bytes.txt || capture_rc=1
            cp "$HOME/.cache/scryfall/_bulk-oracle-cards.jsonl.gz" entry-counter-modifier-evidence/assay/oracle-bulk-corpus.jsonl.gz || capture_rc=1
          else
            capture_rc=1
          fi
          echo "$capture_rc" > entry-counter-modifier-evidence/assay/corpus-capture-exit.txt
          if test "$capture_rc" != 0; then exit "$capture_rc"; fi
          exit "$rc"
      - name: Preserve full golden differential for classification
        run: |
          set +e
          flock -x -w 1800 "$HOME/.cache/argentum/manual-transmission.lock" just --working-directory "$GITHUB_WORKSPACE" --justfile "$RECORD/validation.just" assay-differential 2>&1 | tee entry-counter-modifier-evidence/assay/differential.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > entry-counter-modifier-evidence/assay/differential-exit.txt
          exit "$rc"
      - name: Recheck all source and safeguards
        if: always()
        run: python3 "$RECORD/bind.py"
      - name: Hash complete evidence inventory
        if: always()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib
          out=Path('entry-counter-modifier-evidence');out.mkdir(exist_ok=True)
          manifest=out/'SHA256SUMS'
          manifest.write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(out))+'\n' for p in sorted(out.rglob('*')) if p.is_file() and p != manifest))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-entry-counter-modifier-${{ github.run_id }}
          path: entry-counter-modifier-evidence/
          retention-days: 90
          if-no-files-found: error
